<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0a1226;
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;color:#eaf1ff;
    -webkit-user-select:none;user-select:none;
  }
  #app{position:fixed;inset:0;overflow:hidden;background:#0a1226}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------------- HUD ---------------- */
  .hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;gap:16px}

  .brand h1{
    font-size:clamp(17px,2.1vw,25px);font-weight:800;letter-spacing:.04em;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35);
  }
  .brand p{
    font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:4px;
    color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.5);
  }

  .gauges{display:flex;gap:10px;pointer-events:auto}
  .gauge{
    background:rgba(10,18,34,.55);border:1px solid rgba(255,255,255,.16);border-radius:14px;
    padding:9px 14px 10px;min-width:136px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 26px rgba(0,0,0,.22);
  }
  .gauge .lbl{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;
    display:flex;justify-content:space-between;gap:10px;margin-bottom:7px;font-weight:600;
  }
  .gauge .lbl b{font-weight:800;opacity:.98;font-variant-numeric:tabular-nums}
  .track{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .track i{display:block;height:100%;width:50%;border-radius:99px;transition:width .09s linear}
  #energyFill{background:linear-gradient(90deg,#8df0a2,#2fd06f)}
  #energyFill.low{background:linear-gradient(90deg,#ffb36b,#ff5f5f)}
  #speedFill{background:linear-gradient(90deg,#7cc7ff,#b98bff)}

  .bottom{display:flex;justify-content:center;padding:0 20px 22px}
  .dock{
    pointer-events:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;
    background:rgba(10,18,34,.6);border:1px solid rgba(255,255,255,.16);border-radius:20px;
    padding:12px 14px;max-width:min(1000px,96vw);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 16px 44px rgba(0,0,0,.3);
  }

  .speedctl{
    display:flex;align-items:center;gap:10px;padding-right:12px;margin-right:3px;
    border-right:1px solid rgba(255,255,255,.14);
  }
  .speedctl span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:700}

  input[type=range]{
    -webkit-appearance:none;appearance:none;width:116px;height:6px;border-radius:99px;
    background:linear-gradient(90deg,#8bd4ff,#b98bff);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
    border:3px solid #6b8cff;box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #6b8cff;cursor:pointer;
  }

  .btn{
    font:inherit;font-size:13px;font-weight:700;color:#eaf1ff;cursor:pointer;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:12px;
    padding:9px 14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
    transition:transform .16s cubic-bezier(.2,.9,.3,1.5),background .16s,border-color .16s,box-shadow .16s;
  }
  .btn:hover{background:rgba(255,255,255,.19);transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.96)}
  .btn.bell{
    background:linear-gradient(180deg,#ffe07a,#f5b431);border-color:#ffe9a8;color:#402a00;
    box-shadow:0 6px 18px rgba(245,180,49,.35);
  }
  .btn.bell:hover{box-shadow:0 10px 26px rgba(245,180,49,.5)}
  .btn.active{background:rgba(126,231,135,.28);border-color:rgba(126,231,135,.6);color:#d8ffe2}
  .btn:focus-visible{outline:2px solid #8bc4ff;outline-offset:2px}

  .toast{
    position:absolute;left:50%;top:96px;transform:translate(-50%,-14px);opacity:0;
    background:rgba(10,18,34,.85);border:1px solid rgba(255,255,255,.2);color:#eaf1ff;
    padding:9px 20px;border-radius:99px;font-size:13px;font-weight:700;pointer-events:none;
    transition:opacity .26s,transform .26s;backdrop-filter:blur(10px);white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:720px){
    .gauges{flex-direction:column}
    .gauge{min-width:120px;padding:7px 11px}
    .dock{gap:7px;padding:10px}
    .btn{font-size:12px;padding:8px 11px}
    .speedctl span{display:none}
    input[type=range]{width:82px}
  }
</style>
</head>
<body>
<div id="app">
  <svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyA" offset="0%" stop-color="#6fc3f0"/>
        <stop id="skyB" offset="52%" stop-color="#bfe6ff"/>
        <stop id="skyC" offset="100%" stop-color="#ffe6c4"/>
      </linearGradient>
      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="seaA" offset="0%" stop-color="#63bcdd"/>
        <stop id="seaB" offset="100%" stop-color="#2b7ba6"/>
      </linearGradient>
      <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
        <stop id="deckA" offset="0%" stop-color="#d6a879"/>
        <stop id="deckB" offset="100%" stop-color="#8b5f3c"/>
      </linearGradient>
      <radialGradient id="sunGlowGrad">
        <stop id="glow1" offset="0%" stop-color="#fff8cf" stop-opacity="0.95"/>
        <stop id="glow2" offset="55%" stop-color="#ffd75e" stop-opacity="0.32"/>
        <stop id="glow3" offset="100%" stop-color="#ffd75e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#dde4f0"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffd79b"/>
        <stop offset="100%" stop-color="#eda04a"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffd07a"/>
        <stop offset="100%" stop-color="#f2a83c"/>
      </linearGradient>
    </defs>

    <!-- ================= 天空 ================= -->
    <rect x="0" y="0" width="1200" height="700" fill="url(#skyGrad)"/>
    <g id="stars" opacity="0"></g>

    <!-- 太阳 / 月亮 -->
    <g id="sunGroup">
      <circle id="sunHalo" cx="958" cy="148" r="132" fill="url(#sunGlowGrad)"/>
      <circle id="sunDisc" cx="958" cy="148" r="44" fill="#fff4b8"/>
    </g>

    <!-- 云 -->
    <g id="clouds"></g>

    <!-- ================= 海 ================= -->
    <rect x="0" y="430" width="1200" height="120" fill="url(#seaGrad)"/>
    <g id="waves"></g>

    <!-- 远处小岛 -->
    <g id="islands" opacity="0.45">
      <path d="M 30 432 Q 88 392 150 432 Z" fill="#2c6c8a"/>
      <path d="M 152 432 Q 190 404 236 432 Z" fill="#2c6c8a"/>
      <path d="M 880 432 Q 934 398 992 432 Z" fill="#2c6c8a"/>
    </g>

    <!-- ================= 木栈道 ================= -->
    <rect x="0" y="545" width="1200" height="155" fill="url(#deckGrad)"/>
    <g id="deck"></g>
    <rect x="0" y="542" width="1200" height="8" fill="#6d4a2b" opacity="0.55"/>

    <!-- ============================================================
         主角：自行车 骑着 鹈鹕
         ============================================================ -->
    <g id="rig">

      <!-- ---------- 鹈鹕：尾羽 ---------- -->
      <path d="M 500 452 L 396 420 L 414 456 L 378 468 L 416 490 L 400 518 L 496 512 Z"
            fill="#eef2f9" stroke="#c9d2e2" stroke-width="3" stroke-linejoin="round"/>

      <!-- ---------- 鹈鹕：腿与蹼足 ---------- -->
      <g stroke="#f2a94c" stroke-width="13" stroke-linecap="round" fill="none">
        <path id="leg0" d="M566 536 L566 612"/>
        <path id="leg1" d="M638 536 L638 612"/>
      </g>
      <g id="foot0" transform="translate(566,612)">
        <path d="M -15 2 L 17 -7 L 10 0 L 18 7 L -15 9 Z"
              fill="#f2a94c" stroke="#c9832a" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <g id="foot1" transform="translate(638,612)">
        <path d="M -15 2 L 17 -7 L 10 0 L 18 7 L -15 9 Z"
              fill="#f2a94c" stroke="#c9832a" stroke-width="2" stroke-linejoin="round"/>
      </g>

      <!-- ---------- 鹈鹕：身体 ---------- -->
      <path d="M 468 478
               C 468 414 506 372 566 368
               C 620 365 660 365 700 368
               C 748 374 762 436 744 490
               C 726 546 672 566 600 566
               C 520 566 468 540 468 478 Z"
            fill="url(#bodyGrad)" stroke="#c9d2e2" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 506 520 C 546 556 656 558 716 512"
            stroke="#dde4f0" stroke-width="4" fill="none" opacity="0.9" stroke-linecap="round"/>

      <!-- ---------- 鹈鹕：翅膀 ---------- -->
      <g id="wing" transform="translate(690,466)">
        <path d="M 0 0 C -30 -40 -100 -40 -132 0 C -104 48 -32 52 0 0 Z"
              fill="#eef2f9" stroke="#c9d2e2" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M -34 12 C -64 20 -96 18 -118 6"
              stroke="#c9d2e2" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M -32 28 C -60 38 -88 38 -110 30"
              stroke="#c9d2e2" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- ---------- 鹈鹕：脖子 / 头 / 喙 / 喉囊 ---------- -->
      <g id="headNeck">
        <path d="M 706 430 C 720 372 748 316 792 268"
              stroke="#c9d2e2" stroke-width="54" fill="none" stroke-linecap="round"/>
        <path d="M 706 430 C 720 372 748 316 792 268"
              stroke="#ffffff" stroke-width="46" fill="none" stroke-linecap="round"/>

        <ellipse cx="800" cy="248" rx="46" ry="40" fill="#ffffff" stroke="#c9d2e2" stroke-width="3.5"/>

        <!-- 喉囊（会晃动） -->
        <path id="pouch"
              d="M 838 262 C 848 348 896 392 942 356 C 970 332 990 296 1000 282 C 946 306 886 302 838 262 Z"
              fill="url(#pouchGrad)" stroke="#d99a3c" stroke-width="3" stroke-linejoin="round"/>

        <!-- 长喙 -->
        <path d="M 836 232 C 892 238 950 254 1006 274 C 1014 278 1008 288 998 286 C 944 272 888 264 836 260 Z"
              fill="url(#beakGrad)" stroke="#d99a3c" stroke-width="3" stroke-linejoin="round"/>

        <!-- 眼睛 -->
        <circle cx="818" cy="236" r="8.5" fill="#26304a"/>
        <circle cx="821" cy="233" r="2.8" fill="#ffffff"/>
      </g>

      <!-- ---------- 自行车 ---------- -->
      <g id="bike">
        <!-- 车轮（由 JS 生成） -->
        <g id="wheels"></g>

        <!-- 车架 -->
        <g stroke="#e8563f" stroke-width="12" stroke-linecap="round" fill="none">
          <line x1="505" y1="316" x2="585" y2="362"/>
          <line x1="505" y1="316" x2="532" y2="240"/>
          <line x1="585" y1="362" x2="532" y2="240"/>
          <line x1="532" y1="240" x2="662" y2="226"/>
          <line x1="585" y1="362" x2="686" y2="266"/>
          <line x1="662" y1="226" x2="686" y2="266"/>
          <line x1="686" y1="266" x2="706" y2="322"/>
        </g>

        <!-- 链条 -->
        <path d="M 585 347 L 505 309 M 585 377 L 505 323"
              stroke="#5a6272" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- 车座 -->
        <path d="M 504 234 Q 528 222 556 230 Q 560 240 544 244 L 512 244 Q 502 241 504 234 Z"
              fill="#2a2f3d" stroke="#171b25" stroke-width="2" stroke-linejoin="round"/>

        <!-- 车把 -->
        <path d="M 664 228 L 656 202" stroke="#3a4050" stroke-width="10" stroke-linecap="round"/>
        <path d="M 628 198 Q 656 186 690 204" stroke="#3a4050" stroke-width="10"
              fill="none" stroke-linecap="round"/>

        <!-- 车铃 -->
        <g id="bell">
          <circle cx="686" cy="192" r="12" fill="#ffd166" stroke="#c9962b" stroke-width="2.5"/>
          <circle cx="686" cy="192" r="4" fill="#c9962b"/>
        </g>

        <!-- 牙盘 -->
        <circle cx="585" cy="362" r="15" fill="#4a5162" stroke="#2f3542" stroke-width="2"/>
        <circle cx="585" cy="362" r="5" fill="#7d8497"/>

        <!-- 曲柄与脚踏 -->
        <g id="crank" transform="translate(585,362)">
          <line x1="0" y1="0" x2="0" y2="-32" stroke="#4a5162" stroke-width="8" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="32" stroke="#4a5162" stroke-width="8" stroke-linecap="round"/>
          <rect x="-15" y="-38" width="30" height="9" rx="4" fill="#2a2f3d"/>
          <rect x="-15" y="29" width="30" height="9" rx="4" fill="#2a2f3d"/>
        </g>

        <!-- 缰绳：车把 → 鹈鹕喙 -->
        <path d="M 690 204 C 736 214 790 228 836 250"
              stroke="#8a5f3c" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 粒子层 -->
    <g id="particles"></g>
  </svg>

  <!-- ================= 界面 ================= -->
  <div class="hud">
    <div class="topbar">
      <div class="brand">
        <h1>自行车骑鹈鹕</h1>
        <p>A Bicycle Riding a Pelican</p>
      </div>
      <div class="gauges">
        <div class="gauge">
          <div class="lbl"><span>鹈鹕体力</span><b id="energyTxt">100%</b></div>
          <div class="track"><i id="energyFill" style="width:100%"></i></div>
        </div>
        <div class="gauge">
          <div class="lbl"><span>当前速度</span><b id="speedTxt">0.7×</b></div>
          <div class="track"><i id="speedFill" style="width:22%"></i></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="dock">
        <div class="speedctl">
          <span>速度</span>
          <input id="speedRange" type="range" min="0" max="100" value="34" aria-label="巡航速度">
        </div>
        <button class="btn bell" id="btnBell">🔔 按铃</button>
        <button class="btn" id="btnBoost">⚡ 冲刺</button>
        <button class="btn" id="btnFeed">🐟 喂小鱼</button>
        <button class="btn" id="btnTheme">🌅 天色</button>
        <button class="btn" id="btnRoad">🪨 路面</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    if (attrs) { for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]); } }
    return e;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* =========================================================
     状态
     ========================================================= */
  var S = {
    t: 0,
    speed: 0.35,
    baseSpeed: 0.35,
    energy: 1,
    boost: 0,
    bell: 0,
    wheelAngle: 0,
    crankAngle: 0,
    legPhase: 0,
    roadOffset: 0,
    theme: 0,
    rough: false
  };

  var HIPS = [{ x: 566, y: 536 }, { x: 638, y: 536 }];
  var FOOT_Y = 612;

  /* =========================================================
     构建车轮
     ========================================================= */
  var spinSets = [];
  function buildWheel(parent, cx, cy, r) {
    var g = el('g', { transform: 'translate(' + cx + ',' + cy + ')' });
    var spin = el('g');

    var d = '';
    for (var i = 0; i < 14; i++) {
      var a = i * Math.PI * 2 / 14;
      d += 'M0 0 L' + (Math.cos(a) * (r - 7)).toFixed(2) + ' ' + (Math.sin(a) * (r - 7)).toFixed(2) + ' ';
    }
    spin.appendChild(el('path', {
      d: d, stroke: '#a8b0c2', 'stroke-width': '1.6',
      fill: 'none', 'stroke-linecap': 'round'
    }));
    g.appendChild(spin);

    g.appendChild(el('circle', { r: r, fill: 'none', stroke: '#2b3040', 'stroke-width': '7' }));
    g.appendChild(el('circle', { r: r - 5, fill: 'none', stroke: '#6b7386', 'stroke-width': '2' }));
    g.appendChild(el('circle', { r: 6.5, fill: '#3a4050' }));
    g.appendChild(el('circle', { r: 2.5, fill: '#8b93a8' }));

    parent.appendChild(g);
    spinSets.push(spin);
  }
  buildWheel($('wheels'), 505, 316, 52);
  buildWheel($('wheels'), 706, 322, 52);

  /* =========================================================
     云 / 星空 / 木栈道 / 海浪
     ========================================================= */
  var cloudData = [];
  (function buildClouds() {
    var layer = $('clouds');
    var defs = [
      { x: -140, y: 110, s: 1.00, sp: 0.22 },
      { x: 180, y: 66, s: 0.75, sp: 0.15 },
      { x: 470, y: 150, s: 1.25, sp: 0.30 },
      { x: 790, y: 80, s: 0.90, sp: 0.19 },
      { x: 1060, y: 172, s: 0.70, sp: 0.26 },
      { x: 1330, y: 52, s: 1.05, sp: 0.17 }
    ];
    defs.forEach(function (c) {
      var g = el('g', { fill: '#ffffff', opacity: '0.92' });
      g.appendChild(el('ellipse', { cx: 0, cy: 0, rx: 62, ry: 26 }));
      g.appendChild(el('ellipse', { cx: -46, cy: 8, rx: 40, ry: 19 }));
      g.appendChild(el('ellipse', { cx: 48, cy: 7, rx: 36, ry: 17 }));
      g.appendChild(el('ellipse', { cx: 6, cy: -20, rx: 36, ry: 24 }));
      g.setAttribute('transform', 'translate(' + c.x + ',' + c.y + ') scale(' + c.s + ')');
      layer.appendChild(g);
      cloudData.push({ el: g, x: c.x, y: c.y, s: c.s, sp: c.sp });
    });
  })();

  (function buildStars() {
    var layer = $('stars');
    for (var i = 0; i < 90; i++) {
      layer.appendChild(el('circle', {
        cx: (Math.random() * 1200).toFixed(1),
        cy: (Math.random() * 380).toFixed(1),
        r: (0.5 + Math.random() * 1.4).toFixed(2),
        fill: '#ffffff',
        opacity: (0.25 + Math.random() * 0.75).toFixed(2)
      }));
    }
  })();

  var deckGroup;
  (function buildDeck() {
    deckGroup = el('g');
    $('deck').appendChild(deckGroup);
    var i = 0;
    for (var x = -60; x < 1280; x += 60) {
      var fill = (i % 2 === 0) ? 'rgba(255,255,255,0.055)' : 'rgba(40,20,4,0.06)';
      deckGroup.appendChild(el('rect', {
        x: x + 2, y: 546, width: 56, height: 154, fill: fill
      }));
      deckGroup.appendChild(el('line', {
        x1: x, y1: 545, x2: x, y2: 700,
        stroke: 'rgba(60,32,12,0.30)', 'stroke-width': 2
      }));
      i++;
    }
  })();

  var waveData = [];
  (function buildWaves() {
    var layer = $('waves');
    for (var i = 0; i < 26; i++) {
      var w = 26 + Math.random() * 80;
      var ln = el('line', {
        x1: 0, y1: 0, x2: w, y2: 0,
        stroke: '#ffffff', 'stroke-width': 2,
        'stroke-linecap': 'round',
        opacity: (0.12 + Math.random() * 0.3).toFixed(2)
      });
      layer.appendChild(ln);
      waveData.push({
        el: ln, x: Math.random() * 1320,
        y: 446 + Math.random() * 88,
        sp: 0.4 + Math.random() * 0.9
      });
    }
  })();

  /* =========================================================
     主题
     ========================================================= */
  var THEMES = [
    {
      name: '☀️ 晴天',
      sky: ['#6fc3f0', '#bfe6ff', '#ffe6c4'],
      sea: ['#63bcdd', '#2b7ba6'],
      deck: ['#d6a879', '#8b5f3c'],
      sun: '#fff4b8', g1: '#fff8cf', g2: '#ffd75e',
      cloud: '#ffffff', cloudOp: 0.92,
      stars: 0, sx: 958, sy: 148, sr: 44, hr: 132
    },
    {
      name: '🌅 黄昏',
      sky: ['#3b2a63', '#e0805a', '#ffc98b'],
      sea: ['#8d5a76', '#3d2a4d'],
      deck: ['#b98a63', '#6b452c'],
      sun: '#ffb775', g1: '#ffd0a0', g2: '#ff7a3d',
      cloud: '#ffc0a0', cloudOp: 0.8,
      stars: 0.18, sx: 900, sy: 358, sr: 58, hr: 170
    },
    {
      name: '🌙 夜晚',
      sky: ['#060d24', '#12224a', '#2b3f6e'],
      sea: ['#15304f', '#081625'],
      deck: ['#4a3626', '#241a12'],
      sun: '#eef3ff', g1: '#cfd9ff', g2: '#8fa8ff',
      cloud: '#41507a', cloudOp: 0.75,
      stars: 1, sx: 950, sy: 130, sr: 34, hr: 110
    }
  ];

  function applyTheme(idx) {
    var T = THEMES[idx];
    $('skyA').setAttribute('stop-color', T.sky[0]);
    $('skyB').setAttribute('stop-color', T.sky[1]);
    $('skyC').setAttribute('stop-color', T.sky[2]);
    $('seaA').setAttribute('stop-color', T.sea[0]);
    $('seaB').setAttribute('stop-color', T.sea[1]);
    $('deckA').setAttribute('stop-color', T.deck[0]);
    $('deckB').setAttribute('stop-color', T.deck[1]);

    $('glow1').setAttribute('stop-color', T.g1);
    $('glow2').setAttribute('stop-color', T.g2);
    $('glow3').setAttribute('stop-color', T.g2);

    var sun = $('sunDisc');
    sun.setAttribute('fill', T.sun);
    sun.setAttribute('cx', T.sx);
    sun.setAttribute('cy', T.sy);
    sun.setAttribute('r', T.sr);

    var halo = $('sunHalo');
    halo.setAttribute('cx', T.sx);
    halo.setAttribute('cy', T.sy);
    halo.setAttribute('r', T.hr);

    $('stars').setAttribute('opacity', String(T.stars));

    cloudData.forEach(function (c) {
      c.el.setAttribute('fill', T.cloud);
      c.el.setAttribute('opacity', String(T.cloudOp));
    });
  }

  /* =========================================================
     Toast
     ========================================================= */
  var toastTimer = null;
  function toast(msg) {
    var box = $('toast');
    box.textContent = msg;
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.classList.remove('show'); }, 1900);
  }

  /* =========================================================
     粒子
     ========================================================= */
  var particleLayer = $('particles');
  var particles = [];

  function spawnParticle(kind) {
    var g = el('g');
    var p;

    if (kind === 'feather') {
      g.appendChild(el('path', {
        d: 'M0 0 C 7 -6 18 -6 23 0 C 18 7 7 7 0 0 Z',
        fill: '#ffffff', stroke: '#dbe2ee', 'stroke-width': 1
      }));
      p = {
        x: 450 + Math.random() * 140,
        y: 430 + Math.random() * 90,
        vx: -(90 + Math.random() * 140),
        vy: -30 - Math.random() * 50,
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 420,
        life: 1.7, maxLife: 1.7, grav: 90
      };
    } else {
      g.appendChild(el('circle', {
        r: (2.4 + Math.random() * 3).toFixed(1),
        fill: '#8fd3ff'
      }));
      p = {
        x: 806 + Math.random() * 40,
        y: 218 + Math.random() * 30,
        vx: -(50 + Math.random() * 90),
        vy: -(150 + Math.random() * 90),
        rot: 0, vr: 0,
        life: 1.0, maxLife: 1.0, grav: 430
      };
    }

    particleLayer.appendChild(g);
    p.el = g;
    particles.push(p);
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        particles.splice(i, 1);
        continue;
      }
      p.vy += p.grav * dt;
      p.vx *= (1 - 0.9 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.el.setAttribute('transform',
        'translate(' + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ') rotate(' + p.rot.toFixed(1) + ')');
      p.el.setAttribute('opacity', Math.min(1, p.life / p.maxLife * 1.6).toFixed(3));
    }
  }

  /* =========================================================
     音频：车铃
     ========================================================= */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    return audioCtx;
  }

  function playBellSound() {
    var ctx = ensureAudio();
    if (!ctx) return;
    var now = ctx.currentTime;

    var master = ctx.createGain();
    master.gain.value = 0.26;
    master.connect(ctx.destination);

    var freqs = [1660, 2210, 2980];
    freqs.forEach(function (f, i) {
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, now);
      o.frequency.exponentialRampToValueAtTime(f * 0.94, now + 0.55);

      var peak = 0.9 / (i + 1.4);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(peak, now + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.75 - i * 0.14);

      o.connect(g);
      g.connect(master);
      o.start(now);
      o.stop(now + 0.85);
    });

    var o2 = ctx.createOscillator();
    var g2 = ctx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(2480, now + 0.085);
    g2.gain.setValueAtTime(0.0001, now + 0.085);
    g2.gain.exponentialRampToValueAtTime(0.28, now + 0.095);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
    o2.connect(g2);
    g2.connect(master);
    o2.start(now + 0.085);
    o2.stop(now + 0.62);
  }

  /* =========================================================
     交互
     ========================================================= */
  $('btnBell').addEventListener('click', function () {
    playBellSound();
    S.bell = 0.9;
    S.boost = Math.max(S.boost, 0.9);
    S.energy = Math.max(0, S.energy - 0.04);
    toast('叮铃铃！鹈鹕受惊，撒腿狂奔！');
  });

  $('btnBoost').addEventListener('click', function () {
    if (S.energy < 0.13) { toast('鹈鹕累瘫了…先喂条小鱼吧 🐟'); return; }
    S.boost = 1.5;
    toast('⚡ 冲刺！鹈鹕蹼足生风');
  });

  $('btnFeed').addEventListener('click', function () {
    S.energy = Math.min(1, S.energy + 0.36);
    toast('🐟 小鱼下肚，鹈鹕满血复活！');
  });

  $('btnTheme').addEventListener('click', function (e) {
    S.theme = (S.theme + 1) % THEMES.length;
    applyTheme(S.theme);
    e.currentTarget.textContent = THEMES[S.theme].name;
    toast('切换天色：' + THEMES[S.theme].name);
  });

  $('btnRoad').addEventListener('click', function (e) {
    S.rough = !S.rough;
    e.currentTarget.classList.toggle('active', S.rough);
    toast(S.rough ? '🪨 石子路！颠得车铃乱响' : '🪵 回到平整木栈道');
  });

  $('speedRange').addEventListener('input', function (e) {
    S.baseSpeed = (parseInt(e.target.value || '0', 10) / 100) * 1.2;
  });

  /* =========================================================
     主循环
     ========================================================= */
  var rig = $('rig');
  var headNeck = $('headNeck');
  var pouch = $('pouch');
  var wing = $('wing');
  var crank = $('crank');
  var bellEl = $('bell');
  var legEls = [$('leg0'), $('leg1')];
  var footEls = [$('foot0'), $('foot1')];
  var energyFill = $('energyFill');
  var speedFill = $('speedFill');
  var energyTxt = $('energyTxt');
  var speedTxt = $('speedTxt');

  var last = performance.now();

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(0.05, dt);
    S.t += dt;

    /* ---- 速度目标 ---- */
    var target = S.baseSpeed;
    if (S.boost > 0) { S.boost -= dt; target = 1.55; }
    if (S.energy < 0.12) target = Math.min(target, 0.15);
    S.speed += (target - S.speed) * Math.min(1, dt * 3.2);
    S.speed = clamp(S.speed, 0, 1.7);

    /* ---- 体力 ---- */
    var burn = 0.03 + S.speed * 0.05 + (S.boost > 0 ? 0.16 : 0);
    S.energy = clamp(S.energy - burn * dt + 0.055 * dt, 0, 1);

    /* ---- 车轮 / 曲柄 ---- */
    S.wheelAngle = (S.wheelAngle + S.speed * 430 * dt) % 360;
    S.crankAngle = (S.crankAngle + S.speed * 155 * dt) % 360;
    spinSets.forEach(function (g) {
      g.setAttribute('transform', 'rotate(' + S.wheelAngle.toFixed(1) + ')');
    });
    crank.setAttribute('transform',
      'translate(585,362) rotate(' + S.crankAngle.toFixed(1) + ')');

    /* ---- 整体颠簸 ---- */
    var amp = (S.rough ? 6.5 : 2.6) + S.speed * 4;
    var freq = S.rough ? 15 : 8.5;
    var bob = Math.sin(S.t * freq) * amp;
    var tilt = Math.sin(S.t * freq * 0.7 + 1.3) * (0.9 + S.speed * 1.5);
    rig.setAttribute('transform',
      'translate(0,' + bob.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 600 610)');

    /* ---- 脖子与头 ---- */
    headNeck.setAttribute('transform',
      'rotate(' + (Math.sin(S.t * 7) * 2.6).toFixed(2) + ' 720 430)');

    /* ---- 喉囊晃动 ---- */
    var ps = 1 + Math.sin(S.t * 8.5) * 0.05 + S.speed * 0.02;
    pouch.setAttribute('transform',
      'translate(920,320) scale(1,' + ps.toFixed(3) + ') translate(-920,-320)');

    /* ---- 翅膀扑腾 ---- */
    var wf = Math.sin(S.t * 7);
    wing.setAttribute('transform',
      'translate(690,466) rotate(' + (wf * 11 - 6).toFixed(2) + ') scale(1,' +
      (1 - wf * 0.06).toFixed(3) + ')');

    /* ---- 车铃抖动 ---- */
    var shake = 0;
    if (S.bell > 0) {
      S.bell -= dt;
      if (S.bell > 0) shake = Math.sin(S.t * 70) * 3 * S.bell;
    }
    bellEl.setAttribute('transform',
      'translate(' + shake.toFixed(2) + ',' + (shake * 0.5).toFixed(2) + ')');

    /* ---- 奔跑的双腿 ---- */
    S.legPhase += dt * (2 + S.speed * 7.5);
    for (var i = 0; i < 2; i++) {
      var a = S.legPhase + (i === 0 ? 0 : Math.PI);
      var fx = HIPS[i].x + 32 * Math.cos(a);
      var fy = FOOT_Y - Math.max(0, 30 * Math.sin(a));
      var mx = (HIPS[i].x + fx) / 2 + 12 * Math.sin(a);
      var my = (HIPS[i].y + fy) / 2;
      legEls[i].setAttribute('d',
        'M' + HIPS[i].x + ',' + HIPS[i].y +
        ' Q' + mx.toFixed(1) + ',' + my.toFixed(1) +
        ' ' + fx.toFixed(1) + ',' + fy.toFixed(1));
      footEls[i].setAttribute('transform',
        'translate(' + fx.toFixed(1) + ',' + fy.toFixed(1) + ')');
    }

    /* ---- 视差滚动 ---- */
    S.roadOffset += S.speed * 420 * dt;
    deckGroup.setAttribute('transform',
      'translate(' + (-(S.roadOffset % 60)).toFixed(1) + ',0)');

    for (var c = 0; c < cloudData.length; c++) {
      var cd = cloudData[c];
      cd.x -= (10 + S.speed * 130) * cd.sp * dt;
      if (cd.x < -300) cd.x += 1700;
      cd.el.setAttribute('transform',
        'translate(' + cd.x.toFixed(1) + ',' + cd.y + ') scale(' + cd.s + ')');
    }

    for (var w = 0; w < waveData.length; w++) {
      var wd = waveData[w];
      wd.x -= (15 + S.speed * 110) * wd.sp * dt;
      if (wd.x < -220) wd.x += 1450;
      wd.el.setAttribute('transform', 'translate(' + wd.x.toFixed(1) + ',' + wd.y + ')');
    }

    /* ---- 粒子 ---- */
    if (S.speed > 0.55 && Math.random() < dt * S.speed * 7) spawnParticle('feather');
    if (S.speed > 1.0 && Math.random() < dt * 6) spawnParticle('sweat');
    updateParticles(dt);

    /* ---- UI ---- */
    var ep = Math.round(S.energy * 100);
    energyFill.style.width = ep + '%';
    energyFill.classList.toggle('low', S.energy < 0.25);
    energyTxt.textContent = ep + '%';

    speedFill.style.width = Math.min(100, (S.speed / 1.6) * 100).toFixed(1) + '%';
    speedTxt.textContent = (S.speed * 2).toFixed(1) + '×';

    requestAnimationFrame(frame);
  }

  /* =========================================================
     启动
     ========================================================= */
  applyTheme(0);
  $('btnTheme').textContent = THEMES[0].name;

  // 初次进入时给一点小提示
  setTimeout(function () { toast('试试按车铃 🔔 ，鹈鹕会受惊狂奔！'); }, 900);

  requestAnimationFrame(function (t) {
    last = t;
    requestAnimationFrame(frame);
  });

})();
</script>
</body>
</html>
