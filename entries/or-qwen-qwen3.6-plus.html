<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕 · 跨代模型前端擂台赛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#1a1a2e;font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
canvas{display:block;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(255,255,255,0.12);backdrop-filter:blur(12px);padding:12px 20px;border-radius:16px;border:1px solid rgba(255,255,255,0.15);z-index:10}
.ctrl-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;font-size:14px;transition:all .2s;white-space:nowrap;user-select:none}
.ctrl-btn:hover{background:rgba(255,255,255,0.3);transform:translateY(-1px)}
.ctrl-btn:active{transform:scale(0.95)}
.ctrl-btn.active{background:rgba(255,200,50,0.4);border-color:rgba(255,200,50,0.6)}
#speedGroup{display:flex;align-items:center;gap:6px;color:#fff;font-size:13px}
#speedSlider{width:100px;accent-color:#f0c040;cursor:pointer}
#staminaBar{width:60px;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden}
#staminaFill{height:100%;background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77);border-radius:4px;transition:width .3s}
#label{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.85);font-size:18px;font-weight:600;text-shadow:0 2px 8px rgba(0,0,0,0.4);letter-spacing:2px;z-index:10}
#hint{position:fixed;top:52px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;z-index:10}
</style>
</head>
<body>
<div id="label">🚲 自行车骑鹈鹕 🦤</div>
<div id="hint">点击控件体验趣味交互</div>
<canvas id="c"></canvas>
<div id="controls">
  <button class="ctrl-btn" id="bellBtn" onclick="ringBell()">🔔 按车铃</button>
  <div id="speedGroup">
    <span>🏎️</span>
    <input type="range" id="speedSlider" min="0" max="100" value="40" oninput="setSpeed(this.value)">
    <span id="speedVal">40</span>
  </div>
  <button class="ctrl-btn" id="sprintBtn" onclick="toggleSprint()">⚡ 冲刺</button>
  <button class="ctrl-btn" id="fishBtn" onclick="feedFish()">🐟 投喂小鱼</button>
  <button class="ctrl-btn" id="themeBtn" onclick="toggleTheme()">🌅 切换场景</button>
  <div style="display:flex;align-items:center;gap:4px;color:#fff;font-size:12px">
    <span>体力</span>
    <div id="staminaBar"><div id="staminaFill" style="width:100%"></div></div>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){
  W=canvas.width=Math.min(window.innerWidth-20,1200);
  H=canvas.height=Math.min(window.innerHeight-100,700);
}
resize();
window.addEventListener('resize',resize);

// State
let time=0;
let speed=40;
let stamina=100;
let isSprinting=false;
let sprintEnergy=0;
let bellRing=false;
let bellTime=0;
let themeIndex=0;
const themes=['day','sunset','night'];
let fishQueue=[];
let feathers=[];
let sweatDrops=[];
let speedLines=[];
let cloudPositions=[];
let starPositions=[];
let birdPositions=[];
let bellShake=0;
let pelicanStartled=false;
let startledTime=0;
let panting=0;

// Init clouds
for(let i=0;i<8;i++){
  cloudPositions.push({x:Math.random()*W*1.5,y:30+Math.random()*80,w:60+Math.random()*80,speed:0.2+Math.random()*0.3});
}
// Init stars
for(let i=0;i<80;i++){
  starPositions.push({x:Math.random()*W,y:Math.random()*H*0.4,r:0.5+Math.random()*1.5,twinkle:Math.random()*Math.PI*2});
}
// Init birds
for(let i=0;i<4;i++){
  birdPositions.push({x:Math.random()*W,y:40+Math.random()*60,phase:Math.random()*Math.PI*2,speed:0.3+Math.random()*0.2});
}

function setSpeed(v){
  speed=parseInt(v);
  document.getElementById('speedVal').textContent=speed;
}

function toggleSprint(){
  isSprinting=!isSprinting;
  document.getElementById('sprintBtn').classList.toggle('active',isSprinting);
  if(isSprinting) sprintEnergy=100;
}

function feedFish(){
  fishQueue.push({x:W/2,y:-20,targetY:0,rotation:0,alpha:1});
  stamina=Math.min(100,stamina+25);
  updateStaminaBar();
}

function toggleTheme(){
  themeIndex=(themeIndex+1)%themes.length;
  const labels=['🌅 切换场景','☀️ 白天','🌙 夜晚'];
  document.getElementById('themeBtn').textContent=labels[themeIndex];
}

function ringBell(){
  bellRing=true;
  bellTime=time;
  bellShake=1;
  pelicanStartled=true;
  startledTime=time;
  // Web Audio bell
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    const o1=ac.createOscillator();
    const o2=ac.createOscillator();
    const g=ac.createGain();
    o1.type='sine';o2.type='sine';
    o1.frequency.setValueAtTime(1200,ac.currentTime);
    o1.frequency.exponentialRampToValueAtTime(800,ac.currentTime+0.15);
    o2.frequency.setValueAtTime(1600,ac.currentTime);
    o2.frequency.exponentialRampToValueAtTime(1000,ac.currentTime+0.12);
    g.gain.setValueAtTime(0.25,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,ac.currentTime+0.3);
    o1.connect(g);o2.connect(g);g.connect(ac.destination);
    o1.start(ac.currentTime);o2.start(ac.currentTime);
    o1.stop(ac.currentTime+0.3);o2.stop(ac.currentTime+0.3);
  }catch(e){}
}

function updateStaminaBar(){
  document.getElementById('staminaFill').style.width=stamina+'%';
}

// Color helpers
function lerpColor(a,b,t){
  const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const ar=(ah>>16)&0xff,ag=(ah>>8)&0xff,ab=ah&0xff;
  const br=(bh>>16)&0xff,bg=(bh>>8)&0xff,bb=bh&0xff;
  const rr=Math.round(ar+(br-ar)*t),rg=Math.round(ag+(bg-ag)*t),rb=Math.round(ab+(bb-ab)*t);
  return`rgb(${rr},${rg},${rb})`;
}

function getThemeColors(){
  const t=themes[themeIndex];
  if(t==='day') return{
    sky1:'#87CEEB',sky2:'#E0F0FF',
    ocean1:'#4A90D9',ocean2:'#2E7BBF',
    ground:'#C4A882',groundDark:'#A08060',
    boardwalk:'#D4B896',boardwalkDark:'#B89878',
    textAlpha:1
  };
  if(t==='sunset') return{
    sky1:'#FF6B35',sky2:'#FFB347',
    ocean1:'#D4546A',ocean2:'#8B3A62',
    ground:'#C4956A',groundDark:'#8B6540',
    boardwalk:'#D4A878',boardwalkDark:'#A87848',
    textAlpha:1
  };
  return{
    sky1:'#0C1445',sky2:'#1A237E',
    ocean1:'#1A237E',ocean2:'#0D1B3E',
    ground:'#2A2A3E',groundDark:'#1A1A2E',
    boardwalk:'#3A3A4E',boardwalkDark:'#2A2A3E',
    textAlpha:0.9
  };
}

// Drawing functions
function drawSky(colors){
  const grad=ctx.createLinearGradient(0,0,0,H*0.55);
  grad.addColorStop(0,colors.sky1);
  grad.addColorStop(1,colors.sky2);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function drawStars(colors){
  if(themeIndex!==2)return;
  starPositions.forEach(s=>{
    const twinkle=0.3+0.7*Math.abs(Math.sin(time*2+s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,220,${twinkle})`;
    ctx.fill();
  });
}

function drawMoon(){
  if(themeIndex!==2)return;
  ctx.beginPath();
  ctx.arc(W*0.85,60,30,0,Math.PI*2);
  ctx.fillStyle='#FFFDE0';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(W*0.85+10,55,25,0,Math.PI*2);
  ctx.fillStyle=themes[themeIndex]==='night'?'#0C1445':'#E0F0FF';
  ctx.fill();
}

function drawSun(){
  if(themeIndex===2)return;
  const sy=themeIndex===1?80:50;
  const sx=themeIndex===1?W*0.2:W*0.15;
  ctx.beginPath();
  ctx.arc(sx,sy,35,0,Math.PI*2);
  ctx.fillStyle=themeIndex===1?'#FF4500':'#FFD700';
  ctx.fill();
  // rays
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6+time*0.5;
    ctx.beginPath();
    ctx.moveTo(sx+Math.cos(a)*40,sy+Math.sin(a)*40);
    ctx.lineTo(sx+Math.cos(a)*55,sy+Math.sin(a)*55);
    ctx.strokeStyle=themeIndex===1?'rgba(255,100,0,0.3)':'rgba(255,215,0,0.3)';
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

function drawClouds(colors){
  cloudPositions.forEach(c=>{
    c.x-=c.speed*(speed/40+0.5);
    if(c.x<-c.w*2)c.x=W+c.w;
    const alpha=themeIndex===2?0.15:0.7;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    // Cloud shape
    const cx=c.x,cy=c.y;
    ctx.beginPath();
    ctx.ellipse(cx,cy,c.w*0.5,c.w*0.2,0,0,Math.PI*2);
    ctx.ellipse(cx-c.w*0.25,cy+5,c.w*0.3,c.w*0.15,0,0,Math.PI*2);
    ctx.ellipse(cx+c.w*0.25,cy+3,c.w*0.35,c.w*0.18,0,0,Math.PI*2);
    ctx.fill();
  });
}

function drawBirds(){
  if(themeIndex===2)return;
  birdPositions.forEach(b=>{
    b.x-=b.speed*(speed/40+0.3);
    if(b.x<-20)b.x=W+20;
    const wing=Math.sin(time*6+b.phase)*8;
    ctx.strokeStyle=themeIndex===1?'#FF8C42':'#555';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(b.x-8,b.y+wing);
    ctx.quadraticCurveTo(b.x-3,b.y-3,b.x,b.y);
    ctx.quadraticCurveTo(b.x+3,b.y-3,b.x+8,b.y+wing);
    ctx.stroke();
  });
}

function drawOcean(colors){
  const oceanTop=H*0.5;
  const grad=ctx.createLinearGradient(0,oceanTop,0,H*0.65);
  grad.addColorStop(0,colors.ocean1);
  grad.addColorStop(1,colors.ocean2);
  ctx.fillStyle=grad;
  ctx.fillRect(0,oceanTop,W,H*0.15);
  // Waves
  ctx.strokeStyle=`rgba(255,255,255,${themeIndex===2?0.1:0.3})`;
  ctx.lineWidth=1.5;
  for(let w=0;w<3;w++){
    ctx.beginPath();
    for(let x=0;x<W;x+=2){
      const y=oceanTop+w*12+Math.sin(x*0.02+time*2+w)*4+Math.sin(x*0.05+time*3)*2;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

function drawBoardwalk(colors){
  const groundY=H*0.65;
  const grad=ctx.createLinearGradient(0,groundY,0,H);
  grad.addColorStop(0,colors.ground);
  grad.addColorStop(1,colors.groundDark);
  ctx.fillStyle=grad;
  ctx.fillRect(0,groundY,W,H-groundY);
  // Boardwalk planks
  const plankW=40;
  const offset=(time*speed*0.5)%plankW;
  ctx.strokeStyle=colors.boardwalkDark;
  ctx.lineWidth=1;
  for(let x=-offset;x<W;x+=plankW){
    ctx.beginPath();
    ctx.moveTo(x,groundY);
    ctx.lineTo(x,H);
    ctx.stroke();
  }
  // Horizontal lines
  for(let y=groundY;y<H;y+=20){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }
  // Wood grain texture
  ctx.globalAlpha=0.1;
  for(let i=0;i<20;i++){
    const gx=(i*73+offset*2)%W;
    const gy=groundY+10+Math.sin(i*1.7)*30;
    ctx.fillStyle='#8B7355';
    ctx.fillRect(gx,gy,30,3);
  }
  ctx.globalAlpha=1;
}

function drawPelican(cx,cy){
  const bounce=Math.sin(time*8+1)*3*(speed/40);
  const legPhase=time*10*(speed/40);
  const wingPhase=time*6*(speed/40);
  const pouchWobble=Math.sin(time*12)*4*(speed/40);
  const breathe=Math.sin(time*3)*2*(1+speed/100);
  const tilt=Math.sin(time*5)*2*(speed/40);

  ctx.save();
  ctx.translate(cx,cy+bounce);
  ctx.rotate(tilt*Math.PI/180);

  // Tail feathers
  const tailX=-50,tailY=10;
  for(let i=0;i<5;i++){
    const a=-0.4+i*0.2+Math.sin(time*4+i)*0.1;
    ctx.save();
    ctx.translate(tailX,tailY);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-20,-5,-30-i*3,0);
    ctx.quadraticCurveTo(-20,5,0,0);
    ctx.fillStyle=i%2===0?'#E8D5B0':'#D4C4A0';
    ctx.fill();
    ctx.restore();
  }

  // Legs (running animation)
  const legLen=35;
  for(let leg=0;leg<2;leg++){
    const phase=legPhase+leg*Math.PI;
    const kneeX=Math.sin(phase)*20;
    const kneeY=Math.cos(phase)*5+15;
    const footX=Math.sin(phase)*35;
    const footY=legLen+Math.abs(Math.sin(phase))*5;

    ctx.strokeStyle='#D4A050';
    ctx.lineWidth=4;
    ctx.lineCap='round';
    // Upper leg
    ctx.beginPath();
    ctx.moveTo(-15+leg*10,30+breathe);
    ctx.lineTo(kneeX,kneeY+breathe);
    ctx.stroke();
    // Lower leg
    ctx.beginPath();
    ctx.moveTo(kneeX,kneeY+breathe);
    ctx.lineTo(footX,footY+breathe);
    ctx.stroke();
    // Webbed foot
    ctx.fillStyle='#D4A050';
    ctx.beginPath();
    ctx.ellipse(footX+5,footY+breathe,10,4,0.2,0,Math.PI*2);
    ctx.fill();
    // Web lines
    ctx.strokeStyle='#C49040';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(footX,footY+breathe-3);
    ctx.lineTo(footX+12,footY+breathe-2);
    ctx.stroke();
  }

  // Body
  ctx.beginPath();
  ctx.ellipse(0,10+breathe*0.5,55,30,0,0,Math.PI*2);
  const bodyGrad=ctx.createRadialGradient(-10,5+breathe*0.5,5,0,10+breathe*0.5,55);
  bodyGrad.addColorStop(0,'#FFF8EE');
  bodyGrad.addColorStop(1,'#E8D5B0');
  ctx.fillStyle=bodyGrad;
  ctx.fill();
  ctx.strokeStyle='#C4A882';
  ctx.lineWidth=1.5;
  ctx.stroke();

  // Wing flapping
  for(let w=0;w<2;w++){
    const side=w===0?-1:1;
    const wingAngle=Math.sin(wingPhase+w*0.5)*15*(speed/40+0.5);
    ctx.save();
    ctx.translate(side*25,5+breathe*0.5);
    ctx.rotate(wingAngle*Math.PI/180*side);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(side*30,-20,side*45,-5);
    ctx.quadraticCurveTo(side*35,5,0,0);
    ctx.fillStyle=w===0?'#F0E0C0':'#E8D8B8';
    ctx.fill();
    ctx.strokeStyle='#C4A882';
    ctx.lineWidth=1;
    ctx.stroke();
    // Feather details
    for(let f=0;f<4;f++){
      const fa=-0.3+f*0.2;
      ctx.beginPath();
      ctx.moveTo(side*10,0);
      ctx.lineTo(side*35+Math.cos(fa)*10,Math.sin(fa)*8);
      ctx.strokeStyle='#C4A070';
      ctx.lineWidth=0.8;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Neck
  ctx.beginPath();
  ctx.moveTo(35,0+breathe*0.3);
  ctx.quadraticCurveTo(45,-15,50,-25+breathe*0.3);
  ctx.quadraticCurveTo(55,-15,50,0+breathe*0.3);
  ctx.fillStyle='#FFF8EE';
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(52,-28+breathe*0.3,14,12,0.1,0,Math.PI*2);
  ctx.fillStyle='#FFF8EE';
  ctx.fill();
  ctx.strokeStyle='#C4A882';
  ctx.lineWidth=1;
  ctx.stroke();

  // Crown feathers
  for(let i=0;i<3;i++){
    const a=-0.5+i*0.3;
    ctx.beginPath();
    ctx.moveTo(50,-40+breathe*0.3);
    ctx.quadraticCurveTo(50+Math.cos(a)*15,-50+Math.sin(a)*5,55+Math.cos(a)*18,-48+Math.sin(a)*8);
    ctx.strokeStyle='#E8D5B0';
    ctx.lineWidth=2;
    ctx.stroke();
  }

  // Eye
  const eyeX=58,eyeY=-30+breathe*0.3;
  ctx.beginPath();
  ctx.arc(eyeX,eyeY,4,0,Math.PI*2);
  ctx.fillStyle='#FFF';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eyeX+1,eyeY,2.5,0,Math.PI*2);
  ctx.fillStyle='#1A1A2E';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(eyeX+2,eyeY-1,1,0,Math.PI*2);
  ctx.fillStyle='#FFF';
  ctx.fill();

  // Expression based on state
  if(stamina<30||isSprinting){
    // Tired expression
    ctx.beginPath();
    ctx.moveTo(eyeX-3,eyeY-5);
    ctx.lineTo(eyeX+3,eyeY-6);
    ctx.strokeStyle='#333';
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  // Beak (upper)
  ctx.beginPath();
  ctx.moveTo(62,-32+breathe*0.3);
  ctx.quadraticCurveTo(80,-35,95,-28+breathe*0.3);
  ctx.quadraticCurveTo(80,-25,62,-24+breathe*0.3);
  ctx.fillStyle='#F0A030';
  ctx.fill();
  ctx.strokeStyle='#D08020';
  ctx.lineWidth=1;
  ctx.stroke();

  // Pouch (lower beak) - wobbly
  ctx.beginPath();
  ctx.moveTo(62,-24+breathe*0.3);
  ctx.quadraticCurveTo(75,-15+pouchWobble,90,-18+pouchWobble);
  ctx.quadraticCurveTo(95,-10+pouchWobble*0.5,95,-28+breathe*0.3);
  ctx.fillStyle='#F0B050';
  ctx.fill();
  ctx.strokeStyle='#D08020';
  ctx.lineWidth=1;
  ctx.stroke();

  // Pouch texture lines
  ctx.strokeStyle='rgba(200,130,40,0.3)';
  ctx.lineWidth=0.5;
  for(let i=0;i<3;i++){
    const px=70+i*8;
    const py=-15+pouchWobble*0.5+i*2;
    ctx.beginPath();
    ctx.moveTo(px,py);
    ctx.quadraticCurveTo(px+3,py+8,px+6,py);
    ctx.stroke();
  }

  // Nostril
  ctx.beginPath();
  ctx.ellipse(75,-30+breathe*0.3,2,1.5,0,0,Math.PI*2);
  ctx.fillStyle='#D08020';
  ctx.fill();

  // Panting tongue when sprinting or low stamina
  if(isSprinting||stamina<20){
    ctx.beginPath();
    ctx.moveTo(80,-22+breathe*0.3);
    ctx.quadraticCurveTo(85,-18+Math.sin(time*10)*3,88,-20+Math.sin(time*10)*2);
    ctx.fillStyle='#FF6B6B';
    ctx.fill();
  }

  // Sweat drops when tired
  if(stamina<50||isSprinting){
    const sweatAlpha=Math.max(0,(50-stamina)/50);
    for(let i=0;i<3;i++){
      const sx=60+i*12;
      const sy=-35+breathe*0.3+Math.sin(time*8+i*2)*5;
      ctx.beginPath();
      ctx.moveTo(sx,sy-5);
      ctx.quadraticCurveTo(sx+3,sy,sx,sy+5);
      ctx.quadraticCurveTo(sx-3,sy,sx,sy-5);
      ctx.fillStyle=`rgba(100,180,255,${sweatAlpha*0.7})`;
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawBicycle(cx,cy){
  const bounce=Math.sin(time*8+1)*3*(speed/40);
  const pedalPhase=time*10*(speed/40);
  const tilt=Math.sin(time*5)*2*(speed/40);
  const wheelAngle=time*speed*0.3;

  ctx.save();
  ctx.translate(cx,cy+bounce-45);
  ctx.rotate(tilt*Math.PI/180);

  // Shadow on pelican
  ctx.beginPath();
  ctx.ellipse(0,48,50,8,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fill();

  // Rear wheel
  drawWheel(-30,35,wheelAngle);
  // Front wheel
  drawWheel(30,35,wheelAngle);

  // Frame
  ctx.strokeStyle='#2244AA';
  ctx.lineWidth=3.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  // Main triangle
  ctx.beginPath();
  ctx.moveTo(-30,35); // rear axle
  ctx.lineTo(0,0); // seat tube top
  ctx.lineTo(0,35); // bottom bracket
  ctx.closePath();
  ctx.stroke();

  // Top tube
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(25,-5); // head tube area
  ctx.stroke();

  // Down tube
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,35);
  ctx.stroke();

  // Seat tube
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(-5,35);
  ctx.stroke();

  // Chain stay
  ctx.beginPath();
  ctx.moveTo(-5,35);
  ctx.lineTo(-30,35);
  ctx.stroke();

  // Seat stay
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(-30,35);
  ctx.strokeStyle='#1A3388';
  ctx.lineWidth=2.5;
  ctx.stroke();

  // Fork
  ctx.strokeStyle='#2244AA';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(25,-5);
  ctx.lineTo(30,35);
  ctx.stroke();

  // Handlebars
  ctx.strokeStyle='#333';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(25,-5);
  ctx.lineTo(20,-18);
  ctx.lineTo(35,-22);
  ctx.stroke();

  // Bell
  if(bellShake>0){
    const shake=Math.sin(time*30)*bellShake*3;
    ctx.save();
    ctx.translate(20+shake,-20);
    ctx.beginPath();
    ctx.arc(0,0,5,0,Math.PI*2);
    ctx.fillStyle='#FFD700';
    ctx.fill();
    ctx.strokeStyle='#CC9900';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.restore();
  }else{
    ctx.beginPath();
    ctx.arc(20,-20,5,0,Math.PI*2);
    ctx.fillStyle='#FFD700';
    ctx.fill();
    ctx.strokeStyle='#CC9900';
    ctx.lineWidth=1;
    ctx.stroke();
  }

  // Reins from handlebars to pelican head area
  ctx.strokeStyle='#8B4513';
  ctx.lineWidth=2;
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(35,-22);
  const reinSag=Math.sin(time*2)*5+15;
  ctx.quadraticCurveTo(50,-22+reinSag,65,-5);
  ctx.stroke();
  ctx.setLineDash([]);

  // Second rein
  ctx.beginPath();
  ctx.moveTo(30,-20);
  ctx.quadraticCurveTo(48,-18+reinSag*0.8,62,-3);
  ctx.stroke();

  // Seat
  ctx.fillStyle='#333';
  ctx.beginPath();
  ctx.ellipse(0,-3,12,4,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#555';
  ctx.beginPath();
  ctx.ellipse(0,-4,10,3,0,0,Math.PI*2);
  ctx.fill();

  // Pedals and crank
  const crankR=12;
  const p1x=Math.cos(pedalPhase)*crankR;
  const p1y=35+Math.sin(pedalPhase)*crankR;
  const p2x=Math.cos(pedalPhase+Math.PI)*crankR;
  const p2y=35+Math.sin(pedalPhase+Math.PI)*crankR;

  // Crank arms
  ctx.strokeStyle='#666';
  ctx.lineWidth=2.5;
  ctx.beginPath();
  ctx.moveTo(0,35);
  ctx.lineTo(p1x,p1y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0,35);
  ctx.lineTo(p2x,p2y);
  ctx.stroke();

  // Pedals
  ctx.fillStyle='#444';
  ctx.fillRect(p1x-5,p1y-2,10,4);
  ctx.fillRect(p2x-5,p2y-2,10,4);

  // Chain (simplified)
  ctx.strokeStyle='#888';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(0,35,12,12,0,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(-30,35,5,5,0,0,Math.PI*2);
  ctx.stroke();

  // Chainring teeth hint
  ctx.strokeStyle='#777';
  ctx.lineWidth=1;
  for(let i=0;i<8;i++){
    const a=pedalPhase+i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*12,35+Math.sin(a)*12);
    ctx.lineTo(Math.cos(a)*14,35+Math.sin(a)*14);
    ctx.stroke();
  }

  // "Riding" pose - the bike is leaning forward as if pedaling hard
  // Add some motion lines
  if(speed>50){
    ctx.strokeStyle=`rgba(255,255,255,${(speed-50)/100})`;
    ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      const ly=10+i*15;
      const lx=-50-i*10;
      ctx.beginPath();
      ctx.moveTo(lx,ly);
      ctx.lineTo(lx-20-i*5,ly);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawWheel(x,y,angle){
  ctx.save();
  ctx.translate(x,y);

  // Tire
  ctx.beginPath();
  ctx.arc(0,0,18,0,Math.PI*2);
  ctx.strokeStyle='#333';
  ctx.lineWidth=4;
  ctx.stroke();

  // Inner tire
  ctx.beginPath();
  ctx.arc(0,0,16,0,Math.PI*2);
  ctx.strokeStyle='#555';
  ctx.lineWidth=1;
  ctx.stroke();

  // Spokes
  ctx.strokeStyle='#AAA';
  ctx.lineWidth=1;
  for(let i=0;i<8;i++){
    const a=angle+i*Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*16,Math.sin(a)*16);
    ctx.stroke();
  }

  // Hub
  ctx.beginPath();
  ctx.arc(0,0,4,0,Math.PI*2);
  ctx.fillStyle='#888';
  ctx.fill();

  ctx.restore();
}

function drawParticles(){
  // Feathers
  feathers.forEach((f,i)=>{
    f.x-=f.vx*(speed/40);
    f.y+=f.vy;
    f.rot+=f.rotSpeed;
    f.life-=0.01;
    if(f.life<=0){feathers.splice(i,1);return;}
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.rot);
    ctx.beginPath();
    ctx.ellipse(0,0,8,3,0,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,240,220,${f.life})`;
    ctx.fill();
    ctx.restore();
  });

  // Sweat drops
  sweatDrops.forEach((s,i)=>{
    s.x-=s.vx*(speed/40);
    s.y+=s.vy;
    s.life-=0.015;
    if(s.life<=0){sweatDrops.splice(i,1);return;}
    ctx.beginPath();
    ctx.moveTo(s.x,s.y-5);
    ctx.quadraticCurveTo(s.x+3,s.y,s.x,s.y+5);
    ctx.quadraticCurveTo(s.x-3,s.y,s.x,s.y-5);
    ctx.fillStyle=`rgba(100,180,255,${s.life*0.7})`;
    ctx.fill();
  });

  // Speed lines
  if(speed>60){
    const intensity=(speed-60)/40;
    ctx.strokeStyle=`rgba(255,255,255,${intensity*0.3})`;
    ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const ly=H*0.3+Math.random()*H*0.3;
      const lx=Math.random()*W;
      ctx.beginPath();
      ctx.moveTo(lx,ly);
      ctx.lineTo(lx-30-intensity*40,ly);
      ctx.stroke();
    }
  }

  // Fish falling animation
  fishQueue.forEach((f,i)=>{
    f.y+=4;
    f.rotation+=0.1;
    if(f.y>cy_target){
      f.alpha-=0.05;
      if(f.alpha<=0){fishQueue.splice(i,1);return;}
    }
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.rotation);
    drawFish(0,0,f.alpha);
    ctx.restore();
  });
}

let cy_target=0;

function drawFish(x,y,alpha){
  ctx.globalAlpha=alpha;
  ctx.beginPath();
  ctx.ellipse(x,y,12,6,0,0,Math.PI*2);
  ctx.fillStyle='#FF8C42';
  ctx.fill();
  // Tail
  ctx.beginPath();
  ctx.moveTo(x-10,y);
  ctx.lineTo(x-18,y-6);
  ctx.lineTo(x-18,y+6);
  ctx.closePath();
  ctx.fill();
  // Eye
  ctx.beginPath();
  ctx.arc(x+6,y-1,2,0,Math.PI*2);
  ctx.fillStyle='#FFF';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x+6.5,y-1,1,0,Math.PI*2);
  ctx.fillStyle='#000';
  ctx.fill();
  ctx.globalAlpha=1;
}

function spawnFeather(){
  if(Math.random()<0.03*(speed/40)){
    feathers.push({
      x:W+10,
      y:H*0.3+Math.random()*H*0.3,
      vx:1+Math.random()*2,
      vy:-0.5+Math.random()*1,
      rot:Math.random()*Math.PI*2,
      rotSpeed:0.02+Math.random()*0.05,
      life:1
    });
  }
}

function spawnSweat(){
  if(stamina<40||isSprinting){
    if(Math.random()<0.05){
      sweatDrops.push({
        x:W*0.5+Math.random()*40,
        y:H*0.35,
        vx:0.5+Math.random(),
        vy:1+Math.random(),
        life:1
      });
    }
  }
}

function drawVignette(){
  const grad=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.8);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.3)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
}

function drawSpeedometer(){
  const x=W-80,y=H-80;
  ctx.beginPath();
  ctx.arc(x,y,30,Math.PI*0.75,Math.PI*2.25);
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.lineWidth=4;
  ctx.stroke();

  const speedAngle=Math.PI*0.75+(speed/100)*Math.PI*1.5;
  ctx.beginPath();
  ctx.arc(x,y,30,Math.PI*0.75,speedAngle);
  ctx.strokeStyle=speed>70?'#FF6B6B':'#6BCB77';
  ctx.lineWidth=4;
  ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font='bold 12px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(speed+' km/h',x,y+5);
}

// Main loop
function animate(){
  time+=0.016;

  // Update stamina
  if(speed>0){
    stamina-=0.02*(speed/40);
  }
  if(isSprinting){
    stamina-=0.08;
    speed=Math.min(100,speed+0.5);
  }else{
    speed=Math.max(40,speed-0.3);
    document.getElementById('speedSlider').value=speed;
    document.getElementById('speedVal').textContent=Math.round(speed);
  }
  stamina=Math.max(0,stamina);
  updateStaminaBar();

  if(stamina<=0){
    speed=Math.max(0,speed-1);
    isSprinting=false;
    document.getElementById('sprintBtn').classList.remove('active');
  }

  if(bellShake>0)bellShake*=0.9;
  if(bellShake<0.01)bellShake=0;
  if(pelicanStartled){
    speed=Math.min(100,speed+30*(1-(time-startledTime)));
    pelicanStartled=false;
  }

  const colors=getThemeColors();

  // Draw scene
  ctx.clearRect(0,0,W,H);
  drawSky(colors);
  drawStars(colors);
  drawMoon();
  drawSun();
  drawClouds(colors);
  drawBirds();
  drawOcean(colors);
  drawBoardwalk(colors);

  // Pelican position
  const pelicanX=W*0.45;
  const pelicanY=H*0.52;

  // Draw pelican
  drawPelican(pelicanX,pelicanY);

  // Draw bicycle on pelican's back
  drawBicycle(pelicanX-5,pelicanY-10);

  // Particles
  spawnFeather();
  spawnSweat();
  drawParticles();

  drawVignette();
  drawSpeedometer();

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
