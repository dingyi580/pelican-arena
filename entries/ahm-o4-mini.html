<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Bicycle Riding a Pelican</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; }
    #canvas { display: block; }
    #controls {
      position: absolute; top: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(255,255,255,0.8); padding: 10px;
      border-radius: 8px; font-family: sans-serif;
      backdrop-filter: blur(5px);
    }
    #controls label { font-size: 14px; }
    #controls input[type=range] { width: 150px; }
    #controls button {
      padding: 6px 12px; font-size: 14px;
      border: none; border-radius: 4px;
      cursor: pointer; background: #3498db; color: #fff;
      transition: background 0.2s;
    }
    #controls button:hover { background: #2980b9; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <button id="bellBtn">Ring Bell 🔔</button>
    <label>Speed: <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1"></label>
    <button id="toggleTimeBtn">Switch to Night 🌙</button>
  </div>
  <script>
  (function(){
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    window.addEventListener('resize', ()=> {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    });

    // UI
    const bellBtn = document.getElementById('bellBtn');
    const speedSlider = document.getElementById('speedSlider');
    const toggleTimeBtn = document.getElementById('toggleTimeBtn');

    let speed = parseFloat(speedSlider.value);
    let isDay = true;

    speedSlider.addEventListener('input', ()=> {
      speed = parseFloat(speedSlider.value);
    });

    toggleTimeBtn.addEventListener('click', ()=> {
      isDay = !isDay;
      toggleTimeBtn.textContent = isDay ? "Switch to Night 🌙" : "Switch to Day ☀️";
    });

    // AudioContext for bell
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playBell() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.5, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    // Bell interaction
    let bellBoost = 0;
    bellBtn.addEventListener('click', ()=> {
      playBell();
      bellBoost = 1.5; // boost duration in seconds
    });

    // Animation variables
    let lastTime = 0;
    let offset = 0;

    function drawSky() {
      if (isDay) {
        // Day sky
        ctx.fillStyle = '#87CEEB';
      } else {
        ctx.fillStyle = '#0d1b2a';
      }
      ctx.fillRect(0, 0, W, H * 0.6);
    }

    function drawSea() {
      ctx.fillStyle = isDay ? '#4DA8DA' : '#1b263b';
      ctx.fillRect(0, H*0.6, W, H*0.15);
    }

    function drawGround() {
      const groundY = H * 0.75;
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(0, groundY, W, H - groundY);
      // planks
      const plankW = 100, plankH = 10;
      let start = - (offset % plankW);
      for (let x = start; x < W; x += plankW) {
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(x, groundY, plankW - 5, plankH);
      }
    }

    function drawClouds() {
      const cloudCount = 6;
      for (let i = 0; i < cloudCount; i++) {
        const cx = ((i * 200) - (offset * 0.2)) % (W + 200) - 100;
        const cy = 80 + 40 * (i % 3);
        ctx.fillStyle = isDay ? 'rgba(255,255,255,0.8)' : 'rgba(200,200,200,0.3)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 50, 30, 0, 0, Math.PI*2);
        ctx.ellipse(cx+30, cy+10, 40, 25, 0, 0, Math.PI*2);
        ctx.ellipse(cx-30, cy+10, 40, 25, 0, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function drawPelican(t) {
      const baseX = W * 0.4;
      const groundY = H * 0.75;
      // bounce
      const bounce = Math.sin(t * 8 * speed) * 10 * speed;
      // body
      ctx.save();
      ctx.translate(baseX, groundY - 60 + bounce);
      // body circle
      ctx.fillStyle = '#fff'; ctx.strokeStyle='#ccc'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(0, 0, 50, 35, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      // pouch
      const wobble = Math.sin(t * 6 * speed) * 5;
      ctx.beginPath();
      ctx.fillStyle = '#ffd1a4'; ctx.strokeStyle='#e5af7e'; ctx.lineWidth=2;
      ctx.moveTo(-20, 10);
      ctx.quadraticCurveTo(0, 60 + wobble, 20, 10);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // wing
      const flap = Math.sin(t * 5 * speed) * 0.4;
      ctx.save();
      ctx.translate(-30, -10);
      ctx.rotate(-0.5 + flap);
      ctx.beginPath();
      ctx.fillStyle = '#eee'; ctx.strokeStyle='#ccc'; ctx.lineWidth=2;
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-40, -10, -40, 30, 0, 20);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      // head and beak
      ctx.beginPath();
      ctx.fillStyle = '#fff'; ctx.strokeStyle='#ccc'; ctx.lineWidth=2;
      ctx.ellipse(40, -40, 25, 20, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // beak
      ctx.beginPath();
      ctx.fillStyle='#ffd27f'; ctx.strokeStyle='#e5af7e'; ctx.lineWidth=2;
      ctx.moveTo(65, -40);
      ctx.lineTo(110, -45);
      ctx.lineTo(65, -35);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // eye
      ctx.beginPath();
      ctx.fillStyle='#333'; ctx.arc(35,-45,4,0,2*Math.PI); ctx.fill();
      // legs
      ctx.strokeStyle='#e99'; ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(-20, 20);
      ctx.lineTo(-20, 50);
      ctx.moveTo(0, 20);
      ctx.lineTo(0, 50);
      ctx.stroke();
      ctx.restore();
    }

    function drawBike(t) {
      const baseX = W * 0.4;
      const wheelY = H * 0.75 - 60 + Math.sin(t * 8 * speed) * 10 * speed;
      // wheels
      const wheelRadius = 20;
      const rotation = - (t * speed * 4) % (2*Math.PI);
      ['back','front'].forEach((w, i) => {
        const x = baseX + (i===0 ? -50 : 50);
        ctx.save();
        ctx.translate(x, wheelY);
        ctx.rotate(rotation);
        ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.fillStyle='#666';
        ctx.beginPath(); ctx.arc(0,0,wheelRadius,0,Math.PI*2); ctx.fill(); ctx.stroke();
        // spokes
        for(let s=0;s<8;s++){
          ctx.rotate(Math.PI/4);
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(wheelRadius,0); ctx.stroke();
        }
        ctx.restore();
      });
      // frame
      ctx.save(); ctx.strokeStyle='#444'; ctx.lineWidth=4;
      ctx.beginPath();
      // seat tube
      ctx.moveTo(baseX-50, wheelY);
      ctx.lineTo(baseX, wheelY-60);
      // top tube
      ctx.lineTo(baseX+50, wheelY);
      // seat stays
      ctx.moveTo(baseX, wheelY-60);
      ctx.lineTo(baseX+50, wheelY);
      // down tube
      ctx.moveTo(baseX-50, wheelY);
      ctx.lineTo(baseX+50, wheelY);
      ctx.stroke();
      // handlebar & seat
      ctx.strokeStyle='#555'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(baseX, wheelY-60);
      ctx.lineTo(baseX-20, wheelY-80);
      ctx.moveTo(baseX, wheelY-60);
      ctx.lineTo(baseX+20, wheelY-80);
      ctx.moveTo(baseX, wheelY-60);
      ctx.lineTo(baseX, wheelY-90);
      ctx.stroke();
      ctx.restore();
    }

    function loop(now) {
      const t = now / 1000;
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      // update offset
      let s = speed + (bellBoost>0? speed*1.5 : 0);
      offset += dt * 200 * s;
      if (bellBoost > 0) bellBoost -= dt;

      // draw
      drawSky();
      drawClouds();
      if (!isDay) {
        // stars
        ctx.fillStyle='white';
        for (let i=0;i<50;i++){
          const sx = (i*123 + offset*0.1) % W;
          const sy = (i*47 + 20) % (H*0.6);
          ctx.fillRect(sx, sy, 2,2);
        }
      }
      drawSea();
      drawGround();
      drawPelican(t);
      drawBike(t);

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
