<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
:root{
  --glass:rgba(14,20,44,.38);
  --glass2:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.20);
  --ink:#fdfaf3;
  --muted:rgba(253,250,243,.66);
  --gold:#ffcf4a;
  --coral:#ff6b55;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1430;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
.panel{position:fixed;background:var(--glass);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.12)}
/* 标题卡 */
#title{left:18px;top:16px;padding:12px 18px 12px 16px;display:flex;gap:12px;align-items:center;pointer-events:none}
#title .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ff8a5b,#ffcf4a);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px rgba(255,140,80,.45)}
#title h1{font-size:19px;letter-spacing:.06em;font-weight:800;line-height:1.15;
  background:linear-gradient(90deg,#fff,#ffe3a6);-webkit-background-clip:text;background-clip:text;color:transparent}
#title p{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
#title p b{color:#ffd88a;font-weight:700}
/* 状态卡 */
#status{right:18px;top:16px;padding:12px 16px;width:236px;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.row+.row{margin-top:8px}
.big{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.big small{font-size:11px;font-weight:600;color:var(--muted);margin-left:3px}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.13);overflow:hidden;margin-top:6px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:9px;background:linear-gradient(90deg,#4be08a,#a6f36b);transition:background .4s}
.bar.mid i{background:linear-gradient(90deg,#ffb23e,#ffe066)}
.bar.low i{background:linear-gradient(90deg,#ff4d4d,#ff8a5b);animation:pulse .6s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
#mood{font-size:13px;color:var(--ink);font-weight:600}
/* 控件坞 */
#dock{left:50%;bottom:16px;transform:translateX(-50%);padding:9px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;max-width:calc(100vw - 20px)}
.btn{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:var(--glass2);color:var(--ink);font:600 13.5px var(--font);
  height:42px;padding:0 14px;border-radius:13px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,transform .12s,box-shadow .2s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn:active{transform:scale(.95)}
.btn .ico{font-size:17px;line-height:1}
kbd{font:600 10px var(--font);padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.25);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.12)}
#bell{background:linear-gradient(135deg,#ffd84d,#ffaa33);color:#3a2300;border-color:rgba(255,230,150,.7);box-shadow:0 4px 14px rgba(255,170,50,.35)}
#bell kbd{background:rgba(80,40,0,.18);color:#5a3800;border-color:rgba(80,40,0,.2)}
#bell.ring .ico{animation:shake .45s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-24deg)}30%{transform:rotate(20deg)}45%{transform:rotate(-16deg)}60%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
#dash::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--cd,0)*100%);background:linear-gradient(90deg,#ffd166,#ff6b55)}
#dash.cool{opacity:.6}
#feed.wait{opacity:.55}
.speed{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 10px;height:42px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.speed label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.speed label b{color:var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:5px;border-radius:5px;background:linear-gradient(90deg,#7ee0ff var(--p,44%),rgba(255,255,255,.18) var(--p,44%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);border:3px solid #49c6f0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #49c6f0}
.seg{display:flex;padding:3px;gap:2px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);height:42px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--font);padding:0 10px;border-radius:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.9);color:#1d2340;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sep{width:1px;height:26px;background:rgba(255,255,255,.14)}
#toast{left:50%;top:18px;transform:translate(-50%,-10px);padding:9px 16px;font-size:12.5px;color:var(--ink);opacity:0;transition:all .6s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){kbd{display:none}.btn{padding:0 11px}input[type=range]{width:90px}}
@media (max-width:760px){
  #status{width:180px;padding:9px 12px}.big{font-size:19px}
  #title p{display:none}#title h1{font-size:15px}#title .logo{width:32px;height:32px;font-size:18px}
  #dock{flex-wrap:wrap;justify-content:center;width:calc(100vw - 16px);bottom:8px;gap:6px}
  .btn .txt{display:none}.sep{display:none}#toast{display:none}
}
</style>
</head>
<body>
<canvas id="stage" aria-label="一辆自行车骑着一只鹈鹕在海滨木栈道上奔跑"></canvas>

<div id="title" class="panel">
  <div class="logo">🚲</div>
  <div>
    <h1>自行车骑鹈鹕</h1>
    <p>A Bicycle Riding a Pelican · 不是鹈鹕骑车，是<b>车骑鹈鹕</b>！</p>
  </div>
</div>

<div id="status" class="panel">
  <div class="row"><span>鹈鹕体力</span><span id="stamTxt">100%</span></div>
  <div class="bar" id="stamBar"><i id="stam"></i></div>
  <div class="row" style="margin-top:10px"><span>速度</span><span class="big" id="kmh">0<small>km/h</small></span></div>
  <div class="row"><span>里程</span><span class="big" id="dist" style="font-size:16px">0<small>m</small></span></div>
  <div class="row"><span>状态</span><span id="mood">😄 精神抖擞</span></div>
</div>

<div id="toast" class="panel">💡 小提示：点一点鹈鹕、自行车和吊着的小鱼，都有反应哦</div>

<div id="dock" class="panel">
  <button class="btn" id="bell" title="按车铃（空格）"><span class="ico">🔔</span><span class="txt">按车铃</span><kbd>Space</kbd></button>
  <div class="speed" title="调节步速">
    <label>步速 <b id="spdv">5 档</b></label>
    <input type="range" id="spd" min="1" max="10" step="1" value="5">
  </div>
  <button class="btn" id="dash" title="冲刺（D）"><span class="ico">⚡</span><span class="txt">冲刺</span><kbd>D</kbd></button>
  <button class="btn" id="feed" title="投喂小鱼（F）"><span class="ico">🐟</span><span class="txt">投喂</span><kbd>F</kbd></button>
  <span class="sep"></span>
  <div class="seg" id="tod" title="天色（T）">
    <button data-v="0" class="on">☀️ 晴天</button><button data-v="1">🌇 黄昏</button><button data-v="2">🌙 夜晚</button>
  </div>
  <div class="seg" id="road" title="路况（R）">
    <button data-v="0" class="on">木栈道</button><button data-v="1">石子路</button>
  </div>
  <button class="btn" id="snd" title="声音（M）"><span class="ico">🔊</span></button>
</div>

<script>
(function(){
'use strict';
/* =========================================================
   工具函数
   ========================================================= */
var $=function(id){return document.getElementById(id);};
var cv=$('stage'),ctx=cv.getContext('2d');
var TAU=Math.PI*2;
var FONT='-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function mod(a,n){return ((a%n)+n)%n;}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function backOut(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function hsh(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb(c,a){return a===undefined?'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function bez(p0,p1,p2,p3,t){var u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3;}
function bezD(p0,p1,p2,p3,t){var u=1-t;return 3*u*u*(p1-p0)+6*u*t*(p2-p1)+3*t*t*(p3-p2);}

/* =========================================================
   调色板：晴天 / 黄昏 / 夜晚（平滑插值）
   ========================================================= */
var RAW=[
 {skyTop:'#3c9be6',skyMid:'#88caf1',skyBot:'#dcf2fb',sun:'#fff7d2',sunGlow:'#fff1a8',
  seaFar:'#82c7e4',sea:'#2f93c8',seaNear:'#1c6aa1',isleFar:'#a8cfe3',isle:'#6fa3be',
  cloud:'#ffffff',cloudShade:'#d3e7f4',deck:'#d49c64',deckLine:'#8a5833',deckSide:'#7a4a2b',rail:'#8a5731',
  pile:'#5c3a22',water:'#16588a',tint:'#ffffff',tintA:0,stars:0,lamps:0,sunX:0.8,sunY:0.15,sunR:44,
  glint:'#ffffff',glintA:0.5,haze:'#eaf8ff',hazeA:0.55},
 {skyTop:'#2a2a6c',skyMid:'#c9557a',skyBot:'#ffb769',sun:'#ffe48e',sunGlow:'#ff9858',
  seaFar:'#f2967b',sea:'#8b4e86',seaNear:'#4b2d63',isleFar:'#9b5a86',isle:'#583566',
  cloud:'#ffc4a2',cloudShade:'#cb6f8b',deck:'#bb774a',deckLine:'#673823',deckSide:'#552f1e',rail:'#56301f',
  pile:'#381f17',water:'#38224f',tint:'#ff7048',tintA:0.08,stars:0.22,lamps:0.65,sunX:0.66,sunY:0.49,sunR:80,
  glint:'#ffd57e',glintA:0.8,haze:'#ffc49a',hazeA:0.6},
 {skyTop:'#030820',skyMid:'#0f1c49',skyBot:'#293c77',sun:'#f6f2da',sunGlow:'#9db2ff',
  seaFar:'#25427c',sea:'#112954',seaNear:'#091938',isleFar:'#1b2a57',isle:'#0f1a3b',
  cloud:'#3a4a7d',cloudShade:'#222f61',deck:'#6b5662',deckLine:'#2e2332',deckSide:'#291e2b',rail:'#2b2030',
  pile:'#19131f',water:'#07132d',tint:'#0a1650',tintA:0.3,stars:1,lamps:1,sunX:0.8,sunY:0.14,sunR:34,
  glint:'#dfe6ff',glintA:0.65,haze:'#3a4f8f',hazeA:0.4}
];
var PALS=RAW.map(function(o){var r={};for(var k in o){r[k]=typeof o[k]==='string'?hex(o[k]):o[k];}return r;});
function mixPal(a,b,t){var r={};for(var k in b){var va=a[k],vb=b[k];r[k]=Array.isArray(vb)?mixc(va,vb,t):va+(vb-va)*t;}return r;}
var P=mixPal(PALS[0],PALS[0],0),todFrom=P,tod=0,todT=1;

/* =========================================================
   画布尺寸
   ========================================================= */
var W=0,H=0,DPR=1,S=1,GY=0,HZ=0,CX=0,vign=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  GY=Math.round(H*0.765);HZ=Math.round(H*0.5);
  S=clamp(Math.min((GY-95)/500,W/700),0.3,1.55);
  CX=W*0.5-128*S;
  vign=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.38,W/2,H*0.5,Math.max(W,H)*0.8);
  vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,0.3)');
}
window.addEventListener('resize',resize);resize();

/* =========================================================
   音频：Web Audio 纯代码合成
   ========================================================= */
var AC=null,master=null,sndOn=true,noiseB=null,ambStarted=false;
function ac(){
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{AC=new C();}catch(e){return null;}
    master=AC.createGain();master.gain.value=sndOn?0.75:0;master.connect(AC.destination);}
  if(AC.state==='suspended'){AC.resume();}
  return AC;
}
function noiseBuf(a){
  if(noiseB)return noiseB;var len=a.sampleRate*2|0;noiseB=a.createBuffer(1,len,a.sampleRate);
  var d=noiseB.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;return noiseB;
}
function unlockAudio(){var a=ac();if(a&&!ambStarted){ambStarted=true;startAmbient(a);}}
function startAmbient(a){ // 海浪环境音
  var src=a.createBufferSource();src.buffer=noiseBuf(a);src.loop=true;
  var lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
  var g=a.createGain();g.gain.value=0.045;
  var lfo=a.createOscillator();lfo.frequency.value=0.11;var lg=a.createGain();lg.gain.value=0.035;
  lfo.connect(lg);lg.connect(g.gain);src.connect(lp);lp.connect(g);g.connect(master);src.start();lfo.start();
}
function bellSound(){ // 清脆车铃：非谐泛音 + 颤音 + 双击
  var a=ac();if(!a)return;var t0=a.currentTime+0.01;
  [0,0.14].forEach(function(d,i){
    var t=t0+d,g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.55,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
    var trem=a.createGain();trem.gain.value=0.75;
    var lfo=a.createOscillator();lfo.frequency.value=24+i*6;var lg=a.createGain();lg.gain.value=0.25;lfo.connect(lg);lg.connect(trem.gain);
    [[1,1],[1.51,0.5],[2.76,0.35],[4.07,0.16],[5.4,0.07]].forEach(function(pr){
      var o=a.createOscillator();o.type='sine';o.frequency.value=2380*pr[0]*(i?1.012:1);
      var og=a.createGain();og.gain.setValueAtTime(pr[1]*0.28,t);og.gain.exponentialRampToValueAtTime(0.0001,t+1.5/Math.sqrt(pr[0]));
      o.connect(og);og.connect(trem);o.start(t);o.stop(t+1.6);
    });
    trem.connect(g);g.connect(master);lfo.start(t);lfo.stop(t+1.6);
  });
}
function honk(n){ // 鹈鹕“嘎嘎”叫
  var a=ac();if(!a)return;var t=a.currentTime+0.01;n=n||2;
  for(var k=0;k<n;k++){
    var t0=t+k*0.21,f0=rand(240,290);
    var o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f0*0.55,t0+0.17);
    var o2=a.createOscillator();o2.type='square';o2.frequency.setValueAtTime(f0*1.02,t0);o2.frequency.exponentialRampToValueAtTime(f0*0.54,t0+0.17);
    var f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=950;f.Q.value=1.4;
    var g=a.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.32,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.19);
    o.connect(f);o2.connect(f);f.connect(g);g.connect(master);o.start(t0);o2.start(t0);o.stop(t0+0.21);o2.stop(t0+0.21);
  }
}
function gulpSound(){
  var a=ac();if(!a)return;var t=a.currentTime+0.01;
  for(var k=0;k<2;k++){var t0=t+k*0.17;var o=a.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(520,t0);o.frequency.exponentialRampToValueAtTime(150,t0+0.15);
    var g=a.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.4,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.16);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.18);}
}
function blip(f1,f2,dur,vol){
  var a=ac();if(!a)return;var t=a.currentTime+0.01;var o=a.createOscillator();o.type='triangle';
  o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  var g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function whoosh(){
  var a=ac();if(!a)return;var t=a.currentTime+0.01;var src=a.createBufferSource();src.buffer=noiseBuf(a);
  var f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(2600,t+0.35);f.frequency.exponentialRampToValueAtTime(500,t+0.8);
  var g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.12);g.gain.exponentialRampToValueAtTime(0.0001,t+0.85);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);src.stop(t+0.9);
}
function thud(){
  var a=ac();if(!a)return;var t=a.currentTime+0.01;var o=a.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+0.12);
  var g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.16);
}

/* =========================================================
   状态
   ========================================================= */
var st={
  T:0,dist:0,v:0,slider:5,stamina:100,exhausted:false,
  dash:0,dashCD:0,scare:0,happy:0,ouch:0,wheelie:0,bell:0,lean:0,
  phase:0,bob:0,prevBob:0,bodyRot:0,
  bikeY:0,bikeVY:0,bikeRot:0,bikeVR:0,
  pouch:0,pouchV:0,jaw:0,gulp:0,
  rodY:0,rodV:0,prevBikeVY:0,
  wheelAng:0,wingT:0,blink:0,blinkT:2,bikeBlink:0,bikeBlinkT:3.5,

var BIKE_PIVOT_X=-80,BIKE_PIVOT_Y=-232;
function bikeRel(){return st.bikeY-st.bob;}
function bikeToBody(x,y){var dx=x-BIKE_PIVOT_X,dy=y-BIKE_PIVOT_Y,c=Math.cos(st.bikeRot),s=Math.sin(st.bikeRot);
  return [BIKE_PIVOT_X+dx*c-dy*s,BIKE_PIVOT_Y+bikeRel()+dx*s+dy*c];}
function bodyToChar(x,y){var dx=x,dy=y+170,c=Math.cos(st.bodyRot),s=Math.sin(st.bodyRot);
  return [dx*c-dy*s,-170+st.bob+dx*s+dy*c];}
function charToScreen(p){return [CX+p[0]*S,GY+p[1]*S];}
function bodyToScreen(x,y){return charToScreen(bodyToChar(x,y));}
function bikeToChar(x,y){var b=bikeToBody(x,y);return bodyToChar(b[0],b[1]);}
function bikeToScreen(x,y){return charToScreen(bikeToChar(x,y));}
function rodTipLocal(){return [420+st.rodY*0.3,-478+st.rodY];}

/* =========================================================
   更新逻辑（物理 + 状态机）
   ========================================================= */
function bump(sz){
  st.bikeVY-=rand(140,240)+sz*10;st.bikeVR+=rand(-1.6,1.6);st.ouch=0.45;thud();
  if(Math.random()<0.6){var fp=bodyToScreen(-10,-235);featherBurst(fp[0],fp[1],2,160);}
  var ft=charToScreen(geo.footN);
  for(var i=0;i<5;i++)emit({type:'dust',x:ft[0],y:ft[1],vx:rand(-120,60),vy:rand(-90,-20),life:0.6,size:rand(3,6)*S,world:true,drag:2});
}
function footfall(f){
  var sp=charToScreen([f[0]+10,0]);var n=1+Math.min(4,st.v/220)|0;
  for(var i=0;i<n;i++)emit({type:'dust',x:sp[0]+rand(-8,8)*S,y:sp[1]-rand(0,4)*S,vx:rand(-60,20),vy:rand(-50,-10),life:rand(0.45,0.8),size:rand(3,6)*S,world:true,drag:2.5});
}
function update(dt){
  st.T+=dt;var T=st.T;
  if(todT<1)todT=Math.min(1,todT+dt/1.6);
  P=mixPal(todFrom,PALS[tod],ease(todT));
  st.roadT+=((st.road?1:0)-st.roadT)*Math.min(1,dt*3);

  ['dash','dashCD','scare','happy','ouch','wheelie'].forEach(function(k){st[k]=Math.max(0,st[k]-dt);});
  st.bell=Math.max(0,st.bell-dt*1.6);

  // —— 速度与体力 ——
  var target=80+st.slider*55;
  if(st.road)target*=0.88;
  if(st.dash>0)target*=1.75;
  if(st.scare>0)target*=1.4;
  if(st.exhausted)target=Math.min(target,150);
  st.v+=(target-st.v)*Math.min(1,dt*(st.dash>0?4:1.7));
  var vn=st.v/630;
  var drain=vn*vn*5.2+(st.dash>0?13:0)+(st.scare>0?2:0)+(st.road?0.8:0);
  var recover=st.v<280?(1-st.v/280)*9:0;
  st.stamina=clamp(st.stamina-(drain-recover)*dt,0,100);
  if(st.stamina<=0&&!st.exhausted){st.exhausted=true;st.dash=0;say('pel','我…不…行…了…',3);setTimeout(function(){sayK('bike','bikeTired',2.6);},1200);}
  if(st.exhausted&&st.stamina>25)st.exhausted=false;
  st.dist+=st.v*dt;

  // —— 步态 ——
  var f=1.0+st.v/450,w=TAU*f;
  st.phase+=w*dt;
  var A=clamp(st.v/w,8,58),lift=14+A*0.55,p=st.phase;
  var sN=Math.sin(p),sF=Math.sin(p+Math.PI);
  var wob=st.exhausted?Math.sin(T*5)*6:0;
  geo.liftN=sN<0?-sN:0;geo.footN=[22+A*Math.cos(p)+wob,sN<0?sN*lift-4:-4];
  geo.liftF=sF<0?-sF:0;geo.footF=[-6+A*Math.cos(p+Math.PI)-wob,sF<0?sF*lift-4:-4];
  if(prevSN<0&&sN>=0)footfall(geo.footN);
  if(prevSF<0&&sF>=0)footfall(geo.footF);
  prevSN=sN;prevSF=sF;

  var amp=3+st.v*0.011+(st.exhausted?2.5:0);
  st.prevBob=st.bob;
  st.bob=amp*(Math.abs(Math.cos(p-0.3))-0.5)+st.roadT*Math.sin(T*31)*1.3;
  var headVy=(st.bob-st.prevBob)/Math.max(dt,0.001);
  st.lean+=(((st.dash>0)?1:0)+((st.scare>0)?0.5:0)-st.lean)*Math.min(1,dt*4);
  st.bodyRot=st.lean*0.06+Math.sin(p*2)*0.012+(st.exhausted?0.035:0);
  geo.hipN=bodyToChar(18,-110);geo.hipF=bodyToChar(-8,-110);

  // —— 自行车弹簧（随颠簸起伏、车身微倾）——
  st.prevBikeVY=st.bikeVY;
  st.bikeVY+=(260*(st.bob-st.bikeY)-10*st.bikeVY)*dt;st.bikeY+=st.bikeVY*dt;
  var rel=st.bikeY-st.bob;
  if(rel>4){st.bikeY=st.bob+4;if(st.bikeVY>0)st.bikeVY*=-0.3;}
  if(rel<-60){st.bikeY=st.bob-60;st.bikeVY*=0.5;}
  var wk=st.wheelie>0?Math.min(1,st.wheelie*2,(3.4-st.wheelie)*3):0;
  var rotT=-0.36*wk+(st.dash>0?0.02:0)+Math.sin(p*2+1)*0.008+(wk>0?Math.sin(T*9)*0.04*wk:0);
  st.bikeVR+=(90*(rotT-st.bikeRot)-8*st.bikeVR)*dt;st.bikeRot+=st.bikeVR*dt;
  if(st.bikeRot>0.035){st.bikeRot=0.035;if(st.bikeVR>0)st.bikeVR*=-0.3;}
  st.wheelAng+=st.v*dt/52*(1+wk*0.6);

  // —— 鱼竿弹性 ——
  st.rodV+=(-170*st.rodY-5*st.rodV)*dt-(st.bikeVY-st.prevBikeVY)*0.22;
  st.rodY=clamp(st.rodY+st.rodV*dt,-34,34);

  // —— 喉囊晃动 ——
  st.pouchV+=(-140*st.pouch-5.5*st.pouchV-clamp(headVy,-400,400)*6)*dt;
  st.pouch=clamp(st.pouch+st.pouchV*dt,-22,22);
  st.gulp=Math.max(0,st.gulp-dt);

  // —— 伸脖子够鱼 ——
  st.lungeT-=dt;
  if(st.lunge<0&&st.lungeT<=0&&fish.state==='hang'&&st.scare<=0&&!st.exhausted){st.lunge=0;}
  var lungeK=0;
  if(st.lunge>=0){st.lunge+=dt/0.7;lungeK=Math.sin(Math.min(1,st.lunge)*Math.PI);
    if(st.lunge>=1){st.lunge=-1;st.lungeT=rand(4,8);blip(900,700,0.05,0.08);}}

  // —— 头部 ——
  geo.hx=200+lungeK*22+st.lean*8;
  geo.hy=-325+Math.sin(p*2+0.6)*3-lungeK*24+(st.exhausted?14:0);
  geo.headTilt=-0.12*lungeK+Math.sin(p*2+0.8)*0.03+(st.exhausted?0.16:0)-(st.scare>0?0.1:0);

  // —— 下颌 ——
  var jt=0;
  if(fish.state==='fly')jt=1;
  else if(st.gulp>1.2)jt=0.3;
  else if(lungeK>0)jt=0.75*lungeK;
  else if(st.exhausted)jt=0.35+0.25*Math.sin(T*9);
  else if(st.stamina<35)jt=0.12+0.1*Math.sin(T*7);
  else if(st.scare>0)jt=0.45+0.1*Math.sin(T*20);
  st.jaw+=(Math.max(0,jt)-st.jaw)*Math.min(1,dt*12);

  // —— 翅膀 ——
  var sk=Math.min(1,st.scare);
  var fz=1.6+sk*4.5+(st.dash>0?1.6:0)+wk*2;
  st.wingT+=dt*fz*TAU;
  var wb=0.08+st.v/3000-(st.exhausted?0.06:0);
  var wa=0.05+sk*0.5+(st.dash>0?0.2:0)+wk*0.25;
  geo.wingN=wb+wa*(0.5+0.5*Math.sin(st.wingT));
  geo.wingF=wb+0.12+wa*(0.5+0.5*Math.sin(st.wingT+0.5));

  // —— 眨眼 ——
  st.blinkT-=dt;if(st.blinkT<=0){st.blink=0.14;st.blinkT=rand(2,5);}st.blink=Math.max(0,st.blink-dt);
  st.bikeBlinkT-=dt;if(st.bikeBlinkT<=0){st.bikeBlink=0.14;st.bikeBlinkT=rand(3,6);}st.bikeBlink=Math.max(0,st.bikeBlink-dt);

  // —— 鱼（钟摆物理）——
  var tip=bikeToChar(rodTipLocal()[0],rodTipLocal()[1]);
  if(fish.x===null){fish.x=fish.px=tip[0];fish.y=fish.py=tip[1]+fish.len;}
  if(fish.state==='hang'){
    if(fish.len<95)fish.len=Math.min(95,fish.len+dt*110);
    var vx=(fish.x-fish.px)*0.99,vy=(fish.y-fish.py)*0.99;
    fish.px=fish.x;fish.py=fish.y;
    fish.x+=vx-st.v*0.6*dt*dt;fish.y+=vy+1400*dt*dt;
    var dx=fish.x-tip[0],dy=fish.y-tip[1],d=Math.hypot(dx,dy)||1;
    if(d>fish.len){fish.x=tip[0]+dx/d*fish.len;fish.y=tip[1]+dy/d*fish.len;}
  }else if(fish.state==='fly'){
    fish.t+=dt/0.45;var m=bodyToChar(geo.hx+60,geo.hy+10);var tt=Math.min(1,fish.t);
    var cx=(fish.sx+m[0])/2+30,cy=Math.min(fish.sy,m[1])-60;
    fish.x=(1-tt)*(1-tt)*fish.sx+2*(1-tt)*tt*cx+tt*tt*m[0];
    fish.y=(1-tt)*(1-tt)*fish.sy+2*(1-tt)*tt*cy+tt*tt*m[1];
    if(fish.t>=1)eatFish();
  }else if(fish.state==='gone'){
    fish.t+=dt;if(fish.t>2.2){fish.state='hang';fish.len=0;fish.x=fish.px=tip[0];fish.y=fish.py=tip[1];}
  }
  fish.wig+=dt*(fish.state==='hang'?8:20);

  // —— 石子路 ——
  if(st.road){while(st.nextRock<st.dist+(W-CX)/S+60){rocks.push({x:st.nextRock,z:rand(-16,26),r:rand(5,13),hit:false,c:rand(0,1),s:Math.random()});st.nextRock+=rand(70,230);}}
  for(var i=rocks.length-1;i>=0;i--){var rk=rocks[i],loc=rk.x-st.dist;
    if(!rk.hit&&loc<26){rk.hit=true;if(rk.z<16)bump(rk.r);}
    if(loc<-CX/S-60)rocks.splice(i,1);}

  // —— 汗珠 / 速度线 / 脚踏蹭羽毛 ——
  if(st.stamina<35||st.dash>0){st.sweatT-=dt;if(st.sweatT<=0){st.sweatT=st.exhausted?0.12:0.28;
    var hp=bodyToScreen(geo.hx-10,geo.hy-24);
    emit({type:'sweat',x:hp[0],y:hp[1],vx:rand(-120,40),vy:rand(-170,-90),g:600,life:0.9,size:rand(3.5,5.5)*Math.max(S,0.6),world:true});}}
  if(st.dash>0||st.scare>0||st.v>700){if(Math.random()<dt*(st.dash>0?40:16))emit({type:'speed',x:W+20,y:rand(H*0.12,GY),vx:-rand(1500,2300),life:0.8,size:rand(60,180)*S});}
  if(st.v>300&&Math.random()<dt*0.6){var pp=bikeToScreen(2,-250);featherBurst(pp[0],pp[1],1,140);}

  // —— 粒子 ——
  for(var j=parts.length-1;j>=0;j--){var q=parts[j];q.age+=dt;
    if(q.age>=q.life){parts.splice(j,1);continue;}
    if(q.drag){var dk=Math.max(0,1-q.drag*dt);q.vx*=dk;q.vy*=dk;}
    q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;
    if(q.world)q.x-=st.v*S*dt;
    if(q.type==='feather')q.x+=Math.sin(q.age*5+q.rot)*20*dt;}

  // —— 流星 ——
  if(P.stars>0.7){st.shootT-=dt;if(st.shootT<=0){st.shootT=rand(4,9);st.shoot={x:rand(0.3,1)*W,y:rand(0.04,0.3)*HZ,vx:-rand(500,800),vy:rand(150,260),life:0.9,age:0};}}
  if(st.shoot){st.shoot.age+=dt;st.shoot.x+=st.shoot.vx*dt;st.shoot.y+=st.shoot.vy*dt;if(st.shoot.age>st.shoot.life)st.shoot=null;}

  // —— 对话 ——
  ['bike','pel'].forEach(function(k){var b=bubbles[k];if(b){b.t+=dt;if(b.t>b.dur)bubbles[k]=null;}});
  st.chatT-=dt;
  if(st.chatT<=0){st.chatT=rand(5,9);
    if(!bubbles.bike&&!bubbles.pel){
      if(st.stamina<35)sayK('pel','pelTired');
      else if(st.road&&Math.random()<0.45)sayK('pel','pelRocky');
      else if(Math.random()<0.5)sayK('bike','bikeIdle');
      else sayK('pel','pelIdle');
    }}
}

/* =========================================================
   背景绘制
   ========================================================= */

var clouds=[];for(var ci=0;ci<9;ci++)clouds.push({u:Math.random(),y:rand(0.08,0.6),s:rand(0.55,1.35),f:rand(0.015,0.06)});

  if(P.stars>0.01){

      ctx.fillStyle='rgba(255,252,235,'+a.toFixed(3)+')';var x=s.x*W,y=s.y*HZ;
      if(s.r>2){ctx.fillRect(x-3,y-0.5,6,1);ctx.fillRect(x-0.5,y-3,1,6);}
      ctx.fillRect(x-s.r/2,y-s.r/2,s.r,s.r);}

function drawCloud(x,y,s){

function drawIsles(){

    ctx.fillStyle=rgb(ly[3]);ctx.beginPath();ctx.moveTo(0,HZ+1);
    for(var x=0;x<=W+8;x+=8){var u=(x+off)/S;var h=Math.max(0,ridge(u,ly[1])-ly[4])*ly[2]*S*1.6;ctx.lineTo(x,HZ-h);}
    ctx.lineTo(W,HZ+1);ctx.closePath();ctx.fill();}
  // 灯塔
  lhLamps.length=0;
  var f=0.06,offL=st.dist*f,per=3000;
  var k0=Math.floor((offL-1600)/per);
  for(var k=k0;k<=k0+2;k++){var lx=(k*per+1500)*S-st.dist*S*f;if(lx<-80||lx>W+80)continue;

    ctx.beginPath();ctx.moveTo(lx-9*S,by);ctx.lineTo(lx-5.5*S,by-th);ctx.lineTo(lx+5.5*S,by-th);ctx.lineTo(lx+9*S,by);ctx.closePath();ctx.fill();
    ctx.fillStyle=rgb(mixc([214,72,60],P.isle,0.25+P.stars*0.45));
    for(var b=0;b<3;b++){var y0=by-th*(0.18+b*0.28),y1=y0-th*0.12,w0=9-7*(0.18+b*0.28)/2.1,w1=9-7*(0.3+b*0.28)/2.1;
      ctx.beginPath();ctx.moveTo(lx-w0*S,y0);ctx.lineTo(lx-w1*S,y1);ctx.lineTo(lx+w1*S,y1);ctx.lineTo(lx+w0*S,y0);ctx.closePath();ctx.fill();}

    ctx.fillStyle=rgb(mixc([200,60,50],P.isle,0.3));ctx.beginPath();ctx.moveTo(lx-7*S,by-th-12*S);ctx.lineTo(lx,by-th-20*S);ctx.lineTo(lx+7*S,by-th-12*S);ctx.fill();

  ctx.beginPath();ctx.moveTo(bx-2*bs,byy-9*bs);ctx.lineTo(bx-2*bs,byy-36*bs);ctx.lineTo(bx-17*bs,byy-9*bs);ctx.closePath();ctx.fill();

function drawBoardwalk(){
  var deckTop=GY-26*S,deckBot=GY+46*S,beamBot=deckBot+16*S;
  var gap=150*S,off=mod(st.dist*S,gap),railTop=deckTop-62*S;
  // 路灯（栏杆后）
  lampHeads.length=0;
  var lp=1100,k0=Math.floor((st.dist-CX/S-200)/lp);
  for(var k=k0;k<k0+Math.ceil(W/S/lp)+3;k++){var lx=CX+(k*lp+500-st.dist)*S;if(lx<-60*S||lx>W+60*S)continue;
    var top=deckTop-235*S;ctx.fillStyle='#2a2a33';ctx.fillRect(lx-3*S,top,6*S,deckTop-top);
    ctx.fillRect(lx-7*S,deckTop-14*S,14*S,14*S);
    ctx.strokeStyle='#2a2a33';ctx.lineWidth=4*S;ctx.beginPath();ctx.moveTo(lx,top+4*S);ctx.quadraticCurveTo(lx,top-18*S,lx+22*S,top-14*S);ctx.stroke();
    ctx.fillStyle='#2a2a33';ctx.beginPath();ctx.moveTo(lx+12*S,top-12*S);ctx.lineTo(lx+32*S,top-12*S);ctx.lineTo(lx+28*S,top-4*S);ctx.lineTo(lx+16*S,top-4*S);ctx.closePath();ctx.fill();
    ctx.fillStyle=rgb(mixc([240,236,220],[255,226,150],P.lamps));circle(lx+22*S,top-1*S,5*S);ctx.fill();
    lampHeads.push([lx+22*S,top]);}
  // 栏杆
  ctx.fillStyle=rgb(P.rail);
  for(var x=-off;x<W+gap;x+=gap){ctx.fillRect(x-4*S,railTop-4*S,8*S,deckTop-railTop+4*S);ctx.fillRect(x-6*S,railTop-8*S,12*S,5*S);}
  ctx.fillRect(0,railTop,W,7*S);ctx.fillRect(0,railTop+30*S,W,4*S);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(0,railTop,W,2*S);
  // 甲板顶面
  var g=ctx.createLinearGradient(0,deckTop,0,deckBot);
  g.addColorStop(0,rgb(mixc(P.deck,[0,0,0],0.18)));g.addColorStop(0.3,rgb(P.deck));g.addColorStop(1,rgb(mixc(P.deck,[255,255,255],0.12)));
  ctx.fillStyle=g;ctx.fillRect(0,deckTop,W,deckBot-deckTop);
  var pw=36*S,i0=Math.floor(st.dist*S/pw)-1;
  for(var i=i0;i<i0+W/pw+3;i++){var px=i*pw-st.dist*S,sk=0.1;
    var x1=px+(px-W/2)*sk,x2=px+pw+(px+pw-W/2)*sk,h=hsh(i);
    ctx.fillStyle='rgba(0,0,0,'+(h*0.12).toFixed(3)+')';
    ctx.beginPath();ctx.moveTo(px,deckTop);ctx.lineTo(px+pw,deckTop);ctx.lineTo(x2,deckBot);ctx.lineTo(x1,deckBot);ctx.closePath();ctx.fill();
    ctx.strokeStyle=rgb(P.deckLine,0.75);ctx.lineWidth=1.4*S;ctx.beginPath();ctx.moveTo(px,deckTop);ctx.lineTo(x1,deckBot);ctx.stroke();
    if(h>0.55){ctx.strokeStyle=rgb(P.deckLine,0.25);ctx.lineWidth=1*S;ctx.beginPath();ctx.moveTo(px+pw*0.5,deckTop+8*S);ctx.quadraticCurveTo(px+pw*0.62,deckTop+30*S,(x1+x2)/2,deckBot-10*S);ctx.stroke();}
    ctx.fillStyle=rgb(P.deckLine,0.6);circle(px+pw*0.5,deckTop+5*S,1.2*S);ctx.fill();circle((x1+x2)/2,deckBot-5*S,1.4*S);ctx.fill();}
  // 石子路面覆盖
  if(st.roadT>0.01){
    ctx.fillStyle=rgb(mixc([150,136,118],P.deck,0.25+P.stars*0.4),(0.92*st.roadT).toFixed(3));ctx.fillRect(0,deckTop,W,deckBot-deckTop);

      ctx.fillStyle=n%3===0?'rgba(70,60,52,'+(0.6*st.roadT)+')':(n%3===1?'rgba(210,200,185,'+(0.55*st.roadT)+')':'rgba(120,108,96,'+(0.7*st.roadT)+')');
      ctx.beginPath();ctx.ellipse(gx,gy,r*1.3,r*0.8,0,0,TAU);ctx.fill();}}}

  ctx.fillStyle=rgb(P.deckSide);ctx.fillRect(0,deckBot,W,beamBot-deckBot);

  ctx.fillStyle=wg;ctx.fillRect(0,beamBot,W,H-beamBot);

  return deckTop;
}

function legIK(hx,hy,fx,fy,L1,L2){
  var dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);d=clamp(d,Math.abs(L1-L2)+0.01,L1+L2-0.01);
  var a=Math.atan2(dy,dx),A=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1)),ang=a+A;
  return [hx+Math.cos(ang)*L1,hy+Math.sin(ang)*L1];
}
function drawLeg(hip,foot,lift,near){
  var knee=legIK(hip[0],hip[1],foot[0],foot[1],62,66);
  var col=near?'#f2903f':'#c96a2b';
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=col;
  ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(hip[0],hip[1]);ctx.lineTo(knee[0],knee[1]);ctx.stroke();
  ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(knee[0],knee[1]);ctx.lineTo(foot[0],foot[1]);ctx.stroke();
  ctx.fillStyle=col;circle(knee[0],knee[1],6);ctx.fill();
  if(near){ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(knee[0]+2,knee[1]);ctx.lineTo(foot[0]+2,foot[1]-4);ctx.stroke();}
  // 蹼足
  ctx.save();ctx.translate(foot[0],foot[1]);ctx.rotate(lift*0.85);
  ctx.fillStyle=near?'#f7a04a':'#d07633';
  ctx.beginPath();ctx.moveTo(-8,-3);ctx.quadraticCurveTo(12,-7,32,-9);ctx.lineTo(36,-3);ctx.quadraticCurveTo(24,1,37,4);ctx.lineTo(33,9);ctx.quadraticCurveTo(14,7,-6,4);ctx.closePath();ctx.fill();
  ctx.strokeStyle=near?'#c86a26':'#9e5520';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(33,-7);ctx.moveTo(-4,1);ctx.lineTo(35,1);ctx.moveTo(-4,2);ctx.lineTo(32,8);ctx.stroke();
  ctx.restore();
}

    ctx.fillStyle='#5e3a1c';circle(nx,ny,2.2);ctx.fill();}
  ctx.fillStyle='#9aa1ab';circle(68,-370,5);ctx.fill();ctx.fillStyle='#5b5f68';circle(68,-370,2);ctx.fill();
  // 车灯眼睛（拟人）
  ctx.strokeStyle='#8a9099';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(68,-340);ctx.lineTo(78,-342);ctx.stroke();
  drawBikeEye();
  // 近侧曲柄
  drawCrank(ca,true);
}
function drawBikeEye(){
  var ex=84,ey=-343;
  ctx.fillStyle='#d8dde5';circle(ex,ey,11);ctx.fill();ctx.strokeStyle='#8a9099';ctx.lineWidth=1.5;ctx.stroke();
  var lensC=P.lamps>0.5?'#fff3b8':'#ffffff';ctx.fillStyle=lensC;circle(ex,ey,8);ctx.fill();
  var wk=st.wheelie>0;
  var look=[0.8,-0.5];
  if(fish.x!==null){var e=bikeToChar(ex,ey),vx=fish.x-e[0],vy=fish.y-e[1],l=Math.hypot(vx,vy)||1;look=[vx/l,vy/l];}
  if(wk){ctx.strokeStyle='#2a2230';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(ex,ey+2,4.5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  else{
    ctx.fillStyle='#22202a';circle(ex+look[0]*3.3,ey+look[1]*3.3,3.4);ctx.fill();
    ctx.fillStyle='#fff';circle(ex+look[0]*3.3-1.2,ey+look[1]*3.3-1.3,1.1);ctx.fill();
    var lid=st.bikeBlink>0?1:0.32;
    ctx.save();circle(ex,ey,8.4);ctx.clip();ctx.fillStyle='#e8533d';ctx.beginPath();
    ctx.moveTo(ex-9,ey-9);ctx.lineTo(ex+9,ey-9);ctx.lineTo(ex+9,ey-8+16*lid-2);ctx.lineTo(ex-9,ey-8+16*lid+2);ctx.closePath();ctx.fill();ctx.restore();}
  // 自信小眉毛
  ctx.strokeStyle='#2a2230';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex-8,ey-14);ctx.quadraticCurveTo(ex,ey-18,ex+8,ey-13);ctx.stroke();
}
function drawReins(){
  var g=bikeToBody(34,-389),c=geo.collar;if(!c)return;
  var mx=(g[0]+c[0])/2,my=(g[1]+c[1])/2+26+Math.sin(st.phase*2)*4;
  ctx.strokeStyle='#6b3e22';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(g[0],g[1]);ctx.quadraticCurveTo(mx,my,c[0],c[1]);ctx.stroke();
  ctx.strokeStyle='rgba(255,210,160,0.35)';ctx.lineWidth=1;ctx.stroke();
}
function drawFish(){
  if(fish.x===null)return;
  var tipL=rodTipLocal(),tip=bikeToChar(tipL[0],tipL[1]);
  if(fish.state==='hang'){ctx.strokeStyle=P.lamps>0.5?'rgba(230,235,255,0.6)':'rgba(255,255,255,0.75)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(fish.x,fish.y);ctx.stroke();}
  else{ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(tip[0],tip[1]+14);ctx.stroke();
    ctx.strokeStyle='#9aa1ab';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(tip[0]+3,tip[1]+16,3,0,Math.PI);ctx.stroke();}
  if(fish.state==='gone')return;
  var ang=fish.state==='hang'?Math.atan2(fish.y-tip[1],fish.x-tip[0])-Math.PI/2:fish.t*10;
  var sc=fish.state==='hang'?Math.min(1,fish.len/40+0.2):1;
  ctx.save();ctx.translate(fish.x,fish.y);ctx.rotate(ang+Math.sin(fish.wig)*0.25);ctx.scale(sc,sc);
  var g=ctx.createLinearGradient(-9,0,9,0);g.addColorStop(0,'#3d78ad');g.addColorStop(0.5,'#8fcbf0');g.addColorStop(1,'#d8f0ff');
  ctx.fillStyle=g;ctx.strokeStyle='#2c5f8e';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(0,14,9,17,0,0,TAU);ctx.fill();ctx.stroke();
  var tw=Math.sin(fish.wig*1.3)*5;
  ctx.fillStyle='#4f8fc4';ctx.beginPath();ctx.moveTo(0,29);ctx.lineTo(-10+tw,42);ctx.lineTo(10+tw,42);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,14);ctx.lineTo(-15,20);ctx.lineTo(-8,22);ctx.fill();
  ctx.fillStyle='#fff';circle(-3,5,3);ctx.fill();ctx.fillStyle='#111';circle(-3.4,5,1.6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(4,6);ctx.quadraticCurveTo(6,16,3,26);ctx.stroke();
  ctx.strokeStyle='#9aa1ab';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,-3,3,Math.PI,TAU*0.95);ctx.stroke();
  ctx.restore();
}
function drawCharacter(){
  ctx.save();ctx.translate(CX,GY);ctx.scale(S,S);
  ctx.fillStyle='rgba(0,0,0,'+(0.22-P.stars*0.06).toFixed(3)+')';ctx.beginPath();ctx.ellipse(28,2,165-st.bob*1.5,12,0,0,TAU);ctx.fill();
  drawLeg(geo.hipF,geo.footF,geo.liftF,false);
  drawLeg(geo.hipN,geo.footN,geo.liftN,true);
  ctx.save();ctx.translate(0,-170+st.bob);ctx.rotate(st.bodyRot);ctx.translate(0,170);
  drawWing(geo.wingF,true);drawTail();drawBody();drawNeck();drawHead();
  ctx.save();ctx.translate(BIKE_PIVOT_X,BIKE_PIVOT_Y+bikeRel());ctx.rotate(st.bikeRot);ctx.translate(-BIKE_PIVOT_X,-BIKE_PIVOT_Y);
  drawBike();ctx.restore();
  drawReins();drawWing(geo.wingN,false);
  ctx.restore();
  drawFish();
  ctx.restore();
}

/* =========================================================
   粒子 / 发光 / 气泡
   ========================================================= */
function heartPath(s){ctx.beginPath();ctx.moveTo(0,s*0.35);ctx.bezierCurveTo(-s*1.2,-s*0.4,-s*0.5,-s*1.2,0,-s*0.5);ctx.bezierCurveTo(s*0.5,-s*1.2,s*1.2,-s*0.4,0,s*0.35);ctx.closePath();}
function drawParticles(){
  for(var i=0;i<parts.length;i++){var p=parts[i],k=p.age/p.life,a=1-k;
    switch(p.type){
      case 'dust':ctx.fillStyle=rgb(mixc([245,226,196],[120,120,150],P.stars*0.6),(a*0.5).toFixed(3));circle(p.x,p.y,p.size*(1+k*1.8));ctx.fill();break;
      case 'sweat':ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='rgba(150,212,255,'+a.toFixed(3)+')';var s=p.size;
        ctx.beginPath();ctx.moveTo(0,-s*1.4);ctx.quadraticCurveTo(s,0,0,s);ctx.quadraticCurveTo(-s,0,0,-s*1.4);ctx.fill();ctx.restore();break;
      case 'feather':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,a*1.5);
        ctx.fillStyle='#fbf8f2';ctx.beginPath();ctx.ellipse(0,0,p.size*2.3,p.size*0.85,0,0,TAU);ctx.fill();
        ctx.strokeStyle='rgba(150,140,125,0.8)';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(-p.size*2.6,0);ctx.lineTo(p.size*2.2,0);ctx.stroke();ctx.restore();ctx.globalAlpha=1;break;
      case 'note':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.age*6)*0.3);ctx.globalAlpha=a;ctx.font='700 '+p.size+'px '+FONT;
        ctx.fillStyle='#ffd23f';ctx.strokeStyle='rgba(90,50,0,0.6)';ctx.lineWidth=3;ctx.strokeText(p.ch,0,0);ctx.fillText(p.ch,0,0);ctx.restore();ctx.globalAlpha=1;break;
      case 'ring':ctx.strokeStyle='rgba(255,226,110,'+(a*0.9).toFixed(3)+')';ctx.lineWidth=3*a+0.5;circle(p.x,p.y,p.size+ease(k)*p.grow);ctx.stroke();break;
      case 'heart':ctx.save();ctx.translate(p.x+Math.sin(p.age*5)*6,p.y);ctx.rotate(p.rot*0.3);ctx.globalAlpha=Math.min(1,a*1.6);ctx.fillStyle='#ff5d8f';heartPath(p.size);ctx.fill();ctx.restore();ctx.globalAlpha=1;break;
      case 'confetti':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.cos(p.rot*1.7));ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();ctx.globalAlpha=1;break;
      case 'speed':ctx.strokeStyle='rgba(255,255,255,'+(0.45*Math.sin(k*Math.PI)).toFixed(3)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.size,p.y);ctx.stroke();break;
    }}
}
function drawGlows(){
  var L=P.lamps;if(L<0.02)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var i=0;i<lampHeads.length;i++){var h=lampHeads[i],r=130*S;
    var g=ctx.createRadialGradient(h[0],h[1],2,h[0],h[1],r);g.addColorStop(0,'rgba(255,214,140,'+(0.55*L)+')');g.addColorStop(1,'rgba(255,180,90,0)');
    ctx.fillStyle=g;ctx.fillRect(h[0]-r,h[1]-r,r*2,r*2);
    var py=GY-4*S,pg=ctx.createRadialGradient(h[0],py,2,h[0],py,110*S);pg.addColorStop(0,'rgba(255,200,120,'+(0.28*L)+')');pg.addColorStop(1,'rgba(255,200,120,0)');
    ctx.save();ctx.translate(h[0],py);ctx.scale(1,0.28);ctx.translate(-h[0],-py);ctx.fillStyle=pg;ctx.fillRect(h[0]-110*S,py-110*S,220*S,220*S);ctx.restore();}
  for(var j=0;j<lhLamps.length;j++){var l=lhLamps[j];
    var lg=ctx.createRadialGradient(l[0],l[1],1,l[0],l[1],22*S);lg.addColorStop(0,'rgba(255,245,200,'+(0.9*L)+')');lg.addColorStop(1,'rgba(255,230,150,0)');ctx.fillStyle=lg;circle(l[0],l[1],22*S);ctx.fill();}
  // 自行车车灯光束
  var e=bikeToScreen(96,-343),ra=st.bikeRot+st.bodyRot,a0=0.3+ra,len2=560*S;
  var hg=ctx.createRadialGradient(e[0],e[1],4,e[0],e[1],len2);hg.addColorStop(0,'rgba(255,244,190,'+(0.26*L)+')');hg.addColorStop(1,'rgba(255,244,190,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(e[0],e[1]);ctx.lineTo(e[0]+Math.cos(a0-0.2)*len2,e[1]+Math.sin(a0-0.2)*len2);ctx.lineTo(e[0]+Math.cos(a0+0.2)*len2,e[1]+Math.sin(a0+0.2)*len2);ctx.closePath();ctx.fill();
  var eg=ctx.createRadialGradient(e[0],e[1],1,e[0],e[1],18*S);eg.addColorStop(0,'rgba(255,248,210,'+(0.35*L)+')');eg.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=eg;circle(e[0],e[1],18*S);ctx.fill();
  // 月亮柔光
  var sx=P.sunX*W,sy=P.sunY*H,r=P.sunR*Math.max(0.65,S)*2.4,mg=ctx.createRadialGradient(sx,sy,r*0.3,sx,sy,r);
  mg.addColorStop(0,'rgba(220,230,255,'+(0.25*P.stars)+')');mg.addColorStop(1,'rgba(220,230,255,0)');ctx.fillStyle=mg;circle(sx,sy,r);ctx.fill();
  ctx.restore();
}
function drawBubble(b,anchor,side,color){
  var k=b.t<0.22?backOut(b.t/0.22):1,a=b.t>b.dur-0.3?Math.max(0,(b.dur-b.t)/0.3):1;
  var fs=clamp(15*Math.max(S,0.85),13,19);ctx.font='700 '+fs+'px '+FONT;
  var tw=ctx.measureText(b.text).width,pw=tw+fs*2.3,ph=fs*2.2;
  var bx=clamp(anchor[0]+side*pw*0.3-pw/2,10,W-pw-10),by=Math.max(10,anchor[1]-ph-22*Math.max(S,0.7));
  ctx.save();ctx.globalAlpha=a;ctx.translate(anchor[0],anchor[1]);ctx.scale(k,k);ctx.translate(-anchor[0],-anchor[1]);
  ctx.shadowColor='rgba(0,0,0,0.22)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  ctx.fillStyle='rgba(255,255,255,0.97)';rr(bx,by,pw,ph,ph/2);ctx.fill();
  ctx.shadowColor='transparent';
  var tx=clamp(anchor[0],bx+ph*0.6,bx+pw-ph*0.6);
  ctx.beginPath();ctx.moveTo(tx-8,by+ph-1);ctx.lineTo(tx+8,by+ph-1);ctx.lineTo(anchor[0],anchor[1]);ctx.closePath();ctx.fill();
  ctx.fillStyle=color;rr(bx+fs*0.62,by+ph*0.3,3.5,ph*0.4,1.5);ctx.fill();
  ctx.fillStyle='#2a2438';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.text,bx+pw/2+fs*0.32,by+ph/2+1);
  ctx.restore();
}
function drawBubbles(){
  if(bubbles.bike)drawBubble(bubbles.bike,bikeToScreen(-34,-392),-1,'#e8533d');
  if(bubbles.pel)drawBubble(bubbles.pel,bodyToScreen(geo.hx-8,geo.hy-40),1,'#f29a3e');
}

/* =========================================================
   渲染主流程
   ========================================================= */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky();drawClouds();drawGulls();drawIsles();drawSea();
  drawBoardwalk();drawRocks();
  drawCharacter();
  drawParticles();
  if(P.tintA>0.003){ctx.fillStyle=rgb(P.tint,P.tintA.toFixed(3));ctx.fillRect(0,0,W,H);}
  drawGlows();
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
  drawBubbles();
}

/* =========================================================
   HUD 更新
   ========================================================= */
var hudT=0,MOODTXT={normal:'😄 精神抖擞',scared:'😱 受惊狂奔！',happy:'😋 吃饱啦，满血！',exhausted:'🥵 累趴了，快喂鱼',dash:'🔥 全力冲刺中',tired:'😮‍💨 气喘吁吁',ouch:'😣 硌到脚了'};
function updateHUD(dt){
  hudT-=dt;
  $('stam').style.width=st.stamina.toFixed(1)+'%';
  $('dash').style.setProperty('--cd',(st.dashCD/4.5).toFixed(3));
  if(hudT>0)return;hudT=0.1;
  var bar=$('stamBar');bar.classList.toggle('mid',st.stamina<=60&&st.stamina>30);bar.classList.toggle('low',st.stamina<=30);
  $('stamTxt').textContent=Math.round(st.stamina)+'%';
  $('kmh').innerHTML=Math.round(st.v/630*42)+'<small>km/h</small>';
  var m=st.dist*0.019;$('dist').innerHTML=(m<1000?Math.round(m)+'<small>m</small>':(m/1000).toFixed(2)+'<small>km</small>');
  $('mood').textContent=MOODTXT[mood()];
  $('dash').classList.toggle('cool',st.dashCD>0);
  $('feed').classList.toggle('wait',!(fish.state==='hang'&&fish.len>=88));
}

/* =========================================================
   事件绑定
   ========================================================= */
function onBtn(id,fn){$(id).addEventListener('click',function(e){fn();e.currentTarget.blur();});}
onBtn('bell',ringBell);onBtn('dash',doDash);onBtn('feed',feedFish);onBtn('snd',toggleSound);
$('spd').addEventListener('input',function(e){setSpeed(+e.target.value);unlockAudio();});
$('tod').addEventListener('click',function(e){var b=e.target.closest('button');if(b){setTod(+b.dataset.v);unlockAudio();b.blur();}});
$('road').addEventListener('click',function(e){var b=e.target.closest('button');if(b){setRoad(+b.dataset.v);unlockAudio();b.blur();}});
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)ringBell();return;}
  if(e.repeat)return;
  if(k==='d'||e.key==='Shift')doDash();
  else if(k==='f')feedFish();
  else if(k==='t'||k==='n')setTod((tod+1)%3);
  else if(k==='r')setRoad(st.road?0:1);
  else if(k==='m')toggleSound();
  else if(k==='arrowup'||k==='='||k==='+')setSpeed(Math.min(10,st.slider+1));
  else if(k==='arrowdown'||k==='-')setSpeed(Math.max(1,st.slider-1));
});
cv.addEventListener('pointerdown',function(e){
  unlockAudio();
  var lx=(e.clientX-CX)/S,ly=(e.clientY-GY)/S;
  if(fish.state==='hang'&&fish.x!==null&&Math.hypot(lx-fish.x,ly-(fish.y+14))<38){
    fish.px=fish.x-rand(8,14)*(Math.random()<0.5?-1:1);fish.py=fish.y+4;blip(1200,800,0.08,0.12);
    if(Math.random()<0.5)say('pel','鱼！鱼在动！',1.8);return;}
  var bt=bikeToChar(0,-300);
  if(lx>bt[0]-150&&lx<bt[0]+160&&ly<bt[1]+52&&ly>bt[1]-160){ringBell();if(Math.random()<0.35)say('bike',LINES.bikePoke[0],1.8);return;}
  if(lx>-190&&lx<420&&ly>-370&&ly<10){pokePelican();return;}
});

/* =========================================================
   主循环
   ========================================================= */
var last=0;
function frame(now){
  var t=now/1000,dt=last?Math.min(0.05,t-last):0.016;last=t;
  if(dt>0){var steps=dt>0.025?2:1;for(var i=0;i<steps;i++)update(dt/steps);}
  render();updateHUD(dt);
  requestAnimationFrame(frame);
}
setSpeed(5);
st.v=80+5*55;
setTimeout(function(){say('bike','出发！今天轮到我骑你啦～',3);},600);
setTimeout(function(){say('pel','……这世界到底怎么了？',3);},2400);
setTimeout(function(){$('toast').classList.add('show');},1200);
setTimeout(function(){$('toast').classList.remove('show');},7500);
document.addEventListener('visibilitychange',function(){last=0;});
requestAnimationFrame(frame);
})();
</script>
