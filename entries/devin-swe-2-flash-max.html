<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹈鹕骑行大赛 · A Bicycle Riding a Pelican</title>
<style>
:root{--acc:#ff7a59;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;background:#0b1120;color:#eef2f8;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block}
.card{background:rgba(10,16,28,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.13);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#top{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#top .card{pointer-events:auto}
#titleCard{padding:12px 16px;max-width:330px;cursor:pointer}
#titleCard h1{font-size:19px;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
#titleCard h1 em{font-style:normal;font-size:11px;color:#8fb7d9;letter-spacing:1px}
#titleCard .sub{font-size:11px;color:#9fb0c6;margin-top:3px}
#titleCard .stats{display:flex;gap:14px;margin-top:7px;font-size:13px;font-weight:600}
#titleCard .stats b{color:var(--gold);font-variant-numeric:tabular-nums}
#stamCard{padding:10px 14px;width:196px}
#stamCard .lbl{display:flex;justify-content:space-between;font-size:11px;color:#aebdd2;margin-bottom:5px}
#stamCard .lbl span:last-child{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#stamFill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#57c785,#ffd166 55%,#ff7a59);transition:width .2s}
#status{margin-top:6px;font-size:11px;color:#cdd9ea;min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;z-index:6;max-width:96vw}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 12px;border-radius:13px;background:rgba(12,19,34,.62);border:1px solid rgba(255,255,255,.14);color:#e9eef7;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .12s,background .15s,border-color .15s,opacity .2s;font-family:inherit}
.btn:hover{transform:translateY(-2px);background:rgba(30,42,66,.78);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.94)}
.btn.on{border-color:var(--acc);background:rgba(255,122,89,.18);box-shadow:inset 0 0 0 1px rgba(255,122,89,.4)}
.btn svg{width:20px;height:20px;display:block}
.btn i{font-style:normal;font-size:10px;letter-spacing:.5px;color:#bcc9dc}
.btn.on i{color:#ffd7c9}
.spd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 14px;border-radius:13px;background:rgba(12,19,34,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);min-width:158px}
.spd label{font-size:10px;color:#bcc9dc;letter-spacing:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:4px;border-radius:99px;background:linear-gradient(90deg,#3f6f9f,#ff7a59);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
#hint{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:10px;color:rgba(220,230,245,.5);z-index:5;pointer-events:none;text-align:right;line-height:1.8}
@media(max-width:680px){#titleCard{max-width:252px;padding:10px 12px}#titleCard h1{font-size:16px}.sub{display:none}#stamCard{width:152px;padding:8px 10px}#dock{gap:6px}.btn{padding:7px 9px}.spd{min-width:126px;padding:7px 10px}input[type=range]{width:104px}#hint{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="card" id="titleCard">
    <h1>鹈鹕骑行大赛<em>PELICAN GP</em></h1>
    <div class="sub">一辆自行车，正在骑一只鹈鹕</div>
    <div class="stats"><span>里程 <b id="dist">0.00</b> km</span><span>时速 <b id="kmh">0</b> km/h</span></div>
  </div>
  <div class="card" id="stamCard">
    <div class="lbl"><span>鹈鹕体力</span><span id="stamPct">100%</span></div>
    <div class="bar"><div id="stamFill"></div></div>
    <div id="status">全力以赴！</div>
  </div>
</div>
<div id="dock">
  <button class="btn" id="btnBell"><span id="icBell"></span><i>车铃</i></button>
  <button class="btn" id="btnFish"><span id="icFish"></span><i>喂鱼</i></button>
  <button class="btn" id="btnSprint"><span id="icBolt"></span><i>冲刺</i></button>
  <div class="spd"><label>速 度</label><input type="range" id="spd" min="0" max="100" value="34"></div>
  <button class="btn on" id="btnMode"><span id="icMode"></span><i id="lbMode">白天</i></button>
  <button class="btn" id="btnRoad"><span id="icRoad"></span><i id="lbRoad">平路</i></button>
</div>
<div id="hint">空格=车铃 · F=喂鱼 · 按住 S=冲刺 · M=时段 · R=路况<br>点击画面里的铃铛或鹈鹕试试</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,$=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const lerpC=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const css=(c,a)=>a===undefined?'rgb('+ (c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')':'rgba('+ (c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- 视口 ---------- */
let W=0,H=0,DPR=1,SC=1,DW=0,GY=600,SUBJX=400,SS=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 SC=H/760;DW=W/SC;GY=600;
 SS=clamp(DW/660,.5,1.12);
 SUBJX=clamp(DW*.42,16+118*SS,DW-16-272*SS);}
addEventListener('resize',resize);resize();

/* ---------- 调色板 ---------- */
const MODES={
 day:{skyT:[86,178,214],skyB:[206,236,244],seaT:[42,126,164],seaB:[104,186,204],hill:[168,205,220],
  cloud:[255,255,255],cloudA:.85,sunX:.76,sunY:140,sunR:46,sunC:[255,238,170],sunA:1,
  moonX:.78,moonY:132,moonR:30,moonA:0,stars:0,night:0,warm:0},
 dusk:{skyT:[56,54,108],skyB:[255,164,120],seaT:[72,70,122],seaB:[226,140,110],hill:[150,120,140],
  cloud:[255,205,175],cloudA:.6,sunX:.73,sunY:452,sunR:62,sunC:[255,140,72],sunA:1,
  moonX:.82,moonY:118,moonR:30,moonA:.4,stars:.4,night:.18,warm:.12},
 night:{skyT:[7,11,36],skyB:[30,46,84],seaT:[10,24,54],seaB:[34,62,98],hill:[60,80,110],
  cloud:[130,148,196],cloudA:.32,sunX:.76,sunY:-60,sunR:40,sunC:[255,220,150],sunA:0,
  moonX:.76,moonY:130,moonR:34,moonA:1,stars:1,night:.36,warm:0}
};
const pal={};(function(){for(const k in MODES.day){const v=MODES.day[k];pal[k]=Array.isArray(v)?v.slice():v;}})();

/* ---------- 状态 ---------- */
const S={t:0,spd:34,stamina:100,sprint:false,mode:'day',road:'deck',scare:0,gulp:0,poke:0,
 blinkT:2,fishCD:0,fish:null,hopY:0,hopV:0,scroll:0,distM:0,prevSteps:0,
 msg:{text:'',until:0},bellShake:0,bellPos:{x:0,y:0},shades:false,shadeN:0,shadeT:0,
 lookX:0,lookY:0};
const P={runPhase:0,bob:0,tilt:0,wingA:0,wingBase:0,wingAmp:0,spF:1,headBobX:0,headBobY:0,
 headTilt:0,beakOpen:0,wheelA:0,crankA:0,bikeOX:-16,bikeOY:-84,be:0,bikeBounceY:0,
 feet:[{x:-16,y:176},{x:-34,y:173}]};
const pouch={a:0,v:0};
const parts=[]; // 粒子
const clouds=[],stars=[],flies=[];
for(let i=0;i<7;i++)clouds.push({fx:hash(i*3.1),fy:.06+hash(i*7.7)*.24,s:.55+hash(i*5.3)*.8,v:.04+hash(i*9.1)*.08});
for(let i=0;i<110;i++)stars.push({fx:hash(i*1.7),fy:hash(i*2.9)*.58,r:.5+hash(i*4.3)*1.3,ph:hash(i*6.1)*TAU,sp:.6+hash(i*8.8)*1.6});
for(let i=0;i<16;i++)flies.push({fx:hash(i*11.3),fy:.45+hash(i*13.7)*.5,ph:hash(i*17.1)*TAU,sp:.5+hash(i*19.9)});

function setMsg(t,d){S.msg.text=t;S.msg.until=S.t+(d||1.8);}

/* ---------- 音频 ---------- */
let AC=null,master=null,windGain=null,windFilter=null;
function ensureAudio(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  windFilter=AC.createBiquadFilter();windFilter.type='bandpass';windFilter.frequency.value=420;windFilter.Q.value=.6;
  windGain=AC.createGain();windGain.gain.value=0;
  src.connect(windFilter);windFilter.connect(windGain);windGain.connect(master);src.start();
 }catch(e){AC=null;}}
 if(AC&&AC.state==='suspended')AC.resume();}
function tone(f0,f1,dur,type,vol,when){const t=AC.currentTime+(when||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function bellSound(){if(!AC)return;for(let s=0;s<3;s++){const w=s*.17;
 [[2093,1],[3136,.42],[4186,.16]].forEach(p=>tone(p[0]*(1+Math.random()*.004),p[0]*.985,.95,'sine',.16*p[1],w));}}
function gulpSound(){if(!AC)return;tone(560,180,.14,'sine',.3,0);tone(340,140,.16,'sine',.26,.1);}
function quack(){if(!AC)return;tone(300,150,.1,'sawtooth',.05,0);tone(240,120,.12,'sawtooth',.05,.12);}

/* ---------- 输入 ---------- */
const ICON={
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4a5.5 5.5 0 0 0-5.5 5.5V13l-1.8 3.7h14.6L17.5 13V9.5A5.5 5.5 0 0 0 12 4z"/><path d="M10 19.6a2 2 0 0 0 4 0"/><circle cx="12" cy="7.2" r="1" fill="currentColor" stroke="none"/></svg>',
 fish:'<svg viewBox="0 0 24 24"><path d="M7.5 12c2.4-3.8 6.2-5.6 10.4-5.6 1.7 0 3 .5 3.8 1.2v9.4c-.8.7-2.1 1.2-3.8 1.2-4.2 0-8-1.8-10.4-5.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 12 4 9.4v5.2z" fill="currentColor"/><circle cx="17" cy="10.4" r="1" fill="currentColor"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2 5 13.4h5.4L9.6 22l8.8-12h-5.6l.4-8z"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>',
 dusk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a3.4 3.4 0 0 1 3.4 3.4H8.6A3.4 3.4 0 0 1 12 9z"/><path d="M4 18h16M7 21h10"/><path d="M18.5 4.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 13.2A8.6 8.6 0 0 1 10.8 3.6a8.6 8.6 0 1 0 9.6 9.6z"/></svg>',
 roadFlat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V9M20 20V9M4 9h16"/><path d="M8.5 20v-4M12 20v-4M15.5 20v-4" opacity=".55"/></svg>',
 roadBumpy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18c2.5-5 5 5 7.5 0s5 5 7.5 0 3.5-3 3-3"/><path d="M4 21.5h16" opacity=".5"/></svg>'};
const MODES_LB=['白天','黄昏','夜晚'],MODES_IC=[ICON.sun,ICON.dusk,ICON.moon];
let modeIdx=0;
function refreshModeBtn(){ $('icMode').innerHTML=MODES_IC[modeIdx];$('lbMode').textContent=MODES_LB[modeIdx];$('btnMode').classList.add('on');}
function refreshRoadBtn(){$('icRoad').innerHTML=S.road==='deck'?ICON.roadFlat:ICON.roadBumpy;$('lbRoad').textContent=S.road==='deck'?'平路':'石子路';$('btnRoad').classList.toggle('on',S.road==='cobble');}
$('icBell').innerHTML=ICON.bell;$('icFish').innerHTML=ICON.fish;$('icBolt').innerHTML=ICON.bolt;
refreshModeBtn();refreshRoadBtn();

function ringBell(){ensureAudio();S.scare=1.45;S.bellShake=.7;
 if(S.hopY>=0){S.hopY=-24;S.hopV=-560;}
 if(S.bellPos.x){for(let i=0;i<3;i++)parts.push({t:'ring',x:S.bellPos.x,y:S.bellPos.y,r:8,vr:240+i*60,a:.7});
  for(let i=0;i<3;i++)parts.push({t:'note',x:S.bellPos.x+8,y:S.bellPos.y-6,vx:20+Math.random()*30,vy:-60-Math.random()*30,life:1.1+Math.random()*.3,rot:(Math.random()-.5)*.4});}
 bellSound();setMsg('叮铃铃——！鹈鹕受惊加速！',1.6);}
function feedFish(){ensureAudio();if(S.fishCD>0||S.fish)return;S.fishCD=2.2;
 S.fish={t:0,dur:.75,sx:DW+50,sy:505+hash(S.t*7)*30};
 setMsg('小鱼来袭——接住！',1.2);}
function cycleMode(){modeIdx=(modeIdx+1)%3;S.mode=['day','dusk','night'][modeIdx];refreshModeBtn();
 setMsg(['阳光明媚的白天','夕阳西下的黄昏','星空下的夜晚'][modeIdx]+' · 鹈鹕继续赶路',1.8);}
function toggleRoad(){S.road=S.road==='deck'?'cobble':'deck';refreshRoadBtn();
 setMsg(S.road==='deck'?'回到平整木栈道':'切换到颠簸石子路，注意减速！',1.8);}
function poke(){ensureAudio();S.poke=.7;S.blinkT=.1;
 if(S.hopY>=0){S.hopY=-8;S.hopV=-170;}
 const h=subjPoint(120,-160);
 for(let i=0;i<4;i++)parts.push({t:'feather',x:h.x+(Math.random()-.5)*50,y:h.y-10,vx:-(40+Math.random()*60),vy:-30-Math.random()*40,life:.9,rot:Math.random()*TAU,vr:(Math.random()-.5)*6});
 quack();setMsg('哼！别戳我！',1.3);}
function toggleShades(){S.shades=!S.shades;setMsg(S.shades?'墨镜已戴上：鹈鹕太酷了':'墨镜摘下，恢复本色',1.6);}

$('btnBell').addEventListener('click',()=>{ringBell();});
$('btnFish').addEventListener('click',()=>{feedFish();});
$('btnSprint').addEventListener('pointerdown',e=>{ensureAudio();S.sprint=true;$('btnSprint').classList.add('on');e.preventDefault();});
addEventListener('pointerup',()=>{S.sprint=false;$('btnSprint').classList.remove('on');});
$('btnSprint').addEventListener('pointerleave',()=>{S.sprint=false;$('btnSprint').classList.remove('on');});
$('btnMode').addEventListener('click',()=>{ensureAudio();cycleMode();});
$('btnRoad').addEventListener('click',()=>{ensureAudio();toggleRoad();});
$('spd').addEventListener('input',e=>{S.spd=+e.target.value;});
addEventListener('keydown',e=>{
 if(e.repeat)return;ensureAudio();
 if(e.code==='Space'||e.code==='KeyB'){e.preventDefault();ringBell();}
 else if(e.code==='KeyF')feedFish();
 else if(e.code==='KeyM')cycleMode();
 else if(e.code==='KeyR')toggleRoad();
 else if(e.code==='KeyC')toggleShades();
 else if(e.code==='KeyS'||e.code==='ShiftLeft'||e.code==='ShiftRight')S.sprint=true;
});
addEventListener('keyup',e=>{if(e.code==='KeyS'||e.code==='ShiftLeft'||e.code==='ShiftRight'){S.sprint=false;$('btnSprint').classList.remove('on');}});
$('titleCard').addEventListener('pointerdown',()=>{S.shadeN++;S.shadeT=S.t;
 if(S.shadeN>=5&&S.t-S.shadeT<1.4){toggleShades();S.shadeN=0;}});
setInterval(()=>{if(S.t-S.shadeT>1.4)S.shadeN=0;},300);
cv.addEventListener('pointerdown',e=>{
 ensureAudio();const r=cv.getBoundingClientRect();
 const px=(e.clientX-r.left)/r.width*DW,py=(e.clientY-r.top)/r.height*760;
 const b=S.bellPos;
 if(b.x&&Math.hypot(px-b.x,py-b.y)<20*SS+8){ringBell();return;}
 const c1=subjPoint(-5,-15),c2=subjPoint(118,-160),c3=subjPoint(210,-148);
 if(Math.hypot(px-c1.x,py-c1.y)<115*SS||Math.hypot(px-c2.x,py-c2.y)<60*SS||Math.hypot(px-c3.x,py-c3.y)<48*SS)poke();
});

/* ---------- 坐标换算 ---------- */
function subjPoint(lx,ly){const c=Math.cos(P.tilt),s=Math.sin(P.tilt);
 const X=lx*c-ly*s,Y=lx*s+ly*c;
 return{x:SUBJX+SS*X,y:GY+worldBump+S.hopY+SS*(Y-168+P.bob)};}
function bikeToPelican(blx,bly){const c=Math.cos(P.be),s=Math.sin(P.be);
 return{x:P.bikeOX+blx*c-bly*s,y:P.bikeOY+blx*s+bly*c};}

/* ---------- 更新 ---------- */
let worldBump=0;
function update(dt){
 const k=1-Math.exp(-2.4*dt),tg=MODES[S.mode];
 for(const key in pal){const v=tg[key];
  if(Array.isArray(v))pal[key]=lerpC(pal[key],v,k);else pal[key]=lerp(pal[key],v,k);}
 S.t+=dt;S.fishCD-=dt;S.scare=Math.max(0,S.scare-dt*.55);S.gulp=Math.max(0,S.gulp-dt);
 S.poke=Math.max(0,S.poke-dt);S.bellShake=Math.max(0,S.bellShake-dt*2.2);
 const gph=S.gulp>0?1-S.gulp/.95:0;
 P.beakOpen=S.gulp>0?Math.max(0,Math.sin(gph*Math.PI*3)*.55*(1-gph*.5)):0;
 S.msg.until<S.t&&(S.msg.text='');
 // 速度与体力
 const sliderV=90+S.spd*6.3;let v=sliderV*(S.sprint?1.5:1)*(1+Math.min(S.scare,1.4)*.1);
 if(S.stamina<20)v=Math.min(v,190+S.stamina*6);
 if(S.road==='cobble')v*=.93;
 S.v=v;
 const drain=Math.pow(v/360,2)*1.7+(S.sprint?1.1:0);
 if(v<140)S.stamina+=5*dt;else S.stamina-=drain*dt;
 S.stamina=clamp(S.stamina,0,100);
 S.scroll+=v*dt;S.distM+=v*dt*.014;
 // 跑姿动力学
 P.spF=clamp(v/330,.45,1.7);
 P.runPhase+=dt*v/100*Math.PI;
 P.bob=-Math.pow(Math.abs(Math.sin(P.runPhase)),.8)*7*P.spF+Math.sin(P.runPhase*2)*1.3*P.spF;

function drawLeg(hx,hy,idx,far){

 const fr=.28*Math.sin(a)+(far?-.06:0);
 const knee=solveKnee(hx,hy,fx,fy,60,80);

 ctx.strokeStyle=far?'#dccdaa':'#f0e2c8';ctx.lineWidth=far?11:13;
 ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(knee.x,knee.y);ctx.stroke();
 ctx.strokeStyle=far?'#cf7430':'#ef8f3c';ctx.lineWidth=far?6:7;
 ctx.beginPath();ctx.moveTo(knee.x,knee.y);ctx.lineTo(fx,fy);ctx.stroke();

function solveKnee(hx,hy,fx,fy,L1,L2){
 let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy);d=Math.min(d,L1+L2-.5);
 const a1=Math.atan2(dy,dx),cA=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1),A=Math.acos(cA);
 const k1={x:hx+L1*Math.cos(a1+A),y:hy+L1*Math.sin(a1+A)};
 const k2={x:hx+L1*Math.cos(a1-A),y:hy+L1*Math.sin(a1-A)};
 return k1.x<k2.x?k1:k2;}

function drawParts(){

function drawFireflies(){

/* ---------- HUD ---------- */
let hudT=0;
function updateHUD(dt){
 hudT-=dt;if(hudT>0)return;hudT=.1;

 $('dist').textContent=(S.distM/1000).toFixed(2);
 $('kmh').textContent=Math.round((S.v||0)*.0504);
 $('stamPct').textContent=Math.round(S.stamina)+'%';
 $('stamFill').style.width=S.stamina+'%';
 $('btnFish').style.opacity=S.fishCD>0?.5:1;
 let txt=S.msg.text;
 if(!txt){
  if(S.stamina<15)txt='体力耗尽……快投喂小鱼！';
  else if(S.stamina<35)txt='有点累了，节奏放缓…';
  else if(S.sprint&&S.stamina>20)txt='全力冲刺！';
  else txt=['状态绝佳！','鹈鹕引擎全开','一路顺风！','蹄下生风，继续加油','这姿势相当专业'][Math.floor(S.t/4)%5];}
 $('status').textContent=txt;
}

/* ---------- 渲染 ---------- */
function render(){
 ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
 drawSky();drawSea();drawSpeedLines();drawGround();drawSubject();drawParts();
 if(pal.night>.02)ctx.fillStyle='rgba(6,10,32,'+(pal.night*.3)+')';
 else if(pal.warm>.02)ctx.fillStyle='rgba(255,110,50,'+(pal.warm*.09)+')';
 else ctx.fillStyle='rgba(0,0,0,0)';
 if(pal.night>.02||pal.warm>.02)ctx.fillRect(0,0,DW,760);

 const vg=ctx.createRadialGradient(DW/2,380,Math.min(DW,760)*.42,DW/2,400,Math.max(DW,760)*.78);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(5,8,20,.3)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,DW,760);
}
let last=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-last)/1000||.016);last=now;
 update(dt);render();updateHUD(dt);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
