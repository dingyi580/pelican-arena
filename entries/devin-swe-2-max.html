<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一辆自行车正在骑一只鹈鹕</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0e1526;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#title{position:fixed;top:18px;left:22px;color:#fff;text-shadow:0 2px 12px rgba(0,20,40,.45);pointer-events:none;user-select:none}
#title h1{font-size:22px;font-weight:800;letter-spacing:1px}
#title p{font-size:12px;opacity:.85;margin-top:4px}
#hint{position:fixed;right:20px;top:18px;font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,20,40,.5);text-align:right;user-select:none;pointer-events:none;line-height:1.8}
@media(max-width:680px){#hint{display:none}}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(10,20,40,.25);border:1px solid rgba(255,255,255,.7);user-select:none}
button{border:none;cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:#2a3a4a;background:#fff;padding:9px 15px;border-radius:999px;box-shadow:0 2px 6px rgba(20,40,60,.14),inset 0 0 0 1px rgba(20,40,60,.06);transition:transform .12s,box-shadow .12s,opacity .2s}
button:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(20,40,60,.18),inset 0 0 0 1px rgba(20,40,60,.06)}
button:active{transform:translateY(1px) scale(.97)}
button.tired{opacity:.45}
.ctl{display:flex;align-items:center;gap:7px;font-size:12px;color:#52606e;font-weight:600}
input[type=range]{width:118px;accent-color:#2e8f85}
#kmh{min-width:58px;font-variant-numeric:tabular-nums;font-size:12px;color:#52606e;text-align:right}
.stam{display:flex;align-items:center;gap:7px;font-size:12px;color:#52606e;font-weight:600}
.stam .tr{width:92px;height:9px;border-radius:99px;background:rgba(20,40,60,.12);overflow:hidden}
.stam .fl{display:block;height:100%;width:80%;border-radius:99px;background:linear-gradient(90deg,#ff9d5c,#7ed47e);transition:width .15s}
.stam.flash .tr{animation:fl .45s}
@keyframes fl{50%{background:rgba(230,80,60,.55)}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="title"><h1>🚲 一辆自行车正在骑一只鹈鹕</h1><p>A Bicycle Riding a Pelican · 鹈鹕牌生物动力座驾 · 百公里油耗两条小鱼</p></div>
<div id="hint">空格 / 🔔：叮铃！<br>点击鹈鹕：戳它一下<br>🐟 喂鱼可恢复体力</div>
<div id="dock">
  <button id="bBell">🔔 按车铃</button>
  <button id="bFeed">🐟 喂小鱼</button>
  <button id="bSprint">⚡ 冲刺</button>
  <span class="ctl">速度<input id="rSpeed" type="range" min="0" max="100" value="45"></span>
  <span id="kmh">23 km/h</span>
  <button id="bTod">☀️ 白天</button>
  <button id="bRoad">🛤️ 木栈道</button>
  <span class="stam">体力<span class="tr"><span class="fl" id="stFl"></span></span></span>
  <button id="bMute">🔊</button>
</div>
<script>
'use strict';
/* ================= 画布与坐标 ================= */
const cv=document.getElementById('stage'),g=cv.getContext('2d');
const VH=900,GROUND=VH*0.78,DECK=GROUND-40,HORIZON=VH*0.60;
let W=0,H=0,DPR=1,SC=1,VW=1600;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  SC=H/VH;VW=W/SC;
}
window.addEventListener('resize',resize);resize();
const CXF=0.44;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t*t*(3-2*t);
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const mixc=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
const css=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a===undefined?1:a})`;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ================= 时段配色 ================= */
const PALS=[
 {skyT:[122,199,235],skyB:[226,245,248],sun:[255,213,90],sunY:.15,seaA:[122,196,216],seaB:[58,138,182],deck:[206,165,110],deckL:[152,112,72],rail:[151,120,88],cloud:[255,255,255],star:0,night:0,boat:[255,255,255]},
 {skyT:[96,76,148],skyB:[247,178,112],sun:[255,148,84],sunY:.40,seaA:[186,124,112],seaB:[96,72,116],deck:[150,106,80],deckL:[104,72,54],rail:[112,82,70],cloud:[255,196,170],star:.15,night:.25,boat:[255,230,210]},
 {skyT:[13,21,50],skyB:[35,48,90],sun:[238,240,226],sunY:.18,seaA:[30,50,82],seaB:[16,30,58],deck:[72,62,60],deckL:[46,40,40],rail:[62,54,56],cloud:[54,66,104],star:1,night:1,boat:[200,208,224]}
];
let modePos=0,modeT=0;
function pal(k){const m=clamp(modePos,0,2),i=Math.min(1,m|0),f=m-i;return mixc(PALS[i][k],PALS[i+1][k],f);}
function palN(k){const m=clamp(modePos,0,2),i=Math.min(1,m|0),f=m-i;return lerp(PALS[i][k],PALS[i+1][k],f);}

/* ================= 状态 ================= */
const S={t:0,speed:180,sliderV:45,boost:0,sprintT:0,stamina:85,
 dist:0,phase:0,wing:0,joltY:0,joltV:0,bumpT:0,pouch:0,pouchV:0,
 bobY:0,prevBob:0,bobVel:0,lean:0,prevSpeed:180,
 startle:0,bellShake:0,gulp:0,happyT:0,pokeT:0,pokeX:0,pokeY:0,
 road:0,muted:false,feedCD:0,sweatT:0,feathT:1,streakT:0};
let fish=null;
const dust=[],feathers=[],sweats=[],hearts=[],streaks=[];
const stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random(),y:Math.random()*.52,r:rnd(.6,1.9),p:rnd(6.28)});
const clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random(),y:rnd(.05,.34),s:rnd(.7,1.5),v:rnd(.6,1)});

/* ================= 合成音效 ================= */
let AC=null,gestured=false;
function ac(){if(!AC){if(!gestured)return null;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
document.addEventListener('pointerdown',()=>{gestured=true;});
document.addEventListener('keydown',()=>{gestured=true;});
function tone(f0,f1,dur,type,vol,when){
 const c=ac();if(!c||S.muted)return;const T=c.currentTime+(when||0);
 const o=c.createOscillator(),gn=c.createGain();
 o.type=type;o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),T+dur);
 gn.gain.setValueAtTime(0.0001,T);gn.gain.exponentialRampToValueAtTime(vol,T+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,T+dur);
 o.connect(gn);gn.connect(c.destination);o.start(T);o.stop(T+dur+0.05);
}
function noise(dur,vol,fq,type,when){
 const c=ac();if(!c||S.muted)return;const T=c.currentTime+(when||0);
 const len=(c.sampleRate*dur)|0,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const src=c.createBufferSource();src.buffer=buf;
 const fl=c.createBiquadFilter();fl.type=type||'lowpass';fl.frequency.value=fq;
 const gn=c.createGain();gn.gain.setValueAtTime(vol,T);gn.gain.exponentialRampToValueAtTime(0.0001,T+dur);
 src.connect(fl);fl.connect(gn);gn.connect(c.destination);src.start(T);src.stop(T+dur);
}
function sndBell(){if(S.muted)return;tone(1560,1560,.55,'sine',.4);tone(2339,2339,.4,'sine',.15);tone(1560,1560,.5,'sine',.3,.16);tone(2339,2339,.35,'sine',.1,.16);}
function sndGulp(){tone(420,140,.22,'sine',.3);tone(300,90,.12,'square',.06,.05);}
function sndSquawk(){tone(320,150,.2,'sawtooth',.1);noise(.15,.06,900,'bandpass');}
function sndWhoosh(){noise(.5,.14,700,'bandpass');}
function sndStep(){noise(.05,.05,420,'lowpass');tone(95,60,.06,'sine',.05);}

/* ================= 交互 ================= */
const stFl=document.getElementById('stFl'),kmh=document.getElementById('kmh');
const bBell=document.getElementById('bBell'),bFeed=document.getElementById('bFeed'),
      bSprint=document.getElementById('bSprint'),bTod=document.getElementById('bTod'),
      bRoad=document.getElementById('bRoad'),bMute=document.getElementById('bMute'),
      rSpeed=document.getElementById('rSpeed');
function ringBell(){
 sndBell();S.bellShake=1;S.startle=1;S.boost+=140;S.pouchV+=rnd(-30,30);
 for(let i=0;i<6;i++)spawnFeather();
}
function feed(){
 if(fish||S.feedCD>0)return;
 S.feedCD=1.2;
 fish={t:0,x0:VW*0.99,y0:HORIZON+36,x1:0,y1:0,cx:0,cy:0};
}
function trySprint(){
 if(S.sprintT>0)return;
 if(S.stamina>14){S.sprintT=2.5;sndWhoosh();}
 else{const st=document.querySelector('.stam');st.classList.add('flash');setTimeout(()=>st.classList.remove('flash'),460);}
}
const todNames=['☀️ 白天','🌆 黄昏','🌙 夜晚'];
function cycTod(){modeT=(modeT+1)%3;bTod.textContent=todNames[modeT];}
function togRoad(){S.road^=1;bRoad.textContent=S.road?'🪨 石子路':'🛤️ 木栈道';}
function togMute(){S.muted=!S.muted;bMute.textContent=S.muted?'🔇':'🔊';}
bBell.addEventListener('click',()=>{ringBell();bBell.blur();});
bFeed.addEventListener('click',()=>{feed();bFeed.blur();});
bSprint.addEventListener('click',()=>{trySprint();bSprint.blur();});
bTod.addEventListener('click',()=>{cycTod();bTod.blur();});
bRoad.addEventListener('click',()=>{togRoad();bRoad.blur();});
bMute.addEventListener('click',()=>{togMute();bMute.blur();});
rSpeed.addEventListener('input',()=>{S.sliderV=+rSpeed.value;});
cv.addEventListener('pointerdown',e=>{
 const wx=e.clientX/SC,wy=e.clientY/SC,cx=VW*CXF;
 if(wx>cx-260&&wx<cx+330&&wy>GROUND-370&&wy<GROUND+30){
   S.pokeT=1;S.startle=Math.max(S.startle,.55);S.pokeX=wx;S.pokeY=wy;
   S.pouchV+=rnd(-24,24);sndSquawk();spawnFeather();
 }
});
document.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();ringBell();}
 else if(e.key==='f'||e.key==='F')feed();
 else if(e.key==='s'||e.key==='S')trySprint();
});

/* ================= 粒子 ================= */
function headWorld(){const cx=VW*CXF;return[cx+135,GROUND+S.bobY+S.joltY-300];}
function spawnFeather(){
 const cx=VW*CXF;
 feathers.push({x:cx+rnd(-140,40),y:GROUND+S.bobY-160+rnd(-40,40),
  vx:-S.speed*.3-rnd(10,40),vy:rnd(-30,10),r:rnd(6.28),vr:rnd(-3,3),l:rnd(9,15),ttl:rnd(1.6,2.6),t:0});
}
function spawnSweat(){
 const h=headWorld();
 sweats.push({x:h[0]+rnd(-10,14),y:h[1]+rnd(-6,10),vx:rnd(40,130),vy:rnd(-160,-60),ttl:.9,t:0});
}
function spawnDust(x,y,big){
 dust.push({x:x+rnd(-6,6),y:y-rnd(0,4),vx:rnd(-20,20)-S.speed*.15,vy:rnd(-30,-5),r:rnd(3,big?7:5),ttl:rnd(.4,.7),t:0});
}
function spawnHeart(){
 const cx=VW*CXF;
 hearts.push({x:cx+200+rnd(-14,14),y:GROUND+S.bobY-240+rnd(-8,8),vy:rnd(-60,-30),ttl:1,t:0});
}
function updArr(a,dt,f){for(let i=a.length-1;i>=0;i--)if(!f(a[i]))a.splice(i,1);}

/* ================= 步态与运动学 ================= */
function legFoot(p,far){
 const fore=58,back=-62,lift=34;
 const hipX=far?-16:22,hipY=-94;
 let fx,fy=0;
 if(p<0.55){fx=lerp(fore,back,eio(p/0.55));}
 else{const q=(p-0.55)/0.45;fx=lerp(back,fore,eio(q));fy=-lift*Math.sin(Math.PI*q);}
 return[hipX+fx*(far?0.95:1),hipY+fy*(far?0.9:1)];
}
function solveLeg(hip,ft,l1,l2){
 let dx=ft[0]-hip[0],dy=ft[1]-hip[1],d=Math.hypot(dx,dy);
 const md=l1+l2-0.5;
 if(d>md){dx*=md/d;dy*=md/d;d=md;ft=[hip[0]+dx,hip[1]+dy];}
 if(d<1)d=1;
 const a=clamp((l1*l1-l2*l2+d*d)/(2*d),-l1,l1);
 const h=Math.sqrt(Math.max(0,l1*l1-a*a));
 const ux=dx/d,uy=dy/d;
 return[hip[0]+ux*a+(-uy)*h,hip[1]+uy*a+ux*h,ft];
}
function mood(){if(S.happyT>0)return'happy';if(S.startle>0.15)return'startled';if(S.stamina<20)return'tired';return'calm';}

/* ================= 主更新 ================= */
function step(dt){
 S.t+=dt;
 let tgt=60+340*S.sliderV/100;
 if(S.sprintT>0){tgt+=270;S.sprintT-=dt;}
 tgt+=S.boost;
 tgt=Math.min(tgt,S.stamina<10?235:10000);
 S.speed+=(tgt-S.speed)*(1-Math.exp(-dt*2.6));
 S.boost*=Math.exp(-dt*1.3);
 S.dist+=S.speed*dt;
 const drain=Math.pow(Math.max(0,S.speed-235)/465,1.7)*9+(S.sprintT>0?12:0);
 const regen=S.speed<265?5.5:0;
 S.stamina=clamp(S.stamina+(regen-drain)*dt,0,100);
 // 步态相位与落地事件
 const prevPh=S.phase;
 S.phase=(S.phase+dt*(1.05+S.speed*0.0058))%1;
 if(S.phase<prevPh){const f=legFoot(S.phase,false);spawnDust(VW*CXF+f[0],GROUND,S.road&&Math.random()<.7);if(S.speed>120)sndStep();}
 if(((S.phase+0.5)%1)<((prevPh+0.5)%1)){const f=legFoot((S.phase+0.5)%1,true);spawnDust(VW*CXF+f[0],GROUND,false);if(S.speed>120)sndStep();}
 S.wing+=dt*(1.15+S.speed*0.004+S.startle*2.4+(S.sprintT>0?1:0));
 // 颠簸
 if(S.road&&S.speed>80){S.bumpT-=dt;if(S.bumpT<=0){S.bumpT=rnd(.14,.3);S.joltV-=rnd(20,30)*(0.5+S.speed/700);}}
 S.joltV+=(-260*S.joltY-15*S.joltV)*dt;S.joltY+=S.joltV*dt;
 const bobAmp=5+S.speed*0.013+(S.road?2.5:0);
 S.bobY=-bobAmp*Math.abs(Math.sin(S.phase*Math.PI*2));
 S.bobVel=(S.bobY-S.prevBob)/dt;S.prevBob=S.bobY;
 S.pouchV+=(-46*S.pouch-6.5*S.pouchV)*dt-S.bobVel*dt*1.5;
 S.pouch+=S.pouchV*dt;
 const acc=(S.speed-S.prevSpeed)/dt;S.prevSpeed=S.speed;
 const leanT=clamp(acc*0.00012,-0.05,0.05)+clamp(S.joltV*0.0015,-0.05,0.05)-(S.sprintT>0?0.03:0);
 S.lean+=(leanT-S.lean)*(1-Math.exp(-dt*6));
 S.bellShake*=Math.exp(-dt*3);S.startle=Math.max(0,S.startle-dt*0.75);
 S.gulp*=Math.exp(-dt*4);S.happyT=Math.max(0,S.happyT-dt);
 S.pokeT=Math.max(0,S.pokeT-dt*1.4);S.feedCD=Math.max(0,S.feedCD-dt);
 modePos+=(modeT-modePos)*Math.min(1,dt*2.2);
 if((S.stamina<25||S.sprintT>0)&&S.speed>100){S.sweatT-=dt;if(S.sweatT<=0){S.sweatT=S.stamina<15?0.22:0.5;spawnSweat();}}
 S.feathT-=dt;if(S.feathT<=0){S.feathT=rnd(1.4,3.4);if(Math.random()<.7)spawnFeather();}
 if(S.speed>400){S.streakT-=dt;if(S.streakT<=0){S.streakT=0.05;streaks.push({x:VW+rnd(0,60),y:rnd(VH*0.3,VH*0.74),len:rnd(60,150),ttl:.5,t:0,v:S.speed*1.7});}}
 if(fish){
   fish.t+=dt/1.05;
   const cx=VW*CXF;
   fish.x1=cx+262;fish.y1=GROUND+S.bobY+S.joltY-252;
   fish.cx=(fish.x0+fish.x1)/2+60;fish.cy=Math.min(fish.y0,fish.y1)-280;
   if(fish.t>=1){fish=null;gulp();}
 }
 updArr(dust,dt,p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;return p.t<p.ttl;});
 updArr(feathers,dt,p=>{p.t+=dt;p.x+=(p.vx+Math.sin(p.t*6+p.r*10)*20)*dt;p.y+=(p.vy+Math.sin(p.t*4)*12)*dt;p.r+=p.vr*dt;return p.t<p.ttl;});
 updArr(sweats,dt,p=>{p.t+=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.t<p.ttl;});
 updArr(hearts,dt,p=>{p.t+=dt;p.y+=p.vy*dt;p.x+=Math.sin(p.t*5)*14*dt;return p.t<p.ttl;});
 updArr(streaks,dt,p=>{p.t+=dt;p.x-=p.v*dt;return p.t<p.ttl&&p.x>-200;});
 stFl.style.width=S.stamina+'%';
 stFl.style.background=S.stamina<20?'#e2543e':'linear-gradient(90deg,#ff9d5c,#7ed47e)';
 kmh.textContent=(S.speed*0.11|0)+' km/h';
 bSprint.classList.toggle('tired',S.stamina<=14);
}
function gulp(){S.stamina=clamp(S.stamina+26,0,100);S.happyT=1.8;S.gulp=1;sndGulp();for(let i=0;i<4;i++)spawnHeart();}

/* ================= 背景 ================= */
function drawSky(){
 const gr=g.createLinearGradient(0,0,0,VH);
 gr.addColorStop(0,css(pal('skyT')));gr.addColorStop(1,css(pal('skyB')));
 g.fillStyle=gr;g.fillRect(0,0,VW,VH);
 const sa=palN('star');
 if(sa>0.02){g.fillStyle='#fff';
  for(const s of stars){g.globalAlpha=sa*(0.4+0.6*Math.abs(Math.sin(S.t*1.5+s.p)));
   g.beginPath();g.arc(s.x*VW,s.y*VH,s.r,0,7);g.fill();}
  g.globalAlpha=1;}
}
function drawCelestial(){
 const x=VW*0.8,y=VH*palN('sunY'),nt=palN('night'),c=pal('sun');
 const gr=g.createRadialGradient(x,y,10,x,y,150);
 gr.addColorStop(0,css(c,0.55));gr.addColorStop(1,css(c,0));
 g.fillStyle=gr;g.beginPath();g.arc(x,y,150,0,7);g.fill();
 g.fillStyle=css(c);g.beginPath();g.arc(x,y,42-8*nt,0,7);g.fill();
 if(nt>0.4){g.fillStyle=css(mixc(c,[120,120,130],.5),.8);
  g.beginPath();g.arc(x-10,y-6,6,0,7);g.fill();
  g.beginPath();g.arc(x+8,y+10,4.5,0,7);g.fill();
  g.beginPath();g.arc(x+4,y-14,3.5,0,7);g.fill();}
}
function drawClouds(){
 const c=pal('cloud');
 for(const cl of clouds){
  const w=260*cl.s;
  let x=((cl.x*(VW+500)-S.dist*0.05*cl.v-S.t*6*cl.v)%(VW+500));
  if(x<0)x+=VW+500;x-=250;
  const y=cl.y*VH;
  g.fillStyle=css(c,0.9);
  g.beginPath();
  g.ellipse(x,y,w*.5,w*.17,0,0,7);
  g.ellipse(x-w*.28,y+w*.04,w*.3,w*.13,0,0,7);
  g.ellipse(x+w*.26,y+w*.05,w*.28,w*.12,0,0,7);
  g.fill();
 }
}
function drawSea(){
 const top=HORIZON;
 g.fillStyle=css(pal('seaA'));g.fillRect(0,top,VW,DECK-top+2);
 g.fillStyle=css(pal('seaB'));
 g.beginPath();g.moveTo(0,top+26);

/* ================= 前景粒子 & 氛围 ================= */
function drawParticles(){
 for(const p of dust){const a=(1-p.t/p.ttl)*0.3;
  g.fillStyle='rgba(150,140,125,'+a+')';g.beginPath();g.arc(p.x,p.y,p.r*(1+p.t*2.4),0,7);g.fill();}
 for(const p of streaks){const a=(1-p.t/p.ttl)*0.35;
  g.strokeStyle='rgba(255,255,255,'+a+')';g.lineWidth=2.5;
  g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+p.len,p.y);g.stroke();}
 for(const p of feathers){const a=Math.min(1,(p.ttl-p.t)*1.5);
  g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=a;
  g.fillStyle='#e8e4da';g.beginPath();g.ellipse(0,0,p.l,p.l*0.36,0,0,7);g.fill();
  g.strokeStyle='rgba(140,130,115,.8)';g.lineWidth=1.4;g.beginPath();g.moveTo(-p.l,0);g.lineTo(p.l,0);g.stroke();
  g.restore();}
 for(const p of sweats){const a=1-p.t/p.ttl;
  g.globalAlpha=a;g.fillStyle='#8ec9ee';
  g.beginPath();g.arc(p.x,p.y,3.6,0,7);g.fill();
  g.beginPath();g.moveTo(p.x-3,p.y-2);g.lineTo(p.x,p.y-8);g.lineTo(p.x+3,p.y-2);g.fill();
  g.globalAlpha=1;}
 for(const p of hearts){const a=1-p.t/p.ttl;
  g.globalAlpha=a;g.font='22px system-ui';g.fillStyle='#ff6f9c';
  g.fillText('♥',p.x,p.y);g.globalAlpha=1;}
 if(fish){
  const t=eio(clamp(fish.t,0,1)),t2=Math.min(1,t+0.02);
  const x=lerp(lerp(fish.x0,fish.cx,t),lerp(fish.cx,fish.x1,t),t);
  const y=lerp(lerp(fish.y0,fish.cy,t),lerp(fish.cy,fish.y1,t),t);
  const x2=lerp(lerp(fish.x0,fish.cx,t2),lerp(fish.cx,fish.x1,t2),t2);
  const y2=lerp(lerp(fish.y0,fish.cy,t2),lerp(fish.cy,fish.y1,t2),t2);
  drawFish(x,y,Math.atan2(y2-y,x2-x)+Math.PI,1.35);
 }
}
function drawVignette(){
 const nt=palN('night'),cx=VW*CXF;
 if(nt>0.3){
  const l=b2p(162,-50);
  const lx=cx+l[0],ly=GROUND+S.bobY+S.joltY+l[1];
  const grd=g.createRadialGradient(lx,ly,10,lx,ly,340);
  grd.addColorStop(0,'rgba(255,230,160,'+(0.30*nt)+')');grd.addColorStop(1,'rgba(255,230,160,0)');
  g.fillStyle=grd;
  g.beginPath();g.moveTo(lx,ly);
  g.lineTo(lx+330,ly+40);g.lineTo(lx+370,DECK+50);g.lineTo(lx+130,DECK+50);
  g.closePath();g.fill();
 }
 const gr=g.createRadialGradient(VW/2,VH*0.45,VH*0.3,VW/2,VH*0.55,VH*0.95);
 gr.addColorStop(0,'rgba(10,16,30,0)');gr.addColorStop(1,'rgba(8,12,26,'+(0.2+0.25*nt)+')');
 g.fillStyle=gr;g.fillRect(0,0,VW,VH);
}

/* ================= 主循环 ================= */
function draw(){
 g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
 g.setTransform(DPR*SC,0,0,DPR*SC,0,0);
 drawSky();drawCelestial();drawClouds();drawSea();drawRail();drawDeck();drawShadow();
 const cx=VW*CXF;
 g.save();
 g.translate(cx,GROUND+S.bobY+S.joltY);
 g.translate(0,-110);g.rotate(S.lean);g.translate(0,110);
 drawPelican();
 drawBike();
 drawReins();
 drawTeaser();
 if(S.startle>0.05){
  g.globalAlpha=Math.min(1,S.startle*1.4);
  g.font='bold 44px system-ui';g.fillStyle='#ff5a4e';
  g.save();g.translate(118,-340-S.startle*18);g.rotate(0.15);g.fillText('!',0,0);g.restore();
  g.globalAlpha=1;
 }
 g.restore();
 drawParticles();
 drawVignette();
}
let lastT=performance.now();
function frame(now){
 const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
 step(dt);draw();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
