<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕 · 跨代模型前端擂台赛</title>
    <style>
        /* 全局重置与基础样式 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
        
        /* 毛玻璃现代 UI 面板 */
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px; padding: 16px;
            color: #f8fafc;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 260px; user-select: none;
            z-index: 10;
        }
        h1 { margin: 0 0 12px 0; font-size: 16px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.9; }
        
        /* 按钮样式 */
        button {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; padding: 6px 10px; border-radius: 8px;
            cursor: pointer; font-size: 12px; transition: all 0.2s;
            margin-right: 4px; margin-bottom: 4px;
        }
        button:hover { background: rgba(255,255,255,0.25); }
        button:active { background: rgba(255,255,255,0.35); transform: scale(0.96); }
        
        #bell-btn { background: #fbbf24; color: #000; border: none; font-weight: bold; font-size: 14px; padding: 8px 12px;}
        #bell-btn:hover { background: #f59e0b; }
        #dash-btn { background: #ef4444; color: #fff; border: none; font-weight: bold; font-size: 14px; padding: 8px 12px;}
        #dash-btn:hover { background: #dc2626; }
        #feed-btn { background: #3b82f6; border: none; font-weight: bold; font-size: 14px; padding: 8px 12px;}
        #feed-btn:hover { background: #2563eb; }

        /* 滑块与进度条 */
        input[type="range"] { width: 100%; cursor: pointer; }
        .stamina-bar { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .stamina-fill { height: 100%; background: #4ade80; width: 100%; transition: width 0.1s, background 0.3s; }
        
        /* 环境切换按钮组 */
        .env-btn.active { background: rgba(255,255,255,0.35); border-color: #fff; font-weight: bold; }
        
        .hint { font-size: 11px; opacity: 0.7; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <div id="ui-panel">
        <h1>🚲 自行车骑鹈鹕 🦤</h1>
        <div class="control-group">
            <button id="bell-btn">🔔 按车铃</button>
            <button id="dash-btn">💨 冲刺</button>
            <button id="feed-btn">🐟 喂鱼</button>
        </div>
        <div class="control-group">
            <label>基础速度: <span id="speed-val">1.0x</span></label>
            <input type="range" id="speed-slider" min="0.5" max="3" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>鹈鹕体力状态</label>
            <div class="stamina-bar"><div class="stamina-fill" id="stamina-fill"></div></div>
        </div>
        <div class="control-group">
            <label>天气 / 路况</label>
            <div>
                <button class="env-btn active" data-w="sunny">☀️ 晴天</button>
                <button class="env-btn" data-w="dusk">🌇 黄昏</button>
                <button class="env-btn" data-w="night">🌙 夜晚</button>
            </div>
            <div style="margin-top:6px;">
                <button class="env-btn active" data-r="smooth">🛣️ 平路</button>
                <button class="env-btn" data-r="bumpy">🪨 石子</button>
            </div>
        </div>
        <div class="hint">提示：车子在骑鹈鹕！按铃会吓到它加速哦~投喂小鱼可恢复体力。</div>
    </div>

    <script>
        // ================= 1. 初始化与全局状态 =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = w * dpr; canvas.height = h * dpr;
            canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;           // 动画相位时间
        let distance = 0;       // 背景滚动距离
        let stamina = 100;      // 鹈鹕体力 (0~100)
        let weather = 'sunny';  // 天气: sunny, dusk, night
        let road = 'smooth';    // 路况: smooth, bumpy
        
        let isDashing = false;
        let dashTimer = 0;
        let shockTimer = 0;     // 受惊计时
        let bellShakeTimer = 0; // 车铃震动计时
        let fishEatenTimer = 0; // 吃鱼开心计时
        
        let particles = [];     // 粒子系统 (汗滴、羽毛、沙尘、小鱼)
        let audioCtx = null;    // Web Audio 上下文

        // ================= 2. Web Audio API 音效合成 =================
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBell() {
            initAudio();
            const t = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc1.type = 'sine'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(1200, t);
            osc2.frequency.setValueAtTime(1800, t);
            
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.4, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
            
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(t); osc2.start(t);
            osc1.stop(t + 1.0); osc2.stop(t + 1.0);
        }

        function playEatSound() {
            initAudio();
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.15);
        }

        // ================= 3. 核心绘制函数 =================

        // 绘制视差滚动背景
        function drawBackground(ctx, w, h, dist, weather, road) {
            // 天空渐变
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            if (weather === 'sunny') { grad.addColorStop(0, '#38bdf8'); grad.addColorStop(1, '#bae6fd'); }
            else if (weather === 'dusk') { grad.addColorStop(0, '#4c1d95'); grad.addColorStop(0.5, '#db2777'); grad.addColorStop(1, '#fcd34d'); }
            else { grad.addColorStop(0, '#0f172a'); grad.addColorStop(1, '#1e293b'); }
            ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

            // 太阳/月亮
            let celestialY = weather === 'dusk' ? h / 2 - 50 : 100;
            ctx.fillStyle = weather === 'night' ? '#fef08a' : (weather === 'dusk' ? '#fca5a5' : '#fef08a');
            ctx.beginPath(); ctx.arc(w - 150, celestialY, weather === 'dusk' ? 60 : 40, 0, Math.PI * 2); ctx.fill();
            
            if (weather === 'night') {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(w - 135, celestialY - 10, 35, 0, Math.PI * 2); ctx.fill();
                // 星空
                ctx.fillStyle = '#fff';
                for (let i=0; i<60; i++) {
                    let sx = (i * 137.5) % w; let sy = (i * 93.1) % (h/2);
                    ctx.globalAlpha = Math.sin(dist/50 + i) * 0.5 + 0.5;
                    ctx.fillRect(sx, sy, 2, 2);
                }
                ctx.globalAlpha = 1;
            }

            // 云朵 (视差层1)
            ctx.fillStyle = weather === 'night' ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.8)';
            for (let i = 0; i < 5; i++) {
                let cx = w - ((dist * 0.2 + i * 350) % (w + 350));
                let cy = 80 + (i % 3) * 45;
                ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2);
                ctx.arc(cx + 25, cy - 10, 25, 0, Math.PI * 2);
                ctx.arc(cx + 50, cy, 20, 0, Math.PI * 2); ctx.fill();
            }

            // 飞鸟 (视差层2)
            ctx.strokeStyle = weather === 'night' ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)';
            ctx.lineWidth = 2;
            for(let i=0; i<3; i++) {
                let bx = w - ((dist * 0.1 + i * 400) % (w + 400));
                let by = 150 + (i * 50);
                ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 10, by - 5); ctx.lineTo(bx + 20, by); ctx.stroke();
            }

            // 海洋波浪
            let waterY = h - 150;
            ctx.fillStyle = weather === 'night' ? '#0ea5e9' : (weather === 'dusk' ? '#9d174d' : '#0284c7');
            ctx.beginPath(); ctx.moveTo(0, waterY);
            for (let x = 0; x <= w; x += 20) ctx.lineTo(x, waterY + Math.sin(x*0.05 + dist*0.01)*5);
            ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();

            // 沙滩/地面
            let groundY = h - 100;
            ctx.fillStyle = weather === 'night' ? '#334155' : (weather === 'dusk' ? '#78350f' : '#fde68a');
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();

            // 地面细节 (平路木栈道 / 石子路)
            if (road === 'smooth') {
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 4;
                for (let i=0; i<10; i++) {
                    let px = w - ((dist * 0.5 + i * 200) % (w + 200));
                    ctx.beginPath(); ctx.moveTo(px, groundY); ctx.lineTo(px + 20, h); ctx.stroke();
                }
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                for (let i=0; i<15; i++) {
                    let px = w - ((dist + i * 150) % (w + 150));
                    let py = groundY + 20 + (i%3)*20;
                    ctx.beginPath(); ctx.ellipse(px, py, 15, 8, 0, 0, Math.PI*2); ctx.fill();
                }
            }
        }

        // 绘制鹈鹕 (下方坐骑)
        function drawPelican(ctx, x, y, t, isShock, isTired, isHappy) {
            ctx.save(); ctx.translate(x, y);
            
            // 橙黄色腿与蹼
            ctx.strokeStyle = '#f97316'; ctx.lineWidth = 6; ctx.lineCap = 'round';
            let legSwing1 = Math.sin(t * 1.5) * 15;
            let legSwing2 = Math.sin(t * 1.5 + Math.PI) * 15;
            // 左腿
            ctx.beginPath(); ctx.moveTo(-10, 20); ctx.lineTo(-10 + legSwing1, 50); ctx.stroke();
            ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.moveTo(-10 + legSwing1, 50); ctx.lineTo(-10 + legSwing1 - 10, 55); ctx.lineTo(-10 + legSwing1 + 10, 55); ctx.fill();
            // 右腿
            ctx.beginPath(); ctx.moveTo(10, 20); ctx.lineTo(10 + legSwing2, 50); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10 + legSwing2, 50); ctx.lineTo(10 + legSwing2 - 10, 55); ctx.lineTo(10 + legSwing2 + 10, 55); ctx.fill();

            // 白色椭圆身体
            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.ellipse(0, 0, 50, 35, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
            
            // 尾部羽毛
            ctx.fillStyle = '#e2e8f0'; ctx.beginPath();
            ctx.moveTo(45, -5); ctx.lineTo(80, -15); ctx.lineTo(75, 5); ctx.lineTo(80, 20); ctx.lineTo(45, 15); ctx.fill();

            // 扑腾的翅膀
            let wingFlap = Math.sin(t * 2.5) * 0.4;
            ctx.save(); ctx.translate(-10, -10); ctx.rotate(wingFlap);
            ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-20, -40, -50, -10); ctx.quadraticCurveTo(-30, 10, 0, 0); ctx.fill();
            ctx.restore();

            // 弯曲的脖子
            ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 24; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-20, -20); ctx.quadraticCurveTo(-50, -60, -30, -90); ctx.stroke();

            // 头部
            ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(-30, -95, 18, 0, Math.PI * 2); ctx.fill();
            
            // 长喙与宽大喉囊
            let pouchSwing = Math.sin(t * 1.5) * 8;
            if (isShock) pouchSwing += 15;
            if (isTired) pouchSwing += Math.sin(t * 5) * 6; // 累了快速喘气
            
            ctx.save(); ctx.translate(-30, -95);
            // 上喙
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 6; ctx.beginPath();
            ctx.moveTo(0, -5); ctx.quadraticCurveTo(-30, -5, -50, 5); ctx.stroke();
            // 喉囊
            ctx.fillStyle = '#fcd34d'; ctx.beginPath(); ctx.moveTo(-5, 5);
            ctx.quadraticCurveTo(-30, 10 + pouchSwing, -45, 5);
            ctx.quadraticCurveTo(-25, 30 + pouchSwing, -5, 15); ctx.fill();
            ctx.restore();

            // 表情反馈 (眼睛)
            ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            if (isHappy) {
                // 吃到鱼开心闭眼 (^ ^)
                ctx.beginPath(); ctx.arc(-32, -100, 3, Math.PI, Math.PI*2); ctx.stroke();
            } else if (isShock) {
                // 受惊眼睛变大
                ctx.beginPath(); ctx.arc(-32, -100, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-33, -101, 2, 0, Math.PI*2); ctx.fill();
            } else if (isTired) {
                // 疲惫半闭眼
                ctx.beginPath(); ctx.arc(-32, -100, 4, 0, Math.PI); ctx.fill();
            } else {
                // 正常
                ctx.beginPath(); ctx.arc(-32, -100, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        // 绘制自行车 (上方骑手)
        function drawBicycle(ctx, x, y, t, isBellRinging) {
            ctx.save(); ctx.translate(x, y);
            ctx.rotate(Math.sin(t * 1.5) * 0.05); // 自身微倾

            const r = 28, wheelSpacing = 60;
            const backX = -wheelSpacing/2, frontX = wheelSpacing/2, wheelY = 35;
            const spokeAngle = t * 2;

            function drawWheel(wx, wy) {
                ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(wx, wy, r, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = '#aaa'; ctx.beginPath(); ctx.arc(wx, wy, 4, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#666'; ctx.lineWidth = 1;
                for (let i = 0; i < 8; i++) {
                    let a = spokeAngle + i * (Math.PI / 4);
                    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * r, wy + Math.sin(a) * r); ctx.stroke();
                }
            }

            // 红色车架
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            const seatX = -10, seatY = -5, crankX = 5, crankY = 25, headX = 15, headY = -10;
            ctx.beginPath();
            ctx.moveTo(backX, wheelY); ctx.lineTo(seatX, seatY); ctx.lineTo(crankX, crankY); ctx.lineTo(backX, wheelY);
            ctx.moveTo(seatX, seatY); ctx.lineTo(headX, headY); ctx.moveTo(crankX, crankY); ctx.lineTo(headX, headY); ctx.lineTo(frontX, wheelY);
            ctx.stroke();

            // 幽默细节：皮带绑在鹈鹕身上
            ctx.strokeStyle = '#451a03'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(seatX, seatY + 5); ctx.lineTo(seatX, seatY + 25); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(crankX, crankY - 5); ctx.lineTo(crankX, crankY + 15); ctx.stroke();

            // 车座与车把
            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(seatX, seatY - 2, 10, 4, -0.2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.beginPath();
            ctx.moveTo(headX, headY); ctx.lineTo(headX + 5, headY - 15); ctx.quadraticCurveTo(headX + 15, headY - 20, headX + 20, headY - 10); ctx.stroke();

            // 车铃 (震动特效)
            let bellOffset = isBellRinging ? (Math.random() - 0.5) * 4 : 0;
            ctx.fillStyle = isBellRinging ? '#fde047' : '#cbd5e1';
            ctx.beginPath(); ctx.arc(headX + 15, headY - 15 + bellOffset, 4, 0, Math.PI * 2); ctx.fill();

            // 脚踏与牙盘联动
            ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(crankX, crankY, 8, 0, Math.PI * 2); ctx.fill();
            let pedalAngle = t * 2;
            let pedalX = crankX + Math.cos(pedalAngle) * 12; let pedalY = crankY + Math.sin(pedalAngle) * 12;
            ctx.fillStyle = '#111'; ctx.fillRect(pedalX - 4, pedalY - 2, 8, 4);
            ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(crankX, crankY); ctx.lineTo(pedalX, pedalY); ctx.stroke();

            // 链条
            ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(crankX, crankY); ctx.lineTo(backX, wheelY); ctx.stroke();

            drawWheel(backX, wheelY); drawWheel(frontX, wheelY);

            // 紫色缰绳 (牵着鹈鹕的脖子)
            ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(headX + 20, headY - 10);
            ctx.quadraticCurveTo(headX + 40, headY - 40, -10, -60); // 连向脖子顶端
            ctx.stroke(); ctx.setLineDash([]);

            ctx.restore();
        }

        // ================= 4. 粒子系统更新与绘制 =================
        function updateAndDrawParticles(ctx, dt, speedMult, w, h) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (p.type === 'fish') {
                    p.x -= 400 * dt; // 小鱼飞向鹈鹕
                    p.y += (p.targetY - p.y) * dt * 3;
                    if (Math.abs(p.x - p.targetX) < 15) {
                        stamina = Math.min(100, stamina + 25);
                        p.life = 0; playEatSound(); fishEatenTimer = 0.5; // 增加体力并触发笑脸
                    }
                } else {
                    p.x += p.vx * (1 + speedMult); p.y += p.vy;
                }
                p.life -= dt * 0.5; p.rot += 0.05;
                
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                
                ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = p.life;
                if (p.type === 'sweat') {
                    ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
                } else if (p.type === 'feather') {
                    ctx.rotate(p.rot); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 2, 6, 0, 0, Math.PI*2); ctx.fill();
                } else if (p.type === 'dust') {
                    ctx.fillStyle = '#d6d3d1'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
                } else if (p.type === 'fish') {
                    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, Math.PI/4, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(10, -8); ctx.lineTo(10, 0); ctx.fill();
                }
                ctx.restore();
            }
        }

        // ================= 5. 核心游戏循环 =================
        let lastTime = performance.now();
        function loop(now) {
            let dt = (now - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // 限制最大切屏跳跃
            lastTime = now;

            // --- 逻辑更新 ---
            let baseSpeed = parseFloat(document.getElementById('speed-slider').value);
            let currentSpeed = baseSpeed;
            
            if (dashTimer > 0) { dashTimer -= dt; isDashing = true; } else { isDashing = false; }
            if (isDashing && stamina > 0) { currentSpeed *= 2.5; stamina -= 15 * dt; }
            if (shockTimer > 0) { shockTimer -= dt; currentSpeed *= 1.8; } // 受惊狂奔
            if (stamina <= 0) { stamina = 0; currentSpeed = Math.min(currentSpeed, 0.5); } // 没体力只能龟速
            else if (!isDashing && shockTimer <= 0) { stamina = Math.min(100, stamina + 3 * dt); } // 缓慢回血
            
            // 粒子生成逻辑
            let cx = window.innerWidth / 2, cy = window.innerHeight / 2 + 50;
            if ((isDashing || stamina < 30) && Math.random() < 0.2) {
                particles.push({ type: 'sweat', x: cx - 30, y: cy - 110, vx: -2, vy: -1, life: 1.0, rot: 0 });
            }
            if (Math.random() < 0.3 * baseSpeed) {
                particles.push({ type: 'dust', x: cx - 40 + Math.random()*80, y: cy + 55, vx: -3, vy: -1, life: 1.0, rot: 0 });
            }
            if (Math.random() < 0.02) {
                particles.push({ type: 'feather', x: window.innerWidth + 20, y: Math.random() * window.innerHeight/2, vx: -2, vy: 1, life: 1.0, rot: Math.random()*Math.PI });
            }

            time += currentSpeed * dt * 3; 
            distance += currentSpeed * dt * 150;
            if (bellShakeTimer > 0) bellShakeTimer -= dt;
            if (fishEatenTimer > 0) fishEatenTimer -= dt;

            // UI 更新
            const sFill = document.getElementById('stamina-fill');
            sFill.style.width = stamina + '%';
            if(stamina < 30) sFill.style.background = '#ef4444';
            else if(stamina < 60) sFill.style.background = '#fbbf24';
            else sFill.style.background = '#4ade80';

            // --- 画面渲染 ---
            const w = window.innerWidth, h = window.innerHeight;
            drawBackground(ctx, w, h, distance, weather, road);
            
            // 舞台中心动态计算 (结合颠簸与起伏)
            let bump = road === 'bumpy' ? Math.sin(time * 6) * 8 : 0;
            let bounce = Math.sin(time * 2) * 4;
            let baseX = cx, baseY = cy + bump + bounce;
            
            // 绘制动物坐骑
            drawPelican(ctx, baseX, baseY, time, shockTimer > 0, stamina < 30, fishEatenTimer > 0);
            // 绘制骑手自行车 (置于鹈鹕背上方，完美呈现反常识构图)
            drawBicycle(ctx, baseX - 10, baseY - 45 + bump, time, bellShakeTimer > 0);
            
            // 粒子更新绘制
            updateAndDrawParticles(ctx, dt, baseSpeed, w, h);
            
            // 冲刺速度线特效
            if (isDashing && stamina > 0) {
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
                for(let i=0; i<6; i++) {
                    let sx = w - Math.random() * w * 0.6; let sy = h/2 + Math.random() * h * 0.5;
                    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 120, sy); ctx.stroke();
                }
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);

        // ================= 6. 交互事件绑定 =================
        document.getElementById('bell-btn').addEventListener('click', () => {
            shockTimer = 1.5; bellShakeTimer = 0.5; playBell();
        });

        const triggerDash = (e) => { e.preventDefault(); dashTimer = 1.0; };
        document.getElementById('dash-btn').addEventListener('mousedown', triggerDash);
        document.getElementById('dash-btn').addEventListener('touchstart', triggerDash, {passive:false});

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            document.getElementById('speed-val').innerText = parseFloat(e.target.value).toFixed(1) + 'x';
        });

        // 天气切换
        document.querySelectorAll('[data-w]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                weather = e.target.getAttribute('data-w');
                document.querySelectorAll('[data-w]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });

        // 路况切换
        document.querySelectorAll('[data-r]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                road = e.target.getAttribute('data-r');
                document.querySelectorAll('[data-r]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });

        // 投喂小鱼互动
        document.getElementById('feed-btn').addEventListener('click', () => {
            let w = window.innerWidth, h = window.innerHeight;
            let cx = w / 2, cy = h / 2 + 50;
            particles.push({
                type: 'fish', x: w + 20, y: 100,
                targetX: cx - 30, targetY: cy - 95, life: 1.0 // 飞向鹈鹕嘴部
            });
        });
    </script>
</body>
</html>
