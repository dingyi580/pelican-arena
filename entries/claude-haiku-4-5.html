<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            height: 100vh;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #FFFACD 100%);
        }

        .controls {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
            z-index: 100;
            font-size: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
        }

        .control-group label {
            font-weight: 500;
            color: #333;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 13px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input[type="range"] {
            width: 140px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .speed-display {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .status-text {
            position: fixed;
            top: 24px;
            right: 24px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulsing {
            animation: pulse 0.3s;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <button id="bellBtn" title="摇铃">🔔 车铃</button>
            <label>速度</label>
            <div class="slider-group">
                <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1.5">
                <div class="speed-display"><span id="speedValue">1.5</span>x</div>
            </div>
            <button id="sprintBtn" title="冲刺">⚡ 冲刺</button>
        </div>
        <div class="control-group">
            <button id="feedBtn" title="投喂小鱼">🐟 投喂小鱼</button>
            <button id="timeBtn" title="切换时段">🌅 时段</button>
        </div>
    </div>

    <div class="status-text">
        状态: <span id="status">正常奔跑</span> | 体力: <span id="stamina">100</span>%
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 游戏状态
        const game = {
            pelican: {
                x: canvas.width / 2,
                y: canvas.height * 0.65,
                width: 150,
                height: 100,
                legOffset: 0,
                legFrequency: 0.1,
                tiltAngle: 0,
                breathe: 0
            },
            bicycle: {
                angle: 0,
                wheelRotation: 0,
                bounce: 0
            },
            speed: 1.5,
            sprint: false,
            sprintCooldown: 0,
            stamina: 100,
            maxStamina: 100,
            status: '正常奔跑',
            time: 0,
            timePhase: 0, // 0=晴天, 1=黄昏, 2=夜晚
            particles: [],
            bellRinging: false,
            bellShake: 0,
            rain: []
        };

        // 音频合成 - 车铃声
        function playBellSound() {
            if (!window.AudioContext) return;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.frequency.setValueAtTime(800 + i * 200, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // 控制事件
        document.getElementById('bellBtn').addEventListener('click', () => {
            playBellSound();
            game.bellRinging = true;
            game.bellShake = 10;
            game.pelican.breathe = 20;
            document.getElementById('bellBtn').classList.add('pulsing');
            setTimeout(() => {
                document.getElementById('bellBtn').classList.remove('pulsing');
            }, 300);
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            game.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = game.speed.toFixed(1);
        });

        document.getElementById('sprintBtn').addEventListener('click', () => {
            if (game.stamina > 30 && game.sprintCooldown <= 0) {
                game.sprint = true;
                game.sprintCooldown = 120;
            }
        });

        document.getElementById('feedBtn').addEventListener('click', () => {
            game.stamina = Math.min(100, game.stamina + 30);
            game.status = '吃饱了！';
            for (let i = 0; i < 15; i++) {
                game.particles.push({
                    x: game.pelican.x + Math.random() * 60 - 30,
                    y: game.pelican.y - 50,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -Math.random() * 3 - 1,
                    life: 30,
                    type: 'fish'
                });
            }
        });

        document.getElementById('timeBtn').addEventListener('click', () => {
            game.timePhase = (game.timePhase + 1) % 3;
            const times = ['晴天', '黄昏', '夜晚'];
            game.status = times[game.timePhase];
        });

        // 绘制背景
        function drawBackground() {
            const colors = [
                { sky: '#87CEEB', sea: '#E0F6FF', ground: '#FFFACD' },
                { sky: '#FF9A56', sea: '#FFB347', ground: '#FFA500' },
                { sky: '#1a1a2e', sea: '#16213e', ground: '#0f3460' }
            ];

            const c = colors[game.timePhase];
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, c.sky);
            gradient.addColorStop(0.5, c.sea);
            gradient.addColorStop(1, c.ground);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 云朵和视差效果
            ctx.fillStyle = `rgba(255, 255, 255, ${0.3 - game.timePhase * 0.1})`;
            for (let i = 0; i < 5; i++) {
                const cloudX = (game.time * 0.3 + i * 150) % (canvas.width + 200) - 100;
                const cloudY = 60 + i * 40;
                drawCloud(cloudX, cloudY, 60);
            }

            // 下雨效果
            if (game.timePhase === 2) {
                for (let drop of game.rain) {
                    drop.y += 5;
                    if (drop.y > canvas.height) drop.y = -10;
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(drop.x, drop.y);
                    ctx.lineTo(drop.x - 1, drop.y + 10);
                    ctx.stroke();
                }
            }
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size * 0.6, y - size * 0.4, size * 0.8, 0, Math.PI * 2);
            ctx.arc(x - size * 0.6, y - size * 0.4, size * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制鹈鹕
        function drawPelican() {
            const p = game.pelican;
            ctx.save();
            ctx.translate(p.x, p.y);

            // 倾斜
            ctx.rotate(p.tiltAngle);

            // 身体
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, 70, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            // 头
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.arc(60, -20, 30, 0, Math.PI * 2);
            ctx.fill();

            // 喉囊 (标志性特征)
            ctx.fillStyle = `rgba(255, 165, 0, ${0.6 + Math.sin(game.time * 0.05) * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(75, 5, 25 + p.breathe * 0.3, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(70, -25, 5, 0, Math.PI * 2);
            ctx.fill();

            // 长喙
            ctx.strokeStyle = '#FF8C00';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(85, -15);
            ctx.quadraticCurveTo(110, -10, 130, -5);
            ctx.stroke();

            // 翅膀
            ctx.fillStyle = `rgba(255, 140, 0, ${0.7 + Math.sin(game.time * 0.08) * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(-40, -10, 40, 25, Math.sin(game.time * 0.1) * 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(40, -10, 40, 25, -Math.sin(game.time * 0.1) * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // 腿
            ctx.strokeStyle = '#FF6347';
            ctx.lineWidth = 4;
            const legY = Math.sin(game.pelican.legOffset) * 15;
            ctx.beginPath();
            ctx.moveTo(-25, 50);
            ctx.lineTo(-25, 50 + 40 + legY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(25, 50);
            ctx.lineTo(25, 50 + 40 - legY);
            ctx.stroke();

            // 蹼
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.ellipse(-25, 95 + legY, 12, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(25, 95 - legY, 12, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 绘制自行车
        function drawBicycle() {
            const p = game.pelican;
            const b = game.bicycle;
            const offset = Math.sin(game.time * 0.1) * 8;

            ctx.save();
            ctx.translate(p.x, p.y - 70 + offset);
            ctx.rotate(b.angle);

            // 车架 (红色)
            ctx.strokeStyle = '#E63946';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(-40, -20);
            ctx.lineTo(0, 0);
            ctx.lineTo(40, -20);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-40, -20);
            ctx.lineTo(40, 0);
            ctx.stroke();

            // 前轮
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(-40, 0, 25, 0, Math.PI * 2);
            ctx.stroke();

            // 前轮辐条
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (b.wheelRotation + i * Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(-40, 0);
                ctx.lineTo(-40 + Math.cos(angle) * 25, Math.sin(angle) * 25);
                ctx.stroke();
            }

            // 后轮
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(40, 0, 25, 0, Math.PI * 2);
            ctx.stroke();

            // 后轮辐条
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 2;
            for (let i = 0; i < 8; i++) {
                const angle = (b.wheelRotation + i * Math.PI / 4);
                ctx.beginPath();
                ctx.moveTo(40, 0);
                ctx.lineTo(40 + Math.cos(angle) * 25, Math.sin(angle) * 25);
                ctx.stroke();
            }

            // 车把
            ctx.strokeStyle = '#E63946';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-40, -15);
            ctx.lineTo(-55, -25);
            ctx.stroke();

            // 车座
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(10, -30, 20, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // 脚踏和链条
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            const pedalAngle = b.wheelRotation;
            ctx.beginPath();
            ctx.moveTo(0 + Math.cos(pedalAngle) * 15, Math.sin(pedalAngle) * 15);
            ctx.lineTo(0 - Math.cos(pedalAngle) * 15, -Math.sin(pedalAngle) * 15);
            ctx.stroke();

            // 缰绳效果
            ctx.strokeStyle = `rgba(230, 57, 70, 0.5)`;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(-55, -25);
            ctx.quadraticCurveTo(-30, -40, 0, -50);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.restore();
        }

        // 粒子效果
        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life--;

                if (p.life <= 0) {
                    game.particles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.life / 30;
                    if (p.type === 'fish') {
                        ctx.fillStyle = '#FF6B6B';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.type === 'sweat') {
                        ctx.fillStyle = '#87CEEB';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }
        }

        // 主循环
        function animate() {
            game.time++;

            // 鹈鹕奔跑动画
            game.pelican.legOffset += game.pelican.legFrequency * game.speed;
            game.pelican.tiltAngle = Math.sin(game.time * 0.08) * 0.05;
            game.pelican.breathe = Math.max(0, game.pelican.breathe - 1);

            // 自行车轮转动
            game.bicycle.wheelRotation += 0.08 * game.speed;
            game.bicycle.bounce = Math.sin(game.time * 0.1) * 3;
            game.bicycle.angle = Math.sin(game.time * 0.06) * 0.03;

            // 冲刺逻辑
            if (game.sprint) {
                game.speed = 2.5;
                game.stamina -= 1;
                if (game.stamina <= 0) {
                    game.sprint = false;
                    game.status = '累了...';
                }

                // 汗珠
                if (Math.random() < 0.5) {
                    game.particles.push({
                        x: game.pelican.x + Math.random() * 60 - 30,
                        y: game.pelican.y - 60,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 2,
                        life: 25,
                        type: 'sweat'
                    });
                }
            } else {
                game.speed = parseFloat(document.getElementById('speedSlider').value);
                game.stamina = Math.min(100, game.stamina + 0.3);
                game.status = '正常奔跑';
            }

            if (game.sprintCooldown > 0) {
                game.sprintCooldown--;
            }

            // 下雨初始化
            if (game.timePhase === 2 && game.rain.length < 50) {
                game.rain.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height
                });
            } else if (game.timePhase !== 2) {
                game.rain = [];
            }

            // 绘制
            drawBackground();
            drawPelican();
            drawBicycle();
            updateParticles();

            // 更新状态显示
            document.getElementById('stamina').textContent = Math.floor(game.stamina);

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
