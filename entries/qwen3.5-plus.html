<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
    background: rgba(15, 15, 35, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 12px 20px;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #controls button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  #controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(102,126,234,0.5);
  }
  #controls button:active {
    transform: translateY(0);
  }
  #controls button.danger {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  }
  #controls button.success {
    background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    color: #1a1a2e;
  }
  .slider-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .slider-group label {
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 120px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.15);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(102,126,234,0.4);
  }
  #speed-val {
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    min-width: 36px;
    text-align: center;
  }
  #title {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    z-index: 10;
    pointer-events: none;
  }
  #stamina-bar {
    position: fixed;
  const cx = W * 0.5;
  const cy = H * 0.58;
  state.pelican.x = cx;
  state.pelican.y = cy;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  #stamina-bar span {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    font-weight: 600;
  }
  #stamina-track {
    width: 200px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
  }
  #stamina-fill {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    transition: width 0.3s, background 0.3s;
    background: linear-gradient(90deg, #43e97b, #38f9d7);
  }
  #stamina-fill.low {
    background: linear-gradient(90deg, #f5576c, #f093fb);
  }
</style>
</head>
<body>
<div id="title">🚲 自行车骑鹈鹕 </div>
<div id="stamina-bar">
  <span>体力</span>
  <div id="stamina-track"><div id="stamina-fill"></div></div>
</div>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="btn-bell" title="按车铃">🔔 车铃</button>
  <div class="slider-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="0" max="100" value="40">
    <span id="speed-val">40%</span>
  </div>
  <button id="btn-sprint" class="danger" title="冲刺">⚡ 冲刺</button>
  <button id="btn-feed" class="success" title="投喂小鱼">🐟 喂鱼</button>
  <button id="btn-time" title="切换时段">🌅 黄昏</button>
</div>

<script>
// ========== 基础设置 ==========
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(1, 1);
}
resize();
window.addEventListener('resize', resize);

// ========== 状态 ==========
const state = {
  speed: 0.4,
  sprinting: false,
  sprintTimer: 0,
  stamina: 100,
  bellRing: 0,
  bellCooldown: 0,
  timeOfDay: 0, // 0=晴天 1=黄昏 2=夜晚
  feedTimer: 0,
  groundOffset: 0,
  pelican: {
    x: 0, y: 0,
    legPhase: 0,
    wingPhase: 0,
    headBob: 0,
    surprise: 0,
    panting: 0,
    bodyTilt: 0,
    eyeState: 'normal'
  },
  bike: {
    wheelAngle: 0,
    pedalAngle: 0,
    bounce: 0,
    tilt: 0,
    bellVibrate: 0
  },
  particles: [],
  feathers: [],
  sweatDrops: [],
  fishAnim: null,
  clouds: [],
  waves: [],
  buildings: [],
  stars: []
};

// ========== 初始化 ==========
function init() {
  const cx = W * 0.5;
  const cy = H * 0.75;
  state.pelican.x = cx;
  state.pelican.y = cy;

  for (let i = 0; i < 8; i++) {
    state.clouds.push({
      x: Math.random() * W * 1.5 - W * 0.25,
      y: H * 0.08 + Math.random() * H * 0.15,
      w: 60 + Math.random() * 120,
      speed: 0.3 + Math.random() * 0.5,
      opacity: 0.3 + Math.random() * 0.4
    });
  }

  for (let i = 0; i < 80; i++) {
    state.stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      size: 1 + Math.random() * 2.5,
      twinkle: Math.random() * Math.PI * 2
    });
  }

  for (let i = 0; i < 12; i++) {
    state.buildings.push({
      x: i * W * 0.15 + Math.random() * 40,
      w: 40 + Math.random() * 60,
      h: 30 + Math.random() * 80,
      color: `hsl(${20 + Math.random() * 30}, ${30 + Math.random() * 20}%, ${55 + Math.random() * 20}%)`
    });
  }

  for (let i = 0; i < 3; i++) {
    state.waves.push({
      y: H * 0.85 + i * 15,
      amplitude: 8 + i * 4,
      frequency: 0.003 + i * 0.001,
      speed: 0.5 + i * 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }
}
init();

// ========== Web Audio 车铃 ==========
let audioCtx = null;
function playBell() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;

  for (let i = 0; i < 3; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2400 + i * 200, now + i * 0.12);
    osc.frequency.exponentialRampToValueAtTime(1800, now + i * 0.12 + 0.15);
    gain.gain.setValueAtTime(0.3, now + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.25);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + i * 0.12);
    osc.stop(now + i * 0.12 + 0.25);
  }

  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(3200, now);
  osc2.frequency.exponentialRampToValueAtTime(800, now + 0.4);
  gain2.gain.setValueAtTime(0.15, now);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start(now);
  osc2.stop(now + 0.4);
}

// ========== 控制逻辑 ==========
const btnBell = document.getElementById('btn-bell');
const btnSprint = document.getElementById('btn-sprint');
const btnFeed = document.getElementById('btn-feed');
const btnTime = document.getElementById('btn-time');
const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
const staminaFill = document.getElementById('stamina-fill');

btnBell.addEventListener('click', () => {
  if (state.bellCooldown > 0) return;
  playBell();
  state.bellRing = 1;
  state.bellCooldown = 1.5;
  state.pelican.surprise = 1;
  state.speed = Math.min(1, state.speed + 0.3);
  for (let i = 0; i < 5; i++) {
    state.feathers.push({
      x: state.pelican.x + (Math.random() - 0.5) * 80,
      y: state.pelican.y - 40 + Math.random() * 40,
      vx: -1 - Math.random() * 3,
      vy: -0.5 + Math.random() * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.1,
      life: 1,
      size: 8 + Math.random() * 12
    });
  }
});

speedSlider.addEventListener('input', () => {
  state.speed = speedSlider.value / 100;
  speedVal.textContent = speedSlider.value + '%';
});

btnSprint.addEventListener('click', () => {
  if (state.stamina < 10) return;
  state.sprinting = true;
  state.sprintTimer = 3;
  state.speed = 1;
  speedSlider.value = 100;
  speedVal.textContent = '100%';
});

btnFeed.addEventListener('click', () => {
  if (state.feedTimer > 0) return;
  state.feedTimer = 2;
  state.stamina = Math.min(100, state.stamina + 25);
  state.pelican.eyeState = 'happy';
  state.fishAnim = {
    x: W * 0.85,
    y: H * 0.4,
    targetX: state.pelican.x + 50,
    targetY: state.pelican.y + 20,
    life: 1,
    size: 20
  };
});

const timeLabels = ['☀️ 晴天', '🌅 黄昏', '🌙 夜晚'];
btnTime.addEventListener('click', () => {
  state.timeOfDay = (state.timeOfDay + 1) % 3;
  btnTime.textContent = timeLabels[state.timeOfDay];
});

// ========== 颜色方案 ==========
function getSkyColors() {
  const schemes = [
    { top: '#87CEEB', mid: '#B0E0FF', bot: '#E0F4FF', ground: '#8B7355', water: '#4A90A4' },
    { top: '#FF6B35', mid: '#FFB347', bot: '#FFD700', ground: '#6B5B3E', water: '#C45B32' },
    { top: '#0a0a2e', mid: '#1a1a4e', bot: '#2a2a5e', ground: '#2a2520', water: '#1a2a3a' }
  ];
  return schemes[state.timeOfDay];
}

// ========== 绘制天空 ==========
function drawSky(t) {
  const sky = getSkyColors();
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  grad.addColorStop(0, sky.top);
  grad.addColorStop(0.5, sky.mid);
  grad.addColorStop(1, sky.bot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (state.timeOfDay === 0) {
    const sunGrad = ctx.createRadialGradient(W * 0.82, H * 0.12, 0, W * 0.82, H * 0.12, 60);
    sunGrad.addColorStop(0, '#FFF8DC');
    sunGrad.addColorStop(0.5, '#FFD700');
    sunGrad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.12, 60, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.12, 35, 0, Math.PI * 2);
    ctx.fill();
  } else if (state.timeOfDay === 1) {
    const sunGrad = ctx.createRadialGradient(W * 0.75, H * 0.45, 0, W * 0.75, H * 0.45, 50);
    sunGrad.addColorStop(0, '#FF4500');
    sunGrad.addColorStop(0.7, '#FF6347');
    sunGrad.addColorStop(1, 'rgba(255,69,0,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(W * 0.75, H * 0.45, 50, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = '#F5F5DC';
    ctx.beginPath();
    ctx.arc(W * 0.82, H * 0.1, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = sky.top;
    ctx.beginPath();
    ctx.arc(W * 0.82 + 10, H * 0.1 - 5, 25, 0, Math.PI * 2);
    ctx.fill();

    state.stars.forEach(s => {
      const alpha = 0.3 + 0.7 * Math.abs(Math.sin(t * 2 + s.twinkle));
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
  }
}

// ========== 绘制云朵 ==========
function drawClouds(t) {
  state.clouds.forEach(c => {
    c.x -= c.speed * state.speed * 2;
    if (c.x + c.w < -100) c.x = W + 100;
    const alpha = state.timeOfDay === 2 ? c.opacity * 0.3 : c.opacity;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    const cx = c.x, cy = c.y, w = c.w;
    ctx.beginPath();
    ctx.ellipse(cx, cy, w * 0.5, w * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - w * 0.2, cy - w * 0.06, w * 0.3, w * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + w * 0.25, cy - w * 0.04, w * 0.25, w * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ========== 绘制水面 ==========
function drawWater(t) {
  const sky = getSkyColors();
  const waterY = H * 0.85;
  ctx.fillStyle = sky.water;
  ctx.fillRect(0, waterY, W, H - waterY);

  state.waves.forEach(wave => {
    ctx.strokeStyle = `rgba(255,255,255,${0.15 + state.timeOfDay * 0.05})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < W; x += 4) {
      const y = wave.y + Math.sin(x * wave.frequency + t * wave.speed + wave.phase) * wave.amplitude;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
}

// ========== 绘制地面 ==========
function drawGround(t) {
  const sky = getSkyColors();
  const groundY = H * 0.82;

  ctx.fillStyle = sky.ground;
  ctx.fillRect(0, groundY, W, H - groundY);

  ctx.strokeStyle = state.timeOfDay === 2 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  const plankSpacing = 30;
  const offset = (state.groundOffset * 3) % plankSpacing;
  for (let x = -plankSpacing + offset; x < W + plankSpacing; x += plankSpacing) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.strokeStyle = state.timeOfDay === 2 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
}

// ========== 绘制建筑 ==========
function drawBuildings(t) {
  const groundY = H * 0.82;
  const alpha = state.timeOfDay === 2 ? 0.4 : 0.6;

  state.buildings.forEach(b => {
    const bx = b.x - (state.groundOffset * 1.5) % (W + 200);
    const wrapped = ((bx % (W + 200)) + (W + 200)) % (W + 200) - 100;
    if (wrapped < -100 || wrapped > W + 100) return;

    ctx.fillStyle = state.timeOfDay === 2 ? `rgba(40,35,50,${alpha})` : b.color;
    ctx.globalAlpha = alpha;
    ctx.fillRect(wrapped, groundY - b.h, b.w, b.h);

    if (state.timeOfDay === 2) {
      ctx.fillStyle = 'rgba(255,220,100,0.6)';
      for (let wy = groundY - b.h + 10; wy < groundY - 10; wy += 18) {
        for (let wx = wrapped + 8; wx < wrapped + b.w - 8; wx += 15) {
          if (Math.random() > 0.3) ctx.fillRect(wx, wy, 8, 10);
        }
      }
    } else {
      ctx.fillStyle = 'rgba(180,210,240,0.5)';
      for (let wy = groundY - b.h + 10; wy < groundY - 10; wy += 18) {
        for (let wx = wrapped + 8; wx < wrapped + b.w - 8; wx += 15) {
          ctx.fillRect(wx, wy, 8, 10);
        }
      }
    }
    ctx.globalAlpha = 1;
  });
}

// ========== 绘制鹈鹕（放大版） ==========
function drawPelican(t) {
  const p = state.pelican;
  const cx = p.x;
  const cy = p.y;
  const legPhase = p.legPhase;
  const wingPhase = p.wingPhase;
  const headBob = p.headBob;
  const bodyTilt = p.bodyTilt;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(bodyTilt);

  // 身体（放大）
  const bodyGrad = ctx.createRadialGradient(0, 0, 15, 0, 0, 100);
  bodyGrad.addColorStop(0, '#F5F5F0');
  bodyGrad.addColorStop(0.7, '#E8E8E0');
  bodyGrad.addColorStop(1, '#D0D0C8');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 130, 85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#B0B0A8';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 翅膀（放大扑腾）
  const wingAngle = Math.sin(wingPhase) * 0.6;
  ctx.save();
  ctx.translate(-15, -25);
  ctx.rotate(wingAngle);
  const wingGrad = ctx.createLinearGradient(0, 0, -70, 55);
  wingGrad.addColorStop(0, '#E0E0D8');
  wingGrad.addColorStop(1, '#C8C8C0');
  ctx.fillStyle = wingGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-55, -20, -75, 15);
  ctx.quadraticCurveTo(-65, 35, -30, 42);
  ctx.quadraticCurveTo(-8, 35, 0, 0);
  ctx.fill();
  ctx.strokeStyle = '#B0B0A8';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(180,180,170,0.4)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-10 - i * 12, 3 + i * 6);
    ctx.lineTo(-28 - i * 10, 20 + i * 5);
    ctx.stroke();
  }
  ctx.restore();

  // 另一侧翅膀
  ctx.save();
  ctx.translate(15, -25);
  ctx.rotate(-wingAngle * 0.5);
  ctx.fillStyle = '#D8D8D0';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(50, -15, 65, 20);
  ctx.quadraticCurveTo(50, 35, 22, 40);
  ctx.quadraticCurveTo(8, 32, 0, 0);
  ctx.fill();
  ctx.restore();

  // 脖子（加长）
  const neckX = 65 + headBob * 5;
  const neckY = -35 + headBob * 3;
  ctx.fillStyle = '#F0F0E8';
  ctx.beginPath();
  ctx.moveTo(45, -20);
  ctx.quadraticCurveTo(neckX + 20, neckY - 28, neckX + 8, neckY - 42);
  ctx.quadraticCurveTo(neckX - 8, neckY - 35, 38, -8);
  ctx.fill();
  ctx.strokeStyle = '#D0D0C8';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 头部（放大）
  ctx.fillStyle = '#F5F5F0';
  ctx.beginPath();
  ctx.ellipse(neckX + 8, neckY - 40, 26, 23, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#D0D0C8';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 眼睛
  const eyeX = neckX + 18;
  const eyeY = neckY - 48;
  if (p.eyeState === 'happy') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, 7, Math.PI, 0);
    ctx.stroke();
  } else if (p.eyeState === 'dizzy') {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let a = 0; a < Math.PI * 3; a += 0.1) {
      const r = a * 1.5;
      ctx.lineTo(eyeX + Math.cos(a) * r, eyeY + Math.sin(a) * r);
    }
    ctx.stroke();
  } else {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(eyeX, eyeY, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(eyeX + 2, eyeY - 2, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // 嘴（长喙放大）
  const beakX = neckX + 32;
  const beakY = neckY - 38;
  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.moveTo(neckX + 22, neckY - 42);
  ctx.lineTo(beakX + 50, beakY + 3);
  ctx.lineTo(neckX + 22, neckY - 32);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#E8940A';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 喉囊（标志性特征，放大）
  const pouchPulse = p.panting * Math.sin(t * 8) * 4;
  ctx.fillStyle = '#FFB347';
  ctx.beginPath();
  ctx.moveTo(neckX + 22, neckY - 32);
  ctx.quadraticCurveTo(beakX + 45, beakY + 22 + pouchPulse, neckX + 18, neckY - 15);
  ctx.quadraticCurveTo(neckX + 12, neckY - 25, neckX + 22, neckY - 32);
  ctx.fill();
  ctx.strokeStyle = '#E8940A';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // 喘气效果
  if (p.panting > 0.3) {
    ctx.fillStyle = `rgba(255,100,100,${p.panting * 0.3})`;
    ctx.beginPath();
    ctx.arc(beakX + 45, beakY + 8, 4 + p.panting * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // 尾巴（放大）
  ctx.fillStyle = '#D8D8D0';
  ctx.beginPath();
  ctx.moveTo(-85, -8);
  ctx.quadraticCurveTo(-115, -22, -122, 8);
  ctx.quadraticCurveTo(-115, 22, -85, 15);
  ctx.fill();
  ctx.strokeStyle = 'rgba(180,180,170,0.5)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(-88 - i * 8, -3 + i * 5);
    ctx.lineTo(-112 - i * 4, 3 + i * 4);
    ctx.stroke();
  }

  // 腿（放大奔跑）
  const legLen = 90;
  const lLegAngle = Math.sin(legPhase) * 0.5;
  const lKneeX = Math.cos(lLegAngle) * legLen * 0.5;
  const lKneeY = 50 + Math.sin(lLegAngle) * legLen * 0.3;
  const lFootX = lKneeX + Math.cos(lLegAngle + 0.3) * legLen * 0.4;
  const lFootY = lKneeY + Math.sin(lLegAngle + 0.3) * legLen * 0.3;

  ctx.strokeStyle = '#FFA500';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-22, 60);
  ctx.lineTo(lKneeX, lKneeY);
  ctx.lineTo(lFootX, lFootY);
  ctx.stroke();

  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(lFootX, lFootY + 3, 14, 6, lLegAngle * 0.3, 0, Math.PI * 2);
  ctx.fill();

  const rLegAngle = Math.sin(legPhase + Math.PI) * 0.5;
  const rKneeX = Math.cos(rLegAngle) * legLen * 0.5;
  const rKneeY = 50 + Math.sin(rLegAngle) * legLen * 0.3;
  const rFootX = rKneeX + Math.cos(rLegAngle + 0.3) * legLen * 0.4;
  const rFootY = rKneeY + Math.sin(rLegAngle + 0.3) * legLen * 0.3;

  ctx.strokeStyle = '#FFA500';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-8, 60);
  ctx.lineTo(rKneeX, rKneeY);
  ctx.lineTo(rFootX, rFootY);
  ctx.stroke();

  ctx.fillStyle = '#FFA500';
  ctx.beginPath();
  ctx.ellipse(rFootX, rFootY + 3, 14, 6, rLegAngle * 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ========== 绘制自行车（放大版） ==========
function drawBike(t) {
  const p = state.pelican;
  const b = state.bike;
  const cx = p.x + 15;
  const cy = p.y - 80 + b.bounce;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(b.tilt);

  const wheelR = 42;
  const frameColor = '#E74C3C';
  const frameDark = '#C0392B';

  // 后轮
  const rearX = -52;
  const rearY = 30;
  ctx.save();
  ctx.translate(rearX, rearY);
  ctx.rotate(b.wheelAngle);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(0, 0, wheelR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * wheelR, Math.sin(a) * wheelR);
    ctx.stroke();
  }
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 前轮
  const frontX = 52;
  const frontY = 30;
  ctx.save();
  ctx.translate(frontX, frontY);
  ctx.rotate(b.wheelAngle);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(0, 0, wheelR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * wheelR, Math.sin(a) * wheelR);
    ctx.stroke();
  }
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 车架（钻石型，加粗）
  ctx.strokeStyle = frameColor;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(rearX, rearY);
  ctx.lineTo(0, 50);
  ctx.lineTo(-22, 0);
  ctx.lineTo(frontX - 8, 0);
  ctx.lineTo(frontX, frontY);
  ctx.moveTo(0, 50);
  ctx.lineTo(rearX, rearY);
  ctx.stroke();

  // 前叉
  ctx.strokeStyle = frameDark;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(frontX - 8, 0);
  ctx.lineTo(frontX, frontY);
  ctx.stroke();

  // 车把（放大）
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(frontX - 18, -18);
  ctx.quadraticCurveTo(frontX - 8, -26, frontX + 12, -18);
  ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(frontX - 18, -18, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(frontX + 12, -18, 5, 0, Math.PI * 2);
  ctx.fill();

  // 车座（放大）
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.moveTo(-32, -12);
  ctx.quadraticCurveTo(-22, -22, -12, -12);
  ctx.quadraticCurveTo(-18, -5, -32, -12);
  ctx.fill();
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-22, 0);
  ctx.lineTo(-22, 10);
  ctx.stroke();

  // 中轴/链条
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(0, 50, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 50, 14, 0, Math.PI * 2);
  ctx.stroke();

  // 脚踏与曲柄（放大）
  ctx.save();
  ctx.translate(0, 50);
  ctx.rotate(b.pedalAngle);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 26);
  ctx.stroke();
  ctx.fillStyle = '#444';
  ctx.fillRect(-9, 24, 18, 6);
  ctx.restore();

  ctx.save();
  ctx.translate(0, 50);
  ctx.rotate(b.pedalAngle + Math.PI);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, 26);
  ctx.stroke();
  ctx.fillStyle = '#444';
  ctx.fillRect(-9, 24, 18, 6);
  ctx.restore();

  // 车铃（放大）
  const bellX = frontX - 15;
  const bellY = -22 + b.bellVibrate * 4;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(bellX, bellY, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(bellX + 5, bellY - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ========== 粒子系统 ==========
function drawParticles(t) {
  state.feathers.forEach((f, i) => {
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.02;
    f.rot += f.rotSpeed;
    f.life -= 0.008;
    if (f.life <= 0) { state.feathers.splice(i, 1); return; }

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = f.life;
    ctx.fillStyle = '#F0F0E8';
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(180,180,170,0.5)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(-f.size, 0);
    ctx.lineTo(f.size, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  });

  state.sweatDrops.forEach((s, i) => {
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.15;
    s.life -= 0.015;
    if (s.life <= 0) { state.sweatDrops.splice(i, 1); return; }

    ctx.fillStyle = `rgba(100,180,255,${s.life * 0.7})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });

  if (state.fishAnim && state.fishAnim.life > 0) {
    const f = state.fishAnim;
    f.life -= 0.02;
    const progress = 1 - f.life;
    const fx = f.x + (f.targetX - f.x) * progress;
    const fy = f.y + (f.targetY - f.y) * progress - Math.sin(progress * Math.PI) * 40;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(-0.3);
    ctx.globalAlpha = f.life;
    ctx.fillStyle = '#6CB4EE';
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-f.size, 0);
    ctx.lineTo(-f.size - 10, -8);
    ctx.lineTo(-f.size - 10, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(f.size * 0.5, -2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(f.size * 0.5 + 0.5, -2, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
    if (f.life <= 0) state.fishAnim = null;
  }

  if (state.sprinting) {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const ly = H * 0.3 + Math.random() * H * 0.4;
      const lx = Math.random() * W;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + 40 + Math.random() * 60, ly);
      ctx.stroke();
    }
  }
}

// ========== 车铃特效 ==========
function drawBellEffect(t) {
  if (state.bellRing > 0) {
    state.bellRing -= 0.02;
    const p = state.pelican;
    const bellX = p.x + 70;
    const bellY = p.y - 110;

    ctx.save();
    ctx.globalAlpha = state.bellRing;
    ctx.fillStyle = '#FFD700';
    ctx.font = `bold ${28 + (1 - state.bellRing) * 28}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🔔 Ding!', bellX, bellY - (1 - state.bellRing) * 30);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ========== 主循环 ==========
let lastTime = 0;
function update(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const t = timestamp / 1000;

  state.groundOffset += state.speed * dt * 60;

  const p = state.pelican;
  const legSpeed = 3 + state.speed * 8;
  p.legPhase += dt * legSpeed;
  p.wingPhase += dt * (2 + state.speed * 4);
  p.headBob = Math.sin(t * legSpeed * 0.5) * 0.5;
  p.bodyTilt = Math.sin(t * legSpeed * 0.3) * 0.03 * state.speed;

  if (state.stamina < 30) {
    p.panting = (30 - state.stamina) / 30;
  } else {
    p.panting *= 0.95;
  }

  if (p.surprise > 0) p.surprise -= dt * 0.8;
  if (p.surprise < 0) p.surprise = 0;

  if (p.eyeState !== 'normal') {
    if (p.eyeState === 'happy' && state.feedTimer <= 0) p.eyeState = 'normal';
  }

  if (state.sprinting) {
    state.sprintTimer -= dt;
    if (state.sprintTimer <= 0) {
      state.sprinting = false;
      state.speed = speedSlider.value / 100;
    }
  }

  if (state.sprinting) {
    state.stamina -= dt * 20;
  } else {
    state.stamina -= dt * state.speed * 3;
  }
  state.stamina = Math.max(0, Math.min(100, state.stamina));

  if (state.stamina < 5 && !state.sprinting) state.speed *= 0.98;
  if (state.bellCooldown > 0) state.bellCooldown -= dt;
  if (state.feedTimer > 0) state.feedTimer -= dt;

  const b = state.bike;
  b.wheelAngle += dt * state.speed * 15;
  b.pedalAngle += dt * state.speed * 10;
  b.bounce = Math.sin(t * legSpeed) * 3 * state.speed;
  b.tilt = Math.sin(t * legSpeed * 0.7) * 0.02 * state.speed;
  b.bellVibrate *= 0.9;

  if (state.stamina < 40 && Math.random() < 0.1) {
    state.sweatDrops.push({
      x: p.x + (Math.random() - 0.5) * 60,
      y: p.y - 50 + Math.random() * 20,
      vx: -0.5 - Math.random(),
      vy: -1 - Math.random() * 2,
      size: 2 + Math.random() * 2,
      life: 1
    });
  }

  staminaFill.style.width = state.stamina + '%';
  if (state.stamina < 25) {
    staminaFill.classList.add('low');
  } else {
    staminaFill.classList.remove('low');
  }

  ctx.clearRect(0, 0, W, H);
  drawSky(t);
  drawClouds(t);
  drawBuildings(t);
  drawWater(t);
  drawGround(t);
  drawPelican(t);
  drawBike(t);
  drawParticles(t);
  drawBellEffect(t);

  if (state.speed > 0.5) {
    ctx.save();
    ctx.globalAlpha = (state.speed - 0.5) * 0.5;
    ctx.fillStyle = '#FFF';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'left';
    const speedText = state.sprinting ? ' 冲刺中!' : '💨 快速前进';
    ctx.fillText(speedText, 20, 30);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
