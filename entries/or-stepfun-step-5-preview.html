<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自行车骑鹈鹕 · 单文件交互剧场</title>
<style>
  :root{
    --panel-bg: rgba(14, 21, 38, 0.62);
    --panel-border: rgba(255,255,255,0.16);
    --text:#eef4ff;
    --muted:rgba(238,244,255,.72);
    --accent:#ffd166;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background:#07101d;color:var(--text);
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;}
  .hud{
    position:fixed;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .topbar{
    padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;
    gap:14px;flex-wrap:wrap;
  }
  .brand{
    background:linear-gradient(180deg,rgba(10,17,33,.52),rgba(10,17,33,.24));
    border:1px solid var(--panel-border);border-radius:16px;padding:10px 16px;
    backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(0,0,0,.28);
  }
  .brand h1{
    margin:0;font-size:clamp(18px,2.3vw,30px);letter-spacing:1px;line-height:1.15;
  }
  .brand p{margin:5px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.4px;}
  .status{
    background:linear-gradient(180deg,rgba(10,17,33,.52),rgba(10,17,33,.24));
    border:1px solid var(--panel-border);border-radius:16px;padding:10px 14px;
    backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(0,0,0,.28);
    min-width:230px;font-size:12.5px;
  }
  .status .row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .status .row span{color:var(--muted);min-width:34px;}
  .status .row b{font-variant-numeric:tabular-nums;font-weight:600;}
  .bar{
    position:relative;flex:1;height:9px;border-radius:99px;overflow:hidden;
    background:rgba(255,255,255,.14);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  }
  .bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .12s linear;}
  .panel{
    pointer-events:auto;margin:0 auto 20px;width:min(1020px,calc(100% - 28px));
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;
    backdrop-filter:blur(14px);box-shadow:0 20px 48px rgba(0,0,0,.38);
    padding:14px 16px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end;
  }
  .control{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .control label{font-size:11.5px;color:var(--muted);letter-spacing:.6px;}
  .control output,.control span{font-size:12px;color:var(--muted);}
  button{
    appearance:none;border:1px solid rgba(255,255,255,.18);border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    color:var(--text);font:600 13px/1.2 inherit;padding:11px 12px;cursor:pointer;
    transition:transform .12s ease, box-shadow .18s ease, background .18s ease;
    box-shadow:0 8px 18px rgba(0,0,0,.22);touch-action:none;user-select:none;
  }
  button:hover{transform:translateY(-1px);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));}
  button:active{transform:translateY(1px) scale(.99);}
  button.active{
    background:linear-gradient(180deg,#ffd166,#f29d38);color:#22180a;border-color:rgba(255,255,255,.4);
    box-shadow:0 0 0 3px rgba(255,209,102,.18),0 10px 22px rgba(0,0,0,.3);
  }
  input[type="range"]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:7px;border-radius:99px;background:linear-gradient(90deg,#8ee7a1,#ffd166,#ff8a5b);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;margin-top:-5px;
    background:#fff;border:2px solid #2b3550;box-shadow:0 3px 8px rgba(0,0,0,.35);
  }
  input[type="range"]::-moz-range-track{height:7px;border-radius:99px;background:linear-gradient(90deg,#8ee7a1,#ffd166,#ff8a5b);}
  input[type="range"]::-moz-range-thumb{width:15px;height:15px;border:2px solid #2b3550;border-radius:50%;background:#fff;}
  @media (max-width:640px){
    .topbar{padding:12px;}
    .status{min-width:180px;font-size:11.5px;}
    .panel{margin-bottom:12px;padding:12px;grid-template-columns:repeat(2,minmax(0,1fr));}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud">
  <div class="topbar">
    <div class="brand">
      <h1>一辆自行车，正在骑一只鹈鹕</h1>
      <p>Bicycle Riding a Pelican · 单文件 Canvas 交互剧场</p>
    </div>
    <div class="status">
      <div class="row"><span>速度</span><b id="speedVal">0.0 km/h</b></div>
      <div class="row"><span>体力</span><div class="bar"><i id="staminaFill"></i></div><b id="staminaVal">100%</b></div>
      <div class="row"><span>环境</span><b id="envVal">白天 · 海滨木栈道</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="control">
      <label for="speedRange">巡航速度</label>
      <input id="speedRange" type="range" min="0" max="100" value="42" />
      <span id="rangeHint">19 km/h</span>
    </div>
    <div class="control">
      <button id="bellBtn">🔔 按车铃</button>
    </div>
    <div class="control">
      <button id="sprintBtn">💨 冲刺（按住）</button>
    </div>
    <div class="control">
      <button id="feedBtn">🐟 投喂小鱼</button>
    </div>
    <div class="control">
      <button id="roadBtn">🛤 路况：木栈道</button>
    </div>
    <div class="control">
      <button id="timeBtn">🌤 时间：白天</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  if(!ctx){ return; }

  const speedRange = document.getElementById("speedRange");
  const rangeHint = document.getElementById("rangeHint");
  const bellBtn = document.getElementById("bellBtn");
  const sprintBtn = document.getElementById("sprintBtn");
  const feedBtn = document.getElementById("feedBtn");
  const roadBtn = document.getElementById("roadBtn");
  const timeBtn = document.getElementById("timeBtn");
  const speedVal = document.getElementById("speedVal");
  const staminaFill = document.getElementById("staminaFill");
  const staminaVal = document.getElementById("staminaVal");
  const envVal = document.getElementById("envVal");

  const TAU = Math.PI * 2;
  const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
  const lerp = (a,b,t)=> a+(b-a)*t;
  const rand = (a,b)=> a+Math.random()*(b-a);
  const mod = (n,m)=> ((n%m)+m)%m;

  function hexToRgb(h){
    h = h.replace("#","");
    if(h.length === 3){ h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    const n = parseInt(h,16);
    return {r:(n>>16)&255,g:(n>>8)&255,b:n&255};
  }
  function toHex2(x){
    const s = Math.round(clamp(x,0,255)).toString(16);
    return s.length === 1 ? "0"+s : s;
  }
  function mixHex(a,b,t){
    const A=hexToRgb(a), B=hexToRgb(b);
    return "#"+toHex2(lerp(A.r,B.r,t))+toHex2(lerp(A.g,B.g,t))+toHex2(lerp(A.b,B.b,t));
  }
  function rgba(hex,a){
    const c=hexToRgb(hex);
    return "rgba("+c.r+","+c.g+","+c.b+","+a+")";
  }

  let W=0,H=0,DPR=1;
  let horizonY=0, beachY=0, groundY=0;
  let subjectScale=1, subjectX=0;

  const palettes = {
    day:{
      skyTop:"#79d2ff", skyMid:"#bfeaff", skyBottom:"#eaf9ff",
      seaFar:"#2f9ac0", seaNear:"#176f95",
      sand:"#f4e0b0", ground:"#dcb785", groundDark:"#b58d5c",
      rail:"#8b5e3c", plankA:"#e0b686", plankB:"#c69a68",
      stoneA:"#c3bcb2", stoneB:"#8f887d",
      celestialColor:"#fff4b8", celestialAlpha:1, celestialY:0.22, star:0,
      overlay:"rgba(255,255,255,0)"
    },
    dusk:{
      skyTop:"#241f4d", skyMid:"#7d4a76", skyBottom:"#ffb27a",
      seaFar:"#413a70", seaNear:"#241f47",
      sand:"#dda977", ground:"#ac724d", groundDark:"#7a4c36",
      rail:"#5c3b2f", plankA:"#bd8860", plankB:"#8f6443",
      stoneA:"#a08d85", stoneB:"#65574f",
      celestialColor:"#ffd9a0", celestialAlpha:1, celestialY:0.10, star:.38,
      overlay:"rgba(255,138,76,0.10)"
    },
    night:{
      skyTop:"#03061c", skyMid:"#0b1740", skyBottom:"#22406e",
      seaFar:"#132648", seaNear:"#081227",
      sand:"#4f5b81", ground:"#4b4363", groundDark:"#332c49",
      rail:"#2b2740", plankA:"#5a4b6e", plankB:"#433857",
      stoneA:"#5e5d72", stoneB:"#3b394a",
      celestialColor:"#eaf2ff", celestialAlpha:1, celestialY:0.24, star:1,
      overlay:"rgba(8,16,42,0.34)"
    }
  };

  function clonePal(p){ const o={}; for(const k in p) o[k]=p[k]; return o; }
  let palFrom=clonePal(palettes.day), palTo=clonePal(palettes.day), palPhase=1;
  let pal=clonePal(palettes.day);

  const state = {
    t:0, dist:0, speed:0, runPhase:0, wheelAngle:0, crankAngle:0, wingPhase:0,
    stamina:100, startleTimer:0, sprintTimer:0, bellRing:0, shake:0,
    pouchExpand:0, blink:0, blinkTimer:2.5, fishCooldown:0, statusTimer:0,
    roadType:"boardwalk", timeMode:"day", bumpY:0
  };

  let bodyBob=0, bikeY=-188, bikeLean=0, headBob=0, pouchWobble=0, tilt=0;
  let shakeX=0, shakeY=0;
  let sprintHold=false;

  const clouds=[], stars=[], pebbles=[], feathers=[], sweats=[], fishes=[], floats=[];

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.max(1,Math.floor(W*DPR));
    canvas.height = Math.max(1,Math.floor(H*DPR));
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);

    horizonY = H*0.44;
    groundY = H*0.76;
    beachY = horizonY + (groundY-horizonY)*0.34;
    subjectScale = clamp(Math.min(W/1150,H/850), 0.46, 1.08);
    subjectX = W*0.50;

    initClouds(); initStars(); initPebbles();
  }

  function initClouds(){
    clouds.length=0;
    const n = Math.max(5, Math.round(W/220));
    for(let i=0;i<n;i++){
      clouds.push({
        x:rand(-100,W+100), y:rand(H*0.08,H*0.34),
        s:rand(.55,1.5), sp:rand(5,16), a:rand(.42,.9)
      });
    }
  }
  function initStars(){
    stars.length=0;
    const n=Math.round(W*H/16000);
    for(let i=0;i<n;i++){
      stars.push({x:Math.random()*W, y:Math.random()*H*0.42, r:rand(.5,1.7), ph:rand(0,TAU)});
    }
  }
  function initPebbles(){
    pebbles.length=0;
    const spacing=58;
    const n=Math.ceil(W/spacing)+18;
    for(let i=0;i<n;i++){
      pebbles.push({
        x:i*spacing+rand(-16,16),
        y:rand(groundY+12, Math.max(groundY+20,H-8)),
        r:rand(9,21), rot:rand(-.4,.4), dark:Math.random()<.5
      });
    }
  }

  function setTime(mode){
    if(state.timeMode === mode) return;
    palFrom = clonePal(pal);
    palTo = clonePal(palettes[mode]);
    palPhase = 0;
    state.timeMode = mode;
  }
  function updatePalette(dt){
    if(palPhase >= 1) return;
    palPhase = Math.min(1, palPhase + dt/0.9);
    const t = palPhase<.5 ? 2*palPhase*palPhase : 1-Math.pow(-2*palPhase+2,2)/2;
    const colorKeys=["skyTop","skyMid","skyBottom","seaFar","seaNear","sand","ground","groundDark",
      "rail","plankA","plankB","stoneA","stoneB","celestialColor"];
    for(const k of colorKeys) pal[k]=mixHex(palFrom[k],palTo[k],t);
    pal.star=lerp(palFrom.star,palTo.star,t);
    pal.celestialAlpha=lerp(palFrom.celestialAlpha,palTo.celestialAlpha,t);
    pal.celestialY=lerp(palFrom.celestialY,palTo.celestialY,t);
    pal.overlay = palPhase<.5 ? palFrom.overlay : palTo.overlay;
    if(palPhase>=1) pal=clonePal(palTo);
  }

  let audioCtx=null;
  function ensureAudio(){
    try{
      if(!audioCtx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        audioCtx = new AC();
      }
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function ringBell(){
    try{
      const ac=ensureAudio(); if(!ac) return;
      const now=ac.currentTime;
      const master=ac.createGain();
      master.gain.setValueAtTime(0.0001,now);
      master.gain.exponentialRampToValueAtTime(0.24,now+0.008);
      master.gain.exponentialRampToValueAtTime(0.0001,now+1.7);
      master.connect(ac.destination);

      const partials=[1567.98,2093.00,2637.00,3135.96,4186.01];
      partials.forEach((f,i)=>{
        const o=ac.createOscillator();
        o.type="sine";
        o.frequency.setValueAtTime(f*(1+(Math.random()-.5)*0.004), now+i*0.004);
        const g=ac.createGain();
        g.gain.setValueAtTime(0.0001,now+i*0.004);
        g.gain.exponentialRampToValueAtTime(0.42/(1+i*0.72), now+0.012+i*0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, now+1.25+i*0.08);
        o.connect(g); g.connect(master);
        o.start(now+i*0.004); o.stop(now+1.75+i*0.1);
      });

      const click=ac.createOscillator();
      click.type="triangle";
      click.frequency.setValueAtTime(2600,now);
      click.frequency.exponentialRampToValueAtTime(760,now+0.08);
      const cg=ac.createGain();
      cg.gain.setValueAtTime(0.17,now);
      cg.gain.exponentialRampToValueAtTime(0.0001,now+0.15);
      click.connect(cg); cg.connect(master);
      click.start(now); click.stop(now+0.18);
    }catch(e){}
  }
  function playFeedSound(){
    try{
      const ac=ensureAudio(); if(!ac) return;
      const now=ac.currentTime;
      const o=ac.createOscillator(); o.type="sine";
      o.frequency.setValueAtTime(300,now);
      o.frequency.exponentialRampToValueAtTime(760,now+0.18);
      const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,now);
      g.gain.exponentialRampToValueAtTime(0.16,now+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,now+0.34);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now+0.36);
    }catch(e){}
  }

  function sp(relX,relY){
    return {
      x: subjectX + relX*subjectScale,
      y: groundY + (relY + bodyBob)*subjectScale
    };
  }
  function addFloat(text,x,y,color,size){
    floats.push({text:text,x:x,y:y,vy:-38,life:1.25,max:1.25,color:color||"#ffffff",size:size||20});
  }
  function spawnFeather(){
    const p=sp(rand(-140,-55), rand(-150,-90));
    feathers.push({x:p.x,y:p.y,vx:rand(-170,-55),vy:rand(-80,-15),rot:rand(0,TAU),vr:rand(-3,3),life:rand(1.2,2.1),max:2.1});
  }
  function spawnSweat(){
    const p=sp(rand(48,112), rand(-232,-190));
    sweats.push({x:p.x,y:p.y,vx:rand(-190,-70),vy:rand(-35,25),life:.85,max:.85});
  }

  function triggerBell(){
    ringBell();
    state.bellRing=1;
    state.startleTimer=1.35;
    state.stamina=clamp(state.stamina-4,0,100);
    for(let i=0;i<10;i++) spawnFeather();
    const p=sp(20,-300);
    addFloat("叮——！",p.x,p.y,"#ffe08a",28);
  }

  function feedFish(){
    if(state.fishCooldown>0) return;
    if(state.stamina>=99.5){
      const p=sp(150,-260);
      addFloat("吃撑啦",p.x,p.y,"#ffd166",22);
      return;
    }
    state.fishCooldown=.45;
    const start={x:W*0.5,y:H+50};
    const ctrl={x:W*0.32,y:H*0.40};
    const target=sp(196,-182);
    fishes.push({start:start,ctrl:ctrl,target:target,t:0,duration:.95,caught:false,rot:0});
    playFeedSound();
    addFloat("小鱼干！",start.x,start.y-24,"#9be7ff",19);
  }

  function updateStatus(){
    const sliderSpeed = parseFloat(speedRange.value)*0.45;
    speedVal.textContent = state.speed.toFixed(1)+" km/h";
    rangeHint.textContent = sliderSpeed.toFixed(0)+" km/h";
    staminaFill.style.width = clamp(state.stamina,0,100).toFixed(0)+"%";
    staminaFill.style.background = state.stamina>60
      ? "linear-gradient(90deg,#7ce38b,#37b36b)"
      : (state.stamina>25 ? "linear-gradient(90deg,#ffd166,#f29d38)" : "linear-gradient(90deg,#ff8a8a,#d64545)");
    staminaVal.textContent = Math.round(state.stamina)+"%";
    const timeLabel = state.timeMode==="day" ? "白天" : (state.timeMode==="dusk" ? "黄昏" : "夜晚");
    const roadLabel = state.roadType==="boardwalk" ? "海滨木栈道" : "颠簸石子路";
    envVal.textContent = timeLabel+" · "+roadLabel;
    sprintBtn.classList.toggle("active", sprintHold || state.sprintTimer>0);
  }

  function update(dt){
    state.t += dt;
    state.fishCooldown=Math.max(0,state.fishCooldown-dt);
    state.statusTimer-=dt;
    if(state.statusTimer<=0){ updateStatus(); state.statusTimer=.1; }

    const cruise = parseFloat(speedRange.value)*0.45;
    let target = cruise;
    if(sprintHold) target += 26;
    if(state.sprintTimer>0){ target += 26; state.sprintTimer=Math.max(0,state.sprintTimer-dt); }
    if(state.startleTimer>0){ target += 16; state.startleTimer=Math.max(0,state.startleTimer-dt); }
    if(state.stamina<20) target *= .5+.5*(state.stamina/20);
    if(state.roadType==="bumpy") target *= .93;

    state.speed += (target-state.speed)*Math.min(1,dt*(target>state.speed?1.8:2.6));
    if(state.speed<.02) state.speed=0;

    const speed01 = clamp(state.speed/40,0,1.35);
    const gait = clamp(state.speed/14,0,1);

    state.dist += state.speed*dt*12;
    state.wheelAngle += state.speed*dt*.85;
    state.crankAngle += state.speed*dt*.58;
    state.runPhase += dt*(1.4+state.speed*.24);
    state.wingPhase += dt*(3.2+state.speed*.12+(state.startleTimer>0?9:0)+(sprintHold?6:0));

    let drain = (.8+state.speed*.085)*(state.roadType==="bumpy"?1.18:1);
    if(sprintHold || state.sprintTimer>0) drain += 26;
    state.stamina = clamp(state.stamina-drain*dt,0,100);
    if(state.stamina<=0){ sprintHold=false; state.sprintTimer=0; }
    if(state.speed<3) state.stamina=clamp(state.stamina+5*dt,0,100);

    state.bellRing=Math.max(0,state.bellRing-dt*1.5);
    state.pouchExpand=Math.max(0,state.pouchExpand-dt*.85);

    state.blinkTimer-=dt;
    if(state.blinkTimer<0){ state.blinkTimer=rand(2.2,5.2); state.blink=.14; }
    if(state.blink>0) state.blink=Math.max(0,state.blink-dt);

    const bumpAmp=(state.roadType==="bumpy"?9.5:2.6)*speed01;
    state.bumpY = Math.sin(state.t*(5+state.speed*.13))*bumpAmp
                + Math.sin(state.t*(11+state.speed*.21)+1.3)*bumpAmp*.42;

    bodyBob = -Math.abs(Math.sin(state.runPhase))*7*gait + state.bumpY*.55;
    tilt = -.055 + speed01*.07 + Math.sin(state.runPhase*2)*.022*gait + state.bumpY*.0016;
    bikeLean = Math.sin(state.runPhase*2+.7)*.024*gait + tilt*.3 + state.bumpY*.0013;
    bikeY = bodyBob - 188 + state.bumpY*.7 + Math.sin(state.runPhase*2+1.2)*3.4*gait;
    headBob = Math.cos(state.runPhase)*4*gait + state.bumpY*.35;
    pouchWobble = Math.sin(state.t*7.5+state.speed*.1)*(2+speed01*5)+state.pouchExpand*7;

    const shake=(state.roadType==="bumpy"?2.2:.4)*speed01+(state.startleTimer>0?5:0)+state.bellRing*3.5;
    state.shake=shake;
    shakeX=rand(-1,1)*shake;
    shakeY=rand(-1,1)*shake*.55;

    if(state.speed>8 && Math.random()<dt*(state.stamina<55?2.6:.9)) spawnSweat();
    if((state.startleTimer>0 || sprintHold) && Math.random()<dt*10) spawnFeather();

    for(let i=feathers.length-1;i>=0;i--){
      const f=feathers[i];
      f.x += f.vx*dt; f.y += f.vy*dt; f.vy += 14*dt; f.vx *= (1-.5*dt);
      f.rot += f.vr*dt; f.life -= dt;
      if(f.life<=0) feathers.splice(i,1);
    }
    for(let i=sweats.length-1;i>=0;i--){
      const s=sweats[i];
      s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 210*dt;
      s.life -= dt;
      if(s.life<=0) sweats.splice(i,1);
    }
    for(let i=floats.length-1;i>=0;i--){
      const f=floats[i];
      f.y += f.vy*dt; f.life -= dt;
      if(f.life<=0) floats.splice(i,1);
    }
    for(let i=fishes.length-1;i>=0;i--){
      const f=fishes[i];
      if(f.caught){ fishes.splice(i,1); continue; }
      f.t += dt/f.duration;
      f.rot = Math.sin(f.t*11)*.25;
      if(f.t>=1){
        f.caught=true;
        state.stamina=clamp(state.stamina+22,0,100);
        state.pouchExpand=Math.min(1.25,state.pouchExpand+.85);
        addFloat("呜姆 +22",f.target.x,f.target.y-32,"#7ce38b",20);
      }
    }

    updatePalette(dt);
  }

        ctx.fillStyle=rgba(light?pal.plankA:pal.plankB,.95);
        ctx.fillRect(x,groundY+3,spacing-4,H-groundY);

      ctx.fillStyle=lg;
      ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(150,-52); ctx.lineTo(150,52); ctx.lineTo(0,4);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle="#7a4b2a"; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(36,-76);
    ctx.quadraticCurveTo(58,-40,78,-4);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(-42,-64);
    const len=76+state.speed*1.3;
    const sg2=ctx.createLinearGradient(0,0,-len,20);
    sg2.addColorStop(0,"#ff6b6b"); sg2.addColorStop(1,"rgba(255,107,107,0)");
    ctx.fillStyle=sg2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    for(let i=1;i<=5;i++){
      const p=i/5;
      ctx.lineTo(-len*p, Math.sin(state.t*9+p*4)*7*p);
    }
    for(let i=5;i>=1;i--){
      const p=i/5;
      ctx.lineTo(-len*p, 9+Math.sin(state.t*9+p*4)*7*p);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function drawSubject(){
    ctx.save();
    ctx.translate(subjectX,groundY);
    ctx.scale(subjectScale,subjectScale);

    drawShadow();
    drawLegs();

    ctx.save();
    ctx.translate(0,bodyBob);
    ctx.rotate(tilt);
    drawTail();
    drawFarWing();
    drawBody();
    drawNeckHead();
    drawNearWing();
    ctx.restore();

    ctx.save();
    ctx.translate(-8,bikeY);
    ctx.rotate(bikeLean);
    drawBicycle();
    ctx.restore();

    ctx.restore();
  }

  function drawFeathers(){
    for(const f of feathers){
      ctx.save();
      ctx.translate(f.x,f.y); ctx.rotate(f.rot);
      ctx.globalAlpha=clamp(f.life/f.max,0,1)*.92;
      ctx.fillStyle="#ffffff"; ctx.strokeStyle="rgba(120,140,175,.55)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(0,0,12,4,0,0,TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(11,0); ctx.stroke();
      ctx.restore();
    }
  }
  function drawSweats(){
    for(const s of sweats){
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.globalAlpha=clamp(s.life/s.max,0,1)*.9;
      ctx.fillStyle="#7fd7ff";
      ctx.beginPath();
      ctx.moveTo(0,-9); ctx.quadraticCurveTo(6,4,0,8); ctx.quadraticCurveTo(-6,4,0,-9);
      ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.65)";
      ctx.beginPath(); ctx.arc(-1.4,-1.5,1.5,0,TAU); ctx.fill();
      ctx.restore();
    }
  }
  function drawFishes(){
    for(const f of fishes){
      if(f.caught) continue;
      const p=f.t<1?f.t:1;
      const q=1-p;
      const x=q*q*f.start.x+2*q*p*f.ctrl.x+p*p*f.target.x;
      const y=q*q*f.start.y+2*q*p*f.ctrl.y+p*p*f.target.y;
      ctx.save();
      ctx.translate(x,y); ctx.rotate(f.rot);
      ctx.fillStyle="#79cfe6";
      ctx.beginPath(); ctx.ellipse(0,0,15,7,0,0,TAU); ctx.fill();
      ctx.fillStyle="#5eb3cd";
      ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(-24,-8); ctx.lineTo(-24,8); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#ffffff";
      ctx.beginPath(); ctx.arc(8,-2,2.1,0,TAU); ctx.fill();
      ctx.fillStyle="#20242c";
      ctx.beginPath(); ctx.arc(8.6,-2,1,0,TAU); ctx.fill();
      ctx.restore();
    }
  }
  function drawFloats(){
    ctx.save();
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const f of floats){
      ctx.globalAlpha=clamp(f.life/f.max,0,1);
      ctx.font="700 "+f.size+"px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif";
      ctx.lineWidth=4; ctx.strokeStyle="rgba(8,14,28,.55)";
      ctx.strokeText(f.text,f.x,f.y);
      ctx.fillStyle=f.color;
      ctx.fillText(f.text,f.x,f.y);
    }
    ctx.restore();
  }
  function drawOverlay(){
    if(pal.overlay && pal.overlay!=="rgba(255,255,255,0)"){
      ctx.fillStyle=pal.overlay;
      ctx.fillRect(0,0,W,H);
    }
    const g=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.28,W/2,H*.55,Math.max(W,H)*.78);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0,.34)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  }

  function render(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(shakeX,shakeY);
    drawBackground();
    drawSubject();
    drawFeathers();
    drawSweats();
    drawFishes();
    drawFloats();
    ctx.restore();
    drawOverlay();
  }

  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000 || 0);
    last=now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  bellBtn.addEventListener("click",triggerBell);
  feedBtn.addEventListener("click",feedFish);
  speedRange.addEventListener("input",updateStatus);

  sprintBtn.addEventListener("pointerdown",function(e){
    e.preventDefault(); sprintHold=true; updateStatus();
  });
  window.addEventListener("pointerup",function(){ if(sprintHold){ sprintHold=false; updateStatus(); }});
  window.addEventListener("pointercancel",function(){ if(sprintHold){ sprintHold=false; updateStatus(); }});

  roadBtn.addEventListener("click",function(){
    state.roadType = state.roadType==="boardwalk" ? "bumpy" : "boardwalk";
    roadBtn.textContent = state.roadType==="boardwalk" ? "🛤 路况：木栈道" : "🪨 路况：石子路";
    if(state.roadType==="bumpy"){
      const p=sp(150,-250);
      addFloat("咯噔咯噔！",p.x,p.y,"#ffd166",20);
    }
    updateStatus();
  });

  timeBtn.addEventListener("click",function(){
    const order=["day","dusk","night"];
    const idx=order.indexOf(state.timeMode);
    const next=order[(idx+1)%order.length];
    setTime(next);
    timeBtn.textContent = next==="day" ? "🌤 时间：白天" : (next==="dusk" ? "🌇 时间：黄昏" : "🌙 时间：夜晚");
    updateStatus();
  });

  window.addEventListener("resize",resize);

  resize();
  updateStatus();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
