<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bicycle Riding a Pelican</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
canvas { display: block; }
#controls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; z-index: 10;
  background: rgba(0,0,0,0.45); backdrop-filter: blur(10px);
  padding: 12px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.15);
}
.ctrl-btn {
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
  color: #fff; padding: 8px 16px; border-radius: 25px; cursor: pointer;
  font-size: 13px; transition: all 0.2s; user-select: none; white-space: nowrap;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
.ctrl-btn:active { transform: scale(0.95); }
.ctrl-btn.active { background: rgba(255,180,50,0.4); border-color: rgba(255,180,50,0.6); }
#speedSlider {
  -webkit-appearance: none; width: 100px; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.2); outline: none;
}
#speedSlider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #ffb432; cursor: pointer; border: 2px solid #fff;
}
.ctrl-label { color: rgba(255,255,255,0.7); font-size: 11px; }
#staminaBar {
  position: fixed; top: 20px; right: 20px; z-index: 10;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
  padding: 10px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
}
#staminaBar .label { color: rgba(255,255,255,0.7); font-size: 11px; margin-bottom: 4px; }
#staminaBar .bar { width: 120px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
#staminaBar .fill { height: 100%; background: linear-gradient(90deg, #ff6b6b, #51cf66); border-radius: 4px; transition: width 0.3s; }
#title {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
  color: #fff; font-size: 18px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  opacity: 0.8; letter-spacing: 1px;
}
#fishCount {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);
  padding: 8px 14px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-size: 13px;
}
</style>
</head>
<body>
<div id="title">🚲 A Bicycle Riding a Pelican 🐦</div>
<div id="staminaBar">
  <div class="label">🫁 Pelican Stamina</div>
  <div class="bar"><div class="fill" id="staminaFill" style="width:100%"></div></div>
</div>
<div id="fishCount">🐟 Fish: <span id="fishNum">0</span></div>
<canvas id="c"></canvas>
<div id="controls">
  <button class="ctrl-btn" id="bellBtn">🔔 Ring Bell</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
    <span class="ctrl-label">Speed</span>
    <input type="range" id="speedSlider" min="0" max="100" value="40">
  </div>
  <button class="ctrl-btn" id="sprintBtn">⚡ Sprint</button>
  <button class="ctrl-btn" id="feedBtn">🐟 Feed Fish</button>
  <button class="ctrl-btn" id="themeBtn" data-theme="0">🌅 Theme</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// State
const state = {
  time: 0, speed: 0.4, targetSpeed: 0.4, scrollX: 0,
  stamina: 100, sprinting: false, sprintTimer: 0,
  bellRinging: false, bellTimer: 0, bellShake: 0,
  scared: false, scaredTimer: 0,
  theme: 0, // 0=day, 1=sunset, 2=night
  fishFed: 0, fishParticles: [],
  feathers: [], sweatDrops: [], clouds: [],
  boardwalkOffset: 0, pelicanBob: 0, pelicanBreath: 0,
  wheelAngle: 0, pedalAngle: 0, bikeShake: { x: 0, y: 0, r: 0 },
  pelicanLegPhase: 0, wingPhase: 0, throatPhase: 0,
  pelicanExpression: 'normal', // normal, surprised, tired, happy
  groundBumps: [],
};

// Themes
const themes = [
  { sky1: '#87CEEB', sky2: '#E0F7FA', sea1: '#1E88E5', sea2: '#0D47A1', sand: '#F5DEB3', boardwalk: '#8B6914', light: 1.0, name: '☀️' },
  { sky1: '#FF6B35', sky2: '#FFD700', sea1: '#FF8C00', sea2: '#8B0000', sand: '#DEB887', boardwalk: '#6B4226', light: 0.8, name: '🌅' },
  { sky1: '#0C1445', sky2: '#1A237E', sea1: '#0D1B3E', sea2: '#050A1A', sand: '#3E3A36', boardwalk: '#2C1E0F', light: 0.3, name: '🌙' },
];

// Init clouds
for (let i = 0; i < 8; i++) {
  state.clouds.push({ x: Math.random() * W * 2, y: 30 + Math.random() * 100, w: 60 + Math.random() * 120, h: 25 + Math.random() * 30, speed: 0.1 + Math.random() * 0.3 });
}

// Init ground bumps
for (let i = 0; i < 200; i++) {
  state.groundBumps.push({ x: i * 50 + Math.random() * 20, h: Math.random() * 3 });
}

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBell() {
  try {
    const t = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = 'sine'; osc1.frequency.setValueAtTime(2200, t);
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(3300, t);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    osc1.start(t); osc2.start(t);
    osc1.stop(t + 0.6); osc2.stop(t + 0.6);
    // Second ding
    const osc3 = audioCtx.createOscillator();
    const osc4 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc3.type = 'sine'; osc3.frequency.setValueAtTime(2200, t + 0.15);
    osc4.type = 'sine'; osc4.frequency.setValueAtTime(3300, t + 0.15);
    gain2.gain.setValueAtTime(0, t);
    gain2.gain.setValueAtTime(0.25, t + 0.15);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    osc3.connect(gain2); osc4.connect(gain2); gain2.connect(audioCtx.destination);
    osc3.start(t + 0.15); osc4.start(t + 0.15);
    osc3.stop(t + 0.7); osc4.stop(t + 0.7);
  } catch(e) {}
}

function playHonk() {
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.linearRampToValueAtTime(120, t + 0.3);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.4);
  } catch(e) {}
}

function playSplash() {
  try {
    const t = audioCtx.currentTime;
    const bufferSize = audioCtx.sampleRate * 0.2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.2));
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 3000;
    src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    src.start(t);
  } catch(e) {}
}

// Controls
document.getElementById('bellBtn').addEventListener('click', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  state.bellRinging = true; state.bellTimer = 30;
  state.scared = true; state.scaredTimer = 60;
  state.targetSpeed = Math.min(1.0, state.targetSpeed + 0.3);
  setTimeout(() => { state.targetSpeed = document.getElementById('speedSlider').value / 100; }, 1500);
  playBell();
});

document.getElementById('speedSlider').addEventListener('input', (e) => {
  if (!state.sprinting) state.targetSpeed = e.target.value / 100;
});

document.getElementById('sprintBtn').addEventListener('click', () => {
  if (state.stamina > 20 && !state.sprinting) {
    state.sprinting = true; state.sprintTimer = 90;
    state.targetSpeed = 1.0;
    document.getElementById('sprintBtn').classList.add('active');
  }
});

document.getElementById('feedBtn').addEventListener('click', () => {
  state.fishFed++;
  document.getElementById('fishNum').textContent = state.fishFed;
  state.stamina = Math.min(100, state.stamina + 25);
  state.pelicanExpression = 'happy';
  setTimeout(() => { if (state.pelicanExpression === 'happy') state.pelicanExpression = 'normal'; }, 1500);
  playSplash();
  // Fish particles
  for (let i = 0; i < 5; i++) {
    state.fishParticles.push({
      x: W / 2 + (Math.random() - 0.5) * 60,
      y: H * 0.55,
      vx: (Math.random() - 0.5) * 3,
      vy: -2 - Math.random() * 3,
      life: 60, maxLife: 60, rot: Math.random() * Math.PI * 2
    });
  }
});

document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = (state.theme + 1) % 3;
  document.getElementById('themeBtn').textContent = ['🌅 Sunset', '🌙 Night', '☀️ Day'][state.theme];
});

// Drawing helpers
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(lerp(r1,r2,t)), g = Math.round(lerp(g1,g2,t)), b = Math.round(lerp(b1,b2,t));
  return `rgb(${r},${g},${b})`;
}

function drawSky(theme) {
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  grad.addColorStop(0, theme.sky1);
  grad.addColorStop(1, theme.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H * 0.5);
}

function drawStars(theme) {
  if (state.theme !== 2) return;
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 137.5) % W);
    const sy = ((i * 97.3 + 20) % (H * 0.4));
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(state.time * 0.02 + i));
    ctx.globalAlpha = twinkle * 0.8;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.5 + (i % 3) * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // Moon
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#FFFDE7';
  ctx.beginPath();
  ctx.arc(W * 0.8, 80, 35, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = theme.sky1;
  ctx.beginPath();
  ctx.arc(W * 0.8 + 12, 75, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawClouds(theme) {
  state.clouds.forEach(c => {
    c.x -= c.speed * state.speed * 0.3 + 0.05;
    if (c.x + c.w < -100) c.x = W + 100;
    ctx.fillStyle = state.theme === 2 ? 'rgba(100,100,140,0.3)' : 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.25, c.y + 5, c.w * 0.35, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.3, c.y + 3, c.w * 0.3, c.h * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSea(theme) {
  const seaY = H * 0.42;
  const grad = ctx.createLinearGradient(0, seaY, 0, H * 0.6);
  grad.addColorStop(0, theme.sea1);
  grad.addColorStop(1, theme.sea2);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, seaY);
  for (let x = 0; x <= W; x += 5) {
    const wave1 = Math.sin((x + state.scrollX * 0.5) * 0.015 + state.time * 0.03) * 8;
    const wave2 = Math.sin((x + state.scrollX * 0.3) * 0.025 + state.time * 0.02) * 5;
    ctx.lineTo(x, seaY + wave1 + wave2);
  }
  ctx.lineTo(W, H * 0.62); ctx.lineTo(0, H * 0.62);
  ctx.closePath(); ctx.fill();
  // Wave highlights
  ctx.strokeStyle = `rgba(255,255,255,${0.1 + state.theme * 0.05})`;
  ctx.lineWidth = 1.5;
  for (let row = 0; row < 3; row++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 3) {
      const y = seaY + 10 + row * 12 + Math.sin((x + state.scrollX * 0.4) * 0.02 + state.time * 0.025 + row) * 4;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawBeach(theme) {
  const beachY = H * 0.58;
  const grad = ctx.createLinearGradient(0, beachY, 0, H);
  grad.addColorStop(0, theme.sand);
  grad.addColorStop(1, lerpColor(theme.sand, '#8B7355', 0.5));
  ctx.fillStyle = grad;
  ctx.fillRect(0, beachY, W, H - beachY);
}

function drawBoardwalk(theme) {
  const bY = H * 0.68;
  const bH = 20;
  // Rails
  ctx.fillStyle = lerpColor(theme.boardwalk, '#5C3A1E', 0.3);
  ctx.fillRect(0, bY - 3, W, 6);
  ctx.fillRect(0, bY + bH - 3, W, 6);
  // Planks
  const plankW = 50;
  const offset = (-state.scrollX * 1.0) % plankW;
  ctx.fillStyle = theme.boardwalk;
  for (let x = offset - plankW; x < W + plankW; x += plankW) {
    ctx.fillStyle = lerpColor(theme.boardwalk, '#A0782C', (Math.sin(x * 0.1) + 1) * 0.2);
    ctx.fillRect(x, bY, plankW - 3, bH);
    // Wood grain
    ctx.strokeStyle = `rgba(0,0,0,0.1)`;
    ctx.lineWidth = 0.5;
    for (let g = 0; g < 3; g++) {
      ctx.beginPath();
      ctx.moveTo(x + 2, bY + 4 + g * 5);
      ctx.lineTo(x + plankW - 5, bY + 4 + g * 5);
      ctx.stroke();
    }
  }
  // Posts
  const postSpacing = 150;
  const postOffset = (-state.scrollX * 1.0) % postSpacing;
  for (let x = postOffset - postSpacing; x < W + postSpacing; x += postSpacing) {
    ctx.fillStyle = lerpColor(theme.boardwalk, '#3E2510', 0.3);
    ctx.fillRect(x - 4, bY + bH, 8, 25);
  }
  return bY;
}

function drawPelican(cx, cy) {
  const s = state;
  const spd = s.speed;
  const bobY = Math.sin(s.pelicanBob) * 6 * spd;
  const bobX = Math.cos(s.pelicanBob * 0.7) * 2 * spd;
  const breathScale = 1 + Math.sin(s.pelicanBreath) * 0.015;
  const tiltAngle = Math.sin(s.pelicanBob * 0.5) * 0.04 * spd;
  const scaredShake = s.scared ? Math.sin(s.time * 0.8) * 3 : 0;

  const px = cx + bobX + scaredShake;
  const py = cy + bobY;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(tiltAngle);
  ctx.scale(breathScale, breathScale);

  // === BODY ===
  // Main body
  const bodyGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 65);
  bodyGrad.addColorStop(0, '#FAFAFA');
  bodyGrad.addColorStop(0.7, '#E8E0D8');
  bodyGrad.addColorStop(1, '#C8BEB4');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(0, 0, 60, 35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#A09080';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Belly highlight
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(-5, 8, 35, 18, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // === TAIL ===
  ctx.save();
  ctx.translate(-55, -10);
  ctx.rotate(-0.2 + Math.sin(s.time * 0.05) * 0.1);
  ctx.fillStyle = '#D0C8BE';
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-20, i * 4 - 5, -35, i * 7);
    ctx.quadraticCurveTo(-20, i * 4 + 2, 0, 3);
    ctx.fill();
  }
  ctx.restore();

  // === WINGS ===
  const wingFlap = Math.sin(s.wingPhase) * (0.3 + spd * 0.5);
  // Left wing (far side)
  ctx.save();
  ctx.translate(-10, -20);
  ctx.rotate(-0.5 + wingFlap * 0.7);
  ctx.fillStyle = '#D8D0C4';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-30, -30, -15, -55);
  ctx.quadraticCurveTo(0, -40, 15, -10);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#B0A898';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  // Feather details
  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  for (let f = 0; f < 4; f++) {
    ctx.beginPath();
    ctx.moveTo(-5 + f * 4, -5 - f * 8);
    ctx.lineTo(-10 + f * 3, -20 - f * 8);
    ctx.stroke();
  }
  ctx.restore();

  // Right wing (near side, partially behind body)
  ctx.save();
  ctx.translate(-10, -15);
  ctx.rotate(0.3 - wingFlap * 0.5);
  ctx.fillStyle = '#E8E0D4';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(25, 20, 10, 40);
  ctx.quadraticCurveTo(-5, 30, -10, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // === LEGS ===
  const legPhase = s.pelicanLegPhase;
  for (let leg = 0; leg < 2; leg++) {
    const lp = legPhase + leg * Math.PI;
    const legX = -15 + leg * 30;
    const legSwing = Math.sin(lp) * 20 * spd;
    const kneeBend = Math.abs(Math.cos(lp)) * 10 * spd;

    ctx.save();
    ctx.translate(legX, 25);
    // Upper leg
    ctx.strokeStyle = '#E8C870';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(legSwing * 0.5, 15 + kneeBend);
    ctx.stroke();
    // Lower leg
    ctx.beginPath();
    ctx.moveTo(legSwing * 0.5, 15 + kneeBend);
    ctx.lineTo(legSwing, 30);
    ctx.stroke();
    // Webbed foot
    ctx.fillStyle = '#E8A830';
    ctx.beginPath();
    const footX = legSwing;
    const footY = 30;
    ctx.moveTo(footX - 8, footY);
    ctx.lineTo(footX, footY + 8);
    ctx.lineTo(footX + 8, footY);
    ctx.closePath();
    ctx.fill();
    // Webbing lines
    ctx.strokeStyle = '#D09020';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(footX - 4, footY);
    ctx.lineTo(footX - 2, footY + 6);
    ctx.moveTo(footX + 4, footY);
    ctx.lineTo(footX + 2, footY + 6);
    ctx.stroke();
    ctx.restore();
  }

  // === NECK ===
  const neckCurve = Math.sin(s.time * 0.04) * 3;
  ctx.strokeStyle = '#F0E8DC';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(45, -10);
  ctx.quadraticCurveTo(60 + neckCurve, -30, 55, -55);
  ctx.stroke();
  // Neck outline
  ctx.strokeStyle = '#C8BEB0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(45, -3);
  ctx.quadraticCurveTo(67 + neckCurve, -28, 62, -53);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(45, -17);
  ctx.quadraticCurveTo(53 + neckCurve, -32, 48, -57);
  ctx.stroke();

  // === HEAD ===
  const headX = 55;
  const headY = -60;
  ctx.fillStyle = '#F5EDE5';
  ctx.beginPath();
  ctx.ellipse(headX, headY, 16, 13, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#B8A898';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Crown feathers
  ctx.fillStyle = '#D8D0C0';
  for (let f = 0; f < 3; f++) {
    ctx.save();
    ctx.translate(headX - 5 + f * 4, headY - 12);
    ctx.rotate(-0.2 + f * 0.15 + Math.sin(s.time * 0.06 + f) * 0.1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(1, -8, -1, -14);
    ctx.quadraticCurveTo(-2, -8, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // Eye
  const eyeX = headX + 7;
  const eyeY = headY - 3;
  // Eye white
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.ellipse(eyeX, eyeY, 5, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Iris
  ctx.fillStyle = '#2C1810';
  const eyeLook = s.scared ? 1.5 : 0;
  ctx.beginPath();
  ctx.ellipse(eyeX + eyeLook, eyeY, 2.5, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(eyeX + eyeLook, eyeY, 1.2, 0, Math.PI * 2);
  ctx.fill();
  // Eye highlight
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(eyeX + eyeLook + 1, eyeY - 1, 0.7, 0, Math.PI * 2);
  ctx.fill();
  // Eyebrow / expression
  ctx.strokeStyle = '#5C4030';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (s.pelicanExpression === 'surprised' || s.scared) {
    ctx.arc(eyeX, eyeY - 7, 5, Math.PI * 0.9, Math.PI * 0.1, true);
  } else if (s.pelicanExpression === 'tired') {
    ctx.moveTo(eyeX - 5, eyeY - 6);
    ctx.lineTo(eyeX + 5, eyeY - 4);
  } else if (s.pelicanExpression === 'happy') {
    ctx.arc(eyeX, eyeY - 3, 4, Math.PI * 0.8, Math.PI * 0.2, true);
  } else {
    ctx.moveTo(eyeX - 4, eyeY - 6);
    ctx.lineTo(eyeX + 4, eyeY - 6);
  }
  ctx.stroke();

  // === BEAK ===
  const beakBase = headX + 14;
  const beakY = headY + 2;
  // Upper beak
  ctx.fillStyle = '#E8A830';
  ctx.beginPath();
  ctx.moveTo(beakBase, beakY - 4);
  ctx.quadraticCurveTo(beakBase + 25, beakY - 6, beakBase + 40, beakY - 2);
  ctx.quadraticCurveTo(beakBase + 42, beakY, beakBase + 40, beakY + 2);
  ctx.lineTo(beakBase, beakY + 2);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#C88820';
  ctx.lineWidth = 0.7;
  ctx.stroke();
  // Hook at tip
  ctx.fillStyle = '#D09020';
  ctx.beginPath();
  ctx.moveTo(beakBase + 38, beakY - 2);
  ctx.quadraticCurveTo(beakBase + 44, beakY, beakBase + 42, beakY + 4);
  ctx.lineTo(beakBase + 38, beakY + 2);
  ctx.closePath();
  ctx.fill();
  // Beak line
  ctx.strokeStyle = '#B07818';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(beakBase, beakY);
  ctx.lineTo(beakBase + 38, beakY);
  ctx.stroke();

  // === THROAT POUCH ===
  const throatBulge = 1 + Math.sin(s.throatPhase) * 0.15 + (s.pelicanExpression === 'happy' ? 0.2 : 0);
  const pouchDroop = s.stamina < 30 ? 8 : 3;
  ctx.fillStyle = 'rgba(255, 200, 140, 0.6)';
  ctx.beginPath();
  ctx.moveTo(beakBase, beakY + 2);
  ctx.quadraticCurveTo(beakBase + 15, beakY + 15 * throatBulge + pouchDroop,
                        beakBase + 30, beakY + 4);
  ctx.quadraticCurveTo(beakBase + 20, beakY + 20 * throatBulge + pouchDroop,
                        beakBase, beakY + 2);
  ctx.fill();
  // Pouch skin texture
  ctx.strokeStyle = 'rgba(200, 150, 80, 0.3)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    const t = 0.3 + i * 0.2;
    const mx = beakBase + 15 * t;
    const my = beakY + 2 + (10 + pouchDroop) * throatBulge * t;
    ctx.moveTo(beakBase + 3 + i * 5, beakY + 4);
    ctx.quadraticCurveTo(mx, my, beakBase + 25 - i * 3, beakY + 5);
    ctx.stroke();
  }

  // === Sweat drops if tired ===
  if (s.stamina < 50) {
    const sweatAlpha = (50 - s.stamina) / 50;
    ctx.fillStyle = `rgba(100,180,255,${sweatAlpha * 0.6})`;
    for (let i = 0; i < 3; i++) {
      const sx = headX - 10 + i * 12;
      const sy = headY - 8 + Math.sin(s.time * 0.1 + i * 2) * 3;
      ctx.beginPath();
      ctx.moveTo(sx, sy - 3);
      ctx.quadraticCurveTo(sx + 2, sy, sx, sy + 3);
      ctx.quadraticCurveTo(sx - 2, sy, sx, sy - 3);
      ctx.fill();
    }
  }

  // Open mouth if scared
  if (s.scared) {
    ctx.fillStyle = '#FF8888';
    ctx.beginPath();
    ctx.ellipse(beakBase + 20, beakY + 6, 4, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // "SQUAWK" effect
    ctx.fillStyle = `rgba(255,255,255,${Math.abs(Math.sin(s.time * 0.2)) * 0.6})`;
    ctx.font = 'bold 10px sans-serif';
    ctx.fillText('!!', beakBase + 42, beakY - 5);
  }

  ctx.restore();

  return { x: px, y: py, bobY, tiltAngle };
}

function drawBicycle(cx, cy, pelData) {
  const s = state;
  const spd = s.speed;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(pelData.tiltAngle * 0.5);

  // Bike dimensions
  const wheelR = 22;
  const frameScale = 1.0;

  // Bike bounce
  const bounceY = Math.sin(s.pelicanBob * 2) * 3 * spd;
  const bikeTilt = Math.sin(s.time * 0.03) * 0.03;
  const bellShakeX = s.bellRinging ? Math.sin(s.time * 1.5) * 4 : 0;

  ctx.translate(bellShakeX, bounceY);
  ctx.rotate(bikeTilt);

  // Positions
  const rearWheelX = -30;
  const frontWheelX = 35;
  const wheelsY = 25;
  const seatX = -15;
  const seatY = -18;
  const handleX = 30;
  const handleY = -22;
  const bbX = 5; // bottom bracket
  const bbY = 15;

  // === CHAIN ===
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  // Chain ring to rear sprocket
  ctx.beginPath();
  ctx.moveTo(bbX + 7, bbY);
  ctx.lineTo(rearWheelX, wheelsY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bbX - 7, bbY + 3);
  ctx.lineTo(rearWheelX, wheelsY + 3);
  ctx.stroke();
  // Chain ring
  ctx.strokeStyle = '#666';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(bbX, bbY, 8, 0, Math.PI * 2);
  ctx.stroke();

  // === FRAME ===
  ctx.strokeStyle = '#E53935';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Seat tube: BB to seat
  ctx.beginPath();
  ctx.moveTo(bbX, bbY);
  ctx.lineTo(seatX, seatY);
  ctx.stroke();
  // Top tube: seat to head tube
  ctx.beginPath();
  ctx.moveTo(seatX, seatY);
  ctx.lineTo(handleX - 5, handleY + 2);
  ctx.stroke();
  // Down tube: head to BB
  ctx.beginPath();
  ctx.moveTo(handleX - 5, handleY + 2);
  ctx.lineTo(bbX, bbY);
  ctx.stroke();
  // Chain stay: BB to rear axle
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(bbX, bbY);
  ctx.lineTo(rearWheelX, wheelsY);
  ctx.stroke();
  // Seat stay: seat to rear axle
  ctx.beginPath();
  ctx.moveTo(seatX, seatY);
  ctx.lineTo(rearWheelX, wheelsY);
  ctx.stroke();
  // Fork: head tube to front axle
  ctx.strokeStyle = '#C62828';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(handleX - 5, handleY + 2);
  ctx.lineTo(frontWheelX, wheelsY);
  ctx.stroke();

  // === WHEELS ===
  for (let w = 0; w < 2; w++) {
    const wx = w === 0 ? rearWheelX : frontWheelX;
    // Tire
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(wx, wheelsY, wheelR, 0, Math.PI * 2);
    ctx.stroke();
    // Rim
    ctx.strokeStyle = '#AAA';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(wx, wheelsY, wheelR - 2, 0, Math.PI * 2);
    ctx.stroke();
    // Spokes
    ctx.strokeStyle = '#CCC';
    ctx.lineWidth = 0.6;
    for (let sp = 0; sp < 12; sp++) {
      const ang = s.wheelAngle + sp * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(wx, wheelsY);
      ctx.lineTo(wx + Math.cos(ang) * (wheelR - 3), wheelsY + Math.sin(ang) * (wheelR - 3));
      ctx.stroke();
    }
    // Hub
    ctx.fillStyle = '#999';
    ctx.beginPath();
    ctx.arc(wx, wheelsY, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // === PEDALS ===
  const pedalLen = 12;
  for (let p = 0; p < 2; p++) {
    const pAng = s.pedalAngle + p * Math.PI;
    const pedX = bbX + Math.cos(pAng) * pedalLen;
    const pedY = bbY + Math.sin(pAng) * pedalLen;
    // Crank
    ctx.strokeStyle = '#777';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(bbX, bbY);
    ctx.lineTo(pedX, pedY);
    ctx.stroke();
    // Pedal
    ctx.fillStyle = '#444';
    ctx.fillRect(pedX - 5, pedY - 2, 10, 4);
  }

  // === SEAT ===
  ctx.fillStyle = '#5D4037';
  ctx.beginPath();
  ctx.ellipse(seatX, seatY - 5, 10, 4, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // Seat post nub
  ctx.fillStyle = '#777';
  ctx.beginPath();
  ctx.arc(seatX, seatY - 1, 2, 0, Math.PI * 2);
  ctx.fill();

  // === HANDLEBAR ===
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 3;
  // Stem
  ctx.beginPath();
  ctx.moveTo(handleX - 5, handleY + 2);
  ctx.lineTo(handleX, handleY);
  ctx.stroke();
  // Bar
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(handleX - 7, handleY - 5);
  ctx.quadraticCurveTo(handleX, handleY - 8, handleX + 7, handleY - 5);
  ctx.stroke();
  // Grips
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(handleX - 7, handleY - 5, 3, 2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(handleX + 7, handleY - 5, 3, 2, 0, 0, Math.PI * 2);
  ctx.fill();

  // === BELL ===
  const bellX = handleX + 3;
  const bellY = handleY - 10;
  ctx.fillStyle = s.bellRinging ? '#FFD700' : '#DAA520';
  ctx.beginPath();
  ctx.arc(bellX, bellY, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Bell ding lines
  if (s.bellRinging) {
    ctx.strokeStyle = `rgba(255,215,0,${Math.abs(Math.sin(s.time * 0.5))})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const ang = -0.5 + i * 0.5 - Math.PI / 2;
      const r1 = 7 + Math.sin(s.time * 0.3 + i) * 2;
      const r2 = r1 + 4;
      ctx.beginPath();
      ctx.arc(bellX, bellY, r2, ang - 0.2, ang + 0.2);
      ctx.stroke();
    }
  }

  // === REINS (connecting bike to pelican) ===
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 3]);
  // Left rein from left grip
  ctx.beginPath();
  ctx.moveTo(handleX - 7, handleY - 5);
  ctx.quadraticCurveTo(handleX + 10, handleY + 25, handleX - 15, handleY + 55);
  ctx.stroke();
  // Right rein from right grip
  ctx.beginPath();
  ctx.moveTo(handleX + 7, handleY - 5);
  ctx.quadraticCurveTo(handleX + 20, handleY + 20, handleX - 5, handleY + 55);
  ctx.stroke();
  ctx.setLineDash([]);

  // === HEADLIGHT ===
  ctx.fillStyle = state.theme === 2 ? '#FFEB3B' : '#FFF9C4';
  ctx.beginPath();
  ctx.arc(frontWheelX + 5, wheelsY - wheelR + 5, 3, 0, Math.PI * 2);
  ctx.fill();
  if (state.theme === 2) {
    // Light beam
    ctx.fillStyle = 'rgba(255,235,59,0.1)';
    ctx.beginPath();
    ctx.moveTo(frontWheelX + 8, wheelsY - wheelR + 5);
    ctx.lineTo(frontWheelX + 60, wheelsY - wheelR - 10);
    ctx.lineTo(frontWheelX + 60, wheelsY - wheelR + 20);
    ctx.closePath();
    ctx.fill();
  }

  // === REFLECTOR ===
  ctx.fillStyle = '#FF1744';
  ctx.beginPath();
  ctx.arc(rearWheelX - 5, wheelsY, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawFeathers() {
  state.feathers.forEach((f, i) => {
    f.x -= state.speed * 2 + 0.3;
    f.y += Math.sin(f.phase + state.time * 0.05) * 0.5 + 0.2;
    f.phase += 0.02;
    f.rot += f.rotSpd;
    f.life--;
    if (f.life <= 0 || f.x < -20) { state.feathers.splice(i, 1); return; }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = Math.min(1, f.life / 20);
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 0.3;
    ctx.beginPath();
    ctx.moveTo(-5, 0);
    ctx.lineTo(5, 0);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

function drawFishParticles() {
  state.fishParticles.forEach((f, i) => {
    f.x += f.vx;
    f.y += f.vy;
    f.vy += 0.08;
    f.rot += 0.1;
    f.life--;
    if (f.life <= 0) { state.fishParticles.splice(i, 1); return; }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = f.life / f.maxLife;
    // Simple fish shape
    ctx.fillStyle = '#4FC3F7';
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(-13, -4);
    ctx.lineTo(-13, 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(4, -1, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

function drawDustParticles() {
  if (state.speed < 0.1) return;
  // Ground dust behind pelican
  const dustY = H * 0.68 + 20;
  const dustX = W / 2 - 60;
  ctx.fillStyle = `rgba(180,160,130,${state.speed * 0.3})`;
  for (let i = 0; i < 5; i++) {
    const dx = dustX - i * 12 - Math.random() * 10;
    const dy = dustY + Math.sin(state.time * 0.2 + i) * 5;
    const r = 3 + Math.random() * 4;
    ctx.globalAlpha = (1 - i / 5) * state.speed * 0.5;
    ctx.beginPath();
    ctx.arc(dx, dy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawShadow() {
  const groundY = H * 0.68 + 22;
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.beginPath();
  ctx.ellipse(W / 2, groundY, 70, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawVignette() {
  const grad = ctx.createRadialGradient(W/2, H/2, W * 0.3, W/2, H/2, W * 0.75);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawSunOrMoon() {
  if (state.theme === 0) {
    // Sun
    const sunX = W * 0.15;
    const sunY = 80;
    const grad = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 40);
    grad.addColorStop(0, 'rgba(255,255,200,1)');
    grad.addColorStop(0.5, 'rgba(255,220,100,0.6)');
    grad.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF9C4';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 18, 0, Math.PI * 2);
    ctx.fill();
  } else if (state.theme === 1) {
    // Setting sun
    const sunX = W * 0.5;
    const sunY = H * 0.42;
    const grad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
    grad.addColorStop(0, 'rgba(255,100,0,0.8)');
    grad.addColorStop(0.5, 'rgba(255,150,50,0.3)');
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FF6D00';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 25, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawDistantPalmTrees(theme) {
  const treeOffset = (-state.scrollX * 0.3);
  ctx.fillStyle = lerpColor('#2E7D32', '#1B5E20', state.theme === 2 ? 0.8 : 0);
  const treeSpacing = 200;
  const off = treeOffset % treeSpacing;
  for (let i = -1; i < W / treeSpacing + 2; i++) {
    const tx = off + i * treeSpacing + 50;
    const ty = H * 0.52;
    // Trunk
    ctx.strokeStyle = lerpColor('#5D4037', '#3E2723', state.theme === 2 ? 0.6 : 0);
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + 5, ty - 25, tx + 3, ty - 45);
    ctx.stroke();
    // Leaves
    ctx.fillStyle = lerpColor('#2E7D32', '#0D3310', state.theme === 2 ? 0.6 : 0);
    for (let l = 0; l < 5; l++) {
      ctx.save();
      ctx.translate(tx + 3, ty - 45);
      ctx.rotate(-0.8 + l * 0.4 + Math.sin(state.time * 0.02 + l + i) * 0.05);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(15, -8, 30, 5);
      ctx.quadraticCurveTo(15, -2, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawSeabirds() {
  ctx.strokeStyle = state.theme === 2 ? 'rgba(200,200,255,0.3)' : 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) {
    const bx = ((i * 173 + state.time * 0.3 + state.scrollX * 0.1) % (W + 100)) - 50;
    const by = 50 + i * 30 + Math.sin(state.time * 0.03 + i * 2) * 10;
    const wingSpan = 10 + i * 2;
    const wingUp = Math.sin(state.time * 0.08 + i * 1.5) * 4;
    ctx.beginPath();
    ctx.moveTo(bx - wingSpan, by + wingUp);
    ctx.quadraticCurveTo(bx, by - 3, bx + wingSpan, by + wingUp);
    ctx.stroke();
  }
}

function update() {
  const s = state;
  s.time++;

  // Speed smoothing
  s.speed = lerp(s.speed, s.targetSpeed, 0.05);
  s.scrollX += s.speed * 5;

  // Stamina
  if (s.sprinting) {
    s.stamina = Math.max(0, s.stamina - 0.5);
    s.sprintTimer--;
    if (s.sprintTimer <= 0 || s.stamina <= 0) {
      s.sprinting = false;
      s.targetSpeed = document.getElementById('speedSlider').value / 100;
      document.getElementById('sprintBtn').classList.remove('active');
    }
  } else {
    s.stamina = Math.max(0, s.stamina - s.speed * 0.05);
    if (s.stamina < 10) {
      s.targetSpeed = Math.min(s.targetSpeed, 0.15);
      s.pelicanExpression = 'tired';
    }
  }

  // Stamina recovery when slow
  if (s.speed < 0.15) {
    s.stamina = Math.min(100, s.stamina + 0.1);
  }

  document.getElementById('staminaFill').style.width = s.stamina + '%';
  const stColor = s.stamina > 60 ? '#51cf66' : s.stamina > 30 ? '#fcc419' : '#ff6b6b';
  document.getElementById('staminaFill').style.background = `linear-gradient(90deg, ${stColor}, ${stColor}88)`;

  // Bell
  if (s.bellRinging) {
    s.bellTimer--;
    if (s.bellTimer <= 0) s.bellRinging = false;
  }

  // Scared
  if (s.scared) {
    s.scaredTimer--;
    s.pelicanExpression = 'surprised';
    if (s.scaredTimer <= 0) {
      s.scared = false;
      if (s.stamina > 30) s.pelicanExpression = 'normal';
    }
  }

  // Animation phases
  s.pelicanBob += s.speed * 0.15;
  s.pelicanBreath += 0.03 + s.speed * 0.02;
  s.pelicanLegPhase += s.speed * 0.2;
  s.wingPhase += 0.04 + s.speed * 0.08;
  s.throatPhase += 0.03 + s.speed * 0.04;
  s.wheelAngle += s.speed * 0.15;
  s.pedalAngle += s.speed * 0.12;

  // Spawn feathers
  if (Math.random() < s.speed * 0.08) {
    s.feathers.push({
      x: W / 2 - 40 + Math.random() * 20,
      y: H * 0.5 + Math.random() * 30,
      rot: Math.random() * Math.PI * 2,
      rotSpd: (Math.random() - 0.5) * 0.05,
      phase: Math.random() * Math.PI * 2,
      life: 80 + Math.random() * 40,
      color: ['#F5F0E8', '#E8E0D0', '#D8D0C0'][Math.floor(Math.random() * 3)]
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const theme = themes[state.theme];

  // Sky
  drawSky(theme);
  drawStars(theme);
  drawSunOrMoon();
  drawSeabirds();
  drawClouds(theme);

  // Distant background
  drawSea(theme);
  drawDistantPalmTrees(theme);
  drawBeach(theme);

  // Boardwalk
  const boardY = drawBoardwalk(theme);

  // Shadow
  drawShadow();

  // Dust
  drawDustParticles();

  // Pelican at center of boardwalk
  const pelicanCX = W / 2 + 10;
  const pelicanCY = boardY - 15;
  const pelData = drawPelican(pelicanCX, pelicanCY);

  // Bicycle on top of pelican
  const bikeCX = pelicanCX - 5;
  const bikeCY = pelicanCY - 55 + Math.sin(state.pelicanBob) * 6 * state.speed;
  drawBicycle(bikeCX, bikeCY, pelData);

  // Particles
  drawFeathers();
  drawFishParticles();

  // Vignette
  drawVignette();

  // Speed indicator
  if (state.speed > 0.7) {
    // Speed lines
    ctx.strokeStyle = `rgba(255,255,255,${(state.speed - 0.7) * 0.5})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const ly = H * 0.3 + Math.random() * H * 0.4;
      const lx = Math.random() * W;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - 30 - Math.random() * 40, ly);
      ctx.stroke();
    }
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
