<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }
        
        #canvas {
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            background-color: #E0F7FA;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        .title {
            margin: 10px 0;
            color: #333;
            text-align: center;
        }
        
        .status {
            margin-top: 5px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="title">自行车骑鹈鹕</h1>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div class="controls">
        <button id="bell">按车铃 🔔</button>
        <div class="speed-control">
            <span>速度:</span>
            <input type="range" id="speed" min="1" max="10" value="3">
        </div>
        <button id="boost">冲刺加速! 💨</button>
        <button id="feed">喂小鱼 🐟</button>
        <button id="time">切换时间 ⏰</button>
    </div>
    <div class="status" id="status">鹈鹕正在愉快地奔跑中...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        
        // 游戏状态
        const state = {
            speed: 3,
            maxSpeed: 10,
            isBoosting: false,
            boostTime: 0,
            timeOfDay: 0, // 0: 白天, 1: 黄昏, 2: 夜晚
            pelican: {
                x: 200,
                y: 300,
                neckAngle: 0,
                wingAngle: 0,
                pouchWobble: 0,
                legPhase: 0,
                energy: 100,
                expression: 'normal' // normal, surprised, tired, happy
            },
            bike: {
                x: 200,
                y: 200,
                wheelRotation: 0,
                pedalRotation: 0,
                lean: 0,
                bellRing: 0
            },
            backgroundOffset: 0,
            clouds: [],
            fish: null,
            lastTime: 0
        };
        
        // 初始化云朵
        for (let i = 0; i < 5; i++) {
            state.clouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 150,
                speed: 0.5 + Math.random() * 1.5,
                size: 30 + Math.random() * 50
            });
        }
        
        // 音频上下文
        let audioContext;
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            console.log('Web Audio API not supported');
        }
        
        // 绘制鹈鹕
        function drawPelican() {
            const p = state.pelican;
            ctx.save();
            ctx.translate(p.x, p.y);
            
            // 身体
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.ellipse(0, 0, 80, 50, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 脖子和头
            ctx.save();
            ctx.rotate(p.neckAngle * 0.1);
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.ellipse(60, -30, 20, 15, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 喉囊
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.ellipse(75, -25, 15, 10 + Math.sin(p.pouchWobble) * 3, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            
            // 喙
            ctx.fillStyle = '#ff9966';
            ctx.beginPath();
            ctx.moveTo(85, -30);
            ctx.lineTo(110, -35);
            ctx.lineTo(105, -25);
            ctx.closePath();
            ctx.fill();
            
            // 眼睛
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(65, -35, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 表情
            if (p.expression === 'surprised') {
                ctx.beginPath();
                ctx.arc(65, -30, 5, 0, Math.PI);
                ctx.stroke();
            } else if (p.expression === 'tired') {
                ctx.beginPath();
                ctx.moveTo(60, -30);
                ctx.lineTo(70, -30);
                ctx.stroke();
            } else if (p.expression === 'happy') {
                ctx.beginPath();
                ctx.arc(65, -25, 5, 0, Math.PI, true);
                ctx.stroke();
            }
            
            ctx.restore();
            
            // 翅膀
            ctx.save();
            ctx.rotate(Math.sin(p.wingAngle) * 0.2);
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.ellipse(-40, -10, 50, 30, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 翅膀羽毛
            ctx.strokeStyle = '#999';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(-40 + i * 5, -10);
                ctx.lineTo(-60 + i * 5, -30 - i * 2);
                ctx.stroke();
            }
            ctx.restore();
            
            // 腿和脚
            ctx.save();
            ctx.translate(-20, 40);
            for (let i = 0; i < 2; i++) {
                ctx.save();
                ctx.translate(i * 30, 0);
                ctx.rotate(Math.sin(p.legPhase + i * Math.PI) * 0.3);
                
                // 腿
                ctx.strokeStyle = '#ff9966';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, 30);
                ctx.stroke();
                
                // 蹼足
                ctx.fillStyle = '#ff9966';
                ctx.beginPath();
                ctx.ellipse(0, 40, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            ctx.restore();
            
            ctx.restore();
        }
        
        // 绘制自行车
        function drawBike() {
            const b = state.bike;
            const p = state.pelican;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.lean * 0.05);
            
            // 车架
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.beginPath();
            
            // 主车架
            ctx.moveTo(0, 0);
            ctx.lineTo(40, 40);
            ctx.lineTo(80, 20);
            
            // 前叉
            ctx.moveTo(0, 0);
            ctx.lineTo(-20, 20);
            
            // 座管
            ctx.moveTo(40, 40);
            ctx.lineTo(40, 0);
            
            // 后三角
            ctx.moveTo(80, 20);
            ctx.lineTo(60, 40);
            ctx.lineTo(40, 40);
            
            ctx.stroke();
            
            // 车把
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-20, -10);
            ctx.lineTo(-40, -10);
            ctx.stroke();
            
            // 缰绳 (连接到鹈鹕的脖子)
            ctx.strokeStyle = '#996633';
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(-40, -10);
            ctx.lineTo(p.x - b.x + 60, p.y - b.y - 30);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 车座
            ctx.fillStyle = '#663300';
            ctx.beginPath();
            ctx.ellipse(40, 0, 15, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 车轮
            function drawWheel(x, y, rotation) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                
                // 轮圈
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 25, 0, Math.PI * 2);
                ctx.stroke();
                
                // 辐条
                for (let i = 0; i < 12; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(i * Math.PI/6) * 25, Math.sin(i * Math.PI/6) * 25);
                    ctx.stroke();
                }
                
                // 轴心
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            // 前轮
            drawWheel(-20, 20, b.wheelRotation);
            
            // 后轮
            drawWheel(80, 20, b.wheelRotation);
            
            // 脚踏和链条
            ctx.save();
            ctx.translate(40, 40);
            
            // 曲柄
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.stroke();
            
            // 脚踏
            for (let i = 0; i < 2; i++) {
                const angle = b.pedalRotation + i * Math.PI;
                ctx.beginPath();
                ctx.moveTo(
                    Math.cos(angle) * 10,
                    Math.sin(angle) * 10
                );
                ctx.lineTo(
                    Math.cos(angle) * 25,
                    Math.sin(angle) * 25
                );
                ctx.stroke();
                
                ctx.fillStyle = '#666';
                ctx.beginPath();
                ctx.arc(
                    Math.cos(angle) * 25,
                    Math.sin(angle) * 25,
                    5, 0, Math.PI * 2
                );
                ctx.fill();
            }
            
            // 链条 (简化表示)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 8, Math.PI/2, Math.PI*1.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(80 - 40, 20 - 40);
            ctx.stroke();
            
            ctx.restore();
            
            // 车铃 (如果有铃声效果)
            if (b.bellRing > 0) {
                ctx.save();
                ctx.translate(-30, -5);
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#cc9900';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 铃铛震动效果
                ctx.translate(Math.sin(b.bellRing * 20) * 3, 0);
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            ctx.restore();
        }
        
        // 绘制背景
        function drawBackground() {
            // 天空
            let skyGradient;
            if (state.timeOfDay === 0) {
                // 白天
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#87CEEB');
                skyGradient.addColorStop(1, '#E0F7FA');
            } else if (state.timeOfDay === 1) {
                // 黄昏
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#FF7F50');
                skyGradient.addColorStop(0.5, '#FFA07A');
                skyGradient.addColorStop(1, '#E0F7FA');
            } else {
                // 夜晚
                skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#191970');
                skyGradient.addColorStop(1, '#000033');
            }
            
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 太阳/月亮
            ctx.save();
            if (state.timeOfDay === 0) {
                // 太阳
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(canvas.width - 100, 100, 30, 0, Math.PI * 2);
                ctx.fill();
            } else if (state.timeOfDay === 1) {
                // 夕阳
                ctx.fillStyle = '#FF4500';
                ctx.beginPath();
                ctx.arc(canvas.width - 50, 150, 40, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 月亮
                ctx.fillStyle = '#F5F5DC';
                ctx.beginPath();
                ctx.arc(canvas.width - 100, 100, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = skyGradient;
                ctx.beginPath();
                ctx.arc(canvas.width - 110, 90, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            
            // 云朵
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for (const cloud of state.clouds) {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.3, cloud.y - cloud.size * 0.1, cloud.size * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.6, cloud.y, cloud.size * 0.3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.4, cloud.y + cloud.size * 0.1, cloud.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 地面
            if (state.timeOfDay === 2) {
                // 夜晚地面较暗
                ctx.fillStyle = '#2E8B57';
            } else {
                ctx.fillStyle = '#3CB371';
            }
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // 木栈道
            ctx.fillStyle = '#8B4513';
            for (let i = 0; i < 20; i++) {
                const x = (i * 60 - state.backgroundOffset * 0.5) % (canvas.width + 60) - 30;
                ctx.fillRect(x, canvas.height - 50, 50, 10);
            }
            
            // 远处海面
            if (state.timeOfDay === 2) {
                ctx.fillStyle = '#1E90FF';
            } else {
                ctx.fillStyle = '#00BFFF';
            }
            ctx.fillRect(0, canvas.height - 40, canvas.width, 5);
            
            // 汗珠粒子 (当冲刺时)
            if (state.isBoosting && Math.random() < 0.3) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                const x = state.pelican.x + Math.random() * 60 - 30;
                const y = state.pelican.y + Math.random() * 30;
                ctx.beginPath();
                ctx.arc(x, y, 2 + Math.random() * 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 鱼 (如果正在投喂)
            if (state.fish) {
                ctx.save();
                ctx.translate(state.fish.x, state.fish.y);
                
                // 鱼身
                ctx.fillStyle = '#FF6347';
                ctx.beginPath();
                ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 鱼尾
                ctx.beginPath();
                ctx.moveTo(-10, 0);
                ctx.lineTo(-20, -5);
                ctx.lineTo(-20, 5);
                ctx.closePath();
                ctx.fill();
                
                // 鱼眼
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(5, -2, 1, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 更新游戏状态
        function update(deltaTime) {
            // 更新速度
            if (state.isBoosting) {
                state.boostTime += deltaTime;
                if (state.boostTime > 3) {
                    state.isBoosting = false;
                    state.pelican.expression = 'tired';
                    state.pelican.energy = Math.max(0, state.pelican.energy - 30);
                    statusEl.textContent = "鹈鹕累坏了...需要休息";
                } else {
                    state.speed = Math.min(state.maxSpeed, state.speed + deltaTime * 2);
                }
            } else {
                const targetSpeed = parseInt(document.getElementById('speed').value);
                state.speed += (targetSpeed - state.speed) * deltaTime;
            }
            
            // 更新鹈鹕状态
            state.pelican.legPhase += deltaTime * state.speed;
            state.pelican.wingAngle += deltaTime * state.speed;
            state.pelican.neckAngle = Math.sin(state.pelican.legPhase * 2) * 0.5;
            state.pelican.pouchWobble += deltaTime * state.speed;
            
            // 恢复能量
            if (!state.isBoosting && state.pelican.energy < 100) {
                state.pelican.energy += deltaTime * 5;
                if (state.pelican.energy > 70 && state.pelican.expression === 'tired') {
                    state.pelican.expression = 'normal';
                    statusEl.textContent = "鹈鹕恢复了体力，继续前进!";
                }
            }
            
            // 更新自行车位置和状态
            state.bike.x = state.pelican.x;
            state.bike.y = state.pelican.y - 100;
            state.bike.wheelRotation += deltaTime * state.speed;
            state.bike.pedalRotation += deltaTime * state.speed * 2;
            state.bike.lean = Math.sin(state.pelican.legPhase) * 0.5;
            
            // 更新背景和云朵
            state.backgroundOffset += deltaTime * state.speed * 10;
            for (const cloud of state.clouds) {
                cloud.x -= deltaTime * cloud.speed;
                if (cloud.x < -cloud.size) {
                    cloud.x = canvas.width + cloud.size;
                    cloud.y = Math.random() * 150;
                }
            }
            
            // 更新车铃效果
            if (state.bike.bellRing > 0) {
                state.bike.bellRing -= deltaTime;
            }
            
            // 更新鱼的位置 (如果正在投喂)
            if (state.fish) {
                state.fish.y += deltaTime * 100;
                if (state.fish.y > canvas.height) {
                    state.fish = null;
                    state.pelican.expression = 'happy';
                    state.pelican.energy = Math.min(100, state.pelican.energy + 20);
                    statusEl.textContent = "鹈鹕吃到了小鱼，很开心!";
                    setTimeout(() => {
                        if (state.pelican.expression === 'happy') {
                            state.pelican.expression = 'normal';
                            statusEl.textContent = "鹈鹕继续前进!";
                        }
                    }, 2000);
                }
            }
        }
        
        // 主渲染循环
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            drawPelican();
            drawBike();
        }
        
        // 游戏循环
        function gameLoop(timestamp) {
            if (!state.lastTime) state.lastTime = timestamp;
            const deltaTime = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;
            
            update(deltaTime);
            render();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 初始化
        function init() {
            // 事件监听
            document.getElementById('bell').addEventListener('click', ringBell);
            document.getElementById('boost').addEventListener('click', boost);
            document.getElementById('feed').addEventListener('click', feedFish);
            document.getElementById('time').addEventListener('click', changeTime);
            document.getElementById('speed').addEventListener('input', updateSpeed);
            
            // 开始游戏循环
            requestAnimationFrame(gameLoop);
        }
        
        // 按车铃
        function ringBell() {
            state.bike.bellRing = 1;
            state.pelican.expression = 'surprised';
            statusEl.textContent = "叮铃铃! 鹈鹕被铃声吓了一跳!";
            
            // 播放铃声
            if (audioContext) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(440, audioContext.currentTime + 0.3);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.5);
            }
            
            setTimeout(() => {
                if (state.pelican.expression === 'surprised') {
                    state.pelican.expression = 'normal';
                    statusEl.textContent = "鹈鹕恢复了平静";
                }
            }, 1000);
        }
        
        // 冲刺加速
        function boost() {
            if (state.pelican.energy > 30 && !state.isBoosting) {
                state.isBoosting = true;
                state.boostTime = 0;
                statusEl.textContent = "鹈鹕全力冲刺!!!";
            } else if (state.pelican.energy <= 30) {
                statusEl.textContent = "鹈鹕太累了，无法冲刺...";
            }
        }
        
        // 喂鱼
        function feedFish() {
            if (!state.fish) {
                state.fish = {
                    x: state.pelican.x + Math.random() * 100 - 50,
                    y: 0
                };
                statusEl.textContent = "投喂了一条小鱼...";
            }
        }
        
        // 切换时间
        function changeTime() {
            state.timeOfDay = (state.timeOfDay + 1) % 3;
            const times = ["现在是白天", "现在是黄昏", "现在是夜晚"];
            statusEl.textContent = times[state.timeOfDay];
        }
        
        // 更新速度显示
        function updateSpeed() {
            const speed = parseInt(document.getElementById('speed').value);
            statusEl.textContent = `速度设置为 ${speed}/10`;
        }
        
        // 启动游戏
        window.onload = init;
    </script>
</body>
</html>
