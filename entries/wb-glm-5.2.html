<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bicycle Riding a Pelican · 自行车骑鹈鹕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1230;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  #title {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.92);
    font-size: 13px; letter-spacing: 2px; font-weight: 300;
    z-index: 10; pointer-events: none;
    text-shadow: 0 1px 10px rgba(0,0,0,0.55);
  }
  #title b { font-weight: 600; letter-spacing: 0; }
  #title .sep { opacity: 0.45; margin: 0 8px; }

  #ui {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: flex; gap: 0; align-items: stretch;
    padding: 10px 14px;
    background: rgba(18, 22, 32, 0.55);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    color: #eef2f7; font-size: 12px;
    z-index: 10;
    box-shadow: 0 12px 44px rgba(0,0,0,0.4);
    user-select: none;
    max-width: calc(100vw - 24px);
    flex-wrap: wrap; justify-content: center;
  }
  .group {
    display: flex; align-items: center; gap: 9px;
    padding: 0 12px;
    border-right: 1px solid rgba(255,255,255,0.1);
    height: 34px;
  }
  .group:last-child { border-right: none; }
  .lbl { font-size: 10px; opacity: 0.62; letter-spacing: 1px; text-transform: uppercase; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: #eef2f7; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: linear-gradient(135deg, #ff8a3d, #ff5e62);
    border-color: rgba(255,160,80,0.5); color: #fff;
    box-shadow: 0 4px 14px rgba(255,94,98,0.35);
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn .ic { font-size: 14px; line-height: 1; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 96px; height: 4px;
    background: rgba(255,255,255,0.18); border-radius: 4px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px; border-radius: 50%;
    background: #ffd23f; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(255,210,63,0.25);
  }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%;
    background: #ffd23f; border: none; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(255,210,63,0.25);
  }

  .seg {
    display: flex; gap: 2px;
    background: rgba(255,255,255,0.05); border-radius: 7px; padding: 2px;
  }
  .seg button {
    border: none; background: transparent;
    color: rgba(255,255,255,0.58); font-size: 11px;
    padding: 4px 9px; border-radius: 5px; cursor: pointer;
    transition: all 0.18s ease; font-family: inherit; font-weight: 500;
  }
  .seg button.active { background: rgba(255,255,255,0.18); color: #fff; }

  .meter {
    width: 64px; height: 6px;
    background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden;
    position: relative;
  }
  .meter > div {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #36d399, #5eead4);
    transition: width 0.25s ease, background 0.3s ease;
  }
  .meter > div.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .meter > div.low { background: linear-gradient(90deg, #ff5e62, #ff3838); }

  #hint {
    position: fixed; right: 16px; bottom: 14px;
    color: rgba(255,255,255,0.45);
    font-size: 10px; z-index: 10; pointer-events: none;
    letter-spacing: 0.5px;
  }

  #odom {
    position: fixed; left: 18px; top: 18px;
    color: rgba(255,255,255,0.7);
    font-size: 11px; z-index: 10; pointer-events: none;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  #odom b { color: #ffd23f; font-weight: 600; }

  @media (max-width: 720px) {
    #ui { gap: 0; padding: 8px; }
    .group { padding: 0 8px; gap: 7px; }
    input[type=range] { width: 70px; }
    #title { font-size: 11px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="title">A <b>Bicycle</b> Riding a <b>Pelican</b><span class="sep">·</span>自行车骑鹈鹕</div>
<div id="odom">distance <b id="odomVal">0</b> m</div>

<div id="ui">
  <div class="group">
    <button class="btn primary" id="bell"><span class="ic">🔔</span>Ring Bell</button>
  </div>
  <div class="group">
    <span class="lbl">Speed</span>
    <input type="range" id="speed" min="0" max="10" step="0.1" value="3">
    <span class="lbl">Stamina</span>
    <div class="meter"><div id="stamBar"></div></div>
  </div>
  <div class="group">
    <button class="btn" id="fish"><span class="ic">🐟</span>Feed Fish</button>
    <button class="btn" id="sprint"><span class="ic">⚡</span>Sprint</button>
  </div>
  <div class="group">
    <span class="lbl">Time</span>
    <div class="seg" id="timeSeg">
      <button data-v="day" class="active">Day</button>
      <button data-v="dusk">Dusk</button>
      <button data-v="night">Night</button>
    </div>
  </div>
  <div class="group">
    <span class="lbl">Road</span>
    <div class="seg" id="roadSeg">
      <button data-v="smooth" class="active">Smooth</button>
      <button data-v="bumpy">Bumpy</button>
    </div>
  </div>
</div>
<div id="hint">space = bell · f = fish · s = sprint</div>

<script>
"use strict";
// ============ Setup ============
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ State ============
const state = {
  speed: 3,
  timeOfDay: 'day',
  terrain: 'smooth',
  stamina: 100,
  bellRing: 0,
  sprint: 0,
  startled: 0,
  distance: 0,
  t: 0,
  fishes: [],
  sweat: [],
  feathers: [],
  dust: [],
  splash: [],
  puff: [],   // breath puffs
};

// ============ Helpers ============
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ============ Web Audio (synthesized bell + gulp) ============
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playBell() {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.0001, now);
  master.gain.exponentialRampToValueAtTime(0.32, now + 0.005);
  master.gain.exponentialRampToValueAtTime(0.0008, now + 0.9);
  master.connect(audioCtx.destination);
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1100;
  hp.connect(master);
  [1760, 2637, 3300, 4400].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    o.type = i < 2 ? 'triangle' : 'sine';
    o.frequency.setValueAtTime(f, now);
    o.frequency.exponentialRampToValueAtTime(f * 0.965, now + 0.6);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.3 / (i + 1), now + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.85 - i * 0.1);
    o.connect(g); g.connect(hp);
    o.start(now); o.stop(now + 1.0);
  });
}
function playGulp() {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(220, now);
  o.frequency.exponentialRampToValueAtTime(70, now + 0.28);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.28, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(now); o.stop(now + 0.32);
}

// ============ Palettes ============
const palettes = {
  day: {
    skyTop: '#7cc7ee', skyBot: '#d9f0ff',
    seaFar: '#67a8d3', seaNear: '#2c7fb8',
    sun: '#fff6c2', sunGlow: 'rgba(255,246,180,0.55)',
    cloud: 'rgba(255,255,255,0.92)',
    plank: '#c98a4a', plankDark: '#9c6a36', rail: '#7a4a26',
    hill: '#7fb069', hillFar: '#9ec5a8',
    sand: '#ecd9a0', body: '#f7f1e0', belly: '#fffdf5',
    wing: '#cdc59a', wingDark: '#a89a6a',
    beak: '#ff9a30', pouch: '#ff7a2a',
    leg: '#d49a3a', shadow: 'rgba(40,30,20,0.18)'
  },
  dusk: {
    skyTop: '#3a2a5e', skyBot: '#ff8a5b',
    seaFar: '#5a4a7b', seaNear: '#1f3050',
    sun: '#ffd17a', sunGlow: 'rgba(255,160,80,0.55)',
    cloud: 'rgba(255,200,170,0.78)',
    plank: '#a06a3a', plankDark: '#704a26', rail: '#5a3418',
    hill: '#3a4a4a', hillFar: '#5a5a6a',
    sand: '#7a5a3a', body: '#e8d8b8', belly: '#f0e0c0',
    wing: '#a89870', wingDark: '#806a48',
    beak: '#e07a20', pouch: '#d86820',
    leg: '#a8742a', shadow: 'rgba(20,10,5,0.28)'
  },
  night: {
    skyTop: '#070d24', skyBot: '#1a2a55',
    seaFar: '#1a3050', seaNear: '#0a1830',
    sun: '#e8e8ff', sunGlow: 'rgba(200,210,255,0.4)',
    cloud: 'rgba(160,170,210,0.4)',
    plank: '#4a3826', plankDark: '#332617', rail: '#221610',
    hill: '#1a2a3a', hillFar: '#2a3a4a',
    sand: '#2a2418', body: '#c8c8d8', belly: '#d0d0e0',
    wing: '#8a8aa0', wingDark: '#606078',
    beak: '#a07020', pouch: '#80501a',
    leg: '#706040', shadow: 'rgba(0,0,0,0.45)'
  }
};
const pal = () => palettes[state.timeOfDay];

// ============ Particle spawners ============
function spawnSweat(x, y) {
  state.sweat.push({ x, y, vx: rand(-3, -1), vy: rand(-4, -2), life: 1, size: rand(3, 5) });
}
function spawnFeather(x, y) {
  state.feathers.push({ x, y, vx: rand(-1.8, -0.5), vy: rand(-2, -0.5),
    rot: rand(0, Math.PI * 2), vr: rand(-0.15, 0.15), life: 1, size: rand(7, 12) });
}
function spawnDust(x, y) {
  state.dust.push({ x, y, vx: rand(-2.5, -0.8), vy: rand(-1.2, 0.2), life: 1, size: rand(2, 5) });
}
function spawnSplash(x, y) {
  state.splash.push({ x, y, vx: rand(-2, 2), vy: rand(-3.5, -1.5), life: 1, size: rand(2, 3.5) });
}
function spawnPuff(x, y) {
  state.puff.push({ x, y, vx: rand(0.5, 2), vy: rand(-0.8, -0.2), life: 1, size: rand(4, 7) });
}

// ============ Pelican / Bicycle positions ============
function pelicanPos() {
  const cx = W * 0.42;
  const bobAmp = state.terrain === 'bumpy' ? 7 : 3.5;
  const bobFreq = 5 + state.speed * 0.35;
  const bob = Math.sin(state.t * bobFreq) * bobAmp * (state.speed > 0.1 ? 1 : 0.25);
  const baseY = H * 0.58;
  return { cx, cy: baseY + bob, bob };
}
function bicyclePos() {
  const p = pelicanPos();
  const bikeBob = Math.sin(state.t * 9) * 1.8 * (state.speed > 0.1 ? 1 : 0.3);
  const bellShake = state.bellRing > 0 ? Math.sin(state.t * 70) * state.bellRing * 3.5 : 0;
  return {
    cx: p.cx + 8,
    cy: p.cy - 52 + bikeBob + bellShake,
    wheelRot: state.distance * 0.06,
    lean: 0.04 + state.speed * 0.004 + (state.startled > 0 ? 0.06 : 0)
  };
}

// ============ Update ============
function update(dt) {
  const staminaFactor = state.stamina <= 0 ? 0.35 : 1;
  const sprintBoost = state.sprint > 0 ? 1.8 : 1;
  const startledBoost = state.startled > 0 ? 1.5 : 1;
  const v = state.speed * 32 * staminaFactor * sprintBoost * startledBoost;

  state.distance += v * dt;

  // Stamina drain
  if (state.speed > 0.1) {
    state.stamina -= dt * (0.6 + state.speed * 0.28 + (state.sprint > 0 ? 2.2 : 0));
  }
  state.stamina = clamp(state.stamina, 0, 100);

  if (state.sprint > 0) state.sprint -= dt;
  if (state.startled > 0) state.startled -= dt;
  if (state.bellRing > 0) state.bellRing = Math.max(0, state.bellRing - dt * 2.8);

  // Sweat
  const tired = state.stamina < 45;
  if ((tired || state.sprint > 0) && Math.random() < (0.18 + (tired ? 0.25 : 0))) {
    const p = pelicanPos();
    spawnSweat(p.cx + rand(110, 145), p.cy - rand(48, 62));
  }
  // Breath puffs when very tired
  if (state.stamina < 25 && Math.random() < 0.12) {
    const p = pelicanPos();
    spawnPuff(p.cx + 195, p.cy - 52);
  }
  // Feathers
  if (Math.random() < 0.04 + state.speed * 0.006) {
    const p = pelicanPos();
    spawnFeather(p.cx + rand(-70, 30), p.cy + rand(-20, 25));
  }
  // Dust at feet
  if (Math.random() < (state.terrain === 'bumpy' ? 0.35 : 0.12) * (state.speed > 0.1 ? 1 : 0.2)) {
    const p = pelicanPos();
    spawnDust(p.cx + rand(-20, 30), p.cy + 60);
  }

  // Update particles
  const lists = [state.sweat, state.feathers, state.dust, state.splash, state.puff];
  lists.forEach(list => {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      p.x += p.vx; p.y += p.vy;
      if (p === state.sweat[0] || state.sweat.includes(p)) p.vy += 0.32;
      else if (state.feathers.includes(p)) { p.vy += 0.04; p.x += Math.sin(state.t * 3 + p.size) * 0.25; p.rot += p.vr; }
      else if (state.dust.includes(p)) p.vy -= 0.04;
      else if (state.splash.includes(p)) p.vy += 0.4;
      else if (state.puff.includes(p)) { p.vx *= 0.98; p.vy -= 0.02; p.size += 0.15; }
      const decay = state.puff.includes(p) ? 0.7 : (state.feathers.includes(p) ? 0.35 : 1.4);
      p.life -= dt * decay;
      if (p.life <= 0) list.splice(i, 1);
    }
  });

  // Fish
  for (let i = state.fishes.length - 1; i >= 0; i--) {
    const f = state.fishes[i];
    f.t += dt / f.dur;
    if (f.t >= 1 && !f.eaten) {
      f.eaten = true;
      state.stamina = clamp(state.stamina + 38, 0, 100);
      playGulp();
      const p = pelicanPos();
      for (let k = 0; k < 10; k++) spawnSplash(p.cx + 180, p.cy - 50);
      state.fishes.splice(i, 1);
    }
  }

  // UI
  const bar = document.getElementById('stamBar');
  if (bar) {
    bar.style.width = state.stamina + '%';
    bar.className = state.stamina < 25 ? 'low' : (state.stamina < 55 ? 'mid' : '');
  }
  const odom = document.getElementById('odomVal');
  if (odom) odom.textContent = Math.floor(state.distance / 10);

  // Sprint button state
  const sp = document.getElementById('sprint');
  if (sp) sp.disabled = state.stamina < 8;
}

// ============ Render ============
function render() {
  const P = pal();
  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.78);
  g.addColorStop(0, P.skyTop);
  g.addColorStop(1, P.skyBot);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  drawSky(P);
  drawDistantBirds(P);
  drawHills(P);
  drawSea(P);
  drawClouds(P);
  drawLighthouse(P);
  drawBoardwalk(P);
  drawPelicanShadow(P);
  drawPelican(P);
  drawReins(P);
  drawBicycle(P);
  drawFishes();
  drawParticlesFront();
  drawVignette();
}

// ---- Sky: sun/moon + stars ----
function drawSky(P) {
  if (state.timeOfDay === 'night') {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 70; i++) {
      const sx = (i * 73 + 13) % W;
      const sy = (i * 41 + 7) % (H * 0.45);
      const tw = 0.5 + 0.5 * Math.sin(state.t * 2 + i);
      ctx.globalAlpha = 0.3 + tw * 0.55;
      const sz = 1 + (i % 3) * 0.4;
      ctx.fillRect(sx, sy, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
  const sunX = W * 0.8, sunY = H * 0.2;
  const glow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 130);
  glow.addColorStop(0, P.sunGlow);
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sunX - 140, sunY - 140, 280, 280);
  ctx.fillStyle = P.sun;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 34, 0, Math.PI * 2);
  ctx.fill();
  if (state.timeOfDay === 'night') {
    ctx.fillStyle = P.skyTop;
    ctx.beginPath();
    ctx.arc(sunX + 11, sunY - 5, 30, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- Distant birds (V silhouettes) ----
function drawDistantBirds(P) {
  ctx.strokeStyle = state.timeOfDay === 'night' ? 'rgba(160,170,200,0.5)' :
    (state.timeOfDay === 'dusk' ? 'rgba(80,60,90,0.55)' : 'rgba(60,70,90,0.45)');
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const baseX = ((i * 220 - state.distance * 0.04) % (W + 200) + W + 200) % (W + 200) - 100;
    const y = H * (0.14 + i * 0.03);
    const flap = Math.sin(state.t * 3 + i * 1.3) * 4;
    ctx.beginPath();
    ctx.moveTo(baseX - 8, y + flap);
    ctx.quadraticCurveTo(baseX - 4, y - flap, baseX, y);
    ctx.quadraticCurveTo(baseX + 4, y - flap, baseX + 8, y + flap);
    ctx.stroke();
  }
}

// ---- Hills ----
function drawHills(P) {
  const y = H * 0.52;
  // Far hills
  ctx.fillStyle = P.hillFar;
  ctx.globalAlpha = 0.7;
  const off1 = (state.distance * 0.04) % 240;
  ctx.beginPath();
  ctx.moveTo(0, y);
  for (let x = -240; x <= W + 240; x += 24) {
    const xx = x + off1;
    ctx.lineTo(x, y - 30 - Math.sin(xx * 0.008) * 18 - Math.sin(xx * 0.025) * 9);
  }
  ctx.lineTo(W, y); ctx.lineTo(0, y); ctx.fill();
  // Near hills
  ctx.fillStyle = P.hill;
  ctx.globalAlpha = 0.85;
  const off2 = (state.distance * 0.08) % 200;
  ctx.beginPath();
  ctx.moveTo(0, y + 4);
  for (let x = -200; x <= W + 200; x += 18) {
    const xx = x + off2;
    ctx.lineTo(x, y + 4 - 18 - Math.sin(xx * 0.012) * 12 - Math.sin(xx * 0.04) * 6);
  }
  ctx.lineTo(W, y + 4); ctx.lineTo(0, y + 4); ctx.fill();
  ctx.globalAlpha = 1;
}

// ---- Sea ----
function drawSea(P) {
  const seaY = H * 0.52, seaH = H * 0.12;
  const g2 = ctx.createLinearGradient(0, seaY, 0, seaY + seaH);
  g2.addColorStop(0, P.seaFar);
  g2.addColorStop(1, P.seaNear);
  ctx.fillStyle = g2;
  ctx.fillRect(0, seaY, W, seaH);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.2;
  for (let row = 0; row < 4; row++) {
    ctx.beginPath();
    const y = seaY + 6 + row * 10;
    const off = state.distance * (0.18 + row * 0.05);
    for (let x = -40; x <= W + 40; x += 5) {
      const yy = y + Math.sin((x + off) * 0.05 + row) * 1.8;
      if (x === -40) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }
}

// ---- Clouds ----
const clouds = [
  { x: 0.12, y: 0.16, s: 1.0, spd: 0.5 },
  { x: 0.38, y: 0.1, s: 0.7, spd: 0.35 },
  { x: 0.62, y: 0.22, s: 1.15, spd: 0.45 },
  { x: 0.88, y: 0.14, s: 0.85, spd: 0.6 },
];
function drawClouds(P) {
  ctx.fillStyle = P.cloud;
  clouds.forEach(c => {
    let x = (c.x * W - state.distance * 0.06 * c.spd);
    const span = W + 300;
    x = ((x % span) + span) % span - 150;
    drawCloud(x, c.y * H, c.s);
  });
}
function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.ellipse(x, y, 32 * s, 16 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 26 * s, y + 4 * s, 24 * s, 13 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 25 * s, y + 4 * s, 21 * s, 12 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 8 * s, y - 11 * s, 19 * s, 11 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ---- Lighthouse silhouette ----
function drawLighthouse(P) {
  const lx = W * 0.62, ly = H * 0.52;
  ctx.fillStyle = state.timeOfDay === 'night' ? '#2a3040' : (state.timeOfDay === 'dusk' ? '#3a2a3a' : '#6a5a4a');
  // Tower
  ctx.beginPath();
  ctx.moveTo(lx - 8, ly);
  ctx.lineTo(lx - 5, ly - 50);
  ctx.lineTo(lx + 5, ly - 50);
  ctx.lineTo(lx + 8, ly);
  ctx.closePath();
  ctx.fill();
  // Top
  ctx.fillRect(lx - 7, ly - 56, 14, 6);
  ctx.fillStyle = state.timeOfDay === 'night' ? '#ffe070' : '#d8c890';
  ctx.fillRect(lx - 6, ly - 54, 12, 4);
  // Roof
  ctx.fillStyle = state.timeOfDay === 'night' ? '#1a1a28' : '#8a3a2a';
  ctx.beginPath();
  ctx.moveTo(lx - 8, ly - 56);
  ctx.lineTo(lx, ly - 66);
  ctx.lineTo(lx + 8, ly - 56);
  ctx.closePath();
  ctx.fill();
  // Light beam at night
  if (state.timeOfDay === 'night') {
    const beam = ctx.createLinearGradient(lx, ly - 52, lx + 180, ly - 30);
    beam.addColorStop(0, 'rgba(255,224,112,0.35)');
    beam.addColorStop(1, 'rgba(255,224,112,0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(lx, ly - 54);
    ctx.lineTo(lx + 200, ly - 38);
    ctx.lineTo(lx + 200, ly - 22);
    ctx.lineTo(lx, ly - 50);
    ctx.closePath();
    ctx.fill();
  }
}

// ---- Boardwalk ----
function drawBoardwalk(P) {
  const y = H * 0.7;
  // Ground/sand below
  ctx.fillStyle = P.sand;
  ctx.fillRect(0, y + 32, W, H - y - 32);
  // Sand texture dots
  ctx.fillStyle = state.timeOfDay === 'night' ? 'rgba(255,255,255,0.04)' : 'rgba(180,150,100,0.25)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 53 + state.distance * 0.5) % W;
    const sy = y + 40 + (i % 5) * 8;
    ctx.fillRect(sx, sy, 2, 1);
  }
  // Planks
  const plankH = 32, plankW = 96;
  const off = state.distance % plankW;
  for (let i = -1; i * plankW < W + plankW; i++) {
    const x = i * plankW - off;
    ctx.fillStyle = P.plank;
    ctx.fillRect(x, y, plankW - 4, plankH);
    ctx.fillStyle = P.plankDark;
    ctx.fillRect(x, y + plankH - 4, plankW - 4, 4);
    ctx.strokeStyle = P.plankDark;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 6, y + 11); ctx.lineTo(x + plankW - 10, y + 11);
    ctx.moveTo(x + 8, y + 20); ctx.lineTo(x + plankW - 14, y + 20);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Bumpy stones
  if (state.terrain === 'bumpy') {
    ctx.fillStyle = state.timeOfDay === 'night' ? '#1a1a2a' : '#7a6a55';
    const stoneOff = state.distance % 56;
    for (let i = -1; i < W / 56 + 1; i++) {
      const x = i * 56 - stoneOff + 18;
      const y2 = y + 8 + Math.sin(i * 5.3) * 4;
      ctx.beginPath();
      ctx.ellipse(x, y2, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Rail posts receding
  ctx.fillStyle = P.rail;
  const postOff = state.distance % 130;
  for (let i = -1; i < W / 130 + 1; i++) {
    const x = i * 130 - postOff;
    ctx.fillRect(x, y - 24, 4, 26);
  }
  ctx.fillRect(0, y - 26, W, 3);
}

// ---- Pelican shadow ----
function drawPelicanShadow(P) {
  const { cx } = pelicanPos();
  const y = H * 0.7 + 30;
  ctx.fillStyle = P.shadow;
  ctx.beginPath();
  ctx.ellipse(cx, y, 110, 8, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ---- Pelican ----
function drawPelican(P) {
  const { cx, cy } = pelicanPos();
  const startled = state.startled > 0;
  const sprinting = state.sprint > 0;
  const tired = state.stamina < 40;

  ctx.save();
  ctx.translate(cx, cy);
  const lean = (startled ? 0.07 : 0) + (sprinting ? 0.04 : 0) + state.speed * 0.004;
  ctx.rotate(lean);

  // Legs (behind body)
  drawPelicanLegs(P);

  // Body
  ctx.fillStyle = P.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 96, 52, 0, 0, Math.PI * 2);
  ctx.fill();
  // Belly
  ctx.fillStyle = P.belly;
  ctx.beginPath();
  ctx.ellipse(-12, 20, 72, 30, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail feathers
  ctx.fillStyle = P.wingDark;
  ctx.beginPath();
  ctx.moveTo(-86, -12);
  ctx.lineTo(-130, -28);
  ctx.lineTo(-122, -8);
  ctx.lineTo(-138, 8);
  ctx.lineTo(-86, 12);
  ctx.closePath();
  ctx.fill();

  // Wing (on top, flapping)
  drawPelicanWing(P);

  // Neck + head
  ctx.fillStyle = P.body;
  ctx.beginPath();
  ctx.moveTo(48, -28);
  ctx.quadraticCurveTo(82, -58, 108, -54);
  ctx.quadraticCurveTo(98, -32, 70, -8);
  ctx.closePath();
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(112, -56, 23, 0, Math.PI * 2);
  ctx.fill();

  // Beak + pouch
  drawPelicanBeak(P);

  // Eye
  drawPelicanEye(P, startled, sprinting, tired);

  ctx.restore();
}

function drawPelicanLegs(P) {
  const cycle = state.t * (3.5 + state.speed * 0.55);
  ctx.strokeStyle = P.leg;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const hips = [[-32, 30], [-8, 30]];
  hips.forEach((h, i) => {
    const phase = cycle + i * Math.PI;
    const swing = Math.sin(phase) * 22;
    const lift = Math.max(0, Math.cos(phase)) * 16;
    const footX = h[0] + swing;
    const footY = 58 - lift;
    const kneeX = h[0] + swing * 0.45;
    const kneeY = 42 - lift * 0.5;
    ctx.beginPath();
    ctx.moveTo(h[0], h[1]);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(footX, footY);
    ctx.stroke();
    // Webbed foot
    ctx.fillStyle = P.leg;
    ctx.beginPath();
    ctx.ellipse(footX + 3, footY, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = P.leg;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let t = -1; t <= 1; t++) {
      ctx.moveTo(footX + 3, footY);
      ctx.lineTo(footX + 13 + t * 3, footY + 3);
    }
    ctx.stroke();
    ctx.lineWidth = 5;
  });
}

function drawPelicanWing(P) {
  const flap = Math.sin(state.t * (4.5 + state.speed * 0.45)) * 0.55;
  ctx.save();
  ctx.translate(-18, -32);
  ctx.rotate(-flap * 0.65 - 0.18);
  // Wing main
  ctx.fillStyle = P.wing;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-45, -32, -78, -8);
  ctx.quadraticCurveTo(-55, 8, 0, 10);
  ctx.closePath();
  ctx.fill();
  // Feather tips detail
  ctx.strokeStyle = P.wingDark;
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(-14 - i * 11, -4 + i * 2);
    ctx.lineTo(-30 - i * 11, -16 + i * 3);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPelicanBeak(P) {
  const pouchWobble = Math.sin(state.t * 9) * 3.2 * (state.speed > 0.1 ? 1 : 0.3);
  // Top beak
  ctx.fillStyle = P.beak;
  ctx.beginPath();
  ctx.moveTo(128, -62);
  ctx.quadraticCurveTo(180, -64, 204, -56);
  ctx.quadraticCurveTo(182, -50, 128, -52);
  ctx.closePath();
  ctx.fill();
  // Nostril dot
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.arc(138, -58, 1.5, 0, Math.PI * 2);
  ctx.fill();
  // Pouch (big wobbly throat sac)
  ctx.fillStyle = P.pouch;
  ctx.beginPath();
  ctx.moveTo(128, -50);
  ctx.quadraticCurveTo(172, -44, 204, -50);
  ctx.quadraticCurveTo(196, -8 + pouchWobble, 152, 8 + pouchWobble * 0.5);
  ctx.quadraticCurveTo(120, 18, 112, -8);
  ctx.closePath();
  ctx.fill();
  // Pouch highlight
  ctx.fillStyle = state.timeOfDay === 'night' ? 'rgba(255,200,150,0.12)' : 'rgba(255,225,160,0.45)';
  ctx.beginPath();
  ctx.ellipse(162, -22 + pouchWobble * 0.5, 26, 13, 0.18, 0, Math.PI * 2);
  ctx.fill();
  // Pouch rim line
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(128, -50);
  ctx.quadraticCurveTo(172, -44, 204, -50);
  ctx.stroke();
}

function drawPelicanEye(P, startled, sprinting, tired) {
  const ex = 118, ey = -60;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ex, ey, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  const po = startled ? 3 : 1.5;
  ctx.beginPath();
  ctx.arc(ex + po, ey, startled ? 5 : 4, 0, Math.PI * 2);
  ctx.fill();
  // highlight
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ex + po + 1.5, ey - 1.5, 1.3, 0, Math.PI * 2);
  ctx.fill();
  // Eyebrow
  if (startled) {
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(ex - 9, ey - 9);
    ctx.lineTo(ex + 5, ey - 13);
    ctx.stroke();
  } else if (tired) {
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(ex - 8, ey - 7);
    ctx.lineTo(ex + 6, ey - 5);
    ctx.stroke();
  }
  // Sweat drop near eye
  if (state.stamina < 35) {
    ctx.fillStyle = '#7fd0ff';
    ctx.beginPath();
    ctx.arc(ex - 7, ey + 5 + Math.sin(state.t * 4) * 2, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- Reins (handlebar → pelican beak) ----
function drawReins(P) {
  const bp = bicyclePos();
  const pp = pelicanPos();
  // handlebar world position (approx)
  const hx = bp.cx + 22 * Math.cos(bp.lean) - (-20) * Math.sin(bp.lean);
  const hy = bp.cy + 22 * Math.sin(bp.lean) + (-20) * Math.cos(bp.lean);
  // beak base world position
  const bx = pp.cx + 128;
  const by = pp.cy - 52;
  ctx.strokeStyle = '#6a3a1a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  // two reins
  ctx.beginPath();
  ctx.moveTo(hx - 6, hy);
  ctx.quadraticCurveTo(hx + 30, hy + 18, bx - 4, by + 2);
  ctx.moveTo(hx + 6, hy);
  ctx.quadraticCurveTo(hx + 40, hy + 22, bx + 6, by + 5);
  ctx.stroke();
}

// ---- Bicycle ----
function drawBicycle(P) {
  const { cx, cy, wheelRot, lean } = bicyclePos();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(lean);

  const wheelR = 30, wheelDist = 78;
  const wheelColor = state.timeOfDay === 'night' ? '#0a0a0a' : '#1a1a1a';

  // Back wheel
  drawWheel(-wheelDist / 2, 0, wheelR, wheelRot, wheelColor);
  // Front wheel
  drawWheel(wheelDist / 2, 0, wheelR, wheelRot, wheelColor);

  // Frame (red)
  ctx.strokeStyle = '#d63848';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-15, -9); ctx.lineTo(20, -9);         // top tube
  ctx.moveTo(5, 9); ctx.lineTo(20, -9);            // down tube
  ctx.moveTo(5, 9); ctx.lineTo(-15, -9);           // seat tube
  ctx.moveTo(5, 9); ctx.lineTo(-wheelDist / 2, 0); // chain stay
  ctx.moveTo(-15, -9); ctx.lineTo(-wheelDist / 2, 0); // seat stay
  ctx.moveTo(20, -9); ctx.lineTo(wheelDist / 2, 0);   // front fork
  ctx.stroke();

  // Seat
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(-18, -13, 9, 4, -0.1, 0, Math.PI * 2);
  ctx.fill();
  // Seat post
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-15, -9); ctx.lineTo(-18, -13);
  ctx.stroke();

  // Handlebars
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(20, -9); ctx.lineTo(22, -22);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(14, -24); ctx.quadraticCurveTo(22, -26, 30, -24);
  ctx.stroke();
  // Grip ends
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath(); ctx.arc(14, -24, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(30, -24, 2.5, 0, Math.PI * 2); ctx.fill();

  // Pedals
  drawPedals(5, 9, wheelRot);

  // Chain
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-wheelDist / 2 + 6, 4); ctx.lineTo(5, 12);
  ctx.moveTo(-wheelDist / 2 + 6, -4); ctx.lineTo(5, 6);
  ctx.stroke();

  // Bell on handlebar
  const bellScale = 1 + state.bellRing * 0.4;
  ctx.save();
  ctx.translate(22, -24);
  ctx.scale(bellScale, bellScale);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c89020';
  ctx.fillRect(-2, 0, 4, 2);
  if (state.bellRing > 0) {
    ctx.strokeStyle = 'rgba(255,210,63,' + state.bellRing + ')';
    ctx.lineWidth = 1.8;
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + state.t * 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12);
      ctx.stroke();
    }
  }
  ctx.restore();

  ctx.restore();
}

function drawWheel(x, y, r, rot, tireColor) {
  ctx.save();
  ctx.translate(x, y);
  // Tire
  ctx.fillStyle = tireColor;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  // Rim
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r - 4, 0, Math.PI * 2);
  ctx.stroke();
  // Spokes
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.rotate(rot);
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    const a = i / 8 * Math.PI * 2;
    ctx.lineTo(Math.cos(a) * (r - 5), Math.sin(a) * (r - 5));
    ctx.stroke();
  }
  // Hub
  ctx.fillStyle = '#666';
  ctx.beginPath();
  ctx.arc(0, 0, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPedals(x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  const a1 = rot, a2 = rot + Math.PI;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a1) * 11, Math.sin(a1) * 11);
  ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a2) * 11, Math.sin(a2) * 11);
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.save();
  ctx.translate(Math.cos(a1) * 11, Math.sin(a1) * 11);
  ctx.fillRect(-5, -2, 10, 4);
  ctx.restore();
  ctx.save();
  ctx.translate(Math.cos(a2) * 11, Math.sin(a2) * 11);
  ctx.fillRect(-5, -2, 10, 4);
  ctx.restore();
  // Hub
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- Fish ----
function drawFishes() {
  state.fishes.forEach(f => {
    const t = Math.min(1, f.t);
    const e = t * t * (3 - 2 * t);
    const x = lerp(f.x, f.tx, e);
    const y = lerp(f.y, f.ty, e) - Math.sin(t * Math.PI) * 50;
    const ang = Math.atan2(f.ty - f.y - Math.cos(t * Math.PI) * 50, f.tx - f.x);
    drawFish(x, y, ang, t);
  });
}
function drawFish(x, y, rot, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  const s = 1 - t * 0.35;
  ctx.scale(s, s);
  // Body
  ctx.fillStyle = '#5fa8d3';
  ctx.beginPath();
  ctx.ellipse(0, 0, 13, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Tail
  ctx.fillStyle = '#3a7fb8';
  ctx.beginPath();
  ctx.moveTo(-10, 0); ctx.lineTo(-19, -6); ctx.lineTo(-19, 6);
  ctx.closePath();
  ctx.fill();
  // Fin
  ctx.fillStyle = '#4a8fc8';
  ctx.beginPath();
  ctx.moveTo(0, -3); ctx.lineTo(-4, -10); ctx.lineTo(4, -5);
  ctx.closePath();
  ctx.fill();
  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -1, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(6, -1, 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---- Particles (foreground) ----
function drawParticlesFront() {
  // Dust
  state.dust.forEach(p => {
    const col = state.timeOfDay === 'night' ? '120,130,180' : '210,185,150';
    ctx.fillStyle = 'rgba(' + col + ',' + (p.life * 0.55) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  // Breath puffs
  state.puff.forEach(p => {
    ctx.fillStyle = state.timeOfDay === 'night' ? 'rgba(180,190,220,' + (p.life * 0.4) + ')' : 'rgba(240,245,255,' + (p.life * 0.5) + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  // Feathers
  state.feathers.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.life;
    ctx.fillStyle = state.timeOfDay === 'night' ? '#a0a0c0' : '#f0e8d0';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = state.timeOfDay === 'night' ? '#707090' : '#c0b890';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-p.size, 0); ctx.lineTo(p.size, 0);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  });
  // Sweat
  state.sweat.forEach(p => {
    ctx.fillStyle = 'rgba(127,208,255,' + p.life + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.size * 0.55, p.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (p.life * 0.7) + ')';
    ctx.beginPath();
    ctx.arc(p.x - p.size * 0.2, p.y - p.size * 0.3, p.size * 0.2, 0, Math.PI * 2);
    ctx.fill();
  });
  // Splash (from feeding)
  state.splash.forEach(p => {
    ctx.fillStyle = 'rgba(127,208,255,' + p.life + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ---- Vignette ----
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.32)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ============ Fish spawn ============
function feedFish() {
  const p = pelicanPos();
  state.fishes.push({
    x: 30, y: 80,
    tx: p.cx + 180, ty: p.cy - 50,
    t: 0, dur: 0.75, eaten: false
  });
}

// ============ Main loop ============
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  state.t += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ============ Event handlers ============
document.getElementById('bell').addEventListener('click', () => {
  playBell();
  state.bellRing = 1;
  state.startled = 1.2;
  state.sprint = Math.max(state.sprint, 0.9);
});
document.getElementById('speed').addEventListener('input', e => {
  state.speed = parseFloat(e.target.value);
});
document.getElementById('sprint').addEventListener('click', () => {
  if (state.stamina >= 8) state.sprint = Math.max(state.sprint, 1.6);
});
document.getElementById('fish').addEventListener('click', feedFish);
document.querySelectorAll('#timeSeg button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#timeSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.timeOfDay = b.dataset.v;
  });
});
document.querySelectorAll('#roadSeg button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#roadSeg button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    state.terrain = b.dataset.v;
  });
});
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'b') { e.preventDefault(); document.getElementById('bell').click(); }
  else if (e.key === 'f') document.getElementById('fish').click();
  else if (e.key === 's') document.getElementById('sprint').click();
});
</script>
</body>
</html>
