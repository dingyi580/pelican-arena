<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>自行车骑鹈鹕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #stage {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        button {
            background: #4CAF50;
            border: none;
            outline: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        #sound-btn {
            background: #FF9800;
        }

        #sound-btn:hover {
            background: #e68a00;
        }

        #speed-control {
            width: 120px;
        }
    </style>
</head>
<body>
<div id="stage">
    <canvas id="bgCanvas" width="800" height="500"></canvas>
    <canvas id="mainCanvas" width="800" height="500"></canvas>
    <div class="controls">
        <button id="bell-btn">🔔 按铃</button>
        <button id="sound-btn">🔊 音响</button>
        <input type="range" id="speed-control" min="1" max="10" value="5">
        <button id="weather-btn">🌅 晴天切换</button>
    </div>
</div>

<script>
const bgCanvas = document.getElementById("bgCanvas");
const mainCanvas = document.getElementById("mainCanvas");
const bgCtx = bgCanvas.getContext("2d");
const ctx = mainCanvas.getContext("2d");

let speed = 5;
let weather = "day"; // ['day', 'sunset', 'night']
let bellActive = false;
let isSprinting = false;

// Initialize background
drawBackground();

function drawBackground() {
    bgCtx.clearRect(0, 0, 800, 500);

    const gradient = bgCtx.createLinearGradient(0, 0, 0, 500);
    if (weather === "day") {
        gradient.addColorStop(0, "#87CEEB");
        gradient.addColorStop(1, "#FFFFFF");
    } else if (weather === "sunset") {
        gradient.addColorStop(0, "#FF6B35");
        gradient.addColorStop(1, "#F7B731");
    } else {
        gradient.addColorStop(0, "#1e3c72");
        gradient.addColorStop(1, "#2a5298");
    }
    bgCtx.fillStyle = gradient;
    bgCtx.fillRect(0, 0, 800, 500);

    // Sun
    if (weather === "day") {
        bgCtx.beginPath();
        bgCtx.arc(700, 80, 50, 0, Math.PI * 2);
        bgCtx.fillStyle = "#FFD700";
        bgCtx.fill();
    } else if (weather === "sunset") {
        bgCtx.beginPath();
        bgCtx.arc(700, 80, 50, 0, Math.PI * 2);
        bgCtx.fillStyle = "#FF6B35";
        bgCtx.fill();
    } else {
        for (let i = 0; i < 50; i++) {
            let size = Math.random()*2;
            let x = Math.random() * 800;
            let y = Math.random() * 500;
            bgCtx.beginPath();
            bgCtx.arc(x, y, size, 0, Math.PI * 2);
            bgCtx.fillStyle = "#FFFFFF";
            bgCtx.fill();
        }
    }

    // Birds flying
    for (let i = 0; i < 3; i++) {
        const x = (i * 200) % 800;
        const y = Math.sin(i + Date.now() / 500) * 20 + 200;
        bgCtx.beginPath();
        bgCtx.moveTo(x, y);
        bgCtx.lineTo(x+20, y-10);
        bgCtx.lineTo(x+40, y);
        bgCtx.lineTo(x+20, y+10);
        bgCtx.closePath();
        bgCtx.strokeStyle = '#FFFF00';
        bgCtx.lineWidth = 2;
        bgCtx.stroke();
    }

    particles.forEach(p => p.draw(bgCtx));
}

// Particle system
class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 2 - 1;
        this.speedY = Math.random() * 2 - 1;
        this.color = `rgba(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, 0.8)`;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y > 500 || this.x > 800 || this.x < 0) {
            this.x = Math.random() * 800;
            this.y = 0;
        }
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
}

const particles = Array.from({length: 100}, () => new Particle(Math.random()*800, Math.random()*500));

// Draw main scene
let pelicanOffset = 0;
const bicycle = {
    x: 300,
    y: 350,
    wheelRadius: 40,
    wheelAngle: 0,
    handleBarAngle: 0,
    frameAngle: 0,
    partSizeFactor: 0.02,
};

const pelican = {
    x: 300,
    y: 440,
    wingsAngle: 0,
    throatSize: 0,
    feetOffset: 0
};

// Animation loop
function animate() {
    ctx.clearRect(0, 0, 800, 500);

    const time = Date.now() / 1000;

    // Update animation properties based on speed and sprinting
    bicycle.wheelAngle += (speed / 10) * (isSprinting ? 1.8 : 1) * 0.1;
    pelican.wingsAngle = Math.sin(time * 4) * 0.3;
    pelican.throatSize = Math.sin(time * 3) * 0.2;
    pelican.feetOffset = Math.sin(time * 5);

    // Move forward slightly each frame
    if (!bellActive) {
        bicycle.x += (speed / 5) * (isSprinting ? 1.8 : 1);
        pelican.x += (speed / 5) * (isSprinting ? 1.8 : 1);
    }

    // Wrap around screen
    if (bicycle.x > 1000) bicycle.x = -500;
    if (pelican.x > 1000) pelican.x = -500;

    drawBicycle();
    drawPelican();

    // Update background and particles
    drawBackground();
    particles.forEach(p => {
        p.update();
        p.draw(bgCtx);
    });

    requestAnimationFrame(animate);
}

// Draw the bicycle
function drawBicycle() {
    ctx.save();
    ctx.translate(bicycle.x, bicycle.y);

    // Bicycle frame
    ctx.rotate(bicycle.frameAngle); // slight tilting effect when walking

    // Wheel draw order matters so they don't cover things incorrectly
    drawWheel(bicycle.wheelRadius, 0, 0);
    drawWheel(bicycle.wheelRadius, 0, -60); // front wheel

    // Frame shape (simplified with lines)
    ctx.strokeStyle = "#4682B4";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(-35, 0); // back tire center connection to stem
    ctx.lineTo(-35, -50); // seat post
    ctx.lineTo(0, -50); // head tube
    ctx.lineTo(30, -20); // top tube
    ctx.lineTo(30, 0); // rear horizontal
    ctx.moveTo(0, 0);
    ctx.lineTo(-35, 0);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(-35, -30);
    ctx.lineTo(0, -10);
    ctx.stroke(); // seat tube
    
    // Handlebars
    ctx.beginPath();
    ctx.moveTo(0, -50);
    ctx.lineTo(30, -60);
    ctx.moveTo(30, -60);
    ctx.lineTo(30, -70); // handlebar grip
    ctx.stroke();

    // Chain links (simplified visualization)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(20, 0);
    ctx.stroke();

    // Pedals
    ctx.beginPath();
    ctx.arc(0, 20, 8, 0, Math.PI*2);
    ctx.fillStyle="#333333";
    ctx.fill();
    ctx.strokeStyle="#333333";
    ctx.lineWidth=2;
    ctx.stroke();

    // Chain link between pedal and crank (simulated)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(10, 0);
    ctx.stroke();

    ctx.restore(); 

    // Make it appear like rider holding it down by connecting back wheel to Pelican's back using straps
    drawStrap();
}

function drawStrap() {
    const startX = bicycle.x - 35;
    const startY = bicycle.y;
    const endX = pelican.x + 20;
    const endY = pelican.y + 30; 
    const curvePointX = (startX + endX)/2;
    const curvePointY = startY - 50;

    ctx.strokeStyle = "#FF4500";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(curvePointX, curvePointY, endX, endY);
    ctx.stroke();

    // Draw the "seat" part that goes over the pelican's neck
    ctx.beginPath();
    ctx.arc(endX, endY, 10, 0, Math.PI*2);
    ctx.fillStyle="#000000";
    ctx.fill();
}

function drawWheel(radius, offsetX, offsetY) {
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.rotate(bicycle.wheelAngle);

    // Outer rim of wheel
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI*2);
    ctx.fillStyle="#333333";
    ctx.fill();
    ctx.strokeStyle="#444444";
    ctx.lineWidth=2;
    ctx.stroke();

    // Spokes
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const x1 = 0;
        const y1 = 0;
        const x2 = Math.cos(angle)*radius;
        const y2 = Math.sin(angle)*radius;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // Inner hub cap
    ctx.beginPath();
    ctx.arc(0, 0, radius/2, 0, Math.PI*2);
    ctx.fillStyle="#666666";
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

// Draw pelican body and details
function drawPelican() {
    ctx.save();
    ctx.translate(pelican.x, pelican.y);
    ctx.translate(0, pelican.feetOffset); // Simulate stepping up

    // Pelican body as an ellipse
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.ellipse(0, 0, 90, 40, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Neck
    ctx.beginPath();
    ctx.moveTo(40, -20);
    ctx.lineTo(90, -30); // long neck leading into beak
    ctx.lineWidth = 12;
    ctx.stroke();

    // Beak (orange)
    ctx.beginPath();
    ctx.moveTo(90, -25);
    ctx.lineTo(120, -15);
    ctx.lineTo(95, -5);
    ctx.closePath();
    ctx.fillStyle = "#FF6600";
    ctx.fill();

    // Tail
    ctx.beginPath();
    ctx.moveTo(-40, -20);
    ctx.lineTo(-70, -50);
    ctx.lineTo(-60, -20);
    ctx.closePath();
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();

    // Wings (flapping motion)
    ctx.save();
    ctx.translate(-20, 0);
    ctx.rotate(pelican.wingsAngle);
    ctx.beginPath();
    ctx.moveTo(-20, -30);
    ctx.lineTo(-50, -20);
    ctx.lineTo(-30, -50);
    ctx.closePath();
    ctx.fillStyle="#CCCCCC";
    ctx.fill();
    ctx.restore();

    // Feet
    const footWidth = 20;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(40+i*12, 20, footWidth-5, 8, 0, 0, Math.PI*2);
        ctx.fillStyle="#FFCC33";
        ctx.fill();
        ctx.stroke();
    }

    // Throat (large pouch)
    ctx.beginPath();
    ctx.ellipse(50, -15, 30+pelican.throatSize, 20-pelican.throatSize, 0, 0, Math.PI*2);
    ctx.fillStyle="#FFD700";
    ctx.fill();

    ctx.restore();
}

// Event Listeners
document.getElementById('bell-btn').addEventListener('click', e => {
    bellActive = true;
    setTimeout(() => bellActive = false, 200);
    playBellSound();
    pelican.feetOffset = -30; // jump motion
});

// Use Web Audio API to generate a bell sound effect
function playBellSound() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5 note
        oscillator.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.start(); 
        oscillator.stop(audioContext.currentTime + 0.1);
    } catch(e) { }
}

document.getElementById('speed-control').oninput = e => {
    speed = parseInt(e.target.value);
};

document.getElementById('weather-btn').addEventListener('click', e => {
    const weathers = ["day", "sunset", "night"];
    let currentIndex = weathers.indexOf(weather);
    weather = weathers[(currentIndex + 1) % weathers.length];
});

document.getElementById('sound-btn').addEventListener('click', () => {
    // toggle muted state
    isSprinting = !isSprinting;
    document.getElementById('sound-btn').textContent = isSprinting ? '🏃 跑步' : '🔊 音响';
    pelicanOffset += Math.random() * 5 - 2.5; // give random bump when accelerating
});

// Start animation
animate();
</script>
</body>
</html>
