<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕 - 跨代模型前端擂台赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2980, #26d0ce);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #ffde59;
            box-shadow: 0 0 20px rgba(255, 222, 89, 0.5);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            color: #ffde59;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            height: 70%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
            border: 3px solid #ffde59;
        }
        
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            width: 100%;
            flex-wrap: wrap;
        }
        
        .control-group {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 180px;
            border: 1px solid #ffde59;
        }
        
        .control-title {
            margin-bottom: 12px;
            font-size: 1.2rem;
            color: #ffde59;
        }
        
        .btn {
            background: linear-gradient(to bottom, #ffde59, #ffb347);
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin: 5px;
            width: 140px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .speed-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .speed-slider {
            width: 90%;
            margin: 10px 0;
            -webkit-appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #555;
            outline: none;
        }
        
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #ffde59;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        .speed-value {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
            color: #ffde59;
        }
        
        .pelican-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            width: 100%;
        }
        
        .status-bar {
            width: 90%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            border: 1px solid #555;
        }
        
        .status-fill {
            height: 100%;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            border-radius: 10px;
            width: 80%;
            transition: width 0.5s;
        }
        
        .status-label {
            font-size: 0.9rem;
            color: #ddd;
        }
        
        .instructions {
            position: absolute;
            bottom: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            text-align: center;
            max-width: 80%;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
        }
        
        .feather {
            position: absolute;
            color: white;
            font-size: 24px;
            opacity: 0.8;
        }
        
        .day-night-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50px;
            padding: 10px;
            display: flex;
            z-index: 100;
        }
        
        .toggle-btn {
            background: #444;
            border: none;
            color: #ddd;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .toggle-btn.active {
            background: #ffde59;
            color: #333;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .control-group {
                width: 90%;
            }
            
            header {
                padding: 10px 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>自行车骑鹈鹕</h1>
            <div class="subtitle">反常识物理的奇妙冒险</div>
        </header>
        
        <div class="day-night-toggle">
            <button class="toggle-btn active" id="dayBtn">白天</button>
            <button class="toggle-btn" id="duskBtn">黄昏</button>
            <button class="toggle-btn" id="nightBtn">夜晚</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="sceneCanvas"></canvas>
            <div class="particles" id="particles"></div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <div class="control-title">鹈鹕控制</div>
                <button class="btn" id="feedBtn">投喂小鱼</button>
                <button class="btn" id="sprintBtn">冲刺模式</button>
                <div class="pelican-status">
                    <div class="status-bar">
                        <div class="status-fill" id="staminaBar"></div>
                    </div>
                    <div class="status-label">鹈鹕体力</div>
                </div>
            </div>
            
            <div class="control-group">
                <div class="control-title">自行车控制</div>
                <button class="btn" id="bellBtn">按响车铃</button>
                <button class="btn" id="terrainBtn">切换路况</button>
                <div class="speed-control">
                    <input type="range" min="1" max="10" value="4" class="speed-slider" id="speedSlider">
                    <div class="speed-value">速度: <span id="speedValue">4</span></div>
                </div>
            </div>
        </div>
        
        <div class="instructions">
            提示：点击"按响车铃"让鹈鹕受惊加速，使用速度滑块调节节奏，投喂小鱼恢复鹈鹕体力！
        </div>
    </div>

    <script>
        // 主场景绘制和动画
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');
        const particlesContainer = document.getElementById('particles');
        
        // 设置画布尺寸
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // 场景状态
        const state = {
            speed: 4,
            terrain: 'road',
            timeOfDay: 'day',
            stamina: 80,
            isSprinting: false,
            bellRinging: false,
            position: 0,
            pelican: {
                bodyY: 0,
                neckAngle: 0,
                mouthOpen: 0,
                wingAngle: 0,
                legPhase: 0
            },
            bicycle: {
                rotation: 0,
                pedalAngle: 0,
                shake: 0
            },
            backgroundOffset: 0
        };
        
        // 视差背景层
        const backgroundLayers = [
            { speed: 0.2, color: '#5DADE2' }, // 远山/云层
            { speed: 0.5, color: '#3498DB' }, // 中景
            { speed: 1.0, color: '#2980B9' }  // 近景
        ];
        
        // 粒子系统
        class ParticleSystem {
            constructor() {
                this.particles = [];
                this.feathers = [];
            }
            
            createParticle(x, y, type) {
                if (type === 'bubble') {
                    this.particles.push({
                        x, y,
                        size: Math.random() * 8 + 2,
                        speedX: Math.random() * 2 - 1,
                        speedY: Math.random() * -3 - 1,
                        life: 100,
                        type: 'bubble'
                    });
                } else if (type === 'sweat') {
                    this.particles.push({
                        x, y,
                        size: Math.random() * 5 + 3,
                        speedX: Math.random() * 2,
                        speedY: Math.random() * 2 + 1,
                        life: 70,
                        type: 'sweat'
                    });
                } else if (type === 'feather') {
                    this.feathers.push({
                        x, y,
                        size: Math.random() * 15 + 15,
                        rotation: Math.random() * 360,
                        speedX: Math.random() * 3 - 1.5,
                        speedY: Math.random() * 1 + 0.5,
                        rotationSpeed: Math.random() * 4 - 2,
                        life: 200
                    });
                }
            }
            
            update() {
                // 更新粒子
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.speedX;
                    p.y += p.speedY;
                    p.life--;
                    
                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
                
                // 更新羽毛
                for (let i = this.feathers.length - 1; i >= 0; i--) {
                    const f = this.feathers[i];
                    f.x += f.speedX;
                    f.y += f.speedY;
                    f.rotation += f.rotationSpeed;
                    f.life--;
                    
                    if (f.life <= 0) {
                        this.feathers.splice(i, 1);
                    }
                }
            }
            
            render() {
                particlesContainer.innerHTML = '';
                
                // 渲染粒子
                this.particles.forEach(p => {
                    const el = document.createElement('div');
                    el.className = 'particle';
                    el.style.left = `${p.x}px`;
                    el.style.top = `${p.y}px`;
                    el.style.width = `${p.size}px`;
                    el.style.height = `${p.size}px`;
                    
                    if (p.type === 'bubble') {
                        el.style.background = 'radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(173,216,230,0.6) 100%)';
                        el.style.border = '1px solid rgba(135, 206, 235, 0.5)';
                    } else {
                        el.style.background = 'radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(200,230,255,0.7) 100%)';
                    }
                    
                    particlesContainer.appendChild(el);
                });
                
                // 渲染羽毛
                this.feathers.forEach(f => {
                    const el = document.createElement('div');
                    el.className = 'feather';
                    el.style.left = `${f.x}px`;
                    el.style.top = `${f.y}px`;
                    el.style.transform = `rotate(${f.rotation}deg)`;
                    el.style.fontSize = `${f.size}px`;
                    el.innerHTML = '❦';
                    particlesContainer.appendChild(el);
                });
            }
        }
        
        const particleSystem = new ParticleSystem();
        
        // 绘制鹈鹕
        function drawPelican(x, y) {
            const pelican = state.pelican;
            
            // 身体
            ctx.beginPath();
            ctx.ellipse(x, y + pelican.bodyY, 80, 50, 0, 0, Math.PI * 2);
            ctx.fillStyle = state.timeOfDay === 'night' ? '#4a6fa5' : '#a3c4e0';
            ctx.fill();
            ctx.strokeStyle = '#7a9cc6';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 脖子和头
            ctx.save();
            ctx.translate(x - 40, y - 40 + pelican.bodyY);
            ctx.rotate(pelican.neckAngle * Math.PI / 180);
            
            // 脖子
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(20, -20, 60, -10, 80, 20);
            ctx.strokeStyle = '#7a9cc6';
            ctx.lineWidth = 12;
            ctx.stroke();
            
            // 头
            ctx.beginPath();
            ctx.arc(80, 20, 25, 0, Math.PI * 2);
            ctx.fillStyle = state.timeOfDay === 'night' ? '#4a6fa5' : '#a3c4e0';
            ctx.fill();
            ctx.stroke();
            
            // 眼睛
            ctx.beginPath();
            ctx.arc(90, 15, 6, 0, Math.PI * 2);
            ctx.fillStyle = state.stamina < 30 ? '#ff3333' : '#333';
            ctx.fill();
            
            // 眼珠
            ctx.beginPath();
            ctx.arc(90, 15, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // 嘴
            const mouthOpen = pelican.mouthOpen * 0.5;
            ctx.beginPath();
            ctx.moveTo(100, 20);
            ctx.lineTo(140, 15 + mouthOpen);
            ctx.lineTo(140, 25 - mouthOpen);
            ctx.closePath();
            ctx.fillStyle = state.timeOfDay === 'dusk' ? '#ffaa66' : '#ff9966';
            ctx.fill();
            ctx.strokeStyle = '#e68a5e';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 喉囊
            ctx.beginPath();
            ctx.moveTo(100, 20);
            ctx.bezierCurveTo(110, 40, 120, 40, 140, 20);
            ctx.fillStyle = state.timeOfDay === 'night' ? '#d46a6a' : '#ff7f7f';
            ctx.fill();
            ctx.strokeStyle = '#e68a5e';
            ctx.stroke();
            
            ctx.restore();
            
            // 翅膀
            ctx.save();
            ctx.translate(x + 20, y + pelican.bodyY);
            ctx.rotate(pelican.wingAngle * Math.PI / 180);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(40, -10, 60, -50, 40, -80);
            ctx.bezierCurveTo(20, -60, -10, -30, 0, 0);
            ctx.fillStyle = state.timeOfDay === 'night' ? '#3c5d8c' : '#8fb3d9';
            ctx.fill();
            ctx.strokeStyle = '#7a9cc6';
            ctx.stroke();
            
            ctx.restore();
            
            // 腿和脚
            const legOffset = Math.sin(pelican.legPhase) * 15;
            
            // 左腿
            ctx.beginPath();
            ctx.moveTo(x - 30, y + 40 + pelican.bodyY);
            ctx.lineTo(x - 40, y + 80 + pelican.bodyY + legOffset);
            ctx.strokeStyle = '#e68a5e';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // 左蹼
            ctx.beginPath();
            ctx.moveTo(x - 40, y + 80 + pelican.bodyY + legOffset);
            ctx.lineTo(x - 50, y + 85 + pelican.bodyY + legOffset);
            ctx.lineTo(x - 40, y + 90 + pelican.bodyY + legOffset);
            ctx.lineTo(x - 30, y + 85 + pelican.bodyY + legOffset);
            ctx.closePath();
            ctx.fillStyle = state.timeOfDay === 'dusk' ? '#ffaa66' : '#ff9966';
            ctx.fill();
            
            // 右腿
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 45 + pelican.bodyY);
            ctx.lineTo(x + 5, y + 85 + pelican.bodyY - legOffset);
            ctx.strokeStyle = '#e68a5e';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // 右蹼
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 85 + pelican.bodyY - legOffset);
            ctx.lineTo(x - 5, y + 90 + pelican.bodyY - legOffset);
            ctx.lineTo(x + 5, y + 95 + pelican.bodyY - legOffset);
            ctx.lineTo(x + 15, y + 90 + pelican.bodyY - legOffset);
            ctx.closePath();
            ctx.fillStyle = state.timeOfDay === 'dusk' ? '#ffaa66' : '#ff9966';
            ctx.fill();
            
            // 汗水粒子
            if (state.isSprinting && Math.random() > 0.7) {
                particleSystem.createParticle(
                    x + 120, 
                    y - 10 + pelican.bodyY, 
                    'sweat'
                );
            }
        }
        
        // 绘制自行车
        function drawBicycle(x, y) {
            const bike = state.bicycle;
            const shake = bike.shake;
            const pedalAngle = bike.pedalAngle;
            
            // 主车架
            ctx.beginPath();
            ctx.moveTo(x - 50, y + 30);
            ctx.lineTo(x + 50, y - 30);
            ctx.lineTo(x + 80, y + 20);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            // 座管
            ctx.beginPath();
            ctx.moveTo(x + 50, y - 30);
            ctx.lineTo(x + 40, y - 80);
            ctx.stroke();
            
            // 车座
            ctx.beginPath();
            ctx.ellipse(x + 40, y - 90 + shake, 15, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();
            ctx.strokeStyle = '#5D2906';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 车把
            ctx.beginPath();
            ctx.moveTo(x - 50, y + 30);
            ctx.lineTo(x - 80, y + 20 + shake);
            ctx.lineTo(x - 100, y + 20 + shake);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            // 缰绳（连接到鹈鹕嘴）
            ctx.beginPath();
            ctx.moveTo(x - 100, y + 20 + shake);
            ctx.lineTo(x - 200, y - 40);
            ctx.strokeStyle = '#996633';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 前轮
            ctx.save();
            ctx.translate(x - 50, y + 40);
            ctx.rotate(bike.rotation);
            
            // 轮圈
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // 辐条
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI / 4) + bike.rotation;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * 35, Math.sin(angle) * 35);
                ctx.strokeStyle = '#777';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.restore();
            
            // 后轮
            ctx.save();
            ctx.translate(x + 80, y + 30);
            ctx.rotate(bike.rotation);
            
            // 轮圈
            ctx.beginPath();
            ctx.arc(0, 0, 35, 0, Math.PI * 2);
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // 辐条
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI / 4) + bike.rotation;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * 35, Math.sin(angle) * 35);
                ctx.strokeStyle = '#777';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.restore();
            
            // 链条
            ctx.beginPath();
            ctx.arc(x + 50, y - 30, 10, 0, Math.PI * 2);
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(x + 80, y + 30, 10, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(x + 50 + 7, y - 30 - 7);
            ctx.lineTo(x + 80 - 7, y + 30 + 7);
            ctx.stroke();
            
            // 脚踏
            ctx.save();
            ctx.translate(x + 50, y - 30);
            ctx.rotate(pedalAngle);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 25);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // 踏板
            ctx.beginPath();
            ctx.rect(-5, 25, 10, 5);
            ctx.fillStyle = '#555';
            ctx.fill();
            
            ctx.restore();
            
            // 车铃
            ctx.save();
            ctx.translate(x - 70, y + 15);
            
            if (state.bellRinging) {
                ctx.translate(Math.sin(Date.now() / 50) * 3, 0);
            }
            
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();
            ctx.strokeStyle = '#cc9900';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // 铃铛按钮
            ctx.beginPath();
            ctx.arc(0, -5, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ff3333';
            ctx.fill();
            
            ctx.restore();
        }
        
        // 绘制背景
        function drawBackground() {
            const width = canvas.width;
            const height = canvas.height;
            
            // 天空
            let skyGradient;
            if (state.timeOfDay === 'dusk') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, height);
                skyGradient.addColorStop(0, '#ff7f50');
                skyGradient.addColorStop(0.5, '#ff9966');
                skyGradient.addColorStop(1, '#1a2980');
            } else if (state.timeOfDay === 'night') {
                skyGradient = ctx.createLinearGradient(0, 0, 0, height);
                skyGradient.addColorStop(0, '#0c1445');
                skyGradient.addColorStop(1, '#1a2980');
            } else {
                skyGradient = ctx.createLinearGradient(0, 0, 0, height);
                skyGradient.addColorStop(0, '#87CEEB');
                skyGradient.addColorStop(1, '#E0F7FA');
            }
            
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, width, height);
            
            // 太阳/月亮
            ctx.beginPath();
            ctx.arc(width * 0.8, height * 0.2, 40, 0, Math.PI * 2);
            
            if (state.timeOfDay === 'dusk') {
                ctx.fillStyle = '#ff4500';
            } else if (state.timeOfDay === 'night') {
                ctx.fillStyle = '#e6e6e6';
            } else {
                ctx.fillStyle = '#ffde59';
            }
            
            ctx.fill();
            
            // 云朵
            ctx.fillStyle = state.timeOfDay === 'night' ? 'rgba(200, 200, 220, 0.7)' : 'rgba(255, 255, 255, 0.9)';
            drawCloud(width * 0.2 + state.backgroundOffset * 0.1, height * 0.15, 0.8);
            drawCloud(width * 0.7 - state.backgroundOffset * 0.15, height * 0.25, 0.6);
            drawCloud(width * 0.4 + state.backgroundOffset * 0.2, height * 0.3, 1.0);
            
            // 地面
            let groundColor;
            if (state.terrain === 'road') {
                groundColor = state.timeOfDay === 'night' ? '#2c3e50' : '#34495e';
            } else {
                groundColor = state.timeOfDay === 'night' ? '#5d4037' : '#8d6e63';
            }
            
            ctx.fillStyle = groundColor;
            ctx.fillRect(0, height * 0.7, width, height * 0.3);
            
            // 道路纹理
            if (state.terrain === 'road') {
                // 道路标记
                ctx.fillStyle = state.timeOfDay === 'night' ? '#f1c40f' : '#ecf0f1';
                for (let i = -2; i < width / 40 + 2; i++) {
                    const pos = (i * 40 - state.position * 2) % (width + 80) - 40;
                    ctx.fillRect(pos, height * 0.75, 20, 5);
                }
            } else {
                // 石子
                ctx.fillStyle = state.timeOfDay === 'night' ? 'rgba(0, 0, 0, 0.3)' : 'rgba(0, 0, 0, 0.2)';
                for (let i = 0; i < 100; i++) {
                    const x = (i * 37 + state.position * 3) % width;
                    const y = height * 0.7 + (i * 17) % (height * 0.3);
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(40, -20, 70, -20, 90, 0);
            ctx.bezierCurveTo(110, -30, 140, -30, 150, -10);
            ctx.bezierCurveTo(180, -20, 190, 10, 160, 20);
            ctx.bezierCurveTo(190, 40, 170, 70, 140, 70);
            ctx.bezierCurveTo(120, 100, 80, 100, 60, 70);
            ctx.bezierCurveTo(30, 90, 0, 70, 0, 50);
            ctx.bezierCurveTo(-30, 40, -30, 10, 0, 0);
            ctx.fill();
            
            ctx.restore();
        }
        
        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 更新状态
            state.position += state.speed / 5;
            state.backgroundOffset += state.speed / 20;
            
            // 鹈鹕动画
            state.pelican.bodyY = Math.sin(Date.now() / 200) * 5;
            state.pelican.neckAngle = Math.sin(Date.now() / 300) * 5;
            state.pelican.mouthOpen = Math.sin(Date.now() / 500) * 5;
            state.pelican.wingAngle = Math.sin(Date.now() / 150) * 15 + 5;
            state.pelican.legPhase = Date.now() / 100 * state.speed;
            
            // 自行车动画
            state.bicycle.rotation -= state.speed / 50;
            state.bicycle.pedalAngle -= state.speed / 20;
            state.bicycle.shake = Math.sin(Date.now() / 180) * (state.terrain === 'road' ? 2 : 5);
            
            // 体力消耗
            if (state.isSprinting) {
                state.stamina = Math.max(0, state.stamina - 0.1);
                if (state.stamina === 0) {
                    state.isSprinting = false;
                    document.getElementById('sprintBtn').textContent = '冲刺模式';
                }
            } else if (state.stamina < 100) {
                state.stamina = Math.min(100, state.stamina + 0.05);
            }
            
            // 车铃效果减弱
            if (state.bellRinging && Date.now() - state.bellRinging > 1000) {
                state.bellRinging = false;
            }
            
            // 绘制场景
            drawBackground();
            
            // 计算鹈鹕位置（在画布中央）
            const pelicanX = canvas.width * 0.5;
            const pelicanY = canvas.height * 0.65;
            
            drawPelican(pelicanX, pelicanY);
            drawBicycle(pelicanX - 180, pelicanY - 80);
            
            // 更新粒子系统
            particleSystem.update();
            particleSystem.render();
            
            // 随机创建气泡
            if (Math.random() > 0.9 && state.timeOfDay !== 'night') {
                particleSystem.createParticle(
                    Math.random() * canvas.width,
                    canvas.height * 0.7,
                    'bubble'
                );
            }
            
            // 随机创建羽毛
            if (Math.random() > 0.97) {
                particleSystem.createParticle(
                    pelicanX - 150,
                    pelicanY - 60,
                    'feather'
                );
            }
            
            requestAnimationFrame(animate);
        }
        
        // 初始化交互
        function initInteractions() {
            // 车铃按钮
            document.getElementById('bellBtn').addEventListener('click', () => {
                state.bellRinging = Date.now();
                
                // 使用Web Audio生成铃声
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(1760, audioCtx.currentTime + 0.1);
                    
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.5);
                    
                    // 鹈鹕受惊效果
                    state.speed = Math.min(10, state.speed + 2);
                    document.getElementById('speedValue').textContent = state.speed.toFixed(1);
                    document.getElementById('speedSlider').value = state.speed;
                    state.pelican.mouthOpen = 10;
                } catch (e) {
                    console.log("音频生成失败:", e);
                }
            });
            
            // 投喂小鱼
            document.getElementById('feedBtn').addEventListener('click', () => {
                state.stamina = Math.min(100, state.stamina + 30);
                
                // 创建小鱼投喂效果
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        particleSystem.createParticle(
                            canvas.width * 0.9,
                            canvas.height * 0.7,
                            'sweat'
                        );
                    }, i * 100);
                }
            });
            
            // 冲刺模式
            document.getElementById('sprintBtn').addEventListener('click', () => {
                if (state.stamina > 20) {
                    state.isSprinting = !state.isSprinting;
                    document.getElementById('sprintBtn').textContent = 
                        state.isSprinting ? '停止冲刺' : '冲刺模式';
                    state.speed = state.isSprinting ? 8 : 4;
                    document.getElementById('speedValue').textContent = state.speed.toFixed(1);
                    document.getElementById('speedSlider').value = state.speed;
                }
            });
            
            // 速度控制
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            
            speedSlider.addEventListener('input', () => {
                state.speed = parseFloat(speedSlider.value);
                speedValue.textContent = state.speed.toFixed(1);
            });
            
            // 路况切换
            document.getElementById('terrainBtn').addEventListener('click', () => {
                state.terrain = state.terrain === 'road' ? 'bumpy' : 'road';
                document.getElementById('terrainBtn').textContent = 
                    state.terrain === 'road' ? '石子路' : '平路';
            });
            
            // 时间切换
            document.getElementById('dayBtn').addEventListener('click', () => {
                state.timeOfDay = 'day';
                updateTimeButtons();
            });
            
            document.getElementById('duskBtn').addEventListener('click', () => {
                state.timeOfDay = 'dusk';
                updateTimeButtons();
            });
            
            document.getElementById('nightBtn').addEventListener('click', () => {
                state.timeOfDay = 'night';
                updateTimeButtons();
            });
            
            function updateTimeButtons() {
                document.getElementById('dayBtn').classList.toggle('active', state.timeOfDay === 'day');
                document.getElementById('duskBtn').classList.toggle('active', state.timeOfDay === 'dusk');
                document.getElementById('nightBtn').classList.toggle('active', state.timeOfDay === 'night');
            }
            
            // 体力条更新
            setInterval(() => {
                document.getElementById('staminaBar').style.width = `${state.stamina}%`;
            }, 100);
        }
        
        // 启动
        window.addEventListener('load', () => {
            initInteractions();
            animate();
        });
    </script>
</body>
</html>
