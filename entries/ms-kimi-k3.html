<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1430;
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:block}
  .panel{position:fixed;z-index:10;color:#fff;background:rgba(13,20,38,.55);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #title{top:16px;left:16px;padding:12px 18px;pointer-events:none}
  #title h1{margin:0;font-size:18px;letter-spacing:2px}
  #title p{margin:4px 0 0;font-size:11px;opacity:.72;letter-spacing:.5px}
  #hint{top:16px;right:16px;padding:10px 14px;font-size:11.5px;line-height:1.8;opacity:.92;pointer-events:none}
  #hint b{color:#ffd76a}
  #bar{left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:10px;
    padding:10px 14px;flex-wrap:wrap;justify-content:center;max-width:min(96vw,940px)}
  button{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 13px;cursor:pointer;
    transition:all .15s;white-space:nowrap}
  button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
  button:active{transform:scale(.94)}
  button.active{background:#f5a623;border-color:#ffd98a;color:#3a2408}
  button:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(255,255,255,.07);
    padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  input[type=range]{width:110px;accent-color:#f5a623;cursor:pointer}
  .stamWrap{display:flex;align-items:center;gap:8px;font-size:12px;padding:0 4px}
  .stamina{width:110px;height:10px;border-radius:99px;background:rgba(255,255,255,.14);
    overflow:hidden;border:1px solid rgba(255,255,255,.12)}
  #stamFill{height:100%;width:100%;background:linear-gradient(90deg,#34d399,#b6e34d);border-radius:99px}
  #status{min-width:70px;opacity:.9}
  @media (max-width:760px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel" id="title">
  <h1>🚲 自行车骑鹈鹕</h1>
  <p>A Bicycle Riding a Pelican · 反向骑乘物语</p>
</div>
<div class="panel" id="hint">
  快捷键：<b>B</b> 按铃 · <b>空格</b> 冲刺 · <b>F</b> 喂鱼 · <b>T</b> 切换时光<br>
  小彩蛋：可以直接点击车把上的铃铛！
</div>
<div class="panel" id="bar">
  <button id="bellBtn">🔔 按铃</button>
  <label class="ctl">速度 <input id="spd" type="range" min="0" max="10" step="0.1" value="4"><span id="spdVal">4.0</span></label>
  <button id="sprintBtn">⚡ 冲刺(按住)</button>
  <button id="fishBtn">🐟 喂鱼</button>
  <button id="timeBtn">🌇 黄昏</button>
  <button id="roadBtn">🛣️ 平路</button>
  <div class="stamWrap"><span>体力</span><div class="stamina"><div id="stamFill"></div></div><span id="status">稳健前行</span></div>
</div>

<script>
'use strict';
/* ================= 基础 ================= */
const cv=document.getElementById('stage');
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const css=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ================= 状态 ================= */
const S={
  t:0,dist:0,u:1,cx:0,groundY:0,feetY:0,horizonY:0,
  baseSpeed:4,speed:0,speedN:0,runAmt:0,sprint:false,stamina:100,
  timeMode:0,night:0,sunAmt:1,moonAmt:0,sunAlt:0.18,
  bumpy:false,phase:0,flapT:0,flapBoost:0,flapAmp:0.2,
  startle:0,bellRing:0,fishLump:0,happyT:0,gulpT:0,bubbleT:0,bubble:'驾！',
  pouchWob:0,pouchWobV:0,wheelA:0,crankA:0,jolt:0,joltY:0,nextJolt:0.5,
  hopT:0,wheelie:0,blinkT:3,fishCD:0,sweatT:0,streakT:0,dustT:0,
  fish:[],
  anch:{back:{x:0,y:0},beakBase:{x:0,y:0},pouchMid:{x:200,y:200},head:{x:0,y:0}},
  bellXY:{x:-99,y:-99},gripXY:{x:0,y:0},helmetXY:{x:0,y:0}
};
const BUBBLES=['驾！','YEEHAW!','冲鸭！','嘎——！','驾驾驾！'];
const P=[]; // 粒子
const clouds=[];
for(let i=0;i<6;i++)clouds.push({x:Math.random()*1600,y:(0.06+Math.random()*0.24)*800,s:0.6+Math.random()*0.9,sp:6+Math.random()*8});
const stars=[];
for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random()*0.55,r:0.5+Math.random()*1.4,tw:1+Math.random()*3,ph:Math.random()*7});

/* ================= 调色板（白天/黄昏/夜晚） ================= */
const PAL=[
 {skyT:[126,199,247],skyB:[226,246,255],seaT:[38,150,190],seaB:[127,216,224],wood:[206,150,96],woodD:[158,108,60],cloud:[255,255,255],sun:[255,214,106]},
 {skyT:[96,72,150], skyB:[255,158,122],seaT:[74,63,122], seaB:[205,110,100],wood:[150,96,70], woodD:[110,68,48], cloud:[255,190,170],sun:[255,138,74]},
 {skyT:[10,20,48],  skyB:[31,58,95],  seaT:[14,34,55],  seaB:[29,69,96],  wood:[86,60,50],  woodD:[56,38,32],  cloud:[44,58,88],  sun:[244,241,222]}
];
const NIGHTS=[0,0.45,1],SUNA=[1,1,0],MOONA=[0,0,1],SUNY=[0.18,0.42,0.18];
const CP=JSON.parse(JSON.stringify(PAL[0]));

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S.u=clamp(Math.min(W,H)/640,0.6,1.3);
  S.cx=W*0.42;S.horizonY=H*0.52;S.groundY=H*0.70;S.feetY=H*0.85;
  for(const c of clouds){if(c.x>W+220)c.x=Math.random()*W;}
}

/* ================= 音频（全代码合成） ================= */
let AC=null,windGain=null;
function ac(){
  try{
    if(!AC){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return null;
      AC=new Ctx();
      const len=AC.sampleRate*1.2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
      const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=320;
      windGain=AC.createGain();windGain.gain.value=0;
      src.connect(f);f.connect(windGain);windGain.connect(AC.destination);src.start();
    }
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null;}
}
function ding(){
  const c=ac();if(!c)return;const t0=c.currentTime;
  [[0,1],[0.14,0.7]].forEach(pair=>{
    const t=t0+pair[0],vol=pair[1];
    [[1980,1],[5460,0.42],[10600,0.18]].forEach(pg=>{
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=pg[0]*(0.98+Math.random()*0.04);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.16*vol*pg[1],t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+1);
    });
  });
}
function gulp(){
  const c=ac();if(!c)return;const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(420,t);
  o.frequency.exponentialRampToValueAtTime(85,t+0.22);
  g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.32);
}
function pop(){
  const c=ac();if(!c)return;const t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='triangle';o.frequency.setValueAtTime(300,t);
  o.frequency.exponentialRampToValueAtTime(720,t+0.08);
  g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.15);
}

/* ================= 粒子 ================= */
function spawnSweat(){
  P.push({type:'sweat',x:S.anch.head.x+(-8+Math.random()*16)*S.u,y:S.anch.head.y-10*S.u,
    vx:-30-Math.random()*80-S.speed*0.12,vy:-110-Math.random()*90,life:0.8,ml:0.8});
}
function spawnFeather(n){
  for(let i=0;i<n;i++)P.push({type:'feather',
    x:S.cx+(-30+Math.random()*60)*S.u,y:S.feetY-120*S.u+Math.random()*40*S.u,
    vx:-30-Math.random()*50-S.speed*0.1,vy:10+Math.random()*25,
    rot:Math.random()*7,seed:Math.random()*7,life:2.2,ml:2.2});
}
function spawnSpark(x,y){
  for(let i=0;i<6;i++){const a=Math.random()*7;
    P.push({type:'spark',x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90-60,life:0.5,ml:0.5});}
}
function spawnDust(){
  P.push({type:'dust',x:S.cx+(-40+Math.random()*80)*S.u,y:S.feetY+4*S.u,
    vx:-20-Math.random()*30,vy:-14-Math.random()*12,r:3,life:0.7,ml:0.7});
}
function spawnStreak(){
  P.push({type:'streak',x:W+60,y:lerp(S.horizonY+10,S.feetY-60*S.u,Math.random()),
    vx:-(S.speed*1.5+300),vy:0,life:1.2,ml:1.2});
}

/* ================= 交互动作 ================= */
function ringBell(){
  ac();
  S.bellRing=1;S.startle=1;S.flapBoost=1;S.hopT=1;
  S.speed=Math.min(S.speed+130,760);
  S.pouchWobV+=46;
  spawnFeather(7);
  ding();
  const b=document.getElementById('bellBtn');
  b.style.transform='scale(.9)';setTimeout(()=>b.style.transform='',120);
  if(Math.random()<0.55){S.bubbleT=0.9;S.bubble=BUBBLES[(Math.random()*BUBBLES.length)|0];}
}
function throwFish(){
  if(S.fishCD>0||S.fish.length>1)return;
  S.fishCD=0.7;ac();pop();
  const p=S.anch.pouchMid;
  S.fish.push({x:W*0.92,y:H*0.92,a:Math.atan2(p.y-H*0.92,p.x-W*0.92)-0.5,sp:560});
}
function landFish(tp){
  S.stamina=clamp(S.stamina+32,0,100);
  S.fishLump=1;S.happyT=1.6;S.gulpT=0.4;S.pouchWobV+=70;
  gulp();spawnSpark(tp.x,tp.y);
}

/* ================= 更新 ================= */
function update(dt){
  S.t+=dt;
  const k=1-Math.exp(-dt*2.2),TP=PAL[S.timeMode];
  for(const key in CP){const a=CP[key],b=TP[key];for(let i=0;i<3;i++)a[i]+=(b[i]-a[i])*k;}
  S.night+=(NIGHTS[S.timeMode]-S.night)*k;
  S.sunAmt+=(SUNA[S.timeMode]-S.sunAmt)*k;
  S.moonAmt+=(MOONA[S.timeMode]-S.moonAmt)*k;
  S.sunAlt+=(SUNY[S.timeMode]-S.sunAlt)*k;

  const tired=S.stamina<25;
  let target=S.baseSpeed*62;
  if(S.sprint&&S.stamina>1){target+=300;S.stamina=Math.max(0,S.stamina-19*dt);}
  else{S.stamina=Math.min(100,S.stamina+(tired?10:6.5)*dt);}
  if(tired)target=Math.min(target,230);
  S.speed+=(target-S.speed)*(1-Math.exp(-dt*1.9));
  if(S.speed<0.5&&target<0.5)S.speed=0;
  S.speedN=clamp(S.speed/700,0,1);
  S.dist+=S.speed*dt;

  const ra=clamp(S.speed/70,0,1);
  S.runAmt+=(ra-S.runAmt)*(1-Math.exp(-dt*5));
  S.phase+=dt*(S.speed/44);
  S.wheelA+=S.speed/(27*S.u)*dt;
  S.crankA+=S.speed/(27*S.u*2.4)*dt;

  S.flapBoost=Math.max(0,S.flapBoost-dt*0.9);
  S.flapAmp=clamp(0.22+S.runAmt*0.3+S.flapBoost*1.0+(S.sprint&&S.stamina>1?0.35:0),0,1.3);
  S.flapT+=dt*(2.0+S.runAmt*2.0+S.flapBoost*6.5);

  const drive=Math.sin(S.phase*2)*(26*S.runAmt)+Math.sin(S.t*2.2)*3;
  S.pouchWobV+=(-58*S.pouchWob-7*S.pouchWobV+drive*6)*dt;
  S.pouchWob+=S.pouchWobV*dt;

  S.startle=Math.max(0,S.startle-dt*0.9);
  S.bellRing=Math.max(0,S.bellRing-dt*1.1);
  S.fishLump=Math.max(0,S.fishLump-dt*0.4);
  S.happyT=Math.max(0,S.happyT-dt);
  S.gulpT=Math.max(0,S.gulpT-dt*2.2);
  S.bubbleT=Math.max(0,S.bubbleT-dt);
  S.fishCD=Math.max(0,S.fishCD-dt);
  if(S.hopT>0)S.hopT=Math.max(0,S.hopT-dt/0.55);
  S.blinkT-=dt;if(S.blinkT<-0.12)S.blinkT=2.4+Math.random()*2.6;

  if(S.bumpy&&S.runAmt>0.15){S.nextJolt-=dt;if(S.nextJolt<=0){S.jolt=1;S.nextJolt=0.25+Math.random()*0.6;}}
  S.jolt*=Math.exp(-dt*5);
  S.joltY=S.bumpy?(-S.jolt*9*Math.abs(Math.sin(S.t*40))-Math.sin(S.t*21)*1.4*S.runAmt)*S.u:0;

  const wl=(S.sprint&&S.stamina>1)?1:0;
  S.wheelie+=(wl-S.wheelie)*(1-Math.exp(-dt*4));

  if((S.sprint&&S.stamina>1)||S.stamina<30){S.sweatT-=dt;if(S.sweatT<=0){spawnSweat();S.sweatT=0.13+Math.random()*0.1;}}
  if(S.speed>340){S.streakT-=dt;if(S.streakT<=0){spawnStreak();S.streakT=0.05;}}
  if(S.bumpy&&S.runAmt>0.3){S.dustT-=dt;if(S.dustT<=0){spawnDust();S.dustT=0.12;}}
  if(S.runAmt>0.4&&Math.random()<dt*0.25)spawnFeather(1);

  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;
    if(p.life<=0){P.splice(i,1);continue;}
    if(p.type==='sweat'||p.type==='spark')p.vy+=640*dt;
    if(p.type==='feather'){p.vy=Math.min(p.vy+30*dt,46);p.rot+=Math.sin(S.t*6+p.seed)*0.06;p.x+=Math.sin(S.t*3+p.seed)*22*dt;}
    if(p.type==='dust')p.r+=26*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }

  for(let i=S.fish.length-1;i>=0;i--){const f=S.fish[i],tp=S.anch.pouchMid;
    const des=Math.atan2(tp.y-f.y,tp.x-f.x);let da=des-f.a;
    while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
    f.a+=clamp(da,-7*dt,7*dt);
    f.x+=Math.cos(f.a)*f.sp*dt;f.y+=Math.sin(f.a)*f.sp*dt;
    if(Math.hypot(tp.x-f.x,tp.y-f.y)<26*S.u){S.fish.splice(i,1);landFish(tp);}
  }

  for(const c of clouds){c.x-=(c.sp+S.speed*0.05)*dt;
    if(c.x<-220){c.x=W+220;c.y=(0.06+Math.random()*0.24)*H;c.s=0.6+Math.random()*0.9;}}

  if(windGain&&AC&&AC.state==='running')windGain.gain.value=Math.min(0.13,S.speed/700*0.13);

  stamFill.style.width=S.stamina.toFixed(1)+'%';
  stamFill.style.background=S.stamina<25?'linear-gradient(90deg,#f87171,#fbbf24)':'linear-gradient(90deg,#34d399,#b6e34d)';
  sprintBtn.disabled=S.stamina<=1;
  sprintBtn.classList.toggle('active',S.sprint&&S.stamina>1);
  let st=S.speed<40?'悠闲踱步':'稳健前行';
  if(S.sprint&&S.stamina>1)st='冲刺！！';
  if(S.stamina<25)st='气喘吁吁…';
  if(S.startle>0.4)st='受惊！嘎——';
  statusEl.textContent=st;
}

/* ================= 背景绘制 ================= */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,S.groundY);
  g.addColorStop(0,css(CP.skyT));g.addColorStop(1,css(CP.skyB));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawStars(){
  if(S.night<0.04)return;
  for(const s of stars){
    const a=S.night*(0.35+0.65*Math.abs(Math.sin(S.t*s.tw+s.ph)));
    ctx.fillStyle=`rgba(255,255,240,${a*0.9})`;
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();
  }
}
function drawSunMoon(){
  const sx=W*0.76;
  if(S.sunAmt>0.02){
    const sy=H*S.sunAlt;
    const g=ctx.createRadialGradient(sx,sy,4,sx,sy,130);
    g.addColorStop(0,rgba(CP.sun,0.5*S.sunAmt));g.addColorStop(1,rgba(CP.sun,0));
    ctx.fillStyle=g;ctx.fillRect(sx-130,sy-130,260,260);
    ctx.globalAlpha=S.sunAmt;ctx.fillStyle=css(CP.sun);
    ctx.beginPath();ctx.arc(sx,sy,30,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  if(S.moonAmt>0.02){
    const my=H*0.18;
    const g=ctx.createRadialGradient(sx,my,4,sx,my,110);
    g.addColorStop(0,`rgba(230,236,255,${0.4*S.moonAmt})`);g.addColorStop(1,'rgba(230,236,255,0)');
    ctx.fillStyle=g;ctx.fillRect(sx-110,my-110,220,220);
    ctx.globalAlpha=S.moonAmt;ctx.fillStyle='#f4f1de';
    ctx.beginPath();ctx.arc(sx,my,24,0,7);ctx.fill();
    ctx.fillStyle='rgba(160,160,150,.35)';
    ctx.beginPath();ctx.arc(sx-7,my-4,4.5,0,7);ctx.arc(sx+6,my+7,3.4,0,7);ctx.arc(sx+9,my-8,2.6,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
}
function drawClouds(){
  for(const c of clouds){
    ctx.fillStyle=rgba(CP.cloud,0.88);
    const s=c.s*S.u;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,34*s,13*s,0,0,7);
    ctx.ellipse(c.x-22*s,c.y+4*s,20*s,9*s,0,0,7);
    ctx.ellipse(c.x+24*s,c.y+5*s,22*s,10*s,0,0,7);
    ctx.fill();
  }
}
function drawLighthouse(hy){
  const lx=W+160-((S.dist*0.12)%(W+520));
  if(lx<-90||lx>W+170)return;
  const u=S.u*0.8;
  ctx.fillStyle='rgba(60,60,70,.9)';
  ctx.beginPath();ctx.ellipse(lx,hy+2,44*u,10*u,0,0,7);ctx.fill();
  ctx.fillStyle='#f2efe6';ctx.fillRect(lx-9*u,hy-64*u,18*u,64*u);
  ctx.fillStyle='#d84f3f';
  ctx.fillRect(lx-9*u,hy-50*u,18*u,10*u);
  ctx.fillRect(lx-9*u,hy-30*u,18*u,10*u);
  ctx.fillStyle='#3a3f46';ctx.fillRect(lx-7*u,hy-72*u,14*u,9*u);

  const fy=feet-lift;

  ctx.beginPath();ctx.moveTo(hx,hy);ctx.quadraticCurveTo(kx,ky,fx,fy-3*u);ctx.stroke();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(fx-3*u,fy-4*u);ctx.lineTo(fx+13*u,fy-4.5*u);ctx.lineTo(fx+16*u,fy+0.5*u);
  ctx.lineTo(fx+12*u,fy+4.5*u);ctx.lineTo(fx-2*u,fy+3*u);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,60,20,.35)';ctx.lineWidth=1.2*u;

}

  ctx.beginPath();ctx.moveTo(hx+10*u,hy+5*u);
  ctx.bezierCurveTo(hx+34*u,hy+10*u+sag*1.7,hx+64*u,hy+10*u+sag*1.6,hx+87*u,hy+8*u+beakDip);
  ctx.stroke();

  if(S.fishLump>0.35){

function drawBike(){
  const u=S.u,a=S.anch.back;

  const bx=a.x+2*u;
  const by=a.y-46*u+Math.sin(S.phase*2)*1.6*u*S.runAmt+S.joltY*1.15-S.wheelie*7*u+jig*0.4;
  const tilt=-0.02-S.speedN*0.05-S.wheelie*0.13+Math.sin(S.phase*2+0.6)*0.025*S.runAmt+S.joltY*0.004;

  const A={x:-46,y:0},B={x:46,y:0},C={x:-4,y:7},D={x:-20,y:-34},E={x:28,y:-36},F={x:34,y:-17};
  ctx.strokeStyle='#e04b45';ctx.lineWidth=4.4;ctx.lineCap='round';ctx.lineJoin='round';
  line(A,C);line(A,D);line(C,D);line(D,E);line(C,F);line(E,F);
  ctx.strokeStyle='#c93d38';line(F,B);

  ctx.strokeStyle='#3c4147';ctx.lineWidth=1.8;
  ctx.setLineDash([3,2.4]);ctx.lineDashOffset=-S.dist*0.4;
  line({x:C.x,y:C.y-7.5},{x:A.x,y:A.y-5});

  ctx.strokeStyle='#4b5056';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.arc(C.x,C.y,7.5,0,7);ctx.stroke();
  const ca=S.crankA;
  const p1={x:C.x+Math.cos(ca)*12,y:C.y+Math.sin(ca)*12};
  const p2={x:C.x-Math.cos(ca)*12,y:C.y-Math.sin(ca)*12};
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  ctx.fillStyle='#22262b';
  ctx.fillRect(p1.x-4,p1.y-1.6,8,3.2);ctx.fillRect(p2.x-4,p2.y-1.6,8,3.2);

  ctx.strokeStyle='#8a9096';ctx.lineWidth=3.4;line(D,{x:-23,y:-44});
  ctx.fillStyle='#503527';
  ctx.beginPath();ctx.moveTo(-36,-46);ctx.quadraticCurveTo(-27,-51,-16,-46);
  ctx.quadraticCurveTo(-26,-42.4,-36,-46);ctx.closePath();ctx.fill();

  // 车座上的小头盔——自行车的"脑袋"
  ctx.fillStyle='#e8452f';
  ctx.beginPath();ctx.arc(-27,-53,8,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(-28.4,-61,2.8,8);
  ctx.fillStyle='#b73424';ctx.fillRect(-35.5,-53.6,17,2.4);

  ctx.strokeStyle='#8a9096';ctx.lineWidth=3.6;line(E,{x:31,y:-46});
  ctx.beginPath();ctx.moveTo(31,-46);
  ctx.quadraticCurveTo(35,-55,24,-57.5);ctx.quadraticCurveTo(19,-58.4,17.5,-56);
  ctx.stroke();
  ctx.fillStyle='#22262b';ctx.beginPath();ctx.arc(17.5,-56,3,0,7);ctx.fill();

  ctx.save();ctx.translate(24,-52.5);ctx.rotate(Math.sin(S.t*46)*0.5*S.bellRing);
  ctx.fillStyle='#f2c14e';
  ctx.beginPath();ctx.arc(0,0,4.6,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c9962e';ctx.fillRect(-5.4,-0.6,10.8,1.8);
  ctx.restore();

  if(S.bellRing>0){
    for(let i=0;i<3;i++){
      ctx.strokeStyle=`rgba(255,230,150,${S.bellRing*(0.55-i*0.13)})`;
      ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(24,-52.5,(1-S.bellRing)*22+6+i*7,-2.4,-0.7);ctx.stroke();
    }
  }
  ctx.restore();

  S.bellXY=toWorld(24,-52.5);
  S.gripXY=toWorld(17.5,-56);
  S.helmetXY=toWorld(-27,-61);
}
function drawReins(){
  const g=S.gripXY,b=S.anch.beakBase,u=S.u;
  for(let i=0;i<2;i++){
    ctx.strokeStyle=i?'#8a5a35':'#6e452a';ctx.lineWidth=(2.2-i*0.5)*u;
    ctx.beginPath();ctx.moveTo(g.x,g.y+i*2*u);
    const mx=(g.x+b.x)/2,my=(g.y+b.y)/2+(12+i*6)*u+Math.sin(S.t*3.4+i*2)*3*u;
    ctx.quadraticCurveTo(mx,my,b.x,b.y+i*2*u);
    ctx.stroke();
  }
}
function drawBubble(){
  if(S.bubbleT<=0)return;
  const h=S.helmetXY,u=S.u,a=Math.min(1,S.bubbleT*2.5);
  ctx.save();ctx.globalAlpha=a;
  ctx.font=`bold ${15*u}px ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
  const w=ctx.measureText(S.bubble).width+20*u;
  const bx2=h.x+12*u,by2=h.y-52*u;
  ctx.fillStyle='rgba(255,255,255,.95)';rr(bx2,by2,w,26*u,10*u);ctx.fill();
  ctx.beginPath();ctx.moveTo(bx2+10*u,by2+26*u);ctx.lineTo(bx2+2*u,by2+34*u);
  ctx.lineTo(bx2+18*u,by2+26*u);ctx.closePath();ctx.fill();
  ctx.fillStyle='#333';ctx.textBaseline='middle';
  ctx.fillText(S.bubble,bx2+10*u,by2+13.5*u);
  ctx.restore();
}

/* ================= 鱼 & 粒子绘制 ================= */
function drawFishLayer(){
  const u=S.u;
  for(const f of S.fish){
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
    ctx.fillStyle='#a9cbe0';
    ctx.beginPath();ctx.ellipse(0,0,10*u,4.5*u,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-8*u,0);ctx.lineTo(-15*u,-5*u);ctx.lineTo(-15*u,5*u);ctx.closePath();ctx.fill();
    ctx.fillStyle='#20242a';ctx.beginPath();ctx.arc(5*u,-1*u,1.2*u,0,7);ctx.fill();
    ctx.restore();
  }
}
function drawParticles(back){
  const u=S.u;
  for(const p of P){
    if(back!==(p.type==='streak'))continue;
    const a=clamp(p.life/p.ml,0,1);
    if(p.type==='sweat'){
      ctx.fillStyle=`rgba(140,200,255,${a*0.9})`;
      ctx.beginPath();ctx.arc(p.x,p.y,3*u,0,7);ctx.fill();
      ctx.beginPath();ctx.moveTo(p.x-2.4*u,p.y);
      ctx.quadraticCurveTo(p.x,p.y-7*u,p.x+2.4*u,p.y);ctx.fill();
    }else if(p.type==='feather'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+Math.sin(S.t*4+p.seed)*0.5);
      ctx.fillStyle=`rgba(250,250,245,${a*0.9})`;
      ctx.beginPath();ctx.ellipse(0,0,6.5*u,2.4*u,0,0,7);ctx.fill();
      ctx.strokeStyle=`rgba(180,180,170,${a})`;ctx.lineWidth=0.8*u;
      ctx.beginPath();ctx.moveTo(-6*u,0);ctx.lineTo(6*u,0);ctx.stroke();
      ctx.restore();
    }else if(p.type==='spark'){
      ctx.strokeStyle=`rgba(255,215,120,${a})`;ctx.lineWidth=1.6*u;
      ctx.beginPath();ctx.moveTo(p.x-4*u,p.y);ctx.lineTo(p.x+4*u,p.y);
      ctx.moveTo(p.x,p.y-4*u);ctx.lineTo(p.x,p.y+4*u);ctx.stroke();
    }else if(p.type==='dust'){
      ctx.fillStyle=`rgba(120,110,100,${a*0.25})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }else if(p.type==='streak'){
      ctx.strokeStyle=`rgba(255,255,255,${a*0.3})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+40+S.speed*0.08,p.y);ctx.stroke();
    }
  }
}
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.45,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(5,8,20,0.28)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;
  dt=clamp(dt,0,0.05);
  update(dt);
  drawSky();drawStars();drawSunMoon();drawClouds();drawSea();
  drawBoardwalk();drawRailing();
  drawParticles(true);
  drawShadow();drawPelican();drawBike();drawReins();
  drawFishLayer();drawParticles(false);drawBubble();
  drawVignette();
  requestAnimationFrame(frame);
}

/* ================= 绑定 ================= */
const bellBtn=document.getElementById('bellBtn');
const sprintBtn=document.getElementById('sprintBtn');
const fishBtn=document.getElementById('fishBtn');
const timeBtn=document.getElementById('timeBtn');
const roadBtn=document.getElementById('roadBtn');
const spd=document.getElementById('spd');
const spdVal=document.getElementById('spdVal');
const stamFill=document.getElementById('stamFill');
const statusEl=document.getElementById('status');
const TIME_LABEL=['🌇 黄昏','🌙 夜晚','☀️ 白天'];

bellBtn.addEventListener('click',ringBell);
spd.addEventListener('input',()=>{S.baseSpeed=parseFloat(spd.value);spdVal.textContent=S.baseSpeed.toFixed(1);});
sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();ac();S.sprint=true;});
['pointerup','pointerleave','pointercancel'].forEach(ev=>sprintBtn.addEventListener(ev,()=>S.sprint=false));
fishBtn.addEventListener('click',throwFish);
timeBtn.addEventListener('click',()=>{S.timeMode=(S.timeMode+1)%3;timeBtn.textContent=TIME_LABEL[S.timeMode];});
roadBtn.addEventListener('click',()=>{
  S.bumpy=!S.bumpy;
  roadBtn.textContent=S.bumpy?'🪨 石子路':'🛣️ 平路';
  roadBtn.classList.toggle('active',S.bumpy);
});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();ac();S.sprint=true;}
  else if(e.code==='KeyB')ringBell();
  else if(e.code==='KeyF')throwFish();
  else if(e.code==='KeyT')timeBtn.click();
});
window.addEventListener('keyup',e=>{if(e.code==='Space')S.sprint=false;});
window.addEventListener('pointerdown',()=>ac(),{passive:true});
cv.addEventListener('pointerdown',e=>{
  const d=Math.hypot(e.clientX-S.bellXY.x,e.clientY-S.bellXY.y);
  if(d<32*S.u)ringBell();
});
cv.addEventListener('pointermove',e=>{
  const d=Math.hypot(e.clientX-S.bellXY.x,e.clientY-S.bellXY.y);
  cv.style.cursor=d<32*S.u?'pointer':'default';
});
window.addEventListener('resize',resize);

resize();
requestAnimationFrame(frame);
</script>
</body>
