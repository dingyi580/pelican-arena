<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>自行车骑鹈鹕</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    #container {
      position: relative;
      width: 800px;
      height: 600px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      border-radius: 10px;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
    }

    button {
      padding: 10px 15px;
      background-color: #FF9800;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #F57C00;
    }

    #speed-control {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    input[type="range"] {
      width: 120px;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 18px;
      background: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>
<body>
<div id="container">
  <canvas id="bgCanvas" width="800" height="600"></canvas>
  <canvas id="mainCanvas" width="800" height="600"></canvas>
  <div id="status">体力: <span id="energy">100</span>%</div>
  <div id="controls">
    <button id="bell-btn">🔔 按车铃</button>
    <button id="feed-btn">🐟 投喂小鱼</button>
  </div>
  <div id="speed-control">
    <label for="speed-slider">速度:</label>
    <input type="range" id="speed-slider" min="1" max="5" value="3">
  </div>
</div>

<script>
  const bgCanvas = document.getElementById('bgCanvas');
  const mainCanvas = document.getElementById('mainCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const ctx = mainCanvas.getContext('2d');

  // 状态管理
  let speed = 3;
  let energy = 100;
  let isSprinting = false;

  const statusElement = document.getElementById('energy');
  const bellBtn = document.getElementById('bell-btn');
  const feedBtn = document.getElementById('feed-btn');
  const speedSlider = document.getElementById('speed-slider');

  // 初始化背景
  function drawBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

    // 海边天空
    const gradient = bgCtx.createLinearGradient(0, 0, 0, bgCanvas.height);
    gradient.addColorStop(0, "#87CEEB");
    gradient.addColorStop(1, "#E0F7FA");
    bgCtx.fillStyle = gradient;
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    // 远山
    bgCtx.fillStyle = '#7CB342';
    bgCtx.beginPath();
    bgCtx.moveTo(0, 400);
    bgCtx.lineTo(100, 350);
    bgCtx.lineTo(200, 380);
    bgCtx.lineTo(300, 320);
    bgCtx.lineTo(400, 360);
    bgCtx.lineTo(500, 300);
    bgCtx.lineTo(600, 340);
    bgCtx.lineTo(700, 310);
    bgCtx.lineTo(800, 350);
    bgCtx.lineTo(800, 600);
    bgCtx.lineTo(0, 600);
    bgCtx.closePath();
    bgCtx.fill();

    // 海面
    bgCtx.fillStyle = '#4FC3F7';
    bgCtx.fillRect(0, 400, bgCanvas.width, 200);

    // 云朵
    bgCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    bgCtx.beginPath();
    bgCtx.arc(100, 100, 30, 0, Math.PI * 2);
    bgCtx.arc(130, 90, 35, 0, Math.PI * 2);
    bgCtx.arc(160, 100, 30, 0, Math.PI * 2);
    bgCtx.fill();

    bgCtx.beginPath();
    bgCtx.arc(600, 80, 25, 0, Math.PI * 2);
    bgCtx.arc(620, 70, 30, 0, Math.PI * 2);
    bgCtx.arc(640, 80, 25, 0, Math.PI * 2);
    bgCtx.fill();

    // 海滩木栈道
    bgCtx.fillStyle = '#8D6E63';
    bgCtx.fillRect(0, 550, bgCanvas.width, 50);
    for (let i = 0; i < 20; i++) {
      bgCtx.fillRect(i * 40, 550, 20, 10);
    }
  }

  // 鹈鹕类
  class Pelican {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.wingAngle = 0;
      this.wingDirection = 1;
      this.headBob = 0;
      this.headBobDir = 1;
      this.throatPuff = 0;
      this.throatPuffDir = 1;
      this.eyeBlink = false;
      this.eyeBlinkTimer = 0;
    }

    update() {
      this.wingAngle += 0.1 * speed;
      if (this.wingAngle > 0.5 || this.wingAngle < -0.5) this.wingDirection *= -1;
      this.wingAngle += this.wingDirection * 0.05;

      this.headBob += 0.05;
      if (this.headBob > 0.5 || this.headBob < -0.5) this.headBobDir *= -1;
      this.headBob += this.headBobDir * 0.02;

      this.throatPuff += 0.03;
      if (this.throatPuff > 0.3 || this.throatPuff < 0) this.throatPuffDir *= -1;
      this.throatPuff += this.throatPuffDir * 0.01;

      this.eyeBlinkTimer++;
      if (this.eyeBlinkTimer > 100) {
        this.eyeBlink = true;
        this.eyeBlinkTimer = 0;
      } else if (this.eyeBlinkTimer > 90) {
        this.eyeBlink = false;
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);

      // 身体
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0, 0, 80, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // 喉囊
      ctx.fillStyle = `rgba(255, ${150 + Math.sin(this.throatPuff)*50}, 150, 0.7)`;
      ctx.beginPath();
      ctx.ellipse(-20, 10, 40 + this.throatPuff*20, 30 + this.throatPuff*10, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头部
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(40, -10, 25, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // 喙
      ctx.fillStyle = '#FFA000';
      ctx.beginPath();
      ctx.moveTo(60, -5);
      ctx.lineTo(90, 0);
      ctx.lineTo(60, 5);
      ctx.closePath();
      ctx.fill();

      // 眼睛
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(50, -15, 3, 0, Math.PI * 2);
      ctx.fill();

      if (!this.eyeBlink) {
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(50, -15, 1, 0, Math.PI * 2);
        ctx.fill();
      }

      // 翅膀
      ctx.save();
      ctx.rotate(this.wingAngle);
      ctx.fillStyle = '#F5F5F5';
      ctx.beginPath();
      ctx.ellipse(-20, -10, 30, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 尾羽
      ctx.fillStyle = '#F5F5F5';
      ctx.beginPath();
      ctx.moveTo(-60, 0);
      ctx.lineTo(-80, -10);
      ctx.lineTo(-70, 0);
      ctx.lineTo(-80, 10);
      ctx.closePath();
      ctx.fill();

      // 脚
      ctx.fillStyle = '#FFA000';
      ctx.fillRect(-30, 30, 10, 20);
      ctx.fillRect(10, 30, 10, 20);

      ctx.restore();
    }
  }

  // 自行车类
  class Bicycle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = 0;
      this.chainRotation = 0;
      this.wheelRotation = 0;
      this.handlebarAngle = 0;
      this.handlebarDir = 1;
    }

    update(pelican) {
      this.wheelRotation += 0.2 * speed;
      this.chainRotation += 0.2 * speed;

      this.handlebarAngle += 0.05 * this.handlebarDir;
      if (this.handlebarAngle > 0.3 || this.handlebarAngle < -0.3) this.handlebarDir *= -1;

      // 车身倾斜
      this.angle = Math.sin(this.wheelRotation * 0.5) * 0.1;
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      // 车架
      ctx.strokeStyle = '#FF5722';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-40, 0); // 后轮中心
      ctx.lineTo(-20, -20); // 后叉
      ctx.lineTo(20, -20); // 前叉
      ctx.lineTo(40, 0); // 前轮中心
      ctx.stroke();

      // 前轮
      ctx.beginPath();
      ctx.arc(40, 0, 15, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(40 + Math.cos(angle) * 15, Math.sin(angle) * 15);
        ctx.lineTo(40 + Math.cos(angle) * 10, Math.sin(angle) * 10);
        ctx.stroke();
      }

      // 后轮
      ctx.beginPath();
      ctx.arc(-40, 0, 15, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(-40 + Math.cos(angle) * 15, Math.sin(angle) * 15);
        ctx.lineTo(-40 + Math.cos(angle) * 10, Math.sin(angle) * 10);
        ctx.stroke();
      }

      // 车座
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(0, -40);
      ctx.stroke();

      // 车把
      ctx.beginPath();
      ctx.moveTo(20, -20);
      ctx.lineTo(30, -30);
      ctx.lineTo(40, -20);
      ctx.stroke();

      // 脚踏
      ctx.save();
      ctx.rotate(this.chainRotation);
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(15, -20);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(15, -20, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 骑手（自行车上的小人）
      ctx.fillStyle = '#FF9800';
      ctx.beginPath();
      ctx.arc(0, -45, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#FF9800';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -40);
      ctx.lineTo(0, -30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-5, -30);
      ctx.lineTo(5, -30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(-5, -20);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(5, -20);
      ctx.stroke();

      ctx.restore();
    }
  }

  // 粒子系统
  class ParticleSystem {
    constructor() {
      this.particles = [];
    }

    addParticle(x, y, color) {
      this.particles.push({
        x,
        y,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        life: 30,
        color
      });
    }

    update() {
      for (let i = this.particles.length - 1; i >= 0; i--) {
        const p = this.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) {
          this.particles.splice(i, 1);
        }
      }
    }

    draw(ctx) {
      for (const p of this.particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 30;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  const pelican = new Pelican(400, 450);
  const bicycle = new Bicycle(400, 400);
  const particles = new ParticleSystem();

  // 音频合成
  function playBellSound() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.type = 'sine';
      oscillator.frequency.value = 800;
      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.2);
    } catch (e) {
      console.log("无法播放音效");
    }
  }

  // 动画循环
  function animate() {
    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

    pelican.update();
    bicycle.update(pelican);

    // 更新速度
    speed = parseInt(speedSlider.value);

    // 更新体力
    if (isSprinting) {
      energy -= 0.5;
    } else {
      energy += 0.1;
    }
    energy = Math.min(100, Math.max(0, energy));
    statusElement.textContent = Math.round(energy);

    // 绘制
    pelican.draw(ctx);
    bicycle.draw(ctx);

    // 粒子效果
    particles.update();
    particles.draw(ctx);

    requestAnimationFrame(animate);
  }

  // 事件绑定
  bellBtn.addEventListener('click', () => {
    playBellSound();
    particles.addParticle(400, 400, '#FFD700');
    particles.addParticle(400, 400, '#FFA500');
    pelican.throatPuff = 0.5;
    pelican.wingAngle = 0.5;
    pelican.wingDirection = -1;
  });

  feedBtn.addEventListener('click', () => {
    if (energy < 100) {
      energy = Math.min(100, energy + 20);
      statusElement.textContent = Math.round(energy);
      for (let i = 0; i < 10; i++) {
        particles.addParticle(400, 450, '#FFD700');
      }
    }
  });

  speedSlider.addEventListener('input', () => {
    speed = parseInt(speedSlider.value);
  });

  // 开始动画
  drawBackground();
  animate();
</script>
</body>
</html>
