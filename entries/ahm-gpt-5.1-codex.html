<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自行车骑鹈鹕 · Paradox Parade</title>
<style>
:root{
  --panel-bg: rgba(7,18,34,0.88);
  --accent: #ffce45;
  --teal: #5de1ff;
  --scene-height: 520px;
  font-synthesis: none;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family: "Segoe UI","PingFang SC",sans-serif;
  background: radial-gradient(circle at 20% 20%, #0b2740 0%, #030915 60%);
  color:#f2fbff;
  min-height:100vh;
  padding:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.app{
  width:min(1200px,100%);
  display:flex;
  flex-direction:column;
  gap:18px;
}
.scene{
  position:relative;
  height:var(--scene-height);
  border-radius:28px;
  overflow:hidden;
  background:#7fc8ff;
  box-shadow:0 30px 60px rgba(0,0,0,0.35);
  isolation:isolate;
  transition:filter 0.4s ease;
}
.scene.tired{filter:saturate(0.8) brightness(0.9);}
.scene.startled .pelican-head{transform:translateY(-5px);}
.layer{position:absolute; inset:0;}
.sky{
  background:linear-gradient(180deg,#93d6ff 0%,#d5f0ff 55%,#fbe2c7 100%);
}
.sun{
  position:absolute;
  width:120px;height:120px;
  border-radius:50%;
  background:radial-gradient(circle,#ffeb7a 0%,rgba(255,247,170,0.4)60%,rgba(255,255,255,0));
  top:40px; right:120px;
  box-shadow:0 0 80px rgba(255,238,122,0.6);
  opacity:0.8;
}
.cloud{
  position:absolute;
  background:#fff;
  width:180px; height:65px;
  border-radius:999px;
  filter:drop-shadow(0 10px 12px rgba(95,131,179,0.3));
  animation:cloud-drift 50s linear infinite;
  opacity:0.9;
}
.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#fff;
  border-radius:999px;
}
.cloud:before{width:120px;height:70px;left:30px;top:-30px;}
.cloud:after{width:90px;height:50px;left:90px;top:-15px;}
.cloud.c1{top:70px;left:5%;animation-duration:var(--d1,55s);}
.cloud.c2{top:120px;left:45%;animation-duration:var(--d2,60s);}
.cloud.c3{top:40px;left:70%;animation-duration:var(--d3,48s);}
@keyframes cloud-drift{
  0%{transform:translateX(-10%);}
  100%{transform:translateX(110%);}
}
.sea{
  position:absolute;
  left:-5%; width:110%;
  bottom:110px;
  height:160px;
  background:linear-gradient(180deg,#70c6ff 0%,#3b8fd2 60%,#2d6a9d 100%);
  animation:sea-shift 18s linear infinite;
}
.sea:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0.18) 0 40px,transparent 40px 80px);
  mix-blend-mode:screen;
  opacity:0.4;
  animation:sea-wave 8s ease-in-out infinite;
}
@keyframes sea-shift{
  0%{background-position:0 0;}
  100%{background-position:-300px 0;}
}
@keyframes sea-wave{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(6px);}
}
.boardwalk{
  position:absolute;
  bottom:0;
  height:120px;
  width:120%;
  left:-10%;
  background:repeating-linear-gradient(90deg,#8c5b32 0 100px,#7b4a26 100px 130px);
  box-shadow:inset 0 8px 20px rgba(0,0,0,0.4);
  animation:board-move 8s linear infinite;
}
.boardwalk:before{
  content:"";
  position:absolute;
  inset:10px 0 20px;
  background:repeating-linear-gradient(180deg,transparent 0 12px,rgba(0,0,0,0.08)12px 18px);
  opacity:0.5;
}
@keyframes board-move{
  0%{background-position:0 0;}
  100%{background-position:-500px 0;}
}
.feather-spray{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:4;
}
.feather{
  position:absolute;
  width:12px;height:28px;
  background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0));
  border-radius:50% 50% 50% 50%;
  opacity:0.8;
  animation:feather-fall 9s linear infinite;
}
@keyframes feather-fall{
  0%{transform:translateY(-20px) rotate(0deg); opacity:0;}
  10%{opacity:0.7;}
  50%{transform:translate(-30px,200px) rotate(140deg);}
  100%{transform:translate(20px,420px) rotate(320deg);opacity:0;}
}
.duo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
}
svg{width:100%;height:100%;}
.pelican-shadow{
  fill:rgba(0,0,0,0.1);
}
.pelican .body{
  fill:#fff8ef;
  stroke:#d6c9b9;
  stroke-width:2;
}
.pelican .belly{
  fill:#ffe9c8;
  opacity:0.8;
}
.pelican .wing{
  fill:#f5f0e6;
  stroke:#d0c0b1;
  stroke-width:2;
}
.pelican .tail{
  fill:#e8ddd0;
}
.pelican .neck{
  fill:#fff2db;
}
.pelican .head{
  fill:#fff8ef;
  stroke:#d6c9b9;
  stroke-width:2;
}
.beak-upper{fill:#f6c347;stroke:#d49c2a;stroke-width:2;}
.pouch{fill:#f4a94b;stroke:#d26f22;stroke-width:2;}
.eye-white{fill:#fff;}
.eye-pupil{fill:#1b2540;}
.pelican.tired .eye-pupil{cy:167;}
.pelican.tired .pouch{filter:brightness(0.9);}
.pelican .leg rect{fill:#f2b965;}
.pelican .foot{fill:#e58f2d;}
.pelican .leg{
  transform-box:fill-box;
  transform-origin:top center;
  animation:stride 0.9s linear infinite;
}
.pelican .leg.front{animation-direction:alternate;}
@keyframes stride{
  0%{transform:rotate(12deg);}
  50%{transform:rotate(-18deg);}
  100%{transform:rotate(12deg);}
}
.wing{
  transform-box:fill-box;
  transform-origin:20% 50%;
  animation:flap 1s ease-in-out infinite;
}
@keyframes flap{
  0%{transform:rotate(6deg);}
  50%{transform:rotate(-8deg);}
  100%{transform:rotate(6deg);}
}
.pelican .neck,
.pelican .body{animation:pelican-bob 1.2s ease-in-out infinite;}
@keyframes pelican-bob{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}
.pelican.fed .pouch{animation:gulp 1s ease-in-out;}
@keyframes gulp{
  0%{transform:scaleY(1);}
  40%{transform:scaleY(1.12);}
  100%{transform:scaleY(1);}
}
.rein{
  stroke:#d26f22;
  stroke-width:3;
  stroke-dasharray:8 6;
  fill:none;
}
.bike{
  animation:bike-bob 1s ease-in-out infinite;
  transform-origin:center;
}
@keyframes bike-bob{
  0%,100%{transform:translateY(-4px);}
  50%{transform:translateY(2px);}
}
.bike .frame{
  fill:none;
  stroke:#1b2847;
  stroke-width:6;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.bike .seat{fill:#1b2847;}
.bike .seat-post{stroke:#1b2847;stroke-width:6;}
.handlebar{stroke:#1b2847;stroke-width:6;stroke-linecap:round;fill:none;}
.handle-wrap{fill:#ffce45;stroke:#1b2847;stroke-width:2;}
.bike .wheel{
  transform-box:fill-box;
  transform-origin:center;
  animation:wheel-spin 3s linear infinite;
}
@keyframes wheel-spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
.wheel .tire{fill:none;stroke:#0d1b2f;stroke-width:10;}
.wheel .rim{fill:none;stroke:#3f5b80;stroke-width:4;}
.wheel .spokes{stroke:#4a6a96;stroke-width:2;}
.wheel .hub{fill:#ffce45;stroke:#1f2f4a;stroke-width:2;}
.pedal{
  transform-box:fill-box;
  transform-origin:280px 150px;
  animation:pedal-spin 1.4s linear infinite;
}
@keyframes pedal-spin{
  0%{transform:rotate(0);}
  100%{transform:rotate(-360deg);}
}
.pedal rect{fill:#ffaa2a;}
.chain{stroke:#1d2b45;stroke-width:5;fill:none;}
.bike.ringing{animation:shake 0.5s linear;}
@keyframes shake{
  0%,100%{transform:translate(0,0) rotate(0deg);}
  25%{transform:translate(3px,-2px) rotate(-1deg);}
  50%{transform:translate(-3px,2px) rotate(1deg);}
  75%{transform:translate(2px,-2px) rotate(-0.5deg);}
}
.scene.startled .pelican-head{animation:bob-head 0.6s ease;}
@keyframes bob-head{
  0%{transform:rotate(0);}
  50%{transform:rotate(-4deg);}
  100%{transform:rotate(0);}
}
.panel{
  background:var(--panel-bg);
  border-radius:20px;
  padding:20px 28px;
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  align-items:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.35);
}
.control{
  flex:1;
  min-width:220px;
}
.control h3{
  margin:0 0 6px;
  font-size:1rem;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:#96d7ff;
}
button{
  background:linear-gradient(120deg,#ffce45,#ff9d2f);
  border:none;
  border-radius:999px;
  padding:12px 24px;
  color:#201507;
  font-weight:600;
  cursor:pointer;
  font-size:1rem;
  box-shadow:0 8px 18px rgba(0,0,0,0.25);
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,0.3);}
button:active{transform:translateY(1px);}
input[type=range]{
  width:100%;
  accent-color:#ffcf4a;
}
.speed-readout{
  margin-top:6px;
  font-size:0.9rem;
  color:#cfe9ff;
  display:flex;
  gap:12px;
  justify-content:space-between;
}
.stamina-wrapper{
  margin-top:8px;
}
.stamina-bar{
  width:100%;
  height:14px;
  border-radius:999px;
  background:rgba(255,255,255,0.15);
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.2);
}
.stamina-bar .fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#65ffba,#2fe1ff);
  transition:width 0.2s ease, background 0.2s ease;
}
.status-line{
  margin-top:6px;
  font-size:0.85rem;
  color:#9ed8ff;
}
.hint{
  margin-top:6px;
  font-size:0.85rem;
  color:#ffdca6;
}
@media(max-width:900px){
  body{padding:12px;}
  .scene{height:420px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="scene" id="scene">
    <div class="sky layer"></div>
    <div class="sun"></div>
    <div class="cloud c1" data-base-duration="60" style="--d1:60s;"></div>
    <div class="cloud c2" data-base-duration="55" style="--d2:55s;"></div>
    <div class="cloud c3" data-base-duration="50" style="--d3:50s;"></div>
    <div class="sea" data-base-duration="18"></div>
    <div class="boardwalk" data-base-duration="8"></div>
    <div class="feather-spray">
      <span class="feather" style="left:12%;animation-delay:0s;"></span>
      <span class="feather" style="left:25%;animation-delay:1.2s;"></span>
      <span class="feather" style="left:40%;animation-delay:2.5s;"></span>
      <span class="feather" style="left:60%;animation-delay:0.8s;"></span>
      <span class="feather" style="left:75%;animation-delay:1.8s;"></span>
      <span class="feather" style="left:88%;animation-delay:3s;"></span>
    </div>
    <svg class="duo" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="pelican-shadow" cx="280" cy="340" rx="150" ry="35"/>
      <g class="pelican">
        <path class="tail" d="M140 235 C110 220 80 235 90 260 C105 300 170 300 180 280 Z"/>
        <ellipse class="body" cx="250" cy="240" rx="130" ry="70"/>
        <path class="belly" d="M140 245 Q250 320 360 245 Q340 310 250 310 Q160 300 140 245Z"/>
        <path class="wing" d="M150 220 Q100 270 150 305 Q210 340 290 315 Q250 270 245 225Z"/>
        <path class="neck" d="M300 210 Q330 145 380 135 Q430 128 450 160 Q430 180 405 215 Q385 240 330 250 Z"/>
        <circle class="head pelican-head" cx="390" cy="170" r="45"/>
        <path class="beak-upper" d="M405 175 L530 165 Q560 172 545 195 L405 195Z"/>
        <path class="pouch" d="M405 195 Q520 210 500 235 Q430 260 370 220 Z"/>
        <circle class="eye-white" cx="405" cy="160" r="14"/>
        <circle class="eye-pupil" cx="409" cy="160" r="6"/>
        <g class="leg back leg-back" data-base-duration="0.9">
          <g transform="translate(230 270)">
            <rect x="-6" y="0" width="12" height="60" rx="6"/>
            <rect x="-5" y="45" width="10" height="50" rx="5"/>
            <path class="foot" d="M-15 90 L30 90 L20 105 L-15 105Z"/>
          </g>
        </g>
        <g class="leg front" data-base-duration="0.9">
          <g transform="translate(290 270)">
            <rect x="-6" y="0" width="12" height="60" rx="6"/>
            <rect x="-5" y="45" width="10" height="50" rx="5"/>
            <path class="foot" d="M-15 90 L30 90 L20 105 L-15 105Z"/>
          </g>
        </g>
      </g>
      <g class="bike" id="bike">
        <path class="chain" d="M220 180 L345 180"/>
        <g class="wheel back-wheel" data-base-duration="3">
          <circle class="tire" cx="220" cy="190" r="55"/>
          <circle class="rim" cx="220" cy="190" r="42"/>
          <circle class="hub" cx="220" cy="190" r="10"/>
          <line class="spokes" x1="220" y1="148" x2="220" y2="232"/>
          <line class="spokes" x1="178" y1="190" x2="262" y2="190"/>
          <line class="spokes" x1="192" y1="162" x2="248" y2="218"/>
          <line class="spokes" x1="248" y1="162" x2="192" y2="218"/>
        </g>
        <g class="wheel front-wheel" data-base-duration="3">
          <circle class="tire" cx="360" cy="190" r="55"/>
          <circle class="rim" cx="360" cy="190" r="42"/>
          <circle class="hub" cx="360" cy="190" r="10"/>
          <line class="spokes" x1="360" y1="148" x2="360" y2="232"/>
          <line class="spokes" x1="318" y1="190" x2="402" y2="190"/>
          <line class="spokes" x1="334" y1="164" x2="386" y2="216"/>
          <line class="spokes" x1="386" y1="164" x2="334" y2="216"/>
        </g>
        <path class="frame" d="M220 190 L270 110 L330 110 L360 190 L220 190 L320 190 L280 155 L330 110"/>
        <rect class="seat" x="250" y="85" width="50" height="12" rx="6"/>
        <line class="seat-post" x1="275" y1="97" x2="280" y2="140"/>
        <path class="handlebar" d="M330 110 Q360 80 390 90"/>
        <rect class="handle-wrap" x="382" y="84" width="14" height="12" rx="6"/>
        <circle class="hub pedal-core" cx="280" cy="190" r="14" fill="#ffd36a" stroke="#1e283f" stroke-width="4"/>
        <g class="pedal" data-base-duration="1.4">
          <rect x="274" y="188" width="50" height="6" rx="4"/>
          <rect x="256" y="188" width="20" height="6" rx="3"/>
        </g>
        <path class="rein" d="M388 90 Q420 140 430 180"/>
      </g>
    </svg>
  </div>

  <div class="panel">
    <div class="control">
      <h3>车铃惊叹</h3>
      <button id="bellBtn">🔔 按下车铃</button>
      <p class="hint">清脆铃声 → 鹈鹕小冲刺！</p>
    </div>
    <div class="control">
      <h3>速度调节</h3>
      <input type="range" id="speedRange" min="0.6" max="2.2" step="0.1" value="1.0">
      <div class="speed-readout">
        <span>基础：<strong id="baseSpeedLabel">1.0x</strong></span>
        <span>实际：<strong id="actualSpeedLabel">1.0x</strong></span>
      </div>
      <p class="status-line" id="statusText">鹈鹕状态：精神饱满！</p>
    </div>
    <div class="control">
      <h3>投喂小鱼</h3>
      <button id="feedBtn">🐟 喂一条鱼</button>
      <div class="stamina-wrapper">
        <div class="stamina-bar">
          <div class="fill" id="staminaFill"></div>
        </div>
        <p class="hint">体力不足？用鱼补充能量。</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const scene = document.getElementById('scene');
  const pelican = document.querySelector('.pelican');
  const bike = document.getElementById('bike');
  const bellBtn = document.getElementById('bellBtn');
  const feedBtn = document.getElementById('feedBtn');
  const speedRange = document.getElementById('speedRange');
  const baseSpeedLabel = document.getElementById('baseSpeedLabel');
  const actualSpeedLabel = document.getElementById('actualSpeedLabel');
  const staminaFill = document.getElementById('staminaFill');
  const statusText = document.getElementById('statusText');

  const speedTargets = document.querySelectorAll('[data-base-duration]');
  const feathers = document.querySelectorAll('.feather');
  feathers.forEach((f, i) => f.style.animationDuration = (7 + i) + 's');

  let baseSpeed = parseFloat(speedRange.value);
  let stamina = 100;
  let sprintTimer = 0;
  const sprintDuration = 1.3;
  let lastTime = null;
  let effectiveSpeed = 1;
  let prevSpeedSignature = 0;

  function setBaseSpeed(value){
    baseSpeed = value;
    baseSpeedLabel.textContent = value.toFixed(1) + 'x';
  }
  setBaseSpeed(baseSpeed);
  speedRange.addEventListener('input', e => setBaseSpeed(parseFloat(e.target.value)));

  let audioCtx = null;
  function playBell(){
    if(!audioCtx){
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtx();
    }
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1400, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.6);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.7);
  }

  function ringBell(){
    playBell();
    sprintTimer = sprintDuration;
    bike.classList.add('ringing');
    scene.classList.add('startled');
    setTimeout(() => bike.classList.remove('ringing'), 600);
    setTimeout(() => scene.classList.remove('startled'), 600);
  }
  bellBtn.addEventListener('click', ringBell);

  function feedPelican(){
    stamina = Math.min(100, stamina + 28);
    pelican.classList.add('fed');
    setTimeout(() => pelican.classList.remove('fed'), 1200);
  }
  feedBtn.addEventListener('click', feedPelican);

  function updateDurations(speed){
    const signature = Math.round(speed * 100);
    if(signature === prevSpeedSignature) return;
    prevSpeedSignature = signature;
    speedTargets.forEach(el => {
      const base = parseFloat(el.dataset.baseDuration);
      const min = el.dataset.minDuration ? parseFloat(el.dataset.minDuration) : 0.25;
      const adjusted = Math.max(base / (speed + 0.2), min);
      el.style.animationDuration = adjusted + 's';
    });
  }

  function updateStaminaIndicator(){
    staminaFill.style.width = stamina + '%';
    const hue = 100 * (stamina / 100);
    staminaFill.style.background = `linear-gradient(90deg, hsl(${hue},80%,60%), #32d6ff)`;
    if(stamina > 70){
      statusText.textContent = '鹈鹕状态：精神饱满！';
    }else if(stamina > 40){
      statusText.textContent = '鹈鹕状态：稍微喘气但还能冲！';
    }else if(stamina > 20){
      statusText.textContent = '鹈鹕状态：累了，考虑投喂。';
    }else{
      statusText.textContent = '鹈鹕状态：极度疲惫，快喂鱼！';
    }
    if(stamina < 25){
      scene.classList.add('tired');
      pelican.classList.add('tired');
    }else{
      scene.classList.remove('tired');
      pelican.classList.remove('tired');
    }
  }

  function tick(timestamp){
    if(!lastTime) lastTime = timestamp;
    const delta = (timestamp - lastTime)/1000;
    lastTime = timestamp;

    if(sprintTimer > 0){
      sprintTimer -= delta;
      if(sprintTimer < 0) sprintTimer = 0;
    }
    const sprintBoost = sprintTimer > 0 ? 0.8 * (sprintTimer / sprintDuration) : 0;
    const targetSpeed = baseSpeed + sprintBoost;
    const drain = delta * (0.35 + targetSpeed * 0.55);
    const passiveRegen = delta * 0.18;
    stamina += passiveRegen - drain;
    stamina = Math.max(0, Math.min(100, stamina));

    const fatigue = 0.55 + (stamina / 100) * 0.45;
    effectiveSpeed = Math.max(0.3, targetSpeed * fatigue);
    actualSpeedLabel.textContent = effectiveSpeed.toFixed(2) + 'x';

    updateDurations(effectiveSpeed);
    updateStaminaIndicator();

    requestAnimationFrame(tick);
  }
  updateStaminaIndicator();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
