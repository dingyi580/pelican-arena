<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  :root{ --ink:#2A3E50; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0d1522; }
  body{ font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; }
  #stage{ display:block; width:100vw; height:100vh; }

  .brand{ position:fixed; left:28px; top:22px; pointer-events:none; color:var(--ink); transition:color .8s; z-index:5; }
  .brand .overline{ font-size:10px; letter-spacing:4px; opacity:.62; margin-bottom:8px; }
  .brand h1{ font:700 34px/1 'Kaiti SC','STKaiti','KaiTi','Georgia',serif; letter-spacing:4px; margin:0; }
  .brand .sub{ font-size:12.5px; opacity:.78; margin:10px 0 0; max-width:330px; line-height:1.7; }
  .brand .keys{ font-size:10.5px; opacity:.5; margin-top:9px; letter-spacing:1.5px; }

  #badge{ position:fixed; right:24px; top:22px; display:flex; align-items:center; gap:8px; padding:8px 15px;
    border-radius:99px; background:rgba(15,20,32,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.10); color:#F1EDE2; font-size:12px; letter-spacing:1.5px; z-index:5; }
  #dot{ width:8px; height:8px; border-radius:50%; background:#7FBF6A; transition:background .4s; }
  #odo{ position:fixed; right:24px; top:64px; font-size:11px; letter-spacing:1.5px; color:var(--ink);
    opacity:.72; transition:color .8s; z-index:5; }

  #toast{ position:fixed; left:50%; top:86px; transform:translate(-50%,-10px); padding:10px 22px; border-radius:99px;
    background:rgba(15,20,32,.78); backdrop-filter:blur(8px); color:#F1EDE4; font-size:13px; letter-spacing:1.5px;
    border:1px solid rgba(255,255,255,.12); opacity:0; transition:opacity .35s, transform .35s; pointer-events:none; z-index:9; }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  .dock{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:13px; align-items:center;
    padding:11px 18px; background:rgba(15,20,32,.66); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.10); border-radius:20px; box-shadow:0 14px 44px rgba(8,12,24,.4);
    flex-wrap:wrap; justify-content:center; max-width:min(96vw,900px); z-index:6; }
  .btn{ display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.06); color:#F1EDE2;
    border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:8px 13px; font-size:12.5px;
    letter-spacing:1px; cursor:pointer; transition:background .18s, transform .12s; font-family:inherit; }
  .btn:hover{ background:rgba(255,255,255,.13); }
  .btn:active{ transform:scale(.95); }
  .btn.active{ background:rgba(240,180,90,.22); border-color:rgba(240,180,90,.5); }
  .btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; flex:none; }
  .btn.ring svg{ animation:ringShake .32s ease; }
  @keyframes ringShake{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-16deg)} 55%{transform:rotate(14deg)} 80%{transform:rotate(-8deg)} }
  .sep{ width:1px; height:22px; background:rgba(255,255,255,.12); }
  .lb{ font-size:11px; color:rgba(241,237,226,.68); letter-spacing:1px; }
  .sld{ display:flex; align-items:center; gap:9px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:118px; height:4px; border-radius:99px;
    background:rgba(255,255,255,.18); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:#F1EDE2; border:none; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%; background:#F1EDE2; border:none; }
  .meter{ display:flex; align-items:center; gap:9px; }
  .mtrack{ width:106px; height:8px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  #mFill{ height:100%; width:100%; border-radius:99px; background:#7FBF6A; transition:width .25s, background .4s; }
  .seg{ display:flex; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.11); border-radius:12px; overflow:hidden; }
  .seg button{ border:0; background:transparent; color:rgba(241,237,226,.72); padding:8px 13px; font-size:12px;
    letter-spacing:1px; cursor:pointer; transition:.18s; font-family:inherit; }
  .seg button.on{ background:rgba(241,237,226,.92); color:#1F2739; font-weight:600; }

  @media (max-width:820px){
    .brand h1{ font-size:24px; } .brand .sub{ max-width:220px; font-size:11px; }
    .dock{ gap:8px; padding:9px 10px; } .btn span{ display:none; } .btn{ padding:8px 10px; }
    .lb{ display:none; } .sep{ display:none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="brand">
  <div class="overline">FIELD RECORD · NO.07 · 滨海纪实</div>
  <h1>自行车骑鹈鹕</h1>
  <p class="sub">请注意主谓关系：是一辆结构完好的自行车，正驾驭一只濒临崩溃的鹈鹕。车在上方，鸟在下方，谁也没画反。</p>
  <p class="keys">空格 按铃 · S 按住冲刺 · F 投喂小鱼 · 1/2/3 切时段</p>
</header>

<div id="badge"><span id="dot"></span><span id="badgeText">精神抖擞</span></div>
<div id="odo">已狂奔 0 m</div>
<div id="toast"></div>

<div class="dock">
  <button class="btn" id="bBell" title="按车铃（空格）">
    <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 1 7 7v4l2 3H3l2-3v-4a7 7 0 0 1 7-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    <span>按铃</span></button>
  <button class="btn" id="bSprint" title="按住冲刺（S）">
    <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 5 13h5l-2 9 9-12h-6z"/></svg>
    <span>冲刺</span></button>
  <button class="btn" id="bFeed" title="投喂小鱼（F）">
    <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12q7-7 14-1l4-3v8l-4-3q-7 6-14-1z"/><circle cx="8.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/></svg>
    <span>投喂</span></button>
  <div class="sep"></div>
  <label class="sld"><span class="lb">速度</span><input id="rSpeed" type="range" min="0" max="100" value="50"></label>
  <div class="meter"><span class="lb">体力</span><div class="mtrack"><div id="mFill"></div></div></div>
  <div class="sep"></div>
  <div class="seg" id="segTime">
    <button data-v="0" class="on">晴</button><button data-v="1">暮</button><button data-v="2">夜</button>
  </div>
  <div class="seg" id="segRoad">
    <button data-v="0" class="on">栈道</button><button data-v="1">石子路</button>
  </div>
</div>

<script>
'use strict';
/* ===================== 工具 ===================== */
const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const md = (a,n)=> ((a % n) + n) % n;          // 恒正取模
const srnd = i => { const x = Math.sin(i*127.1+13.7)*43758.5453; return x - Math.floor(x); };

/* ===================== 画布 ===================== */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, sc=1, VW=920;
const DH=720, HORIZON=374, SANDTOP=476, GROUND=561;
function anchorX(){ return clamp(VW*0.42, 240, 640); }
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  sc = clamp(Math.min(H/DH, W/920), 0.45, 1.35);
  VW = W/sc;
}
window.addEventListener('resize', resize);

/* ===================== 主题调色板 ===================== */
const RAW = [
{ skyTop:'#6FB4D6', skyBot:'#E8F4E4', sunCore:'#FFD98E', sunGlow:'#FFF2C4', seaDeep:'#2E7F98', seaLight:'#79C6B8',
  seaGlint:'#EAFBEF', seaFoam:'#FFFFFF', sail:'#F6F1E2', sand:'#F1E2BE', deco:'#E4D6AF', board:'#C9955F',
  boardLine:'#A97847', boardEdge:'#8D6238', grassBg:'#7FAB66', cloud:'#FFFFFF', silh:'#3E5871', ink:'#2A3E50',
  pelBody:'#F7F2E5', pelShade:'#E3DAC5', pelWing:'#EFE8D6', pelWingEdge:'#CBC1A8', beak:'#F0A93B', pouch:'#F0A48E',
  pouchDark:'#D3765C', leg:'#E8944A', legDark:'#C1762F', bikeFrame:'#C8503C', tire:'#31353E', rim:'#EFE2C6',
  sunH:0.42, sunR:24 },
{ skyTop:'#96607C', skyBot:'#F5C98B', sunCore:'#FF8C4A', sunGlow:'#FFC98F', seaDeep:'#3E5872', seaLight:'#CE9457',
  seaGlint:'#FFD089', seaFoam:'#FFE4BE', sail:'#F2CFA0', sand:'#E2BE8E', deco:'#D3B489', board:'#AA744A',
  boardLine:'#8A5A36', boardEdge:'#6E4526', grassBg:'#8C7C49', cloud:'#FFCF9E', silh:'#5C3E50', ink:'#46283A',
  pelBody:'#F3E7D3', pelShade:'#DECBA9', pelWing:'#D9C6A9', pelWingEdge:'#B79F7C', beak:'#E59A3F', pouch:'#DE8B72',
  pouchDark:'#C07157', leg:'#D07E3A', legDark:'#A65C2A', bikeFrame:'#A8453B', tire:'#3A3038', rim:'#E8CBA0',
  sunH:1.06, sunR:33 },
{ skyTop:'#0F1A33', skyBot:'#33517A', sunCore:'#FF8C4A', sunGlow:'#FFC98F', seaDeep:'#0C2440', seaLight:'#1D4766',
  seaGlint:'#9FC2E8', seaFoam:'#8FA8CC', sail:'#2A3B58', sand:'#3A4A62', deco:'#54678A', board:'#574838',
  boardLine:'#443626', boardEdge:'#32281B', grassBg:'#2E4A42', cloud:'#2C3E5C', silh:'#22344E', ink:'#BCCAE2',
  pelBody:'#ADB8CA', pelShade:'#8E9BB2', pelWing:'#BEC8D8', pelWingEdge:'#8794AA', beak:'#C09055', pouch:'#A98790',
  pouchDark:'#7C5F6E', leg:'#9A7B52', legDark:'#7B5E3C', bikeFrame:'#77383A', tire:'#1F242F', rim:'#9AA3B5',
  sunH:1.7, sunR:33 }
];
const THEMES = RAW.map(o=>{
  const t = {};
  for(const k in o){ const v = o[k];
    if(typeof v === 'number') t[k] = v;
    else t[k] = [parseInt(v.slice(1,3),16), parseInt(v.slice(3,5),16), parseInt(v.slice(5,7),16)];
  }
  return t;
});
const PKEYS = Object.keys(THEMES[0]);
function mixPal(a,b,f){
  const o = {};
  for(const k of PKEYS){
    const A = THEMES[a][k], B = THEMES[b][k];
    o[k] = typeof A === 'number'
      ? A + (B-A)*f
      : `rgb(${(A[0]+(B[0]-A[0])*f)|0},${(A[1]+(B[1]-A[1])*f)|0},${(A[2]+(B[2]-A[2])*f)|0})`;
  }
  return o;
}
let P = mixPal(0,0,0);       // 当前帧调色板
let W3 = {d:1,k:0,n:0};      // 三主题权重

/* ===================== 全局状态 ===================== */
const S = {
  t:0, offset:0, dist:0,
  speed:3.6, boost:0, slider:0.5, effSpeed:3.6, speedNorm:0.4,
  stamina:100, exLatched:false, wasLatched:false,
  panic:0, happy:0, jaw:0.02, blinkPel:2.5, blinkBike:3, bikeHappy:0,
  sprint:false, catchT:0, bulge:0,
  theme:0, themeTarget:0, road:0, roadT:0,
  phase:0, flapPhase:0,
  py:0, pvy:0, wob:0, wobv:0,
  by:0, bvy:0, bp:0, bpv:0, prevSaddle:0,
  bell:0, shake:0, chainOff:0, crankA:0, wheelA:0,
  sweatT:0, puffT:0, hudT:0,
  pose:null, feed:[]
};
const parts = [];
const stars = []; for(let i=0;i<70;i++) stars.push({x:Math.random()*1400, y:Math.random()*330, r:0.6+Math.random()*1.3, ph:Math.random()*TAU});
const clouds = []; for(let i=0;i<5;i++) clouds.push({x0:200+i*430+Math.random()*160, y:56+Math.random()*140, s:0.7+Math.random()*0.7, p:0.05+Math.random()*0.09});
const gullDefs = [{x0:180,y:206,s:1},{x0:820,y:168,s:0.8}];
const boats = [{x0:320,y:HORIZON+11,s:1},{x0:1350,y:HORIZON+22,s:0.72}];

/* ===================== 音频（纯合成） ===================== */
let AC = null, noiseB = null;
function ac(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function getNoise(a){
  if(noiseB) return noiseB;
  noiseB = a.createBuffer(1, a.sampleRate*0.6|0, a.sampleRate);
  const d = noiseB.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return noiseB;
}
function sfxBell(){
  const a = ac(); if(!a) return; const t0 = a.currentTime;
  [0,0.09,0.19].forEach((d,i)=>{
    const g = a.createGain(); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, t0+d);
    g.gain.exponentialRampToValueAtTime(i===2?0.3:0.2, t0+d+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+d+0.55);
    [2489,3130,4190].forEach((f,k)=>{
      const o = a.createOscillator(); o.type='sine'; o.frequency.value = f*(1+i*0.003);
      const og = a.createGain(); og.gain.value = 0.55/(k+1);
      o.connect(og); og.connect(g); o.start(t0+d); o.stop(t0+d+0.6);
    });
  });
}
function sfxSquawk(){
  if(!AC || AC.state!=='running') return; const a = AC, t0 = a.currentTime;
  const o = a.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(740, t0);
  o.frequency.exponentialRampToValueAtTime(290, t0+0.22);
  const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900; f.Q.value=2.2;
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.26, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.26);
  o.connect(f); f.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+0.3);
}
function sfxWhoosh(){
  const a = ac(); if(!a) return; const t0 = a.currentTime;
  const src = a.createBufferSource(); src.buffer = getNoise(a);
  const f = a.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(300, t0);
  f.frequency.exponentialRampToValueAtTime(1500, t0+0.35);
  f.frequency.exponentialRampToValueAtTime(400, t0+0.8);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.2, t0+0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.85);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t0+0.9);
}
function sfxPlop(){
  const a = ac(); if(!a) return; const t0 = a.currentTime;
  const o = a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(420, t0);
  o.frequency.exponentialRampToValueAtTime(880, t0+0.1);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.14);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+0.16);
}
function sfxGulp(){
  if(!AC || AC.state!=='running') return; const a = AC, t0 = a.currentTime;
  [0,0.13].forEach((d,i)=>{
    const o = a.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(i?520:380, t0+d);
    o.frequency.exponentialRampToValueAtTime(i?150:210, t0+d+0.09);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t0+d);
    g.gain.exponentialRampToValueAtTime(0.24, t0+d+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+d+0.1);
    o.connect(g); g.connect(a.destination); o.start(t0+d); o.stop(t0+d+0.12);
  });
}

/* ===================== UI ===================== */
const $ = id => document.getElementById(id);
const toastEl = $('toast'); let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2400);
}
function setTheme(i){
  let diff = ((i - (S.theme % 3)) % 3 + 3) % 3;
  if(diff > 1.5) diff -= 3;
  S.themeTarget = S.theme + diff;
  [...$('segTime').children].forEach(b => b.classList.toggle('on', +b.dataset.v === i));
  showToast(['晴空万里，羽毛蓬松','夕阳熔金，适合兜风','夜色温柔，车灯已开'][i]);
}
function setRoad(i){
  S.roadT = i;
  [...$('segRoad').children].forEach(b => b.classList.toggle('on', +b.dataset.v === i));
  showToast(i ? '换成颠簸的石子路——坐稳了！' : '回到平整的滨海栈道');
}
function doBell(){
  ac();
  S.bell = 1; S.panic = Math.max(S.panic, 1.6);
  S.boost = Math.min(S.boost + 3.4, 6.5);
  S.shake = Math.max(S.shake, 0.3);
  S.bikeHappy = 0.9;
  for(let i=0;i<3;i++) spawnFeather(S.pose.hx-20+Math.random()*24, S.pose.hy+10+Math.random()*20);
  sfxBell(); sfxSquawk();
  showToast('叮铃铃——嘎！！');
  const b = $('bBell'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
  b.blur();
}
function doFeed(){
  ac();
  if(S.feed.length >= 4) return;
  S.feed.push({x0: VW*0.88, y0: 150 + Math.random()*50, p:0, seed: Math.random()*10});
  sfxPlop();
  showToast('小鱼来喽——');
}
function setSprint(on){
  if(on && !S.sprint){
    if(S.exLatched || S.stamina < 8){ showToast('跑不动了…先投条鱼吧'); return; }
    S.sprint = true; sfxWhoosh(); $('bSprint').classList.add('active');
  } else if(!on && S.sprint){
    S.sprint = false; $('bSprint').classList.remove('active');
  }
}
$('bBell').addEventListener('click', ()=>{ if(S.pose) doBell(); });
$('bFeed').addEventListener('click', doFeed);
$('bSprint').addEventListener('pointerdown', e => { e.preventDefault(); setSprint(true); });
window.addEventListener('pointerup', ()=> setSprint(false));
$('bSprint').addEventListener('pointerleave', ()=> setSprint(false));
$('rSpeed').addEventListener('input', e => { S.slider = e.target.value/100; });
$('segTime').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; ac(); setTheme(+b.dataset.v);
});
$('segRoad').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return; ac(); setRoad(+b.dataset.v);
});
window.addEventListener('keydown', e => {
  if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat && S.pose) doBell(); }
  else if(e.key === 'f' || e.key === 'F'){ if(!e.repeat) doFeed(); }
  else if(e.key === 's' || e.key === 'S'){ if(!e.repeat) setSprint(true); }
  else if(e.key === '1') setTheme(0); else if(e.key === '2') setTheme(1); else if(e.key === '3') setTheme(2);
});
window.addEventListener('keyup', e => { if(e.key === 's' || e.key === 'S') setSprint(false); });
/* 彩蛋：点击海面起涟漪 / 点击地面扬沙 */
cv.addEventListener('pointerdown', e => {
  ac();
  const wx = e.clientX/sc, wy = e.clientY/sc;
  if(wy > HORIZON+6 && wy < SANDTOP-4){
    for(let i=0;i<3;i++) parts.push({kind:'ripple', x:wx, y:wy, r:4+i*7, life:0, max:0.9+i*0.1, seed:i});
  } else if(wy > GROUND){
    for(let i=0;i<8;i++) parts.push({kind:'dust', x:wx+(Math.random()-0.5)*20, y:wy, vx:(Math.random()-0.5)*60, vy:-30-Math.random()*60, r:2+Math.random()*3, life:0, max:0.8, seed:Math.random()*9});
  }
});

/* ===================== 粒子 ===================== */
function spawnFeather(x,y){ parts.push({kind:'feather', x, y, vx:20+Math.random()*30, vy:-10-Math.random()*20, rot:Math.random()*TAU, vr:(Math.random()-0.5)*4, life:0, max:2.2+Math.random()*1.4, seed:Math.random()*10}); }
function spawnSweat(x,y){ parts.push({kind:'sweat', x, y, vx:40+Math.random()*60, vy:-90-Math.random()*70, r:2.4, life:0, max:0.9, seed:0}); }
function spawnPuff(x,y){ parts.push({kind:'puff', x, y, r:5+Math.random()*3, life:0, max:0.9, seed:Math.random()*9}); }
function spawnBubble(x,y){ parts.push({kind:'bubble', x, y, r:2+Math.random()*2.5, life:0, max:0.8, seed:Math.random()*9}); }

function updateParts(dt){
  const world = S.effSpeed*46;
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life += dt;
    if(p.life > p.max){ parts.splice(i,1); continue; }
    if(p.kind === 'feather'){
      p.vy += (14 - p.vy)*dt*2.2;
      p.vx += (-world*0.7 - p.vx)*dt*1.6;
      p.x += (p.vx + Math.sin(p.life*5+p.seed)*24)*dt;
      p.y += p.vy*dt; p.rot += p.vr*dt; p.vr *= (1-dt*1.5);
    } else if(p.kind === 'sweat'){
      p.vy += 560*dt; p.x += (p.vx - world*0.5)*dt; p.y += p.vy*dt;
    } else if(p.kind === 'dust'){
      p.vy += 150*dt; p.x += (p.vx - world*0.9)*dt; p.y += p.vy*dt; p.r += 6*dt;
    } else if(p.kind === 'puff'){
      p.r += 14*dt; p.y -= 8*dt; p.x -= world*0.35*dt;
    } else if(p.kind === 'ripple'){
      p.r += 95*dt;
    } else if(p.kind === 'bubble'){
      p.y -= 45*dt; p.x -= world*0.4*dt + Math.sin(p.life*9+p.seed)*0.5;
    }
  }
}
function drawParts(){
  for(const p of parts){
    const k = 1 - p.life/p.max;
    if(p.kind === 'feather'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k*2)*0.9; ctx.fillStyle = P.pelBody;
      ctx.beginPath(); ctx.ellipse(0,0,9,3.2,0,0,TAU); ctx.fill();
      ctx.strokeStyle = P.pelWingEdge; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
      ctx.restore(); ctx.globalAlpha = 1;
    } else if(p.kind === 'sweat'){
      ctx.globalAlpha = Math.min(1,k*2.5)*0.85; ctx.fillStyle = '#9FD4E8';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
    } else if(p.kind === 'dust'){
      ctx.globalAlpha = k*0.4; ctx.fillStyle = '#CDB98F';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
    } else if(p.kind === 'puff'){
      ctx.globalAlpha = k*0.28; ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
    } else if(p.kind === 'ripple'){
      ctx.globalAlpha = k*0.5; ctx.strokeStyle = P.seaFoam; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r,p.r*0.32,0,0,TAU); ctx.stroke(); ctx.globalAlpha = 1;
    } else if(p.kind === 'bubble'){
      ctx.globalAlpha = k*0.6; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

/* ===================== 姿态计算 ===================== */
function computePose(){
  const spdN = S.speedNorm;
  const sway = Math.sin(S.phase*TAU)*2.5*spdN;
  const bob = Math.sin(S.phase*TAU)*(3+spdN*4);
  const cx = anchorX() + sway;
  const cy = GROUND - 78 + bob + S.py;
  const exF = S.exLatched?1:0, tiredF = (S.stamina<32 && !exF)?1:0;
  const tilt = -0.04 - spdN*0.05 - (S.sprint?0.06:0) + exF*0.06 + Math.sin(S.phase*TAU+1.3)*0.02*spdN;
  const neckDrop = exF*26 + tiredF*12 - (S.panic>0?7:0);
  const neckFwd = 88 + spdN*8 + S.panic*12 - exF*6;
  const hx = cx + neckFwd, hy = cy - 54 + neckDrop;
  const beakA = (S.panic>0?-0.13:0) + exF*0.3 + tiredF*0.08 + Math.sin(S.phase*TAU)*0.015*spdN;
  const bl = 62;
  const p = {
    cx, cy, tilt, hx, hy, beakA,
    tipX: hx + Math.cos(beakA)*bl, tipY: hy + Math.sin(beakA)*bl,
    exF, tiredF,
    shoulder: {x: cx+4, y: cy-20},
    saddle: {x: cx+2, y: cy-38},
    h1: {x: cx+10, y: cy+26}, h2: {x: cx-14, y: cy+26}
  };
  S.pose = p;
  return p;
}
function bikeWorld(lx,ly){
  const p = S.pose;
  const rot = S.bp + Math.sin(S.t*72)*0.028*S.bell;
  const bx = p.saddle.x, by = p.saddle.y - 3 + S.by;
  const c = Math.cos(rot), s = Math.sin(rot);
  return {x: bx + lx*c - ly*s, y: by + lx*s + ly*c};
}

/* ===================== 更新 ===================== */
function stepFire(){
  const p = S.pose;
  if(Math.random() < S.road*0.55*Math.min(1, S.speedNorm*1.4)){
    S.pvy -= 90 + Math.random()*130;         // 石子路颠簸冲击
    S.wobv += (Math.random()-0.5)*40;
    S.shake = Math.max(S.shake, 0.14);
    if(Math.random()<0.8) for(let i=0;i<3;i++)
      parts.push({kind:'dust', x:p.cx-20-Math.random()*30, y:GROUND-2, vx:-20-Math.random()*40, vy:-40-Math.random()*50, r:2+Math.random()*3, life:0, max:0.8, seed:Math.random()*9});
  }
  if(Math.random() < 0.05 + (S.panic>0?0.22:0) + (S.sprint?0.08:0))
    spawnFeather(p.shoulder.x + (Math.random()-0.5)*30, p.shoulder.y + Math.random()*30);
}
function update(dt){
  S.t += dt;
  /* 主题过渡（最短路径） */
  const tdiff = S.themeTarget - S.theme;
  if(Math.abs(tdiff) > 0.0001){
    S.theme += clamp(tdiff, -dt*1.1, dt*1.1);
    if(Math.abs(S.themeTarget - S.theme) < 0.002){
      S.theme = S.themeTarget;
      if(S.theme >= 3){ S.theme -= 3; S.themeTarget -= 3; }
      if(S.theme < 0){ S.theme += 3; S.themeTarget += 3; }
    }
  }
  S.road += clamp(S.roadT - S.road, -dt*1.4, dt*1.4);

  /* 体力循环 */
  const sprintOn = S.sprint && !S.exLatched && S.stamina > 8;
  if(S.exLatched){
    S.stamina += dt*4.2;
    if(S.stamina >= 30){ S.exLatched = false; showToast('缓过来了，重新出发！'); }
  } else {
    S.stamina -= dt*(0.8 + S.speedNorm*2 + (sprintOn?8:0) + (S.panic>0?2:0));
    if(S.stamina <= 0){
      S.stamina = 0; S.exLatched = true; S.sprint = false; $('bSprint').classList.remove('active');
      showToast('鹈鹕累趴了…快按「投喂」给条鱼'); sfxSquawk();
    }
  }
  const tired = S.stamina < 32 || S.exLatched;

  /* 速度 */
  let base = 2 + S.slider*6;
  if(S.exLatched) base = Math.min(base, 1.0);
  let tgt = base * (sprintOn ? 1.65 : 1);
  if(sprintOn) tgt += 1.4;
  if(S.panic > 0) tgt += 1.2;
  S.boost *= Math.exp(-dt*1.8);
  S.speed += (tgt - S.speed)*(1 - Math.exp(-dt*2.1));
  S.effSpeed = Math.max(0.35, S.speed + S.boost);
  S.speedNorm = clamp((S.effSpeed-0.5)/8, 0, 1.15);

  /* 计时器 */
  S.panic = Math.max(0, S.panic - dt);
  S.happy = Math.max(0, S.happy - dt);
  S.catchT = Math.max(0, S.catchT - dt);
  S.bell = Math.max(0, S.bell - dt*2.4);
  S.shake *= Math.exp(-dt*5);
  S.bulge *= Math.exp(-dt*2.2);
  S.bikeHappy = Math.max(0, S.bikeHappy - dt);
  S.blinkPel -= dt; if(S.blinkPel < -0.12) S.blinkPel = 2.4 + Math.random()*3;
  S.blinkBike -= dt; if(S.blinkBike < -0.12) S.blinkBike = 2.6 + Math.random()*3.4;

  /* 步伐与滚动 */
  const stepF = 1.5 + S.speedNorm*2.3 + (S.panic>0?1.1:0);
  const prevPh = S.phase;
  S.phase += stepF*dt;
  S.flapPhase += dt*(1.6 + S.speedNorm*4 + (S.panic>0?4:0) + (sprintOn?2:0));
  if(Math.floor(S.phase*2) !== Math.floor(prevPh*2)) stepFire();

  S.offset += S.effSpeed*dt*46;
  S.dist += S.effSpeed*dt*1.9;
  S.wheelA += S.effSpeed/31*dt*46*0.02;
  S.crankA += S.effSpeed*dt*(sprintOn?4.4:2.6);
  S.chainOff -= S.effSpeed*dt*7;

  /* 身体（颠簸弹簧）与喉囊（滞后摆） */
  S.pvy += (-160*S.py - 13*S.pvy)*dt;
  S.py = clamp(S.py + S.pvy*dt, -60, 60);
  S.wobv += (-30*S.wob - 3*S.wobv - S.pvy*0.16)*dt;
  S.wob = clamp(S.wob + S.wobv*dt, -12, 12);

  /* 姿态 */
  const p = computePose();

  /* 自行车弹簧（挂在鞍点上的惯性体） */
  const saddleY = p.saddle.y;
  const rawAcc = (saddleY - S.prevSaddle)/dt;
  S.prevSaddle = saddleY;
  S.saddleAcc = lerp(S.saddleAcc, rawAcc, Math.min(1, dt*18));
  S.bvy += (-230*S.by - 14*S.bvy - S.saddleAcc*0.85)*dt;
  S.by = clamp(S.by + S.bvy*dt, -26, 26);
  const pTgt = (sprintOn?-0.13:0) + (S.panic>0?-0.07:0) + Math.sin(S.phase*TAU+0.9)*0.055*S.speedNorm + S.speedNorm*0.02 + (S.exLatched?0.05:0);
  S.bpv += (-170*(S.bp-pTgt) - 13*S.bpv)*dt;
  S.bp += S.bpv*dt;

  /* 鹈鹕嘴部状态 */
  const pant = tired ? (0.32 + 0.22*Math.sin(S.t*(S.exLatched?7:4.5))) : 0.02;
  const jt = Math.max(pant, S.catchT>0?0.8:0, S.panic>1.1?0.55:0, S.happy>1.6?0.3:0);
  S.jaw += (jt - S.jaw)*Math.min(1, dt*10);

  /* 汗珠与喘气 */
  if(tired || sprintOn){
    S.sweatT -= dt;
    if(S.sweatT <= 0){ S.sweatT = sprintOn?0.16:0.3; spawnSweat(p.hx-16, p.hy-8); }
  }
  if(tired){
    S.puffT -= dt;
    if(S.puffT <= 0){ S.puffT = 0.38; spawnPuff(p.tipX-4, p.tipY+6); }
  }

  /* 飞行的鱼 */
  for(let i=S.feed.length-1;i>=0;i--){
    const f = S.feed[i];
    f.p = Math.min(1, f.p + dt*1.05);
    if(f.p >= 1){
      S.stamina = clamp(S.stamina + 26, 0, 100);
      S.happy = 2.4; S.catchT = 0.5; S.bulge = 1;
      sfxGulp();
      for(let k=0;k<3;k++) spawnBubble(p.tipX-8+k*8, p.tipY-6-k*6);
      showToast(['咕嘟！体力 +26','好鲜美，再来一条也不介意','鹈鹕很满意这次投喂'][ (Math.random()*3)|0 ]);
      S.feed.splice(i,1);
    }
  }

  updateParts(dt);

  /* HUD 节流更新 */
  S.hudT -= dt;
  if(S.hudT <= 0){
    S.hudT = 0.25;
    const mf = $('mFill');
    mf.style.width = S.stamina + '%';
    mf.style.background = S.stamina>60 ? '#7FBF6A' : (S.stamina>30 ? '#E0A33C' : '#E4674F');
    let st='精神抖擞', col='#7FBF6A';
    if(S.panic>0){ st='惊慌失措'; col='#E4674F'; }
    else if(S.exLatched){ st='累趴了…'; col='#8E9AA8'; }
    else if(tired){ st='气喘吁吁'; col='#E0A33C'; }
    else if(S.happy>0){ st='心满意足'; col='#7FBF6A'; }
    else if(sprintOn){ st='火力全开'; col='#E0783C'; }
    $('badgeText').textContent = st; $('dot').style.background = col;
    const m = S.dist|0;
    $('odo').textContent = '已狂奔 ' + (m<1000 ? m+' m' : (m/1000).toFixed(1)+' km');
    const T = ((S.theme%3)+3)%3;
    document.documentElement.style.setProperty('--ink', P.ink || '#2A3E50');
    let dark = '#2A3E50';
    if(T>0.5 && T<1.5) dark='#46283A'; else if(T>=1.5) dark='#BCCAE2';
    document.documentElement.style.setProperty('--ink', dark);
  }
}

/* ===================== 背景 ===================== */
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0, P.skyTop); g.addColorStop(1, P.skyBot);
  ctx.fillStyle = g; ctx.fillRect(-8,-8,VW+16,HORIZON+10);

  if(W3.n > 0.02){                                     // 星星
    ctx.fillStyle = '#EAF0FA';
    for(const st of stars){
      const a = W3.n*(0.35+0.65*(0.5+0.5*Math.sin(S.t*1.8+st.ph)));
      ctx.globalAlpha = a;
      const x = md(st.x - S.offset*0.02, VW+200)-100;
      ctx.beginPath(); ctx.arc(x, st.y, st.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  const sunA = clamp(W3.d + W3.k, 0, 1);               // 太阳
  if(sunA > 0.01 && P.sunH < 1.55){
    const sx = VW*0.72 - md(S.offset*0.012, 4000)*0 + 0;   // 近似固定
    const sy = HORIZON*P.sunH, r = P.sunR;
    const gl = ctx.createRadialGradient(sx,sy,r*0.4, sx,sy,r*4);
    gl.addColorStop(0, P.sunGlow); gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = sunA*0.5; ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(sx,sy,r*4,0,TAU); ctx.fill();
    ctx.globalAlpha = sunA; ctx.fillStyle = P.sunCore;
    ctx.beginPath(); ctx.arc(sx,sy,r,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
  }
  if(W3.n > 0.02){                                     // 月亮
    const mx = VW*0.26, my = 138;
    ctx.globalAlpha = W3.n;
    const gl = ctx.createRadialGradient(mx,my,10, mx,my,70);
    gl.addColorStop(0,'rgba(230,240,255,.35)'); gl.addColorStop(1,'rgba(230,240,255,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(mx,my,70,0,TAU); ctx.fill();
    ctx.fillStyle = '#EAF0FA'; ctx.beginPath(); ctx.arc(mx,my,21,0,TAU); ctx.fill();
    ctx.fillStyle = P.skyTop; ctx.beginPath(); ctx.arc(mx+9,my-5,19,0,TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for(const c of clouds){                              // 云
    const x = md(c.x0 - S.offset*c.p, VW+520) - 260;
    ctx.globalAlpha = 0.88; ctx.fillStyle = P.cloud;
    ctx.beginPath();
    ctx.ellipse(x, c.y, 42*c.s, 15*c.s, 0, 0, TAU);
    ctx.ellipse(x+34*c.s, c.y+4, 29*c.s, 11*c.s, 0, 0, TAU);
    ctx.ellipse(x-30*c.s, c.y+6, 25*c.s, 10*c.s, 0, 0, TAU);
    ctx.fill(); ctx.globalAlpha = 1;
  }
  const ga = (1-W3.n*0.85);                            // 海鸥
  if(ga > 0.05){
    ctx.strokeStyle = P.silh; ctx.lineWidth = 2; ctx.lineCap='round';
    gullDefs.forEach((g,i)=>{
      const gx = md(g.x0 - S.offset*0.18, 1700) - 200;
      const gy2 = g.y + Math.sin(S.t*0.9+i*2)*7;
      const fl = Math.sin(S.t*7+i*3)*0.6;
      ctx.globalAlpha = ga*0.7;
      ctx.beginPath();
      ctx.moveTo(gx-10*g.s, gy2);
      ctx.quadraticCurveTo(gx-4*g.s, gy2-(4+fl*6)*g.s, gx, gy2);
      ctx.quadraticCurveTo(gx+4*g.s, gy2-(4+fl*6)*g.s, gx+10*g.s, gy2);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
}
function drawLighthouse(){
  const x = md(1150 - S.offset*0.045, 1900) - 220;
  const y = HORIZON+1;
  ctx.fillStyle = P.silh; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(x-48,y+2);
  ctx.quadraticCurveTo(x-22,y-15, x,y-13);
  ctx.quadraticCurveTo(x+26,y-11, x+52,y+2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x-9,y-12); ctx.lineTo(x-5,y-50); ctx.lineTo(x+5,y-50); ctx.lineTo(x+9,y-12); ctx.closePath(); ctx.fill();
  ctx.fillRect(x-8, y-56, 16, 6);
  const lampA = W3.k*0.7 + W3.n;
  if(lampA > 0.08){
    const tw = lampA*(0.6+0.4*Math.sin(S.t*1.3));
    ctx.globalAlpha = tw*0.4;
    const gl = ctx.createRadialGradient(x,y-52,1, x,y-52,10);
    gl.addColorStop(0,'#FFD98A'); gl.addColorStop(1,'rgba(255,217,138,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x,y-52,10,0,TAU); ctx.fill();
    ctx.globalAlpha = tw; ctx.fillStyle = '#FFD98A';
    ctx.beginPath(); ctx.arc(x,y-52,2.2,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawSea(){
  const g = ctx.createLinearGradient(0,HORIZON,0,SANDTOP);
  g.addColorStop(0, P.seaDeep); g.addColorStop(1, P.seaLight);
  ctx.fillStyle = g; ctx.fillRect(-8, HORIZON, VW+16, SANDTOP-HORIZON);
  ctx.globalAlpha = 0.5; ctx.strokeStyle = P.seaGlint;                 // 海平线微光
  ctx.beginPath(); ctx.moveTo(0,HORIZON+0.5); ctx.lineTo(VW,HORIZON+0.5); ctx.stroke();
  ctx.globalAlpha = 1;
  /* 闪浪 */
  ctx.strokeStyle = P.seaGlint; ctx.lineWidth = 2.2; ctx.lineCap='round';
  for(let i=0;i<42;i++){
    const x = md(i*173 - S.offset*0.25, VW+260)-130;
    const y = HORIZON+12 + srnd(i)*82;
    ctx.globalAlpha = (0.12+0.2*srnd(i+3))*(0.6+0.4*Math.sin(S.t*2+i));
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+14+srnd(i+5)*22, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  /* 帆船 */
  for(const b of boats){
    const x = md(b.x0 - S.offset*0.12, 1900) - 220;
    const y = b.y + Math.sin(S.t*1.4+b.x0)*1.6;
    ctx.fillStyle = P.sail; ctx.globalAlpha = 0.95;
    ctx.beginPath(); ctx.moveTo(x-14*b.s,y); ctx.lineTo(x+14*b.s,y); ctx.lineTo(x+9*b.s,y+6*b.s); ctx.lineTo(x-9*b.s,y+6*b.s); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.silh;
    ctx.beginPath(); ctx.moveTo(x-2*b.s,y); ctx.lineTo(x-2*b.s,y-21*b.s); ctx.lineTo(x-13*b.s,y-2*b.s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+3*b.s,y); ctx.lineTo(x+3*b.s,y-16*b.s); ctx.lineTo(x+11*b.s,y-2*b.s); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* 晨昏落日 / 夜月光倒影柱 */
  const duskGlint = W3.k*(P.sunH>0.9?0.55:0.2), nightGlint = W3.n*0.45;
  if(duskGlint > 0.02 || nightGlint > 0.02){
    const px = W3.k>W3.n ? VW*0.72 : VW*0.26;
    ctx.fillStyle = W3.k>W3.n ? P.sunCore : P.seaGlint;
    for(let y=HORIZON+6; y<SANDTOP-4; y+=7){
      const t2 = (y-HORIZON)/100;
      const w2 = (34*(1-t2)+6) * (0.7+0.5*Math.sin(S.t*3+y));
      ctx.globalAlpha = (duskGlint+nightGlint)*(1-t2)*0.5;
      ctx.fillRect(px-w2/2, y, w2, 3);
    }
    ctx.globalAlpha = 1;
  }
  /* 岸边泡沫线 */
  ctx.strokeStyle = P.seaFoam; ctx.lineWidth = 2.6; ctx.lineCap='round';
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  for(let x=-20; x<VW+20; x+=14){
    const y = SANDTOP + Math.sin((x+S.offset*0.9)*0.02)*3;
    x===-20 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.globalAlpha = 0.35; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let x=-20; x<VW+20; x+=14){

function drawSand(){

function drawForeground(){

/* ===================== 鹈鹕 ===================== */
function legCycle(p, stride, lift){
  p -= Math.floor(p);
  if(p < 0.5){
    const q = p*2, e = q*q*(3-2*q);
    return {x:(e-0.5)*stride, y:-Math.sin(q*Math.PI)*lift, ang:0.85};
  }
  const q = (p-0.5)*2;
  return {x:(0.5-q)*stride, y:0, ang:0};
}
function drawLeg(hx,hy,fx,fy,ang,col){
  const L1=24, L2=27;
  let dx=fx-hx, dy=fy-hy, d=Math.hypot(dx,dy)||0.001;
  const maxL = L1+L2-0.2;
  if(d > maxL){ const k = maxL/d; dx*=k; dy*=k; d = maxL; fx = hx+dx; fy = hy+dy; }
  const a = (L1*L1-L2*L2+d*d)/(2*d);
  const h = Math.max(0, Math.sqrt(L1*L1-a*a));
  const ux = dx/d, uy = dy/d;
  const kx = hx+ux*a - uy*h, ky = hy+uy*a + ux*h;      // 踝关节向后
  ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(hx,hy); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
  ctx.save(); ctx.translate(fx,fy); ctx.rotate(ang);  // 蹼足
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(2,-2);
  ctx.quadraticCurveTo(15,1,17,5);
  ctx.quadraticCurveTo(7,9,-8,7);
  ctx.quadraticCurveTo(-4,3,2,-2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function wing(sx,sy,ang,open,scale,col,edge){
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang); ctx.scale(scale,scale);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(6,-12);
  ctx.quadraticCurveTo(-28,-16,-52,-2);
  ctx.quadraticCurveTo(-64,4,-70,14);
  const sp = 6+open*10;
  ctx.quadraticCurveTo(-58,20+open*sp*0.4,-46,22);
  ctx.quadraticCurveTo(-18,22,-2,16);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = 1.8; ctx.globalAlpha = 0.65;   // 覆羽分界
  ctx.beginPath(); ctx.moveTo(2,5); ctx.quadraticCurveTo(-24,4,-46,12); ctx.stroke();
  ctx.globalAlpha = 1;
  if(open > 0.12){                                    // 展开的初级飞羽
    const n = Math.round(2+open*4);
    ctx.lineWidth = 2;
    for(let i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(-40-i*6, 12+i*1.5);
      ctx.quadraticCurveTo(-54-i*7, 26+i*3, -68-i*9, 18+i*8);
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawPelican(){
  const p = S.pose, spdN = S.speedNorm;
  const stride = (26+spdN*30)*(p.exF?0.55:1);
  const lift = (9+spdN*9)*((p.tiredF||p.exF)?0.8:1);

  /* 远侧腿 */
  let r = legCycle(S.phase+0.5, stride, lift);
  drawLeg(p.h2.x, p.h2.y, p.h2.x+r.x, GROUND+r.y, r.ang, P.legDark);
  /* 远侧翅膀 */
  const flapV = Math.sin(S.flapPhase*TAU);
  const exF = p.exF, tiredF = p.tiredF;
  let open = clamp(0.22+spdN*0.55+(S.panic>0?0.45:0)+(S.sprint?0.35:0),0,1)*(1-exF*0.8-tiredF*0.35);
  const wAng = -0.08 - flapV*(0.18+open*0.5) + exF*0.55 + tiredF*0.22;
  wing(p.shoulder.x-2, p.shoulder.y+3, wAng*0.85+0.04, open*0.8, 0.85, P.pelShade, P.pelWingEdge);

  ctx.fillStyle = P.pelWing;
  for(let k=-1;k<=1;k++){
    ctx.beginPath(); ctx.moveTo(0,2+k*4);
    ctx.quadraticCurveTo(-18,4+k*7,-33,-5+k*11);
    ctx.quadraticCurveTo(-15,9+k*3,0,2+k*4); ctx.fill();
  }
  ctx.restore();

  /* 身体 */
  ctx.save(); ctx.translate(p.cx, p.cy); ctx.rotate(p.tilt);
  ctx.fillStyle = P.pelBody;
  ctx.beginPath(); ctx.ellipse(0,0,54,40,0,0,TAU); ctx.fill();
  ctx.fillStyle = P.pelShade; ctx.globalAlpha = 0.55;   // 腹部阴影
  ctx.beginPath(); ctx.ellipse(4,18,44,20,0,0,TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  /* 肚带 */
  ctx.strokeStyle = '#7A4A2B'; ctx.lineWidth = 7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p.cx-14, p.cy-30);
  ctx.quadraticCurveTo(p.cx-40, p.cy+8, p.cx-8, p.cy+36); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.cx-18, p.cy-26);
  ctx.quadraticCurveTo(p.cx-41, p.cy+6, p.cx-12, p.cy+32); ctx.stroke();

  /* 近侧腿 */
  r = legCycle(S.phase, stride, lift);
  drawLeg(p.h1.x, p.h1.y, p.h1.x+r.x, GROUND+r.y, r.ang, P.leg);

  /* 脖子 */
  ctx.strokeStyle = P.pelBody; ctx.lineWidth = 20; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p.cx+30, p.cy-14);
  ctx.quadraticCurveTo((p.cx+p.hx)/2+8, Math.min(p.cy,p.hy)-24, p.hx, p.hy);
  ctx.stroke();

  /* 喉囊（喙端随张嘴旋转，胸端固定 → 张嘴时自然拉开） */
  const ja = p.beakA + S.jaw*0.5;
  const cA = Math.cos(ja), sA = Math.sin(ja);
  const bpt = (lx,ly)=> [p.hx+lx*cA-ly*sA, p.hy+lx*sA+ly*cA];
  const root = bpt(-2,7), mid = bpt(26,9), tip = bpt(60,3);
  const chest = [p.cx+34, p.cy+12];
  const sag = 8 + spdN*4 + S.wob - S.bulge*7;
  const bw2 = S.bulge*12;
  ctx.fillStyle = P.pouch;
  ctx.beginPath(); ctx.moveTo(root[0], root[1]);
  ctx.quadraticCurveTo(mid[0], mid[1]+2, tip[0], tip[1]);
  ctx.quadraticCurveTo((tip[0]+chest[0])/2+8+bw2, (tip[1]+chest[1])/2+sag, chest[0], chest[1]);
  ctx.quadraticCurveTo(p.cx+16, p.cy+8+sag*0.9, root[0], root[1]);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = P.pouchDark; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;   // 囊底暗线
  ctx.beginPath();
  ctx.moveTo(tip[0], tip[1]);
  ctx.quadraticCurveTo((tip[0]+chest[0])/2+8+bw2, (tip[1]+chest[1])/2+sag, chest[0], chest[1]);
  ctx.stroke(); ctx.globalAlpha = 1;

  /* 上喙 */
  ctx.save(); ctx.translate(p.hx,p.hy); ctx.rotate(p.beakA);
  ctx.fillStyle = P.beak;
  ctx.beginPath(); ctx.moveTo(-3,-9);
  ctx.quadraticCurveTo(30,-8,60,-2);
  ctx.lineTo(62,0);
  ctx.quadraticCurveTo(28,4,-3,5);

  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.quadraticCurveTo(30,-7.5,56,-2.5); ctx.stroke();
  /* 衔铁带与衔环 */
  ctx.strokeStyle = '#5B4634'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(30,-9); ctx.lineTo(30,6); ctx.stroke();
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(30,9,3.2,0,TAU); ctx.stroke();
  /* 舌头 */
  if(S.jaw > 0.35){
    ctx.fillStyle = P.pouchDark;
    ctx.beginPath(); ctx.ellipse(20,13,7,3.4,0.3,0,TAU); ctx.fill();
  }
  ctx.restore();

  /* 头与冠羽 */
  ctx.fillStyle = P.pelBody;
  ctx.beginPath(); ctx.arc(p.hx,p.hy,15,0,TAU); ctx.fill();

  }
  /* 眼睛（表情） */
  const ex = p.hx+6, ey = p.hy-5;
  if(S.panic > 0){
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(ex,ey,6.5,0,TAU); ctx.fill();
    ctx.fillStyle = '#1E242E'; ctx.beginPath(); ctx.arc(ex+2,ey-2,2.4,0,TAU); ctx.fill();
    ctx.strokeStyle = '#1E242E'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(ex-8,ey-10); ctx.lineTo(ex+7,ey-13); ctx.stroke();
  } else if(S.happy > 1.4){
    ctx.strokeStyle = '#1E242E'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.arc(ex,ey+2,5,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
  } else {
    const lid = S.blinkPel < 0.12 ? 1 : (p.exF?0.62:(p.tiredF?0.34:0));
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(ex,ey,5.4,0,TAU); ctx.fill();
    ctx.fillStyle = '#1E242E';
    ctx.beginPath(); ctx.arc(ex+1.6,ey-0.4+(lid>0.4?1.2:0),2.8,0,TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(ex+2.6,ey-1.6,0.9,0,TAU); ctx.fill();
    if(lid > 0){
      ctx.fillStyle = P.pelBody;
      ctx.beginPath(); ctx.arc(ex,ey,6.6,Math.PI,TAU); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#1E242E'; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ex,ey,6.2,Math.PI*(1.02+ (1-lid)*0.05),Math.PI*(1.98-(1-lid)*0.4)); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  /* 近侧翅膀 */
  wing(p.shoulder.x, p.shoulder.y, wAng, open, 1, P.pelWing, P.pelWingEdge);

  /* 皮鞍 */
  ctx.save(); ctx.translate(p.saddle.x, p.saddle.y+8); ctx.rotate(p.tilt);
  ctx.fillStyle = '#7A4A2B';
  ctx.beginPath(); ctx.moveTo(-28,2);
  ctx.quadraticCurveTo(0,-13,28,2);
  ctx.quadraticCurveTo(0,9,-28,2); ctx.fill();
  ctx.strokeStyle = '#5E3720'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-28,2); ctx.quadraticCurveTo(0,-13,28,2); ctx.stroke();
  ctx.restore();
}

/* ===================== 自行车 ===================== */
function drawWheel(x,y,a){
  ctx.save(); ctx.translate(x,y);
  const spdN = S.speedNorm;
  if(spdN > 0.4){                                     // 高速转动模糊环
    ctx.globalAlpha = 0.1*spdN; ctx.fillStyle = '#8A93A4';
    ctx.beginPath(); ctx.arc(0,0,29,0,TAU); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = P.tire; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(0,0,31,0,TAU); ctx.stroke();
  ctx.strokeStyle = P.rim; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0,0,27,0,TAU); ctx.stroke();
  const sa = clamp(1.1-spdN*0.75, 0.3, 1);            // 辐条（随速度半透明）
  ctx.strokeStyle = '#B9BFC9'; ctx.lineWidth = 1.4; ctx.globalAlpha = sa;
  for(let i=0;i<12;i++){
    const an = a + i*Math.PI/6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(an)*5, Math.sin(an)*5);
    ctx.lineTo(Math.cos(an)*26, Math.sin(an)*26);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = P.tire; ctx.lineWidth = 2.2;      // 气门嘴
  const va = a*1.05+2;
  ctx.beginPath(); ctx.moveTo(Math.cos(va)*24, Math.sin(va)*24); ctx.lineTo(Math.cos(va)*29, Math.sin(va)*29); ctx.stroke();
  ctx.fillStyle = P.rim;
  ctx.beginPath(); ctx.arc(0,0,4,0,TAU); ctx.fill();
  ctx.restore();
}
function drawBike(){
  const p = S.pose;

  ctx.strokeStyle = F; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(48,-44); ctx.lineTo(52,-62); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(52,-62); ctx.quadraticCurveTo(64,-68,76,-58); ctx.stroke();
  ctx.strokeStyle = '#2C2F36'; ctx.lineWidth = 8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(71,-59); ctx.lineTo(77,-57); ctx.stroke();
  /* 车铃 */
  ctx.fillStyle = '#D8B04A';
  ctx.beginPath(); ctx.arc(58,-53,5,0,Math.PI); ctx.fill();
  ctx.fillStyle = '#E8C56A';
  ctx.beginPath(); ctx.arc(58,-53,2.4,0,TAU); ctx.fill();
  if(S.bell > 0.02){                                  // 铃的声波
    ctx.strokeStyle = 'rgba(255,235,170,'+(S.bell*0.8)+')'; ctx.lineWidth = 2;
    for(let k=1;k<=2;k++){
      ctx.beginPath(); ctx.arc(58,-53,6+S.bell*10*k, -0.8, 0.8); ctx.stroke();
    }
  }
  /* 前灯 = 自行车的"眼睛" */
  const lx = 64, ly = -74;
  ctx.fillStyle = '#3A3E46';
  ctx.beginPath(); ctx.arc(lx,ly,7.6,0,TAU); ctx.fill();
  const glass = lampA>0.1 ? '#FFE9B0' : '#CFE0EA';
  ctx.fillStyle = glass;
  ctx.beginPath(); ctx.arc(lx,ly,5.4,0,TAU); ctx.fill();
  if(S.bikeHappy > 0.05){
    ctx.strokeStyle = '#20242B'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(lx,ly+1.4,3.2,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
  } else if(S.blinkBike < 0.12){
    ctx.strokeStyle = '#20242B'; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(lx-4.4,ly); ctx.lineTo(lx+4.4,ly); ctx.stroke();
  } else {
    ctx.fillStyle = '#20242B';
    ctx.beginPath(); ctx.arc(lx+1.6,ly-0.6,2.7,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawReins(){
  const p = S.pose;
  const A = bikeWorld(74,-58);
  const bx = p.hx + Math.cos(p.beakA)*30, by = p.hy + Math.sin(p.beakA)*30 - 9;
  const d = Math.hypot(bx-A.x, by-A.y);
  const tension = clamp((S.sprint?0.75:0)+(S.panic>0?0.85:0),0,1);
  const sag = 8 + (1-tension)*(d*0.3) + S.wob*0.35 + Math.sin(S.t*2.2)*3;
  ctx.strokeStyle = '#5B4634'; ctx.lineWidth = 2.4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(A.x-2, A.y-1);
  ctx.quadraticCurveTo((A.x+bx)/2, (A.y+by)/2 + sag, bx-2, by);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(A.x+2, A.y+1);
  ctx.quadraticCurveTo((A.x+bx)/2, (A.y+by)/2 + sag*0.82, bx+2, by+2.5);
  ctx.stroke();
}
function drawFeedFish(){
  for(const f of S.feed){
    const p = S.pose;
    const tx = p.tipX-6, ty = p.tipY-2;
    const c1x = (f.x0+tx)/2 + 20, c1y = Math.min(f.y0,ty) - 70;
    const t = f.p*f.p*(3-2*f.p);
    const x = lerp(lerp(f.x0,c1x,t), lerp(c1x,tx,t), t);
    const y = lerp(lerp(f.y0,c1y,t), lerp(c1y,ty,t), t);
    const dx = 2*(1-t)*(c1x-f.x0) + 2*t*(tx-c1x);
    const dy = 2*(1-t)*(c1y-f.y0) + 2*t*(ty-c1y);
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.atan2(dy,dx));
    ctx.fillStyle = '#E8925A';
    ctx.beginPath(); ctx.ellipse(0,0,8.4,3.6,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(-12,-4.4); ctx.lineTo(-12,4.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#20242B';
    ctx.beginPath(); ctx.arc(5,-1,1,0,TAU); ctx.fill();
    ctx.restore();
  }
}
function drawLightCone(){
  const lampA = clamp(W3.k*0.45+W3.n, 0, 1);
  if(lampA < 0.06) return;
  const L = bikeWorld(64,-74);
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(L.x,L.y, L.x+250, GROUND);
  g.addColorStop(0,'rgba(255,220,150,'+(0.3*lampA)+')');
  g.addColorStop(1,'rgba(255,220,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(L.x-2,L.y-4); ctx.lineTo(L.x+250,GROUND+2);
  ctx.lineTo(L.x+88,GROUND+2); ctx.lineTo(L.x+2,L.y+4);
  ctx.closePath(); ctx.fill();
  const gl = ctx.createRadialGradient(L.x,L.y,1, L.x,L.y,26);
  gl.addColorStop(0,'rgba(255,225,160,'+(0.5*lampA)+')'); gl.addColorStop(1,'rgba(255,225,160,0)');
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(L.x,L.y,26,0,TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}
function drawShadow(){
  const p = S.pose;
  const bob = Math.sin(S.phase*TAU)*(3+S.speedNorm*4);
  ctx.fillStyle = P.silh; ctx.globalAlpha = 0.14;
  ctx.beginPath();
  ctx.ellipse(p.cx+8, GROUND+10, 118-bob*2, 11-bob*0.6, 0, 0, TAU);
  ctx.fill(); ctx.globalAlpha = 1;
}
function drawSpeedlines(){
  const a = clamp((S.effSpeed-6.4)/4,0,1)*0.4 + (S.sprint?0.1:0);
  if(a < 0.02) return;
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.lineCap='round';
  const span = VW+320;
  for(let i=0;i<9;i++){
    ctx.globalAlpha = a*(0.35+0.65*srnd(i*3));
    const x = md(i*353 - S.offset*1.7, span)-160;
    const y = 150 + srnd(i*7)*380;
    const len = 60 + srnd(i)*90;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function drawVignette(){
  const g = ctx.createRadialGradient(VW/2, 360, VW*0.32, VW/2, 360, VW*0.78);
  g.addColorStop(0,'rgba(12,16,32,0)');
  g.addColorStop(1,'rgba(12,16,32,'+(0.15+W3.n*0.16)+')');
  ctx.fillStyle = g; ctx.fillRect(-8,-8,VW+16,DH+16);
}

/* ===================== 渲染 ===================== */
function render(){
  const T = ((S.theme%3)+3)%3;
  const cur = Math.floor(T)%3, nxt = (cur+1)%3, fr = T-Math.floor(T);
  P = mixPal(cur, nxt, fr);
  W3 = {
    d: (cur===0?1-fr:0)+(nxt===0?fr:0),
    k: (cur===1?1-fr:0)+(nxt===1?fr:0),
    n: (cur===2?1-fr:0)+(nxt===2?fr:0)
  };
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.scale(sc,sc);
  if(S.shake > 0.01) ctx.translate((Math.random()-0.5)*9*S.shake, (Math.random()-0.5)*7*S.shake);

  drawSky();
  drawLighthouse();
  drawSea();
  drawSand();
  drawBoard();
  drawShadow();
  drawPelican();
  drawBike();
  drawReins();
  drawFeedFish();
  drawLightCone();
  drawParts();
  drawForeground();
  drawSpeedlines();
  drawVignette();
}

/* ===================== 主循环 ===================== */
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 1/20);
  last = now;
  if(dt > 0){
    update(dt);
    render();
  }
  requestAnimationFrame(loop);
}
resize();
computePose();
S.prevSaddle = S.pose.saddle.y;
requestAnimationFrame(loop);
setTimeout(()=> showToast('今日骑手：一辆自行车。今日坐骑：一只鹈鹕。'), 900);
setTimeout(()=> showToast('按「按铃」试试 —— 小心它受惊。'), 5200);
</script>
