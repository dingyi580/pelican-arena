<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自行车骑鹈鹕 · Bicycle Riding a Pelican</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; color: #fff; user-select: none; }
  #stage { position: fixed; inset: 0; display: block; }
  .panel {
    position: fixed; left: 20px; bottom: 20px;
    background: rgba(15, 22, 42, 0.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 240px; box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .panel h3 { font-size: 13px; letter-spacing: 1px; opacity: 0.75; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 10px; }
  .btn {
    flex: 1; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    color: #fff; font-size: 13px; cursor: pointer; transition: transform .12s, background .2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08)); }
  .btn:active { transform: scale(0.96); }
  .btn.accent { background: linear-gradient(180deg, #ffb86b, #ff7a59); color: #2a1200; border-color: transparent; font-weight: 600; }
  .btn.fish { background: linear-gradient(180deg, #7ee0ff, #4aa8ff); color: #002233; border-color: transparent; font-weight: 600; }
  .slider-wrap { display: flex; flex-direction: column; gap: 6px; }
  .slider-wrap label { font-size: 12px; opacity: 0.8; display: flex; justify-content: space-between; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
    background: rgba(255,255,255,0.15); border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #ffd36b; cursor: pointer; border: 2px solid #fff;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%; background: #ffd36b; cursor: pointer; border: 2px solid #fff;
  }
  .hud {
    position: fixed; top: 20px; right: 20px;
    background: rgba(15, 22, 42, 0.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 12px 16px;
    min-width: 220px;
  }
  .hud .title { font-size: 12px; opacity: 0.75; letter-spacing: 1px; margin-bottom: 6px; }
  .bar { height: 10px; background: rgba(255,255,255,0.12); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #7ee0ff, #ffd36b, #ff7a59); transition: width .2s; }
  .mood { font-size: 12px; margin-top: 6px; opacity: 0.9; }
  .title-card {
    position: fixed; top: 20px; left: 20px;
    background: rgba(15, 22, 42, 0.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 10px 14px;
    font-size: 13px; letter-spacing: 1px;
  }
  .title-card b { color: #ffd36b; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="title-card">「自行车骑鹈鹕」 · <b>Bicycle × Pelican</b></div>

<div class="hud">
  <div class="title">鹈鹕体力 · PELICAN STAMINA</div>
  <div class="bar"><div id="staminaBar" style="width:100%"></div></div>
  <div class="mood" id="moodText">心情：愉悦 ♪</div>
</div>

<div class="panel">
  <h3>互动控制台</h3>
  <div class="row">
    <button class="btn accent" id="bellBtn">🔔 按车铃</button>
    <button class="btn fish" id="fishBtn">🐟 投喂小鱼</button>
  </div>
  <div class="slider-wrap">
    <label><span>速度 · Speed</span><span id="speedVal">60%</span></label>
    <input type="range" id="speedSlider" min="0" max="100" value="60">
  </div>
  <div class="row">
    <button class="btn" id="sprintBtn">⚡ 冲刺</button>
    <button class="btn" id="timeBtn">🌅 切换时段</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // ---------- State ----------
  const state = {
    time: 0,            // 0=day, 1=dusk, 2=night
    speed: 0.6,         // 0..1
    targetSpeed: 0.6,
    stamina: 1.0,
    sprint: 0,          // sprint boost timer
    bell: 0,            // bell animation timer
    startled: 0,        // pelican startled timer
    fishFeed: 0,        // feeding animation
    scrollX: 0,
    bob: 0,
    mood: 'happy',
  };

  // ---------- Particles ----------
  const particles = [];
  function spawnFeather(x, y) {
    particles.push({
      type: 'feather', x, y,
      vx: -2 - Math.random()*2, vy: -1 - Math.random()*2,
      life: 0, max: 120 + Math.random()*60,
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.1,
      size: 6 + Math.random()*4,
    });
  }
  function spawnSweat(x, y) {
    particles.push({
      type: 'sweat', x, y,
      vx: -1 - Math.random()*2, vy: -3 - Math.random()*2,
      life: 0, max: 60,
      size: 3 + Math.random()*2,
    });
  }
  function spawnRing(x, y) {
    particles.push({ type: 'ring', x, y, life: 0, max: 40 });
  }
  function spawnFish(x, y) {
    particles.push({ type: 'fish', x, y, life: 0, max: 50, vy: -2 });
  }

  // ---------- Clouds ----------
  const clouds = [];
  for (let i = 0; i < 8; i++) {
    clouds.push({
      x: Math.random() * 2000,
      y: 40 + Math.random() * 120,
      s: 0.6 + Math.random() * 0.8,
      speed: 0.1 + Math.random() * 0.2,
    });
  }

  // ---------- Background palettes ----------
  function getPalette() {
    const t = state.time;
    if (t === 0) return {
      sky1: '#ffd9a8', sky2: '#8ec5fc', sky3: '#4a90e2',
      sea1: '#5bb7d9', sea2: '#2a6a9e',
      sand: '#f5d9a8', wood: '#8b5a2b', woodDark: '#5a3a1a',
      sun: '#fff2b8', sunGlow: 'rgba(255,220,150,0.5)',
      cloud: 'rgba(255,255,255,0.9)',
    };
    if (t === 1) return {
      sky1: '#ff7e5f', sky2: '#feb47b', sky3: '#6a3093',
      sea1: '#4a4e8a', sea2: '#1a1e4a',
      sand: '#d49a6a', wood: '#6b3f1f', woodDark: '#3a2010',
      sun: '#ffcc66', sunGlow: 'rgba(255,150,80,0.5)',
      cloud: 'rgba(255,200,180,0.7)',
    };
    return {
      sky1: '#0f1740', sky2: '#1a2060', sky3: '#05081f',
      sea1: '#0a1540', sea2: '#020510',
      sand: '#2a2a4a', wood: '#3a2a1a', woodDark: '#1a1008',
      sun: '#fff8d0', sunGlow: 'rgba(200,200,255,0.3)',
      cloud: 'rgba(150,160,200,0.4)',
    };
  }

  // ---------- Drawing helpers ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  // ---------- Background ----------
  function drawBackground() {
    const p = getPalette();
    // Sky gradient
    const g = ctx.createLinearGradient(0, 0, 0, H*0.65);
    g.addColorStop(0, p.sky3);
    g.addColorStop(0.5, p.sky2);
    g.addColorStop(1, p.sky1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H*0.65);

    // Sun/Moon
    const sunX = W * 0.78;
    const sunY = H * 0.22;
    const sunR = 50;
    // glow
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR*4);
    glow.addColorStop(0, p.sunGlow);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H*0.65);
    // body
    ctx.fillStyle = p.sun;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2); ctx.fill();

    // Stars at night
    if (state.time === 2) {
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 60; i++) {
        const sx = (i * 137.5) % W;
        const sy = (i * 71.3) % (H*0.5);
        const tw = 0.5 + 0.5 * Math.sin(state.time*0 + i + performance.now()*0.002);
        ctx.globalAlpha = 0.3 + tw*0.6;
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    // Clouds (slow parallax)
    ctx.fillStyle = p.cloud;
    for (const c of clouds) {
      const cx = ((c.x - state.scrollX * 0.1) % (W + 400)) - 200;
      drawCloud(cx, c.y, c.s);
    }

    // Distant sea
    const seaY = H * 0.55;
    const seaG = ctx.createLinearGradient(0, seaY, 0, H*0.72);
    seaG.addColorStop(0, p.sea1);
    seaG.addColorStop(1, p.sea2);
    ctx.fillStyle = seaG;
    ctx.fillRect(0, seaY, W, H*0.17);

    // Sea waves (medium parallax)
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      const wy = seaY + 10 + i * 14;
      const off = (state.scrollX * 0.3 + i * 40) % 80;
      for (let x = -off; x < W + 80; x += 40) {
        ctx.moveTo(x, wy);
        ctx.quadraticCurveTo(x+10, wy - 3, x+20, wy);
        ctx.quadraticCurveTo(x+30, wy + 3, x+40, wy);
      }
      ctx.stroke();
    }

    // Sand / beach
    const beachY = H * 0.72;
    ctx.fillStyle = p.sand;
    ctx.fillRect(0, beachY, W, H*0.08);

    // Boardwalk (fast parallax)
    const boardY = H * 0.80;
    ctx.fillStyle = p.wood;
    ctx.fillRect(0, boardY, W, H*0.2);
    // planks
    ctx.fillStyle = p.woodDark;
    const plankW = 80;
    const off = state.scrollX % plankW;
    for (let x = -off; x < W + plankW; x += plankW) {
      ctx.fillRect(x, boardY, 3, H*0.2);
    }
    // plank highlights
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = -off; x < W + plankW; x += plankW) {
      ctx.fillRect(x+3, boardY+4, plankW-6, 3);
    }
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+22*s, y-5*s, 25*s, 0, Math.PI*2);
    ctx.arc(x+48*s, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+30*s, y+8*s, 22*s, 0, Math.PI*2);
    ctx.fill();
  }

  // ---------- Pelican ----------
  function drawPelican(cx, cy) {
    const t = state.time * 60; // animation time
    const bob = Math.sin(t * 0.3) * 4;
    const runPhase = t * 0.4;
    const wingFlap = Math.sin(t * 0.25) * 0.5;
    const startled = state.startled > 0;
    const panting = state.stamina < 0.3;

    ctx.save();
    ctx.translate(cx, cy + bob);

    // Tail feathers
    ctx.fillStyle = '#f5f0e0';
    ctx.strokeStyle = '#c9bfa0';
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      const tx = -90 + i*6;
      const ty = 10 + Math.abs(i)*2;
      ctx.ellipse(tx, ty, 18, 6, i*0.2, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }

    // Back leg (behind)
    drawLeg(-20, 40, runPhase + Math.PI, '#e8a040');
    // Body
    ctx.fillStyle = '#faf6e8';
    ctx.strokeStyle = '#b8ae90';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 90, 55, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // Belly shading
    ctx.fillStyle = 'rgba(200,180,140,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 15, 75, 35, 0, 0, Math.PI*2);
    ctx.fill();

    // Front leg
    drawLeg(20, 40, runPhase, '#f0a848');

    // Wing (flapping)
    ctx.save();
    ctx.translate(-10, -20);
    ctx.rotate(wingFlap * 0.4);
    ctx.fillStyle = '#e8e2cc';
    ctx.strokeStyle = '#a89878';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 55, 28, -0.3, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // wing tip feathers
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(-40, -10, 18, 8, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Neck
    ctx.fillStyle = '#faf6e8';
    ctx.strokeStyle = '#b8ae90';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(55, -25);
    ctx.quadraticCurveTo(95, -50, 110, -70);
    ctx.quadraticCurveTo(125, -55, 100, -20);
    ctx.quadraticCurveTo(80, -5, 55, -10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Head
    ctx.fillStyle = '#faf6e8';
    ctx.beginPath();
    ctx.arc(115, -75, 25, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // Throat pouch (wobbly)
    const pouchWob = Math.sin(t * 0.5) * 3;
    ctx.fillStyle = '#ffd97a';
    ctx.strokeStyle = '#d4a040';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(120, -65);
    ctx.quadraticCurveTo(150 + pouchWob, -40, 140 + pouchWob*0.5, -20);
    ctx.quadraticCurveTo(120, -15 + pouchWob*0.3, 100, -30);
    ctx.quadraticCurveTo(105, -50, 120, -65);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // pouch lines
    ctx.strokeStyle = 'rgba(180,130,50,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(115, -55); ctx.quadraticCurveTo(135, -35, 130, -25);
    ctx.stroke();

    // Beak (long, upper)
    ctx.fillStyle = '#ff9a3c';
    ctx.strokeStyle = '#c06020';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(130, -85);
    ctx.lineTo(195, -80);
    ctx.lineTo(195, -72);
    ctx.lineTo(130, -70);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // beak tip hook
    ctx.fillStyle = '#d06020';
    ctx.beginPath();
    ctx.moveTo(195, -80); ctx.lineTo(200, -76); ctx.lineTo(195, -72); ctx.closePath();
    ctx.fill();

    // Eye
    const eyeX = 122, eyeY = -80;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(eyeX, eyeY, 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
    // pupil
    const pupilOff = startled ? 2 : 0;
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(eyeX + pupilOff, eyeY, startled ? 1.5 : 3, 0, Math.PI*2); ctx.fill();
    // eyebrow if startled
    if (startled) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(eyeX - 8, eyeY - 10); ctx.lineTo(eyeX + 6, eyeY - 6);
      ctx.stroke();
    }
    // panting tongue
    if (panting) {
      ctx.fillStyle = '#ff6b8a';
      ctx.beginPath();
      ctx.ellipse(140, -65 + Math.sin(t*0.6)*1, 6, 3 + Math.sin(t*0.6)*1, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // Reins connecting beak to bicycle handlebars (drawn later but we mark anchor)
    ctx.restore();

    // Return anchor points for bicycle
    return {
      backX: cx - 30, backY: cy + bob - 50, // where bike sits
      beakX: cx + 195 - 100, beakY: cy + bob - 80, // relative
      headX: cx + 115, headY: cy + bob - 75,
    };
  }

  function drawLeg(x, y, phase, color) {
    const swing = Math.sin(phase) * 20;
    const lift = Math.max(0, Math.sin(phase)) * 15;
    ctx.strokeStyle = color;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    // thigh
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + swing*0.3, y + 20 - lift*0.5);
    ctx.stroke();
    // shin
    ctx.beginPath();
    ctx.moveTo(x + swing*0.3, y + 20 - lift*0.5);
    ctx.lineTo(x + swing, y + 40 - lift);
    ctx.stroke();
    // webbed foot
    ctx.fillStyle = color;
    ctx.strokeStyle = '#a06020';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const fx = x + swing, fy = y + 40 - lift;
    ctx.moveTo(fx - 8, fy);
    ctx.lineTo(fx + 12, fy + 3);
    ctx.lineTo(fx + 10, fy + 8);
    ctx.lineTo(fx - 6, fy + 6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // webbing lines
    ctx.beginPath();
    ctx.moveTo(fx, fy+2); ctx.lineTo(fx+4, fy+7);
    ctx.moveTo(fx+4, fy+2); ctx.lineTo(fx+8, fy+7);
    ctx.stroke();
  }

  // ---------- Bicycle ----------
  function drawBicycle(anchorX, anchorY, beakAnchorX, beakAnchorY) {
    const t = state.time * 60;
    const wheelR = 28;
    const wheelSpin = t * 0.3 * (0.5 + state.speed);
    const pedalAngle = t * 0.25 * (0.5 + state.speed);

    // Bike sits on pelican's back, slightly bouncing
    const bounce = Math.sin(t * 0.3) * 2;
    const tilt = Math.sin(t * 0.15) * 0.04;

    ctx.save();
    ctx.translate(anchorX, anchorY + bounce - 40);
    ctx.rotate(tilt);

    // Position: rear wheel left, front wheel right
    const rearX = -55, rearY = 20;
    const frontX = 55, frontY = 20;

    // Chain (behind frame)
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(rearX, rearY);
    ctx.lineTo(-5, 5);
    ctx.lineTo(rearX, rearY - 2);
    ctx.stroke();

    // Frame
    ctx.strokeStyle = '#e63946';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    // down tube
    ctx.beginPath();
    ctx.moveTo(rearX, rearY); ctx.lineTo(-5, -20);
    ctx.stroke();
    // top tube
    ctx.beginPath();
    ctx.moveTo(-5, -20); ctx.lineTo(30, -20);
    ctx.stroke();
    // seat tube
    ctx.beginPath();
    ctx.moveTo(-5, -20); ctx.lineTo(-5, 5);
    ctx.stroke();
    // seat stay
    ctx.beginPath();
    ctx.moveTo(rearX, rearY); ctx.lineTo(-5, 5);
    ctx.stroke();
    // head tube / fork
    ctx.beginPath();
    ctx.moveTo(30, -20); ctx.lineTo(frontX, frontY);
    ctx.stroke();
    // chain stay
    ctx.beginPath();
    ctx.moveTo(-5, 5); ctx.lineTo(frontX, frontY);
    ctx.stroke();

    // Seat
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(-5, -24, 12, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // Handlebar stem
    ctx.strokeStyle = '#c0c0c0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(30, -20); ctx.lineTo(35, -35);
    ctx.stroke();
    // Handlebar (curved)
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(20, -38);
    ctx.quadraticCurveTo(35, -42, 50, -38);
    ctx.stroke();
    // grips
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(20, -38, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(50, -38, 4, 0, Math.PI*2); ctx.fill();

    // Bell on handlebar
    const bellShake = state.bell > 0 ? Math.sin(state.bell * 2) * 3 : 0;
    ctx.save();
    ctx.translate(35 + bellShake, -45);
    ctx.fillStyle = '#ffd36b';
    ctx.strokeStyle = '#b8860b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b8860b';
    ctx.beginPath(); ctx.arc(0, -2, 1.5, 0, Math.PI*2); ctx.fill();
    // hammer
    ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-3, -5); ctx.lineTo(-3, -9); ctx.stroke();
    ctx.restore();

    // Pedals & crank
    ctx.save();
    ctx.translate(-5, 5);
    // crank arm
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    const crankLen = 12;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(pedalAngle) * crankLen, Math.sin(pedalAngle) * crankLen);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(pedalAngle + Math.PI) * crankLen, Math.sin(pedalAngle + Math.PI) * crankLen);
    ctx.stroke();

    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r - 3, 0, Math.PI*2); ctx.stroke();

    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 1;

      ctx.lineTo(x + Math.cos(a) * (r-3), y + Math.sin(a) * (r-3));

    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
