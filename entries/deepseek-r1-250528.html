<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  :root{
    --glass: rgba(14,20,34,.52);
    --glass-b: rgba(255,255,255,.16);
    --ink: #eaf2ff;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; background:#08101f; color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color: transparent;
  }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; }

  stop { transition: stop-color .7s ease; }
  #sunCore, #sunGlowEl { transition: all .7s ease; }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; left:22px; top:20px; z-index:12; pointer-events:none;
    display:flex; flex-direction:column; gap:12px;
  }
  .title{ display:flex; flex-direction:column; gap:2px; }
  .t1{
    font-size:22px; font-weight:800; letter-spacing:.06em;
    color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.45), 0 0 30px rgba(120,200,255,.35);
  }
  .t2{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.72); text-shadow:0 1px 8px rgba(0,0,0,.5);
  }
  .stamina-wrap{
    width:190px; padding:8px 12px 10px; border-radius:14px;
    background:var(--glass); border:1px solid var(--glass-b);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow:0 8px 24px rgba(0,0,0,.28);
  }
  .stamina-label{
    font-size:10.5px; letter-spacing:.14em; color:rgba(255,255,255,.68);
    margin-bottom:6px; display:flex; justify-content:space-between;
  }
  .stamina-bar{
    height:8px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden;
  }
  .stamina-fill{
    height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg,#3ee6a8,#7ddcff 60%,#ffd166);
    transition: width .18s linear, filter .3s;
  }
  .stamina-fill.low{ background:linear-gradient(90deg,#ff7a7a,#ffb36b); }

  /* ---------- Control panel ---------- */
  #panel{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    z-index:14; display:flex; align-items:center; gap:10px;
    padding:11px 14px; border-radius:20px; flex-wrap:wrap; justify-content:center;
    background:var(--glass); border:1px solid var(--glass-b);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow:0 18px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);
    max-width:min(96vw, 900px);
  }
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    color:#f2f7ff; font-size:13px; font-weight:600; letter-spacing:.02em;
    padding:9px 15px; border-radius:13px; cursor:pointer;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease, border-color .2s;
    box-shadow:0 4px 12px rgba(0,0,0,.22); white-space:nowrap;
    font-family:inherit;
  }
  .btn:hover{ background:linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.1)); transform:translateY(-1px); }
  .btn:active{ transform:translateY(1px) scale(.97); }
  .btn.on{
    background:linear-gradient(180deg,#5ad1ff,#2b8fe0);
    border-color:rgba(180,235,255,.85);
    box-shadow:0 0 18px rgba(90,209,255,.55), 0 4px 12px rgba(0,0,0,.25);
    color:#04263c;
  }
  .btn.bell{ background:linear-gradient(180deg,#ffd76e,#efa61d); color:#3a2402; border-color:rgba(255,230,160,.8);}
  .btn.bell:hover{ background:linear-gradient(180deg,#ffe293,#f5b233); }
  .btn.sprint{ background:linear-gradient(180deg,#ff8f7a,#e2462f); color:#fff; border-color:rgba(255,190,170,.7);}
  .btn.sprint:hover{ background:linear-gradient(180deg,#ffa694,#ee5942); }
  .btn.feed{ background:linear-gradient(180deg,#7ce3c4,#26a98a); color:#03291f; border-color:rgba(180,255,235,.7);}
  .btn.feed:hover{ background:linear-gradient(180deg,#93efd3,#33bc9a); }

  .slider-wrap{
    display:flex; align-items:center; gap:9px; padding:0 6px 0 10px;
    border-left:1px solid rgba(255,255,255,.16);
  }
  .slider-wrap .lbl{ font-size:11px; letter-spacing:.12em; color:rgba(255,255,255,.66); }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:120px; height:6px; border-radius:99px;
    background:linear-gradient(90deg,#7ddcff,#3ee6a8); outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%;
    background:#fff; border:2px solid #2b8fe0; box-shadow:0 2px 8px rgba(0,0,0,.4); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:#fff; border:2px solid #2b8fe0; cursor:pointer;
  }

  @media (max-width: 760px){
    #hud{ left:12px; top:12px; transform:scale(.86); transform-origin:left top; }
    #panel{ gap:7px; padding:9px 10px; bottom:12px; border-radius:16px;}
    .btn{ font-size:11.5px; padding:8px 11px; }
    input[type=range]{ width:80px; }
    .slider-wrap .lbl{ display:none; }
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="sky0" offset="0"    stop-color="#5cb4e8"/>
      <stop id="sky1" offset="0.42" stop-color="#a9def6"/>
      <stop id="sky2" offset="0.72" stop-color="#ffe9c4"/>
      <stop id="sky3" offset="1"    stop-color="#ffd2a6"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="sea0" offset="0" stop-color="#2f7fb5"/>
      <stop id="sea1" offset="1" stop-color="#12496f"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="deck0" offset="0" stop-color="#cf9f68"/>
      <stop id="deck1" offset="1" stop-color="#8a6238"/>
    </linearGradient>
    <radialGradient id="glowGrad">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f9fc"/>
      <stop offset="1"   stop-color="#dde9f1"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f0a92f"/>
    </linearGradient>
    <linearGradient id="sacGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffb45c"/>
      <stop offset="1" stop-color="#ef8f2e"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d63b3b"/>
    </linearGradient>
  </defs>

  <!-- ================= SKY ================= -->
  <rect x="-700" y="-400" width="2600" height="1300" fill="url(#skyGrad)"/>

  <!-- stars -->
  <g id="stars" opacity="0"></g>

  <!-- sun / moon -->
  <g id="sunG">
    <circle id="sunGlowEl" cx="930" cy="150" r="190" fill="url(#glowGrad)" opacity="0.9"/>
    <circle id="sunCore" cx="930" cy="150" r="56" fill="#fffbe0"/>
  </g>

  <!-- clouds -->
  <g id="clouds" opacity="0.95">
    <g class="cloud" transform="translate(150,110)">
      <ellipse cx="0" cy="0" rx="58" ry="27" fill="#fff" opacity="0.92"/>
      <ellipse cx="-44" cy="11" rx="38" ry="20" fill="#fff" opacity="0.92"/>
      <ellipse cx="46" cy="13" rx="42" ry="22" fill="#fff" opacity="0.92"/>
      <ellipse cx="4" cy="-16" rx="32" ry="22" fill="#fff" opacity="0.92"/>
    </g>
    <g class="cloud" transform="translate(520,70)">
      <ellipse cx="0" cy="0" rx="44" ry="21" fill="#fff" opacity="0.8"/>
      <ellipse cx="-34" cy="9" rx="30" ry="16" fill="#fff" opacity="0.8"/>
      <ellipse cx="36" cy="10" rx="34" ry="18" fill="#fff" opacity="0.8"/>
    </g>
    <g class="cloud" transform="translate(905,150)">
      <ellipse cx="0" cy="0" rx="66" ry="30" fill="#fff" opacity="0.85"/>
      <ellipse cx="-52" cy="12" rx="42" ry="22" fill="#fff" opacity="0.85"/>
      <ellipse cx="54" cy="14" rx="46" ry="24" fill="#fff" opacity="0.85"/>
      <ellipse cx="6" cy="-18" rx="36" ry="24" fill="#fff" opacity="0.85"/>
    </g>
    <g class="cloud" transform="translate(1200,95)">
      <ellipse cx="0" cy="0" rx="48" ry="22" fill="#fff" opacity="0.78"/>
      <ellipse cx="-36" cy="10" rx="32" ry="17" fill="#fff" opacity="0.78"/>
      <ellipse cx="38" cy="11" rx="36" ry="19" fill="#fff" opacity="0.78"/>
    </g>
  </g>

  <!-- ================= SEA ================= -->
  <rect x="-700" y="470" width="2600" height="170" fill="url(#seaGrad)"/>
  <line x1="-700" y1="470" x2="1900" y2="470" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" fill="none" stroke-linecap="round">
    <line id="wave1" x1="-700" y1="510" x2="1900" y2="510" stroke-dasharray="26 34"/>
    <line id="wave2" x1="-700" y1="548" x2="1900" y2="548" stroke-dasharray="40 50" stroke-opacity="0.18"/>
    <line id="wave3" x1="-700" y1="586" x2="1900" y2="586" stroke-dasharray="18 44" stroke-opacity="0.15"/>
  </g>

  <!-- sun reflection -->
  <g id="reflection" opacity="0.5">
    <rect x="880" y="482" width="100" height="5" rx="2.5" fill="#fff8d0" opacity="0.7"/>
    <rect x="896" y="500" width="70" height="5" rx="2.5" fill="#fff8d0" opacity="0.5"/>
    <rect x="906" y="520" width="50" height="5" rx="2.5" fill="#fff8d0" opacity="0.35"/>
    <rect x="914" y="545" width="34" height="5" rx="2.5" fill="#fff8d0" opacity="0.22"/>
  </g>

  <!-- ================= BOARDWALK ================= -->
  <rect x="-700" y="621" width="2600" height="200" fill="#5c3f22"/>
  <g id="planks"></g>
  <rect x="-700" y="621" width="2600" height="7" fill="#e3b075" opacity="0.55"/>
  <rect x="-700" y="628" width="2600" height="5" fill="#3a2714" opacity="0.35"/>

  <!-- ================= RIG ================= -->
  <g id="rig">

    <!-- ---------- PELICAN ---------- -->
    <g id="pelican">
      <!-- tail -->
      <g id="tail">
        <path d="M 408,415 L 316,380 L 338,414 L 300,430 L 354,450 Z"
              fill="#eef4f9" stroke="#cfdae4" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 396,424 L 330,414 M 396,432 L 336,436" stroke="#cfdae4" stroke-width="2" fill="none" opacity="0.7"/>
      </g>

      <!-- neck -->
      <path id="neck" d="M 650,405 C 695,352 775,328 852,348"
            fill="none" stroke="#f5fafd" stroke-width="46" stroke-linecap="round"/>
      <path d="M 650,405 C 695,352 775,328 852,348"
            fill="none" stroke="#d8e5ee" stroke-width="46" stroke-linecap="round" opacity="0.30" transform="translate(0,9)"/>

      <!-- body -->
      <ellipse cx="540" cy="445" rx="150" ry="98" fill="url(#bodyGrad)"
               stroke="#d3dfe8" stroke-width="3.5"/>
      <ellipse cx="562" cy="482" rx="116" ry="60" fill="#e9f1f7" opacity="0.75"/>
      <path d="M 430,398 C 480,368 600,368 655,392" stroke="#ffffff" stroke-width="10"
            fill="none" opacity="0.85" stroke-linecap="round"/>

      <!-- pouch (throat sack) -->
      <path id="sac" d="M890,354 Q918,466 1006,376 Q948,410 890,354 Z"
            fill="url(#sacGrad)" stroke="#d9822b" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- upper beak -->
      <path d="M 884,330 L 1014,368 L 1009,379 L 886,357 Z"
            fill="url(#beakGrad)" stroke="#d99420" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 892,340 L 1000,368" stroke="#ffe29a" stroke-width="3" opacity="0.7" fill="none"/>

      <!-- head -->
      <circle cx="862" cy="352" r="38" fill="#f8fbfd" stroke="#d3dfe8" stroke-width="3.5"/>
      <path d="M 838,322 C 846,300 870,294 886,310" fill="none" stroke="#dfeaf2"
            stroke-width="7" stroke-linecap="round"/>
      <circle cx="876" cy="342" r="7.6" fill="#22303c"/>
      <circle cx="878.5" cy="339.5" r="2.6" fill="#ffffff"/>
      <ellipse id="eyelid" cx="876" cy="342" rx="8.6" ry="0" fill="#f8fbfd"/>

      <!-- wing -->
      <g id="wing">
        <path d="M 600,404 C 664,412 694,470 642,512 C 610,538 556,524 546,492 C 566,460 576,428 600,404 Z"
              fill="#f2f8fb" stroke="#cfdae4" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 604,448 C 634,468 646,492 634,508" stroke="#cfdae4" stroke-width="2.4" fill="none"/>
        <path d="M 588,424 C 612,448 620,470 612,490" stroke="#cfdae4" stroke-width="2.4" fill="none" opacity="0.7"/>
      </g>

      <!-- legs -->
      <g id="legs">
        <path id="legA" d="" fill="none" stroke="#f0a23a" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path id="legB" d="" fill="none" stroke="#dd8d23" stroke-width="14"
              stroke-linecap="round" stroke-linejoin="round"/>
        <g id="footA">
          <path d="M -26,0 Q 0,-9 26,0 Q 15,15 0,12 Q -15,15 -26,0 Z"
                fill="#f0a23a" stroke="#d98d26" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <g id="footB">
          <path d="M -26,0 Q 0,-9 26,0 Q 15,15 0,12 Q -15,15 -26,0 Z"
                fill="#dd8d23" stroke="#c47c1e" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <!-- ---------- BICYCLE ---------- -->
    <g id="bike">
      <!-- reins -->
      <path d="M 620,244 Q 745,300 856,334" fill="none" stroke="#8b5e3c"
            stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <path d="M 646,250 Q 752,308 854,344" fill="none" stroke="#a06f45"
            stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

      <!-- rear wheel -->
      <g transform="translate(450,320)">
        <circle r="50" fill="none" stroke="#2b2b33" stroke-width="8"/>
        <circle r="43" fill="none" stroke="#c9ccd6" stroke-width="3"/>
        <g id="spokesR">
          <line x1="-44" y1="0" x2="44" y2="0" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="0" y1="-44" x2="0" y2="44" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-31" y1="-31" x2="31" y2="31" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-31" y1="31" x2="31" y2="-31" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-42" y1="-16" x2="42" y2="16" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-42" y1="16" x2="42" y2="-16" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-16" y1="-42" x2="16" y2="42" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-16" y1="42" x2="16" y2="-42" stroke="#9aa0ad" stroke-width="1.6"/>
        </g>
        <circle r="8" fill="#63636f" stroke="#3a3a44" stroke-width="2"/>
      </g>

      <!-- front wheel -->
      <g transform="translate(650,320)">
        <circle r="50" fill="none" stroke="#2b2b33" stroke-width="8"/>
        <circle r="43" fill="none" stroke="#c9ccd6" stroke-width="3"/>
        <g id="spokesF">
          <line x1="-44" y1="0" x2="44" y2="0" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="0" y1="-44" x2="0" y2="44" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-31" y1="-31" x2="31" y2="31" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-31" y1="31" x2="31" y2="-31" stroke="#9aa0ad" stroke-width="2.2"/>
          <line x1="-42" y1="-16" x2="42" y2="16" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-42" y1="16" x2="42" y2="-16" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-16" y1="-42" x2="16" y2="42" stroke="#9aa0ad" stroke-width="1.6"/>
          <line x1="-16" y1="42" x2="16" y2="-42" stroke="#9aa0ad" stroke-width="1.6"/>
        </g>
        <circle r="8" fill="#63636f" stroke="#3a3a44" stroke-width="2"/>
      </g>

      <!-- chain -->
      <path d="M 555,339 L 450,312 M 555,371 L 450,328"
            stroke="#55555f" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- frame -->
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 450,320 L 555,355" stroke="url(#frameGrad)" stroke-width="9"/>
        <path d="M 450,320 L 505,264" stroke="url(#frameGrad)" stroke-width="9"/>
        <path d="M 555,355 L 640,292" stroke="url(#frameGrad)" stroke-width="9"/>
        <path d="M 505,264 L 628,252" stroke="url(#frameGrad)" stroke-width="9"/>
        <path d="M 505,264 L 555,355" stroke="url(#frameGrad)" stroke-width="9"/>
        <path d="M 628,252 L 640,292" stroke="#c23a3a" stroke-width="11"/>
        <path d="M 640,292 L 650,320" stroke="#8d8d99" stroke-width="7"/>
      </g>

      <!-- seat -->
      <g transform="translate(505,264) rotate(-8)">
        <rect x="-26" y="-9" width="44" height="16" rx="8" fill="#2f3540" stroke="#1b2029" stroke-width="2"/>
      </g>

      <!-- handlebar -->
      <g id="bar">
        <path d="M 628,252 L 620,236" stroke="#8d8d99" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M 596,232 Q 622,226 650,236" stroke="#3a4150" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle cx="596" cy="232" r="6" fill="#22262e"/>
        <circle cx="650" cy="236" r="6" fill="#22262e"/>
        <!-- bell -->
        <g id="bell">
          <circle cx="610" cy="222" r="10" fill="#ffd166" stroke="#c99a1e" stroke-width="2.5"/>
          <circle cx="610" cy="219" r="3.2" fill="#fff3c0"/>
          <rect x="606" y="231" width="8" height="4" rx="2" fill="#c99a1e"/>
        </g>
      </g>

      <!-- crank + chainring -->
      <g transform="translate(555,355)">
        <circle r="18" fill="none" stroke="#8d8d99" stroke-width="4"/>
        <circle r="18" fill="none" stroke="#55555f" stroke-width="2" stroke-dasharray="3 5"/>
        <g id="crankRot">
          <line x1="0" y1="0" x2="26" y2="0" stroke="#3a3f4a" stroke-width="7" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="-26" y2="0" stroke="#2c3038" stroke-width="7" stroke-linecap="round"/>
          <rect x="26" y="-6" width="20" height="12" rx="4" fill="#5d6470"/>
          <rect x="-46" y="-6" width="20" height="12" rx="4" fill="#4a515c"/>
        </g>
        <circle r="6" fill="#6d7480"/>
      </g>
    </g>
  </g>

  <!-- particles on top -->
  <g id="particles"></g>
</svg>

<!-- ================= HUD ================= -->
<div id="hud">
  <div class="title">
    <span class="t1">自行车骑鹈鹕</span>
    <span class="t2">A Bicycle Riding a Pelican</span>
  </div>
  <div class="stamina-wrap">
    <div class="stamina-label"><span>鹈鹕体力</span><span id="staminaPct">100%</span></div>
    <div class="stamina-bar"><div class="stamina-fill" id="staminaFill"></div></div>
  </div>
</div>

<!-- ================= CONTROLS ================= -->
<div id="panel">
  <button class="btn bell"   id="btnBell">🔔 按车铃</button>
  <button class="btn sprint" id="btnSprint">⚡ 冲刺</button>
  <button class="btn feed"   id="btnFeed">🐟 投喂小鱼</button>
  <button class="btn"        id="btnRoad">🛤️ 平路</button>
  <button class="btn"        id="btnTheme">☀️ 晴天</button>
  <div class="slider-wrap">
    <span class="lbl">速度</span>
    <input id="speed" type="range" min="0" max="100" value="42" step="1">
  </div>
</div>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* =========================================================
     STATE
     ========================================================= */
  var S = {
    t: 0,
    phase: 0,
    wheelAng: 0,
    scroll: 0,
    speedInput: 0.42,
    cur: 0.65,
    sprint: 0,
    stamina: 1,
    panic: 0,
    bellShake: 0,
    fedTimer: 0,
    blinkT: 0,
    blinkTimer: 2.2,
    bumpy: false,
    theme: 'day'
  };

  /* =========================================================
     ELEMENT CACHE
     ========================================================= */
  var E = {
    rig: $('rig'),
    spokesR: $('spokesR'),
    spokesF: $('spokesF'),
    crankRot: $('crankRot'),
    wing: $('wing'),
    sac: $('sac'),
    eyelid: $('eyelid'),
    bell: $('bell'),
    bar: $('bar'),
    legA: $('legA'),
    legB: $('legB'),
    footA: $('footA'),
    footB: $('footB'),
    planks: $('planks'),
    particles: $('particles'),
    stars: $('stars'),
    sunCore: $('sunCore'),
    sunGlowEl: $('sunGlowEl'),
    reflection: $('reflection'),
    wave1: $('wave1'),
    wave2: $('wave2'),
    wave3: $('wave3'),
    staminaFill: $('staminaFill'),
    staminaPct: $('staminaPct'),
    sky0: $('sky0'), sky1: $('sky1'), sky2: $('sky2'), sky3: $('sky3'),
    sea0: $('sea0'), sea1: $('sea1'),
    deck0: $('deck0'), deck1: $('deck1'),
    clouds: Array.prototype.slice.call(document.querySelectorAll('.cloud'))
  };

  /* =========================================================
     BOARDWALK
     ========================================================= */
  var PITCH = 128;
  (function buildPlanks() {
    for (var i = -1; i <= 11; i++) {
      var x = i * PITCH;
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x + 3);
      r.setAttribute('y', 625);
      r.setAttribute('width', PITCH - 6);
      r.setAttribute('height', 150);
      r.setAttribute('rx', 4);
      r.setAttribute('fill', 'url(#deckGrad)');
      r.setAttribute('stroke', '#7a5530');
      r.setAttribute('stroke-width', 2);
      E.planks.appendChild(r);

      var g = document.createElementNS(NS, 'line');
      g.setAttribute('x1', x + 8);
      g.setAttribute('y1', 632);
      g.setAttribute('x2', x + PITCH - 8);
      g.setAttribute('y2', 632);
      g.setAttribute('stroke', '#ffffff');
      g.setAttribute('stroke-opacity', '0.18');
      g.setAttribute('stroke-width', 3);
      E.planks.appendChild(g);
    }
  })();

  /* =========================================================
     STARS
     ========================================================= */
  (function buildStars() {
    for (var i = 0; i < 70; i++) {
      var c = document.createElementNS(NS, 'circle');
      var x = Math.random() * 1300 - 50;
      var y = Math.random() * 400 + 10;
      var r = Math.random() * 1.6 + 0.6;
      c.setAttribute('cx', x.toFixed(1));
      c.setAttribute('cy', y.toFixed(1));
      c.setAttribute('r', r.toFixed(2));
      c.setAttribute('fill', '#ffffff');
      c.setAttribute('opacity', (0.35 + Math.random() * 0.65).toFixed(2));
      E.stars.appendChild(c);
    }
  })();

  /* =========================================================
     THEMES
     ========================================================= */
  var THEMES = {
    day: {
      label: '☀️ 晴天', next: 'dusk',
      sky: ['#5cb4e8', '#a9def6', '#ffe9c4', '#ffd2a6'],
      sea: ['#2f7fb5', '#12496f'],
      deck: ['#cf9f68', '#8a6238'],
      sun: { x: 930, y: 150, r: 56, fill: '#fffbe0' },
      glow: { r: 190, op: 0.9 },
      stars: 0
    },
    dusk: {
      label: '🌇 黄昏', next: 'night',
      sky: ['#3b4b8f', '#9c5f92', '#f2895f', '#ffc27a'],
      sea: ['#5a4a80', '#241f43'],
      deck: ['#a9784d', '#6a4526'],
      sun: { x: 930, y: 300, r: 74, fill: '#ffcf8a' },
      glow: { r: 230, op: 0.75 },
      stars: 0.15
    },
    night: {
      label: '🌙 夜晚', next: 'day',
      sky: ['#081030', '#132250', '#23407a', '#3a5585'],
      sea: ['#0e2544', '#040b18'],
      deck: ['#6b543a', '#3d2f1e'],
      sun: { x: 930, y: 128, r: 42, fill: '#eef4ff' },
      glow: { r: 150, op: 0.55 },
      stars: 1
    }
  };

  function applyTheme(name) {
    var th = THEMES[name];
    S.theme = name;
    E.sky0.setAttribute('stop-color', th.sky[0]);
    E.sky1.setAttribute('stop-color', th.sky[1]);
    E.sky2.setAttribute('stop-color', th.sky[2]);
    E.sky3.setAttribute('stop-color', th.sky[3]);
    E.sea0.setAttribute('stop-color', th.sea[0]);
    E.sea1.setAttribute('stop-color', th.sea[1]);
    E.deck0.setAttribute('stop-color', th.deck[0]);
    E.deck1.setAttribute('stop-color', th.deck[1]);

    E.sunCore.setAttribute('cx', th.sun.x);
    E.sunCore.setAttribute('cy', th.sun.y);
    E.sunCore.setAttribute('r', th.sun.r);
    E.sunCore.setAttribute('fill', th.sun.fill);
    E.sunGlowEl.setAttribute('cx', th.sun.x);
    E.sunGlowEl.setAttribute('cy', th.sun.y);
    E.sunGlowEl.setAttribute('r', th.glow.r);
    E.sunGlowEl.setAttribute('opacity', th.glow.op);

    E.stars.setAttribute('opacity', th.stars);
    E.reflection.setAttribute('opacity', name === 'night' ? 0.8 : 0.5);

    var btn = $('btnTheme');
    btn.textContent = th.label;
  }

  /* =========================================================
     AUDIO
     ========================================================= */
  var actx = null;
  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }

  function ringBellSound() {
    ensureAudio();
    if (!actx) return;
    var t0 = actx.currentTime;
    var freqs = [1975, 2637, 3136];
    for (var k = 0; k < 2; k++) {
      var t = t0 + k * 0.135;
      for (var i = 0; i < freqs.length; i++) {
        (function (f, i, t) {
          var o = actx.createOscillator();
          var g = actx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(f, t);
          o.frequency.exponentialRampToValueAtTime(f * 0.984, t + 0.55);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.16 / (i + 1), t + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
          o.connect(g);
          g.connect(actx.destination);
          o.start(t);
          o.stop(t + 0.9);
        })(freqs[i], i, t);
      }
    }
  }

  function feedSound() {
    ensureAudio();
    if (!actx) return;
    var t0 = actx.currentTime;
    for (var i = 0; i < 3; i++) {
      (function (i) {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = 'triangle';
        var t = t0 + i * 0.07;
        o.frequency.setValueAtTime(420 + i * 90, t);
        o.frequency.exponentialRampToValueAtTime(880 + i * 110, t + 0.12);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + 0.25);
      })(i);
    }
  }

  /* =========================================================
     PARTICLES
     ========================================================= */
  var parts = [];
  var MAX_PARTS = 90;

  function addParticle(cfg) {
    if (parts.length >= MAX_PARTS) return;
    var el = document.createElementNS(NS, 'circle');
    el.setAttribute('r', cfg.r);
    el.setAttribute('fill', cfg.color);
    el.setAttribute('cx', cfg.x);
    el.setAttribute('cy', cfg.y);
    el.setAttribute('opacity', cfg.life / cfg.maxLife);
    E.particles.appendChild(el);
    parts.push({
      el: el,
      x: cfg.x, y: cfg.y,
      vx: cfg.vx, vy: cfg.vy,
      g: cfg.g || 0,
      life: cfg.life,
      maxLife: cfg.life,
      fade: cfg.fade !== false
    });
  }

  function updateParticles(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt;
      if (p.life <= 0) {
        if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
        parts.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.el.setAttribute('cx', p.x.toFixed(1));
      p.el.setAttribute('cy', p.y.toFixed(1));
      if (p.fade) p.el.setAttribute('opacity', (p.life / p.maxLife).toFixed(2));
    }
  }

  /* =========================================================
     LEG SOLVER
     ========================================================= */
  var HIP_A = { x: 505, y: 528 };
  var HIP_B = { x: 592, y: 528 };
  var GROUND_Y = 621;

  function legPath(hip, foot) {
    var mx = (hip.x + foot.x) * 0.5;
    var my = (hip.y + foot.y) * 0.5;
    var kx = mx + 24;
    var ky = my + 3;
    return 'M' + hip.x.toFixed(1) + ',' + hip.y.toFixed(1) +
           ' L' + kx.toFixed(1) + ',' + ky.toFixed(1) +
           ' L' + foot.x.toFixed(1) + ',' + foot.y.toFixed(1);
  }

  function legFoot(hip, p) {
    var s = Math.sin(p);
    var c = Math.cos(p);
    return {
      x: hip.x + s * 46,
      y: GROUND_Y - Math.max(0, c) * 46
    };
  }

  /* =========================================================
     MAIN UPDATE
     ========================================================= */
  function update(dt) {
    S.t += dt;

    /* ---- stamina ---- */
    if (S.sprint > 0.05 || S.panic > 0.3) {
      S.stamina -= dt * 0.30;
    } else {
      S.stamina += dt * 0.155;
    }
    S.stamina = clamp(S.stamina, 0, 1);

    S.sprint = Math.max(0, S.sprint - dt * 0.85);
    S.panic = Math.max(0, S.panic - dt * 0.85);
    S.fedTimer = Math.max(0, S.fedTimer - dt);
    S.bellShake = Math.max(0, S.bellShake - dt * 2.4);

    /* ---- speed ---- */
    var staminaFactor = 0.45 + 0.55 * S.stamina;
    var target = (0.35 + S.speedInput * 1.5 + S.sprint * 2.0 + S.panic * 0.9) * staminaFactor;
    S.cur = lerp(S.cur, target, Math.min(1, dt * 4.5));

    var eff = S.cur * (S.bumpy ? 0.9 : 1);

    S.scroll += eff * 330 * dt;
    S.phase += eff * 6.6 * dt;
    S.wheelAng += eff * 430 * dt;

    /* ---- rig bob / tilt ---- */
    var bumpJit = S.bumpy ? Math.sin(S.phase * 7.3) * 3.0 + Math.sin(S.phase * 13.1) * 1.4 : 0;
    var bob = Math.sin(S.phase * 2) * (2 + eff * 3.2) + bumpJit;
    var tilt = Math.sin(S.phase) * (1.0 + eff * 0.85) + (S.bumpy ? Math.sin(S.phase * 5.4) * 1.1 : 0);
    E.rig.setAttribute('transform',
      'translate(0,' + bob.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 540 520)');

    /* ---- wheels ---- */
    var wa = S.wheelAng % 360;
    E.spokesR.setAttribute('transform', 'rotate(' + wa.toFixed(1) + ')');
    E.spokesF.setAttribute('transform', 'rotate(' + (wa * 1.02 + 12).toFixed(1) + ')');
    E.crankRot.setAttribute('transform', 'rotate(' + ((S.wheelAng * 0.44) % 360).toFixed(1) + ')');

    /* ---- bell shake ---- */
    if (S.bellShake > 0) {
      var sh = S.bellShake;
      var ang = Math.sin(S.t * 60) * 14 * sh;
      var dx = Math.sin(S.t * 71) * 3 * sh;
      E.bell.setAttribute('transform', 'translate(' + dx.toFixed(2) + ',0) rotate(' + ang.toFixed(2) + ' 610 222)');
    } else {
      E.bell.removeAttribute('transform');
    }

    /* ---- legs ---- */
    var footA = legFoot(HIP_A, S.phase);
    var footB = legFoot(HIP_B, S.phase + Math.PI);
    E.legA.setAttribute('d', legPath(HIP_A, footA));
    E.legB.setAttribute('d', legPath(HIP_B, footB));
    E.footA.setAttribute('transform', 'translate(' + footA.x.toFixed(1) + ',' + footA.y.toFixed(1) + ') rotate(' + (Math.sin(S.phase) * 9).toFixed(1) + ')');
    E.footB.setAttribute('transform', 'translate(' + footB.x.toFixed(1) + ',' + footB.y.toFixed(1) + ') rotate(' + (Math.sin(S.phase + Math.PI) * 9).toFixed(1) + ')');

    /* ---- wing flap ---- */
    var flapAmp = 7 + eff * 5 + (S.fedTimer > 0 ? 14 : 0) + S.panic * 8;
    var flap = Math.sin(S.phase * 2 + 0.6) * flapAmp;
    E.wing.setAttribute('transform', 'rotate(' + flap.toFixed(2) + ' 600 408)');

    /* ---- pouch wobble ---- */
    var bulge = 112
      + Math.sin(S.t * 6.3) * 7
      + Math.sin(S.phase * 2.2) * 10
      + (S.fedTimer > 0 ? 26 * Math.min(1, S.fedTimer * 2) : 0)
      + (S.bumpy ? Math.sin(S.phase * 8) * 6 : 0);
    E.sac.setAttribute('d',
      'M890,354 Q918,' + (354 + bulge).toFixed(1) + ' 1006,376 Q948,' +
      (376 + bulge * 0.3).toFixed(1) + ' 890,354 Z');

    /* ---- blink ---- */
    S.blinkTimer -= dt;
    if (S.blinkTimer <= 0) {
      S.blinkTimer = 2.4 + Math.random() * 4;
      S.blinkT = 0.16;
    }
    if (S.blinkT > 0) {
      S.blinkT -= dt;
      var k = Math.sin((1 - Math.max(0, S.blinkT) / 0.16) * Math.PI);
      E.eyelid.setAttribute('ry', (8.4 * k).toFixed(2));
    } else {
      E.eyelid.setAttribute('ry', '0');
    }

    /* ---- planks ---- */
    E.planks.setAttribute('transform', 'translate(' + (-(S.scroll % PITCH)).toFixed(1) + ',0)');

    /* ---- waves ---- */
    var wo = -(S.scroll * 0.55) % 2000;
    E.wave1.setAttribute('stroke-dashoffset', wo.toFixed(1));
    E.wave2.setAttribute('stroke-dashoffset', (wo * 0.7).toFixed(1));
    E.wave3.setAttribute('stroke-dashoffset', (wo * 1.3).toFixed(1));

    /* ---- clouds ---- */
    for (var i = 0; i < E.clouds.length; i++) {
      var c = E.clouds[i];
      var cx = parseFloat(c.dataset.x || '0');
      if (!c.dataset.x) {
        var tr = c.getAttribute('transform') || '';
        var m = /translate\(([-\d.]+),\s*([-\d.]+)\)/.exec(tr);
        if (m) {
          c.dataset.x = m[1];
          c.dataset.y = m[2];
          cx = parseFloat(m[1]);
        }
      }
      cx -= eff * (6 + i * 2.2) * dt * 4;
      if (cx < -260) cx += 1560;
      c.dataset.x = cx;
      c.setAttribute('transform', 'translate(' + cx.toFixed(1) + ',' + (c.dataset.y || '100') + ')');
    }

    /* ---- particle emission ---- */
    if (Math.random() < dt * (2 + eff * 8)) {
      // dust near feet
      addParticle({
        x: 460 + Math.random() * 200,
        y: GROUND_Y - 2,
        vx: -(60 + Math.random() * 110) - eff * 60,
        vy: -(20 + Math.random() * 50),
        g: 120,
        r: 2 + Math.random() * 3.5,
        color: S.bumpy ? '#9c7a4d' : '#e8cda2',
        life: 0.6 + Math.random() * 0.5
      });
    }
    if (Math.random() < dt * (0.5 + eff * 1.6) && S.stamina < 0.75) {
      // sweat
      addParticle({
        x: 850 + Math.random() * 30,
        y: 330 + Math.random() * 30,
        vx: 40 + Math.random() * 80,
        vy: -50 - Math.random() * 70,
        g: 260,
        r: 2.5 + Math.random() * 2,
        color: '#8dd6ff',
        life: 0.8
      });
    }
    if (Math.random() < dt * 0.35) {
      // feather
      addParticle({
        x: 380 + Math.random() * 320,
        y: 380 + Math.random() * 120,
        vx: -30 - Math.random() * 60,
        vy: -10 + Math.random() * 20,
        g: 14,
        r: 2 + Math.random() * 2.5,
        color: '#ffffff',
        life: 1.6 + Math.random() * 1.2
      });
    }

    updateParticles(dt);

    /* ---- UI ---- */
    var pct = Math.round(S.stamina * 100);
    E.staminaFill.style.width = pct + '%';
    E.staminaFill.classList.toggle('low', S.stamina < 0.35);
    E.staminaPct.textContent = pct + '%';
  }

  /* =========================================================
     LOOP
     ========================================================= */
  var lastNow = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    try {
      update(dt);
    } catch (err) {
      // 保底：避免任何意外打断动画循环
      console.warn('frame error', err);
    }
  }

  /* =========================================================
     INTERACTIONS
     ========================================================= */
  $('btnBell').addEventListener('click', function () {
    ringBellSound();
    S.bellShake = 1;
    S.panic = Math.min(1.4, S.panic + 0.9);
    S.sprint = Math.min(1, S.sprint + 0.35);
    // 受惊羽毛
    for (var i = 0; i < 7; i++) {
      addParticle({
        x: 780 + Math.random() * 120,
        y: 320 + Math.random() * 80,
        vx: 60 + Math.random() * 170,
        vy: -110 - Math.random() * 130,
        g: 230,
        r: 2.5 + Math.random() * 3,
        color: '#ffffff',
        life: 1.1
      });
    }
  });

  $('btnSprint').addEventListener('click', function () {
    if (S.stamina < 0.08) {
      S.panic = Math.min(1.2, S.panic + 0.2);
      return;
    }
    S.sprint = 1;
    S.panic = Math.min(1.2, S.panic + 0.25);
    for (var i = 0; i < 9; i++) {
      addParticle({
        x: 470 + Math.random() * 180,
        y: 600,
        vx: -(140 + Math.random() * 200),
        vy: -(30 + Math.random() * 90),
        g: 260,
        r: 3 + Math.random() * 4,
        color: S.bumpy ? '#9c7a4d' : '#e8cda2',
        life: 0.7
      });
    }
  });

  $('btnFeed').addEventListener('click', function () {
    feedSound();
    S.stamina = clamp(S.stamina + 0.42, 0, 1);
    S.fedTimer = 1.5;
    S.panic = Math.max(0, S.panic - 0.5);
    for (var i = 0; i < 12; i++) {
      addParticle({
        x: 960 + Math.random() * 40 - 20,
        y: 400 + Math.random() * 30,
        vx: -20 + Math.random() * 40,
        vy: -70 - Math.random() * 90,
        g: 130,
        r: 2.5 + Math.random() * 3.5,
        color: i % 2 ? '#7ce3c4' : '#ffd166',
        life: 1.2
      });
    }
  });

  $('btnRoad').addEventListener('click', function () {
    S.bumpy = !S.bumpy;
    this.classList.toggle('on', S.bumpy);
    this.textContent = S.bumpy ? '🪨 石子路' : '🛤️ 平路';
  });

  $('btnTheme').addEventListener('click', function () {
    applyTheme(THEMES[S.theme].next);
  });

  $('speed').addEventListener('input', function () {
    S.speedInput = parseFloat(this.value) / 100;
  });

  // 快捷键
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'b' || ev.key === 'B') $('btnBell').click();
    if (ev.key === ' ') { ev.preventDefault(); $('btnSprint').click(); }
    if (ev.key === 'f' || ev.key === 'F') $('btnFeed').click();
    if (ev.key === 't' || ev.key === 'T') $('btnTheme').click();
    if (ev.key === 'r' || ev.key === 'R') $('btnRoad').click();
  });

  /* =========================================================
     BOOT
     ========================================================= */
  applyTheme('day');
  E.staminaFill.style.width = '100%';
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
