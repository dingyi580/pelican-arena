<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bicycle Riding a Pelican</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #87CEEB;
            transition: background 2s ease;
        }
        body.night {
            background: #1a2a6c;
        }
        .stage {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .background-layer {
            position: absolute;
            width: 300vw;
            height: 100vh;
            background-repeat: repeat-x;
            animation: moveBackground 20s linear infinite;
        }
        .clouds {
            top: 20%;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100"><path d="M200,50 Q250,10 300,50 Q350,10 400,50 Q450,10 500,50" fill="white" opacity="0.8"/><path d="M600,50 Q650,10 700,50 Q750,10 800,50 Q850,10 900,50" fill="white" opacity="0.7"/></svg>');
            animation-duration: 60s;
        }
        .sea {
            bottom: 0;
            height: 150px;
            background: linear-gradient(to top, #0077be, #87CEEB);
        }
        body.night .sea {
            background: linear-gradient(to top, #001f3f, #1a2a6c);
        }
        .pelican {
            position: absolute;
            bottom: 150px;
            left: 50vw;
            transform: translateX(-50%);
            animation: pelicanWalk 2s ease-in-out infinite;
        }
        .bicycle {
            position: absolute;
            bottom: 220px;
            left: 50vw;
            transform: translateX(-50%);
            animation: bikeLean 2s ease-in-out infinite;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            padding: 15px 30px;
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            z-index: 10;
        }
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #ffd700;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .control-btn:hover {
            transform: scale(1.1);
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffeb3b;
            border-radius: 50%;
            opacity: 0.7;
            animation: float 4s ease-in-out infinite;
        }
        body.night .particle {
            background: #fff;
        }
        @keyframes moveBackground {
            from { transform: translateX(0); }
            to { transform: translateX(-50vw); }
        }
        @keyframes pelicanWalk {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(1deg); }
        }
        @keyframes bikeLean {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            50% { transform: translateX(-50%) rotate(-1deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); opacity: 0; }
            50% { transform: translateY(-30px); opacity: 0.8; }
        }
        @keyframes bellRing {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(15deg); }
            50% { transform: rotate(-15deg); }
            75% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>
    <div class="stage">
        <!-- Background Layers -->
        <div class="background-layer clouds"></div>
        <div class="background-layer sea"></div>
        
        <!-- Pelican and Bicycle -->
        <svg class="pelican" width="300" height="250" viewBox="0 0 300 250">
            <!-- Pelican Body -->
            <ellipse cx="150" cy="120" rx="70" ry="50" fill="#f5a623"/>
            <!-- Wings -->
            <path d="M150,120 Q100,80 80,130 Q100,160 150,120" fill="#d35400">
                <animateTransform attributeName="transform" type="rotate" values="0 150 120; -10 150 120; 0 150 120" dur="1s" repeatCount="indefinite"/>
            </path>
            <!-- Beak -->
            <path d="M210,110 L280,110 L270,130 L210,130 Z" fill="#fff"/>
            <!-- Pouch -->
            <ellipse cx="245" cy="125" rx="20" ry="15" fill="#ffdddd"/>
            <!-- Head -->
            <circle cx="220" cy="90" r="25" fill="#f5a623"/>
            <!-- Eye -->
            <circle cx="228" cy="85" r="5" fill="#000"/>
            <!-- Legs -->
            <rect x="120" y="170" width="15" height="40" fill="#d35400"/>
            <rect x="170" y="170" width="15" height="40" fill="#d35400"/>
            <!-- Feet -->
            <path d="M120,210 L100,220 L135,220 Z" fill="#d35400"/>
            <path d="M170,210 L150,220 L185,220 Z" fill="#d35400"/>
            <!-- Tail -->
            <path d="M80,120 Q50,100 40,140" stroke="#f5a623" stroke-width="8" fill="none"/>
        </svg>

        <svg class="bicycle" width="200" height="200" viewBox="0 0 200 200">
            <!-- Wheels -->
            <circle cx="50" cy="100" r="40" fill="none" stroke="#333" stroke-width="6"/>
            <circle cx="150" cy="100" r="40" fill="none" stroke="#333" stroke-width="6"/>
            <!-- Wheel Spokes -->
            <g stroke="#333" stroke-width="1">
                <line x1="50" y1="100" x2="50" y2="60"/>
                <line x1="50" y1="100" x2="50" y2="140"/>
                <line x1="50" y1="100" x2="20" y2="100"/>
                <line x1="50" y1="100" x2="80" y2="100"/>
                <line x1="150" y1="100" x2="150" y2="60"/>
                <line x1="150" y1="100" x2="150" y2="140"/>
                <line x1="150" y1="100" x2="120" y2="100"/>
                <line x1="150" y1="100" x2="180" y2="100"/>
            </g>
            <!-- Frame -->
            <line x1="50" y1="100" x2="100" y2="70" stroke="#333" stroke-width="6"/>
            <line x1="100" y1="70" x2="150" y2="100" stroke="#333" stroke-width="6"/>
            <line x1="50" y1="100" x2="150" y2="100" stroke="#333" stroke-width="6"/>
            <!-- Seat -->
            <rect x="90" y="60" width="20" height="15" fill="#333" rx="5"/>
            <!-- Handlebars -->
            <line x1="100" y1="70" x2="100" y2="40" stroke="#333" stroke-width="6"/>
            <line x1="100" y1="40" x2="80" y2="50" stroke="#333" stroke-width="4"/>
            <line x1="100" y1="40" x2="120" y2="50" stroke="#333" stroke-width="4"/>
            <!-- Bell -->
            <circle cx="85" cy="45" r="8" fill="#ffd700" id="bell"/>
            <!-- Chain -->
            <path d="M50,100 Q75,120 150,100" stroke="#333" stroke-width="3" fill="none"/>
            <!-- Pedals -->
            <circle cx="100" cy="100" r="8" fill="#333"/>
            <circle cx="100" cy="120" r="8" fill="#333">
                <animateTransform attributeName="transform" type="rotate" values="0 100 120; 360 100 120" dur="2s" repeatCount="indefinite"/>
            </circle>
        </svg>

        <!-- Interactive Controls -->
        <div class="controls">
            <button class="control-btn" id="bellBtn">🔔 Ring Bell</button>
            <div class="speed-control">
                <label>Speed:</label>
                <input type="range" id="speedSlider" min="1" max="5" value="2">
            </div>
            <button class="control-btn" id="themeBtn">🌙 Night</button>
        </div>

        <!-- Particles Container -->
        <div class="particles" id="particles"></div>
    </div>

    <script>
        // Get elements
        const bellBtn = document.getElementById('bellBtn');
        const speedSlider = document.getElementById('speedSlider');
        const themeBtn = document.getElementById('themeBtn');
        const body = document.body;
        const bell = document.getElementById('bell');
        const stage = document.querySelector('.stage');
        const particlesContainer = document.getElementById('particles');

        // Bell Sound Function
        function playBell() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);

            // Add bell animation
            bell.style.animation = 'bellRing 0.3s';
            setTimeout(() => bell.style.animation = '', 300);

            // Speed up pelican temporarily
            const pelican = document.querySelector('.pelican');
            pelican.style.animationDuration = '0.5s';
            setTimeout(() => pelican.style.animationDuration = '2s', 1000);
        }

        // Speed Control
        function updateSpeed() {
            const speed = speedSlider.value;
            const duration = 2 / speed;
            document.querySelector('.background-layer').style.animationDuration = `${60 / speed}s`;
            document.querySelector('.pelican').style.animationDuration = `${duration}s`;
            document.querySelector('.bicycle').style.animationDuration = `${duration}s`;
            // Update wheel animation
            const pedalAnim = document.querySelector('circle[cx="100"][cy="120"] animateTransform');
            pedalAnim.setAttribute('dur', `${2 / speed}s`);
        }

        // Theme Toggle
        let isNight = false;
        function toggleTheme() {
            isNight = !isNight;
            body.classList.toggle('night');
            themeBtn.textContent = isNight ? '☀️ Day' : '🌙 Night';
            // Create particles for night mode
            if (isNight) {
                createParticles(20);
            } else {
                particlesContainer.innerHTML = '';
            }
        }

        // Create particles
        function createParticles(count) {
            particlesContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDelay = `${Math.random() * 4}s`;
                particlesContainer.appendChild(particle);
            }
        }

        // Event Listeners
        bellBtn.addEventListener('click', playBell);
        speedSlider.addEventListener('input', updateSpeed);
        themeBtn.addEventListener('click', toggleTheme);

        // Initialize
        updateSpeed();
    </script>
</body>
</html>
