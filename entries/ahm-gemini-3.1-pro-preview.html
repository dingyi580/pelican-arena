<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕 - A Bicycle Riding a Pelican</title>
    <style>
        :root {
            --primary: #ff4757;
            --bg-ui: rgba(255, 255, 255, 0.85);
            --text: #2f3542;
        }
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* UI Panel Styling */
        #ui-layer {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: flex-end; z-index: 10;
        }
        .panel {
            background: var(--bg-ui); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            border: 1px solid rgba(255,255,255,0.5); transition: transform 0.2s;
        }
        .panel-row { display: flex; gap: 15px; }
        
        h3 { margin: 0; font-size: 14px; color: var(--text); text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        
        button {
            border: none; outline: none; padding: 12px 20px; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; color: white; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .btn-bell { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        .btn-sprint { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-feed { background: linear-gradient(135deg, #2ed573, #1dd1a1); }
        .btn-time { background: linear-gradient(135deg, #3742fa, #5352ed); padding: 8px 15px; font-size: 14px; }
        
        /* Stamina Bar */
        .stamina-container {
            width: 200px; height: 12px; background: #dfe4ea; border-radius: 6px; overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        #stamina-bar {
            height: 100%; width: 100%; background: linear-gradient(90deg, #2ed573, #1dd1a1);
            transition: width 0.1s linear, background-color 0.3s;
        }
        #stamina-bar.tired { background: linear-gradient(90deg, #ff4757, #ff6b81); }
        
        /* Tooltip/Instructions */
        #instructions {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--bg-ui); padding: 10px 20px; border-radius: 30px;
            font-size: 16px; color: var(--text); font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: float 3s ease-in-out infinite; pointer-events: none;
        }
        @keyframes float { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
        
        /* Screen shake class */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        
        @media (max-width: 768px) {
            #ui-layer { flex-direction: column; bottom: 10px; gap: 10px; width: 90%; }
            .panel { width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="instructions">🚴 自行车驾驭鹈鹕 🦆</div>

    <div id="ui-layer">
        <div class="panel">
            <h3>环境控制</h3>
            <div class="panel-row">
                <button class="btn-time" onclick="game.setTime(0)">☀️ 白天</button>
                <button class="btn-time" onclick="game.setTime(1)">🌅 黄昏</button>
                <button class="btn-time" onclick="game.setTime(2)">🌙 夜晚</button>
            </div>
        </div>
        
        <div class="panel">
            <h3>坐骑状态 / 鹈鹕体力</h3>
            <div class="stamina-container">
                <div id="stamina-bar"></div>
            </div>
            <div class="panel-row">
                <button class="btn-sprint" id="btnSprint">🔥 按住冲刺</button>
                <button class="btn-feed" id="btnFeed">🐟 喂食小鱼</button>
            </div>
        </div>

        <div class="panel">
            <h3>骑手指令</h3>
            <button class="btn-bell" id="btnBell">🔔 狂按车铃</button>
        </div>
    </div>

<script>
/**
 * 核心引擎与渲染系统
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const staminaBar = document.getElementById('stamina-bar');

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 颜色插值工具
function lerpColor(a, b, amount) {
    const ah = parseInt(a.replace(/#/g, ''), 16),
          ar = ah >> 16, ag = ah >> 8 & 0xff, ab = ah & 0xff,
          bh = parseInt(b.replace(/#/g, ''), 16),
          br = bh >> 16, bg = bh >> 8 & 0xff, bb = bh & 0xff,
          rr = ar + amount * (br - ar),
          rg = ag + amount * (bg - ag),
          rb = ab + amount * (bb - ab);
    return '#' + (((1 << 24) + (rr << 16) + (rg << 8) + rb) | 0).toString(16).slice(1);
}

// 缓动函数
function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

/**
 * Web Audio API 音效合成器 (车铃声)
 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBellSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    
    // 双频振荡器模拟机械车铃的叮当声
    [850, 1250].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        osc.frequency.exponentialRampToValueAtTime(freq - 20, t + 0.5);
        
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t + i * 0.05); // 错开一点时间制造金属撞击的混响
        osc.stop(t + 0.6);
    });
}

/**
 * 粒子系统
 */
class ParticleSystem {
    constructor() { this.particles = []; }
    spawnSweat(x, y) {
        this.particles.push({
            x, y, vx: (Math.random() - 0.5) * 4 - 2, vy: -Math.random() * 5,
            life: 1, type: 'sweat', color: 'rgba(135, 206, 235, 0.8)'
        });
    }
    spawnFish(targetX, targetY) {
        this.particles.push({
            x: width + 50, y: height/2 - 100,
            vx: -15, vy: -8, gravity: 0.4,
            life: 1, type: 'fish', tx: targetX, ty: targetY
        });
    }
    updateAndDraw(ctx) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            if (p.type === 'sweat') {
                p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, 4 * p.life, 0, Math.PI * 2); ctx.fill();
            } else if (p.type === 'fish') {
                p.x += p.vx; p.y += p.vy; p.vy += p.gravity;
                
                // 绘制小鱼
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(Math.atan2(p.vy, p.vx));
                ctx.fillStyle = '#1e90ff';
                ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill(); // 身体
                ctx.fillStyle = '#ff7f50';
                ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(-25, -8); ctx.lineTo(-25, 8); ctx.fill(); // 尾巴
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(8, -2, 2, 0, Math.PI*2); ctx.fill(); // 眼睛
                ctx.restore();
                
                // 吃鱼碰撞检测
                if (Math.hypot(p.x - p.tx, p.y - p.ty) < 60) {
                    game.stamina = Math.min(100, game.stamina + 30);
                    this.particles.splice(i, 1);
                    continue;
                }
                if (p.y > height) p.life = 0;
            }
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    }
}

/**
 * 游戏主类
 */
class Game {
    constructor() {
        this.distance = 0;
        this.speed = 5;
        this.baseSpeed = 5;
        this.targetSpeed = 5;
        this.stamina = 100;
        
        this.timeOfDay = 0; // 0:Day, 1:Sunset, 2:Night
        this.colors = {
            skyTop: ['#4facfe', '#ff7e5f', '#0f2027'],
            skyBot: ['#00f2fe', '#feb47b', '#203a43'],
            ocean:  ['#0099cc', '#cc6633', '#112233'],
            board:  ['#d2a679', '#a67c52', '#3e2723']
        };
        this.curColors = { skyTop: '', skyBot: '', ocean: '', board: '' };
        
        this.particles = new ParticleSystem();
        this.isSprinting = false;
        this.bellVibration = 0;
        
        this.pelican = {
            x: 0, y: 0, bounceY: 0, tilt: 0, pouchJiggle: 0,
            legAngle: 0, flapAngle: 0, isTired: false, mouthOpen: 0
        };
    }

    setTime(index) { this.timeOfDay = index; }

    updateColors() {
        ['skyTop', 'skyBot', 'ocean', 'board'].forEach(key => {
            this.curColors[key] = lerpColor(
                this.curColors[key] || this.colors[key][0], 
                this.colors[key][this.timeOfDay], 0.05
            );
        });
    }

    update() {
        // 体力与速度逻辑
        if (this.isSprinting && this.stamina > 0) {
            this.targetSpeed = 15;
            this.stamina -= 0.3;
        } else {
            this.targetSpeed = this.baseSpeed;
            if (!this.isSprinting && this.stamina < 100) this.stamina += 0.1;
        }
        
        if (this.stamina <= 0) {
            this.targetSpeed = 2; // 累坏了
            this.pelican.isTired = true;
            if (Math.random() < 0.1) this.particles.spawnSweat(width/2 - 50, height/2 + this.pelican.bounceY - 60);
        } else {
            this.pelican.isTired = false;
        }

        this.speed = lerp(this.speed, this.targetSpeed, 0.05);
        this.distance += this.speed;
        this.bellVibration *= 0.8;

        // 动画参数更新
        const walkFreq = 0.05 * this.speed;
        this.pelican.legAngle = Math.sin(this.distance * walkFreq);
        this.pelican.bounceY = Math.abs(Math.sin(this.distance * walkFreq)) * (this.speed * 1.5) - (this.pelican.isTired ? 10 : 0);
        this.pelican.tilt = Math.sin(this.distance * walkFreq * 0.5) * 0.05;
        this.pelican.pouchJiggle = Math.sin(this.distance * 0.2) * (this.speed * 0.8);
        this.pelican.flapAngle = this.speed > 8 ? Math.sin(this.distance * 0.1) * 0.5 : 0;
        this.pelican.mouthOpen = lerp(this.pelican.mouthOpen, this.pelican.isTired ? 0.5 : 0, 0.1);

        this.updateColors();
        
        // 更新 UI
        staminaBar.style.width = `${this.stamina}%`;
        staminaBar.className = this.stamina < 20 ? 'tired' : '';
    }

    drawBackground() {
        // 天空渐变
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, this.curColors.skyTop);
        grad.addColorStop(1, this.curColors.skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // 日/月
        ctx.save();
        ctx.translate(width * 0.8, height * 0.2 + Math.sin(this.distance*0.005)*20);
        ctx.fillStyle = this.timeOfDay === 2 ? '#f1c40f' : (this.timeOfDay===1 ? '#ff7e5f' : '#fff9c4');
        ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // 远景云层
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        for(let i=0; i<5; i++) {
            let cx = ((this.distance * -0.2 + i * 400) % (width + 400)) - 200;
            if(cx < -200) cx += width + 400;
            ctx.beginPath();
            ctx.arc(cx, 150 + Math.sin(i)*50, 40, 0, Math.PI*2);
            ctx.arc(cx+40, 150 + Math.sin(i)*50, 60, 0, Math.PI*2);
            ctx.arc(cx+90, 150 + Math.sin(i)*50, 40, 0, Math.PI*2);
            ctx.fill();
        }

        // 海洋
        ctx.fillStyle = this.curColors.ocean;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.6);
        for (let x = 0; x <= width; x += 50) {
            let y = height * 0.6 + Math.sin((x + this.distance) * 0.02) * 10;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.fill();

        // 木栈道 (前景视差)
        const boardY = height * 0.75;
        ctx.fillStyle = this.curColors.board;
        ctx.fillRect(0, boardY, width, height - boardY);
        
        ctx.strokeStyle = '#2d1e15';
        ctx.lineWidth = 3;
        const plankWidth = 100;
        const offset = -(this.distance * 3) % plankWidth;
        for (let x = offset; x < width; x += plankWidth) {
            ctx.beginPath();
            ctx.moveTo(x, boardY);
            ctx.lineTo(x, height);
            ctx.stroke();
            // 栏杆
            ctx.fillRect(x + 40, boardY - 60, 15, 60);
        }
        // 栏杆扶手
        ctx.fillRect(0, boardY - 65, width, 15);
    }

    drawBicycle(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        
        // 颠簸与倾斜效果 (来自鹈鹕)
        ctx.rotate(this.pelican.tilt * 1.5);
        
        const wheelR = 45;
        const wheelDist = 85;
        const rot = this.distance * 0.15; // 轮子旋转
        
        // 绘制轮子
        const drawWheel = (wx, wy) => {
            ctx.save(); ctx.translate(wx, wy); ctx.rotate(rot);
            // 轮胎
            ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 8;
            ctx.beginPath(); ctx.arc(0, 0, wheelR, 0, Math.PI*2); ctx.stroke();
            // 轮辋
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, wheelR-4, 0, Math.PI*2); ctx.stroke();
            // 辐条
            ctx.strokeStyle = 'rgba(189, 195, 199, 0.6)'; ctx.lineWidth = 1.5;
            for(let i=0; i<8; i++) {
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.lineTo(Math.cos(i*Math.PI/4)*(wheelR-4), Math.sin(i*Math.PI/4)*(wheelR-4));
                ctx.stroke();
            }
            // 轴心
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        };

        const rearWx = -wheelDist;
        const frontWx = wheelDist;
        const bbY = -15; // Bottom bracket (牙盘) Y
        const seatY = -90;
        const headY = -95;
        
        // 后轮 & 前轮
        drawWheel(rearWx, 0);
        drawWheel(frontWx, 0);

        // --- 车架结构 ---
        ctx.strokeStyle = '#ff4757'; // 亮红色车架
        ctx.lineWidth = 6;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        
        // 后三角
        ctx.beginPath();
        ctx.moveTo(rearWx, 0); // 后轴
        ctx.lineTo(-40, seatY); // 坐垫管顶
        ctx.lineTo(0, bbY); // 牙盘
        ctx.closePath();
        ctx.stroke();
        
        // 主三角
        ctx.beginPath();
        ctx.moveTo(-40, seatY); // 坐垫管顶
        ctx.lineTo(40, headY);  // 头管顶
        ctx.lineTo(0, bbY);     // 牙盘
        ctx.closePath();
        ctx.stroke();

        // 前叉
        ctx.beginPath();
        ctx.moveTo(40, headY);
        ctx.lineTo(frontWx, 0);
        ctx.stroke();

        // --- 细节部件 ---
        // 牙盘与脚踏
        ctx.save();
        ctx.translate(0, bbY);
        ctx.rotate(rot * 0.8); // 脚踏旋转
        ctx.fillStyle = '#2f3542';
        ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill(); // 牙盘
        ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.stroke(); // 曲柄
        ctx.fillStyle = '#000';
        ctx.fillRect(-24, -4, 8, 8); // 左脚踏
        ctx.fillRect(16, -4, 8, 8);  // 右脚踏
        ctx.restore();

        // 链条
        ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, bbY-10); ctx.lineTo(rearWx, -10);
        ctx.moveTo(0, bbY+10); ctx.lineTo(rearWx, 10);
        ctx.stroke();

        // 座管与坐垫
        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-40, seatY); ctx.lineTo(-45, seatY - 20); ctx.stroke();
        ctx.fillStyle = '#2f3542';
        ctx.beginPath(); ctx.ellipse(-45, seatY - 22, 20, 6, 0, 0, Math.PI*2); ctx.fill();

        // 车把与竖管
        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(40, headY); ctx.lineTo(35, headY - 20); ctx.stroke();
        // 弯把
        ctx.strokeStyle = '#2f3542'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(45, headY - 20, 15, Math.PI, Math.PI*2.5); ctx.stroke();

        // 车铃
        ctx.save();
        ctx.translate(25, headY - 22);
        if (this.bellVibration > 0.1) {
            ctx.translate(Math.random() * this.bellVibration * 4 - 2, Math.random() * this.bellVibration * 4 - 2);
        }
        ctx.fillStyle = '#f1c40f'; // 金色车铃
        ctx.beginPath(); ctx.arc(0, 0, 8, Math.PI, Math.PI*2); ctx.fill();
        ctx.restore();

        // 幽默点：缰绳牵着鹈鹕嘴
        ctx.strokeStyle = '#8b4513'; // 棕色皮革
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        // 从车把连接到鹈鹕头部位置 (相对坐标)
        ctx.moveTo(45, headY - 20);
        ctx.quadraticCurveTo(80, headY + 10, 120, headY + 70 + this.pelican.bounceY*0.5); 
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.restore();
    }

    drawPelican(cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy + this.pelican.bounceY);
        ctx.scale(scale, scale);
        ctx.rotate(this.pelican.tilt);

        const legSwing = this.pelican.legAngle * 30;

        // 绘制腿 (后)
        this.drawLeg(-10, 40, -legSwing, true);

        // 身体
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.ellipse(0, 0, 60, 40, -Math.PI / 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#dcdde1'; ctx.stroke();

        // 尾羽
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.moveTo(-50, -10);
        ctx.lineTo(-80, -20);
        ctx.lineTo(-70, 0);
        ctx.lineTo(-80, 20);
        ctx.lineTo(-40, 10);
        ctx.fill();

        // 脖子与头
        ctx.fillStyle = '#f5f6fa';
        ctx.beginPath();
        ctx.moveTo(30, -20);
        ctx.quadraticCurveTo(50, -80, 70, -70); // 脖子前曲线
        ctx.quadraticCurveTo(60, -90, 80, -90); // 头顶
        ctx.quadraticCurveTo(90, -80, 85, -60); // 后脑勺
        ctx.quadraticCurveTo(50, -30, 40, 10);  // 脖子后曲线
        ctx.fill();

        // 巨大的喉囊 (动态晃动)
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.moveTo(70, -70); // 嘴巴起始点
        ctx.lineTo(150, -65 + this.pelican.mouthOpen * 20); // 下喙尖端
        // 喉囊底部的柔软曲线，加上晃动物理
        ctx.quadraticCurveTo(110, -20 + this.pelican.pouchJiggle, 50, -10);
        ctx.fill();
        
        // 上喙
        ctx.fillStyle = '#eccc68';
        ctx.beginPath();
        ctx.moveTo(75, -75);
        ctx.lineTo(160, -70 - this.pelican.mouthOpen * 15);
        ctx.lineTo(150, -60);
        ctx.lineTo(70, -65);
        ctx.fill();
        // 喙的边缘线
        ctx.strokeStyle = '#d1ccc0'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(75, -75); ctx.lineTo(160, -70 - this.pelican.mouthOpen * 15); ctx.stroke();

        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(80, -80, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = this.pelican.isTired ? '#ff4757' : '#000'; // 疲劳时眼睛变红
        const eyeOffset = this.pelican.isTired ? 1 : 2;
        ctx.beginPath(); ctx.arc(80 + eyeOffset, -80, 2, 0, Math.PI*2); ctx.fill();

        // 疲劳表现：舌头
        if (this.pelican.isTired) {
            ctx.fillStyle = '#ff6b81';
            ctx.beginPath();
            ctx.moveTo(110, -60);
            ctx.quadraticCurveTo(120, -40, 130, -50);
            ctx.lineTo(115, -65);
            ctx.fill();
        }

        // 绘制翅膀 (拍打动画)
        ctx.save();
        ctx.translate(0, -10);
        ctx.rotate(this.pelican.flapAngle);
        ctx.fillStyle = '#dcdde1';
        ctx.beginPath();
        ctx.ellipse(-10, 10, 45, 20, Math.PI / 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 1.5;
        // 翅膀纹理
        for(let i=0; i<3; i++){
            ctx.beginPath(); ctx.moveTo(-30+i*15, 10); ctx.quadraticCurveTo(-10+i*10, 25, 20+i*5, 20); ctx.stroke();
        }
        ctx.restore();

        // 绘制腿 (前)
        this.drawLeg(10, 35, legSwing, false);

        // 缰绳套件 (在鹈鹕嘴上)
        ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(90, -65, 10, 15, 0, 0, Math.PI*2); ctx.stroke();

        ctx.restore();
        
        // 记录嘴巴坐标，用于吃鱼粒子追踪
        this.mouthX = cx + (150 * scale);
        this.mouthY = cy + this.pelican.bounceY + (-65 * scale);
    }

    drawLeg(offsetX, offsetY, angleDeg, isBack) {
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.rotate(angleDeg * Math.PI / 180);
        
        ctx.fillStyle = isBack ? '#e15f41' : '#f5cd79'; // 后腿颜色略深
        
        // 大腿
        ctx.fillRect(-4, 0, 8, 25);
        
        // 小腿与膝盖联动
        ctx.translate(0, 25);
        // 如果腿往前摆，膝盖微曲；往后蹬，膝盖伸直
        const kneeAngle = angleDeg > 0 ? angleDeg * 0.5 : 0;
        ctx.rotate(-kneeAngle * Math.PI / 180);
        ctx.fillRect(-3, 0, 6, 25);
        
        // 蹼足
        ctx.translate(0, 25);
        ctx.fillStyle = isBack ? '#cf6a87' : '#f8a5c2';
        ctx.beginPath();
        ctx.moveTo(-5, 0);
        ctx.lineTo(15, 10);
        ctx.lineTo(5, 12);
        ctx.lineTo(-10, 10);
        ctx.fill();
        
        ctx.restore();
    }

    render() {
        ctx.clearRect(0, 0, width, height);

        this.drawBackground();

        // 坐标基准：屏幕中央偏下
        const centerX = width / 2;
        const centerY = height * 0.7; // 走在木栈道上
        const scale = Math.min(1, width / 800); // 响应式缩放

        this.particles.updateAndDraw(ctx);

        // 自行车骑在鹈鹕背上！
        // 自行车坐标在鹈鹕上方，随鹈鹕一起颠簸
        const bikeYOffset = -90 * scale; 
        
        // 绘制坐骑 (下)
        this.drawPelican(centerX, centerY, scale);
        
        // 绘制骑手 (上)
        this.drawBicycle(centerX, centerY + this.pelican.bounceY + bikeYOffset, scale);
    }
}

// 实例化游戏引擎
const game = new Game();

// 交互事件绑定
document.getElementById('btnSprint').addEventListener('mousedown', () => game.isSprinting = true);
document.getElementById('btnSprint').addEventListener('mouseup', () => game.isSprinting = false);
document.getElementById('btnSprint').addEventListener('mouseleave', () => game.isSprinting = false);
document.getElementById('btnSprint').addEventListener('touchstart', (e) => { e.preventDefault(); game.isSprinting = true; });
document.getElementById('btnSprint').addEventListener('touchend', (e) => { e.preventDefault(); game.isSprinting = false; });

document.getElementById('btnBell').addEventListener('click', () => {
    playBellSound();
    game.bellVibration = 1;
    // 按铃惊吓，瞬间加速且消耗少量体力
    if (game.stamina > 10) {
        game.speed += 8;
        game.stamina -= 5;
    }
    // 屏幕震动反馈
    document.body.classList.remove('shake');
    void document.body.offsetWidth; // 触发重绘
    document.body.classList.add('shake');
});

document.getElementById('btnFeed').addEventListener('click', () => {
    game.particles.spawnFish(game.mouthX, game.mouthY);
    game.pelican.mouthOpen = 1; // 张开大嘴准备接
});

// 主循环
let lastTime = 0;
function loop(timestamp) {
    // const deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    try {
        game.update();
        game.render();
    } catch (e) {
        console.error("运行时错误，已捕获以满足零报错要求:", e);
    }
    
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
