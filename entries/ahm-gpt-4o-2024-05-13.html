<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Bicycle Riding a Pelican</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(#87CEEB, #ffffff);
    }
    #canvas {
      display: block;
      margin: 0 auto;
      background: linear-gradient(#FFD700, #8B4513);
    }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
    }
    .controls button, .controls input {
      margin-bottom: 10px;
      padding: 10px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    #speed {
      appearance: none;
      width: 100%;
      background: #ddd;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button id="bell">Ring Bell</button>
    <input id="speed" type="range" min="1" max="10" value="5">
    <button id="feed">Feed Pelican</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let speed = 5;
    let pelicanY = canvas.height / 2;
    let pelicanDY = 0;
    let bellSound, feedSound;

    function loadSounds() {
      bellSound = new AudioContext();
      feedSound = new AudioContext();
    }

    function playBellSound() {
      const oscillator = bellSound.createOscillator();
      const gainNode = bellSound.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(bellSound.destination);

      oscillator.type = 'triangle';
      oscillator.frequency.setValueAtTime(850, bellSound.currentTime);
      gainNode.gain.setValueAtTime(0.5, bellSound.currentTime);
  
      oscillator.start(bellSound.currentTime);
      oscillator.stop(bellSound.currentTime + 0.5);
    }

    function playFeedSound() {
      const oscillator = feedSound.createOscillator();
      const gainNode = feedSound.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(feedSound.destination);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(440, feedSound.currentTime);
      gainNode.gain.setValueAtTime(0.5, feedSound.currentTime);
  
      oscillator.start(feedSound.currentTime);
      oscillator.stop(feedSound.currentTime + 0.5);
    }

    function drawPelican() {
      ctx.save();
      ctx.translate(canvas.width / 2, pelicanY);
      
      // Pelican Body
      ctx.beginPath();
      ctx.fillStyle = '#FFD700';
      ctx.ellipse(0, 0, 100, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pelican Head
      ctx.beginPath();
      ctx.fillStyle = '#FFD700';
      ctx.arc(-60, -20, 20, 0, Math.PI * 2, true);
      ctx.fill();

      // Pelican Beak
      ctx.beginPath();
      ctx.fillStyle = '#FFA500';
      ctx.moveTo(-80, -20);
      ctx.lineTo(-120, -10);
      ctx.lineTo(-80, 0);
      ctx.fill();

      // Pelican Legs
      ctx.beginPath();
      ctx.fillStyle = '#A0522D';
      ctx.moveTo(-20, 20);
      ctx.lineTo(-10, 50);
      ctx.lineTo(-30, 50);
      ctx.moveTo(20, 20);
      ctx.lineTo(30, 50);
      ctx.lineTo(10, 50);
      ctx.fill();

      ctx.restore();
    }

    function drawBike() {
      ctx.save();
      
      const bikeX = canvas.width / 2;
      const bikeY = pelicanY - 60;
      
      // Bike Frame
      ctx.beginPath();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 5;
      ctx.moveTo(bikeX, bikeY);
      ctx.lineTo(bikeX - 40, bikeY + 20);
      ctx.lineTo(bikeX + 40, bikeY + 20);
      ctx.lineTo(bikeX, bikeY - 20);
      ctx.closePath();
      ctx.stroke();
      
      // Bike Wheels
      ctx.beginPath();
      ctx.arc(bikeX - 50, bikeY + 20, 20, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bikeX + 50, bikeY + 20, 20, 0, Math.PI * 2);
      ctx.stroke();
      
      // Handlebar
      ctx.beginPath();
      ctx.moveTo(bikeX, bikeY - 20);
      ctx.lineTo(bikeX - 20, bikeY - 40);
      ctx.lineTo(bikeX + 20, bikeY - 40);
      ctx.closePath();
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pelicanY += pelicanDY;
      pelicanDY += (Math.random() - 0.5) * 0.2 - 0.01 * speed;

      drawPelican();
      drawBike();

      requestAnimationFrame(animate);
    }

    document.getElementById('bell').addEventListener('click', () => {
      playBellSound();
      pelicanDY -= 5;
    });

    document.getElementById('feed').addEventListener('click', () => {
      playFeedSound();
      pelicanDY += 20;
    });

    document.getElementById('speed').addEventListener('input', (e) => {
      speed = e.target.value;
    });

    loadSounds();
    animate();
  </script>
</body>
</html>
