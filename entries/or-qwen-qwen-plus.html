<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bicycle Riding a Pelican</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .header {
            text-align: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #a1c4fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 0.95rem;
            opacity: 0.85;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            padding: 12px 20px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn i {
            font-style: normal;
        }

        .speed-control {
            position: relative;
            width: 160px;
        }

        .speed-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4facfe;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }

        .speed-label {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.9;
        }

        .status-bar {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-item {
            margin-bottom: 4px;
        }

        .status-value {
            font-weight: 600;
            color: #4facfe;
        }

        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        .bell-effect {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: bellPulse 0.6s ease-out forwards;
            z-index: 20;
        }

        @keyframes bellPulse {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .floating {
            animation: float 4s ease-in-out infinite;
        }

        .footer {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            opacity: 0.6;
            z-index: 10;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .controls {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px;
                width: 90%;
            }
            
            .control-btn {
                width: 48px;
                height: 48px;
                font-size: 1rem;
            }
            
            .speed-control {
                width: 120px;
            }
            
            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚲 Bicycle Riding a Pelican</h1>
        <p class="subtitle">A delightfully absurd scene: A fully detailed bicycle is riding a pelican — not the other way around! Watch the dynamic animation and interact with controls.</p>
    </div>

    <div class="container">
        <svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Background layers -->
            <defs>
                <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#87CEEB"/>
                    <stop offset="100%" stop-color="#E0F7FA"/>
                </linearGradient>
                <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4FC3F7"/>
                    <stop offset="100%" stop-color="#0288D1"/>
                </linearGradient>
                <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
                </filter>
                <pattern id="wood" patternUnits="userSpaceOnUse" width="20" height="20">
                    <rect width="20" height="20" fill="#8D6E63"/>
                    <path d="M0,0 L20,20 M20,0 L0,20" stroke="#A1887F" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- Sky -->
            <rect width="800" height="500" fill="url(#skyGradient)" />

            <!-- Clouds -->
            <g id="clouds">
                <ellipse cx="100" cy="80" rx="40" ry="20" fill="rgba(255,255,255,0.8)" />
                <ellipse cx="140" cy="70" rx="50" ry="25" fill="rgba(255,255,255,0.8)" />
                <ellipse cx="180" cy="80" rx="40" ry="20" fill="rgba(255,255,255,0.8)" />
                
                <ellipse cx="600" cy="120" rx="35" ry="18" fill="rgba(255,255,255,0.75)" />
                <ellipse cx="635" cy="110" rx="45" ry="22" fill="rgba(255,255,255,0.75)" />
                <ellipse cx="670" cy="120" rx="35" ry="18" fill="rgba(255,255,255,0.75)" />
            </g>

            <!-- Distant sea -->
            <path d="M0,320 Q200,300 400,320 T800,320 L800,500 L0,500 Z" fill="url(#waterGradient)" />

            <!-- Wooden boardwalk -->
            <g id="boardwalk">
                <rect x="0" y="320" width="800" height="40" fill="url(#wood)" />
                <line x1="0" y1="320" x2="800" y2="320" stroke="#5D4037" stroke-width="2" />
                <line x1="0" y1="360" x2="800" y2="360" stroke="#5D4037" stroke-width="2" />
                <!-- Board lines -->
                <g stroke="#795548" stroke-width="1">
                    <line x1="0" y1="340" x2="800" y2="340" />
                    <line x1="20" y1="320" x2="20" y2="360" />
                    <line x1="60" y1="320" x2="60" y2="360" />
                    <line x1="100" y1="320" x2="100" y2="360" />
                    <line x1="140" y1="320" x2="140" y2="360" />
                    <line x1="180" y1="320" x2="180" y2="360" />
                    <line x1="220" y1="320" x2="220" y2="360" />
                    <line x1="260" y1="320" x2="260" y2="360" />
                    <line x1="300" y1="320" x2="300" y2="360" />
                    <line x1="340" y1="320" x2="340" y2="360" />
                    <line x1="380" y1="320" x2="380" y2="360" />
                    <line x1="420" y1="320" x2="420" y2="360" />
                    <line x1="460" y1="320" x2="460" y2="360" />
                    <line x1="500" y1="320" x2="500" y2="360" />
                    <line x1="540" y1="320" x2="540" y2="360" />
                    <line x1="580" y1="320" x2="580" y2="360" />
                    <line x1="620" y1="320" x2="620" y2="360" />
                    <line x1="660" y1="320" x2="660" y2="360" />
                    <line x1="700" y1="320" x2="700" y2="360" />
                    <line x1="740" y1="320" x2="740" y2="360" />
                    <line x1="780" y1="320" x2="780" y2="360" />
                </g>
            </g>

            <!-- Pelican (base layer) -->
            <g id="pelican" transform="translate(300, 280)">
                <!-- Body -->
                <ellipse cx="0" cy="0" rx="60" ry="35" fill="#F5F5DC" filter="url(#shadow)" />
                
                <!-- Head -->
                <circle cx="65" cy="-15" r="22" fill="#F5F5DC" />
                
                <!-- Beak -->
                <path d="M65,-15 L125,-25 L115,10 L65,-15 Z" fill="#FFB347" />
                <path d="M115,10 L125,-25 L120,-10 Z" fill="#FF9E2C" />
                
                <!-- Eye -->
                <circle cx="75" cy="-20" r="4" fill="#333" />
                <circle cx="77" cy="-22" r="1.5" fill="#fff" />
                
                <!-- Throat pouch -->
                <path id="pouch" d="M45,5 Q65,45 85,5 Q75,25 65,5 Z" fill="#FFCCBC" />
                
                <!-- Wings -->
                <path id="left-wing" d="M-20,0 Q-60,-30 -40,-60 Q-20,-40 -10,-20 Z" fill="#E0E0E0" />
                <path id="right-wing" d="M20,0 Q60,-30 40,-60 Q20,-40 10,-20 Z" fill="#E0E0E0" />
                
                <!-- Legs & feet -->
                <line x1="0" y1="35" x2="-12" y2="85" stroke="#FFB347" stroke-width="6" stroke-linecap="round" />
                <line x1="0" y1="35" x2="12" y2="85" stroke="#FFB347" stroke-width="6" stroke-linecap="round" />
                <path d="M-12,85 L-25,95 L-15,95 Z" fill="#FFB347" />
                <path d="M12,85 L25,95 L15,95 Z" fill="#FFB347" />
                
                <!-- Feet webbing -->
                <path d="M-25,95 Q-20,100 -15,95" fill="none" stroke="#FF9E2C" stroke-width="2" />
                <path d="M15,95 Q20,100 25,95" fill="none" stroke="#FF9E2C" stroke-width="2" />
            </g>

            <!-- Bicycle (riding on pelican) -->
            <g id="bicycle" transform="translate(300, 220)">
                <!-- Frame -->
                <path d="M-30,0 L0,-40 L30,0 L15,20 L-15,20 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" />
                
                <!-- Front wheel -->
                <circle cx="30" cy="0" r="18" fill="none" stroke="#333" stroke-width="3" />
                <!-- Front wheel spokes -->
                <g stroke="#666" stroke-width="1">
                    <line x1="30" y1="0" x2="30" y2="-18" />
                    <line x1="30" y1="0" x2="42.7" y2="-12.7" />
                    <line x1="30" y1="0" x2="48.5" y2="0" />
                    <line x1="30" y1="0" x2="42.7" y2="12.7" />
                    <line x1="30" y1="0" x2="30" y2="18" />
                    <line x1="30" y1="0" x2="17.3" y2="12.7" />
                    <line x1="30" y1="0" x2="11.5" y2="0" />
                    <line x1="30" y1="0" x2="17.3" y2="-12.7" />
                </g>
                
                <!-- Rear wheel -->
                <circle cx="-30" cy="0" r="18" fill="none" stroke="#333" stroke-width="3" />
                <!-- Rear wheel spokes -->
                <g stroke="#666" stroke-width="1">
                    <line x1="-30" y1="0" x2="-30" y2="-18" />
                    <line x1="-30" y1="0" x2="-17.3" y2="-12.7" />
                    <line x1="-30" y1="0" x2="-11.5" y2="0" />
                    <line x1="-30" y1="0" x2="-17.3" y2="12.7" />
                    <line x1="-30" y1="0" x2="-30" y2="18" />
                    <line x1="-30" y1="0" x2="-42.7" y2="12.7" />
                    <line x1="-30" y1="0" x2="-48.5" y2="0" />
                    <line x1="-30" y1="0" x2="-42.7" y2="-12.7" />
                </g>
                
                <!-- Seat post -->
                <line x1="0" y1="-40" x2="0" y2="-70" stroke="#333" stroke-width="4" />
                
                <!-- Seat -->
                <ellipse cx="0" cy="-75" rx="15" ry="6" fill="#8BC34A" />
                
                <!-- Handlebars -->
                <path d="M30,-20 Q35,-35 45,-35 Q55,-35 60,-20" fill="none" stroke="#333" stroke-width="3" />
                <circle cx="60" cy="-20" r="4" fill="#FF5252" />
                
                <!-- Chain -->
                <path d="M-15,15 Q0,5 15,15" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-dasharray="4,4" />
                
                <!-- Pedals -->
                <line x1="-15" y1="15" x2="-25" y2="25" stroke="#FF9800" stroke-width="3" />
                <line x1="15" y1="15" x2="25" y2="25" stroke="#FF9800" stroke-width="3" />
                
                <!-- Brake cables -->
                <path d="M30,-15 Q35,-10 40,-15" fill="none" stroke="#9E9E9E" stroke-width="1" />
                <path d="M-30,-15 Q-35,-10 -40,-15" fill="none" stroke="#9E9E9E" stroke-width="1" />
            </g>

            <!-- Connection elements -->
            <g id="connections">
                <!-- Reins from handlebars to pelican's beak -->
                <path d="M60,-20 Q85,-25 110,-25" fill="none" stroke="#8D6E63" stroke-width="2" stroke-dasharray="3,2" />
                <path d="M60,-20 Q85,-15 110,-15" fill="none" stroke="#8D6E63" stroke-width="2" stroke-dasharray="3,2" />
                
                <!-- Saddle straps to pelican back -->
                <path d="M-10,-75 Q-10,-50 -10,-30" fill="none" stroke="#8D6E63" stroke-width="2" />
                <path d="M10,-75 Q10,-50 10,-30" fill="none" stroke="#8D6E63" stroke-width="2" />
            </g>

            <!-- Particles -->
            <g id="particles"></g>
        </svg>

        <div class="controls">
            <button id="bellBtn" class="control-btn" title="Ring the bell!">
                🔔
            </button>
            
            <div class="speed-control">
                <div class="speed-label">SPEED</div>
                <input type="range" min="0.3" max="2.0" step="0.1" value="1.0" class="speed-slider" id="speedSlider">
            </div>
            
            <button id="feedBtn" class="control-btn" title="Feed the pelican a fish">
                🐟
            </button>
            
            <button id="timeBtn" class="control-btn" title="Toggle time of day">
                🌞
            </button>
        </div>

        <div class="status-bar">
            <div class="status-item">Speed: <span id="speedValue" class="status-value">1.0x</span></div>
            <div class="status-item">Energy: <span id="energyValue" class="status-value">100%</span></div>
            <div class="status-item">Time: <span id="timeValue" class="status-value">Day</span></div>
        </div>

        <div class="footer">
            Cross-Generational Frontend Challenge • Single-File Interactive Art
        </div>
    </div>

    <script>
        // Audio context setup for bell sound
        let audioContext = null;
        let isPlaying = false;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBellSound() {
            if (!audioContext) initAudio();
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Bell-like sound: high frequency with fast decay
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(440, audioContext.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        }

        // DOM elements
        const scene = document.getElementById('scene');
        const pelican = document.getElementById('pelican');
        const bicycle = document.getElementById('bicycle');
        const pouch = document.getElementById('pouch');
        const leftWing = document.getElementById('left-wing');
        const rightWing = document.getElementById('right-wing');
        const bellBtn = document.getElementById('bellBtn');
        const feedBtn = document.getElementById('feedBtn');
        const timeBtn = document.getElementById('timeBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const energyValue = document.getElementById('energyValue');
        const timeValue = document.getElementById('timeValue');
        const particlesContainer = document.getElementById('particles');

        // State variables
        let speed = 1.0;
        let energy = 100;
        let timeOfDay = 'day'; // 'day', 'sunset', 'night'
        let isFeeding = false;
        let bellEffects = [];
        let particles = [];
        let lastTimestamp = 0;
        let frameCount = 0;

        // Initialize state
        speedValue.textContent = `${speed.toFixed(1)}x`;
        energyValue.textContent = `${Math.round(energy)}%`;

        // Time of day effects
        function updateTimeOfDay() {
            const sky = scene.querySelector('rect');
            const clouds = scene.querySelector('#clouds');
            const water = scene.querySelector('path[d*="Q200,300"]');
            
            switch(timeOfDay) {
                case 'day':
                    sky.setAttribute('fill', 'url(#skyGradient)');
                    clouds.setAttribute('opacity', '0.8');
                    water.setAttribute('fill', 'url(#waterGradient)');
                    timeValue.textContent = 'Day';
                    break;
                case 'sunset':
                    sky.setAttribute('fill', 'url(#sunsetGradient)');
                    clouds.setAttribute('opacity', '0.9');
                    water.setAttribute('fill', '#FF9800');
                    timeValue.textContent = 'Sunset';
                    break;
                case 'night':
                    sky.setAttribute('fill', '#0d1b2a');
                    clouds.setAttribute('opacity', '0.3');
                    water.setAttribute('fill', '#1b263b');
                    timeValue.textContent = 'Night';
                    break;
            }
        }

        // Create gradient for sunset
        const defs = scene.querySelector('defs');
        const sunsetGradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
        sunsetGradient.setAttribute('id', 'sunsetGradient');
        sunsetGradient.setAttribute('x1', '0%');
        sunsetGradient.setAttribute('y1', '0%');
        sunsetGradient.setAttribute('x2', '0%');
        sunsetGradient.setAttribute('y2', '100%');
        
        const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop1.setAttribute('offset', '0%');
        stop1.setAttribute('stop-color', '#FF9800');
        
        const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop2.setAttribute('offset', '100%');
        stop2.setAttribute('stop-color', '#4A5568');
        
        sunsetGradient.appendChild(stop1);
        sunsetGradient.appendChild(stop2);
        defs.appendChild(sunsetGradient);

        // Create particle effect
        function createParticle(x, y, color = '#FFD700') {
            const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            particle.setAttribute('cx', x);
            particle.setAttribute('cy', y);
            particle.setAttribute('r', Math.random() * 3 + 1);
            particle.setAttribute('fill', color);
            particle.setAttribute('opacity', '0.8');
            
            // Random direction and speed
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 2 + 1;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            particles.push({
                element: particle,
                x: parseFloat(x),
                y: parseFloat(y),
                vx: vx,
                vy: vy,
                life: 60 + Math.random() * 60,
                maxLife: 60 + Math.random() * 60
            });
            
            particlesContainer.appendChild(particle);
        }

        // Create bell effect
        function createBellEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'bell-effect';
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;
            document.body.appendChild(effect);
            
            bellEffects.push(effect);
            
            // Remove after animation
            setTimeout(() => {
                if (effect.parentNode) {
                    effect.parentNode.removeChild(effect);
                }
                const index = bellEffects.indexOf(effect);
                if (index > -1) bellEffects.splice(index, 1);
            }, 600);
        }

        // Animation loop
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 16; // Normalize to ~60fps
            lastTimestamp = timestamp;
            
            frameCount++;
            
            // Update speed from slider
            speed = parseFloat(speedSlider.value);
            speedValue.textContent = `${speed.toFixed(1)}x`;
            
            // Pelican animation
            const pelicanY = 280 + Math.sin(frameCount * 0.05 * speed) * 3;
            const pelicanX = 300 + Math.sin(frameCount * 0.03 * speed) * 2;
            
            // Wing flapping
            const wingAngle = Math.sin(frameCount * 0.15 * speed) * 15;
            leftWing.setAttribute('transform', `rotate(${wingAngle} -20 0)`);
            rightWing.setAttribute('transform', `rotate(${-wingAngle} 20 0)`);
            
            // Pouch bounce
            const pouchScale = 1 + Math.sin(frameCount * 0.2 * speed) * 0.1;
            pouch.setAttribute('transform', `scale(${pouchScale})`);
            
            // Pelican running motion
            const runOffset = Math.sin(frameCount * 0.3 * speed) * 4;
            pelican.setAttribute('transform', `translate(${pelicanX + runOffset}, ${pelicanY})`);
            
            // Bicycle animation
            const bikeY = 220 + Math.sin(frameCount * 0.05 * speed) * 4;
            const bikeX = 300 + Math.sin(frameCount * 0.03 * speed) * 2;
            
            // Bike tilt
            const tilt = Math.sin(frameCount * 0.1 * speed) * 3;
            bicycle.setAttribute('transform', `translate(${bikeX}, ${bikeY}) rotate(${tilt})`);
            
            // Pedal rotation
            const pedalRotation = (frameCount * 5 * speed) % 360;
            const pedalGroup = document.querySelector('#bicycle');
            // We'll simulate pedal movement by updating the pedal positions
            const leftPedal = document.querySelector('#bicycle line:nth-child(11)');
            const rightPedal = document.querySelector('#bicycle line:nth-child(12)');
            
            if (leftPedal && rightPedal) {
                // Rotate pedals
                leftPedal.setAttribute('transform', `rotate(${pedalRotation} -15 15)`);
                rightPedal.setAttribute('transform', `rotate(${pedalRotation} 15 15)`);
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                p.element.setAttribute('cx', p.x);
                p.element.setAttribute('cy', p.y);
                p.element.setAttribute('opacity', p.life / p.maxLife);
                
                if (p.life <= 0) {
                    p.element.remove();
                    particles.splice(i, 1);
                }
            }
            
            // Energy management
            if (frameCount % 100 === 0 && speed > 1.0) {
                energy = Math.max(0, energy - 2);
                energyValue.textContent = `${Math.round(energy)}%`;
            }
            
            // Auto-recover energy slowly
            if (energy < 100 && frameCount % 200 === 0) {
                energy = Math.min(100, energy + 1);
                energyValue.textContent = `${Math.round(energy)}%`;
            }
            
            // Add sweat particles when energy is low
            if (energy < 30 && frameCount % 30 === 0) {
                const pelicanRect = pelican.getBoundingClientRect();
                const sceneRect = scene.getBoundingClientRect();
                const x = pelicanRect.left - sceneRect.left + 40;
                const y = pelicanRect.top - sceneRect.top + 20;
                createParticle(x, y, '#ADD8E6');
            }
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        bellBtn.addEventListener('click', () => {
            playBellSound();
            
            // Create bell effect at bicycle position
            const bikeRect = bicycle.getBoundingClientRect();
            const sceneRect = scene.getBoundingClientRect();
            const x = bikeRect.left - sceneRect.left + 60;
            const y = bikeRect.top - sceneRect.top - 20;
            createBellEffect(x, y);
            
            // Pelican reacts: faster running and wider pouch
            energy = Math.max(0, energy - 5);
            energyValue.textContent = `${Math.round(energy)}%`;
        });

        feedBtn.addEventListener('click', () => {
            if (energy < 100) {
                energy = Math.min(100, energy + 25);
                energyValue.textContent = `${Math.round(energy)}%`;
                
                // Create fish particles
                const pelicanRect = pelican.getBoundingClientRect();
                const sceneRect = scene.getBoundingClientRect();
                const x = pelicanRect.left - sceneRect.left + 65;
                const y = pelicanRect.top - sceneRect.top - 15;
                
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createParticle(x, y, '#FF6347');
                    }, i * 100);
                }
            }
        });

        timeBtn.addEventListener('click', () => {
            if (timeOfDay === 'day') {
                timeOfDay = 'sunset';
            } else if (timeOfDay === 'sunset') {
                timeOfDay = 'night';
            } else {
                timeOfDay = 'day';
            }
            updateTimeOfDay();
        });

        speedSlider.addEventListener('input', () => {
            speed = parseFloat(speedSlider.value);
            speedValue.textContent = `${speed.toFixed(1)}x`;
        });

        // Initialize time of day
        updateTimeOfDay();

        // Start animation
        requestAnimationFrame(animate);

        // Add some initial particles for visual interest
        setTimeout(() => {
            for (let i = 0; i < 8; i++) {
                const x = 100 + i * 80;
                const y = 100;
                createParticle(x, y, '#FFD700');
            }
        }, 500);
    </script>
</body>
</html>
