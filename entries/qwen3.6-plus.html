<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕 · 跨代模型前端擂台赛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #stage {
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(100,150,255,0.1);
    max-width: 100vw;
    max-height: 85vh;
  }
  #controls {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding: 0 10px;
  }
  .ctrl-btn {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    user-select: none;
    white-space: nowrap;
  }
  .ctrl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.6); }
  .ctrl-btn:active { transform: translateY(0) scale(0.96); }
  .ctrl-btn.danger { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); box-shadow: 0 4px 12px rgba(245,87,108,0.4); }
  .ctrl-btn.success { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); box-shadow: 0 4px 12px rgba(79,172,254,0.4); }
  .ctrl-btn.warning { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); box-shadow: 0 4px 12px rgba(250,112,154,0.4); }
  #speedSlider {
    -webkit-appearance: none;
    width: 120px;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(90deg, #4facfe, #f5576c);
    outline: none;
  }
  #speedSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .label {
    color: #aab;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #staminaBar {
    width: 80px;
    height: 8px;
    background: #333;
    border-radius: 4px;
    overflow: hidden;
  }
  #staminaFill {
    height: 100%;
    background: linear-gradient(90deg, #f5576c, #4facfe);
    border-radius: 4px;
    transition: width 0.3s;
    width: 100%;
  }
  #title {
    color: #ccd;
    font-size: 13px;
    margin-bottom: 8px;
    letter-spacing: 2px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="title">🚲 自行车骑鹈鹕 · A Bicycle Riding a Pelican 🐦</div>
<canvas id="stage" width="900" height="520"></canvas>
<div id="controls">
  <button class="ctrl-btn danger" id="btnBell">🔔 按车铃</button>
  <div class="label">⚡ 速度 <input type="range" id="speedSlider" min="0" max="100" value="40"></div>
  <button class="ctrl-btn warning" id="btnFish">🐟 投喂小鱼</button>
  <button class="ctrl-btn success" id="btnTheme">🌅 切换场景</button>
  <div class="label">💪 体力 <div id="staminaBar"><div id="staminaFill"></div></div></div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// === State ===
let time = 0;
let speed = 40;
let targetSpeed = 40;
let stamina = 100;
let sceneMode = 0; // 0=day, 1=sunset, 2=night
let bellRing = 0;
let bellShake = 0;
let fishFeed = 0;
let groundOffset = 0;
let sprinting = false;
let particles = [];
let feathers = [];
let sweatDrops = [];
let clouds = [];
let stars = [];
let waves = [];
let boardwalkOffset = 0;
let pelicanPant = 0;
let fishFlying = null;

// Init clouds
for (let i = 0; i < 6; i++) {
  clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 80, w: 60 + Math.random() * 80, speed: 0.1 + Math.random() * 0.2 });
}
for (let i = 0; i < 50; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * 150, s: 0.5 + Math.random() * 2, twinkle: Math.random() * Math.PI * 2 });
}
for (let i = 0; i < 30; i++) {
  waves.push({ x: Math.random() * W, y: 280 + Math.random() * 30, phase: Math.random() * Math.PI * 2, amp: 2 + Math.random() * 4 });
}

// === Audio ===
let audioCtx = null;
function playBell() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  // Bell: two sine waves with harmonics
  [830, 1245, 1660].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15 / (i + 1), now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2 + i * 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 1.5);
  });
  bellRing = 1;
  bellShake = 1;
  pelicanPant = 2;
}

function playFeedSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.25);
}

// === Drawing Helpers ===
function drawEllipse(cx, cy, rx, ry, color, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle || 0);
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function drawLine(x1, y1, x2, y2, color, width) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width || 2;
  ctx.stroke();
}

function drawCircle(cx, cy, r, color) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

function drawWheel(cx, cy, r, rotation, color, spokeColor) {
  // Tire
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = color || '#333';
  ctx.lineWidth = 4;
  ctx.stroke();
  // Rim
  ctx.beginPath();
  ctx.arc(cx, cy, r - 3, 0, Math.PI * 2);
  ctx.strokeStyle = spokeColor || '#888';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Spokes
  const numSpokes = 8;
  for (let i = 0; i < numSpokes; i++) {
    const a = rotation + (Math.PI * 2 / numSpokes) * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4));
    ctx.strokeStyle = spokeColor || '#aaa';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // Hub
  drawCircle(cx, cy, 3, '#555');
}

function drawSpokes(cx, cy, r, rotation, color) {
  const numSpokes = 12;
  for (let i = 0; i < numSpokes; i++) {
    const a = rotation + (Math.PI * 2 / numSpokes) * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * (r - 2), cy + Math.sin(a) * (r - 2));
    ctx.strokeStyle = color || '#bbb';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
}

// === Scene Colors ===
function getSceneColors(mode) {
  if (mode === 0) return { // Day
    skyTop: '#87CEEB', skyBot: '#E0F0FF',
    sunColor: '#FFD700', sunGlow: 'rgba(255,215,0,0.3)',
    seaTop: '#2196F3', seaBot: '#0D47A1',
    boardwalk: '#DEB887', boardwalkDark: '#C4A06A',
    ground: '#F5DEB3', grass: '#90EE90',
    cloudAlpha: 0.9, starAlpha: 0
  };
  if (mode === 1) return { // Sunset
    skyTop: '#FF6B6B', skyBot: '#FFA07A',
    sunColor: '#FF4500', sunGlow: 'rgba(255,69,0,0.4)',
    seaTop: '#4A6FA5', seaBot: '#1C2833',
    boardwalk: '#D2A679', boardwalkDark: '#B8956A',
    ground: '#E8C8A0', grass: '#6B8E23',
    cloudAlpha: 0.7, starAlpha: 0
  };
  return { // Night
    skyTop: '#0C0C1E', skyBot: '#1A1A3E',
    sunColor: '#F5F5DC', sunGlow: 'rgba(245,245,220,0.2)',
    seaTop: '#1A237E', seaBot: '#0D0D2B',
    boardwalk: '#8B7355', boardwalkDark: '#6B5B45',
    ground: '#4A4A5A', grass: '#2E4A2E',
    cloudAlpha: 0.3, starAlpha: 1
  };
}

// === Draw Background ===
function drawBackground() {
  const c = getSceneColors(sceneMode);
  
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 260);
  skyGrad.addColorStop(0, c.skyTop);
  skyGrad.addColorStop(1, c.skyBot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, 260);

  // Stars (night)
  if (c.starAlpha > 0) {
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5 * Math.sin(time * 3 + s.twinkle);
      ctx.globalAlpha = c.starAlpha * twinkle;
      drawCircle(s.x, s.y, s.s, '#FFF');
    });
    ctx.globalAlpha = 1;
  }

  // Sun/Moon
  const sunX = 120, sunY = sceneMode === 1 ? 100 : sceneMode === 2 ? 80 : 90;
  const sunR = sceneMode === 2 ? 22 : 30;
  ctx.save();
  ctx.shadowColor = c.sunGlow;
  ctx.shadowBlur = 40;
  drawCircle(sunX, sunY, sunR, c.sunColor);
  ctx.restore();

  // Clouds
  clouds.forEach(cl => {
    cl.x -= cl.speed * (speed / 40);
    if (cl.x + cl.w < -20) cl.x = W + 20;
    ctx.globalAlpha = c.cloudAlpha;
    ctx.fillStyle = sceneMode === 2 ? '#2A2A4A' : '#FFF';
    // Draw cloud as overlapping ellipses
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(cl.x + i * cl.w * 0.35, cl.y + Math.sin(i) * 5, cl.w * 0.3, cl.w * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  });

  // Sea
  const seaGrad = ctx.createLinearGradient(0, 250, 0, 310);
  seaGrad.addColorStop(0, c.seaTop);
  seaGrad.addColorStop(1, c.seaBot);
  ctx.fillStyle = seaGrad;
  ctx.fillRect(0, 250, W, 60);

  // Waves
  waves.forEach(w => {
    w.x -= 0.3 * (speed / 40);
    if (w.x < -10) w.x = W + 10;
    ctx.beginPath();
    ctx.arc(w.x, w.y + Math.sin(time * 2 + w.phase) * w.amp, 3, 0, Math.PI * 2);
    ctx.fillStyle = sceneMode === 2 ? 'rgba(100,150,255,0.3)' : 'rgba(255,255,255,0.4)';
    ctx.fill();
  });

  // Boardwalk / ground
  const groundY = 310;
  ctx.fillStyle = c.ground;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Boardwalk planks
  ctx.strokeStyle = c.boardwalkDark;
  ctx.lineWidth = 1;
  boardwalkOffset = (boardwalkOffset + speed * 0.02) % 60;
  for (let x = -boardwalkOffset; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  // Horizontal plank lines
  for (let y = groundY; y < H; y += 20) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.strokeStyle = c.boardwalk;
    ctx.lineWidth = 8;
    ctx.stroke();
    ctx.strokeStyle = c.boardwalkDark;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Grass tufts on edges
  ctx.fillStyle = c.grass;
  for (let x = (groundOffset * 0.5) % 40 - 20; x < W; x += 40) {
    for (let j = 0; j < 3; j++) {
      const gx = x + j * 8;
      ctx.beginPath();
      ctx.ellipse(gx, groundY - 2, 4, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// === Draw Pelican ===
function drawPelican(px, py, bob, flapAngle, legPhase, mouthOpen, panting) {
  ctx.save();
  ctx.translate(px, py + bob);
  
  // Tilt based on speed
  const tilt = speed * 0.001;
  ctx.rotate(tilt);

  const scale = 1.2;
  ctx.scale(scale, scale);

  // === LEGS (running animation) ===
  const legAnim1 = Math.sin(legPhase) * 0.6;
  const legAnim2 = Math.sin(legPhase + Math.PI) * 0.6;
  
  // Left leg
  ctx.save();
  ctx.translate(-15, 45);
  ctx.rotate(legAnim1);
  ctx.fillStyle = '#E8943A';
  ctx.fillRect(-3, 0, 6, 25);
  // Webbed foot
  ctx.beginPath();
  ctx.ellipse(0, 28, 10, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#E8943A';
  ctx.fill();
  // Toe lines
  ctx.strokeStyle = '#C07830';
  ctx.lineWidth = 1;
  for (let t = -1; t <= 1; t++) {
    ctx.beginPath();
    ctx.moveTo(0, 26);
    ctx.lineTo(t * 8, 32);
    ctx.stroke();
  }
  ctx.restore();

  // Right leg
  ctx.save();
  ctx.translate(15, 45);
  ctx.rotate(legAnim2);
  ctx.fillStyle = '#E8943A';
  ctx.fillRect(-3, 0, 6, 25);
  ctx.beginPath();
  ctx.ellipse(0, 28, 10, 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#E8943A';
  ctx.fill();
  ctx.strokeStyle = '#C07830';
  ctx.lineWidth = 1;
  for (let t = -1; t <= 1; t++) {
    ctx.beginPath();
    ctx.moveTo(0, 26);
    ctx.lineTo(t * 8, 32);
    ctx.stroke();
  }
  ctx.restore();

  // === TAIL FEATHERS ===
  ctx.save();
  ctx.translate(-45, 10);
  ctx.rotate(-0.2 + Math.sin(time * 3) * 0.1);
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-15 - i * 5, -10 + i * 8, -25 - i * 8, -15 + i * 12);
    ctx.quadraticCurveTo(-10 - i * 3, -5 + i * 5, 0, 0);
    ctx.fillStyle = i % 2 === 0 ? '#3A3A3A' : '#4A4A4A';
    ctx.fill();
  }
  ctx.restore();

  // === BODY ===
  // Main body ellipse
  ctx.beginPath();
  ctx.ellipse(0, 15, 50, 35, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#F0F0F0';
  ctx.fill();
  ctx.strokeStyle = '#D0D0D0';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Body shading
  ctx.beginPath();
  ctx.ellipse(5, 20, 40, 25, 0, 0, Math.PI);
  ctx.fillStyle = 'rgba(200,200,200,0.3)';
  ctx.fill();

  // === WINGS ===
  const wingFlap = Math.sin(flapAngle) * 0.4;
  
  // Left wing (far)
  ctx.save();
  ctx.translate(-20, 0);
  ctx.rotate(wingFlap - 0.3);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-30, -20, -45, -10);
  ctx.quadraticCurveTo(-40, 5, -20, 15);
  ctx.quadraticCurveTo(-10, 10, 0, 0);
  ctx.fillStyle = '#E0E0E0';
  ctx.fill();
  ctx.strokeStyle = '#C0C0C0';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Feather lines
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-5 * i, -2 * i);
    ctx.lineTo(-15 * i, -8 * i + 3);
    ctx.strokeStyle = 'rgba(180,180,180,0.5)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.restore();

  // Right wing (near, more visible)
  ctx.save();
  ctx.translate(15, -5);
  ctx.rotate(-wingFlap * 0.7 + 0.2);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(25, -25, 40, -15);
  ctx.quadraticCurveTo(35, 5, 15, 15);
  ctx.quadraticCurveTo(8, 10, 0, 0);
  ctx.fillStyle = '#F5F5F5';
  ctx.fill();
  ctx.strokeStyle = '#D5D5D5';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Feather details
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.moveTo(5 * i, -3 * i);
    ctx.lineTo(12 * i, -10 * i + 5);
    ctx.strokeStyle = 'rgba(190,190,190,0.5)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.restore();

  // === NECK ===
  ctx.beginPath();
  ctx.moveTo(30, -5);
  ctx.quadraticCurveTo(40, -25, 45, -40);
  ctx.quadraticCurveTo(50, -55, 48, -65);
  ctx.quadraticCurveTo(42, -60, 38, -45);
  ctx.quadraticCurveTo(32, -25, 25, -5);
  ctx.fillStyle = '#F0F0F0';
  ctx.fill();

  // === HEAD ===
  drawEllipse(48, -68, 14, 13, '#F0F0F0', 0.1);

  // Eye
  const eyeX = 54, eyeY = -72;
  drawCircle(eyeX, eyeY, 4, '#FFF');
  drawCircle(eyeX + 1, eyeY, 2.5, '#111');
  drawCircle(eyeX + 2, eyeY - 1, 0.8, '#FFF');
  
  // Eyebrow (worried expression when sprinting)
  if (panting || mouthOpen > 0.3) {
    ctx.beginPath();
    ctx.moveTo(eyeX - 5, eyeY - 6);
    ctx.lineTo(eyeX + 5, eyeY - 8);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // === BEAK (upper) ===
  ctx.beginPath();
  ctx.moveTo(58, -70);
  ctx.quadraticCurveTo(85, -75, 105, -68);
  ctx.quadraticCurveTo(95, -65, 58, -66);
  ctx.fillStyle = '#FF8C00';
  ctx.fill();
  ctx.strokeStyle = '#E07000';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Nostril
  drawCircle(75, -71, 1.5, '#E07000');

  // === THROAT POUCH ===
  const pouchBob = Math.sin(time * 2) * 3 * (mouthOpen + 0.3);
  const pouchOpen = mouthOpen + panting * 0.3;
  ctx.beginPath();
  ctx.moveTo(58, -66);
  ctx.quadraticCurveTo(70, -50 + pouchBob, 100, -65);
  ctx.quadraticCurveTo(95, -45 + pouchBob * 1.5, 80, -40 + pouchBob);
  ctx.quadraticCurveTo(65, -42 + pouchBob, 58, -66);
  ctx.fillStyle = pouchOpen > 0.5 ? '#FFB347' : '#FFA030';
  ctx.fill();
  ctx.strokeStyle = '#E08020';
  ctx.lineWidth = 1;
  ctx.stroke();

  // === MOUTH OPEN (panting) ===
  if (pouchOpen > 0.3) {
    ctx.beginPath();
    ctx.moveTo(58, -66);
    ctx.quadraticCurveTo(80, -60 + pouchBob * 0.5, 102, -64);
    ctx.quadraticCurveTo(80, -55, 58, -66);
    ctx.fillStyle = '#CC5500';
    ctx.fill();
  }

  // === REINS (connecting bicycle handlebars to beak) ===
  // These will be drawn after the bicycle

  ctx.restore();
}

// === Draw Bicycle ===
function drawBicycle(bx, by, wheelRot, pedalAngle, bikeBob, bikeTilt) {
  ctx.save();
  ctx.translate(bx, by + bikeBob);
  ctx.rotate(bikeTilt);

  const wheelR = 22;
  const rearWheelX = -35;
  const frontWheelX = 35;
  const wheelY = 0;
  const axleY = 0;
  const seatX = -10, seatY = -55;
  const handleX = 38, handleY = -50;
  const bottomBracketX = 5, bottomBracketY = 10;

  // Chain stays
  drawLine(rearWheelX, axleY, bottomBracketX, bottomBracketY, '#444', 3);
  // Seat stays
  drawLine(rearWheelX, axleY, seatX, seatY + 5, '#444', 2);
  // Down tube
  drawLine(frontWheelX, axleY - 5, bottomBracketX, bottomBracketY, '#444', 3);
  // Top tube
  drawLine(seatX, seatY + 5, handleX - 5, handleY, '#444', 3);
  // Seat tube
  drawLine(bottomBracketX, bottomBracketY, seatX, seatY + 5, '#444', 3);
  // Head tube
  drawLine(handleX - 5, handleY, frontWheelX, axleY - 5, '#444', 3);

  // Fork
  drawLine(frontWheelX, axleY - 5, frontWheelX, axleY, '#444', 3);

  // Seat
  ctx.beginPath();
  ctx.ellipse(seatX, seatY - 2, 12, 5, -0.1, 0, Math.PI * 2);
  ctx.fillStyle = '#8B4513';
  ctx.fill();
  ctx.strokeStyle = '#6B3510';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Seat post
  drawLine(seatX, seatY + 5, seatX, seatY - 2, '#666', 2);

  // Handlebars
  ctx.beginPath();
  ctx.moveTo(handleX - 8, handleY + 5);
  ctx.quadraticCurveTo(handleX - 5, handleY - 5, handleX + 5, handleY - 8);
  ctx.quadraticCurveTo(handleX + 12, handleY - 6, handleX + 8, handleY + 2);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 3;
  ctx.stroke();
  // Handlebar grips
  drawEllipse(handleX + 8, handleY + 2, 4, 3, '#222', 0.5);
  drawEllipse(handleX - 8, handleY + 5, 4, 3, '#222', -0.3);

  // === PEDALS & CRANK ===
  const crankLen = 12;
  const pedal1X = bottomBracketX + Math.cos(pedalAngle) * crankLen;
  const pedal1Y = bottomBracketY + Math.sin(pedalAngle) * crankLen;
  const pedal2X = bottomBracketX + Math.cos(pedalAngle + Math.PI) * crankLen;
  const pedal2Y = bottomBracketY + Math.sin(pedalAngle + Math.PI) * crankLen;

  // Chainring
  ctx.beginPath();
  ctx.arc(bottomBracketX, bottomBracketY, 7, 0, Math.PI * 2);
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Crank arms
  drawLine(bottomBracketX, bottomBracketY, pedal1X, pedal1Y, '#555', 2.5);
  drawLine(bottomBracketX, bottomBracketY, pedal2X, pedal2Y, '#555', 2.5);

  // Pedals
  ctx.fillStyle = '#333';
  ctx.fillRect(pedal1X - 5, pedal1Y - 2, 10, 4);
  ctx.fillRect(pedal2X - 5, pedal2Y - 2, 10, 4);

  // === CHAIN ===
  ctx.beginPath();
  ctx.ellipse(bottomBracketX, bottomBracketY, 7, 3, 0, 0, Math.PI * 2);
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  drawLine(bottomBracketX + 7, bottomBracketY, rearWheelX + 6, axleY, '#777', 1.5);
  drawLine(bottomBracketX - 7, bottomBracketY, rearWheelX - 6, axleY, '#777', 1.5);

  // === WHEELS ===
  // Rear wheel
  drawWheel(rearWheelX, axleY, wheelR, wheelRot, '#333', '#AAA');
  drawSpokes(rearWheelX, axleY, wheelR, wheelRot, '#BBB');
  // Front wheel
  drawWheel(frontWheelX, axleY, wheelR, wheelRot, '#333', '#AAA');
  drawSpokes(frontWheelX, axleY, wheelR, wheelRot, '#BBB');

  // === BELL (on handlebars) ===
  const bellShakeOffset = bellShake > 0 ? Math.sin(time * 30) * bellShake * 3 : 0;
  ctx.save();
  ctx.translate(handleX - 3 + bellShakeOffset, handleY - 12);
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#FFD700';
  ctx.fill();
  ctx.strokeStyle = '#DAA520';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Bell clapper
  drawCircle(0, 2, 1.5, '#C0C0C0');
  ctx.restore();

  // === REINS (from handlebars to pelican beak area) ===
  ctx.beginPath();
  ctx.moveTo(handleX + 5, handleY);
  ctx.quadraticCurveTo(handleX + 30, handleY + 10, 50, -30);
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(handleX + 8, handleY + 5);
  ctx.quadraticCurveTo(handleX + 35, handleY + 15, 52, -25);
  ctx.strokeStyle = '#A0522D';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // === SADDLE BAG ===
  ctx.beginPath();
  ctx.moveTo(seatX - 10, seatY);
  ctx.lineTo(seatX + 5, seatY);
  ctx.lineTo(seatX + 8, seatY + 10);
  ctx.lineTo(seatX - 12, seatY + 10);
  ctx.closePath();
  ctx.fillStyle = '#8B6914';
  ctx.fill();
  ctx.strokeStyle = '#6B4914';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.restore();
}

// === Particles ===
function spawnFeather() {
  feathers.push({
    x: 350 + Math.random() * 100,
    y: 180 + Math.random() * 60,
    vx: -1 - Math.random() * 2,
    vy: -0.5 + Math.random() * 1,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.1,
    life: 1,
    size: 3 + Math.random() * 5
  });
}

function spawnSweat() {
  sweatDrops.push({
    x: 380 + Math.random() * 30,
    y: 150 + Math.random() * 20,
    vx: 1 + Math.random() * 2,
    vy: -1 - Math.random() * 2,
    life: 1,
    size: 2 + Math.random() * 3
  });
}

function spawnSpeedLine() {
  particles.push({
    x: W + 10,
    y: 200 + Math.random() * 150,
    vx: -8 - Math.random() * 8,
    vy: (Math.random() - 0.5) * 2,
    life: 1,
    len: 20 + Math.random() * 40
  });
}

function updateParticles() {
  // Feathers
  for (let i = feathers.length - 1; i >= 0; i--) {
    const f = feathers[i];
    f.x += f.vx;
    f.y += f.vy + Math.sin(time * 3 + i) * 0.3;
    f.rot += f.rotSpeed;
    f.life -= 0.008;
    if (f.life <= 0) feathers.splice(i, 1);
  }
  // Sweat
  for (let i = sweatDrops.length - 1; i >= 0; i--) {
    const s = sweatDrops[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.1;
    s.life -= 0.02;
    if (s.life <= 0) sweatDrops.splice(i, 1);
  }
  // Speed lines
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // Fish flying animation
  if (fishFlying) {
    fishFlying.progress += 0.02;
    if (fishFlying.progress >= 1) {
      stamina = Math.min(100, stamina + fishFlying.amount);
      fishFlying = null;
    }
  }
}

function drawParticles() {
  // Feathers
  feathers.forEach(f => {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = f.life;
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#F5F5F5';
    ctx.fill();
    ctx.strokeStyle = '#DDD';
    ctx.lineWidth = 0.5;
    ctx.stroke();
    ctx.restore();
  });
  
  // Sweat drops
  sweatDrops.forEach(s => {
    ctx.globalAlpha = s.life;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - s.size);
    ctx.quadraticCurveTo(s.x + s.size, s.y, s.x, s.y + s.size * 0.5);
    ctx.quadraticCurveTo(s.x - s.size, s.y, s.x, s.y - s.size);
    ctx.fillStyle = '#88CCFF';
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Speed lines
  particles.forEach(p => {
    ctx.globalAlpha = p.life * 0.5;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + p.len, p.y);
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawFish() {
  if (!fishFlying) return;
  const p = fishFlying.progress;
  const startX = 50, startY = 100;
  const endX = 420, endY = 250;
  const fx = startX + (endX - startX) * p;
  const fy = startY + (endY - startY) * p - Math.sin(p * Math.PI) * 80;
  
  ctx.save();
  ctx.translate(fx, fy);
  ctx.rotate(-0.3);
  // Fish body
  ctx.beginPath();
  ctx.ellipse(0, 0, 15, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#FFA07A';
  ctx.fill();
  ctx.strokeStyle = '#E08060';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Tail
  ctx.beginPath();
  ctx.moveTo(-14, 0);
  ctx.lineTo(-22, -8);
  ctx.lineTo(-22, 8);
  ctx.closePath();
  ctx.fillStyle = '#FFA07A';
  ctx.fill();
  // Eye
  drawCircle(8, -2, 2, '#FFF');
  drawCircle(9, -2, 1, '#111');
  ctx.restore();
}

// === Speed indicator ===
function drawSpeedIndicator() {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(10, 10, 100, 28, 8);
  ctx.fill();
  
  ctx.fillStyle = '#FFF';
  ctx.font = '13px sans-serif';
  ctx.fillText(`🚲 ${Math.round(speed)} km/h`, 20, 28);
}

// === Scene label ===
function drawSceneLabel() {
  const labels = ['☀️ 晴天', '🌅 黄昏', '🌙 夜晚'];
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.roundRect(W - 100, 10, 90, 28, 8);
  ctx.fill();
  ctx.fillStyle = '#FFF';
  ctx.font = '13px sans-serif';
  ctx.fillText(labels[sceneMode], W - 90, 28);
}

// === Speech bubble ===
function drawSpeechBubble(text, x, y) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1.5;
  const tw = ctx.measureText(text).width;
  ctx.beginPath();
  ctx.roundRect(x - tw/2 - 10, y - 15, tw + 20, 30, 8);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y + 4);
  ctx.textAlign = 'left';
  ctx.restore();
}

// === Main Loop ===
function draw() {
  time += 0.016;
  
  // Update speed
  speed += (targetSpeed - speed) * 0.05;
  
  // Stamina drain
  if (speed > 10) {
    stamina -= speed * 0.001;
  }
  if (stamina < 0) stamina = 0;
  if (stamina <= 0) {
    targetSpeed = Math.min(targetSpeed, 10);
    speed = Math.min(speed, 10);
  }
  
  // Bell shake decay
  if (bellShake > 0) bellShake *= 0.92;
  
  // Pant decay
  if (pelicanPant > 0) pelicanPant *= 0.97;
  
  // Ground scroll
  groundOffset += speed * 0.05;
  
  // Animation phases
  const wheelRot = time * speed * 0.08;
  const pedalAngle = time * speed * 0.06;
  const legPhase = time * speed * 0.08;
  const flapAngle = time * speed * 0.04;
  
  // Bob
  const pelicanBob = Math.sin(time * speed * 0.06) * 3 * (speed / 40);
  const bikeBob = Math.sin(time * speed * 0.06 + 0.5) * 2 * (speed / 40) + (bellShake > 0.1 ? bellShake * 2 : 0);
  const bikeTilt = Math.sin(time * speed * 0.03) * 0.02 * (speed / 40);
  
  // Mouth open based on speed
  const mouthOpen = Math.min(1, speed / 80);
  
  // Spawn particles
  if (speed > 30 && Math.random() < 0.1) spawnFeather();
  if (speed > 50 && Math.random() < 0.15) spawnSweat();
  if (speed > 20 && Math.random() < 0.05) spawnSpeedLine();
  
  updateParticles();
  
  // === Clear ===
  ctx.clearRect(0, 0, W, H);
  
  // === Draw scene ===
  drawBackground();
  drawSpeedIndicator();
  drawSceneLabel();
  
  // Pelican position
  const px = 380, py = 340;
  
  // Draw pelican
  drawPelican(px, py, pelicanBob, flapAngle, legPhase, mouthOpen, pelicanPant);
  
  // Draw bicycle on pelican's back
  const bx = px + 10, by = py - 55;
  drawBicycle(bx, by, wheelRot, pedalAngle, bikeBob, bikeTilt);
  
  // Draw particles (feathers, sweat, speed lines)
  drawParticles();
  drawFish();
  
  // Speech bubble for pelican when sprinting
  if (speed > 70) {
    drawSpeechBubble("嘎！太快了！", px - 50, py - 110);
  } else if (speed < 15 && speed > 5) {
    drawSpeechBubble("嗯...慢慢走~", px - 50, py - 110);
  }
  
  // Speech bubble for bicycle when bell rings
  if (bellShake > 0.3) {
    drawSpeechBubble("叮铃铃！冲鸭！", bx - 10, by - 80);
  }
  
  // Stamina warning
  if (stamina < 20 && stamina > 0) {
    ctx.fillStyle = `rgba(255,0,0,${0.3 + Math.sin(time * 5) * 0.2})`;
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('⚠️ 鹈鹕体力不足！投喂小鱼恢复！', W/2 - 130, H - 50);
  }
  
  // UI update
  document.getElementById('staminaFill').style.width = stamina + '%';
  document.getElementById('staminaFill').style.background = stamina < 20 
    ? 'linear-gradient(90deg, #f5576c, #ff0000)' 
    : 'linear-gradient(90deg, #4facfe, #00f2fe)';
  
  requestAnimationFrame(draw);
}

// === Controls ===
document.getElementById('btnBell').addEventListener('click', () => {
  playBell();
  if (stamina > 10) {
    targetSpeed = Math.min(100, targetSpeed + 15);
    pelicanPant = 3;
  }
});

document.getElementById('speedSlider').addEventListener('input', (e) => {
  targetSpeed = parseInt(e.target.value);
});

document.getElementById('btnFish').addEventListener('click', () => {
  if (!fishFlying && stamina < 100) {
    fishFlying = { progress: 0, amount: 25 };
    playFeedSound();
  }
});

document.getElementById('btnTheme').addEventListener('click', () => {
  sceneMode = (sceneMode + 1) % 3;
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    document.getElementById('btnBell').click();
  }
  if (e.code === 'ArrowUp') {
    targetSpeed = Math.min(100, targetSpeed + 5);
    document.getElementById('speedSlider').value = targetSpeed;
  }
  if (e.code === 'ArrowDown') {
    targetSpeed = Math.max(0, targetSpeed - 5);
    document.getElementById('speedSlider').value = targetSpeed;
  }
  if (e.code === 'KeyF') {
    document.getElementById('btnFish').click();
  }
  if (e.code === 'KeyT') {
    document.getElementById('btnTheme').click();
  }
});

// === Polyfill roundRect if needed ===
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.arcTo(x + w, y, x + w, y + r[1], r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.arcTo(x + w, y + h, x + w - r[2], y + h, r[2]);
    this.lineTo(x + r[3], y + h);
    this.arcTo(x, y + h, x, y + h - r[3], r[3]);
    this.lineTo(x, y + r[0]);
    this.arcTo(x, y, x + r[0], y, r[0]);
    this.closePath();
  };
}

// Start
draw();
</script>
