<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-sky: #87CEEB;
            --bg-horizon: #F4A460;
            --accent: #FF6B35;
            --accent-hover: #E85A28;
            --card-bg: rgba(255,255,255,0.92);
            --text-dark: #2D3436;
            --text-muted: #636E72;
            --success: #00B894;
            --warning: #FDCB6E;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-horizon) 70%, #E8D5B7 100%);
            min-height: 100vh;
        }
        
        #mainCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
            backdrop-filter: blur(10px);
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .control-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        
        .btn-bell {
            background: linear-gradient(135deg, #FFD93D 0%, #FF9A3C 100%);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        
        .btn-bell:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255,154,60,0.4);
        }
        
        .btn-bell:active {
            transform: scale(0.95);
        }
        
        .btn-feed {
            background: linear-gradient(135deg, #00B894 0%, #00CEC9 100%);
            color: #fff;
        }
        
        .btn-feed:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,184,148,0.4);
        }
        
        .btn-feed:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 120px;
        }
        
        .speed-value {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #DFE6E9;
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.15s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .toggle-group {
            display: flex;
            gap: 6px;
        }
        
        .toggle-btn {
            padding: 8px 14px;
            border: 2px solid #DFE6E9;
            border-radius: 10px;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        
        .toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        
        .toggle-btn:hover:not(.active) {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .stamina-bar {
            width: 120px;
            height: 8px;
            background: #DFE6E9;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .stamina-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, #55EFC4 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .stamina-fill.low {
            background: linear-gradient(90deg, #E17055 0%, #FAB1A0 100%);
        }
        
        .fish-count {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            color: var(--text-dark);
            z-index: 100;
        }
        
        .fish-icon {
            font-size: 24px;
        }
        
        .title-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        .title-badge h1 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }
        
        .title-badge p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .controls-panel {
                padding: 12px 16px;
                gap: 8px;
                bottom: 10px;
            }
            
            .btn {
                padding: 10px 14px;
                font-size: 12px;
            }
            
            .toggle-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
            
            .stamina-bar {
                width: 80px;
            }
            
            .title-badge, .fish-count {
                padding: 8px 12px;
            }
            
            .title-badge h1 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>
    
    <div class="title-badge">
        <h1>自行车骑鹈鹕</h1>
        <p>A Bicycle Riding a Pelican</p>
    </div>
    
    <div class="fish-count">
        <span class="fish-icon">🐟</span>
        <span id="fishCount">5</span> 条鱼
    </div>
    
    <div class="controls-panel">
        <div class="control-group">
            <button class="btn btn-bell" id="bellBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
                </svg>
                按车铃
            </button>
        </div>
        
        <div class="control-group">
            <span class="control-label">速度</span>
            <div class="slider-container">
                <input type="range" id="speedSlider" min="0.5" max="3" step="0.1" value="1">
                <span class="speed-value" id="speedValue">1.0x</span>
            </div>
        </div>
        
        <div class="control-group">
            <span class="control-label">体力</span>
            <div class="stamina-bar">
                <div class="stamina-fill" id="staminaFill" style="width: 80%"></div>
            </div>
        </div>
        
        <div class="control-group">
            <button class="btn btn-feed" id="feedBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
                投喂小鱼
            </button>
        </div>
        
        <div class="control-group">
            <span class="control-label">时间</span>
            <div class="toggle-group">
                <button class="toggle-btn active" data-time="day">白天</button>
                <button class="toggle-btn" data-time="dusk">黄昏</button>
                <button class="toggle-btn" data-time="night">夜晚</button>
            </div>
        </div>
        
        <div class="control-group">
            <span class="control-label">路况</span>
            <div class="toggle-group">
                <button class="toggle-btn active" data-road="smooth">平路</button>
                <button class="toggle-btn" data-road="bumpy">石子路</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 初始化 ============
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        // 状态变量 - 必须在使用前初始化
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        // 游戏状态
        const state = {
            time: 0,
            speed: 1,
            stamina: 80,
            fishCount: 5,
            timeOfDay: 'day',
            roadType: 'smooth',
            isBellRinging: false,
            bellTimer: 0,
            isSprinting: false,
            sprintTimer: 0,
            pelicanScared: false,
            scaredTimer: 0
        };
        
        // 粒子系统
        const particles = [];
        const feathers = [];
        const sweatDrops = [];
        const fishParticles = [];
        
        // 背景元素
        const clouds = [];
        const waves = [];
        const planks = [];
        
        // 初始化背景元素
        function initBackgroundElements() {
            clouds.length = 0;
            waves.length = 0;
            planks.length = 0;
            
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width * 1.5,
                    y: 50 + Math.random() * 150,
                    size: 40 + Math.random() * 60,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
            
            for (let i = 0; i < 3; i++) {
                waves.push({
                    offset: i * 50,
                    amplitude: 8 + Math.random() * 8,
                    frequency: 0.01 + Math.random() * 0.005,
                    speed: 0.02 + Math.random() * 0.02
                });
            }
            
            for (let i = 0; i < 30; i++) {
                planks.push({
                    x: i * 80,
                    width: 75,
                    gap: 5
                });
            }
        }
        
        // 调用初始化
        initBackgroundElements();
        
        // ============ 音频系统 ============
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playBellSound() {
            initAudio();
            
            const now = audioCtx.currentTime;
            
            // 主铃声音
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.frequency.setValueAtTime(2400, now);
            osc1.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc1.start(now);
            osc1.stop(now + 0.4);
            
            // 泛音
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(3200, now);
            osc2.frequency.exponentialRampToValueAtTime(2600, now + 0.08);
            gain2.gain.setValueAtTime(0.15, now);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc2.start(now);
            osc2.stop(now + 0.2);
            
            // 叮当声
            setTimeout(() => {
                const osc3 = audioCtx.createOscillator();
                const gain3 = audioCtx.createGain();
                osc3.connect(gain3);
                gain3.connect(audioCtx.destination);
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(2000, audioCtx.currentTime);
                gain3.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain3.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc3.start(audioCtx.currentTime);
                osc3.stop(audioCtx.currentTime + 0.3);
            }, 100);
        }
        
        // ============ 颜色工具 ============
        function getSkyColors() {
            switch(state.timeOfDay) {
                case 'day':
                    return { top: '#87CEEB', mid: '#B0E0E6', horizon: '#F4A460', ground: '#E8D5B7' };
                case 'dusk':
                    return { top: '#2C3E50', mid: '#E74C3C', horizon: '#F39C12', ground: '#D35400' };
                case 'night':
                    return { top: '#0a0a1a', mid: '#1a1a3a', horizon: '#2d2d5a', ground: '#1a1a2e' };
                default:
                    return { top: '#87CEEB', mid: '#B0E0E6', horizon: '#F4A460', ground: '#E8D5B7' };
            }
        }
        
        function getLightColor(baseColor, timeOfDay) {
            if (timeOfDay === 'night') {
                return shadeColor(baseColor, -50);
            } else if (timeOfDay === 'dusk') {
                return shadeColor(baseColor, -15);
            }
            return baseColor;
        }
        
        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, Math.min(255, (num >> 16) + amt));
            const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
            const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
        
        // ============ 绘制函数 ============
        
        // 绘制天空背景
        function drawSky() {
            const colors = getSkyColors();
            const gradient = ctx.createLinearGradient(0, 0, 0, height * 0.7);
            gradient.addColorStop(0, colors.top);
            gradient.addColorStop(0.5, colors.mid);
            gradient.addColorStop(1, colors.horizon);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height * 0.7);
            
            // 夜晚星星
            if (state.timeOfDay === 'night') {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 137.5) % width;
                    const y = (i * 73.3) % (height * 0.5);
                    const twinkle = Math.sin(state.time * 3 + i) * 0.5 + 0.5;
                    ctx.globalAlpha = 0.3 + twinkle * 0.7;
                    ctx.beginPath();
                    ctx.arc(x, y, 1 + twinkle, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            // 太阳/月亮
            const celestialY = height * 0.15;
            const celestialX = width * 0.8;
            
            if (state.timeOfDay === 'night') {
                // 月亮
                ctx.fillStyle = '#F5F5DC';
                ctx.beginPath();
                ctx.arc(celestialX, celestialY, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = getSkyColors().top;
                ctx.beginPath();
                ctx.arc(celestialX + 12, celestialY - 5, 30, 0, Math.PI * 2);
                ctx.fill();
            } else if (state.timeOfDay === 'dusk') {
                // 落日
                const sunGradient = ctx.createRadialGradient(celestialX, celestialY, 0, celestialX, celestialY, 50);
                sunGradient.addColorStop(0, '#FFF5E1');
                sunGradient.addColorStop(0.3, '#FFD93D');
                sunGradient.addColorStop(1, 'rgba(255,107,53,0)');
                ctx.fillStyle = sunGradient;
                ctx.beginPath();
                ctx.arc(celestialX, celestialY, 50, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // 太阳
                const sunGradient = ctx.createRadialGradient(celestialX, celestialY, 0, celestialX, celestialY, 45);
                sunGradient.addColorStop(0, '#FFFFFF');
                sunGradient.addColorStop(0.5, '#FFE066');
                sunGradient.addColorStop(1, 'rgba(255,224,102,0.3)');
                ctx.fillStyle = sunGradient;
                ctx.beginPath();
                ctx.arc(celestialX, celestialY, 45, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制云朵
        function drawClouds() {
            const cloudColor = state.timeOfDay === 'night' ? 'rgba(40,40,70,0.8)' : 
                              state.timeOfDay === 'dusk' ? 'rgba(255,150,100,0.6)' : 
                              'rgba(255,255,255,0.9)';
            
            clouds.forEach(cloud => {
                cloud.x -= cloud.speed * state.speed;
                if (cloud.x < -cloud.size * 2) {
                    cloud.x = width + cloud.size;
                }
                
                ctx.fillStyle = cloudColor;
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size * 0.5, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.4, cloud.y - cloud.size * 0.1, cloud.size * 0.4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y, cloud.size * 0.45, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.4, cloud.y + cloud.size * 0.15, cloud.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // 绘制海洋
        function drawOcean() {
            const oceanTop = height * 0.55;
            const oceanHeight = height * 0.2;
            
            const oceanGradient = ctx.createLinearGradient(0, oceanTop, 0, oceanTop + oceanHeight);
            if (state.timeOfDay === 'night') {
                oceanGradient.addColorStop(0, '#0a1628');
                oceanGradient.addColorStop(1, '#051020');
            } else if (state.timeOfDay === 'dusk') {
                oceanGradient.addColorStop(0, '#c0392b');
                oceanGradient.addColorStop(1, '#1a5276');
            } else {
                oceanGradient.addColorStop(0, '#3498db');
                oceanGradient.addColorStop(1, '#1a5276');
            }
            
            ctx.fillStyle = oceanGradient;
            ctx.beginPath();
            ctx.moveTo(0, oceanTop);
            
            waves.forEach((wave, index) => {
                for (let x = 0; x <= width; x += 10) {
                    const y = oceanTop + Math.sin((x + state.time * 50 * wave.speed + wave.offset) * wave.frequency) * wave.amplitude + index * 15;
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.lineTo(width, oceanTop + oceanHeight);
            ctx.lineTo(0, oceanTop + oceanHeight);
            ctx.closePath();
            ctx.fill();
            
            // 波光
            if (state.timeOfDay !== 'night') {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                for (let i = 0; i < 8; i++) {
                    const x = ((state.time * 30 + i * 150) % (width + 100)) - 50;
                    const y = oceanTop + 20 + Math.sin(state.time * 2 + i) * 10;
                    ctx.beginPath();
                    ctx.ellipse(x, y, 20 + Math.sin(state.time + i) * 5, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // 绘制木栈道
        function drawBoardwalk() {
            const boardwalkY = height * 0.72;
            const boardwalkHeight = height * 0.08;
            
            // 栈道底座
            const baseGradient = ctx.createLinearGradient(0, boardwalkY, 0, boardwalkY + boardwalkHeight);
            baseGradient.addColorStop(0, getLightColor('#8B4513', state.timeOfDay));
            baseGradient.addColorStop(1, getLightColor('#5D3A1A', state.timeOfDay));
            ctx.fillStyle = baseGradient;
            ctx.fillRect(0, boardwalkY, width, boardwalkHeight);
            
            // 木板
            const scrollOffset = (state.time * 100 * state.speed) % 80;
            planks.forEach((plank, i) => {
                const x = plank.x - scrollOffset;
                if (x > -plank.width && x < width + plank.width) {
                    // 木板主体
                    const plankGradient = ctx.createLinearGradient(x, boardwalkY, x, boardwalkY + boardwalkHeight - 5);
                    plankGradient.addColorStop(0, getLightColor('#DEB887', state.timeOfDay));
                    plankGradient.addColorStop(0.5, getLightColor('#D2691E', state.timeOfDay));
                    plankGradient.addColorStop(1, getLightColor('#8B4513', state.timeOfDay));
                    
                    ctx.fillStyle = plankGradient;
                    ctx.fillRect(x, boardwalkY, plank.width, boardwalkHeight - 5);
                    
                    // 木板缝隙
                    ctx.fillStyle = getLightColor('#3D2314', state.timeOfDay);
                    ctx.fillRect(x + plank.width, boardwalkY, plank.gap, boardwalkHeight);
                    
                    // 钉子装饰
                    ctx.fillStyle = getLightColor('#696969', state.timeOfDay);
                    ctx.beginPath();
                    ctx.arc(x + 8, boardwalkY + 10, 2, 0, Math.PI * 2);
                    ctx.arc(x + plank.width - 8, boardwalkY + 10, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // 石子路效果
            if (state.roadType === 'bumpy') {
                ctx.fillStyle = 'rgba(139,90,43,0.5)';
                for (let i = 0; i < 20; i++) {
                    const x = ((state.time * 80 * state.speed + i * 80) % (width + 50)) - 25;
                    const y = boardwalkY + 15 + (i % 3) * 12;
                    ctx.beginPath();
                    ctx.ellipse(x, y, 8 + (i % 4), 5, Math.random(), 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        
        // 绘制鹈鹕
        function drawPelican(centerX, centerY) {
            const bounce = state.roadType === 'bumpy' ? 
                           Math.sin(state.time * 15 * state.speed) * 8 : 
                           Math.sin(state.time * 8 * state.speed) * 4;
            const scaredOffset = state.pelicanScared ? Math.sin(state.time * 30) * 5 : 0;
            
            const pelicanY = centerY + bounce + scaredOffset;
            const wingFlap = Math.sin(state.time * 10 * state.speed) * 0.3;
            const legCycle = state.time * 12 * state.speed;
            const pouchWobble = Math.sin(state.time * 6 * state.speed) * 3;
            
            // 受惊时眼睛变化
            const eyeScale = state.pelicanScared ? 1.5 : 1;
            
            ctx.save();
            ctx.translate(centerX, pelicanY);
            
            // 尾羽
            ctx.fillStyle = getLightColor('#F5F5DC', state.timeOfDay);
            for (let i = -2; i <= 2; i++) {
                ctx.save();
                ctx.translate(-60, -20 + i * 8);
                ctx.rotate(-0.3 + i * 0.1 + Math.sin(state.time * 3 + i) * 0.1);
                ctx.beginPath();
                ctx.ellipse(0, 0, 35, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            // 后腿
            drawLeg(-30, 40, legCycle + Math.PI, true);
            
            // 身体
            const bodyGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 70);
            bodyGradient.addColorStop(0, getLightColor('#FAFAFA', state.timeOfDay));
            bodyGradient.addColorStop(0.7, getLightColor('#E8E8E8', state.timeOfDay));
            bodyGradient.addColorStop(1, getLightColor('#D0D0D0', state.timeOfDay));
            
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 70, 50, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 翅膀（后层）
            ctx.save();
            ctx.translate(-10, -10);
            ctx.rotate(-0.2 + wingFlap);
            ctx.fillStyle = getLightColor('#C0C0C0', state.timeOfDay);
            ctx.beginPath();
            ctx.ellipse(0, 0, 55, 25, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // 翅膀羽毛纹理
            ctx.strokeStyle = getLightColor('#A0A0A0', state.timeOfDay);
            ctx.lineWidth = 1;
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 12, -15);
                ctx.lineTo(i * 15 - 10, 20);
                ctx.stroke();
            }
            ctx.restore();
            
            // 前腿
            drawLeg(25, 35, legCycle, false);
            
            // 脖子和头
            ctx.fillStyle = getLightColor('#FAFAFA', state.timeOfDay);
            ctx.beginPath();
            ctx.moveTo(50, -20);
            ctx.quadraticCurveTo(80, -60, 75, -100);
            ctx.quadraticCurveTo(70, -130, 50, -135);
            ctx.quadraticCurveTo(30, -130, 35, -100);
            ctx.quadraticCurveTo(40, -60, 50, -20);
            ctx.fill();
            
            // 头部
            ctx.beginPath();
            ctx.ellipse(55, -140, 30, 25, 0.2, 0, Math.PI * 2);
            ctx.fill();
            
            // 喉囊（标志性特征）
            const pouchGradient = ctx.createLinearGradient(50, -110, 90, -60);
            pouchGradient.addColorStop(0, getLightColor('#FFB6C1', state.timeOfDay));
            pouchGradient.addColorStop(0.5, getLightColor('#FF69B4', state.timeOfDay));
            pouchGradient.addColorStop(1, getLightColor('#DB7093', state.timeOfDay));
            
            ctx.fillStyle = pouchGradient;
            ctx.beginPath();
            ctx.moveTo(60, -115);
            ctx.quadraticCurveTo(95 + pouchWobble, -100 + pouchWobble * 0.5, 90, -60);
            ctx.quadraticCurveTo(70, -50, 55, -60);
            ctx.quadraticCurveTo(50, -90, 60, -115);
            ctx.fill();
            
            // 喉囊高光
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(75, -85, 12, 8, 0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // 喙（上）
            ctx.fillStyle = getLightColor('#FFD700', state.timeOfDay);
            ctx.beginPath();
            ctx.moveTo(75, -145);
            ctx.quadraticCurveTo(140, -150, 155, -138);
            ctx.quadraticCurveTo(140, -130, 75, -135);
            ctx.closePath();
            ctx.fill();
            
            // 喙（下）
            ctx.fillStyle = getLightColor('#FFA500', state.timeOfDay);
            ctx.beginPath();
            ctx.moveTo(75, -132);
            ctx.quadraticCurveTo(130, -128, 145, -125);
            ctx.quadraticCurveTo(130, -118, 75, -122);
            ctx.closePath();
            ctx.fill();
            
            // 喙尖（深色）
            ctx.fillStyle = getLightColor('#CD853F', state.timeOfDay);
            ctx.beginPath();
            ctx.moveTo(145, -133);
            ctx.lineTo(158, -137);
            ctx.lineTo(152, -126);
            ctx.closePath();
            ctx.fill();
            
            // 眼睛
            const eyeX = 62;
            const eyeY = -148;
            
            // 眼白
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.ellipse(eyeX, eyeY, 10 * eyeScale, 9 * eyeScale, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 瞳孔
            const pupilOffset = state.pelicanScared ? 0 : Math.sin(state.time * 2) * 2;
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(eyeX + pupilOffset, eyeY, 5 * eyeScale, 0, Math.PI * 2);
            ctx.fill();
            
            // 眼睛高光
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(eyeX + pupilOffset + 2, eyeY - 2, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 受惊时的眉毛
            if (state.pelicanScared) {
                ctx.strokeStyle = getLightColor('#808080', state.timeOfDay);
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(50, -160);
                ctx.quadraticCurveTo(62, -168, 74, -160);
                ctx.stroke();
            }
            
            // 腮红
            ctx.fillStyle = 'rgba(255,182,193,0.5)';
            ctx.beginPath();
            ctx.ellipse(48, -138, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 头顶小羽毛
            ctx.fillStyle = getLightColor('#F5F5DC', state.timeOfDay);
            for (let i = -1; i <= 1; i++) {
                ctx.save();
                ctx.translate(50 + i * 8, -165);
                ctx.rotate(Math.sin(state.time * 4 + i) * 0.2 - 0.3);
                ctx.beginPath();
                ctx.ellipse(0, -8, 3, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            
            ctx.restore();
            
            // 汗珠效果（低体力时）
            if (state.stamina < 40 && Math.random() < 0.05) {
                sweatDrops.push({
                    x: centerX + 55,
                    y: pelicanY - 150,
                    vx: (Math.random() - 0.5) * 2,
                    vy: 2,
                    life: 60
                });
            }
        }
        
        function drawLeg(x, y, phase, isBack) {
            const legSwing = Math.sin(phase) * 25;
            const kneeBend = Math.abs(Math.cos(phase)) * 20;
            
            ctx.strokeStyle = getLightColor('#FF8C00', state.timeOfDay);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + legSwing * 0.5, y + 25);
            ctx.lineTo(x + legSwing, y + 45 + kneeBend);
            ctx.stroke();
            
            // 脚蹼
            ctx.fillStyle = getLightColor('#FF8C00', state.timeOfDay);
            ctx.beginPath();
            ctx.ellipse(x + legSwing, y + 50 + kneeBend, 12, 6, legSwing * 0.02, 0, Math.PI * 2);
            ctx.fill();
            
            // 脚趾
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.ellipse(x + legSwing + i * 8, y + 54 + kneeBay + Math.abs(i) * 2, 5, 3, i * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 绘制自行车
        function drawBicycle(centerX, pelicanY) {
            const bikeBounce = state.roadType === 'bumpy' ? 
                               Math.sin(state.time * 15 * state.speed) * 8 : 
                               Math.sin(state.time * 8 * state.speed) * 4;
            const scaredTilt = state.pelicanScared ? Math.sin(state.time * 30) * 0.05 : 0;
            
            const bikeY = pelicanY - 70 + bikeBounce;
            const wheelRotation = state.time * 8 * state.speed;
            const pedalRotation = state.time * 8 * state.speed;
            
            ctx.save();
            ctx.translate(centerX, bikeY);
            ctx.rotate(scaredTilt);
            
            // 后轮
            drawWheel(-55, 40, wheelRotation);
            
            // 前轮
            drawWheel(55, 40, wheelRotation);
            
            // 车架
            ctx.strokeStyle = getLightColor('#E74C3C', state.timeOfDay);
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 主车架三角形
            ctx.beginPath();
            // 下管
            ctx.moveTo(-55, 40);
            ctx.lineTo(45, 40);
            // 座管
            ctx.moveTo(-20, 40);
            ctx.lineTo(-30, -15);
            // 上管
            ctx.moveTo(-30, -15);
            ctx.lineTo(35, -5);
            // 前叉
            ctx.moveTo(55, 40);
            ctx.lineTo(40, -25);
            // 座撑
            ctx.moveTo(-30, -15);
            ctx.lineTo(-55, 40);
            ctx.stroke();
            
            // 车座
            ctx.fillStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.beginPath();
            ctx.ellipse(-30, -20, 20, 7, -0.1, 0, Math.PI * 2);
            ctx.fill();
            // 座垫纹理
            ctx.strokeStyle = getLightColor('#1a1a1a', state.timeOfDay);
            ctx.lineWidth = 1;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(-42 + i * 6, -23);
                ctx.lineTo(-38 + i * 6, -17);
                ctx.stroke();
            }
            
            // 车把
            ctx.strokeStyle = getLightColor('#7F8C8D', state.timeOfDay);
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(40, -25);
            ctx.lineTo(42, -45);
            ctx.stroke();
            
            // 把手
            ctx.strokeStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(25, -47);
            ctx.lineTo(58, -47);
            ctx.stroke();
            
            // 把手套
            ctx.fillStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.beginPath();
            ctx.ellipse(25, -47, 6, 4, 0, 0, Math.PI * 2);
            ctx.ellipse(58, -47, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 车铃（在右把手上）
            drawBell(58, -52);
            
            // 踏板和曲柄组
            const crankX = -20;
            const crankY = 40;
            const crankRadius = 15;
            
            // 牙盘
            ctx.fillStyle = getLightColor('#7F8C8D', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(crankX, crankY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = getLightColor('#5D6D7E', state.timeOfDay);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(crankX, crankY, 8, 0, Math.PI * 2);
            ctx.stroke();
            
            // 曲柄
            ctx.strokeStyle = getLightColor('#5D6D7E', state.timeOfDay);
            ctx.lineWidth = 4;
            
            // 右曲柄和踏板
            const rightPedalX = crankX + Math.sin(pedalRotation) * crankRadius;
            const rightPedalY = crankY + Math.cos(pedalRotation) * crankRadius;
            ctx.beginPath();
            ctx.moveTo(crankX, crankY);
            ctx.lineTo(rightPedalX, rightPedalY);
            ctx.stroke();
            drawPedal(rightPedalX, rightPedalY, pedalRotation);
            
            // 左曲柄和踏板
            const leftPedalX = crankX + Math.sin(pedalRotation + Math.PI) * crankRadius;
            const leftPedalY = crankY + Math.cos(pedalRotation + Math.PI) * crankRadius;
            ctx.beginPath();
            ctx.moveTo(crankX, crankY);
            ctx.lineTo(leftPedalX, leftPedalY);
            ctx.stroke();
            drawPedal(leftPedalX, leftPedalY, pedalRotation + Math.PI);
            
            // 链条（简化表示）
            ctx.strokeStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 2]);
            ctx.beginPath();
            ctx.ellipse(crankX, crankY, 12, 12, 0, 0, Math.PI * 2);
            ctx.ellipse(-55, 40, 18, 18, 0, 0.5, 2.6);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 缰绳（连接车把到鹈鹕头部）
            ctx.strokeStyle = getLightColor('#8B4513', state.timeOfDay);
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 3]);
            ctx.beginPath();
            ctx.moveTo(58, -47);
            ctx.quadraticCurveTo(80, -80, 55, -210); // 连接到鹈鹕头部位置
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 缰绳末端环
            ctx.fillStyle = getLightColor('#DAA520', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(55, -210, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawWheel(x, y, rotation) {
            // 外胎
            ctx.fillStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(x, y, 28, 0, Math.PI * 2);
            ctx.fill();
            
            // 胎面纹理
            ctx.strokeStyle = getLightColor('#1a1a1a', state.timeOfDay);
            ctx.lineWidth = 3;
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2 + rotation;
                const x1 = x + Math.cos(angle) * 24;
                const y1 = y + Math.sin(angle) * 24;
                const x2 = x + Math.cos(angle) * 28;
                const y2 = y + Math.sin(angle) * 28;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            
            // 内圈（轮毂）
            ctx.fillStyle = getLightColor('#BDC3C7', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // 辐条
            ctx.strokeStyle = getLightColor('#95A5A6', state.timeOfDay);
            ctx.lineWidth = 2;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + rotation;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(angle) * 8, y + Math.sin(angle) * 8);
                ctx.lineTo(x + Math.cos(angle) * 24, y + Math.sin(angle) * 24);
                ctx.stroke();
            }
            
            // 轮毂中心
            ctx.fillStyle = getLightColor('#7F8C8D', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawBell(x, y) {
            const bellShake = state.isBellRinging ? Math.sin(state.bellTimer * 50) * 3 : 0;
            
            ctx.save();
            ctx.translate(x + bellShake, y);
            
            // 铃铛本体
            const bellGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, 8);
            bellGradient.addColorStop(0, getLightColor('#FFD700', state.timeOfDay));
            bellGradient.addColorStop(1, getLightColor('#DAA520', state.timeOfDay));
            ctx.fillStyle = bellGradient;
            
            ctx.beginPath();
            ctx.arc(0, 0, 7, Math.PI, 0);
            ctx.quadraticCurveTo(8, 5, 0, 8);
            ctx.quadraticCurveTo(-8, 5, -7, 0);
            ctx.fill();
            
            // 铃铛敲击器
            ctx.fillStyle = getLightColor('#8B4513', state.timeOfDay);
            ctx.beginPath();
            ctx.arc(0, 5, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 铃声波纹
            if (state.isBellRinging) {
                ctx.strokeStyle = `rgba(255,215,0,${1 - state.bellTimer / 0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 10 + state.bellTimer * 30, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        function drawPedal(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation * 0.3);
            
            // 踏板主体
            ctx.fillStyle = getLightColor('#2C3E50', state.timeOfDay);
            ctx.fillRect(-8, -3, 16, 6);
            
            // 防滑纹
            ctx.strokeStyle = getLightColor('#5D6D7E', state.timeOfDay);
            ctx.lineWidth = 1;
            for (let i = -5; i <= 5; i += 2) {
                ctx.beginPath();
                ctx.moveTo(i, -2);
                ctx.lineTo(i, 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        // 绘制粒子
        function drawParticles() {
            // 羽毛粒子
            feathers.forEach((feather, index) => {
                feather.x -= feather.vx * state.speed;
                feather.y += feather.vy;
                feather.rotation += feather.rotSpeed;
                feather.life--;
                
                if (feather.life <= 0 || feather.y > height) {
                    feathers.splice(index, 1);
                    return;
                }
                
                ctx.save();
                ctx.translate(feather.x, feather.y);
                ctx.rotate(feather.rotation);
                ctx.globalAlpha = feather.life / feather.maxLife;
                ctx.fillStyle = getLightColor('#F5F5DC', state.timeOfDay);
                ctx.beginPath();
                ctx.ellipse(0, 0, feather.size, feather.size * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            // 汗珠粒子
            sweatDrops.forEach((drop, index) => {
                drop.x += drop.vx;
                drop.y += drop.vy;
                drop.vy += 0.2;
                drop.life--;
                
                if (drop.life <= 0 || drop.y > height) {
                    sweatDrops.splice(index, 1);
                    return;
                }
                
                ctx.fillStyle = `rgba(100,180,255,${drop.life / 60})`;
                ctx.beginPath();
                ctx.ellipse(drop.x, drop.y, 3, 4, 0, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 投喂小鱼粒子
            fishParticles.forEach((fish, index) => {
                fish.x += fish.vx;
                fish.y += fish.vy;
                fish.vy += 0.15;
                fish.rotation = Math.atan2(fish.vy, fish.vx);
                fish.life--;
                
                if (fish.life <= 0 || fish.y > height) {
                    fishParticles.splice(index, 1);
                    return;
                }
                
                ctx.save();
                ctx.translate(fish.x, fish.y);
                ctx.rotate(fish.rotation);
                ctx.globalAlpha = fish.life / fish.maxLife;
                
                // 小鱼形状
                ctx.fillStyle = '#3498DB';
                ctx.beginPath();
                ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 鱼尾
                ctx.beginPath();
                ctx.moveTo(-10, 0);
                ctx.lineTo(-18, -6);
                ctx.lineTo(-18, 6);
                ctx.closePath();
                ctx.fill();
                
                // 眼睛
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(6, -2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.arc(7, -2, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
            
            ctx.globalAlpha = 1;
        }
        
        // 随机生成羽毛
        function spawnFeather() {
            if (Math.random() < 0.02 * state.speed) {
                feathers.push({
                    x: width + 20,
                    y: height * 0.4 + Math.random() * 100,
                    vx: -2 - Math.random() * 2,
                    vy: -1 + Math.random() * 2,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.1,
                    size: 8 + Math.random() * 12,
                    life: 200 + Math.random() * 100,
                    maxLife: 300
                });
            }
        }
        
        // ============ 主渲染循环 ============
        function render() {
            // 更新时间
            state.time += 0.016 * state.speed;
            
            // 更新状态
            updateState();
            
            // 清空画布
            ctx.clearRect(0, 0, width, height);
            
            // 绘制各层
            drawSky();
            drawClouds();
            drawOcean();
            drawBoardwalk();
            
            // 计算主体位置
            const centerX = width * 0.45;
            const centerY = height * 0.68;
            
            // 绘制鹈鹕和自行车
            drawPelican(centerX, centerY);
            drawBicycle(centerX, centerY);
            
            // 绘制粒子
            spawnFeather();
            drawParticles();
            
            requestAnimationFrame(render);
        }
        
        function updateState() {
            // 体力消耗
            const staminaDrain = state.speed * 0.02;
            state.stamina = Math.max(0, state.stamina - staminaDrain);
            
            // 更新UI
            const staminaFill = document.getElementById('staminaFill');
            staminaFill.style.width = state.stamina + '%';
            staminaFill.className = 'stamina-fill' + (state.stamina < 30 ? ' low' : '');
            
            // 铃声计时
            if (state.isBellRinging) {
                state.bellTimer += 0.016;
                if (state.bellTimer > 0.5) {
                    state.isBellRinging = false;
                    state.bellTimer = 0;
                }
            }
            
            // 受惊状态计时
            if (state.pelicanScared) {
                state.scaredTimer -= 0.016;
                if (state.scaredTimer <= 0) {
                    state.pelicanScared = false;
                }
            }
            
            // 冲刺计时
            if (state.isSprinting) {
                state.sprintTimer -= 0.016;
                if (state.sprintTimer <= 0) {
                    state.isSprinting = false;
                    document.getElementById('speedSlider').value = 1;
                    state.speed = 1;
                    document.getElementById('speedValue').textContent = '1.0x';
                }
            }
        }
        
        // ============ 事件处理 ============
        
        // 车铃按钮
        document.getElementById('bellBtn').addEventListener('click', () => {
            state.isBellRinging = true;
            state.bellTimer = 0;
            state.pelicanScared = true;
            state.scaredTimer = 1.5;
            playBellSound();
            
            // 受惊时掉落羽毛
            for (let i = 0; i < 5; i++) {
                feathers.push({
                    x: width * 0.45 + (Math.random() - 0.5) * 100,
                    y: height * 0.55 + Math.random() * 50,
                    vx: -3 - Math.random() * 3,
                    vy: -3 - Math.random() * 3,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.2,
                    size: 10 + Math.random() * 10,
                    life: 150,
                    maxLife: 150
                });
            }
        });
        
        // 速度滑块
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = state.speed.toFixed(1) + 'x';
        });
        
        // 投喂按钮
        document.getElementById('feedBtn').addEventListener('click', () => {
            if (state.fishCount > 0) {
                state.fishCount--;
                document.getElementById('fishCount').textContent = state.fishCount;
                
                // 恢复体力
                state.stamina = Math.min(100, state.stamina + 25);
                
                // 创建投喂动画
                const feedBtn = document.getElementById('feedBtn');
                const rect = feedBtn.getBoundingClientRect();
                
                for (let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        fishParticles.push({
                            x: rect.left + rect.width / 2,
                            y: rect.top,
                            vx: (width * 0.45 - rect.left) / 30 + (Math.random() - 0.5) * 2,
                            vy: (height * 0.6 - rect.top) / 30,
                            rotation: 0,
                            life: 60,
                            maxLife: 60
                        });
                    }, i * 100);
                }
                
                // 更新按钮状态
                if (state.fishCount === 0) {
                    feedBtn.disabled = true;
                }
            }
        });
        
        // 时间切换
        document.querySelectorAll('[data-time]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.timeOfDay = btn.dataset.time;
            });
        });
        
        // 路况切换
        document.querySelectorAll('[data-road]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-road]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.roadType = btn.dataset.road);
            });
        });
        
        // 窗口大小调整
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initBackgroundElements();
        });
        
        // 双击触发冲刺
        canvas.addEventListener('dblclick', () => {
            if (state.stamina > 20) {
                state.isSprinting = true;
                state.sprintTimer = 2;
                state.speed = 3;
                document.getElementById('speedSlider').value = 3;
                document.getElementById('speedValue').textContent = '3.0x';
                state.stamina -= 20;
            }
        });
        
        // 启动渲染
        render();
    </script>
</body>
</html>
