<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
  <style>
    /* ---------------- 全局重置与高级系统字体栈 (零外部字体，100%纯原生) ---------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b132b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #f0f4f8;
    }

    /* ---------------- 全屏主舞台画布 ---------------- */
    #stage-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: crosshair;
    }

    canvas#canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ---------------- 顶部浮动信息状态条 (Glassmorphism 玻璃拟态) ---------------- */
    .top-nav {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 12px;
    }

    .brand-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-pill:hover {
      border-color: rgba(255, 215, 0, 0.45);
      transform: translateY(-1px);
    }

    .brand-badge {
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      border-radius: 50%;
      box-shadow: 0 4px 12px rgba(255, 126, 95, 0.45);
      animation: pulse-badge 2.4s infinite ease-in-out;
    }
    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.68);
      letter-spacing: 0.2px;
    }

    /* 状态与仪表组件 */
    .dashboard-center {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 22px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 58px;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 2px;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    /* 体力能量条 */
    .energy-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 115px;
    }
    .energy-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .energy-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6);
      border-radius: 6px;
      transition: width 0.15s ease-out, background 0.3s;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .energy-bar-fill.tired {
      background: linear-gradient(90deg, #ef4444, #f97316);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);
    }

    .top-actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      color: #f8fafc;
      font-size: 18px;
      cursor: pointer;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
    }
    .icon-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px) scale(1.05);
    }
    .icon-btn:active {
      transform: translateY(1px) scale(0.96);
    }
    .icon-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
    }

    /* ---------------- 底部现代浮动控制中枢 Dock ---------------- */
    .bottom-dock-wrapper {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 48px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .control-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 20px;
      border-radius: 36px;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .control-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
    .control-btn:active {
      transform: translateY(1px) scale(0.97);
    }

    /* 招牌按键专属色系 */
    .btn-bell {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(234, 88, 12, 0.2));
      border-color: rgba(245, 158, 11, 0.5);
      color: #fef08a;
    }
    .btn-bell:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.5), rgba(234, 88, 12, 0.4));
      border-color: #fbbf24;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }

    .btn-sprint {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(217, 70, 239, 0.25));
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecdd3;
    }
    .btn-sprint:hover, .btn-sprint.boosting {
      background: linear-gradient(135deg, #ef4444, #ec4899);
      border-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }

    .btn-feed {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.3), rgba(16, 185, 129, 0.25));
      border-color: rgba(14, 165, 233, 0.5);
      color: #bae6fd;
    }
    .btn-feed:hover {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.5), rgba(16, 185, 129, 0.45));
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.5);
    }

    .btn-terrain {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(79, 70, 229, 0.25));
      border-color: rgba(139, 92, 246, 0.5);
      color: #ddd6fe;
    }
    .btn-terrain:hover {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), rgba(79, 70, 229, 0.45));
      border-color: #a78bfa;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
    }

    /* 快捷键提示条 */
    .keyboard-hint {
      pointer-events: auto;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.16);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 700;
      color: #ffd166;
    }

    /* 浮动表情气泡动画 */
    .floating-popup {
      position: absolute;
      pointer-events: none;
      z-index: 20;
      font-weight: 800;
      animation: float-up-fade 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes float-up-fade {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      20% { opacity: 1; transform: translate(-50%, -20px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(0.9); }
    }

    /* 移动端与紧凑布局自适应 */
    @media (max-width: 900px) {
      .top-nav { flex-wrap: wrap; gap: 8px; }
      .brand-text h1 { font-size: 13px; }
      .dashboard-center { padding: 6px 14px; gap: 10px; }
      .bottom-dock { padding: 8px 16px; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .control-btn { padding: 8px 14px; font-size: 12px; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>
<body>

  <!-- 主舞台 Canvas -->
  <div id="stage-container">
    <canvas id="canvas"></canvas>
  </div>

  <!-- 顶部状态栏 -->
  <header class="top-nav">
    <div class="brand-pill" title="颠覆传统的物理奇景：一辆自行车正在骑着一只大嘴鹈鹕！">
      <div class="brand-badge">🚴‍♂️</div>
      <div class="brand-text">
        <h1>自行车骑鹈鹕 · The Noble Steed</h1>
        <p>A Bicycle Riding a Pelican · 物理颠簸与弹性奇景</p>
      </div>
    </div>

    <!-- 核心状态数据 -->
    <div class="dashboard-center">
      <div class="stat-item">
        <span class="stat-label">时速 Speed</span>
        <span class="stat-val" id="val-speed">32 km/h</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">踏频 Cadence</span>
        <span class="stat-val" id="val-cadence">88 rpm</span>
      </div>

      <div class="stat-item">
        <span class="stat-label">小鱼吞食 Fish</span>
        <span class="stat-val" id="val-fish" style="color: #ffd166;">0 条</span>
      </div>

      <div class="energy-wrap">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="stat-label">鹈鹕体力 Stamina</span>
          <span class="stat-label" id="val-energy-text" style="color:#10b981; font-weight:700;">100%</span>
        </div>
        <div class="energy-bar-bg">
          <div class="energy-bar-fill" id="energy-fill"></div>
        </div>
      </div>
    </div>

    <!-- 右侧环境与音效按钮 -->
    <div class="top-actions">
      <button class="icon-btn" id="btn-env" title="切换昼夜场景 (白昼 / 晚霞 / 霓虹 / 风暴)">☀️</button>
      <button class="icon-btn active" id="btn-audio" title="开启/关闭 Web Audio 原生音效">🔔</button>
      <button class="icon-btn" id="btn-slowmo" title="慢动作电影视角 (Slow Motion)">⏱️</button>
    </div>
  </header>

  <!-- 底部操控 Dock -->
  <div class="bottom-dock-wrapper">
    <div class="bottom-dock">
      <button class="control-btn btn-bell" id="act-bell">
        <span style="font-size:18px;">🔔</span>
        <span>按车铃 (Ring!)</span>
      </button>

      <button class="control-btn btn-sprint" id="act-sprint">
        <span style="font-size:18px;">⚡</span>
        <span id="txt-sprint">氮气冲刺 (Sprint)</span>
      </button>

      <button class="control-btn btn-feed" id="act-feed">
        <span style="font-size:18px;">🐟</span>
        <span>投喂鲜鱼 (Feed Fish)</span>
      </button>

      <button class="control-btn btn-terrain" id="act-terrain">
        <span style="font-size:18px;">🛣️</span>
        <span id="txt-terrain">路况：海滨木栈道</span>
      </button>
    </div>

    <div class="keyboard-hint">
      <span>快捷操作：<span class="kbd">空格/B</span> 摇响车铃</span>
      <span>•</span>
      <span><span class="kbd">Shift</span> 氮气冲刺</span>
      <span>•</span>
      <span><span class="kbd">F / 单击屏幕</span> 投掷小鱼</span>
      <span>•</span>
      <span><span class="kbd">T</span> 切换路况</span>
      <span>•</span>
      <span><span class="kbd">E</span> 变换昼夜</span>
    </div>
  </div>

  <!-- 纯原生 JavaScript 与 Web Audio 仿真物理系统 -->
  <script>
  (function () {
    'use strict';

    /* ==========================================================================
       0. Canvas Polyfill 防御式兼容保障
       ========================================================================== */
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'undefined') r = 0;
        if (typeof r === 'number') r = [r, r, r, r];
        const rad = r[0] || 0;
        this.beginPath();
        this.moveTo(x + rad, y);
        this.arcTo(x + w, y, x + w, y + h, rad);
        this.arcTo(x + w, y + h, x, y + h, rad);
        this.arcTo(x, y + h, x, y, rad);
        this.arcTo(x, y, x + w, y, rad);
        this.closePath();
        return this;
      };
    }

    /* ==========================================================================
       1. 全局配置与状态模型
       ========================================================================== */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = window.devicePixelRatio || 1;

    // 游戏核心物理与动画状态
    const state = {
      // 速度与运动学
      baseSpeed: 1.0,
      currentSpeed: 1.0,
      targetSpeed: 1.0,
      isBoosting: false,
      stamina: 100,
      isExhausted: false,

      // 颠簸与路面物理
      distance: 0,
      terrain: 0,            // 0: 木栈道, 1: 鹅卵石石子路, 2: 飞跃滑翔模式
      terrainNames: ['海滨木栈道', '颠簸鹅卵石', '凌空飞跃滑翔'],
      bumpY: 0,
      bumpRot: 0,
      cameraShake: 0,

      // 鹈鹕弹簧大喉囊与生物物理
      pouchSpring: {
        pos: 0,
        vel: 0,
        target: 0,
        k: 0.16,      // 弹性劲度
        damp: 0.88    // 阻尼
      },
      headBob: 0,
      wingFlap: 0,
      eyeState: 'normal',    // normal, shocked, happy, tired
      eyeTimer: 0,
      blinkTimer: 180,

      // 车铃震动
      bellRinging: 0,

      // 环境与昼夜 (0: 晴天白昼, 1: 浪漫晚霞, 2: 赛博霓虹, 3: 风暴骤雨)
      envIndex: 0,
      envThemes: [
        { name: '晴朗白昼', icon: '☀️', skyTop: '#38bdf8', skyMid: '#7dd3fc', skyBot: '#fed7aa', sea: '#0284c7', sand: '#f59e0b', plank: '#b45309' },
        { name: '日落晚霞', icon: '🌅', skyTop: '#4c1d95', skyMid: '#c026d3', skyBot: '#fb923c', sea: '#312e81', sand: '#d97706', plank: '#9a3412' },
        { name: '赛博霓虹', icon: '🌃', skyTop: '#050515', skyMid: '#1e1b4b', skyBot: '#0f172a', sea: '#030712', sand: '#064e3b', plank: '#111827' },
        { name: '海滨风暴', icon: '🌧️', skyTop: '#1e293b', skyMid: '#334155', skyBot: '#64748b', sea: '#0f172a', sand: '#475569', plank: '#334155' }
      ],

      // 投喂与吞鱼系统
      fishes: [],
      eatenCount: 0,
      pouchBulge: 0,
      pouchFishInside: 0,

      // 慢动作特写
      isSlowMo: false,
      timeScale: 1.0,

      // 粒子与生动背景
      particles: [],
      speedLines: [],
      clouds: [],
      waves: [],
      sweatDrops: [],
      hearts: [],
      seagulls: []
    };

    /* ==========================================================================
       2. Web Audio API 纯原生合成音效引擎 (零外部依赖，100%纯振荡器)
       ========================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 1. 经典复古双音车铃声 (Ding-Ding-Ring!)
      playBell() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const freqs = [1860, 2480]; // 高低双频叮咚金属共鸣

        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);

          // 快速敲击与极长余音
          gain.gain.setValueAtTime(0, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0.4, now + idx * 0.08 + 0.005);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.95);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 1.0);
        });
      }

      // 2. 鲜鱼扑腾入嘴吞咽声 (Pop & Gulp)
      playGulp() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.26);
      }

      // 3. 氮气推进喷射声 (Nitro Boost Swoosh)
      playNitro() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1; // 白噪声
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400, now);
        filter.frequency.exponentialRampToValueAtTime(2400, now + 0.2);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.5);
        filter.Q.value = 3.0;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        noise.stop(now + 0.5);
      }

      // 4. 鹈鹕蹼足拍地声 (Foot Patter)
      playFootStep() {
        if (!this.enabled || state.terrain === 2) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(110 + Math.random() * 30, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.05);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.07);
      }
    }

    const sound = new SoundEngine();

    /* ==========================================================================
       3. 画布尺寸重置与云朵/海浪/海鸥初始化
       ========================================================================== */
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = window.devicePixelRatio || 1;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      initBackgroundElements();
    }
    window.addEventListener('resize', resize);

    function initBackgroundElements() {
      // 云朵
      state.clouds = [];
      for (let i = 0; i < 7; i++) {
        state.clouds.push({
          x: Math.random() * width,
          y: 30 + Math.random() * (height * 0.35),
          scale: 0.6 + Math.random() * 0.8,
          speed: 0.2 + Math.random() * 0.3
        });
      }

      // 海浪
      state.waves = [];
      const waveCount = 5;
      for (let i = 0; i < waveCount; i++) {
        state.waves.push({
          offset: Math.random() * Math.PI * 2,
          speed: 0.02 + i * 0.015,
          amp: 6 + i * 4,
          freq: 0.008 + i * 0.003
        });
      }

      // 海鸥群
      state.seagulls = [];
      for (let i = 0; i < 4; i++) {
        state.seagulls.push({
          x: Math.random() * width,
          y: 60 + Math.random() * (height * 0.25),
          speed: 1.2 + Math.random() * 0.8,
          wingPhase: Math.random() * Math.PI * 2,
          scale: 0.5 + Math.random() * 0.4
        });
      }
    }

    /* ==========================================================================
       4. 粒子与特效系统
       ========================================================================== */
    function spawnDust(x, y) {
      if (state.terrain === 2) return;
      for (let i = 0; i < 4; i++) {
        state.particles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 8,
          vx: -(Math.random() * 4 + 2) * state.currentSpeed,
          vy: -(Math.random() * 3 + 1),
          size: Math.random() * 7 + 4,
          alpha: 0.65,
          color: state.envThemes[state.envIndex].sand,
          decay: 0.03
        });
      }
    }

    function spawnNitroSparks(x, y) {
      for (let i = 0; i < 5; i++) {
        state.particles.push({
          x: x + (Math.random() - 0.5) * 10,
          y: y + (Math.random() - 0.5) * 10,
          vx: -(Math.random() * 12 + 8),
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 5 + 3,
          alpha: 1.0,
          color: Math.random() > 0.5 ? '#38bdf8' : '#f43f5e',
          decay: 0.05
        });
      }
    }

    function spawnSweat(x, y) {
      state.sweatDrops.push({
        x: x + (Math.random() - 0.5) * 15,
        y: y + (Math.random() - 0.5) * 10,
        vx: -(Math.random() * 5 + 2),
        vy: -(Math.random() * 4 + 2),
        gravity: 0.35,
        size: Math.random() * 4 + 3,
        alpha: 0.9
      });
    }

    function spawnHeart(x, y) {
      state.hearts.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y,
        vy: -(Math.random() * 2 + 1.5),
        alpha: 1.0,
        scale: 0.8 + Math.random() * 0.4
      });
    }

    function spawnPopup(text, color = '#ffd166', x = width * 0.45, y = height * 0.38) {
      const el = document.createElement('div');
      el.className = 'floating-popup';
      el.innerText = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.color = color;
      el.style.fontSize = '20px';
      el.style.textShadow = '0 0 10px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.6)';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    /* ==========================================================================
       5. 绘制模块：分层视差自然海滨背景
       ========================================================================== */
    function drawSkyAndSun(theme) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.75);
      skyGrad.addColorStop(0, theme.skyTop);
      skyGrad.addColorStop(0.55, theme.skyMid);
      skyGrad.addColorStop(1, theme.skyBot);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // 太阳 / 月亮 / 霓虹光轮
      const sunX = width * 0.82;
      const sunY = height * 0.22;

      if (state.envIndex === 0) {
        // 白昼太阳
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 90);
        sunGlow.addColorStop(0, 'rgba(255, 255, 230, 1)');
        sunGlow.addColorStop(0.3, 'rgba(255, 225, 120, 0.6)');
        sunGlow.addColorStop(1, 'rgba(255, 200, 50, 0)');
        ctx.fillStyle = sunGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 90, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fffdf0';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.envIndex === 1) {
        // 日落红日
        const sunsetGlow = ctx.createRadialGradient(sunX, sunY + 60, 20, sunX, sunY + 60, 140);
        sunsetGlow.addColorStop(0, 'rgba(255, 100, 60, 0.9)');
        sunsetGlow.addColorStop(0.4, 'rgba(244, 63, 94, 0.5)');
        sunsetGlow.addColorStop(1, 'rgba(192, 38, 211, 0)');
        ctx.fillStyle = sunsetGlow;
        ctx.beginPath();
        ctx.arc(sunX, sunY + 60, 140, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffedd5';
        ctx.beginPath();
        ctx.arc(sunX, sunY + 60, 40, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.envIndex === 2) {
        // 赛博月亮与全息光轮
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      // 云朵
      ctx.fillStyle = state.envIndex === 2 ? 'rgba(56, 189, 248, 0.15)' : 'rgba(255, 255, 255, 0.65)';
      state.clouds.forEach(c => {
        c.x -= c.speed * state.currentSpeed * 0.8;
        if (c.x < -160) c.x = width + 100;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.arc(24, -10, 32, 0, Math.PI * 2);
        ctx.arc(55, -2, 28, 0, Math.PI * 2);
        ctx.arc(80, 0, 22, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // 盘旋海鸥
      ctx.strokeStyle = state.envIndex === 2 ? '#38bdf8' : '#ffffff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      state.seagulls.forEach(g => {
        g.x -= (g.speed + state.currentSpeed * 0.4);
        g.wingPhase += 0.15;
        if (g.x < -40) {
          g.x = width + 40;
          g.y = 50 + Math.random() * (height * 0.28);
        }
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.scale(g.scale, g.scale);
        const wingY = Math.sin(g.wingPhase) * 6;
        ctx.beginPath();
        ctx.moveTo(-12, wingY);
        ctx.quadraticCurveTo(-6, 0, 0, -2);
        ctx.quadraticCurveTo(6, 0, 12, wingY);
        ctx.stroke();
        ctx.restore();
      });
    }

    function drawParallaxSeaAndMountains(theme) {
      const seaLevel = height * 0.52;

      // 远景山脉剪影与灯塔
      ctx.fillStyle = state.envIndex === 2 ? '#0f172a' : 'rgba(30, 41, 59, 0.28)';
      ctx.beginPath();
      ctx.moveTo(0, seaLevel);
      const mOffset = (state.distance * 0.1) % 400;
      for (let x = 0; x <= width + 400; x += 100) {
        const peak = Math.sin((x - mOffset) * 0.005) * 45 + Math.cos((x - mOffset) * 0.012) * 20;
        ctx.lineTo(x, seaLevel - 60 - peak);
      }
      ctx.lineTo(width, seaLevel);
      ctx.closePath();
      ctx.fill();

      // 远景灯塔 (Lighthouse)
      const lhX = ((width * 0.7 - state.distance * 0.12) % (width + 300) + (width + 300)) % (width + 300) - 100;
      const lhY = seaLevel - 65;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(lhX - 8, lhY - 45, 16, 45);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(lhX - 8, lhY - 32, 16, 12);

      // 灯塔光束
      const beamAngle = Date.now() * 0.0018;
      ctx.save();
      ctx.translate(lhX, lhY - 45);
      ctx.rotate(beamAngle);
      const beamGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 260);
      beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.8)');
      beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(260, -35);
      ctx.lineTo(260, 35);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 大海海面
      const seaGrad = ctx.createLinearGradient(0, seaLevel, 0, height * 0.76);
      seaGrad.addColorStop(0, theme.sea);
      seaGrad.addColorStop(1, state.envIndex === 2 ? '#020617' : '#0369a1');
      ctx.fillStyle = seaGrad;
      ctx.fillRect(0, seaLevel, width, height * 0.76 - seaLevel);

      // 海浪涌动波纹
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 2;
      state.waves.forEach((w, idx) => {
        ctx.beginPath();
        const yBase = seaLevel + 25 + idx * 28;
        for (let x = 0; x <= width; x += 30) {
          const y = yBase + Math.sin(x * w.freq + state.distance * 0.02 + w.offset) * w.amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }

    function drawGroundAndRoad(theme) {
      const roadY = height * 0.74;

      if (state.terrain === 2) {
        // 凌空滑翔模式：路面远离下沉，下方是壮丽翻滚的白云海
        const cloudSeaGrad = ctx.createLinearGradient(0, roadY, 0, height);
        cloudSeaGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
        cloudSeaGrad.addColorStop(1, 'rgba(224, 242, 254, 0.95)');
        ctx.fillStyle = cloudSeaGrad;
        ctx.fillRect(0, roadY + 40, width, height - (roadY + 40));

        // 飘过的流云团
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 8; i++) {
          const cx = ((i * 240 - state.distance * 2.2) % (width + 300) + (width + 300)) % (width + 300) - 100;
          const cy = roadY + 60 + Math.sin(i + Date.now() * 0.002) * 15;
          ctx.beginPath();
          ctx.arc(cx, cy, 40, 0, Math.PI * 2);
          ctx.arc(cx + 40, cy - 10, 50, 0, Math.PI * 2);
          ctx.arc(cx + 80, cy, 35, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }

      // 沙滩地表基底
      ctx.fillStyle = theme.sand;
      ctx.fillRect(0, roadY, width, height - roadY);

      if (state.terrain === 0) {
        // 【海滨木栈道 (Plank Walkway)】
        ctx.fillStyle = theme.plank;
        ctx.fillRect(0, roadY, width, height - roadY);

        // 木板拼缝线 (高速滚动视差)
        const plankWidth = 55;
        const offset = (state.distance * 4.2) % plankWidth;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.lineWidth = 3;
        for (let x = -offset; x <= width + plankWidth; x += plankWidth) {
          ctx.beginPath();
          ctx.moveTo(x, roadY);
          ctx.lineTo(x, height);
          ctx.stroke();

          // 栈道螺栓铜钉
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(x + 12, roadY + 16, 2.5, 0, Math.PI * 2);
          ctx.arc(x + 12, roadY + 50, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // 栈道上沿高光
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(0, roadY, width, 5);

        // 护栏立柱
        const postDist = 180;
        const postOffset = (state.distance * 2.5) % postDist;
        ctx.fillStyle = '#78350f';
        for (let x = -postOffset; x <= width + postDist; x += postDist) {
          ctx.fillRect(x - 8, roadY - 48, 16, 52);
          ctx.beginPath();
          ctx.arc(x, roadY - 48, 10, Math.PI, 0);
          ctx.fill();
        }
        // 连结索绳
        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let x = -postOffset; x <= width + postDist; x += postDist) {
          ctx.quadraticCurveTo(x + postDist * 0.5, roadY - 24, x + postDist, roadY - 38);
        }
        ctx.stroke();

      } else if (state.terrain === 1) {
        // 【颠簸鹅卵石石子路 (Bumpy Cobblestone)】
        ctx.fillStyle = '#475569';
        ctx.fillRect(0, roadY, width, height - roadY);

        const stoneWidth = 42;
        const offset = (state.distance * 4.2) % stoneWidth;
        for (let r = 0; r < 4; r++) {
          const rowY = roadY + 8 + r * 30;
          const shift = (r % 2) * 20;
          for (let x = -offset + shift; x <= width + stoneWidth; x += stoneWidth) {
            ctx.fillStyle = ((x * 7 + r * 13) % 2 === 0) ? '#64748b' : '#334155';
            ctx.beginPath();
            ctx.roundRect(x - 18, rowY - 10, 36, 22, 10);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      }
    }

    /* ==========================================================================
       6. 核心主体：鹈鹕（坐骑）与自行车（骑手）的超精细物理与骨架渲染
       ========================================================================== */
    function drawPelicanAndBicycle(cx, cy) {
      const phase = (state.distance * 0.08);

      // 鹈鹕身体起伏
      let pelicanY = cy;
      let pelicanRot = 0;

      if (state.terrain === 2) {
        pelicanY += Math.sin(Date.now() * 0.003) * 12;
        pelicanRot = Math.sin(Date.now() * 0.002) * 0.04 - 0.05;
      } else {
        const bobAmp = state.terrain === 1 ? 16 : 9;
        pelicanY += Math.sin(phase * 2) * bobAmp + state.bumpY;
        pelicanRot = Math.sin(phase * 2 + 0.3) * 0.06 + state.bumpRot;
      }

      ctx.save();
      // 引入微弱震屏
      if (state.cameraShake > 0) {
        ctx.translate((Math.random() - 0.5) * state.cameraShake, (Math.random() - 0.5) * state.cameraShake);
      }
      ctx.translate(cx, pelicanY);
      ctx.rotate(pelicanRot);

      // 投影 (Shadow)
      if (state.terrain !== 2) {
        ctx.save();
        ctx.translate(0, cy - pelicanY + (height * 0.74 - cy));
        ctx.scale(1.2, 0.25);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.beginPath();
        ctx.arc(0, 0, 85, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // ----------------------------------------------------
      // A. 远侧 鹈鹕腿与蹼足 (Far Leg)
      // ----------------------------------------------------
      drawPelicanLeg(phase + Math.PI, true, cy - pelicanY);

      // ----------------------------------------------------
      // B. 远侧翅膀 (Far Wing)
      // ----------------------------------------------------
      drawPelicanWing(phase + Math.PI * 0.5, true);

      // ----------------------------------------------------
      // C. 鹈鹕丰满躯干与毛茸茸羽毛 (Pelican Body)
      // ----------------------------------------------------
      // 尾羽 (Tail Feathers)
      ctx.save();
      ctx.translate(-75, -5);
      ctx.rotate(Math.sin(phase) * 0.15 - 0.2);
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-38, -12);
      ctx.lineTo(-42, 6);
      ctx.lineTo(-30, 20);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#475569';
      ctx.fillRect(-42, -5, 12, 16);
      ctx.restore();

      // 主躯干 (肥美大白肚)
      const bodyGrad = ctx.createRadialGradient(-10, 10, 20, 0, 0, 80);
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.75, '#f1f5f9');
      bodyGrad.addColorStop(1, '#94a3b8');
      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.ellipse(0, 5, 82, 54, -0.15, 0, Math.PI * 2);
      ctx.fill();

      // 躯干羽毛层次纹理
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.lineWidth = 2;
      for (let f = 0; f < 3; f++) {
        ctx.beginPath();
        ctx.arc(-25 + f * 26, 12 + f * 4, 18, 0.2, Math.PI * 0.8);
        ctx.stroke();
      }

      // ----------------------------------------------------
      // D. 鹈鹕修长脖颈、头部与大嘴喉囊 (Neck, Head & Gular Pouch)
      // ----------------------------------------------------
      const neckBob = Math.sin(phase * 2 - 0.6) * 6;
      const headX = 85;
      const headY = -62 + neckBob;

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(42, -22);
      ctx.quadraticCurveTo(55, -50, headX - 12, headY + 12);
      ctx.lineTo(headX + 8, headY + 6);
      ctx.quadraticCurveTo(72, -25, 58, 15);
      ctx.closePath();
      ctx.fill();

      // 鹈鹕头部
      ctx.beginPath();
      ctx.arc(headX, headY, 24, 0, Math.PI * 2);
      ctx.fill();

      // 标志性巨大长喙 (Long Beak) - 上喙
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.moveTo(headX + 10, headY - 8);
      ctx.lineTo(headX + 115, headY - 2);
      ctx.quadraticCurveTo(headX + 122, headY + 2, headX + 112, headY + 5);
      ctx.lineTo(headX + 12, headY + 7);
      ctx.closePath();
      ctx.fill();

      // 尖端小红弯钩
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(headX + 115, headY + 1, 4, 0, Math.PI * 2);
      ctx.fill();

      // 【灵魂核心：半透明果冻大喉囊 (Gular Pouch)】
      // 随着奔跑、受惊、吃鱼，产生阻尼弹簧摆动 (Duang Duang)
      const pouchSwag = state.pouchSpring.pos;
      const pouchBaseY = headY + 6;
      const pouchDrop = 55 + pouchSwag + state.pouchBulge * 35;

      const pouchGrad = ctx.createRadialGradient(
        headX + 50, pouchBaseY + pouchDrop * 0.4, 10,
        headX + 50, pouchBaseY + pouchDrop * 0.5, 70
      );
      pouchGrad.addColorStop(0, 'rgba(254, 215, 170, 0.95)');
      pouchGrad.addColorStop(0.5, 'rgba(251, 146, 60, 0.88)');
      pouchGrad.addColorStop(1, 'rgba(234, 88, 12, 0.78)');

      ctx.fillStyle = pouchGrad;
      ctx.beginPath();
      ctx.moveTo(headX + 12, headY + 7);
      ctx.quadraticCurveTo(headX + 25, pouchBaseY + pouchDrop, headX + 65, pouchBaseY + pouchDrop);
      ctx.quadraticCurveTo(headX + 105, pouchBaseY + pouchDrop * 0.7, headX + 112, headY + 5);
      ctx.quadraticCurveTo(headX + 70, headY + 12, headX + 12, headY + 7);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 237, 213, 0.5)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // 如果喉囊内正有被吞下的鱼（半透明鱼影在喉囊里扑腾）
      if (state.pouchFishInside > 0.05) {
        ctx.save();
        ctx.globalAlpha = state.pouchFishInside * 0.75;
        ctx.translate(headX + 58, pouchBaseY + pouchDrop * 0.52);
        ctx.rotate(Math.sin(Date.now() * 0.03) * 0.4);
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(24, -6);
        ctx.lineTo(24, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 鹈鹕传神眼睛与表情
      drawPelicanEyes(headX + 6, headY - 5);

      // 鹈鹕累喘吐舌头 / 满头冷汗
      if (state.isExhausted || state.stamina < 30) {
        ctx.save();
        ctx.translate(headX + 70, headY + 7);
        ctx.rotate(Math.sin(phase * 3) * 0.2 + 0.5);
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (Math.random() < 0.25) {
          spawnSweat(cx + headX, cy + headY - 20);
        }
      }

      // ----------------------------------------------------
      // E. 近侧翅膀 (Near Wing)
      // ----------------------------------------------------
      drawPelicanWing(phase, false);

      // ----------------------------------------------------
      // F. 近侧腿与大蹼足 (Near Leg)
      // ----------------------------------------------------
      drawPelicanLeg(phase, false, cy - pelicanY);

      // ====================================================
      // G. 重磅主角：跨骑在鹈鹕背上的「高贵自行车骑手」！
      // ====================================================
      drawBicycleRider(headX, headY, phase);

      ctx.restore();
    }

    /* ---------------- 鹈鹕双腿与大蹼足动力学 ---------------- */
    function drawPelicanLeg(legPhase, isFar, groundDelta) {
      if (state.terrain === 2) {
        ctx.save();
        ctx.translate(-25, 28);
        ctx.rotate(0.9);
        ctx.strokeStyle = isFar ? '#ea580c' : '#f97316';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(28, 0);
        ctx.lineTo(55, -4);
        ctx.stroke();

        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(55, -4);
        ctx.lineTo(72, -10);
        ctx.lineTo(70, 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        return;
      }

      const hipX = -12 + (isFar ? -8 : 10);
      const hipY = 26;

      const stepProg = legPhase % (Math.PI * 2);
      const isPushing = Math.sin(stepProg) > 0;

      const footLift = Math.max(0, -Math.sin(stepProg)) * 36;
      const footForward = Math.cos(stepProg) * 44;

      const footX = hipX + footForward;
      const footY = hipY + 54 - footLift;

      // 触地瞬间 (小幅扬尘与踏地声)
      if (Math.abs(footLift) < 2 && isPushing && !isFar) {
        if (Math.random() < 0.3) {
          spawnDust(canvas.width * 0.42 + footX, height * 0.74);
          sound.playFootStep();
        }
      }

      const kneeX = hipX + footForward * 0.45 + (footLift > 5 ? 12 : -6);
      const kneeY = hipY + 28 - footLift * 0.2;

      ctx.save();
      ctx.strokeStyle = isFar ? '#c2410c' : '#f97316';
      ctx.lineWidth = isFar ? 6 : 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();

      // 大蹼足
      ctx.fillStyle = isFar ? '#ea580c' : '#fb923c';
      const toeAngle = footLift > 8 ? 0.35 : 0;
      ctx.save();
      ctx.translate(footX, footY);
      ctx.rotate(toeAngle);

      ctx.beginPath();
      ctx.moveTo(-10, -2);
      ctx.lineTo(26, -3);
      ctx.lineTo(22, 5);
      ctx.lineTo(16, 7);
      ctx.lineTo(-6, 3);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#c2410c';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    /* ---------------- 鹈鹕双翼拍打 ---------------- */
    function drawPelicanWing(wingPhase, isFar) {
      const wingAngle = state.terrain === 2
        ? (Math.sin(Date.now() * 0.003) * 0.08 - 0.1)
        : (Math.sin(wingPhase) * (0.35 + state.currentSpeed * 0.1));

      ctx.save();
      ctx.translate(isFar ? -15 : -5, -6);
      ctx.rotate(wingAngle);

      const wingGrad = ctx.createLinearGradient(0, 0, 70, 30);
      wingGrad.addColorStop(0, isFar ? '#94a3b8' : '#e2e8f0');
      wingGrad.addColorStop(0.7, isFar ? '#64748b' : '#cbd5e1');
      wingGrad.addColorStop(1, '#334155');

      ctx.fillStyle = wingGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(40, -18, 92, -6);
      ctx.quadraticCurveTo(75, 25, 45, 32);
      ctx.quadraticCurveTo(15, 22, 0, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = 'rgba(51, 65, 85, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(35, 2);
      ctx.lineTo(82, 0);
      ctx.moveTo(30, 14);
      ctx.lineTo(72, 12);
      ctx.stroke();

      ctx.restore();
    }

    /* ---------------- 鹈鹕生动表情系统 ---------------- */
    function drawPelicanEyes(x, y) {
      ctx.save();
      ctx.translate(x, y);

      state.blinkTimer--;
      if (state.blinkTimer < 0) state.blinkTimer = 180 + Math.random() * 120;
      const isBlinking = state.blinkTimer < 6;

      if (state.eyeState === 'shocked') {
        // 【受惊大眼 (按铃反馈)】铜铃般惊恐瞪大
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 3, 0, Math.PI * 2);
        ctx.fill();

      } else if (state.eyeState === 'happy') {
        // 【开心爱心眼 (吃鱼反馈)】❤️
        ctx.fillStyle = '#f43f5e';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('❤️', 0, 0);

      } else if (isBlinking || state.isExhausted) {
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-7, 2);
        ctx.quadraticCurveTo(0, 7, 7, 2);
        ctx.stroke();

      } else {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(2, 0, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(3.5, -2, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    /* ==========================================================================
       H. 核心骑手：结构完备、拥有高贵骑乘姿态的【自行车】！
       ========================================================================== */
    function drawBicycleRider(pelicanHeadX, pelicanHeadY, phase) {
      const saddleMountX = -5;
      const saddleMountY = -34;

      const springCompress = Math.sin(phase * 4) * 3;
      const bikeBaseX = saddleMountX;
      const bikeBaseY = saddleMountY - 26 + springCompress;
      const bikePitch = Math.sin(phase * 2) * 0.05 - 0.04;

      ctx.save();
      ctx.translate(bikeBaseX, bikeBaseY);
      ctx.rotate(bikePitch);

      // 1. 鹈鹕背部真皮马鞍垫 (Saddle Mount on Pelican's Back)
      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.roundRect(-42, 24, 78, 12, 6);
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 双镀铬避震螺旋弹簧 (Chrome Springs)
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 4;
      drawCoilSpring(-24, 24, -24, 6);
      drawCoilSpring(18, 24, 18, 6);

      // 2. 自行车骨架经典参数
      const bbX = 0;
      const bbY = 0;
      const rearHubX = -65;
      const rearHubY = 8;
      const frontHubX = 68;
      const frontHubY = 10;
      const seatLugX = -20;
      const seatLugY = -55;
      const headLugX = 46;
      const headLugY = -62;

      // ----------------------------------------------------
      // H-1. 后轮与前轮 (Rotating Wheels with Spokes & Rims)
      // ----------------------------------------------------
      const wheelRadius = 38;
      const wheelRotation = state.distance * 0.18;

      drawBikeWheel(rearHubX, rearHubY, wheelRadius, wheelRotation, 'rear');
      drawBikeWheel(frontHubX, frontHubY, wheelRadius, wheelRotation, 'front');

      // 氮气喷射尾焰
      if (state.isBoosting) {
        drawNitroExhaust(rearHubX - 10, rearHubY);
        spawnNitroSparks(canvas.width * 0.42 + bikeBaseX + rearHubX - 25, cy + bikeBaseY + rearHubY);
      }

      // ----------------------------------------------------
      // H-2. 自行车优雅金属管车架 (Lugged Steel Diamond Frame)
      // ----------------------------------------------------
      const frameGrad = ctx.createLinearGradient(-50, -60, 50, 10);
      if (state.envIndex === 2) {
        frameGrad.addColorStop(0, '#06b6d4');
        frameGrad.addColorStop(0.5, '#3b82f6');
        frameGrad.addColorStop(1, '#ec4899');
      } else {
        frameGrad.addColorStop(0, '#10b981');
        frameGrad.addColorStop(0.4, '#059669');
        frameGrad.addColorStop(1, '#047857');
      }

      ctx.strokeStyle = frameGrad;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // (1) 下管 (Down Tube)
      ctx.beginPath();
      ctx.moveTo(headLugX, headLugY + 12);
      ctx.lineTo(bbX, bbY);
      ctx.stroke();

      // (2) 上管 (Top Tube)
      ctx.beginPath();
      ctx.moveTo(headLugX, headLugY + 12);
      ctx.lineTo(seatLugX, seatLugY + 12);
      ctx.stroke();

      // (3) 座管 (Seat Tube)
      ctx.beginPath();
      ctx.moveTo(seatLugX, seatLugY + 12);
      ctx.lineTo(bbX, bbY);
      ctx.stroke();

      // (4) 后上叉 (Seat Stays)
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(seatLugX, seatLugY + 14);
      ctx.lineTo(rearHubX, rearHubY);
      ctx.stroke();

      // (5) 后下叉 (Chain Stays)
      ctx.beginPath();
      ctx.moveTo(bbX, bbY);
      ctx.lineTo(rearHubX, rearHubY);
      ctx.stroke();

      // (6) 前叉 (Front Fork)
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      ctx.moveTo(headLugX, headLugY + 20);
      ctx.lineTo(frontHubX, frontHubY);
      ctx.stroke();

      // 车管交汇套管铜焊细节 (Lugs)
      ctx.fillStyle = '#fbbf24';
      [ {x: bbX, y: bbY}, {x: seatLugX, y: seatLugY + 12}, {x: headLugX, y: headLugY + 14} ].forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // ----------------------------------------------------
      // H-3. 齿盘、链条、曲柄与高频踩踏脚踏板 (Drivetrain & Pedaling)
      // ----------------------------------------------------
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(bbX, bbY, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(bbX, bbY - 14);
      ctx.lineTo(rearHubX, rearHubY - 8);
      ctx.moveTo(bbX, bbY + 14);
      ctx.lineTo(rearHubX, rearHubY + 8);
      ctx.stroke();

      const crankAngle = wheelRotation * 0.85;
      const crankLen = 18;

      const pedalX1 = bbX + Math.cos(crankAngle) * crankLen;
      const pedalY1 = bbY + Math.sin(crankAngle) * crankLen;
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(bbX, bbY);
      ctx.lineTo(pedalX1, pedalY1);
      ctx.stroke();

      // 脚踏板
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(pedalX1 - 8, pedalY1 - 3, 16, 6);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(pedalX1 - 6, pedalY1 - 2, 4, 4);

      // 脚踏下方系着的小羽毛
      ctx.save();
      ctx.translate(pedalX1, pedalY1 + 4);
      ctx.rotate(Math.sin(crankAngle) * 0.4);
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(6, 12);
      ctx.lineTo(-4, 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // ----------------------------------------------------
      // H-4. 经典英伦复古车座 (Vintage Leather Saddle)
      // ----------------------------------------------------
      ctx.save();
      ctx.translate(seatLugX, seatLugY);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 14);
      ctx.lineTo(0, 0);
      ctx.stroke();

      ctx.fillStyle = '#78350f';
      ctx.beginPath();
      ctx.moveTo(-16, -2);
      ctx.quadraticCurveTo(0, -9, 20, -5);
      ctx.quadraticCurveTo(14, 2, -14, 3);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(-11, 0, 1.5, 0, Math.PI * 2);
      ctx.arc(-4, -1, 1.5, 0, Math.PI * 2);
      ctx.arc(4, -1, 1.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.strokeRect(-15, 2, 6, 5);
      ctx.restore();

      // ----------------------------------------------------
      // H-5. 车把、龙头、车铃与护目镜 (Handlebar, Stem, Bell & Goggles)
      // ----------------------------------------------------
      ctx.save();
      ctx.translate(headLugX, headLugY);

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 20);
      ctx.lineTo(0, 0);
      ctx.lineTo(14, -6);
      ctx.stroke();

      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(14, -6);
      ctx.quadraticCurveTo(18, -20, 4, -22);
      ctx.quadraticCurveTo(-10, -22, -14, -12);
      ctx.stroke();

      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-7, -18);
      ctx.lineTo(-14, -12);
      ctx.stroke();

      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-12, -12);
      ctx.lineTo(-18, -6);
      ctx.stroke();

      // 飞行员防风护目镜 (Aviator Goggles)
      ctx.save();
      ctx.translate(2, -14);
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.roundRect(-10, -7, 24, 14, 4);
      ctx.fill();

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(-3, 0, 5, 0, Math.PI * 2);
      ctx.arc(9, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-2, -2, 2, 0, Math.PI * 2);
      ctx.arc(10, -2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 金光大车铃 (Classic Brass Bicycle Bell)
      ctx.save();
      ctx.translate(14, -20);
      if (state.bellRinging > 0) {
        ctx.rotate(Math.sin(state.bellRinging * 30) * 0.25);
      }

      const bellGrad = ctx.createRadialGradient(-2, -4, 2, 0, 0, 10);
      bellGrad.addColorStop(0, '#fef08a');
      bellGrad.addColorStop(0.6, '#eab308');
      bellGrad.addColorStop(1, '#a16207');
      ctx.fillStyle = bellGrad;
      ctx.beginPath();
      ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
      ctx.fill();

      if (state.bellRinging > 0) {
        ctx.strokeStyle = 'rgba(250, 204, 21, ' + (state.bellRinging / 20) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 14 + (20 - state.bellRinging) * 1.5, -0.8, 0.8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 22 + (20 - state.bellRinging) * 2.2, -0.8, 0.8);
        ctx.stroke();
      }
      ctx.restore();

      ctx.restore();

      // ----------------------------------------------------
      // H-6. 缰绳系统 (Leather Control Reins)
      // ----------------------------------------------------
      const reinHandleX = headLugX - 12;
      const reinHandleY = headLugY - 14;

      const reinBeakX = pelicanHeadX + 45;
      const reinBeakY = pelicanHeadY + 4;

      const reinSag = Math.sin(phase * 2) * 12 + 25;

      ctx.save();
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(reinHandleX, reinHandleY);
      ctx.quadraticCurveTo(
        (reinHandleX + reinBeakX) * 0.5 - 5,
        (reinHandleY + reinBeakY) * 0.5 + reinSag,
        reinBeakX,
        reinBeakY
      );
      ctx.stroke();

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(reinBeakX, reinBeakY, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    /* ---------------- 辅助：螺旋弹簧绘制 ---------------- */
    function drawCoilSpring(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const coils = 5;
      const dy = (y2 - y1) / coils;
      for (let i = 0; i < coils; i++) {
        const curY = y1 + dy * (i + 0.5);
        const curX = x1 + ((i % 2 === 0) ? -5 : 5);
        ctx.lineTo(curX, curY);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    /* ---------------- 辅助：辐条旋转车轮绘制 ---------------- */
    function drawBikeWheel(hx, hy, radius, rotation, side) {
      ctx.save();
      ctx.translate(hx, hy);

      // 橡胶外胎
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.stroke();

      if (state.envIndex === 2) {
        ctx.strokeStyle = side === 'rear' ? '#f43f5e' : '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, radius + 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 铝合金双层轮圈
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, radius - 4, 0, Math.PI * 2);
      ctx.stroke();

      // 旋转辐条
      ctx.save();
      ctx.rotate(rotation);
      ctx.strokeStyle = 'rgba(241, 245, 249, 0.75)';
      ctx.lineWidth = 1.2;
      const spokeCount = 14;
      for (let s = 0; s < spokeCount; s++) {
        const angle = (s / spokeCount) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * (radius - 4), Math.sin(angle) * (radius - 4));
        ctx.stroke();
      }

      // 轮辐反光片
      ctx.fillStyle = '#f59e0b';
      const refAngle = Math.PI * 0.5;
      const rx = Math.cos(refAngle) * (radius * 0.6);
      const ry = Math.sin(refAngle) * (radius * 0.6);
      ctx.fillRect(rx - 3, ry - 6, 6, 12);
      ctx.restore();

      // 花鼓轴心
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    /* ---------------- 辅助：氮气加速喷射等离子火焰 ---------------- */
    function drawNitroExhaust(x, y) {
      ctx.save();
      ctx.translate(x, y);

      for (let i = 0; i < 2; i++) {
        const flameLen = 45 + Math.random() * 35;
        const flameW = 8 + Math.random() * 4;

        const grad = ctx.createLinearGradient(0, 0, -flameLen, 0);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.3, '#38bdf8');
        grad.addColorStop(0.7, '#ec4899');
        grad.addColorStop(1, 'rgba(236, 72, 153, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, -flameW * 0.5);
        ctx.lineTo(-flameLen, (Math.random() - 0.5) * 6);
        ctx.lineTo(0, flameW * 0.5);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    /* ==========================================================================
       7. 互动系统：抛物线飞鱼与投喂捕食机制
       ========================================================================== */
    function spawnFish() {
      state.fishes.push({
        x: width * 0.95,
        y: height * 0.25 + Math.random() * 80,
        vx: -(Math.random() * 5 + 7),
        vy: -(Math.random() * 4 + 5),
        gravity: 0.28,
        rot: 0,
        vRot: 0.12,
        caught: false,
        size: 26
      });
      sound.playGulp();
      spawnPopup('🐟 鲜活海鱼来啦！', '#38bdf8', width * 0.85, height * 0.3);
    }

    function updateAndDrawFishes(pelicanTargetX, pelicanTargetY) {
      for (let i = state.fishes.length - 1; i >= 0; i--) {
        const f = state.fishes[i];
        f.x += f.vx;
        f.y += f.vy;
        f.vy += f.gravity;
        f.rot += f.vRot;

        const dist = Math.hypot(f.x - pelicanTargetX, f.y - pelicanTargetY);
        if (dist < 48 && !f.caught) {
          f.caught = true;
          state.eatenCount++;
          document.getElementById('val-fish').innerText = `${state.eatenCount} 条`;

          state.stamina = Math.min(100, state.stamina + 45);
          state.isExhausted = false;

          state.eyeState = 'happy';
          state.eyeTimer = 45;
          state.pouchSpring.pos += 35;
          state.pouchBulge = 1.0;
          state.pouchFishInside = 1.0;

          // 触发爱心粒子
          for (let h = 0; h < 4; h++) {
            spawnHeart(pelicanTargetX, pelicanTargetY - 20);
          }

          sound.playGulp();
          spawnPopup('😋 Yummy! 能量+45', '#10b981', pelicanTargetX, pelicanTargetY - 40);
        }

        if (f.caught || f.y > height + 50 || f.x < -60) {
          state.fishes.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);

        const fishGrad = ctx.createLinearGradient(-14, 0, 14, 0);
        fishGrad.addColorStop(0, '#38bdf8');
        fishGrad.addColorStop(0.5, '#f1f5f9');
        fishGrad.addColorStop(1, '#0284c7');
        ctx.fillStyle = fishGrad;

        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(22, -7);
        ctx.lineTo(22, 7);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-8, -2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(-9, -2, 1, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    /* ==========================================================================
       8. 前景粒子、速度线、爱心与汗水渲染
       ========================================================================== */
    function updateAndDrawParticles() {
      // 扬尘粒子
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        p.size *= 0.98;

        if (p.alpha <= 0) {
          state.particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // 甩落的汗珠
      for (let i = state.sweatDrops.length - 1; i >= 0; i--) {
        const s = state.sweatDrops[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += s.gravity;
        s.alpha -= 0.02;

        if (s.alpha <= 0 || s.y > height) {
          state.sweatDrops.splice(i, 1);
          continue;
        }

        ctx.fillStyle = '#38bdf8';
        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // 飘动爱心粒子 (Hearts)
      for (let i = state.hearts.length - 1; i >= 0; i--) {
        const h = state.hearts[i];
        h.y += h.vy;
        h.x += Math.sin(h.y * 0.05) * 0.8;
        h.alpha -= 0.015;

        if (h.alpha <= 0) {
          state.hearts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = h.alpha;
        ctx.translate(h.x, h.y);
        ctx.scale(h.scale, h.scale);
        ctx.fillStyle = '#f43f5e';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('❤️', 0, 0);
        ctx.restore();
      }
      ctx.globalAlpha = 1.0;

      // 高速冲刺风线
      if (state.currentSpeed > 1.8) {
        ctx.strokeStyle = state.envIndex === 2 ? 'rgba(56, 189, 248, 0.4)' : 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.5;
        const lineCount = Math.floor(state.currentSpeed * 4);
        for (let l = 0; l < lineCount; l++) {
          const ly = Math.random() * height;
          const lx = Math.random() * width;
          const len = 40 + Math.random() * 90;
          ctx.beginPath();
          ctx.moveTo(lx, ly);
          ctx.lineTo(lx - len, ly);
          ctx.stroke();
        }
      }
    }

    /* ==========================================================================
       9. 主循环物理更新 (Physics & Update Step)
       ========================================================================== */
    function updatePhysics() {
      const dt = state.isSlowMo ? 0.25 : 1.0;

      // 冲刺与体力消耗
      if (state.isBoosting) {
        state.targetSpeed = 2.8;
        state.stamina -= 0.35 * dt;
        if (state.stamina <= 0) {
          state.stamina = 0;
          state.isBoosting = false;
          state.isExhausted = true;
          document.getElementById('txt-sprint').innerText = '氮气冲刺 (Sprint)';
          document.getElementById('act-sprint').classList.remove('boosting');
          spawnPopup('😫 鹈鹕累坏了！请喂鱼恢复', '#ef4444');
        }
      } else {
        if (state.stamina < 100) {
          state.stamina += 0.08 * dt;
          if (state.stamina > 25) state.isExhausted = false;
        }
        state.targetSpeed = state.isExhausted ? 0.6 : (state.terrain === 1 ? 1.1 : 1.3);
      }

      state.currentSpeed += (state.targetSpeed - state.currentSpeed) * 0.06 * dt;
      state.distance += state.currentSpeed * 2.2 * dt;

      // 路面物理颠簸
      if (state.terrain === 1) {
        state.bumpY = (Math.sin(state.distance * 0.8) + (Math.random() - 0.5) * 1.5) * 4.5;
        state.bumpRot = Math.sin(state.distance * 0.7) * 0.04;
      } else if (state.terrain === 2) {
        state.bumpY = Math.sin(state.distance * 0.05) * 8;
        state.bumpRot = 0;
      } else {
        state.bumpY = 0;
        state.bumpRot = 0;
      }

      // 喉囊阻尼弹簧物理迭代
      const spring = state.pouchSpring;
      const force = -spring.k * (spring.pos - spring.target);
      spring.vel = (spring.vel + force) * spring.damp;
      spring.pos += spring.vel * dt;

      // 恢复撑大
      if (state.pouchBulge > 0) state.pouchBulge = Math.max(0, state.pouchBulge - 0.02 * dt);
      if (state.pouchFishInside > 0) state.pouchFishInside = Math.max(0, state.pouchFishInside - 0.015 * dt);

      // 车铃晃动衰减与镜头震动
      if (state.bellRinging > 0) state.bellRinging = Math.max(0, state.bellRinging - 1 * dt);
      if (state.cameraShake > 0) state.cameraShake = Math.max(0, state.cameraShake - 0.5 * dt);

      // 表情计时
      if (state.eyeTimer > 0) {
        state.eyeTimer -= 1 * dt;
        if (state.eyeTimer <= 0) state.eyeState = 'normal';
      }

      // 更新仪表盘文字
      const speedKm = Math.round(state.currentSpeed * 26);
      const cadenceRpm = Math.round(state.currentSpeed * 68);
      document.getElementById('val-speed').innerText = `${speedKm} km/h`;
      document.getElementById('val-cadence').innerText = `${cadenceRpm} rpm`;

      const energyFill = document.getElementById('energy-fill');
      const energyText = document.getElementById('val-energy-text');
      const staminaPct = Math.round(state.stamina);
      energyFill.style.width = `${staminaPct}%`;
      energyText.innerText = `${staminaPct}%`;

      if (state.stamina < 30) {
        energyFill.classList.add('tired');
        energyText.style.color = '#ef4444';
      } else {
        energyFill.classList.remove('tired');
        energyText.style.color = '#10b981';
      }
    }

    /* ==========================================================================
       10. 主渲染管道 (Render Loop)
       ========================================================================== */
    function render() {
      updatePhysics();

      ctx.clearRect(0, 0, width, height);

      const theme = state.envThemes[state.envIndex];

      drawSkyAndSun(theme);
      drawParallaxSeaAndMountains(theme);
      drawGroundAndRoad(theme);

      const centerX = width * 0.42;
      const centerY = height * 0.58;
      drawPelicanAndBicycle(centerX, centerY);

      const pelicanMouthX = centerX + 120;
      const pelicanMouthY = centerY - 50;
      updateAndDrawFishes(pelicanMouthX, pelicanMouthY);

      updateAndDrawParticles();

      requestAnimationFrame(render);
    }

    /* ==========================================================================
       11. 交互绑定与快捷键操控体系
       ========================================================================== */
    // A. 摇响车铃
    function triggerBell() {
      state.bellRinging = 20;
      state.cameraShake = 5;
      sound.playBell();

      state.eyeState = 'shocked';
      state.eyeTimer = 60;
      state.pouchSpring.pos += 25;
      state.targetSpeed = Math.min(3.0, state.currentSpeed + 0.8);

      spawnPopup('🔔 Dring-Dring! 鹈鹕受惊狂飙！', '#fbbf24', width * 0.42, height * 0.35);
    }
    document.getElementById('act-bell').addEventListener('click', triggerBell);

    // B. 氮气冲刺
    function toggleSprint() {
      if (state.stamina <= 10) {
        spawnPopup('⚠️ 体力不足，先喂鱼吧！', '#ef4444');
        return;
      }
      state.isBoosting = !state.isBoosting;
      const btn = document.getElementById('act-sprint');
      const txt = document.getElementById('txt-sprint');

      if (state.isBoosting) {
        txt.innerText = '⚡ 冲刺中 (BOOSTING!)';
        btn.classList.add('boosting');
        sound.playNitro();
        spawnPopup('🚀 氮气过载喷射！！', '#ec4899');
      } else {
        txt.innerText = '氮气冲刺 (Sprint)';
        btn.classList.remove('boosting');
      }
    }
    document.getElementById('act-sprint').addEventListener('click', toggleSprint);

    // C. 投喂鲜鱼
    document.getElementById('act-feed').addEventListener('click', spawnFish);

    // D. 切换路况地形
    function cycleTerrain() {
      state.terrain = (state.terrain + 1) % 3;
      document.getElementById('txt-terrain').innerText = `路况：${state.terrainNames[state.terrain]}`;
      spawnPopup(`🛣️ 切换路况：${state.terrainNames[state.terrain]}`, '#a78bfa');
    }
    document.getElementById('act-terrain').addEventListener('click', cycleTerrain);

    // E. 昼夜与氛围切换
    function cycleEnv() {
      state.envIndex = (state.envIndex + 1) % state.envThemes.length;
      const cur = state.envThemes[state.envIndex];
      document.getElementById('btn-env').innerText = cur.icon;
      spawnPopup(`🌤️ 切换场景：${cur.name}`, '#fef08a');
    }
    document.getElementById('btn-env').addEventListener('click', cycleEnv);

    // F. 音效开关
    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      if (sound.enabled) {
        sound.init();
        btnAudio.classList.add('active');
        btnAudio.innerText = '🔔';
        spawnPopup('🔊 原生 Web Audio 已开启', '#38bdf8');
      } else {
        btnAudio.classList.remove('active');
        btnAudio.innerText = '🔕';
        spawnPopup('🔇 音效已静音', '#94a3b8');
      }
    });

    // G. 慢动作特写模式
    const btnSlowMo = document.getElementById('btn-slowmo');
    btnSlowMo.addEventListener('click', () => {
      state.isSlowMo = !state.isSlowMo;
      if (state.isSlowMo) {
        btnSlowMo.classList.add('active');
        spawnPopup('⏱️ 0.25x 电影级慢动作特写', '#ffd166');
      } else {
        btnSlowMo.classList.remove('active');
        spawnPopup('▶️ 恢复正常速度', '#38bdf8');
      }
    });

    // H. 画布点击直接投喂海鱼
    canvas.addEventListener('pointerdown', (e) => {
      sound.init();
      spawnFish();
    });

    // I. 键盘全局快捷键
    window.addEventListener('keydown', (e) => {
      sound.init();
      if (e.code === 'Space' || e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        triggerBell();
      } else if (e.key === 'Shift') {
        e.preventDefault();
        toggleSprint();
      } else if (e.key === 'f' || e.key === 'F') {
        spawnFish();
      } else if (e.key === 't' || e.key === 'T') {
        cycleTerrain();
      } else if (e.key === 'e' || e.key === 'E') {
        cycleEnv();
      } else if (e.key === 's' || e.key === 'S') {
        btnSlowMo.click();
      }
    });

    // 首次交互激活 Web Audio
    window.addEventListener('click', () => sound.init(), { once: true });

    // 启动系统
    resize();
    render();

    // 开场欢迎飞鱼
    setTimeout(() => {
      spawnFish();
    }, 600);

  })();
  </script>
</body>
</html>
