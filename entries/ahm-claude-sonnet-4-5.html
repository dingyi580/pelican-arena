<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕 - A Bicycle Riding a Pelican</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFE5B4 100%);
            user-select: none;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-bell {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #333;
        }
        
        .btn-sprint {
            background: linear-gradient(135deg, #FF6B6B, #FF4757);
            color: white;
        }
        
        .btn-feed {
            background: linear-gradient(135deg, #4ECDC4, #44A08D);
            color: white;
        }
        
        .btn-time {
            background: linear-gradient(135deg, #A8EDEA, #6B9EDB);
            color: white;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 25px;
        }
        
        .slider {
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            cursor: pointer;
            border: none;
        }
        
        .label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }
        
        .status {
            position: fixed;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            color: #333;
            z-index: 100;
        }
        
        .status-bar {
            margin-top: 8px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .status-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ECDC4, #44A08D);
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-5deg); }
            75% { transform: translateX(-50%) rotate(5deg); }
        }
        
        .shake {
            animation: shake 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="status">
        <div>🐦 鹈鹕体力: <span id="stamina">100</span>%</div>
        <div class="status-bar">
            <div class="status-fill" id="staminaBar" style="width: 100%"></div>
        </div>
    </div>
    
    <div class="controls" id="controls">
        <button class="btn btn-bell" id="bellBtn">🔔 按车铃</button>
        <div class="slider-container">
            <span class="label">🏃 速度</span>
            <input type="range" class="slider" id="speedSlider" min="1" max="10" value="5">
        </div>
        <button class="btn btn-sprint" id="sprintBtn">⚡ 冲刺</button>
        <button class="btn btn-feed" id="feedBtn">🐟 投喂</button>
        <button class="btn btn-time" id="timeBtn">🌅 切换时段</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 音频上下文
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 游戏状态
        const state = {
            time: 0,
            speed: 5,
            stamina: 100,
            isSprinting: false,
            timeOfDay: 0, // 0: 白天, 1: 黄昏, 2: 夜晚
            groundOffset: 0,
            pelicanBounce: 0,
            wheelRotation: 0,
            particles: []
        };
        
        // 颜色主题
        const themes = [
            { sky: ['#87CEEB', '#E0F6FF', '#FFE5B4'], sun: '#FFD700', ground: '#D2B48C' },
            { sky: ['#FF6B6B', '#FFA07A', '#FFD700'], sun: '#FF4500', ground: '#CD853F' },
            { sky: ['#191970', '#000080', '#4B0082'], sun: '#F0E68C', ground: '#8B7355' }
        ];
        
        // 粒子类
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * -3 - 1;
                this.life = 1;
                this.type = type; // 'feather', 'sweat', 'fish'
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life -= 0.01;
                this.rotation += this.rotationSpeed;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                if (this.type === 'feather') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 3, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'sweat') {
                    ctx.fillStyle = '#4FC3F7';
                    ctx.beginPath();
                    ctx.arc(0, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'fish') {
                    ctx.fillStyle = '#FF9800';
                    ctx.beginPath();
                    ctx.moveTo(-5, 0);
                    ctx.lineTo(5, 0);
                    ctx.lineTo(0, -3);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }
        
        // 绘制背景
        function drawBackground() {
            const theme = themes[state.timeOfDay];
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, theme.sky[0]);
            gradient.addColorStop(0.5, theme.sky[1]);
            gradient.addColorStop(1, theme.sky[2]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 太阳/月亮
            ctx.fillStyle = theme.sun;
            ctx.beginPath();
            ctx.arc(canvas.width - 150, 100, 40, 0, Math.PI * 2);
            ctx.fill();
            
            if (state.timeOfDay === 2) {
                // 星星
                ctx.fillStyle = '#FFFFFF';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 137.5) % canvas.width;
                    const y = (i * 73.3) % (canvas.height * 0.5);
                    ctx.fillRect(x, y, 2, 2);
                }
            }
            
            // 云朵
            drawClouds();
            
            // 地面
            const groundY = canvas.height * 0.75;
            ctx.fillStyle = theme.ground;
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // 木板路
            drawBoardwalk(groundY);
        }
        
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            const cloudPositions = [
                { x: 100 - state.groundOffset * 0.3, y: 100 },
                { x: 400 - state.groundOffset * 0.3, y: 150 },
                { x: 700 - state.groundOffset * 0.3, y: 120 }
            ];
            
            cloudPositions.forEach(pos => {
                const x = pos.x % (canvas.width + 200) - 100;
                drawCloud(x, pos.y);
            });
        }
        
        function drawCloud(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.arc(x + 25, y, 30, 0, Math.PI * 2);
            ctx.arc(x + 50, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawBoardwalk(groundY) {
            const boardWidth = 100;
            const startX = -state.groundOffset % boardWidth;
            
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            
            for (let x = startX; x < canvas.width; x += boardWidth) {
                ctx.beginPath();
                ctx.moveTo(x, groundY);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
        }
        
        // 绘制鹈鹕
        function drawPelican(x, y) {
            const bounce = Math.sin(state.time * 0.2) * 10 * (state.speed / 5);
            const tilt = Math.sin(state.time * 0.2) * 5;
            const actualY = y + bounce;
            
            ctx.save();
            ctx.translate(x, actualY);
            ctx.rotate((tilt * Math.PI) / 180);
            
            // 身体
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, 60, 45, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 颈部
            ctx.fillStyle = '#F5F5F5';
            ctx.beginPath();
            ctx.ellipse(-40, -20, 20, 35, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 头部
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-55, -45, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 眼睛
            const eyeOpen = state.isSprinting || state.stamina < 30;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-50, -48, eyeOpen ? 4 : 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 疲惫表情
            if (state.stamina < 30) {
                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(-45, -42, 8, 0, Math.PI);
                ctx.stroke();
            }
            
            // 喙
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(-75, -40);
            ctx.lineTo(-120, -35);
            ctx.lineTo(-120, -25);
            ctx.lineTo(-75, -30);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // 喉囊
            const pouchSize = 25 + Math.sin(state.time * 0.3) * 5;
            ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
            ctx.beginPath();
            ctx.ellipse(-85, -20, pouchSize, 20, 0.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 翅膀
            const wingFlap = Math.sin(state.time * 0.3) * 15;
            ctx.fillStyle = '#E0E0E0';
            ctx.beginPath();
            ctx.ellipse(20, 0, 40, 20, (wingFlap * Math.PI) / 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // 腿部
            const legMove = Math.sin(state.time * 0.4) * 10 * (state.speed / 5);
            ctx.strokeStyle = '#FF8C00';
            ctx.lineWidth = 4;
            
            // 左腿
            ctx.beginPath();
            ctx.moveTo(-20, 40);
            ctx.lineTo(-25, 60 + legMove);
            ctx.stroke();
            
            // 右腿
            ctx.beginPath();
            ctx.moveTo(10, 40);
            ctx.lineTo(5, 60 - legMove);
            ctx.stroke();
            
            // 蹼足
            ctx.fillStyle = '#FF8C00';
            ctx.beginPath();
            ctx.moveTo(-25, 60 + legMove);
            ctx.lineTo(-35, 65 + legMove);
            ctx.lineTo(-30, 68 + legMove);
            ctx.lineTo(-25, 65 + legMove);
            ctx.lineTo(-20, 68 + legMove);
            ctx.lineTo(-15, 65 + legMove);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(5, 60 - legMove);
            ctx.lineTo(-5, 65 - legMove);
            ctx.lineTo(0, 68 - legMove);
            ctx.lineTo(5, 65 - legMove);
            ctx.lineTo(10, 68 - legMove);
            ctx.lineTo(15, 65 - legMove);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        // 绘制自行车
        function drawBicycle(x, y) {
            const bounce = Math.sin(state.time * 0.2) * 10 * (state.speed / 5);
            const tilt = Math.sin(state.time * 0.2) * 3;
            const actualY = y + bounce - 80;
            
            ctx.save();
            ctx.translate(x, actualY);
            ctx.rotate((tilt * Math.PI) / 180);
            
            // 车架
            ctx.strokeStyle = '#FF4757';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            
            // 主车架
            ctx.beginPath();
            ctx.moveTo(-30, 0);
            ctx.lineTo(30, 0);
            ctx.lineTo(30, -40);
            ctx.lineTo(-30, 0);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(50, -15);
            ctx.stroke();
            
            // 车座
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-35, -42, 15, 5);
            
            // 车座杆
            ctx.strokeStyle = '#FF4757';
            ctx.beginPath();
            ctx.moveTo(-28, -40);
            ctx.lineTo(-28, -15);
            ctx.stroke();
            
            // 车把
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(30, -40);
            ctx.lineTo(45, -45);
            ctx.moveTo(30, -40);
            ctx.lineTo(45, -35);
            ctx.stroke();
            
            // 车轮
            drawWheel(-30, 0, state.wheelRotation);
            drawWheel(30, 0, state.wheelRotation);
            
            // 脚踏和链条
            const pedalRotation = state.wheelRotation;
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            
            // 链条
            ctx.beginPath();
            ctx.arc(5, 0, 8, 0, Math.PI * 2);
            ctx.stroke();
            
            // 脚踏
            ctx.save();
            ctx.translate(5, 0);
            ctx.rotate(pedalRotation);
            ctx.fillStyle = '#333';
            ctx.fillRect(-15, -3, 10, 6);
            ctx.fillRect(5, -3, 10, 6);
            ctx.restore();
            
            // 车铃
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(35, -45, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFA500';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function drawWheel(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            
            // 外圈
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.stroke();
            
            // 辐条
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI) / 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(angle) * 18, Math.sin(angle) * 18);
                ctx.stroke();
            }
            
            // 轮毂
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // 更新粒子
        function updateParticles() {
            state.particles = state.particles.filter(p => p.life > 0);
            state.particles.forEach(p => {
                p.update();
                p.draw();
            });
        }
        
        // 主绘制循环
        function draw() {
            state.time += 0.1;
            
            // 更新地面偏移
            state.groundOffset += state.speed * 0.5;
            
            // 更新车轮旋转
            state.wheelRotation += state.speed * 0.05;
            
            // 更新体力
            if (state.isSprinting) {
                state.stamina = Math.max(0, state.stamina - 0.5);
                if (state.stamina === 0) {
                    state.isSprinting = false;
                    state.speed = Math.max(1, state.speed - 3);
                    document.getElementById('speedSlider').value = state.speed;
                }
            } else {
                state.stamina = Math.min(100, state.stamina + 0.1);
            }
            
            // 绘制
            drawBackground();
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.65;
            
            drawPelican(centerX, centerY);
            drawBicycle(centerX, centerY);
            
            updateParticles();
            
            // 更新UI
            document.getElementById('stamina').textContent = Math.floor(state.stamina);
            document.getElementById('staminaBar').style.width = state.stamina + '%';
            
            // 添加汗水粒子
            if (state.stamina < 50 && Math.random() < 0.1) {
                state.particles.push(new Particle(
                    centerX - 40,
                    centerY - 30,
                    'sweat'
                ));
            }
            
            requestAnimationFrame(draw);
        }
        
        // 车铃音效
        function playBellSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.3);
        }
        
        // 按钮事件
        document.getElementById('bellBtn').addEventListener('click', function() {
            playBellSound();
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = '';
            }, 100);
            
            // 鹈鹕受惊加速
            const oldSpeed = state.speed;
            state.speed = Math.min(10, state.speed + 2);
            document.getElementById('speedSlider').value = state.speed;
            
            setTimeout(() => {
                state.speed = oldSpeed;
                document.getElementById('speedSlider').value = state.speed;
            }, 1000);
            
            // 添加羽毛粒子
            for (let i = 0; i < 5; i++) {
                state.particles.push(new Particle(
                    canvas.width / 2 - 20,
                    canvas.height * 0.65 - 30,
                    'feather'
                ));
            }
        });
        
        document.getElementById('speedSlider').addEventListener('input', function() {
            state.speed = parseInt(this.value);
            state.isSprinting = false;
        });
        
        document.getElementById('sprintBtn').addEventListener('click', function() {
            if (state.stamina > 20 && !state.isSprinting) {
                state.isSprinting = true;
                state.speed = 10;
                document.getElementById('speedSlider').value = 10;
                
                this.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
                
                // 添加冲刺粒子
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        state.particles.push(new Particle(
                            canvas.width / 2 - 60,
                            canvas.height * 0.65 + 20,
                            'feather'
                        ));
                    }, i * 50);
                }
            }
        });
        
        document.getElementById('feedBtn').addEventListener('click', function() {
            state.stamina = Math.min(100, state.stamina + 30);
            
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = '';
            }, 100);
            
            // 添加小鱼粒子
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    state.particles.push(new Particle(
                        canvas.width / 2 - 80,
                        canvas.height * 0.65 - 20,
                        'fish'
                    ));
                }, i * 100);
            }
        });
        
        document.getElementById('timeBtn').addEventListener('click', function() {
            state.timeOfDay = (state.timeOfDay + 1) % 3;
            const labels = ['🌅 白天', '🌆 黄昏', '🌙 夜晚'];
            this.innerHTML = labels[state.timeOfDay];
            
            this.style.transform = 'scale(0.9)';
            setTimeout(() => {
                this.style.transform = '';
            }, 100);
        });
        
        // 启动动画
        draw();
    </script>
</body>
</html>
