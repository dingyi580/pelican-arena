<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#183a49">
<title>自行车骑鹈鹕 · 一段不太合理的旅途</title>
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    color-scheme: light;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    --sky-a: #8bd4e2;
    --sky-b: #edf5df;
    --sky-c: #fff0c7;
    --sea-a: #60b6c1;
    --sea-b: #327f94;
    --cloud: #fff9e9;
    --cloud-opacity: 0.92;
    --sun-color: #ffda73;
    --deck-a: #d9b789;
    --deck-b: #a87951;
    --rope: #805537;
    --panel: rgba(15, 35, 44, 0.88);
    --panel-border: rgba(255, 255, 255, 0.15);
    --white: #f8f4e9;
    --muted: #aebdc0;
    --coral: #f2765b;
    --yellow: #ffd66b;
    --aqua: #8ed9cd;
    background: #183a49;
    color: var(--white);
    -webkit-tap-highlight-color: transparent;
  }

  body[data-weather="sunset"] {
    --sky-a: #e89182;
    --sky-b: #f4c18f;
    --sky-c: #ffe1a7;
    --sea-a: #c78083;
    --sea-b: #695f82;
    --cloud: #ffe5cd;
    --cloud-opacity: 0.72;
    --sun-color: #ffb45f;
    --deck-a: #c89970;
    --deck-b: #8e624e;
  }

  body[data-weather="night"] {
    --sky-a: #142c49;
    --sky-b: #34526a;
    --sky-c: #67818a;
    --sea-a: #315c72;
    --sea-b: #173b55;
    --cloud: #abc1cd;
    --cloud-opacity: 0.26;
    --sun-color: #a9d8e8;
    --deck-a: #72665e;
    --deck-b: #3b4148;
  }

  body[data-weather="day"] .sun-disc {
    opacity: 1;
  }

  body[data-weather="sunset"] .sun-disc {
    opacity: 1;
  }

  body[data-weather="night"] .sun-disc {
    opacity: 0;
  }

  body[data-weather="day"] .moon-disc,
  body[data-weather="sunset"] .moon-disc {
    opacity: 0;
  }

  body[data-weather="night"] .moon-disc {
    opacity: 1;
  }

  body[data-weather="day"] .stars {
    opacity: 0;
  }

  body[data-weather="sunset"] .stars {
    opacity: 0.2;
  }

  body[data-weather="night"] .stars {
    opacity: 1;
  }

  body[data-weather="day"] .lamps {
    opacity: 0;
  }

  body[data-weather="sunset"] .lamps {
    opacity: 0.38;
  }

  body[data-weather="night"] .lamps {
    opacity: 0.9;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    isolation: isolate;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #8bd4e2 0%, #edf5df 58%, #a87951 100%);
  }

  #scene {
    display: block;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }

  #skyGradient stop {
    transition: stop-color 900ms ease;
  }

  #seaGradient stop,
  #deckGradient stop {
    transition: stop-color 900ms ease;
  }

  #clouds {
    opacity: var(--cloud-opacity);
    transition: opacity 900ms ease;
  }

  .sun-disc,
  .moon-disc,
  .stars,
  .lamps {
    transition: opacity 900ms ease;
  }

  .stars circle {
    animation: twinkle 3.8s ease-in-out infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  .stars circle:nth-child(2n) {
    animation-delay: -1.6s;
  }

  .stars circle:nth-child(3n) {
    animation-delay: -2.7s;
  }

  @keyframes twinkle {
    from { opacity: 0.28; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1.15); }
  }

  #roughLayer {
    opacity: 0;
    transition: opacity 450ms ease;
  }

  body[data-road="rough"] #roughLayer {
    opacity: 1;
  }

  body[data-road="rough"] .deck-plank-detail {
    opacity: 0.38;
  }

  .vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 42%, transparent 48%, rgba(13, 35, 46, 0.16) 100%),
      linear-gradient(180deg, rgba(14, 32, 41, 0.05) 0%, transparent 23%, transparent 75%, rgba(14, 32, 41, 0.18) 100%);
  }

  .topbar {
    position: absolute;
    z-index: 8;
    top: clamp(18px, 3vw, 38px);
    left: clamp(18px, 3vw, 42px);
    right: clamp(18px, 3vw, 42px);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    pointer-events: none;
  }

  .brand {
    max-width: 540px;
    text-shadow: 0 2px 14px rgba(21, 51, 64, 0.18);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 9px;
    color: #244958;
    font-size: 11px;
    font-weight: 850;
    letter-spacing: 0.19em;
    text-transform: uppercase;
  }

  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--coral);
    box-shadow: 0 0 0 5px rgba(242, 118, 91, 0.16);
  }

  .brand h1 {
    margin: 0;
    color: #173b49;
    font-size: clamp(28px, 3.25vw, 49px);
    font-weight: 900;
    line-height: 1.07;
    letter-spacing: -0.055em;
  }

  .brand h1 em {
    color: var(--coral);
    font-style: normal;
  }

  .brand p {
    margin: 10px 0 0;
    color: #385b65;
    font-size: clamp(12px, 1.1vw, 15px);
    font-weight: 600;
    letter-spacing: 0.025em;
  }

  .status-panel {
    width: 248px;
    flex: 0 0 auto;
    padding: 15px 16px 13px;
    border: 1px solid var(--panel-border);
    border-radius: 19px;
    background: var(--panel);
    box-shadow: 0 16px 45px rgba(10, 29, 37, 0.18);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    pointer-events: auto;
  }

  .status-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .pace {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--aqua);
    box-shadow: 0 0 0 4px rgba(142, 217, 205, 0.13);
    animation: livePulse 1.8s ease-in-out infinite;
  }

  @keyframes livePulse {
    50% { box-shadow: 0 0 0 7px rgba(142, 217, 205, 0.02); }
  }

  .sound-button {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.06);
    color: #e8eee8;
    cursor: pointer;
  }

  .sound-button:hover {
    background: rgba(255, 255, 255, 0.13);
  }

  .sound-button svg {
    width: 16px;
    height: 16px;
  }

  #soundSlash {
    opacity: 0;
    transition: opacity 150ms ease;
  }

  .sound-button.muted #soundSlash {
    opacity: 1;
  }

  .energy-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 9px;
    color: #c3d1d1;
    font-size: 11px;
    font-weight: 700;
  }

  .energy-track {
    height: 7px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.11);
  }

  #energyFill {
    display: block;
    width: 78%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #6fc6b4, #a4e4d7);
    transition: width 220ms ease, background 220ms ease;
  }

  #energyValue {
    min-width: 35px;
    color: #f7f3e8;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .status-footer {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.09);
    color: #91a8ad;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.05em;
  }

  .toast {
    position: absolute;
    z-index: 20;
    top: clamp(22px, 3vw, 36px);
    left: 50%;
    max-width: min(470px, calc(100vw - 36px));
    padding: 11px 17px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 99px;
    background: rgba(21, 45, 55, 0.9);
    box-shadow: 0 12px 36px rgba(10, 28, 36, 0.2);
    color: #fff6df;
    font-size: 12px;
    font-weight: 750;
    text-align: center;
    opacity: 0;
    transform: translate(-50%, -14px);
    transition: opacity 220ms ease, transform 220ms ease;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .key-hint {
    position: absolute;
    z-index: 9;
    left: 50%;
    bottom: 137px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 12px;
    border: 1px solid rgba(255, 255, 255, 0.17);
    border-radius: 99px;
    background: rgba(21, 45, 55, 0.48);
    color: rgba(255, 250, 235, 0.86);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    transform: translateX(-50%);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    pointer-events: none;
  }

  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 21px;
    height: 20px;
    margin-right: 4px;
    padding: 0 5px;
    border: 1px solid rgba(255, 255, 255, 0.27);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.09);
    color: #fff9e9;
    font-family: inherit;
    font-size: 9px;
    font-weight: 850;
  }

  .control-deck {
    position: absolute;
    z-index: 12;
    left: 50%;
    bottom: clamp(15px, 2.1vw, 27px);
    display: grid;
    grid-template-columns: 145px minmax(190px, 1fr) 118px 146px 218px 116px;
    align-items: stretch;
    gap: 8px;
    width: min(1190px, calc(100vw - 34px));
    padding: 10px;
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    background: var(--panel);
    box-shadow:
      0 24px 70px rgba(8, 25, 33, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
    transform: translateX(-50%);
  }

  .control,
  .control-button {
    min-width: 0;
    min-height: 72px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.055);
    color: var(--white);
  }

  .control-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 11px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
  }

  .control-button:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.11);
    transform: translateY(-2px);
  }

  .control-button:active {
    transform: translateY(0) scale(0.98);
  }

  .control-button:focus-visible,
  .sound-button:focus-visible,
  .sky-button:focus-visible,
  input[type="range"]:focus-visible {
    outline: 3px solid rgba(255, 214, 107, 0.75);
    outline-offset: 3px;
  }

  .control-icon {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: var(--yellow);
  }

  .control-icon svg {
    width: 22px;
    height: 22px;
    overflow: visible;
  }

  .control-copy {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 3px;
  }

  .control-copy strong {
    overflow: hidden;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: 0.02em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .control-copy small {
    overflow: hidden;
    color: #a9bcc0;
    font-size: 9px;
    font-weight: 650;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bell-button .control-icon {
    background: var(--coral);
    color: #fff9e8;
    box-shadow: 0 6px 18px rgba(242, 118, 91, 0.22);
  }

  .sprint-button .control-icon {
    background: var(--yellow);
    color: #29404a;
  }

  .feed-button .control-icon {
    background: var(--aqua);
    color: #183c46;
  }

  .bell-button.is-ringing .bell-icon {
    animation: bellPop 480ms cubic-bezier(0.2, 0.9, 0.25, 1.3);
  }

  .feed-button.is-feeding .fish-icon {
    animation: fishNibble 600ms ease-in-out;
  }

  @keyframes bellPop {
    0%   { transform: rotate(0) scale(1); }
    22%  { transform: rotate(-13deg) scale(1.2); }
    46%  { transform: rotate(11deg) scale(1.12); }
    70%  { transform: rotate(-5deg) scale(1.04); }
    100% { transform: rotate(0) scale(1); }
  }

  @keyframes fishNibble {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-12deg) translateY(-2px); }
    65% { transform: rotate(9deg); }
  }

  .sprint-button.active {
    border-color: rgba(255, 214, 107, 0.52);
    background: rgba(255, 214, 107, 0.12);
    animation: sprintGlow 900ms ease-in-out infinite alternate;
  }

  @keyframes sprintGlow {
    to { box-shadow: inset 0 0 22px rgba(255, 214, 107, 0.09); }
  }

  .slider-control {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 11px 15px 9px;
  }

  .slider-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 9px;
    color: #cbd7d6;
    font-size: 10px;
    font-weight: 750;
  }

  .slider-label output {
    color: var(--yellow);
    font-size: 12px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }

  input[type="range"] {
    width: 100%;
    height: 5px;
    margin: 0;
    border-radius: 99px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background: linear-gradient(to right, var(--yellow) 0 var(--fill, 46%), rgba(255, 255, 255, 0.14) var(--fill, 46%) 100%);
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 17px;
    height: 17px;
    border: 3px solid #fff6d8;
    border-radius: 50%;
    appearance: none;
    -webkit-appearance: none;
    background: #f0b94d;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
  }

  input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 3px solid #fff6d8;
    border-radius: 50%;
    background: #f0b94d;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
  }

  .range-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    color: #819ba0;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .weather-control {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding: 9px 10px;
  }

  .weather-title {
    padding-left: 3px;
    color: #91a9ad;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: 0.08em;
  }

  .weather-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .sky-button {
    height: 35px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.045);
    color: #aebfc1;
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    transition: 150ms ease;
  }

  .sky-button:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
  }

  .sky-button.active {
    border-color: rgba(255, 214, 107, 0.28);
    background: rgba(255, 214, 107, 0.13);
    color: var(--yellow);
  }

  .road-button .control-icon {
    background: rgba(142, 217, 205, 0.14);
    color: var(--aqua);
  }

  .road-button[aria-pressed="true"] {
    border-color: rgba(142, 217, 205, 0.35);
    background: rgba(142, 217, 205, 0.09);
  }

  .noscript {
    position: fixed;
    z-index: 100;
    inset: 20px;
    display: grid;
    place-items: center;
    padding: 30px;
    border-radius: 20px;
    background: #173b49;
    color: white;
    text-align: center;
  }

  @media (max-width: 1080px) {
    .control-deck {
      grid-template-columns: 1.1fr 1.2fr 0.85fr;
      width: min(820px, calc(100vw - 28px));
    }

    .slider-control {
      grid-column: span 1;
    }

    .weather-control {
      grid-column: span 1;
    }

    .key-hint {
      bottom: 207px;
    }

    .status-panel {
      width: 224px;
    }
  }

  @media (max-width: 760px) {
    .topbar {
      gap: 12px;
    }

    .brand p {
      display: none;
    }

    .brand h1 {
      max-width: 230px;
      font-size: 25px;
    }

    .eyebrow {
      font-size: 8px;
      letter-spacing: 0.12em;
    }

    .status-panel {
      width: 168px;
      padding: 11px;
      border-radius: 15px;
    }

    .pace {
      font-size: 10px;
    }

    .status-footer {
      font-size: 8px;
    }

    .sound-button {
      width: 25px;
      height: 25px;
    }

    .toast {
      top: 128px;
    }

    .control-deck {
      bottom: 9px;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: calc(100vw - 18px);
      padding: 8px;
      border-radius: 19px;
    }

    .control,
    .control-button {
      min-height: 61px;
    }

    .slider-control,
    .weather-control {
      grid-column: span 3;
    }

    .control-button {
      gap: 7px;
      padding: 7px;
    }

    .control-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
    }

    .control-icon svg {
      width: 19px;
      height: 19px;
    }

    .control-copy strong {
      font-size: 10px;
    }

    .control-copy small {
      font-size: 8px;
    }

    .key-hint {
      display: none;
    }

    .weather-buttons {
      gap: 6px;
    }

    .sky-button {
      height: 30px;
    }
  }

  @media (max-width: 470px) {
    .brand h1 {
      max-width: 185px;
      font-size: 22px;
    }

    .status-panel {
      width: 145px;
    }

    .energy-row {
      gap: 5px;
    }

    .pace {
      gap: 5px;
    }

    .control-deck {
      grid-template-columns: repeat(2, 1fr);
    }

    .slider-control,
    .weather-control {
      grid-column: span 2;
    }

    .road-button {
      grid-column: span 2;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stars circle,
    .live-dot,
    .sprint-button.active {
      animation: none;
    }
  }
</style>
</head>

<body data-weather="day" data-road="smooth">
<div id="app">
  <main id="stage" aria-label="一辆自行车正在骑着一只鹈鹕的海滨动画场景">
    <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">自行车骑鹈鹕</title>
      <desc id="sceneDesc">一只背着自行车的鹈鹕在海滨木栈道上奔跑，车把上牵着缰绳，车轮和脚踏随步伐转动。</desc>

      <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--sky-a)"/>
          <stop offset="0.67" stop-color="var(--sky-b)"/>
          <stop offset="1" stop-color="var(--sky-c)"/>
        </linearGradient>

        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="var(--sun-color)" stop-opacity="0.75"/>
          <stop offset="0.55" stop-color="var(--sun-color)" stop-opacity="0.18"/>
          <stop offset="1" stop-color="var(--sun-color)" stop-opacity="0"/>
        </radialGradient>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const root = document.body;

  const scene = $("scene");
  const rideRig = $("rideRig");
  const bikeRig = $("bikeRig");
  const farWing = $("farWing");
  const nearWing = $("nearWing");
  const headRig = $("headRig");
  const pouchRig = $("pouchRig");
  const backLeg = $("backLeg");
  const frontLeg = $("frontLeg");
  const rearSpokes = $("rearSpokes");
  const frontSpokes = $("frontSpokes");
  const crank = $("crank");
  const chainHighlight = $("chainHighlight");
  const eyeGroup = $("eyeGroup");
  const normalBrow = $("normalBrow");
  const startledBrow = $("startledBrow");
  const sweatGroup = $("sweatGroup");
  const bellBurst = $("bellBurst");
  const bellWord = $("bellWord");
  const fishTreat = $("fishTreat");
  const feedSpark = $("feedSpark");
  const featherLayer = $("featherLayer");
  const speedLines = $("speedLines");
  const characterShadow = $("characterShadow");
  const flagRig = $("flagRig");
  const clouds = $("clouds");
  const distantGulls = $("distantGulls");
  const waterPattern = $("waterPattern");
  const deckPattern = $("deckPattern");
  const stonePattern = $("stonePattern");

  const bellButton = $("bellButton");
  const sprintButton = $("sprintButton");
  const feedButton = $("feedButton");
  const soundButton = $("soundButton");
  const roadButton = $("roadButton");
  const speedRange = $("speedRange");
  const speedValue = $("speedValue");
  const sprintHint = $("sprintHint");
  const roadLabel = $("roadLabel");
  const roadHint = $("roadHint");
  const energyFill = $("energyFill");
  const energyValue = $("energyValue");
  const paceLabel = $("paceLabel");
  const terrainLabel = $("terrainLabel");
  const weatherLabel = $("weatherLabel");
  const toast = $("toast");

  const reducedMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let cruiseSpeed = 1;
  let actualSpeed = 1;
  let energy = 78;
  let sprintRemaining = 0;
  let boostRemaining = 0;
  let startle = 0;
  let bellAnimation = 1;
  let feedProgress = -1;
  let distance = 0;
  let runPhase = 0;
  let wheelAngle = 0;
  let elapsed = 0;
  let lastTime = performance.now();
  let uiClock = 0;
  let featherClock = 0;
  let toastTimer = 0;
  let muted = false;
  let audioContext = null;

  const feathers = [];

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function lerp(from, to, amount) {
    return from + (to - from) * amount;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => {
      toast.classList.remove("show");
    }, 2800);
  }

  function ensureAudio() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        const resumeResult = audioContext.resume();
        if (resumeResult && typeof resumeResult.catch === "function") {
          resumeResult.catch(() => {});
        }
      }

      return audioContext;
    } catch (error) {
      return null;
    }
  }

  function playBellSound() {
    if (muted) return;

    const context = ensureAudio();
    if (!context) {
      showToast("叮！视觉铃声正常，浏览器暂未开放音频。");
      return;
    }

    try {
      const now = context.currentTime;
      const master = context.createGain();

      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.22, now + 0.006);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
      master.connect(context.destination);

      const frequencies = [1568, 2349.5, 3136];
      const levels = [0.8, 0.48, 0.24];

      frequencies.forEach((frequency, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.997, now + 0.65);
        gain.gain.setValueAtTime(levels[index], now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9 + index * 0.08);

        oscillator.connect(gain);
        gain.connect(master);
        oscillator.start(now);
        oscillator.stop(now + 1.25);
      });

      const shimmer = context.createOscillator();
      const shimmerGain = context.createGain();
      shimmer.type = "triangle";
      shimmer.frequency.setValueAtTime(4180, now);
      shimmer.frequency.exponentialRampToValueAtTime(3600, now + 0.22);
      shimmerGain.gain.setValueAtTime(0.12, now);
      shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      shimmer.connect(shimmerGain);
      shimmerGain.connect(master);
      shimmer.start(now);
      shimmer.stop(now + 0.3);
    } catch (error) {
      // 音频不可用时，视觉交互仍可完整运行。
    }
  }

  function ringBell() {
    bellAnimation = 0;
    startle = 1;
    boostRemaining = Math.max(boostRemaining, 1.65);
    playBellSound();

    bellButton.classList.remove("is-ringing");
    void bellButton.offsetWidth;
    bellButton.classList.add("is-ringing");
    window.setTimeout(() => bellButton.classList.remove("is-ringing"), 520);

    showToast("叮！鹈鹕受到惊吓，短时间提速 55%。");
  }

  function startSprint() {
    if (sprintRemaining > 0) {
      showToast(`已经在冲刺了，还剩 ${Math.ceil(sprintRemaining)} 秒。`);
      return;
    }

    if (energy < 8) {
      showToast("鹈鹕快没力气了，先投喂一条小鱼吧。");
      return;
    }

    sprintRemaining = 6;
    startle = Math.max(startle, 0.32);
    showToast("冲刺开始！注意，鸟力消耗得更快。");
  }

  function feedFish() {
    if (feedProgress >= 0) return;

    feedProgress = 0;
    energy = clamp(energy + 28, 0, 100);

    feedButton.classList.remove("is-feeding");
    void feedButton.offsetWidth;
    feedButton.classList.add("is-feeding");
    window.setTimeout(() => feedButton.classList.remove("is-feeding"), 650);

    showToast(energy >= 99 ? "小鸟吃得很饱，鸟力已经满格！" : "小鱼真好吃！鹈鹕恢复了 28% 鸟力。");
  }

  function updateRange() {
    cruiseSpeed = Number(speedRange.value) / 100;
    speedValue.textContent = `${cruiseSpeed.toFixed(1)}×`;
    const fill = ((cruiseSpeed - 0.3) / (1.8 - 0.3)) * 100;
    speedRange.style.setProperty("--fill", `${fill}%`);
  }

  function setWeather(value) {
    root.dataset.weather = value;

    document.querySelectorAll("[data-sky]").forEach(button => {
      const active = button.dataset.sky === value;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", String(active));
    });

    const names = {
      day: "晴朗",
      sunset: "黄昏",
      night: "夜晚"
    };

    weatherLabel.textContent = names[value] || "晴朗";
  }

  function toggleRoad() {
    const rough = root.dataset.road !== "rough";
    root.dataset.road = rough ? "rough" : "smooth";
    roadButton.setAttribute("aria-pressed", String(rough));
    roadLabel.textContent = rough ? "石子路" : "木栈道";
    roadHint.textContent = rough ? "一路颠簸" : "平稳前进";
    terrainLabel.textContent = rough ? "颠簸石子路" : "海滨木栈道";
    showToast(rough ? "路况切换：石子路。抓紧了，屁股要疼了。" : "路况切换：平整木栈道。");
  }

  function spawnFeather() {
    if (feathers.length >= 16) return;

    const group = document.createElementNS(NS, "g");
    const feather = document.createElementNS(NS, "path");
    const vein = document.createElementNS(NS, "path");

    feather.setAttribute("d", "M0 0 C8 -8 19 -8 26 0 C18 8 8 8 0 0 Z");
    feather.setAttribute("fill", "#fff7e8");
    feather.setAttribute("stroke", "#c8bba5");
    feather.setAttribute("stroke-width", "1.2");

    vein.setAttribute("d", "M2 0 Q14 1 23 0");
    vein.setAttribute("fill", "none");
    vein.setAttribute("stroke", "#d5c8b3");
    vein.setAttribute("stroke-width", "1");

    group.appendChild(feather);
    group.appendChild(vein);
    featherLayer.appendChild(group);

    feathers.push({
      node: group,
      x: 480 + Math.random() * 190,
      y: 490 + Math.random() * 100,
      vx: -(45 + Math.random() * 60),
      vy: -(9 + Math.random() * 22),
      rotation: Math.random() * 360,
      spin: (Math.random() - 0.5) * 150,
      age: 0,
      life: 3.2 + Math.random() * 2.1
    });
  }

  function updateFeathers(dt, speed) {
    featherClock += dt * (0.55 + speed * 0.72);

    if (featherClock > 0.82 && feathers.length < 16) {
      featherClock = 0;
      spawnFeather();
    }

    for (let index = feathers.length - 1; index >= 0; index -= 1) {
      const item = feathers[index];
      item.age += dt;
      item.x += item.vx * dt * (0.55 + speed * 0.5);
      item.y += (item.vy + Math.sin(item.age * 4 + item.rotation) * 17) * dt;
      item.rotation += item.spin * dt;

      const lifeRatio = item.age / item.life;
      const opacity = lifeRatio < 0.12
        ? lifeRatio / 0.12
        : Math.max(0, 1 - Math.max(0, (lifeRatio - 0.55) / 0.45));

      item.node.setAttribute(
        "transform",
        `translate(${item.x.toFixed(2)} ${item.y.toFixed(2)}) rotate(${item.rotation.toFixed(2)})`
      );
      item.node.setAttribute("opacity", opacity.toFixed(3));

      if (item.age >= item.life || item.x < -100) {
        item.node.remove();
        feathers.splice(index, 1);
      }
    }
  }

  function updateUI() {
    const roundedEnergy = Math.round(energy);
    energyValue.textContent = `${roundedEnergy}%`;
    energyFill.style.width = `${energy}%`;

    if (energy < 25) {
      energyFill.style.background = "linear-gradient(90deg, #ed795c, #ffb36b)";
    } else {
      energyFill.style.background = "linear-gradient(90deg, #6fc6b4, #a4e4d7)";
    }

    if (sprintRemaining > 0) {
      sprintButton.classList.add("active");
      sprintButton.setAttribute("aria-pressed", "true");
      sprintHint.textContent = `${Math.ceil(sprintRemaining)} 秒`;
      paceLabel.textContent = "全速逃逸";
    } else {
      sprintButton.classList.remove("active");
      sprintButton.setAttribute("aria-pressed", "false");
      sprintHint.textContent = "6 秒爆发";

      if (energy < 22) {
        paceLabel.textContent = "有点喘啦";
      } else if (actualSpeed > 1.45) {
        paceLabel.textContent = "一路小跑";
      } else if (actualSpeed > 1.12) {
        paceLabel.textContent = "轻快巡航";
      } else if (actualSpeed < 0.72) {
        paceLabel.textContent = "慢慢晃悠";
      } else {
        paceLabel.textContent = "顺风而行";
      }
    }
  }

  function animate(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    elapsed += dt;
    uiClock += dt;

    if (sprintRemaining > 0) {
      sprintRemaining = Math.max(0, sprintRemaining - dt);
      if (sprintRemaining === 0) {
        showToast("冲刺结束。鹈鹕决定假装这一切都很从容。");
      }
    }

    if (boostRemaining > 0) {
      boostRemaining = Math.max(0, boostRemaining - dt);
    }

    startle = Math.max(0, startle - dt * 0.78);
    bellAnimation = Math.min(1, bellAnimation + dt / 0.9);

    const rough = root.dataset.road === "rough";
    const fatigue = energy < 25 ? (25 - energy) / 25 : 0;
    const sprinting = sprintRemaining > 0;

    let targetSpeed = cruiseSpeed;
    if (boostRemaining > 0) targetSpeed *= 1.55;
    if (sprinting) targetSpeed *= 1.9;
    if (energy <= 0) targetSpeed *= 0.48;
    else if (energy < 20) targetSpeed *= 0.76;

    actualSpeed = lerp(actualSpeed, targetSpeed, 1 - Math.exp(-dt * 4.2));

    const energyDrain = (0.16 + cruiseSpeed * 0.4 + (sprinting ? 2.25 : 0) + (boostRemaining > 0 ? 0.25 : 0)) * dt;
    const energyRecovery = cruiseSpeed < 0.65 ? 0.42 * dt : 0;
    energy = clamp(energy - energyDrain + energyRecovery, 0, 100);

    const speedDistance = actualSpeed * 112 * dt;
    distance += speedDistance;
    runPhase += dt * (4.4 + actualSpeed * 2.1);
    wheelAngle -= actualSpeed * dt * 1.48;

    const motion = reducedMotion ? 0.45 : 1;
    const roughAmount = rough ? 1 : 0;

    const bodyBob = (
      -Math.abs(Math.sin(runPhase * 2)) * (roughAmount ? 8 : 3.4) +
      (roughAmount ? Math.sin(distance * 0.53) * 5.4 : 0) +
      Math.sin(runPhase * 4) * 0.8
    ) * motion;

    const rideTilt = (
      Math.sin(runPhase) * (roughAmount ? 2.7 : 1.05) +
      Math.sin(distance * 0.24) * roughAmount * 1.4 +
      fatigue * 2.5
    ) * motion;

    const shake = bellAnimation < 1
      ? Math.sin((1 - bellAnimation) * 68) * (1 - bellAnimation) * 5.2
      : 0;

    rideRig.setAttribute(
      "transform",
      `translate(${shake.toFixed(2)} ${bodyBob.toFixed(2)}) rotate(${rideTilt.toFixed(2)} 850 720)`
    );

    const bikeBob = (
      Math.sin(runPhase * 2 + 0.7) * (roughAmount ? 7.2 : 2.7) +
      (roughAmount ? Math.sin(distance * 0.91 + 1.3) * 3.3 : 0)
    ) * motion;

    const bikeTilt = (
      Math.sin(runPhase + 0.5) * (roughAmount ? 4.7 : 2) -
      startle * 2.2
    ) * motion;

    bikeRig.setAttribute(
      "transform",
      `translate(0 ${bikeBob.toFixed(2)}) rotate(${bikeTilt.toFixed(2)} 870 425)`
    );

    flagRig.setAttribute(
      "transform",
      `rotate(${(Math.sin(elapsed * 7) * 3.5 + actualSpeed * 1.8).toFixed(2)} 805 242)`
    );

    const farWingAngle = (
      -12 + Math.sin(runPhase * 2 + 1) * (roughAmount ? 17 : 10.5) -
      startle * 11
    ) * motion;

    farWing.setAttribute("transform", `rotate(${farWingAngle.toFixed(2)} 760 505)`);

    const nearWingAngle = (
      -1.5 + Math.sin(runPhase + 0.8) * (roughAmount ? 5.2 : 2.4) +
      startle * 4
    ) * motion;

    nearWing.setAttribute("transform", `rotate(${nearWingAngle.toFixed(2)} 775 535)`);

    const backLegAngle = Math.sin(runPhase) * (roughAmount ? 19 : 13) * motion;
    const frontLegAngle = Math.sin(runPhase + Math.PI) * (roughAmount ? 19 : 13) * motion;

    backLeg.setAttribute("transform", `rotate(${backLegAngle.toFixed(2)} 780 650)`);
    frontLeg.setAttribute("transform", `rotate(${frontLegAngle.toFixed(2)} 900 648)`);

    const headBob = (
      Math.sin(runPhase * 2 + 0.3) * (roughAmount ? 3.1 : 1.6) +
      fatigue * 5
    ) * motion;

    const headAngle = (
      Math.sin(runPhase + 0.4) * (roughAmount ? 2.6 : 1.1) -
      startle * 3
    ) * motion;

    headRig.setAttribute(
      "transform",
      `translate(0 ${headBob.toFixed(2)}) rotate(${headAngle.toFixed(2)} 1150 442)`
    );

    const pouchAngle = (
      Math.sin(runPhase * 1.75 + 0.4) * (roughAmount ? 7 : 3.1) +
      Math.sin(elapsed * 4.1) * 0.8
    ) * motion;

    pouchRig.setAttribute("transform", `rotate(${pouchAngle.toFixed(2)} 1178 446)`);

    const blinkCycle = (elapsed + 1.65) % 5.1;
    const blinkScale = blinkCycle < 0.17
      ? Math.abs(Math.cos((blinkCycle / 0.17) * Math.PI / 2))
      : 1;

    const eyeScaleX = 1 + startle * 0.14;
    const eyeScaleY = blinkScale * (1 + startle * 0.1);
    eyeGroup.setAttribute(
      "transform",
      `translate(1170 400) scale(${eyeScaleX.toFixed(3)} ${eyeScaleY.toFixed(3)}) translate(-1170 -400)`
    );

    normalBrow.setAttribute("opacity", String(1 - startle));
    startledBrow.setAttribute("opacity", String(startle));

    const sweating = sprinting || energy < 32 || startle > 0.25;
    sweatGroup.setAttribute("opacity", sweating ? String(clamp(0.45 + startle * 0.5, 0, 1)) : "0");
    sweatGroup.setAttribute(
      "transform",
      `translate(${(Math.sin(elapsed * 2.8) * 2).toFixed(2)} ${((elapsed * 13) % 16).toFixed(2)})`
    );

    rearSpokes.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    frontSpokes.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)})`);
    crank.setAttribute("transform", `rotate(${(wheelAngle * 0.41).toFixed(2)} 850 350)`);
    chainHighlight.setAttribute("stroke-dashoffset", (-distance * 0.8).toFixed(2));

    const shadowScale = 1 - Math.max(0, bodyBob) * 0.012;
    characterShadow.setAttribute("rx", (177 * shadowScale).toFixed(2));
    characterShadow.setAttribute("opacity", (0.22 - Math.max(0, bodyBob) * 0.004).toFixed(3));

    // 视差：云、海浪、栈道板缝、石子与远处海鸟采用不同速度。
    const cloudShift = -(distance * 0.042) % 1600;
    clouds.setAttribute(
      "transform",
      `translate(${cloudShift.toFixed(2)} ${(Math.sin(elapsed * 0.08) * 3).toFixed(2)})`
    );

    distantGulls.setAttribute(
      "transform",
      `translate(${(-(distance * 0.018) % 1600).toFixed(2)} ${(Math.sin(elapsed * 0.7) * 3).toFixed(2)})`
    );

    waterPattern.setAttribute(
      "patternTransform",
      `translate(${(-(distance * 0.12) % 280).toFixed(2)} 0)`
    );

    deckPattern.setAttribute(
      "patternTransform",
      `translate(${(-(distance * 0.7) % 220).toFixed(2)} 0)`
    );

    stonePattern.setAttribute(
      "patternTransform",
      `translate(${(-(distance * 1.05) % 180).toFixed(2)} 0)`
    );

    const speedOpacity = clamp((actualSpeed - 0.55) * 0.35, 0, 0.55) + (sprinting ? 0.16 : 0);
    speedLines.setAttribute("opacity", speedOpacity.toFixed(3));
    speedLines.setAttribute(
      "transform",
      `translate(${(-(distance * 1.2) % 180).toFixed(2)} 0)`
    );

    // 车铃视觉反馈。
    const bellProgress = 1 - bellAnimation;
    bellBurst.setAttribute("opacity", (bellProgress < 1 ? (1 - bellProgress) * 0.92 : 0).toFixed(3));
    bellBurst.setAttribute(
      "transform",
      `translate(1038 203) scale(${(0.65 + bellProgress * 1.15).toFixed(3)}) translate(-1038 -203)`
    );

    const wordOpacity = bellAnimation < 0.43 ? 1 - bellAnimation / 0.43 : 0;
    bellWord.setAttribute("opacity", wordOpacity.toFixed(3));
    bellWord.setAttribute(
      "transform",
      `translate(${(-bellAnimation * 15).toFixed(2)} ${(-bellAnimation * 35).toFixed(2)}) rotate(${(-bellAnimation * 8).toFixed(2)})`
    );

    // 小鱼从上方跃入长喙。
    if (feedProgress >= 0) {
      feedProgress += dt / 1.18;
      const t = clamp(feedProgress, 0, 1);
      const eased = 1 - Math.pow(1 - t, 2);
      const x = 1245 + (1 - eased) * 135;
      const y = 430 - (1 - eased) * 255 + Math.sin(t * Math.PI) * 45;
      const rotation = -12 + Math.sin(t * 22) * 12;

      fishTreat.setAttribute(
        "transform",
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rotation.toFixed(2)})`
      );
      fishTreat.setAttribute("opacity", t < 0.87 ? "1" : String(Math.max(0, (1 - t) * 7.5)));

      if (t > 0.84) {
        feedSpark.setAttribute("opacity", String(Math.sin(clamp((t - 0.84) / 0.16, 0, 1) * Math.PI) * 0.9));
      } else {
        feedSpark.setAttribute("opacity", "0");
      }

      if (t >= 1) {
        feedProgress = -1;
        fishTreat.setAttribute("opacity", "0");
        feedSpark.setAttribute("opacity", "0");
      }
    }

    updateFeathers(dt, actualSpeed);

    if (uiClock > 0.08) {
      uiClock = 0;
      updateUI();
    }

    requestAnimationFrame(animate);
  }

  bellButton.addEventListener("click", ringBell);
  sprintButton.addEventListener("click", startSprint);
  feedButton.addEventListener("click", feedFish);
  roadButton.addEventListener("click", toggleRoad);

  speedRange.addEventListener("input", updateRange);

  soundButton.addEventListener("click", () => {
    muted = !muted;
    soundButton.classList.toggle("muted", muted);
    soundButton.setAttribute("aria-label", muted ? "开启铃声" : "关闭铃声");
    soundButton.setAttribute("title", muted ? "开启铃声" : "关闭铃声");
    showToast(muted ? "铃声已静音，画面继续。" : "铃声已开启，叮！");
  });

  document.querySelectorAll("[data-sky]").forEach(button => {
    button.addEventListener("click", () => {
      setWeather(button.dataset.sky);
      const names = { day: "晴天", sunset: "黄昏", night: "夜晚" };
      showToast(`天色已切换为${names[button.dataset.sky]}，旅程继续。`);
    });
  });

  window.addEventListener("keydown", event => {
    if (event.repeat) return;

    const target = event.target;
    const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea" || tag === "select" || tag === "button") {
      return;
    }

    const key = event.key.toLowerCase();

    if (event.code === "Space") {
      event.preventDefault();
      startSprint();
    } else if (key === "b") {
      event.preventDefault();
      ringBell();
    } else if (key === "f") {
      event.preventDefault();
      feedFish();
    }
  });

  document.addEventListener("visibilitychange", () => {
    lastTime = performance.now();
  });

  updateRange();
  updateUI();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
