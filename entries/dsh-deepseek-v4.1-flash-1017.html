  function drawBikeDetails(pose) {
    if (state.night > 0.15) {
      const lampX = 49, lampY = -420;
      const glow = ctx.createRadialGradient(lampX, lampY, 2, lampX, lampY, 52);
      glow.addColorStop(0, "rgba(255,230,153," + (0.55 * state.night) + ")");
      glow.addColorStop(0.4, "rgba(255,223,137," + (0.18 * state.night) + ")");
      glow.addColorStop(1, "rgba(255,223,137,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(lampX - 55, lampY - 55, 110, 110);
      ctx.fillStyle = "#ffe4a0";
      ctx.beginPath();
      ctx.arc(lampX, lampY, 4.2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "rgba(255,244,196,.13)";
      ctx.beginPath();
      ctx.moveTo(lampX + 4, lampY - 7);
      ctx.lineTo(lampX + 96, lampY - 33);
      ctx.lineTo(lampX + 78, lampY + 24);
      ctx.closePath();
      ctx.fill();
    }

    ctx.strokeStyle = "rgba(255,244,217,.75)";
    ctx.lineWidth = 1.6;
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const off = (state.t * (110 + i * 20) + i * 41) % 150;
      const x = 105 - off * 0.25;
      const y = -415 + i * 19;
      ctx.globalAlpha = 0.25 * (1 - off / 150);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 28, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (state.rings.length) {
      ctx.save();
      ctx.translate(52, -476);
      for (let i = 0; i < state.rings.length; i++) {
        const r = state.rings[i].age;
        ctx.globalAlpha = Math.max(0, 0.7 - r * 0.7);
        ctx.strokeStyle = "#ffe7a1";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(0, 0, 8 + easeOut(r) * 92, 0, TAU);
        ctx.stroke();
      }
      ctx.restore();
    }

    const sparkle = state.startle;
    if (sparkle > 0.15) {
      ctx.save();
      ctx.globalAlpha = sparkle * 0.55;
      ctx.strokeStyle = "#fff0b8";
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const a = state.t * 4 + i * 2.1;
        const x = 96 + Math.cos(a) * 20;
        const y = -454 + Math.sin(a) * 12;
        ctx.beginPath();
        ctx.moveTo(x - 4, y);
        ctx.lineTo(x + 4, y);
        ctx.moveTo(x, y - 4);
        ctx.lineTo(x, y + 4);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawReins(bodyBob, pose) {
    const a = bikePoint(51, -477, pose);
    const b = bikePoint(40, -471, pose);
    const targetX = 242;
    const targetY = -339 + bodyBob;
    ctx.save();
    ctx.strokeStyle = BIRD.leather;
    ctx.lineWidth = 3.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.bezierCurveTo(a.x + 46, a.y + 12, targetX - 48, targetY - 82, targetX, targetY);
    ctx.stroke();
    ctx.strokeStyle = BIRD.leatherLight;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(a.x + 1, a.y - 1);
    ctx.bezierCurveTo(a.x + 47, a.y + 9, targetX - 46, targetY - 82, targetX, targetY - 2);
    ctx.stroke();
    ctx.strokeStyle = "#70462f";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.bezierCurveTo(b.x + 42, b.y + 18, targetX - 60, targetY - 55, targetX, targetY + 3);
    ctx.stroke();
    ctx.fillStyle = "#e0ae5b";
    ctx.beginPath();
    ctx.arc(targetX, targetY, 3.8, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* --------------------------- scene particles --------------------------- */

  function drawParticles(layer) {
    for (let i = 0; i < state.particles.length; i++) {
      const p = state.particles[i];
      const back = p.type === "dust" || p.type === "pebble";
      if ((layer === "back") !== back) continue;
      const alpha = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      if (p.type === "dust") {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.65 + (1 - alpha) * 0.65), 0, TAU);
        ctx.fill();
      } else if (p.type === "pebble") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "rgba(91,65,43,.3)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.66, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();
      } else if (p.type === "sweat") {
        ctx.translate(p.x, p.y);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.size);
        ctx.quadraticCurveTo(p.size, p.size * 0.25, 0, p.size * 0.8);
        ctx.quadraticCurveTo(-p.size, p.size * 0.25, 0, -p.size);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.beginPath();
        ctx.arc(-p.size * 0.28, p.size * 0.18, p.size * 0.22, 0, TAU);
        ctx.fill();
      } else if (p.type === "feather") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "rgba(173,134,85,.35)";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-p.size * 1.5, 0);
        ctx.quadraticCurveTo(0, -p.size * 0.9, p.size * 1.6, 0);
        ctx.quadraticCurveTo(0, p.size * 0.55, -p.size * 1.5, 0);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-p.size, 0);
        ctx.lineTo(p.size * 1.2, 0);
        ctx.stroke();
      } else if (p.type === "heart") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, p.size * 0.7);
        ctx.bezierCurveTo(-p.size * 1.5, -p.size * 0.15, -p.size * 0.7, -p.size, 0, -p.size * 0.36);
        ctx.bezierCurveTo(p.size * 0.7, -p.size, p.size * 1.5, -p.size * 0.15, 0, p.size * 0.7);
        ctx.fill();
      } else if (p.type === "spark") {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-p.size, 0);
        ctx.lineTo(p.size, 0);
        ctx.moveTo(0, -p.size);
        ctx.lineTo(0, p.size);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawFish() {
    if (!state.fish) return;
    const f = state.fish;
    const t = clamp(f.age / f.dur, 0, 1);
    const u = 1 - t;
    const x = u * u * f.sx + 2 * u * t * f.cx + t * t * f.ex;
    const y = u * u * f.sy + 2 * u * t * f.cy + t * t * f.ey;
    const dx = 2 * u * (f.cx - f.sx) + 2 * t * (f.ex - f.cx);
    const dy = 2 * u * (f.cy - f.sy) + 2 * t * (f.ey - f.cy);
    const angle = Math.atan2(dy, dx);
    const wobble = Math.sin(state.t * 22) * 0.18;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle + wobble * 0.3);
    ctx.fillStyle = "#6eb7bf";
    ctx.strokeStyle = "#2e696f";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 7.2, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#89cdd0";
    ctx.beginPath();
    ctx.ellipse(-3, -1.8, 9, 3.1, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#4c9fa8";
    ctx.beginPath();
    ctx.moveTo(-13, 0);
    ctx.lineTo(-25, -8 + wobble * 6);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-25, 8 + wobble * 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#dff5e9";
    ctx.beginPath();
    ctx.arc(8, -2.4, 2.8, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#183c3d";
    ctx.beginPath();
    ctx.arc(8.6, -2.4, 1.3, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-6, 2.5);
    ctx.quadraticCurveTo(0, 4.2, 7, 1.5);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = "#dffbf4";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 20, y + 12);
    ctx.lineTo(x - 32, y + 14);
    ctx.moveTo(x - 17, y + 17);
    ctx.lineTo(x - 26, y + 20);
    ctx.stroke();
    ctx.restore();
  }

  function drawStartleMark(bob) {
    if (state.startle < 0.16) return;
    ctx.save();
    ctx.globalAlpha = clamp(state.startle, 0, 0.9);
    ctx.fillStyle = "#e96b4b";
    ctx.font = "900 31px ui-rounded, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("!", 236, -415 + bob);
    ctx.font = "900 15px ui-rounded, sans-serif";
    ctx.fillText("!", 218, -399 + bob);
    ctx.restore();
  }

  function drawSpeechBubble() {
    if (!state.bubble) return;
    const b = state.bubble;
    const fade = clamp(b.life / Math.min(0.35, b.max), 0, 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, fade);
    ctx.font = "900 17px ui-rounded, 'PingFang SC', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const textW = ctx.measureText(b.text).width;
    const w = textW + 30;
    const h = 33;
    const x = b.x - w / 2;
    const y = b.y - h / 2 - (1 - fade) * 8;
    ctx.shadowColor = "rgba(62,51,37,.18)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = "rgba(255,249,235,.96)";
    ctx.strokeStyle = "rgba(96,76,52,.2)";
    ctx.lineWidth = 1.2;
    roundRectPath(x, y, w, h, 13);
    ctx.fill();
    ctx.stroke();
    ctx.shadowColor = "transparent";
    ctx.beginPath();
    ctx.moveTo(b.x - 9, y + h - 1);
    ctx.lineTo(b.x - 19, y + h + 10);
    ctx.lineTo(b.x + 4, y + h - 1);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,249,235,.96)";
    ctx.fill();
    ctx.fillStyle = "#d85c3f";
    ctx.fillText(b.text, b.x, y + h / 2 + 0.5);
    ctx.restore();
  }

  /* -------------------------------- render -------------------------------- */

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    drawSpeedLines();
    drawScene();
    drawForeground();
  }

  let lastTime = 0;
  function frame(now) {
    if (!lastTime) lastTime = now;
    const dt = clamp((now - lastTime) / 1000, 0, 0.05);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* -------------------------------- wiring -------------------------------- */

  speedRange.addEventListener("input", function () {
    setSpeedLabel(Number(speedRange.value));
  });

  bellBtn.addEventListener("click", ringBell);
  sprintBtn.addEventListener("click", triggerSprint);
  feedBtn.addEventListener("click", feedFish);
  terrainBtn.addEventListener("click", toggleTerrain);
  themeBtn.addEventListener("click", cycleTheme);

  window.addEventListener("keydown", function (e) {
    const tag = document.activeElement ? document.activeElement.tagName : "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.code === "Space") {
      if (tag === "BUTTON") return;
      e.preventDefault();
      triggerSprint();
      return;
    }
    const key = e.key.toLowerCase();
    if (key === "b") ringBell();
    else if (key === "f") feedFish();
    else if (key === "g") toggleTerrain();
    else if (key === "t") cycleTheme();
  });

  window.addEventListener("pointerdown", function () { getAudio(); }, { once: true });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 100); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) lastTime = performance.now();
  });

  setSpeedLabel(Number(speedRange.value));
  document.body.dataset.theme = "day";
  resize();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
