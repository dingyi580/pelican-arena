<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8fd8e7">
<title>单车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  :root{
    --ink:#203936;
    --muted:#69756c;
    --cream:#fff9ed;
    --rail:rgba(32,57,54,.12);
    --accent:#e96b4b;
    --accent-deep:#c94f33;
    --teal:#285b56;
    --sage:#dcebdc;
    --shadow:0 18px 46px rgba(22,54,51,.18);
  }
  *{box-sizing:border-box;}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;}
  body{
    background:#102c2b;
    color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overscroll-behavior:none;
  }
  button,input{font:inherit;}
  button{-webkit-tap-highlight-color:transparent;}
  #stage{
    position:fixed;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    z-index:0;
  }
  .vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 44%,rgba(255,255,255,0) 48%,rgba(20,53,50,.11) 100%),
      linear-gradient(180deg,rgba(255,255,255,.07),transparent 22%,transparent 78%,rgba(19,46,43,.08));
    mix-blend-mode:multiply;
  }
  .topbar{
    position:fixed;
    z-index:6;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    pointer-events:none;
  }
  .brand,
  .hud{
    pointer-events:auto;
    background:rgba(255,249,238,.82);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.75);
    -webkit-backdrop-filter:blur(18px) saturate(1.16);
    backdrop-filter:blur(18px) saturate(1.16);
  }
  .brand{
    max-width:min(530px,58vw);
    padding:13px 18px 12px;
    border-radius:19px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    color:#798176;
    font-size:9px;
    font-weight:800;
    letter-spacing:.18em;
    line-height:1;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(233,107,75,.13);
    animation:pulse 2.4s ease-in-out infinite;
  }
  .sep{opacity:.42;}
  .brand h1{
    margin:7px 0 0;
    display:flex;
    align-items:baseline;
    gap:11px;
    color:#193a36;
    font-size:clamp(21px,2.25vw,31px);
    font-weight:900;
    letter-spacing:.035em;
    line-height:1;
    white-space:nowrap;
  }
  .brand h1 .en{
    color:#7c8276;
    font-size:10px;
    font-weight:700;
    letter-spacing:.02em;
    white-space:nowrap;
  }
  .hud{
    display:flex;
    align-items:center;
    gap:16px;
    min-width:350px;
    padding:10px 12px 10px 16px;
    border-radius:19px;
  }
  .speed-readout{
    min-width:82px;
    padding-right:14px;
    border-right:1px solid var(--rail);
  }
  .metric-label{
    display:block;
    margin-bottom:2px;
    color:#7a8479;
    font-size:9px;
    font-weight:800;
    letter-spacing:.12em;
  }
  .speed-readout > div{display:flex;align-items:baseline;gap:4px;}
  #kmh{
    display:inline-block;
    min-width:43px;
    color:#1c3c37;
    font-size:25px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.05em;
    line-height:1;
  }
  .speed-readout em{
    color:#7c8479;
    font-size:9px;
    font-style:normal;
    font-weight:700;
    letter-spacing:.02em;
  }
  .stamina-box{width:148px;}
  .stamina-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:5px;
    color:#7a8479;
    font-size:9px;
    font-weight:800;
    letter-spacing:.04em;
  }
  .stamina-top b{
    color:#42635b;
    font-size:9px;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    height:7px;
    overflow:hidden;
    background:rgba(38,67,61,.11);
    border-radius:999px;
    box-shadow:inset 0 1px 2px rgba(30,56,51,.12);
  }
  .bar i{
    display:block;
    width:100%;
    height:100%;
    border-radius:inherit;
    background:linear-gradient(90deg,#7cab73,#d4ad5f);
    transition:width .12s linear,background .35s ease;
  }
  .bar i.low{background:linear-gradient(90deg,#e5835d,#d8553d);}
  .theme-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    height:39px;
    padding:0 12px;
    border:0;
    border-radius:12px;
    background:rgba(35,69,62,.075);
    color:#294d46;
    cursor:pointer;
    transition:background .2s ease,transform .2s ease;
    white-space:nowrap;
  }
  .theme-btn:hover{background:rgba(35,69,62,.13);transform:translateY(-1px);}
  .theme-btn:active{transform:translateY(0) scale(.97);}
  #themeIcon{font-size:17px;line-height:1;transform:translateY(-.5px);}
  #themeLabel{font-size:10px;font-weight:800;letter-spacing:.04em;}
  .dock{
    position:fixed;
    z-index:8;
    left:50%;
    bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;
    align-items:stretch;
    gap:9px;
    width:max-content;
    max-width:calc(100vw - 28px);
    padding:10px 11px;
    border:1px solid rgba(255,255,255,.83);
    border-radius:24px;
    background:rgba(255,249,239,.88);
    box-shadow:0 24px 60px rgba(17,47,43,.23),inset 0 1px 0 rgba(255,255,255,.9);
    -webkit-backdrop-filter:blur(24px) saturate(1.22);
    backdrop-filter:blur(24px) saturate(1.22);
  }
  .bell-btn,
  .action-btn,
  .speed-box{
    border-radius:16px;
  }
  .bell-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:106px;
    height:59px;
    padding:0 16px;
    border:0;
    color:#fffaf1;
    background:linear-gradient(145deg,#f07a55,#dd5b3e);
    box-shadow:0 9px 20px rgba(194,73,44,.28),inset 0 1px 0 rgba(255,255,255,.28);
    cursor:pointer;
    overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .bell-btn::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.22) 42%,transparent 63%);
    transform:translateX(-120%);
    transition:transform .55s ease;
  }
  .bell-btn:hover{transform:translateY(-2px);box-shadow:0 13px 25px rgba(194,73,44,.33),inset 0 1px 0 rgba(255,255,255,.28);}
  .bell-btn:hover::after{transform:translateX(120%);}
  .bell-btn:active{transform:translateY(0) scale(.98);}
  .bell-btn.ringing .bell-glyph{animation:bell-shake .5s cubic-bezier(.36,.07,.19,.97);}
  .bell-glyph{display:grid;place-items:center;width:27px;height:27px;flex:0 0 auto;}
  .bell-glyph svg{width:25px;height:25px;}
  .bell-copy{display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1;}
  .bell-copy b{font-size:13px;font-weight:900;letter-spacing:.03em;}
  .bell-copy small{margin-top:5px;font-size:7.5px;font-weight:800;letter-spacing:.19em;opacity:.73;}
  .speed-box{
    display:flex;
    flex-direction:column;
    justify-content:center;
    width:222px;
    padding:0 9px;
  }
  .speed-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:2px;
  }
  .speed-head label{
    color:#69756b;
    font-size:9px;
    font-weight:800;
    letter-spacing:.11em;
    cursor:pointer;
  }
  #speedText{
    color:#2b534b;
    font-size:10px;
    font-weight:900;
    letter-spacing:.04em;
  }
  .speed-range{
    --pct:58%;
    width:100%;
    height:20px;
    margin:1px 0 0;
    padding:0;
    background:transparent;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .speed-range:focus{outline:none;}
  .speed-range::-webkit-slider-runnable-track{
    width:100%;
    height:6px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--accent) 0 var(--pct),rgba(38,66,61,.14) var(--pct) 100%);
    box-shadow:inset 0 1px 1px rgba(35,62,56,.08);
  }
  .speed-range::-webkit-slider-thumb{
    width:18px;height:18px;margin-top:-6px;
    border:3px solid var(--accent);
    border-radius:50%;
    background:#fffaf0;
    box-shadow:0 2px 7px rgba(142,60,42,.28);
    -webkit-appearance:none;
    appearance:none;
    transition:transform .15s ease;
  }
  .speed-range:hover::-webkit-slider-thumb{transform:scale(1.1);}
  .speed-range::-moz-range-track{
    width:100%;height:6px;border-radius:999px;
    background:rgba(38,66,61,.14);
  }
  .speed-range::-moz-range-progress{
    height:6px;border-radius:999px;background:var(--accent);
  }
  .speed-range::-moz-range-thumb{
    width:13px;height:13px;border:3px solid var(--accent);
    border-radius:50%;background:#fffaf0;box-shadow:0 2px 7px rgba(142,60,42,.28);
  }
  .speed-scale{
    display:flex;
    justify-content:space-between;
    margin-top:-2px;
    color:#9a9f93;
    font-size:7.5px;
    font-weight:700;
    letter-spacing:.05em;
  }
  .action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-width:76px;
    height:59px;
    padding:0 13px;
    border:0;
    color:#284b44;
    background:rgba(39,72,65,.075);
    cursor:pointer;
    transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
    white-space:nowrap;
  }
  .action-btn svg{width:18px;height:18px;flex:0 0 auto;}
  .action-btn span{font-size:10.5px;font-weight:900;letter-spacing:.03em;}
  .action-btn:hover{transform:translateY(-1px);background:rgba(39,72,65,.12);}
  .action-btn:active{transform:translateY(0) scale(.97);}
  .action-btn.sprint{
    min-width:82px;
    color:#fff8e9;
    background:linear-gradient(145deg,#2b5d55,#1e4641);
    box-shadow:0 8px 17px rgba(22,63,55,.19),inset 0 1px 0 rgba(255,255,255,.15);
  }
  .action-btn.sprint:hover{background:linear-gradient(145deg,#326a61,#23504a);}
  .action-btn.sprint.is-active{
    background:linear-gradient(145deg,#e57952,#c95538);
    box-shadow:0 0 0 4px rgba(233,107,75,.13),0 8px 18px rgba(190,71,42,.22);
    animation:sprint-pulse .7s ease-in-out infinite alternate;
  }
  .action-btn.feed{
    color:#2d5540;
    background:rgba(175,206,167,.48);
  }
  .action-btn.feed:hover{background:rgba(165,201,156,.72);}
  .action-btn.feed.is-active{animation:feed-bounce .55s ease-in-out infinite alternate;background:rgba(241,196,114,.48);}
  .action-btn.terrain{
    min-width:82px;
    color:#496157;
    background:rgba(67,91,79,.065);
  }
  .action-btn.terrain:hover{background:rgba(67,91,79,.11);}
  .action-btn:focus-visible,.bell-btn:focus-visible,.theme-btn:focus-visible,.speed-range:focus-visible{
    outline:3px solid rgba(233,107,75,.52);
    outline-offset:3px;
  }
  .toast{
    position:fixed;
    z-index:20;
    left:50%;
    bottom:calc(18px + 84px);
    transform:translate(-50%,10px);
    max-width:min(88vw,430px);
    padding:9px 16px;
    border-radius:999px;
    background:rgba(25,54,49,.91);
    color:#fff7e6;
    box-shadow:0 12px 28px rgba(21,48,44,.2);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .noscript{
    position:fixed;z-index:30;inset:0;display:grid;place-items:center;
    padding:30px;background:#f7ead2;color:#24443f;text-align:center;font-weight:700;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.78);opacity:.6}}
  @keyframes bell-shake{0%,100%{transform:rotate(0)}18%{transform:rotate(-19deg)}36%{transform:rotate(16deg)}54%{transform:rotate(-11deg)}72%{transform:rotate(7deg)}86%{transform:rotate(-3deg)}}
  @keyframes sprint-pulse{from{box-shadow:0 0 0 2px rgba(233,107,75,.11),0 8px 18px rgba(190,71,42,.18)}to{box-shadow:0 0 0 7px rgba(233,107,75,.08),0 8px 18px rgba(190,71,42,.24)}}
  @keyframes feed-bounce{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-3px) rotate(1deg)}}
  @media (max-width:1050px){
    .brand h1 .en{display:none;}
    .hud{min-width:0;}
    .brand{max-width:52vw;}
  }
  @media (max-width:760px){
    .topbar{top:10px;left:10px;right:10px;gap:8px;}
    .brand{padding:10px 12px;border-radius:15px;max-width:calc(100vw - 182px);}
    .eyebrow{font-size:7.5px;letter-spacing:.13em;}
    .brand h1{font-size:20px;letter-spacing:.02em;}
    .hud{padding:8px 8px 8px 12px;border-radius:15px;gap:9px;}
    .speed-readout{min-width:61px;padding-right:9px;}
    .metric-label{font-size:7.5px;}
    #kmh{font-size:21px;min-width:36px;}
    .speed-readout em{font-size:7.5px;}
    .stamina-box{width:78px;}
    .stamina-top{font-size:7.5px;margin-bottom:4px;}
    .stamina-top b{font-size:7.5px;}
    .bar{height:6px;}
    .theme-btn{height:33px;width:33px;padding:0;}
    #themeLabel{display:none;}
    #themeIcon{font-size:15px;}
    .dock{
      left:10px;right:10px;bottom:max(9px,env(safe-area-inset-bottom));
      width:auto;max-width:none;transform:none;
      display:grid;
      grid-template-columns:1.28fr .92fr .98fr .86fr;
      grid-template-areas:"speed speed speed speed" "bell sprint feed terrain";
      gap:7px;padding:8px;border-radius:20px;
    }
    .speed-box{grid-area:speed;width:auto;height:46px;padding:1px 4px 0;}
    .speed-head{margin-bottom:0;}
    .speed-range{height:18px;}
    .speed-scale{font-size:7px;}
    .bell-btn{grid-area:bell;min-width:0;height:49px;padding:0 10px;gap:6px;border-radius:14px;}
    .bell-glyph{width:22px;height:22px;}
    .bell-glyph svg{width:21px;height:21px;}
    .bell-copy b{font-size:11px;}
    .bell-copy small{display:none;}
    .action-btn{min-width:0;height:49px;padding:0 7px;border-radius:14px;gap:4px;}
    .action-btn span{font-size:9.5px;}
    .action-btn svg{width:15px;height:15px;}
    .action-btn.sprint{grid-area:sprint;min-width:0;}
    .action-btn.feed{grid-area:feed;}
    .action-btn.terrain{grid-area:terrain;min-width:0;}
    .toast{bottom:calc(9px + 124px);font-size:10.5px;padding:8px 12px;}
    .action-btn.terrain span{font-size:9px;}
  }
  @media (max-width:390px){
    .brand h1{font-size:18px;}
    .eyebrow{display:none;}
    .brand{max-width:calc(100vw - 168px);padding:11px 12px;}
    .hud{gap:7px;padding-left:10px;}
    .stamina-box{width:68px;}
  }
  @media (max-height:560px) and (orientation:landscape){
    .topbar{top:8px;left:10px;right:10px;}
    .brand{padding:8px 12px;border-radius:14px;}
    .eyebrow{display:none;}
    .brand h1{margin-top:0;font-size:18px;}
    .hud{padding:6px 8px;border-radius:14px;gap:10px;}
    .speed-readout{min-width:58px;padding-right:9px;}
    .metric-label{font-size:7.5px;margin-bottom:0;}
    #kmh{font-size:20px;min-width:34px;}
    .speed-readout em{font-size:7.5px;}
    .stamina-box{width:96px;}
    .stamina-top{font-size:7.5px;margin-bottom:3px;}
    .stamina-top b{font-size:7.5px;}
    .theme-btn{height:32px;padding:0 9px;}
    .dock{
      left:50%;right:auto;bottom:8px;padding:7px 8px;gap:7px;border-radius:18px;
      display:flex;width:max-content;max-width:calc(100vw - 16px);transform:translateX(-50%);
    }
    .bell-btn{min-width:94px;height:48px;padding:0 12px;border-radius:13px;}
    .bell-copy small{display:none;}
    .speed-box{width:188px;}
    .speed-head label{font-size:8px;}
    #speedText{font-size:9px;}
    .speed-scale{font-size:7px;}
    .action-btn{height:48px;min-width:66px;padding:0 9px;border-radius:13px;}
    .action-btn span{font-size:9.5px;}
    .toast{bottom:calc(8px + 63px);}
  }
  @media (max-height:560px) and (max-width:620px) and (orientation:landscape){
    .brand h1{font-size:16px;}
    .hud{gap:6px;padding:5px 7px;}
    .hud .stamina-box{width:66px;}
    .speed-readout{min-width:50px;padding-right:7px;}
    #kmh{font-size:18px;min-width:30px;}
    .dock{gap:5px;padding:6px 7px;}
    .bell-btn{min-width:60px;padding:0 8px;}
    .bell-copy b{font-size:9px;}
    .speed-box{width:116px;}
    .action-btn{min-width:46px;padding:0 5px;}
    .action-btn span{display:none;}
    .action-btn svg{width:18px;height:18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .live-dot,.bell-btn.ringing .bell-glyph,.action-btn.sprint.is-active,.action-btn.feed.is-active{animation:none;}
  }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="一辆红色自行车骑在鹈鹕背上，沿着海边木栈道奔跑。"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="eyebrow"><i class="live-dot"></i><span>Seaside Circus</span><span class="sep">/</span><span>No. 08</span></div>
    <h1>单车骑鹈鹕 <span class="en">A Bicycle Riding a Pelican</span></h1>
  </div>
  <div class="hud">
    <div class="speed-readout">
      <span class="metric-label">速度</span>
      <div><strong id="kmh">25</strong><em>km/h</em></div>
    </div>
    <div class="stamina-box">
      <div class="stamina-top"><span>鹈鹕体力</span><b id="staminaVal">100%</b></div>
      <div class="bar"><i id="staminaFill"></i></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" title="切换晴天、黄昏与夜晚（T）" aria-label="切换时间">
      <span id="themeIcon">☀</span><span id="themeLabel">晴天</span>
    </button>
  </div>
</header>

<div class="dock" role="group" aria-label="互动控制">
  <button class="bell-btn" id="bellBtn" type="button" title="按响车铃（B）" aria-label="按响车铃">
    <span class="bell-glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.1 16.4h11.8c-.92-1.28-1.34-2.76-1.34-4.52v-2.2a4.56 4.56 0 1 0-9.12 0v2.2c0 1.76-.42 3.24-1.34 4.52Z"/>
        <path d="M9.8 19.3a2.35 2.35 0 0 0 4.4 0M12 4.9V3.2M4.1 9.8H2.6M21.4 9.8h-1.5"/>
      </svg>
    </span>
    <span class="bell-copy"><b>按车铃</b><small>RING RING</small></span>
  </button>

  <div class="speed-box">
    <div class="speed-head"><label for="speedRange">巡航速度</label><span id="speedText">轻快</span></div>
    <input class="speed-range" id="speedRange" type="range" min="0" max="100" value="58" step="1" aria-label="调节巡航速度">
    <div class="speed-scale"><span>漫步</span><span>飞驰</span></div>
  </div>

  <button class="action-btn sprint" id="sprintBtn" type="button" title="冲刺（空格）" aria-label="冲刺" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13.2 2-7 11h5.1L9.8 22l7.8-12h-5.3L13.2 2Z"/></svg>
    <span>冲刺</span>
  </button>

<noscript><div class="noscript">这个海边小剧场需要启用 JavaScript 才能开演。</div></noscript>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d", { alpha: false });
  const kmhEl = document.getElementById("kmh");
  const staminaValEl = document.getElementById("staminaVal");
  const staminaFillEl = document.getElementById("staminaFill");
  const speedRange = document.getElementById("speedRange");
  const speedText = document.getElementById("speedText");
  const bellBtn = document.getElementById("bellBtn");
  const sprintBtn = document.getElementById("sprintBtn");
  const feedBtn = document.getElementById("feedBtn");
  const terrainBtn = document.getElementById("terrainBtn");
  const terrainLabel = document.getElementById("terrainLabel");
  const themeBtn = document.getElementById("themeBtn");
  const themeIcon = document.getElementById("themeIcon");
  const themeLabel = document.getElementById("themeLabel");
  const toastEl = document.getElementById("toast");

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  function rgba(c, a) {
    const alpha = a === undefined ? 1 : a;
    return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + alpha + ")";
  }
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mixRgb(a, b, t) {
    return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  }
  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  const THEME_DATA = {
    day: {
      sky0: "#8fd8e7", sky1: "#d9eff0", sky2: "#ffe4bf",
      sea0: "#58b4bf", sea1: "#267f92", foam: "#f8fbf3",
      sun: "#fff2bf", cloud: "#fffbf2", haze: "#ffd7ad",
      farIsland: "#7ea9a2", nearIsland: "#5b8d86",
      dune: "#ddc28d", duneShade: "#bd9b68",
      wood: "#b77f53", woodShade: "#8f5e3e", woodLight: "#d3a071", woodLine: "#754a32",
      grass: "#6e9767", grassDark: "#4f7651", ink: "#254040", cream: "#fff7e6", coral: "#e96b4b"
    },
    dusk: {
      sky0: "#4d5594", sky1: "#b9788f", sky2: "#ffc07c",
      sea0: "#5f7897", sea1: "#3d5574", foam: "#ffe1c8",
      sun: "#ffd9a0", cloud: "#efbdb0", haze: "#ee9b78",
      farIsland: "#666083", nearIsland: "#4d4e70",
      dune: "#ab806c", duneShade: "#8e655b",
      wood: "#8b5f52", woodShade: "#69463d", woodLight: "#a87a65", woodLine: "#553832",
      grass: "#707167", grassDark: "#52534f", ink: "#2c2d3d", cream: "#fff0da", coral: "#f37d59"
    },
    night: {
      sky0: "#07182f", sky1: "#102c50", sky2: "#244c64",
      sea0: "#12324c", sea1: "#081f36", foam: "#9fbdcb",
      sun: "#f3e9c7", cloud: "#7e8ba5", haze: "#35556f",
      farIsland: "#183b4a", nearIsland: "#102f3e",
      dune: "#3a444f", duneShade: "#2e353e",
      wood: "#4d3d3b", woodShade: "#382d2c", woodLight: "#67504c", woodLine: "#2b2323",
      grass: "#46635b", grassDark: "#2f4945", ink: "#f0e8d7", cream: "#fff3dd", coral: "#ef7f5d"
    }
  };
  const THEME_RGB = {};
  Object.keys(THEME_DATA).forEach(function (name) {
    const src = THEME_DATA[name];
    const out = {};
    Object.keys(src).forEach(function (key) { out[key] = hexToRgb(src[key]); });
    THEME_RGB[name] = out;
  });
  const THEME_META = [
    { id: "day", label: "晴天", icon: "☀", toast: "晴天模式 · 海风刚刚好" },
    { id: "dusk", label: "黄昏", icon: "◒", toast: "黄昏模式 · 把海面染成橘子汽水" },
    { id: "night", label: "夜晚", icon: "☾", toast: "夜晚模式 · 车灯和月光一起亮起" }
  ];

  const BIRD = {
    light: "#fff9e9",
    body: "#f8e8c9",
    shade: "#ead1a8",
    deep: "#d8b984",
    line: "#a88455",
    orange: "#f0a24b",
    orangeDark: "#c97739",
    pouch: "#ffc78b",
    pouchShade: "#ee9562",
    leather: "#89563e",
    leatherLight: "#bd7f5d",
    frame: "#e96b4b",
    frameDark: "#a44230",
    frameLight: "#ff9f7c",
    tire: "#203b39",
    cream: "#fff5df"
  };

  const state = {
    t: 0,
    last: 0,
    speed: 0.52,
    cruise: 0.58,
    sprint: 0,
    rush: 0,
    stamina: 100,
    runPhase: 0,
    wingPhase: 0,
    wheelAngle: 0,
    crankAngle: 0,
    scroll: 0,
    theme: "day",
    themeIndex: 0,
    night: 0,
    terrain: "boardwalk",
    startle: 0,
    blink: 0,
    blinkTimer: 2.6,
    pouch: 0,
    pouchV: 0,
    shake: 0,
    stepIndex: 0,
    sweatTimer: 0,
    dustTimer: 0,
    featherTimer: 0,
    bubble: null,
    fish: null,
    rings: [],
    particles: [],
    hudTick: 0,
    lastKmh: -1,
    lastStamina: -1,
    lastSpeedWord: "",
    lastSprintActive: false,
    muted: false
  };

  let W = 0, H = 0, S = 1, originX = 0, groundY = 0, dpr = 1;
  let portrait = false;
  let stars = [];
  let clouds = [];
  let birds = [];
  let pal = {};
  Object.keys(THEME_RGB.day).forEach(function (key) { pal[key] = THEME_RGB.day[key].slice(); });

  function resize() {
    W = Math.max(320, window.innerWidth);
    H = Math.max(480, window.innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    portrait = H > W * 1.08;
    const shortLandscape = !portrait && H < 560;
    groundY = shortLandscape ? H * 0.76 : (portrait ? H * 0.715 : H * 0.80);
    S = Math.min(W / (portrait ? 700 : 940), H / (portrait ? 1010 : 790));
    S = Math.min(S, (W - 22) / 690);
    S = Math.min(S, (groundY - (shortLandscape ? 58 : 98)) / 520);
    S = Math.max(0.31, S);
    // The illustration spans about -308..382 in local units; nudge portrait
    // framing so both the tail and the pelican's bill stay on screen.
    originX = portrait ? W * 0.5 - 37 * S : W * 0.48;

    buildAmbience();
  }

  function buildAmbience() {
    const starCount = Math.round(clamp((W * H) / 11500, 48, 155));
    stars = [];
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.53,
        r: rand(0.45, 1.75),
        a: rand(0.28, 0.9),
        p: Math.random() * TAU,
        sp: rand(0.4, 1.7)
      });
    }
    clouds = [];
    for (let i = 0; i < 7; i++) {
      clouds.push({
        x: Math.random() * (W + 260) - 120,
        y: H * rand(0.075, 0.40),
        s: rand(0.58, 1.35),
        v: rand(3, 8),
        a: rand(0.35, 0.7)
      });
    }
    birds = [];
    const birdCount = W > 720 ? 4 : 2;
    for (let i = 0; i < birdCount; i++) {
      birds.push({
        x: Math.random() * W,
        y: H * rand(0.13, 0.36),
        s: rand(0.65, 1.15),
        v: rand(4, 10),
        p: Math.random() * TAU
      });
    }
  }

  function getBikePose(bodyBob) {
    const gait = Math.sin(state.runPhase * 2 + 0.65);
    const bump = state.terrain === "pebbles" ? Math.sin(state.t * 27) * (0.9 + state.speed * 2.4) : 0;
    const bob = bodyBob * 0.86 + gait * (0.8 + state.speed * 2.7) + bump;
    const tilt = -0.035 - state.speed * 0.027 + Math.sin(state.runPhase * 2) * 0.008 + (state.sprint > 0 ? 0.018 : 0);
    return { bob: bob, tilt: tilt };
  }

  function bikePoint(x, y, pose) {
    const c = Math.cos(pose.tilt);
    const s = Math.sin(pose.tilt);
    const dy = y + 350;
    return {
      x: x * c - dy * s,
      y: pose.bob - 350 + x * s + dy * c
    };
  }

  /* ----------------------------- palette ----------------------------- */

  function updatePalette(dt) {
    const target = THEME_RGB[state.theme];
    const k = 1 - Math.exp(-dt * 2.7);
    Object.keys(target).forEach(function (key) {
      const a = pal[key];
      const b = target[key];
      a[0] = lerp(a[0], b[0], k);
      a[1] = lerp(a[1], b[1], k);
      a[2] = lerp(a[2], b[2], k);
    });
    const targetNight = state.theme === "night" ? 1 : (state.theme === "dusk" ? 0.38 : 0);
    state.night = lerp(state.night, targetNight, 1 - Math.exp(-dt * 2.6));
  }

  /* ------------------------------ audio ------------------------------ */

  let audioCtx = null;

  function getAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") {
        const p = audioCtx.resume();
        if (p && p.catch) p.catch(function () {});
      }
      return audioCtx;
    }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      audioCtx = new Ctor();
    } catch (err) {
      audioCtx = null;
    }
    return audioCtx;
  }

  function playBellSound() {
    const a = getAudio();
    if (!a) return;
    const now = a.currentTime + 0.015;
    [0, 0.155].forEach(function (delay, hit) {
      [1760, 2640, 3520].forEach(function (freq, index) {
        const o = a.createOscillator();
        const g = a.createGain();
        o.type = index === 0 ? "sine" : "triangle";
        o.frequency.setValueAtTime(freq, now + delay);
        o.frequency.exponentialRampToValueAtTime(freq * 0.986, now + delay + 1.15);
        g.gain.setValueAtTime(0.0001, now + delay);
        g.gain.exponentialRampToValueAtTime((hit ? 0.027 : 0.042) / (index + 1), now + delay + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, now + delay + 1.0 + index * 0.09);
        o.connect(g);
        g.connect(a.destination);
        o.start(now + delay);
        o.stop(now + delay + 1.3);
      });
    });
    const thunk = a.createOscillator();
    const tg = a.createGain();
    thunk.type = "triangle";
    thunk.frequency.setValueAtTime(330, now);
    thunk.frequency.exponentialRampToValueAtTime(185, now + 0.08);
    tg.gain.setValueAtTime(0.035, now);
    tg.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    thunk.connect(tg);
    tg.connect(a.destination);
    thunk.start(now);
    thunk.stop(now + 0.12);
  }

  function playSquawk() {
    const a = getAudio();
    if (!a) return;
    const now = a.currentTime + 0.03;
    const o = a.createOscillator();
    const f = a.createBiquadFilter();
    const g = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(490, now);
    o.frequency.exponentialRampToValueAtTime(720, now + 0.1);
    o.frequency.exponentialRampToValueAtTime(390, now + 0.27);
    f.type = "bandpass";
    f.frequency.value = 920;
    f.Q.value = 1.3;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.022, now + 0.018);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    o.connect(f);
    f.connect(g);
    g.connect(a.destination);
    o.start(now);
    o.stop(now + 0.32);
  }

  function playChomp() {
    const a = getAudio();
    if (!a) return;
    const len = Math.floor(a.sampleRate * 0.17);
    const buffer = a.createBuffer(1, len, a.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const env = 1 - i / len;
      data[i] = (Math.random() * 2 - 1) * env * env;
    }
    const src = a.createBufferSource();
    const filter = a.createBiquadFilter();
    const gain = a.createGain();
    src.buffer = buffer;
    filter.type = "bandpass";
    filter.frequency.value = 680;
    filter.Q.value = 0.9;
    gain.gain.value = 0.16;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(a.destination);
    src.start();
  }

  function playWhoosh() {
    const a = getAudio();
    if (!a) return;
    const len = Math.floor(a.sampleRate * 0.24);
    const buffer = a.createBuffer(1, len, a.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    }
    const src = a.createBufferSource();
    const filter = a.createBiquadFilter();
    const gain = a.createGain();
    src.buffer = buffer;
    filter.type = "highpass";
    filter.frequency.value = 620;
    gain.gain.setValueAtTime(0.0001, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.035, a.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.22);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(a.destination);
    src.start();
  }

  /* ----------------------------- particles ----------------------------- */

  function addParticle(p) {
    state.particles.push(p);
    if (state.particles.length > 180) state.particles.shift();
  }

  function spawnDust(x, y, count, heavy) {
    const n = count || 5;
    for (let i = 0; i < n; i++) {
      addParticle({
        type: heavy ? "pebble" : "dust",
        x: x + rand(-10, 12),
        y: y + rand(-4, 2),
        vx: rand(-56, -18) - state.speed * 35,
        vy: rand(-48, -10),
        g: heavy ? 240 : 38,
        size: heavy ? rand(1.8, 4.4) : rand(3, 9.5),
        life: rand(0.42, 0.92),
        max: 0.92,
        rot: rand(0, TAU),
        vr: rand(-6, 6),
        color: heavy ? "#9b7a56" : "#e6d2ac"
      });
    }
  }

  function spawnSweat(count) {
    for (let i = 0; i < (count || 1); i++) {
      addParticle({
        type: "sweat",
        x: rand(145, 220),
        y: rand(-380, -320),
        vx: rand(-55, 15),
        vy: rand(-50, 8),
        g: 270,
        size: rand(2.2, 4.4),
        life: rand(0.55, 1.05),
        max: 1.05,
        rot: 0,
        vr: 0,
        color: "#8acad4"
      });
    }
  }

  function spawnFeathers(count) {
    for (let i = 0; i < (count || 1); i++) {
      addParticle({
        type: "feather",
        x: rand(-85, 70),
        y: rand(-245, -175),
        vx: rand(-80, -20),
        vy: rand(-60, -5),
        g: 28,
        size: rand(4, 8),
        life: rand(0.9, 1.7),
        max: 1.7,
        rot: rand(-0.8, 0.8),
        vr: rand(-2.2, 2.2),
        color: "#fff6df"
      });
    }
  }

  function spawnHearts(count) {
    for (let i = 0; i < (count || 1); i++) {
      addParticle({
        type: "heart",
        x: rand(235, 320),
        y: rand(-330, -250),
        vx: rand(-24, 24),
        vy: rand(-58, -24),
        g: -12,
        size: rand(5, 9),
        life: rand(0.7, 1.25),
        max: 1.25,
        rot: rand(-0.25, 0.25),
        vr: rand(-1.4, 1.4),
        color: "#e96b4b"
      });
    }
  }

  function spawnSparkles(count, x, y) {
    for (let i = 0; i < (count || 1); i++) {
      addParticle({
        type: "spark",
        x: (x || 0) + rand(-16, 20),
        y: (y || -470) + rand(-16, 16),
        vx: rand(-55, 55),
        vy: rand(-70, -15),
        g: 30,
        size: rand(2, 5),
        life: rand(0.35, 0.75),
        max: 0.75,
        rot: rand(0, TAU),
        vr: rand(-7, 7),
        color: "#f6cc69"
      });
    }
  }

  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.rot += p.vr * dt;
      if (p.type === "feather") p.vx += Math.sin(state.t * 5 + p.y * 0.03) * 9 * dt;
      if (p.y > 35) {
        state.particles.splice(i, 1);
      }
    }
  }

  /* ------------------------------ actions ------------------------------ */

  let toastTimer = null;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 1900);
  }

  function setBubble(text, x, y, life) {
    state.bubble = { text: text, x: x, y: y, life: life || 1.2, max: life || 1.2 };
  }

  let bellClassTimer = null;
  function ringBell() {
    const a = getAudio();
    playBellSound();
    if (a) playSquawk();
    state.startle = 1;
    state.rush = Math.max(state.rush, 1.35);
    state.pouchV += 62;
    state.shake = Math.max(state.shake, 1.15);
    state.rings.push({ age: 0 });
    spawnSparkles(7, 74, -482);
    spawnFeathers(4);
    setBubble("叮铃——！", -181, -482, 1.25);
    showToast("车铃一响，鹈鹕受惊加速！");
    bellBtn.classList.remove("ringing");
    void bellBtn.offsetWidth;
    bellBtn.classList.add("ringing");
    if (bellClassTimer) clearTimeout(bellClassTimer);
    bellClassTimer = setTimeout(function () { bellBtn.classList.remove("ringing"); }, 560);
  }

  function triggerSprint() {
    getAudio();
    if (state.stamina < 10) {
      state.startle = Math.max(state.startle, 0.35);
      setBubble("呼……没劲了", 238, -420, 1.2);
      showToast("体力见底，先投喂一条小鱼吧");
      return;
    }
    if (state.sprint <= 0.2) playWhoosh();
    state.sprint = Math.max(state.sprint, 2.4);
    state.pouchV -= 20;
    state.shake = Math.max(state.shake, 0.6);
    spawnDust(48, -2, 8, state.terrain === "pebbles");
    spawnSparkles(4, 80, -470);
    setBubble("驾——！", 235, -444, 0.95);
    showToast("冲刺中 · 鹈鹕体力正在消耗");
  }

  function feedFish() {
    getAudio();
    if (state.fish) {
      showToast("它还在嚼上一条小鱼呢");
      return;
    }
    state.fish = {
      age: 0,
      dur: 1.02,
      sx: -360,
      sy: -50,
      cx: 40,
      cy: -445,
      ex: 306,
      ey: -274
    };
    feedBtn.classList.add("is-active");
    setBubble("小鱼来啦！", -176, -300, 0.9);
    showToast("一条小鱼正飞向鹈鹕的大喉囊");
  }

  function completeFish() {
    state.fish = null;
    state.stamina = Math.min(100, state.stamina + 30);
    state.pouchV += 48;
    state.startle = Math.max(state.startle, 0.22);
    spawnHearts(7);
    setBubble("吧唧！", 315, -365, 1.15);
    playChomp();
    feedBtn.classList.remove("is-active");
    showToast("小鱼下肚 · 鹈鹕体力 +30");
  }

  function cycleTheme() {
    getAudio();
    state.themeIndex = (state.themeIndex + 1) % THEME_META.length;
    const meta = THEME_META[state.themeIndex];
    state.theme = meta.id;
    themeIcon.textContent = meta.icon;
    themeLabel.textContent = meta.label;
    document.body.dataset.theme = meta.id;
    showToast(meta.toast);
  }

  function toggleTerrain() {
    getAudio();
    if (state.terrain === "boardwalk") {
      state.terrain = "pebbles";
      terrainLabel.textContent = "石子路";
      state.shake = 1.2;
      spawnDust(30, -3, 13, true);
      setBubble("颠颠颠！", -195, -315, 1.0);
      showToast("切换石子路 · 车轮开始蹦蹦跳跳");
    } else {
      state.terrain = "boardwalk";
      terrainLabel.textContent = "木栈道";
      state.shake = 0.45;
      showToast("回到木栈道 · 咕噜咕噜向前冲");
    }
  }

  function setSpeedLabel(value) {
    let word = "停步";
    if (value >= 12 && value < 38) word = "漫步";
    else if (value >= 38 && value < 66) word = "轻快";
    else if (value >= 66 && value < 87) word = "疾驰";
    else if (value >= 87) word = "极限";
    if (word !== state.lastSpeedWord) {
      state.lastSpeedWord = word;
      speedText.textContent = word;
    }
    state.cruise = value / 100;
    speedRange.style.setProperty("--pct", value + "%");
  }

  /* ------------------------------- update ------------------------------- */

  function update(dt) {
    state.t += dt;
    state.startle = Math.max(0, state.startle - dt * 1.35);
    state.rush = Math.max(0, state.rush - dt);
    state.sprint = Math.max(0, state.sprint - dt);
    state.shake = Math.max(0, state.shake - dt * 3.8);
    state.blinkTimer -= dt;
    if (state.blinkTimer <= 0) {
      state.blink = 1;
      state.blinkTimer = rand(2.4, 4.6);
    }
    state.blink = Math.max(0, state.blink - dt * 7.5);

    let target = state.cruise;
    if (state.sprint > 0 && state.stamina > 0.5) target += 0.33;
    if (state.rush > 0) target += 0.16 * Math.min(1, state.rush / 0.55);
    if (state.stamina < 20) target *= 0.68;
    target = clamp(target, 0, 1.22);
    const follow = 1 - Math.exp(-dt * (1.8 + state.speed * 1.4));
    state.speed += (target - state.speed) * follow;
    if (state.speed < 0.002) state.speed = 0;
    state.scroll += state.speed * 268 * dt;

    const drain = Math.max(0, state.speed - 0.64) * 19 + (state.sprint > 0 ? 14 : 0);
    const regen = state.speed < 0.45 ? 4.8 : 1.4;
    state.stamina = clamp(state.stamina - drain * dt + regen * dt, 0, 100);
    if (state.stamina <= 0.2 && state.sprint > 0) {
      state.sprint = 0;
      state.startle = Math.max(state.startle, 0.4);
      setBubble("呼……呼……", 242, -420, 1.3);
    }

    const pace = 2.2 + state.speed * 14.5;
    state.runPhase += dt * pace;
    state.wingPhase += dt * (1.6 + state.speed * 8.2 + (state.sprint > 0 ? 2.4 : 0));
    state.wheelAngle += dt * state.speed * 8.8;
    state.crankAngle = state.wheelAngle * 0.92;

    const step = Math.floor(state.runPhase / Math.PI);
    if (step !== state.stepIndex) {
      state.stepIndex = step;
      if (state.speed > 0.12) {
        const side = step % 2 === 0 ? -30 : 52;
        spawnDust(side, -2, state.terrain === "pebbles" ? 3 : 2, state.terrain === "pebbles");
        state.pouchV += (state.speed * 9 + 3) * (step % 2 === 0 ? 1 : -1);
        if (state.terrain === "pebbles") state.shake = Math.max(state.shake, 0.25);
      }
    }

    state.pouchV += (-state.pouch * 95 - state.pouchV * 10) * dt;
    state.pouch += state.pouchV * dt;
    state.pouch = clamp(state.pouch, -9, 11);

    state.sweatTimer -= dt;
    if (state.sweatTimer <= 0 && (state.stamina < 52 || state.speed > 0.88)) {
      spawnSweat(state.stamina < 28 ? 2 : 1);
      state.sweatTimer = rand(0.24, 0.52);
    }
    state.dustTimer -= dt;
    if (state.dustTimer <= 0 && state.speed > 0.1) {
      spawnDust(rand(-36, 66), -3, state.terrain === "pebbles" ? 2 : 1, state.terrain === "pebbles");
      state.dustTimer = rand(0.16, 0.3) / (0.5 + state.speed);
    }
    state.featherTimer -= dt;
    if (state.featherTimer <= 0 && (state.sprint > 0 || state.startle > 0.5)) {
      spawnFeathers(1);
      state.featherTimer = rand(0.24, 0.52);
    }

    if (state.fish) {
      state.fish.age += dt;
      if (state.fish.age >= state.fish.dur) completeFish();
    }

    state.rings.forEach(function (r) { r.age += dt; });
    state.rings = state.rings.filter(function (r) { return r.age < 0.95; });

    if (state.bubble) {
      state.bubble.life -= dt;
      if (state.bubble.life <= 0) state.bubble = null;
    }

    updateParticles(dt);
    updateAmbient(dt);
    updatePalette(dt);

    const sprintActive = state.sprint > 0;
    if (sprintActive !== state.lastSprintActive) {
      state.lastSprintActive = sprintActive;
      sprintBtn.classList.toggle("is-active", sprintActive);
      sprintBtn.setAttribute("aria-pressed", sprintActive ? "true" : "false");
    }

    state.hudTick -= dt;
    if (state.hudTick <= 0) {
      state.hudTick = 0.08;
      updateHud();
    }
  }

  function updateAmbient(dt) {
    const wind = 2 + state.speed * 28;
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      c.x -= (c.v + wind * 0.24) * c.s * dt;
      if (c.x < -180 * c.s) {
        c.x = W + 170 * c.s;
        c.y = H * rand(0.075, 0.4);
      }
    }
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      b.x -= (b.v + wind * 0.5) * dt;
      if (b.x < -80) {
        b.x = W + 60;
        b.y = H * rand(0.12, 0.35);
      }
    }
  }

  function updateHud() {
    const kmh = Math.round(8 + state.speed * 54);
    if (kmh !== state.lastKmh) {
      state.lastKmh = kmh;
      kmhEl.textContent = String(kmh);
    }
    const stamina = Math.round(state.stamina);
    if (stamina !== state.lastStamina) {
      state.lastStamina = stamina;
      staminaValEl.textContent = stamina + "%";
      staminaFillEl.style.width = stamina + "%";
      staminaFillEl.classList.toggle("low", stamina < 30);
    }
  }

  /* --------------------------- background art --------------------------- */

  function drawBackground() {
    const horizon = H * (portrait ? 0.49 : 0.555);
    const sky = ctx.createLinearGradient(0, 0, 0, groundY + 40);
    sky.addColorStop(0, rgba(pal.sky0));
    sky.addColorStop(0.56, rgba(pal.sky1));
    sky.addColorStop(1, rgba(pal.sky2));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, groundY + 40);

    drawStars(horizon);
    drawCelestial(horizon);
    drawClouds();
    drawBirds();
    drawHaze(horizon);
    drawHeadlands(horizon);
    drawSea(horizon);
    drawDeck();
  }

  function drawStars(horizon) {
    if (state.night < 0.02) return;
    const alpha = clamp((state.night - 0.05) / 0.9, 0, 1);
    ctx.save();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.55 + 0.45 * Math.sin(state.t * s.sp + s.p);
      ctx.globalAlpha = alpha * s.a * tw;
      ctx.fillStyle = i % 9 === 0 ? rgba(THEME_RGB.night.sun) : "#e9f1ef";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = alpha * 0.22;
    ctx.strokeStyle = "#eaf2f2";
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(W * 0.14, H * 0.1);
    ctx.lineTo(W * 0.18, H * 0.1);
    ctx.moveTo(W * 0.68, H * 0.07);
    ctx.lineTo(W * 0.72, H * 0.07);
    ctx.stroke();
    ctx.restore();
  }

  function drawCelestial(horizon) {
    const sunAlpha = clamp(1 - state.night * 1.35, 0, 1);
    const moonAlpha = clamp((state.night - 0.56) / 0.4, 0, 1);
    const size = clamp(Math.min(W, H) * 0.055, 26, 64);
    const sunX = W * 0.775;
    const sunY = H * (0.15 + state.night * 0.045);

    if (sunAlpha > 0.01) {
      const glow = ctx.createRadialGradient(sunX, sunY, size * 0.2, sunX, sunY, size * 4.3);
      glow.addColorStop(0, rgba(pal.sun, 0.55 * sunAlpha));
      glow.addColorStop(0.42, rgba(pal.sun, 0.16 * sunAlpha));
      glow.addColorStop(1, rgba(pal.sun, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(sunX - size * 4.4, sunY - size * 4.4, size * 8.8, size * 8.8);
      ctx.save();
      ctx.globalAlpha = sunAlpha;
      ctx.fillStyle = rgba(pal.sun, 0.92);
      ctx.beginPath();
      ctx.arc(sunX, sunY, size, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = sunAlpha * 0.42;
      ctx.strokeStyle = rgba(pal.sun, 0.85);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sunX, sunY, size * 1.34, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    if (moonAlpha > 0.01) {
      const mx = W * 0.815;
      const my = H * 0.15;
      const mr = size * 0.72;
      const glow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4.4);
      glow.addColorStop(0, "rgba(235,238,210," + (0.28 * moonAlpha) + ")");
      glow.addColorStop(0.45, "rgba(205,224,220," + (0.08 * moonAlpha) + ")");
      glow.addColorStop(1, "rgba(205,224,220,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(mx - mr * 4.4, my - mr * 4.4, mr * 8.8, mr * 8.8);
      ctx.save();
      ctx.globalAlpha = moonAlpha;
      ctx.fillStyle = "#f4eccd";
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, TAU);
      ctx.fill();
      ctx.fillStyle = "rgba(190,191,166,.25)";
      ctx.beginPath();
      ctx.arc(mx - mr * 0.27, my - mr * 0.2, mr * 0.17, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(mx + mr * 0.28, my + mr * 0.16, mr * 0.23, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(mx + mr * 0.06, my - mr * 0.36, mr * 0.1, 0, TAU);
      ctx.fill();
      ctx.restore();
    }

    if (state.night > 0.08) {
      const reflAlpha = clamp(state.night, 0, 1) * 0.14;
      ctx.save();
      ctx.fillStyle = rgba(pal.sun, reflAlpha);
      for (let i = 0; i < 9; i++) {
        const yy = horizon + 8 + i * ((groundY - horizon) * 0.075);
        const ww = (32 - i * 2.2) + Math.sin(state.t * 1.3 + i) * 3;
        ctx.fillRect(sunX - ww / 2, yy, Math.max(3, ww), 1.3);
      }
      ctx.restore();
    }
  }

  function drawClouds() {
    const cloudAlpha = 0.5 + (1 - state.night) * 0.22;
    ctx.save();
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const px = c.x;
      const py = c.y;
      const s = c.s;
      ctx.save();
      ctx.translate(px, py);
      ctx.scale(s, s);
      ctx.globalAlpha = c.a * cloudAlpha;
      ctx.fillStyle = rgba(pal.cloud);
      ctx.beginPath();
      ctx.ellipse(-42, 7, 49, 20, 0, 0, TAU);
      ctx.ellipse(2, 0, 59, 29, 0, 0, TAU);
      ctx.ellipse(48, 9, 43, 17, 0, 0, TAU);
      ctx.ellipse(-2, 14, 84, 17, 0, 0, TAU);
      ctx.fill();
      ctx.globalAlpha *= 0.34;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(-18, -9, 35, 13, -0.12, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawBirds() {
    ctx.save();
    ctx.strokeStyle = rgba(pal.ink, 0.36);
    ctx.lineWidth = 1.2;
    ctx.lineCap = "round";
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      const flap = Math.sin(state.t * 2.1 + b.p) * 2.2;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(b.s, b.s);
      ctx.beginPath();
      ctx.moveTo(-9, 0);
      ctx.quadraticCurveTo(-4, -4.5 + flap, 0, 0);
      ctx.quadraticCurveTo(4, -4.5 + flap, 9, 0);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawHaze(horizon) {
    const hz = ctx.createLinearGradient(0, horizon - 56, 0, horizon + 24);
    hz.addColorStop(0, rgba(pal.haze, 0));
    hz.addColorStop(0.58, rgba(pal.haze, 0.24));
    hz.addColorStop(1, rgba(pal.haze, 0));
    ctx.fillStyle = hz;
    ctx.fillRect(0, horizon - 56, W, 82);
  }

  function drawHeadlands(horizon) {
    const slow = state.scroll * 0.018;
    ctx.save();
    ctx.globalAlpha = 0.84;
    ctx.fillStyle = rgba(pal.farIsland, 0.65);
    ctx.beginPath();
    ctx.moveTo(-40, horizon + 4);
    ctx.bezierCurveTo(W * 0.03, horizon - H * 0.06, W * 0.12, horizon - H * 0.07, W * 0.18, horizon + 2);
    ctx.bezierCurveTo(W * 0.23, horizon + 8, W * 0.29, horizon + 2, W * 0.33, horizon + 5);
    ctx.lineTo(W * 0.33, horizon + 20);
    ctx.lineTo(-40, horizon + 20);
    ctx.closePath();
    ctx.fill();

    const rx = W * 0.88 - slow * 0.36;
    ctx.fillStyle = rgba(pal.nearIsland, 0.58);
    ctx.beginPath();
    ctx.moveTo(rx - W * 0.12, horizon + 5);
    ctx.bezierCurveTo(rx - W * 0.06, horizon - H * 0.045, rx + W * 0.02, horizon - H * 0.03, rx + W * 0.08, horizon + 5);
    ctx.lineTo(rx + W * 0.1, horizon + 20);
    ctx.lineTo(rx - W * 0.14, horizon + 20);
    ctx.closePath();
    ctx.fill();

    const lx = W * 0.125 - slow * 0.2;
    const ly = horizon - H * 0.055;
    const lh = clamp(H * 0.057, 24, 58);
    const lw = Math.max(6, lh * 0.19);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "rgba(244,235,212,.82)";
    ctx.beginPath();
    ctx.moveTo(lx - lw * 0.72, ly + lh);
    ctx.lineTo(lx - lw * 0.34, ly + lh * 0.15);
    ctx.lineTo(lx + lw * 0.34, ly + lh * 0.15);
    ctx.lineTo(lx + lw * 0.72, ly + lh);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(226,107,76,.9)";
    ctx.fillRect(lx - lw * 0.48, ly + lh * 0.34, lw * 0.96, lh * 0.13);
    ctx.fillStyle = "rgba(50,69,67,.8)";
    ctx.fillRect(lx - lw * 0.5, ly + lh * 0.11, lw, lh * 0.11);
    ctx.fillStyle = "rgba(255,219,137,.9)";
    ctx.fillRect(lx - lw * 0.2, ly + lh * 0.035, lw * 0.4, lh * 0.08);
    if (state.night > 0.35) {
      const beam = ctx.createLinearGradient(lx, ly, lx + W * 0.18, ly - H * 0.05);
      beam.addColorStop(0, "rgba(255,231,164,.17)");
      beam.addColorStop(1, "rgba(255,231,164,0)");
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(lx + lw * 0.2, ly + lh * 0.06);
      ctx.lineTo(lx + W * 0.28, ly - H * 0.08);
      ctx.lineTo(lx + W * 0.27, ly + H * 0.03);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = "#fff8e5";
    ctx.beginPath();
    ctx.ellipse(W * 0.26, horizon + 3, W * 0.18, 4, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawSea(horizon) {
    const sea = ctx.createLinearGradient(0, horizon, 0, groundY + 16);
    sea.addColorStop(0, rgba(pal.sea0));
    sea.addColorStop(0.56, rgba(mixRgb(pal.sea0, pal.sea1, 0.65)));
    sea.addColorStop(1, rgba(pal.sea1));
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizon, W, groundY - horizon + 24);

    ctx.save();
    const rows = portrait ? 19 : 26;
    for (let i = 0; i < rows; i++) {
      const t = i / rows;
      const y = horizon + 9 + t * (groundY - horizon);
      const drift = state.scroll * (0.075 + t * 0.14) + i * 39;
      const alpha = 0.13 + (1 - t) * 0.16;
      ctx.strokeStyle = rgba(pal.foam, alpha);
      ctx.lineWidth = 1.1 + t * 0.9;
      ctx.beginPath();
      for (let x = -50; x <= W + 50; x += 44) {
        const wave = Math.sin((x + drift) * 0.023 + i * 0.94) * (1.2 + t * 2.2);
        const xx = x;
        const yy = y + wave;
        if (x === -50) ctx.moveTo(xx, yy);
        else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

    ctx.globalAlpha = 0.44;
    for (let i = 0; i < 24; i++) {
      const t = (i * 0.37) % 1;
      const x = ((i * 173 - state.scroll * (0.12 + t * 0.3)) % (W + 120) + W + 120) % (W + 120) - 60;
      const y = horizon + 16 + t * (groundY - horizon - 28);
      const len = 5 + (i % 5) * 3;
      ctx.fillStyle = rgba(pal.foam, 0.28);
      ctx.fillRect(x, y, len, 1.2);
    }
    ctx.restore();

    const boatPalette = state.night > 0.5 ? "rgba(196,211,209,.48)" : "rgba(255,249,231,.82)";
    const boatOne = ((W * 0.30 - state.scroll * 0.04) % (W + 240) + W + 240) % (W + 240) - 120;
    const boatTwo = ((W * 0.82 - state.scroll * 0.025) % (W + 300) + W + 300) % (W + 300) - 150;
    drawSailboat(boatOne, horizon + 47, 0.72, boatPalette, 0.9);
    drawSailboat(boatTwo, horizon + 28, 0.46, boatPalette, 0.55);

    const fx = W * 0.775;
    const refl = clamp(1 - state.night * 0.9, 0.1, 1);
    ctx.save();
    ctx.globalAlpha = 0.14 * refl;
    ctx.fillStyle = rgba(pal.sun);
    for (let i = 0; i < 10; i++) {
      const t = i / 10;
      const y = horizon + 10 + t * (groundY - horizon - 16);
      const width = (44 - t * 28) + Math.sin(state.t * 1.4 + i * 1.3) * 5;
      ctx.fillRect(fx - width / 2, y, width, 1.4);
    }
    ctx.restore();

    const foam = ctx.createLinearGradient(0, groundY - 12, 0, groundY + 4);
    foam.addColorStop(0, rgba(pal.foam, 0));
    foam.addColorStop(0.7, rgba(pal.foam, 0.15));
    foam.addColorStop(1, rgba(pal.foam, 0));
    ctx.fillStyle = foam;
    ctx.fillRect(0, groundY - 12, W, 18);
  }

  function drawSailboat(x, y, scale, color, alpha) {
    const bob = Math.sin(state.t * 1.15 + x * 0.01) * 1.8;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-16, 0);
    ctx.quadraticCurveTo(0, 7, 17, 0);
    ctx.lineTo(11, 6);
    ctx.lineTo(-8, 6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.lineTo(0, -34);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(1, -31);
    ctx.lineTo(20, -7);
    ctx.lineTo(1, -7);
    ctx.closePath();
    ctx.globalAlpha = alpha * 0.8;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -24);
    ctx.lineTo(-13, -8);
    ctx.lineTo(-2, -8);
    ctx.closePath();
    ctx.globalAlpha = alpha * 0.52;
    ctx.fill();
    ctx.restore();
  }

  function drawDeck() {
    const deckTop = groundY;
    const isPebbles = state.terrain === "pebbles";
    const baseColor = isPebbles ? mixRgb(pal.wood, pal.dune, 0.78) : pal.wood;
    const deepColor = isPebbles ? mixRgb(pal.woodShade, pal.duneShade, 0.76) : pal.woodShade;
    const deck = ctx.createLinearGradient(0, deckTop, 0, H);
    deck.addColorStop(0, rgba(baseColor));
    deck.addColorStop(0.45, rgba(mixRgb(baseColor, deepColor, 0.3)));
    deck.addColorStop(1, rgba(deepColor));
    ctx.fillStyle = deck;
    ctx.fillRect(0, deckTop - 1, W, H - deckTop + 2);

    ctx.fillStyle = rgba(pal.woodLight, 0.7);
    ctx.fillRect(0, deckTop - 1, W, Math.max(2, 3 * S));
    ctx.fillStyle = rgba(pal.woodLine, 0.35);
    ctx.fillRect(0, deckTop + Math.max(2, 3 * S), W, 1.2);

    const boardH = Math.max(26, 34 * S);
    ctx.save();
    for (let y = deckTop + boardH, row = 0; y < H; y += boardH, row++) {
      if (row % 2 === 0) {
        ctx.fillStyle = rgba(pal.woodShade, isPebbles ? 0.04 : 0.075);
        ctx.fillRect(0, y, W, boardH);
      }
    }
    ctx.restore();

    const gap = Math.max(48, 82 * S);
    const offset = ((state.scroll * 0.94) % gap + gap) % gap;
    ctx.save();
    ctx.strokeStyle = rgba(pal.woodLine, isPebbles ? 0.13 : 0.36);
    ctx.lineWidth = 1.25;
    for (let x = -gap * 2; x < W + gap * 2; x += gap) {
      const sx = x - offset;
      ctx.beginPath();
      ctx.moveTo(sx, deckTop + 2);
      ctx.lineTo(sx - 28 * S, H);
      ctx.stroke();
    }
    ctx.strokeStyle = rgba(pal.woodLine, isPebbles ? 0.1 : 0.2);
    for (let y = deckTop + boardH; y < H; y += boardH) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.fillStyle = rgba(pal.woodLight, isPebbles ? 0.15 : 0.28);
    for (let x = -gap * 2; x < W + gap * 2; x += gap) {
      const sx = x - offset;
      for (let y = deckTop + boardH * 0.5; y < H; y += boardH) {
        const nailX = sx - ((y - deckTop) / Math.max(1, H - deckTop)) * 28 * S;
        ctx.beginPath();
        ctx.arc(nailX + 5, y, 1.1, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = isPebbles ? 0.5 : 0.34;
    for (let i = 0; i < 64; i++) {
      const xx = ((i * 157.3 - state.scroll * (0.7 + (i % 4) * 0.06)) % (W + 120) + W + 120) % (W + 120) - 60;
      const yy = deckTop + 16 + ((i * 71.7) % Math.max(40, H - deckTop - 28));
      const len = 7 + (i % 5) * 4;
      ctx.strokeStyle = rgba(pal.woodLine, 0.16 + (i % 3) * 0.035);
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(xx, yy);
      ctx.quadraticCurveTo(xx + len * 0.5, yy - 1.2, xx + len, yy);
      ctx.stroke();
    }
    ctx.restore();

    if (isPebbles) {
      ctx.save();
      for (let i = 0; i < 150; i++) {
        const xx = ((i * 191.7 - state.scroll * (1.0 + (i % 3) * 0.1)) % (W + 140) + W + 140) % (W + 140) - 70;
        const yy = deckTop + 15 + ((i * 61.3) % Math.max(50, H - deckTop - 30));
        const r = 1.5 + (i % 7) * 1.05;
        ctx.fillStyle = i % 4 === 0 ? rgba(pal.woodLight, 0.65) : (i % 3 === 0 ? rgba(pal.duneShade, 0.72) : rgba(pal.woodShade, 0.48));
        ctx.strokeStyle = "rgba(69,52,35,.16)";
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.ellipse(xx, yy, r * 1.55, r, -0.25 + (i % 3) * 0.13, 0, TAU);
        ctx.fill();
        ctx.stroke();
        if (i % 8 === 0) {
          ctx.strokeStyle = "rgba(255,246,222,.24)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(xx, yy, r * 1.9, Math.PI * 1.08, Math.PI * 1.76);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    ctx.save();
    const edge = ctx.createLinearGradient(0, deckTop + 6, 0, deckTop + 36);
    edge.addColorStop(0, "rgba(40,43,34,.10)");
    edge.addColorStop(1, "rgba(40,43,34,0)");
    ctx.fillStyle = edge;
    ctx.fillRect(0, deckTop + 4, W, 34);
    ctx.restore();
  }

  function drawGrassCluster(x, base, scale, phase) {
    ctx.save();
    ctx.translate(x, base);
    ctx.scale(scale, scale);
    const sway = Math.sin(state.t * 1.35 + phase + state.speed * 0.55) * 7;
    ctx.strokeStyle = rgba(pal.grassDark, 0.72);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    for (let i = 0; i < 9; i++) {
      const bend = sway * (0.4 + (i % 4) * 0.22) + (i - 4) * 2.7;
      const h = 32 + (i % 5) * 12;
      ctx.beginPath();
      ctx.moveTo((i - 4) * 3.1, 0);
      ctx.quadraticCurveTo((i - 4) * 3.8 + bend * 0.25, -h * 0.58, (i - 4) * 5.2 + bend, -h);
      ctx.stroke();
      if (i % 3 === 0) {
        ctx.fillStyle = rgba(pal.grass, 0.75);
        ctx.beginPath();
        ctx.ellipse((i - 4) * 5.2 + bend, -h, 2.2, 6.5, -0.1 + bend * 0.005, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ----------------------------- speed lines ----------------------------- */

  function drawSpeedLines() {
    if (state.speed < 0.18) return;
    const amount = clamp(state.speed, 0, 1);
    ctx.save();
    ctx.lineCap = "round";
    const count = Math.round(amount * 16);
    for (let i = 0; i < count; i++) {
      const seed = i * 97.17;
      const travel = state.scroll * (1.2 + (i % 3) * 0.18) + seed * 13;
      const x = W + 100 - ((travel % (W + 220)) + W + 220) % (W + 220);
      const y = H * (0.17 + ((i * 37) % 57) / 100);
      const len = (18 + amount * 90) * (0.5 + (i % 4) * 0.15);
      ctx.strokeStyle = rgba(pal.foam, 0.1 + amount * 0.26);
      ctx.lineWidth = 1 + (i % 3) * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - len, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawScene() {
    const gait = Math.sin(state.runPhase * 2);
    const bump = state.terrain === "pebbles" ? Math.sin(state.t * 27) * state.speed * 2.2 : 0;
    const bodyBob = gait * (1.2 + state.speed * 4.4) + bump;
    const shakeAmt = state.shake * (state.terrain === "pebbles" ? 2.8 : 1.1);
    const sx = Math.sin(state.t * 37) * shakeAmt;
    const sy = Math.cos(state.t * 31) * shakeAmt * 0.55;
    const bikePose = getBikePose(bodyBob);

    ctx.save();
    ctx.translate(originX + sx, groundY + sy);
    ctx.scale(S, S);

    drawGroundShadow(bodyBob);
    drawParticles("back");
    drawPelican(bodyBob);
    drawBike(bikePose);
    drawReins(bodyBob, bikePose);
    drawParticles("front");
    drawFish();
    drawStartleMark(bodyBob);
    drawSpeechBubble();

    ctx.restore();
  }

  function drawPelican(bob) {
    const wingFlap = Math.sin(state.wingPhase);
    const startle = easeOut(clamp(state.startle, 0, 1));
    const wingAngle = 0.055 + wingFlap * (0.035 + state.speed * 0.11) + startle * 0.42 + (state.sprint > 0 ? 0.1 : 0);
    const farWingAngle = -0.07 - wingFlap * (0.025 + state.speed * 0.06) - startle * 0.2;

    ctx.save();
    ctx.translate(0, bob);

    drawPelicanLeg(-82, -102, state.runPhase, false);
    drawPelicanLeg(94, -95, state.runPhase + Math.PI, true);
    drawTail();
    drawFarWing(farWingAngle);
    drawBody(bob);
    drawNeckAndHead(startle);
    drawNearWing(wingAngle, startle);
    drawHarness();

    ctx.restore();
  }

  function drawPelicanLeg(hipX, hipY, phase, near) {
    const amp = 0.75 + state.speed * 1.55;
    const swing = Math.sin(phase) * amp;
    const lift = Math.max(0, Math.sin(phase + 0.55)) * (9 + state.speed * 25);
    const kneeX = hipX + 2 + swing * 14;
    const kneeY = hipY + 42 - lift * 0.24;
    const ankleX = kneeX + (near ? 12 : 2) + swing * 16;
    const ankleY = -7 - lift;
    const footAngle = swing * 0.12;

    ctx.save();
    ctx.strokeStyle = near ? BIRD.orange : BIRD.orangeDark;
    ctx.lineWidth = near ? 13 : 10;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.quadraticCurveTo(kneeX, kneeY, ankleX, ankleY);
    ctx.stroke();
    ctx.strokeStyle = near ? "rgba(255,220,154,.38)" : "rgba(255,220,154,.16)";
    ctx.lineWidth = near ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(hipX + 2, hipY + 2);
    ctx.quadraticCurveTo(kneeX + 2, kneeY - 2, ankleX + 1, ankleY - 2);
    ctx.stroke();

    ctx.translate(ankleX, ankleY);
    ctx.rotate(footAngle);
    ctx.fillStyle = near ? BIRD.orange : BIRD.orangeDark;
    ctx.strokeStyle = near ? "#b96b36" : "#a65b2c";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-9, 1);
    ctx.quadraticCurveTo(9, 8, 31, 8);
    ctx.lineTo(25, 0);
    ctx.lineTo(41, 2);
    ctx.quadraticCurveTo(27, -4, 23, -5);
    ctx.lineTo(30, -12);
    ctx.quadraticCurveTo(15, -8, 8, -5);
    ctx.quadraticCurveTo(2, -4, -9, 1);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(120,66,28,.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(7, 2);
    ctx.lineTo(30, 7);
    ctx.moveTo(8, 0);
    ctx.lineTo(36, 2);
    ctx.stroke();
    ctx.restore();
  }

    const wide = 1 + startle * 0.22;
    const blinkScale = 1 - state.blink * 0.92;
    const tired = pant ? 0.82 : 1;
    ctx.save();
    ctx.translate(208, -355);
    ctx.scale(1, blinkScale * tired);
    ctx.fillStyle = "#fffdf4";
    ctx.strokeStyle = "rgba(106,74,43,.7)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10.6 * wide, 11.6 * wide, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#283430";
    ctx.beginPath();
    ctx.arc(3.9, 0.7, 5 + startle * 0.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(5.8, -1.9, 1.6, 0, TAU);
    ctx.fill();
    if (startle > 0.18) {
      ctx.strokeStyle = "rgba(106,74,43,.4)";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(0, 0, 13.8, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "rgba(120,80,43,.58)";
    ctx.lineWidth = 2.1;
    ctx.lineCap = "round";
    ctx.beginPath();
    if (startle > 0.18) {
      ctx.moveTo(192, -370);
      ctx.quadraticCurveTo(204, -379, 218, -368);
    } else if (state.stamina < 38) {
      ctx.moveTo(194, -366);
      ctx.quadraticCurveTo(205, -362, 216, -366);
    } else {
      ctx.moveTo(193, -367);
      ctx.quadraticCurveTo(205, -374, 218, -365);
    }
    ctx.stroke();
    ctx.restore();

    if (pant) {
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = "#e48478";
      ctx.beginPath();
      ctx.ellipse(222, -314, 13, 6, -0.2, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

    ctx.bezierCurveTo(7, 20, 17, 4, 12, -11);

    ctx.fill();

    ctx.fillStyle = "rgba(255,249,231,.4)";
    ctx.beginPath();

    ctx.strokeStyle = "rgba(142,102,57,.4)";

    for (let i = 0; i < 5; i++) {

    ctx.strokeStyle = "rgba(255,248,229,.4)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -18);

    ctx.fillStyle = "rgba(52,66,61,.86)";
    for (let i = 0; i < 3; i++) {
      const baseX = -120 + i * 12;
      const tipX = -176 + i * 14;

      ctx.beginPath();

  /* ------------------------------- bicycle ------------------------------- */

  function drawBike(pose) {
    ctx.save();
    ctx.translate(0, pose.bob);
    ctx.translate(0, -350);
    ctx.rotate(pose.tilt);
    ctx.translate(0, 350);

    const rear = { x: -128, y: -350, r: 68 };
    const front = { x: 68, y: -364, r: 68 };
    const crank = { x: -23, y: -346 };
    const seatTop = { x: -70, y: -448 };
    const headTop = { x: 32, y: -452 };

    drawChain(rear, crank);
    drawWheel(rear.x, rear.y, rear.r, state.wheelAngle, false);
    drawWheel(front.x, front.y, front.r, state.wheelAngle + 0.08, true);
    drawFrame(rear, front, crank, seatTop, headTop);
    drawDrivetrain(rear, crank);
    drawSaddle(seatTop);
    drawHandlebars(headTop);
    drawFlag(seatTop);
    drawBikeDetails(pose);

    ctx.restore();
  }

  function drawWheel(x, y, r, angle, front) {
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.rotate(angle);
    ctx.strokeStyle = BIRD.tire;
    ctx.lineWidth = 8.2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,242,216,.26)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, r - 4.4, Math.PI * 1.08, Math.PI * 1.84);
    ctx.stroke();

    ctx.strokeStyle = "#c5a77b";
    ctx.lineWidth = 2.7;
    ctx.beginPath();
    ctx.arc(0, 0, r - 12, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,247,223,.65)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r - 7.8, 0, TAU);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,248,226,.72)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 14; i++) {
      const a = i * TAU / 14;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.lineTo(Math.cos(a) * (r - 14), Math.sin(a) * (r - 14));
      ctx.stroke();
    }

    ctx.fillStyle = BIRD.tire;
    ctx.beginPath();
    ctx.arc(0, 0, 6.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#e4c58d";
    ctx.beginPath();
    ctx.arc(0, 0, 2.7, 0, TAU);
    ctx.fill();

    if (front) {
      ctx.save();
      ctx.rotate(-angle + angle);
      ctx.fillStyle = "#f0a14e";
      ctx.strokeStyle = "rgba(112,64,35,.55)";
      ctx.lineWidth = 1;
      roundRectPath(r * 0.38 - 5, -3, 10, 6, 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();

    if (state.speed > 0.55) {
      ctx.save();
      ctx.globalAlpha = clamp((state.speed - 0.55) * 0.7, 0, 0.22);
      ctx.strokeStyle = "#f8eac9";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, r - 2, -0.55, 0.1);
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawChain(rear, crank) {
    ctx.save();
    ctx.strokeStyle = "rgba(38,54,51,.82)";
    ctx.lineWidth = 2.2;
    ctx.setLineDash([3, 2]);
    ctx.lineDashOffset = -state.wheelAngle * 8;
    ctx.beginPath();
    ctx.moveTo(crank.x, crank.y - 15);
    ctx.lineTo(rear.x, rear.y - 9);
    ctx.lineTo(rear.x, rear.y + 9);
    ctx.lineTo(crank.x, crank.y + 15);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawFrame(rear, front, crank, seatTop, headTop) {
    const tubes = [
      [rear.x, rear.y, seatTop.x, seatTop.y],
      [seatTop.x, seatTop.y, crank.x, crank.y],
      [crank.x, crank.y, headTop.x, headTop.y],
      [headTop.x, headTop.y, seatTop.x, seatTop.y],
      [rear.x, rear.y, crank.x, crank.y],
      [headTop.x, headTop.y, front.x, front.y]
    ];
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = BIRD.frameDark;
    ctx.lineWidth = 8.4;
    tubes.forEach(function (t) {
      ctx.beginPath();
      ctx.moveTo(t[0], t[1]);
      ctx.lineTo(t[2], t[3]);
      ctx.stroke();
    });
    ctx.strokeStyle = BIRD.frame;
    ctx.lineWidth = 5.3;
    tubes.forEach(function (t) {
      ctx.beginPath();
      ctx.moveTo(t[0], t[1]);
      ctx.lineTo(t[2], t[3]);
      ctx.stroke();
    });
    ctx.strokeStyle = "rgba(255,189,151,.55)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(seatTop.x + 2, seatTop.y + 2);
    ctx.lineTo(headTop.x - 1, headTop.y + 1);
    ctx.stroke();

    ctx.strokeStyle = "#3c554f";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(headTop.x, headTop.y);
    ctx.quadraticCurveTo(38, -438, 48, -414);
    ctx.stroke();
    ctx.strokeStyle = BIRD.frame;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(headTop.x, headTop.y);
    ctx.quadraticCurveTo(38, -438, 48, -414);
    ctx.stroke();

    ctx.fillStyle = "#dfc08a";
    ctx.strokeStyle = BIRD.frameDark;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(rear.x, rear.y, 3.5, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(front.x, front.y, 3.5, 0, TAU);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff2d1";
    ctx.strokeStyle = BIRD.frameDark;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(-7, -402, 13, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#244a44";
    ctx.font = "900 10px ui-rounded, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("08", -7, -401);

    ctx.strokeStyle = "rgba(255,240,211,.7)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-54, -443);
    ctx.lineTo(22, -446);
    ctx.stroke();
    ctx.restore();
  }

  function drawDrivetrain(rear, crank) {
    ctx.save();
    ctx.strokeStyle = "#e0bd7f";
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.arc(crank.x, crank.y, 15, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([2, 2.2]);
    ctx.beginPath();
    ctx.arc(crank.x, crank.y, 17.5, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#d6ab6c";
    ctx.beginPath();
    ctx.arc(crank.x, crank.y, 5.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "#6b4932";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    const angle = state.crankAngle;
    for (let side = 0; side < 2; side++) {
      const a = angle + side * Math.PI;
      const px = crank.x + Math.cos(a) * 24;
      const py = crank.y + Math.sin(a) * 24;
      ctx.strokeStyle = "#4b5750";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(crank.x, crank.y);
      ctx.lineTo(px, py);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,240,213,.62)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(crank.x, crank.y - 1);
      ctx.lineTo(px, py - 1);
      ctx.stroke();
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(side === 0 ? -0.12 : 0.12);
      ctx.fillStyle = "#f0d29a";
      ctx.strokeStyle = "#564f3c";
      ctx.lineWidth = 1.2;
      roundRectPath(-7.5, -3, 15, 6, 2.4);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSaddle(seatTop) {
    ctx.save();
    ctx.strokeStyle = "#4b5145";
    ctx.lineWidth = 4.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(seatTop.x, seatTop.y + 2);

    saddleGrad.addColorStop(1, "#573b30");
    ctx.fillStyle = saddleGrad;
    ctx.strokeStyle = "#3d2d27";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(seatTop.x - 33, seatTop.y - 17);
    ctx.bezierCurveTo(seatTop.x - 16, seatTop.y - 29, seatTop.x + 25, seatTop.y - 28, seatTop.x + 38, seatTop.y - 18);
    ctx.bezierCurveTo(seatTop.x + 43, seatTop.y - 12, seatTop.x + 28, seatTop.y - 9, seatTop.x + 9, seatTop.y - 11);
    ctx.bezierCurveTo(seatTop.x - 8, seatTop.y - 12, seatTop.x - 25, seatTop.y - 9, seatTop.x - 33, seatTop.y - 17);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,212,164,.38)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(seatTop.x - 20, seatTop.y - 20);
    ctx.quadraticCurveTo(seatTop.x, seatTop.y - 25, seatTop.x + 25, seatTop.y - 20);
    ctx.stroke();
    ctx.restore();
  }

  function drawFlag(seatTop) {

    ctx.moveTo(seatTop.x - 15, seatTop.y - 73);
    ctx.quadraticCurveTo(seatTop.x - 48, seatTop.y - 73 + flutter, seatTop.x - 82, seatTop.y - 60 + flutter);
    ctx.quadraticCurveTo(seatTop.x - 58, seatTop.y - 52 + flutter, seatTop.x - 15, seatTop.y - 49);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "rgba(255,243,210,.9)";
    ctx.beginPath();
    ctx.arc(seatTop.x - 49, seatTop.y - 61 + flutter * 0.5, 5.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#b74a34";
