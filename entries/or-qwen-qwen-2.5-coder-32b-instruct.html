<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bicycle Riding a Pelican</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #87CEEB;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            border: 1px solid #fff;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="ringBell()">Ring Bell</button>
        <button onclick="toggleSpeed()">Toggle Speed</button>
        <button onclick="toggleWeather()">Toggle Weather</button>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let speed = 2;
        let weather = 'sunny';
        let bellRinging = false;
        let pelicanX = -200;
        let pelicanY = canvas.height - 150;
        let bikeAngle = 0;
        let backgroundOffset = 0;

        function drawBackground() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.arc(i + backgroundOffset % 50, canvas.height - 50, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            if (weather === 'sunset') {
                ctx.fillStyle = 'orange';
                ctx.fillRect(0, 0, canvas.width, canvas.height / 3);
            } else if (weather === 'night') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 4,20, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPelican(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(2, 2);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-20, -50, -40, -20);
            ctx.quadraticCurveTo(-20, -10, 0, 0);
            ctx.fillStyle = '#FFF';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(20, -50, 40, -20);
            ctx.quadraticCurveTo(20, -10, 0, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-20, -20);
            ctx.quadraticCurveTo(-30, -40, -20, -60);
            ctx.quadraticCurveTo(-10, -40, -20, -20);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, -20);
            ctx.quadraticCurveTo(30, -40, 20, -60);
            ctx.quadraticCurveTo(10, -40, 20, -20);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-20, -60);
            ctx.lineTo(-30, -80);
            ctx.lineTo(-10, -80);
            ctx.closePath();
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(20, -60);
            ctx.lineTo(30, -80);
            ctx.lineTo(10, -80);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(-10, -80);
            ctx.lineTo(0, -100);
            ctx.lineTo(10, -80);
            ctx.closePath();
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -100,10, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.restore();
        }

        function drawBike(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(-50, 0);
            ctx.lineTo(50, 0);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(-50, 0,20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(50, 0,20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-50, 0);
            ctx.lineTo(-70, -30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-70, -30);
            ctx.lineTo(-70, -50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(50, 0);
            ctx.lineTo(70, -30);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(70, -30);
            ctx.lineTo(70, -50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-70, -50);
            ctx.lineTo(70, -50);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-70, -50);
            ctx.lineTo(-70, -70);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(70, -50);
            ctx.lineTo(70, -70);
            ctx.stroke();
            ctx.restore();
        }

        function ringBell() {
            bellRinging = true;
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
            setTimeout(() => { bellRinging = false; }, 100);
        }

        function toggleSpeed() {
            speed = speed === 2 ? 5 : 2;
        }

        function toggleWeather() {
            if (weather === 'sunny') {
                weather = 'sunset';
            } else if (weather === 'sunset') {
                weather = 'night';
            } else {
                weather = 'sunny';
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            backgroundOffset -= speed / 2;
            if (backgroundOffset > 50) backgroundOffset = 0;

            pelicanX += speed;
            if (pelicanX > canvas.width + 200) pelicanX = -200;

            bikeAngle = Math.sin(pelicanX / 50) * 0.1;
            drawPelican(pelicanX, pelicanY);
            drawBike(pelicanX, pelicanY - 70, bikeAngle);

            if (bellRinging) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(pelicanX, pelicanY - 70, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
