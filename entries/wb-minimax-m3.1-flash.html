<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  :root{
    --skyA:#5cc0ee; --skyB:#dff1ff;
    --seaA:#2f86bf; --seaB:#0f4d7d;
    --deckA:#e0b27a; --deckB:#b2814b;
    --plankLine:rgba(70,42,18,.34);
    --farEdge:#7d5c39;
    --rail:#f6ead4;
    --bodyA:#fffdf6; --bodyB:#e7dcc2;
    --pouchA:#f7bdb2; --pouchB:#e59389;
    --beakA:#f7b64c; --beakB:#d98f2b;
    --bikeA:#d94f3d; --bikeB:#a8342a;
    --tire:#2c3440; --metal:#c9d4df;
    --sun:#ffe27a; --glow:rgba(255,214,92,.75);
    --starOpacity:0; --lampOpacity:0;
    --softShade:rgba(35,48,61,.13);
    --cobble:rgba(120,86,52,.34);
    --ink:#23303d;
    --shadow:rgba(60,38,10,.26);
  }
  body[data-time="dusk"]{
    --skyA:#f8a35b; --skyB:#5c3a72;
    --seaA:#8a5a76; --seaB:#3d2a55;
    --deckA:#c98a5c; --deckB:#8d5a37;
    --plankLine:rgba(50,28,12,.34);
    --farEdge:#5e4227; --rail:#f0dcc0;
    --bodyA:#fff4e4; --bodyB:#e3c9ad;
    --pouchA:#f0a893; --pouchB:#d1796f;
    --beakA:#f7a83c; --beakB:#c9791c;
    --sun:#ffb14d; --glow:rgba(255,150,60,.82);
    --starOpacity:.3; --lampOpacity:.9;
    --softShade:rgba(58,36,56,.16);
    --ink:#3a2438;
    --shadow:rgba(40,20,8,.3);
  }
  body[data-time="night"]{
    --skyA:#08102c; --skyB:#20315f;
    --seaA:#132a52; --seaB:#050c1e;
    --deckA:#4d5b78; --deckB:#2b3550;
    --plankLine:rgba(10,16,32,.55);
    --farEdge:#1e2740; --rail:#8fa3c6;
    --bodyA:#e9eff9; --bodyB:#b6c4dc;
    --pouchA:#dfa2ad; --pouchB:#b87b90;
    --beakA:#dfa94f; --beakB:#a9741f;
    --sun:#eef3ff; --glow:rgba(190,215,255,.5);
    --starOpacity:1; --lampOpacity:1;
    --softShade:rgba(0,0,0,.24);
    --cobble:rgba(210,225,255,.16);
    --ink:#eaf1ff;
    --shadow:rgba(0,0,0,.42);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(120% 90% at 50% 0%, #1b2740 0%, #0b1020 60%, #070a13 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#f2f6fb; display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative; width:min(100vw, calc(100vh * 12 / 7));
    aspect-ratio:12/7; max-height:100vh;
    border-radius:16px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
    background:#0b1020;
  }
  #scene{display:block; width:100%; height:100%}

  /* ---------- 主题化涂装 ---------- */
  .skyA{stop-color:var(--skyA); transition:stop-color .9s ease}
  .skyB{stop-color:var(--skyB); transition:stop-color .9s ease}
  .seaA{stop-color:var(--seaA); transition:stop-color .9s ease}
  .seaB{stop-color:var(--seaB); transition:stop-color .9s ease}
  .deckA{stop-color:var(--deckA); transition:stop-color .9s ease}
  .deckB{stop-color:var(--deckB); transition:stop-color .9s ease}
  .bodyA{stop-color:var(--bodyA); transition:stop-color .9s ease}
  .bodyB{stop-color:var(--bodyB); transition:stop-color .9s ease}
  .pouchA{stop-color:var(--pouchA); transition:stop-color .9s ease}
  .pouchB{stop-color:var(--pouchB); transition:stop-color .9s ease}
  .beakA{stop-color:var(--beakA); transition:stop-color .9s ease}
  .beakB{stop-color:var(--beakB); transition:stop-color .9s ease}
  .glowC{stop-color:var(--glow); transition:stop-color .9s ease}
  .sunDisc{fill:var(--sun); transition:fill .9s ease}
  .farEdge{fill:var(--farEdge); transition:fill .9s ease}
  .rail{stroke:var(--rail); transition:stroke .9s ease}
  .stars{opacity:var(--starOpacity); transition:opacity .9s ease}
  .star{fill:#fff}
  .cloud{fill:#ffffff}
  .island{fill:#3f6f8f; opacity:.5}
  .wave{stroke:#ffffff; opacity:.32; stroke-linecap:round}
  .plank{stroke:var(--plankLine); stroke-width:2.5}
  .cobbleGroup ellipse{fill:var(--cobble); transition:opacity .4s ease}
  body[data-road="smooth"] .cobbleGroup{opacity:0}
  body[data-road="cobble"] .cobbleGroup{opacity:1}
  .shadow{fill:var(--shadow)}
  .pelBody{fill:url(#gBody)}
  .pelShade{fill:var(--softShade)}
  .pouch{fill:url(#gPouch)}
  .pouchHi{fill:#ffffff; opacity:.32}
  .beak{fill:url(#gBeak)}
  .beakLine{stroke:var(--beakB); stroke-width:2; fill:none; opacity:.65}
  .wing{fill:var(--bodyB)}
  .wingFar{fill:var(--bodyA); opacity:.5}
  .crest{fill:var(--bodyB)}
  .leg{fill:none; stroke:var(--bodyB); stroke-width:15; stroke-linecap:round}
  .foot{fill:var(--beakB)}
  .bikeFrame{stroke:var(--bikeA); stroke-width:8; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .bikeFrame2{stroke:var(--bikeB); stroke-width:8; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .tire{fill:none; stroke:var(--tire); stroke-width:9}
  .rim{fill:none; stroke:var(--metal); stroke-width:2.5; opacity:.85}
  .spoke{stroke:var(--metal); stroke-width:1.6; opacity:.85}
  .hub{fill:var(--tire)}
  .saddle{fill:#3b3b46}
  .grip{fill:#3b3b46}
  .chainBase{stroke:var(--tire); stroke-width:3; fill:none; opacity:.7}
  .chainMove{stroke:var(--metal); stroke-width:3.4; fill:none; stroke-dasharray:7 7; stroke-linecap:round}
  .bellGold{fill:#f2c14e; stroke:#c99a2a; stroke-width:1.5}
  .rein{stroke:#8b5e34; stroke-width:3.4; fill:none; stroke-linecap:round}
  .bridle{stroke:#b3763c; stroke-width:7; fill:none; stroke-linecap:round}
  .harness{fill:#2f7d78}
  .strap{fill:none; stroke:#245f5b; stroke-width:7; stroke-linecap:round}
  .lens{fill:rgba(150,205,235,.5); stroke:#3c4a5a; stroke-width:4}
  .lensClear{fill:rgba(255,255,255,.32); stroke:#3c4a5a; stroke-width:4}
  .pupil{fill:#1b2430}
  .glint{fill:#fff}
  .brow{fill:none; stroke:#3c4a5a; stroke-width:4; stroke-linecap:round}
  .mouth{fill:#b8453f}
  .speedLine{stroke:#ffffff; stroke-width:4; stroke-linecap:round; opacity:0}
  .lampGlow{fill:#ffd98a; opacity:var(--lampOpacity); transition:opacity .9s ease}
  .lampPole{stroke:#3b4a5e; stroke-width:5; stroke-linecap:round}
  .lampHead{fill:#ffe9b0}
  .grass{fill:#16233a; opacity:.5}
  .fishBody{fill:#7fd0e8; stroke:#2b7f96; stroke-width:2}
  .fishTail{fill:#4fb3cc}
  .fishEye{fill:#123}
  .ring{fill:none; stroke:#ffe27a; stroke-width:4}
  .txt{font-weight:700; fill:#fff; text-anchor:middle; paint-order:stroke; stroke:rgba(0,0,0,.4); stroke-width:3.5}

  /* ---------- HUD / 控件 ---------- */
  .overlay{position:absolute; pointer-events:none}
  .card{
    pointer-events:auto; background:rgba(13,19,32,.6); backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(255,255,255,.14); border-radius:16px;
    box-shadow:0 14px 40px rgba(0,0,0,.38);
  }
  #title{left:18px; top:16px; padding:12px 18px 13px; border-left:3px solid #ffb648}
  #title h1{margin:0; font-size:20px; letter-spacing:.5px; font-weight:800}
  #title h1 span{color:#ffcf6b}
  #title p{margin:4px 0 0; font-size:12px; opacity:.72; letter-spacing:.2px}

  #hud{right:18px; top:16px; padding:12px 16px; min-width:222px}
  .meterRow{display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:9px}
  .meterRow b{font-variant-numeric:tabular-nums; min-width:30px; text-align:right}
  .track{flex:1; height:9px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden}
  .fill{height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,#5fd08a,#cbe86a); transition:width .18s linear, background .4s}
  .fill.low{background:linear-gradient(90deg,#ff7a5c,#ffc14d)}
  .stats{display:flex; gap:14px; justify-content:space-between}
  .stats div{display:flex; flex-direction:column; align-items:center}
  .stats b{font-size:17px; font-variant-numeric:tabular-nums}
  .stats span{font-size:10px; opacity:.6; letter-spacing:1px}
  #mood{margin-top:9px; font-size:12px; text-align:center; padding:5px 0 0; border-top:1px solid rgba(255,255,255,.12); color:#ffd88a}

  #panel{left:18px; bottom:18px; padding:13px 16px 14px; width:290px}
  #panel h2{margin:0 0 10px; font-size:12px; letter-spacing:2px; opacity:.62; font-weight:700}
  .sliderRow{display:flex; align-items:center; gap:9px; font-size:12px; margin-bottom:11px}
  .sliderRow span{opacity:.75; width:26px}
  .sliderRow b{width:26px; text-align:right; font-variant-numeric:tabular-nums; color:#ffcf6b}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:5px; border-radius:99px; background:rgba(255,255,255,.2); outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:17px; height:17px; border-radius:50%; background:#ffb648; border:2px solid rgba(255,255,255,.35); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:#ffb648; border:2px solid rgba(255,255,255,.35); cursor:pointer}
  .btnRow{display:flex; gap:8px; margin-bottom:8px}
  button{
    pointer-events:auto; flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:inherit; font-size:12.5px; font-weight:600; color:#f4f8ff; cursor:pointer;
    padding:9px 6px; border-radius:11px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08); transition:transform .12s ease, background .18s ease, filter .18s;
    white-space:nowrap;
  }
  button:hover{background:rgba(255,255,255,.17); transform:translateY(-1px)}
  button:active{transform:translateY(1px) scale(.98)}
  button.accent{background:linear-gradient(180deg,#ffb648,#ef8f2c); border-color:rgba(255,255,255,.32); color:#2a1a06}
  button.accent:hover{filter:brightness(1.07)}
  button.cool{background:linear-gradient(180deg,#4fb6d8,#2c7fa8); border-color:rgba(255,255,255,.25); color:#04202b}
  button.cool:hover{filter:brightness(1.07)}
  button svg{width:15px; height:15px; flex:none}
  #hint{margin:9px 0 0; font-size:11.5px; line-height:1.55; opacity:.74; min-height:34px}
  #hint b{color:#ffd88a}
  @media (max-width:780px){
    #panel{width:238px; padding:10px 12px}
    #title h1{font-size:16px}
    #hud{min-width:184px; padding:10px 12px}
  }
</style>
</head>
<body data-time="day" data-road="smooth">
<div id="stage">
  <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一辆自行车骑着一只鹈鹕沿着海滨木栈道奔跑">
    <title>自行车骑鹈鹕</title>
    <desc>反常识构图：上方是一辆结构完整的自行车，下方是背着它奔跑的鹈鹕。</desc>
    <defs>
      <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
        <stop class="skyA" offset="0"/><stop class="skyB" offset="1"/>
      </linearGradient>
      <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
        <stop class="seaA" offset="0"/><stop class="seaB" offset="1"/>
      </linearGradient>
      <linearGradient id="gDeck" x1="0" y1="0" x2="0" y2="1">
        <stop class="deckA" offset="0"/><stop class="deckB" offset="1"/>
      </linearGradient>
      <linearGradient id="gBody" x1="0.15" y1="0" x2="0.45" y2="1">
        <stop class="bodyA" offset="0"/><stop class="bodyB" offset="1"/>
      </linearGradient>
      <linearGradient id="gPouch" x1="0" y1="0" x2="0" y2="1">
        <stop class="pouchA" offset="0"/><stop class="pouchB" offset="1"/>
      </linearGradient>
      <linearGradient id="gBeak" x1="0" y1="0" x2="0" y2="1">
        <stop class="beakA" offset="0"/><stop class="beakB" offset="1"/>
      </linearGradient>
      <radialGradient id="gGlow">
        <stop class="glowC" offset="0" stop-opacity="0.9"/>
        <stop class="glowC" offset="0.42" stop-opacity="0.32"/>
        <stop class="glowC" offset="1" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="clipDeck"><rect x="0" y="470" width="1200" height="230"/></clipPath>
    </defs>

    <!-- ===== 天空 ===== -->
    <rect x="0" y="0" width="1200" height="700" fill="url(#gSky)"/>
    <g id="celestial">
      <circle cx="985" cy="95" r="120" fill="url(#gGlow)"/>
      <circle cx="985" cy="95" r="42" class="sunDisc"/>
    </g>
    <g id="stars" class="stars"></g>
    <g id="clouds"></g>

    <!-- ===== 海与地平线 ===== -->
    <rect x="0" y="330" width="1200" height="140" fill="url(#gSea)"/>
    <g id="islands"></g>
    <g id="waves"></g>

    <!-- ===== 木栈道远端 ===== -->
    <rect x="0" y="458" width="1200" height="14" class="farEdge"/>
    <line x1="0" y1="416" x2="1200" y2="416" class="rail" stroke-width="6"/>
    <g id="railPosts"></g>
    <g id="lamps"></g>

    <!-- ===== 甲板 ===== -->
    <rect x="0" y="470" width="1200" height="230" fill="url(#gDeck)"/>
    <g id="ground"></g>

    <!-- ===== 速度线 ===== -->
    <g id="speedLines"></g>

    <!-- ===== 地面阴影 ===== -->
    <ellipse id="shadow" cx="520" cy="562" rx="152" ry="15" class="shadow"/>

    <!-- ===== 腿（不随身体起伏，脚始终踩在板上） ===== -->
    <g id="legs">
      <g id="legBack">
        <path class="leg" d="M468 490 L448 546"/>
        <path class="foot" d="M446 544 C454 550 468 550 474 544 C480 554 488 554 490 547 C496 554 504 551 503 543 C499 536 480 534 452 536 Z"/>
      </g>
      <g id="legFront">
        <path class="leg" d="M576 486 L592 542"/>
        <path class="foot" d="M590 540 C598 546 612 546 618 540 C624 550 632 550 634 543 C640 550 648 547 647 539 C643 532 624 530 596 532 Z"/>
      </g>
    </g>

    <!-- ===== 主角：上方自行车 / 下方鹈鹕 ===== -->
    <g id="actor">
      <!-- 鹈鹕 -->
      <g id="pelican">
        <g id="tail" transform="translate(392,396)">
          <path class="wing" d="M0 0 C-26 -26 -56 -38 -76 -34 C-58 -22 -50 -10 -48 4 Z"/>
          <path class="wing" d="M0 8 C-28 -10 -60 -14 -80 -6 C-62 4 -54 14 -52 24 Z"/>
          <path class="wing" d="M0 16 C-26 8 -52 12 -66 24 C-50 28 -40 36 -36 46 Z"/>
        </g>
        <g id="wingFar" transform="rotate(0,486,372)">
          <path class="wingFar" d="M500 356 C456 312 404 310 392 348 C382 380 420 424 472 424 C496 414 508 388 500 356 Z"/>
        </g>
        <!-- 身体：背脊平缓，正好承住两轮 -->
        <path class="pelBody" d="M356 410 C356 356 380 316 400 316 L600 316 C640 320 656 358 654 406 C652 468 596 512 520 512 C436 512 360 464 356 410 Z"/>
        <path class="pelShade" d="M396 470 C446 500 560 504 616 468 C600 502 566 514 520 514 C452 514 412 496 396 470 Z"/>
        <path class="pelShade" d="M372 356 C382 332 398 320 418 316 C392 330 378 344 368 366 Z"/>
        <!-- 颈 -->
        <path class="pelBody" d="M614 366 C620 322 638 286 652 246" fill="none" stroke="url(#gBody)" stroke-width="54" stroke-linecap="round"/>
        <!-- 头 -->
        <g id="head">
          <ellipse cx="664" cy="200" rx="50" ry="42" class="pelBody"/>
          <path class="crest" d="M620 172 C604 154 586 146 570 148 C588 158 598 172 602 188 Z"/>
          <path class="crest" d="M626 158 C616 140 604 130 592 128 C604 140 610 154 612 172 Z" opacity=".8"/>
          <path class="beak" d="M706 186 C744 170 792 182 822 210 C788 228 740 230 706 220 Z"/>
          <path class="beakLine" d="M708 220 C744 228 790 226 818 212"/>
          <circle cx="746" cy="196" r="3.4" fill="#a9701f" opacity=".75"/>
          <!-- 宽大喉囊 -->
          <g id="pouch">
            <path class="pouch" d="M704 222 C746 232 794 226 818 214 C816 268 780 302 738 302 C706 302 696 264 704 222 Z"/>
            <path class="pouchHi" d="M716 236 C742 244 776 240 798 232 C790 252 772 262 750 262 C732 262 718 252 716 236 Z"/>
          </g>
          <path id="mouth" class="mouth" d="M704 214 C722 228 748 232 768 224 C756 244 726 250 706 236 Z" opacity="0"/>
          <!-- 护目镜 -->
          <path d="M618 190 C634 166 700 162 714 186" fill="none" stroke="#3c4a5a" stroke-width="7" stroke-linecap="round"/>
          <g id="eyeNormal">
            <ellipse cx="680" cy="190" rx="21" ry="19" class="lens"/>
            <circle cx="682" cy="191" r="8" class="pupil"/>
            <circle cx="685" cy="187" r="3" class="glint"/>
          </g>
          <g id="eyeWide" style="display:none">
            <ellipse cx="680" cy="188" rx="23" ry="21" class="lensClear"/>
            <circle cx="681" cy="188" r="5.5" class="pupil"/>
            <path class="brow" d="M656 162 C670 152 694 152 706 162"/>
          </g>
          <g id="eyeHappy" style="display:none">
            <ellipse cx="680" cy="190" rx="21" ry="19" class="lens"/>
            <path class="brow" d="M666 196 C674 180 688 180 696 196" stroke="#1b2430"/>
          </g>
          <g id="eyeTired" style="display:none">
            <ellipse cx="680" cy="190" rx="21" ry="19" class="lens"/>
            <path d="M658 176 C672 168 692 168 702 178 L702 187 L658 187 Z" fill="#2a3644"/>
            <path class="brow" d="M654 168 C668 176 692 178 704 172"/>
          </g>
        </g>
      </g>

      <!-- 自行车：横架在鹈鹕背上 -->
      <g id="bike">
        <!-- 缰绳：自行车握着缰绳，鹈鹕脖子上戴着辔头 -->
        <path class="rein" d="M524 200 C576 214 612 250 638 288"/>
        <path class="rein" d="M560 200 C594 226 616 254 638 288"/>
        <path class="bridle" d="M612 266 C622 282 632 290 648 290"/>
        <!-- 驮架鞍垫 + 绑带 -->
        <path class="harness" d="M398 330 C462 306 576 306 626 330 C576 352 448 352 398 330 Z"/>
        <path class="strap" d="M424 344 C414 402 424 456 446 492"/>
        <path class="strap" d="M604 344 C616 402 606 456 584 492"/>
        <!-- 后轮 -->
        <g transform="translate(400,262)">
          <circle r="54" class="tire"/>
          <circle r="47" class="rim"/>
          <g id="spokeR"></g>
          <circle r="6" class="hub"/>
        </g>
        <!-- 前轮 -->
        <g transform="translate(556,262)">
          <circle r="54" class="tire"/>
          <circle r="47" class="rim"/>
          <g id="spokeF"></g>
          <circle r="6" class="hub"/>
        </g>
        <!-- 车架：菱形结构 -->
        <path class="bikeFrame" d="M400 262 L480 298"/>
        <path class="bikeFrame" d="M400 262 L452 246"/>
        <path class="bikeFrame" d="M452 246 L480 298"/>
        <path class="bikeFrame" d="M452 246 L536 240"/>
        <path class="bikeFrame" d="M480 298 L542 262"/>
        <path class="bikeFrame2" d="M536 240 L542 262"/>
        <!-- 链条 -->
        <path class="chainBase" d="M406 254 L474 290 M486 306 L408 270"/>
        <path id="chainTop" class="chainMove" d="M406 254 L474 290"/>
        <path id="chainBot" class="chainMove" d="M486 306 L408 270"/>
        <!-- 牙盘 / 曲柄 / 脚踏 -->
        <g transform="translate(480,298)">
          <circle r="13" fill="none" stroke="#7d8896" stroke-width="3"/>
          <g id="crank">
            <path class="bikeFrame2" d="M0 0 L0 -19" stroke-width="5"/>
            <path class="bikeFrame2" d="M0 0 L0 19" stroke-width="5"/>
            <g id="pedals">
              <rect x="-9" y="-23" width="18" height="6" rx="2" fill="#3b3b46"/>
              <rect x="-9" y="17" width="18" height="6" rx="2" fill="#3b3b46"/>
            </g>
          </g>
        </g>
        <!-- 车座 -->
        <path class="bikeFrame2" d="M452 246 L448 232" stroke-width="5"/>
        <path class="saddle" d="M424 228 C430 220 456 220 462 228 L464 233 L424 233 Z"/>
        <!-- 车把 -->
        <path class="bikeFrame2" d="M536 244 L540 210" stroke-width="5"/>
        <path class="bikeFrame2" d="M522 204 L560 204" stroke-width="5"/>
        <rect x="518" y="199" width="10" height="10" rx="4" class="grip"/>
        <rect x="554" y="199" width="10" height="10" rx="4" class="grip"/>
        <!-- 车铃 -->
        <g id="bell">
          <path class="bellGold" d="M538 200 A8 8 0 0 1 554 200 Z"/>

<script>
(function(){
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var $ = function(id){ return document.getElementById(id); };

  function mk(tag, attrs){
    var e = document.createElementNS(NS, tag);
    if(attrs) for(var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function rnd(a,b){ return a + Math.random()*(b-a); }
  // 确定性随机：保证平铺图层可无缝循环
  function lcg(seed){ var s = seed>>>0; return function(){ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
  function rr(rng,a,b){ return a + rng()*(b-a); }

  /* =======================================================
     平铺工具：把同一段内容复制 n 份，滚动时循环使用
     ======================================================= */
  function tile(period, count, offset, build){
    var tpl = mk('g');
    build(tpl);
    var wrap = mk('g');
    for(var i=0;i<count;i++){
      var c = tpl.cloneNode(true);
      c.setAttribute('transform','translate('+(offset + i*period)+',0)');
      wrap.appendChild(c);
    }
    return wrap;
  }

  /* ============ 场景静态内容生成 ============ */
  // 星星
  var stars = $('stars'), srng = lcg(20240815);
  for(var i=0;i<70;i++){
    var st = mk('circle',{cx:rr(srng,0,1200),cy:rr(srng,10,300),r:rr(srng,.7,2.1)});
    st.setAttribute('class','star');
    st.setAttribute('opacity', rr(srng,.35,1).toFixed(2));
    stars.appendChild(st);
  }
  for(var s=0;s<5;s++){
    var sx=rr(srng,60,1140), sy=rr(srng,30,260);
    var sp = mk('path',{d:'M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6 Z',fill:'#fff',opacity:rr(srng,.5,.95).toFixed(2)});
    sp.setAttribute('transform','translate('+sx.toFixed(1)+','+sy.toFixed(1)+') scale('+rr(srng,.7,1.3).toFixed(2)+')');
    stars.appendChild(sp);
  }
  // 云（周期 1300 平铺）
  var crng = lcg(99173);
  var cloudLayer = tile(1300, 3, -1300, function(g){
    for(var c=0;c<6;c++){
      var cg = mk('g'); cg.setAttribute('class','cloud');
      var cx = rr(crng,0,1300), cy = rr(crng,40,255), sc = rr(crng,.5,1.2);
      var n = 4 + Math.floor(crng()*3);
      for(var k=0;k<n;k++){
        cg.appendChild(mk('ellipse',{cx:(k*26-26)+rr(crng,-8,8),cy:rr(crng,-12,8),rx:rr(crng,24,42),ry:rr(crng,14,26)}));
      }
      cg.setAttribute('transform','translate('+cx.toFixed(0)+','+cy.toFixed(0)+') scale('+sc.toFixed(2)+')');
      cg.setAttribute('opacity', rr(crng,.5,.92).toFixed(2));
      g.appendChild(cg);
    }
  });
  $('clouds').appendChild(cloudLayer);
  // 远岛
  var isl = $('islands');
  [[180,330,86],[520,330,60],[880,330,110],[1080,330,54]].forEach(function(a){
    var p = mk('path',{d:'M'+(a[0]-a[2])+' 334 Q'+(a[0]-a[2]*0.5)+' '+(334-a[2]*0.55)+' '+a[0]+' '+(334-a[2]*0.75)+' Q'+(a[0]+a[2]*0.6)+' '+(334-a[2]*0.4)+' '+(a[0]+a[2])+' 334 Z'});
    p.setAttribute('class','island');
    isl.appendChild(p);
  });
  // 海浪（周期 260 平铺）
  var wrng = lcg(55512);
  var waveLayer = tile(260, 8, -260, function(g){
    for(var w=0;w<9;w++){
      var x0 = rr(wrng,0,240), y0 = rr(wrng,344,452), len = rr(wrng,24,78);
      var ln = mk('line',{x1:x0,y1:y0,x2:(x0+len).toFixed(1),y2:y0});
      ln.setAttribute('class','wave');
      ln.setAttribute('stroke-width', rr(wrng,1.5,3).toFixed(1));
      g.appendChild(ln);
    }
  });
  $('waves').appendChild(waveLayer);
  // 栏杆立柱（周期 150）
  var railLayer = tile(150, 12, -150, function(g){
    var post = mk('line',{x1:0,y1:458,x2:0,y2:414});
    post.setAttribute('class','rail'); post.setAttribute('stroke-width','7'); post.setAttribute('stroke-linecap','round');
    g.appendChild(post);
  });
  $('railPosts').appendChild(railLayer);
  // 路灯（周期 520）
  var lampLayer = tile(520, 5, -520, function(g){
    var lg = mk('g');
    lg.appendChild(mk('line',{x1:0,y1:462,x2:0,y2:382,'class':'lampPole'}));
    lg.appendChild(mk('path',{d:'M-13 382 Q0 362 13 382 Z','class':'lampHead'}));
    lg.appendChild(mk('circle',{cx:0,cy:384,r:24,'class':'lampGlow'}));
    lg.appendChild(mk('circle',{cx:0,cy:380,r:5,fill:'#fff8e0',opacity:'.9'}));
    g.appendChild(lg);
  });
  $('lamps').appendChild(lampLayer);
  // 甲板：木缝(60) 与 石子 共用 300 的共同周期 → 一起滚动且无缝
  var ground = $('ground');
  var krng = lcg(31337);
  var groundTile = tile(300, 6, -300, function(g){
    for(var pl=0; pl<300; pl+=60){
      var ln = mk('line',{x1:pl,y1:470,x2:pl,y2:700});
      ln.setAttribute('class','plank');
      g.appendChild(ln);
    }
    var cg = mk('g'); cg.setAttribute('class','cobbleGroup');
    for(var cb=0; cb<20; cb++){
      var e = mk('ellipse',{cx:rr(krng,4,296),cy:rr(krng,474,698),rx:rr(krng,7,17),ry:rr(krng,5,12)});
      e.setAttribute('transform','rotate('+rr(krng,-40,40).toFixed(0)+' '+e.getAttribute('cx')+' '+e.getAttribute('cy')+')');
      cg.appendChild(e);
    }
    g.appendChild(cg);
  });
  ground.appendChild(groundTile);
  // 辐条
  function spokes(id){
    var g = $(id);
    for(var i=0;i<12;i++){
      var a = i*Math.PI/6;
      g.appendChild(mk('line',{x1:0,y1:0,x2:(46*Math.cos(a)).toFixed(2),y2:(46*Math.sin(a)).toFixed(2),'class':'spoke'}));
    }
  }
  spokes('spokeR'); spokes('spokeF');
  // 前景草丛（周期 140）
  var grng = lcg(778899);
  var grassLayer = tile(140, 14, -140, function(g){
    var gg = mk('g'); gg.setAttribute('class','grass');
    for(var t=0;t<4;t++){
      var tx = rr(grng,10,130);
      gg.appendChild(mk('path',{d:'M'+tx.toFixed(0)+' 700 C'+tx.toFixed(0)+' 678 '+rr(grng,tx-14,tx+14).toFixed(0)+' 664 '+rr(grng,tx-26,tx+26).toFixed(0)+' 650'}));
    }
    g.appendChild(gg);
  });
  $('foreground').appendChild(grassLayer);
  // 速度线
  var spd = $('speedLines');
  for(var sl=0; sl<9; sl++){
    var y = rnd(300,540);
    var l = mk('line',{x1:rnd(60,300),y1:y,x2:0,y2:y});
    l.setAttribute('x2',(parseFloat(l.getAttribute('x1'))+rnd(50,130)).toFixed(0));
    l.setAttribute('class','speedLine');
    l.setAttribute('data-o', rnd(0.35,1).toFixed(2));
    spd.appendChild(l);
  }

  /* ============ 元素引用 ============ */
  var actor=$('actor'), bike=$('bike'), head=$('head'), pouch=$('pouch'),
      wingNear=$('wingNear'), wingFar=$('wingFar'), legB=$('legBack'), legF=$('legFront'),
      spokeR=$('spokeR'), spokeF=$('spokeF'), crank=$('crank'), pedals=$('pedals'),
      chainTop=$('chainTop'), chainBot=$('chainBot'), mouth=$('mouth'),
      shadow=$('shadow'), fx=$('fx'), groundG=$('ground'), railG=$('railPosts'),
      waveG=$('waves'), cloudG=$('clouds'), sunG=$('celestial'),
      speedG=$('speedLines'), lampsG=$('lamps'), grassG=$('foreground');

  var faces = {normal:$('eyeNormal'), wide:$('eyeWide'), happy:$('eyeHappy'), tired:$('eyeTired')};
  function setFace(f){
    for(var k in faces) faces[k].style.display = (k===f?'':'none');
  }

  /* ============ 状态 ============ */
  var ST = {
    speed:62, dist:0, cur:0, stamina:100, fish:0,
    sprintT:0, stun:0, happyT:0, mouth:0, fishBusy:false,
    time:'day', road:'smooth', face:'normal'
  };
  var last = 0, time = 0, spawnAcc = 0, sweatAcc = 0, dustAcc = 0;

  /* ============ 粒子系统 ============ */
  var parts = [];
  function addPart(p){ parts.push(p); fx.appendChild(p.el); }
  function removePart(p){ if(p.el.parentNode) p.el.parentNode.removeChild(p.el); }

  function feather(x,y){
    var g = mk('g');
    g.appendChild(mk('path',{d:'M0 0 C10 -7 22 -6 28 0 C22 6 10 7 0 0 Z',fill:'#fffaf0',stroke:'#e2d7bf','stroke-width':'1.5'}));
    g.appendChild(mk('line',{x1:2,y1:0,x2:26,y2:0,stroke:'#d8cbb0','stroke-width':'1.2'}));
    addPart({el:g,x:x,y:y,vx:rnd(-40,10),vy:rnd(-120,-50),rot:rnd(-40,40),rotV:rnd(-140,140),life:0,max:rnd(1.2,2.1),type:'feather'});
  }
  function sweat(x,y){
    var p = mk('path',{d:'M0 -11 C6 -3 9 2 9 6 A9 9 0 1 1 -9 6 C-9 2 -6 -3 0 -11 Z',fill:'#8fd3ff',opacity:'.9'});
    addPart({el:p,x:x,y:y,vx:rnd(-30,30),vy:rnd(40,110),rot:0,rotV:0,life:0,max:rnd(.6,1.1),type:'sweat'});
  }
  function heart(x,y){
    var p = mk('path',{d:'M0 10 C-14 0 -13 -12 -5 -12 C-1 -12 0 -9 0 -8 C0 -9 1 -12 5 -12 C13 -12 14 0 0 10 Z',fill:'#ff6f8b'});
    addPart({el:p,x:x,y:y,vx:rnd(-24,24),vy:rnd(-110,-60),rot:rnd(-25,25),rotV:rnd(-90,90),life:0,max:rnd(.9,1.5),type:'heart'});
  }
  function dust(x,y){
    var p = mk('ellipse',{rx:9,ry:6,fill:'#e9d3ab',opacity:'.75'});
    addPart({el:p,x:x,y:y,vx:rnd(-90,-30),vy:rnd(-40,-10),rot:0,rotV:0,life:0,max:rnd(.5,.9),type:'dust',sw:rnd(4,9)});
  }
  function ring(x,y,color){
    var c = mk('circle',{cx:0,cy:0,r:6,stroke:color,'stroke-width':'4',fill:'none'});
    addPart({el:c,x:x,y:y,vx:0,vy:0,rot:0,rotV:0,life:0,max:.85,type:'ring'});
  }
  function floatText(x,y,txt,color){
    var t = mk('text',{x:0,y:0,'class':'txt'});
    t.setAttribute('fill', color||'#fff');
    t.textContent = txt;
    addPart({el:t,x:x,y:y,vx:rnd(-14,14),vy:rnd(-64,-38),rot:0,rotV:0,life:0,max:1.3,type:'text'});
  }

  /* ============ 音效：纯代码合成车铃 ============ */
  var actx = null;
  function audio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ actx = new AC(); }catch(e){ actx = null; }
    }
    if(actx && actx.state === 'suspended' && actx.resume){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  function ringBell(){
    var ctx = audio(); if(!ctx) return;
    var t0 = ctx.currentTime;
    var master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, t0);
    master.gain.exponentialRampToValueAtTime(0.55, t0+0.008);
    master.gain.exponentialRampToValueAtTime(0.0001, t0+1.35);
    master.connect(ctx.destination);
    var freqs=[2093,3136,4186,6272];
    for(var i=0;i<freqs.length;i++){
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(freqs[i],t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.85/(i+1),t0+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.0-i*0.2);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+1.4);
    }
    // 金属撞击的瞬态噪声
    var len = Math.floor(ctx.sampleRate*0.07);
    var buf = ctx.createBuffer(1,len,ctx.sampleRate);
    var dat = buf.getChannelData(0);
    for(var k=0;k<len;k++) dat[k] = (Math.random()*2-1)*Math.pow(1-k/len,2);
    var src=ctx.createBufferSource(); src.buffer=buf;
    var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=3200;
    var ng=ctx.createGain(); ng.gain.setValueAtTime(0.3,t0); ng.gain.exponentialRampToValueAtTime(0.0001,t0+0.09);
    src.connect(hp); hp.connect(ng); ng.connect(master); src.start(t0);
    // 回响
    var o2=ctx.createOscillator(), g2=ctx.createGain();
    o2.type='sine'; o2.frequency.value=3136;
    g2.gain.setValueAtTime(0.0001,t0+0.10);
    g2.gain.exponentialRampToValueAtTime(0.16,t0+0.115);
    g2.gain.exponentialRampToValueAtTime(0.0001,t0+0.9);
    o2.connect(g2); g2.connect(master); o2.start(t0+0.10); o2.stop(t0+1.0);
  }

  /* ============ 交互 ============ */
  var hintEl = $('hint'), moodEl = $('mood');
  var HINTS = {
    bell:'<b>叮！</b>鹈鹕吓得一哆嗦，撒腿就跑——顺便还加速了。',
    sprint:'冲刺开始！翅膀狂扇、羽毛乱飞，体力急速消耗。',
    feed:'小鱼入喉！鹈鹕精神一振，体力回升。',
    time:'换了一片天色——光线、星星与路灯都跟着变了。',
    road:'石子路开跑！颠得厉害，鹈鹕连叫唤带喘气。',
    smooth:'换回平路，鹈鹕终于能优雅地小跑一段。'
  };
  function say(k){ hintEl.innerHTML = HINTS[k]; }

  $('btnBell').addEventListener('click', function(){
    ringBell();
    ST.stun = 1.1; ST.happyT = 0;
    ring(546,190,'#ffe27a'); ring(546,190,'#fff');
    floatText(590,150,'叮！','#ffe27a');
    for(var i=0;i<7;i++) feather(rnd(380,620),rnd(300,380));
    say('bell');
  });

  $('btnSprint').addEventListener('click', function(){
    if(ST.stamina < 12){ floatText(700,300,'没力气啦…','#ffc14d'); return; }
    ST.sprintT = 3.4;
    say('sprint');
  });

  $('btnFeed').addEventListener('click', function(){
    if(ST.fishBusy) return;
    ST.fishBusy = true;
    var g = mk('g');
    g.appendChild(mk('ellipse',{cx:0,cy:0,rx:17,ry:9,'class':'fishBody'}));
    g.appendChild(mk('path',{d:'M-15 0 L-31 -11 L-31 11 Z','class':'fishTail'}));
    g.appendChild(mk('circle',{cx:9,cy:-2,r:2.4,'class':'fishEye'}));
    fx.appendChild(g);
    var t=0, dur=0.95;
    var p0={x:1140,y:120}, p1={x:960,y:330}, p2={x:806,y:206};
    function step(){
      t += 1/60;
      var u = Math.min(1,t/dur), iu = 1-u;
      var x = iu*iu*p0.x + 2*iu*u*p1.x + u*u*p2.x;
      var y = iu*iu*p0.y + 2*iu*u*p1.y + u*u*p2.y;
      var ang = Math.atan2((p2.y-p0.y),(p2.x-p0.x))*180/Math.PI + Math.sin(u*Math.PI)*-12;
      g.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') rotate('+ang.toFixed(1)+')');
      if(u<1){ requestAnimationFrame(step); }
      else{
        fx.removeChild(g);
        ST.fish++; ST.stamina = Math.min(100, ST.stamina + 32);
        ST.happyT = 2.0; ST.mouth = 1;
        heart(772,212); heart(824,190); heart(742,242);
        floatText(700,148,'+32 体力','#8ff0a5');
        say('feed');
        ST.fishBusy = false;
      }
    }
    step();
  });

  var times = ['day','dusk','night'], timeNames = {day:'晴天', dusk:'黄昏', night:'夜晚'};
  $('btnTime').addEventListener('click', function(){
    ST.time = times[(times.indexOf(ST.time)+1)%times.length];
    document.body.setAttribute('data-time', ST.time);
    $('timeLabel').textContent = timeNames[ST.time];
    if(ST.time==='dusk'){
      sunG.setAttribute('transform','translate(0,120) translate(985,95) scale(1.3) translate(-985,-95)');
    } else if(ST.time==='night'){
      sunG.setAttribute('transform','translate(-120,-30) translate(985,95) scale(0.68) translate(-985,-95)');
    } else {
      sunG.setAttribute('transform','');
    }
    say('time');
  });

  var roads = ['smooth','cobble'], roadNames={smooth:'平路', cobble:'石子路'};
  $('btnRoad').addEventListener('click', function(){
    ST.road = roads[(roads.indexOf(ST.road)+1)%roads.length];
    document.body.setAttribute('data-road', ST.road);
    $('roadLabel').textContent = roadNames[ST.road];
    say(ST.road==='cobble'?'road':'smooth');
  });

  var slider = $('speed');
  slider.addEventListener('input', function(){
    ST.speed = parseFloat(slider.value);
    $('speedLabel').textContent = Math.round(ST.speed);
  });

  document.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); $('btnBell').click(); }
    else if(e.key === 'f' || e.key === 'F') $('btnFeed').click();
    else if(e.key === 's' || e.key === 'S') $('btnSprint').click();
  });

  /* ============ 主循环 ============ */
  function frame(now){
    if(!last) last = now;
    var dt = Math.min(0.05,(now-last)/1000);
    last = now; time += dt;
    update(dt);
    render(dt);
    requestAnimationFrame(frame);
  }

  function update(dt){
    var sprinting = ST.sprintT > 0 && ST.stamina > 0;
    if(sprinting){ ST.sprintT -= dt; ST.stamina -= 25*dt; }
    else if(ST.speed > 78){ ST.stamina -= 5*dt; }
    else { ST.stamina += (ST.speed < 42 ? 14 : 6)*dt; }
    if(ST.stamina <= 0){ ST.stamina = 0; ST.sprintT = 0; }

    var base = ST.speed/100*185;
    if(ST.stamina <= 0.5) base *= 0.42;
    var target = base * (sprinting ? 1.55 : 1) + (sprinting ? 55 : 0);
    if(ST.stun > 0) target = Math.max(target, 150);
    ST.cur += (target - ST.cur) * Math.min(1, dt*3.4);
    ST.dist += ST.cur * dt;

    if(ST.stun > 0) ST.stun -= dt;
    if(ST.happyT > 0) ST.happyT -= dt;
    if(ST.mouth > 0) ST.mouth -= dt*1.4;

    var f = 'normal';
    if(ST.stun > 0) f = 'wide';
    else if(ST.stamina < 28) f = 'tired';
    else if(ST.happyT > 0) f = 'happy';
    if(f !== ST.face){ setFace(f); ST.face = f; }
  }

  function render(dt){
    var sprinting = ST.sprintT > 0;
    var cobble = ST.road === 'cobble';
    var phase = (ST.dist/120)*Math.PI*2;
    var jit = cobble ? (Math.sin(ST.dist*0.52)*3.2 + Math.sin(ST.dist*1.63)*1.5) : 0;
    var bob = -Math.abs(Math.sin(phase))*6 + jit*0.55;
    var tilt = Math.sin(phase)*2.1 + jit*0.9 + (sprinting ? -4.5 : 0);

    actor.setAttribute('transform','translate(0,'+bob.toFixed(2)+') rotate('+tilt.toFixed(2)+',520,470)');
    bike.setAttribute('transform','rotate('+(tilt*-0.55).toFixed(2)+',478,262)');

    // 车轮 / 曲柄 / 链条
    var wDeg = -(ST.dist/54)*180/Math.PI;
    spokeR.setAttribute('transform','rotate('+wDeg.toFixed(2)+')');
    spokeF.setAttribute('transform','rotate('+wDeg.toFixed(2)+')');
    var cDeg = wDeg*0.42;
    crank.setAttribute('transform','rotate('+cDeg.toFixed(2)+')');
    pedals.setAttribute('transform','rotate('+(-cDeg).toFixed(2)+')');
    chainTop.setAttribute('stroke-dashoffset', (-(ST.dist*0.9)%14).toFixed(1));
    chainBot.setAttribute('stroke-dashoffset', (-(ST.dist*0.9)%14).toFixed(1));

    // 腿
    legB.setAttribute('transform','rotate('+(Math.sin(phase)*24).toFixed(2)+',468,490)');
    legF.setAttribute('transform','rotate('+(-Math.sin(phase)*24).toFixed(2)+',576,486)');

    // 翅膀
    var flap = Math.sin(phase*2+0.5)*(4 + (sprinting?11:0));
    wingNear.setAttribute('transform','rotate('+(44+flap).toFixed(2)+',480,378)');
    wingFar.setAttribute('transform','rotate('+(10-flap*0.7).toFixed(2)+',486,372)');

    // 喉囊
    var pant = ST.stamina < 58 ? (1-ST.stamina/58) : 0;
    var ps = 1 + Math.sin(phase*2)*0.05 + pant*0.16 + (ST.happyT>0?0.04:0);
    pouch.setAttribute('transform','translate(760,222) scale('+(1/ps).toFixed(3)+','+ps.toFixed(3)+') translate(-760,-222)');

    // 头
    head.setAttribute('transform','translate(0,'+(Math.sin(phase*2)*3).toFixed(2)+') rotate('+(Math.sin(phase)*2+(sprinting?4:0)).toFixed(2)+',640,320)');

    // 张嘴
    var openAmt = Math.max(ST.stun>0?0.9:0, ST.mouth>0?1:0, pant*0.75);
    mouth.setAttribute('opacity', openAmt.toFixed(2));

    // 阴影
    shadow.setAttribute('rx', (152 - Math.max(0,-bob)*3.2).toFixed(1));

    // 视差滚动（各层周期与其平铺周期一致 → 无缝）
    groundG.setAttribute('transform','translate('+(-(ST.dist%300)).toFixed(1)+',0)');
    railG.setAttribute('transform','translate('+(-(ST.dist*0.8%150)).toFixed(1)+',0)');
    lampsG.setAttribute('transform','translate('+(-(ST.dist*0.8%520)).toFixed(1)+',0)');
    waveG.setAttribute('transform','translate('+(-(ST.dist*0.22%260)).toFixed(1)+',0)');
    cloudG.setAttribute('transform','translate('+(-(ST.dist*0.09%1300)).toFixed(1)+',0)');
    grassG.setAttribute('transform','translate('+(-(ST.dist*1.6%140)).toFixed(1)+',0)');

    // 速度线
    var spdOn = ST.cur > 130 ? Math.min(1,(ST.cur-130)/90) : 0;
    for(var i=0;i<speedG.childNodes.length;i++){
      var ln = speedG.childNodes[i];
      if(ln.nodeType !== 1) continue;
      ln.setAttribute('opacity', (spdOn*parseFloat(ln.getAttribute('data-o'))).toFixed(2));
      ln.setAttribute('x1', (parseFloat(ln.getAttribute('x1')) - ST.cur*0.6).toFixed(0));
      ln.setAttribute('x2', (parseFloat(ln.getAttribute('x2')) - ST.cur*0.6).toFixed(0));
      if(parseFloat(ln.getAttribute('x1')) < -160){ ln.setAttribute('x1', 1250); ln.setAttribute('x2', 1300); }
    }

    // 粒子生成
    spawnAcc += dt;
    if(sprinting && spawnAcc > 0.12){ spawnAcc = 0; feather(rnd(380,600),rnd(300,380)); }
    if(ST.stamina < 45){ sweatAcc += dt; if(sweatAcc>0.34){ sweatAcc=0; sweat(rnd(662,700),rnd(178,214)); } }
    if(ST.cur > 110){ dustAcc += dt; if(dustAcc>0.10){ dustAcc=0; dust(rnd(440,600),558); } }

    // 粒子更新
    for(var p=parts.length-1;p>=0;p--){
      var q = parts[p];
      q.life += dt;
      if(q.life >= q.max){ removePart(q); parts.splice(p,1); continue; }
      var u = q.life/q.max;
      if(q.type==='ring'){
        q.el.setAttribute('r', (6 + u*58).toFixed(1));
        q.el.setAttribute('opacity',(1-u).toFixed(2));
        q.el.setAttribute('stroke-width',(4*(1-u)+1).toFixed(1));
      } else if(q.type==='feather'){
        q.vy += 26*dt; q.vx *= 0.99;
        q.x += q.vx*dt; q.y += q.vy*dt; q.rot += q.rotV*dt;
        q.el.setAttribute('transform','translate('+q.x.toFixed(1)+','+q.y.toFixed(1)+') rotate('+q.rot.toFixed(1)+')');
        q.el.setAttribute('opacity',(1-u*u).toFixed(2));
      } else if(q.type==='text'){
        q.x += q.vx*dt; q.y += q.vy*dt;
        q.el.setAttribute('transform','translate('+q.x.toFixed(1)+','+q.y.toFixed(1)+')');
        q.el.setAttribute('opacity',(1-u).toFixed(2));
      } else {
        q.vy += (q.type==='sweat'?420:160)*dt;
        q.x += q.vx*dt; q.y += q.vy*dt;
        q.el.setAttribute('transform','translate('+q.x.toFixed(1)+','+q.y.toFixed(1)+')');
        q.el.setAttribute('opacity',(1-u).toFixed(2));
        if(q.type==='dust'){
          q.el.setAttribute('rx',(q.sw*(1+u*1.8)).toFixed(1));
          q.el.setAttribute('ry',(q.sw*0.6*(1+u*1.8)).toFixed(1));
        }
      }
    }

    // HUD
    var st = Math.max(0,ST.stamina);
    $('staminaVal').textContent = Math.round(st);
    var fill = $('staminaFill');
    fill.style.width = st.toFixed(0)+'%';
    fill.className = 'fill' + (st<35?' low':'');
    $('speedVal').textContent = Math.round(ST.cur*0.42);
    $('distVal').textContent = Math.round(ST.dist/50);
    $('fishVal').textContent = ST.fish;
    var mood = '神气活现';
    if(ST.stun>0) mood = '受到惊吓！';
    else if(sprinting) mood = '拼命冲刺中';
    else if(ST.stamina<28) mood = '累到发抖';
    else if(ST.stamina<58) mood = '呼哧呼哧喘气';
    else if(ST.happyT>0) mood = '吃到小鱼啦';
    else if(ST.speed<10) mood = '站着发呆';
    moodEl.textContent = mood;
  }

  // 初始化
  setFace('normal');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
