<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>一辆自行车正在骑着一只鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
  :root {
    --bg-sky-day: #89d6ff;
    --bg-sky-dusk: #ffb978;
    --bg-sky-night: #0b1530;
    --bg-sea-day: #2d90c5;
    --bg-sea-dusk: #276a9d;
    --bg-sea-night: #071220;
    --wood-light: #d9a066;
    --wood-dark: #a76b37;
    --ui-bg: rgba(16, 20, 40, 0.85);
    --ui-border: rgba(255,255,255,0.2);
    --accent: #ffd85c;
    --accent-strong: #ff6c53;
    --text-main: #f3f5ff;
    --text-muted: #9ca6cf;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #02040a;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-main);
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: stretch;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 50% -10%, #ffffff33, transparent 65%),
                linear-gradient(#091018, #050711 60%, #020308);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* UI Panel */
  .ui-panel {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 260px;
    max-width: calc(100vw - 40px);
    background: var(--ui-bg);
    border-radius: 16px;
    border: 1px solid var(--ui-border);
    backdrop-filter: blur(18px);
    padding: 14px 14px 10px;
    box-shadow:
      0 22px 45px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.02);
  }

  .ui-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .ui-title-main {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: #fefefe;
  }

  .ui-title-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .ui-section {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .label-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .label-row span.value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, #4c7bff, #ffb457);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1a244b;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #1a244b;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, #4c7bff, #ffb457);
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  button {
    flex: 1;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    background: radial-gradient(circle at 20% 0, rgba(255,255,255,0.25), transparent 65%),
                linear-gradient(120deg, #27335a, #1b233f);
    color: #fdfdfd;
    font-size: 11px;
    font-weight: 500;
    padding: 8px 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: transform .12s ease-out, box-shadow .12s ease-out, border-color .12s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.45);
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }

  button.small {
    flex: 0 0 auto;
    padding: 6px 10px;
    font-size: 10px;
  }

  button.primary {
    background: radial-gradient(circle at 10% 0, rgba(255,255,255,0.35), transparent 55%),
                linear-gradient(120deg, #ffb347, #ff6c53);
    border-color: rgba(255,255,255,0.25);
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 7px 18px rgba(0,0,0,0.55);
    border-color: rgba(255,255,255,0.35);
  }

  button:active {
    transform: translateY(1px) scale(.98);
    box-shadow: 0 3px 8px rgba(0,0,0,0.7) inset;
  }

  .pill-toggle {
    display: inline-flex;
    background: rgba(5,8,20,0.9);
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 2px;
    gap: 2px;
  }

  .pill-toggle button {
    box-shadow: none;
    flex: 1;
    padding: 4px 6px;
    border-radius: 999px;
    border: none;
    background: transparent;
    font-size: 10px;
    color: var(--text-muted);
    text-shadow: none;
  }

  .pill-toggle button.active {
    background: linear-gradient(120deg, #4c7bff, #8f7bff);
    color: #fff;
  }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-meter {
    flex: 1;
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .status-meter-fill {
    position: absolute;
    inset: 0;
    width: 60%;
    border-radius: inherit;
    background: linear-gradient(90deg, #50e3a4, #ffe96a, #ff6c53);
    transform-origin: left center;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #50e3a4;
    box-shadow: 0 0 6px #50e3a4;
  }

  /* Tooltip / hint */
  .hint {
    position: absolute;
    left: 20px;
    bottom: 20px;
    max-width: 280px;
    font-size: 11px;
    line-height: 1.4;
    color: var(--text-muted);
    background: rgba(3,5,14,0.85);
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 10px;
    backdrop-filter: blur(10px);
  }
  .hint strong {
    color: var(--accent);
    font-weight: 600;
  }
  .hint kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 10px;
    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.45);
  }

  @media (max-width: 720px) {
    .ui-panel {
      right: 10px;
      top: 10px;
      width: 220px;
      padding: 10px 10px 8px;
    }
    .hint {
      left: 10px;
      bottom: 10px;
      max-width: 250px;
    }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div class="ui-panel">
    <div class="ui-title">
      <div class="ui-title-main">Bicycle Riding a Pelican</div>
      <div class="ui-title-sub">跨种族耐力赛 · 木栈道专场</div>
    </div>

    <div class="ui-section">
      <div class="label-row">
        <span>巡航速度</span>
        <span class="value"><span id="speedLabel">1.6</span>×</span>
      </div>
      <div class="slider-wrap">
        <input id="speedSlider" type="range" min="0.5" max="3" step="0.1" value="1.6" />
      </div>
    </div>

    <div class="ui-section">
      <div class="label-row">
        <span>手动操作</span>
        <span class="value">铃声 / 冲刺 / 投喂</span>
      </div>
      <div class="btn-row">
        <button id="bellBtn" class="small primary">🔔 按车铃</button>
        <button id="dashBtn" class="small">⚡ 冲刺</button>
        <button id="feedBtn" class="small">🐟 投喂</button>
      </div>
      <div class="status-bar">
        <span style="font-size:10px;">鹈鹕体力</span>
        <div class="status-meter">
          <div id="energyFill" class="status-meter-fill"></div>
        </div>
        <div id="energyDot" class="status-dot"></div>
      </div>
    </div>

    <div class="ui-section">
      <div class="label-row">
        <span>天气与路况</span>
        <span class="value" id="modeLabel">晴天 · 平整木栈道</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;gap:6px;">
        <div class="pill-toggle" id="timeToggle" style="flex:1.4;">
          <button data-mode="day" class="active">☀ 日间</button>
          <button data-mode="dusk">🌆 黄昏</button>
          <button data-mode="night">🌙 夜晚</button>
        </div>
        <div class="pill-toggle" id="roadToggle" style="flex:1;">
          <button data-road="smooth" class="active">平路</button>
          <button data-road="bumpy">颠簸</button>
        </div>
      </div>
    </div>
  </div>

  <div class="hint">
    <strong>操作提示：</strong>
    <div>• <kbd>🔔 按车铃</kbd>：听铃声，看鹈鹕被吓到瞬间加速。</div>
    <div>• <kbd>⚡ 冲刺</kbd>：短暂爆发速度，消耗体力。</div>
    <div>• <kbd>🐟 投喂</kbd>：往喉囊扔小鱼，体力恢复，步伐轻快。</div>
    <div>• 调整滑块体验不同节奏；切换天气与路况，看背景与颠簸变化。</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let width = 0, height = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // UI elements
  const speedSlider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  const bellBtn = document.getElementById('bellBtn');
  const dashBtn = document.getElementById('dashBtn');
  const feedBtn = document.getElementById('feedBtn');
  const energyFill = document.getElementById('energyFill');
  const energyDot = document.getElementById('energyDot');
  const modeLabel = document.getElementById('modeLabel');
  const timeToggle = document.getElementById('timeToggle');
  const roadToggle = document.getElementById('roadToggle');

  // Simulation state
  let baseSpeed = parseFloat(speedSlider.value); // 0.5~3
  let dashBoost = 0;
  let dashTime = 0;
  let bellShake = 0;
  let bellTime = 0;
  let worldTime = 0;
  let pelicanEnergy = 0.75; // 0~1
  let feedEffect = 0;
  let roadMode = 'smooth';
  let timeMode = 'day';
  let wobblePhase = 0;

  // Background parallax objects
  const clouds = [];
  const feathers = [];
  function initParallax() {
    clouds.length = 0;
    feathers.length = 0;
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * 1,
        y: 0.1 + Math.random() * 0.35,
        scale: 0.6 + Math.random() * 0.8,
        speed: 0.01 + Math.random() * 0.02
      });
    }
    for (let i = 0; i < 20; i++) {
      feathers.push({
        x: Math.random() * 1,
        y: Math.random() * 0.7,
        vy: 0.05 + Math.random() * 0.1,
        vx: -0.03 + Math.random() * 0.06,
        size: 4 + Math.random() * 6,
        life: Math.random()
      });
    }
  }
  initParallax();

  // Web Audio - bell
  let audioCtx = null;
  function pingBell() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      const ctxA = audioCtx;
      const now = ctxA.currentTime;
      const freqBase = 2200;
      const osc1 = ctxA.createOscillator();
      const gain1 = ctxA.createGain();
      const osc2 = ctxA.createOscillator();
      const gain2 = ctxA.createGain();

      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(freqBase, now);
      osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);

      osc2.type = 'square';
      osc2.frequency.setValueAtTime(freqBase * 1.5, now);
      osc2.frequency.exponentialRampToValueAtTime(1700, now + 0.2);
      gain2.gain.setValueAtTime(0.18, now);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);

      const mixGain = ctxA.createGain();
      mixGain.gain.value = 0.8;

      osc1.connect(gain1);
      osc2.connect(gain2);
      gain1.connect(mixGain);
      gain2.connect(mixGain);
      mixGain.connect(ctxA.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.35);
      osc2.stop(now + 0.3);
    } catch (e) {
      /* ignore audio errors to keep console clean */
    }
  }

  function clamp01(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  // UI bindings
  speedSlider.addEventListener('input', () => {
    baseSpeed = parseFloat(speedSlider.value);
    speedLabel.textContent = baseSpeed.toFixed(1);
  });

  bellBtn.addEventListener('click', () => {
    pingBell();
    bellShake = 1;
    bellTime = 0.25;
    dashBoost = Math.max(dashBoost, 0.4);
    dashTime = Math.max(dashTime, 0.3);
  });

  dashBtn.addEventListener('click', () => {
    if (pelicanEnergy <= 0.1) return;
    dashBoost = Math.max(dashBoost, 1.2);
    dashTime = Math.max(dashTime, 0.9);
    pelicanEnergy = Math.max(0, pelicanEnergy - 0.18);
  });

  feedBtn.addEventListener('click', () => {
    pelicanEnergy = clamp01(pelicanEnergy + 0.25);
    feedEffect = 1;
  });

  timeToggle.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    [...timeToggle.querySelectorAll('button')].forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    timeMode = e.target.dataset.mode;
    updateModeLabel();
  });

  roadToggle.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    [...roadToggle.querySelectorAll('button')].forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    roadMode = e.target.dataset.road;
    updateModeLabel();
  });

  function updateModeLabel() {
    const tMap = { day: '晴天', dusk: '黄昏', night: '夜晚' };
    const rMap = { smooth: '平整木栈道', bumpy: '颠簸石子路' };
    modeLabel.textContent = `${tMap[timeMode]} · ${rMap[roadMode]}`;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawBackground(dt) {
    const t = worldTime;
    let skyTop, skyBottom, seaColor;
    if (timeMode === 'day') {
      skyTop = '#d9f3ff';
      skyBottom = '#4aa1e0';
      seaColor = '#287fb8';
    } else if (timeMode === 'dusk') {
      skyTop = '#ffe0b8';
      skyBottom = '#f96d4c';
      seaColor = '#204b7a';
    } else {
      skyTop = '#050c1c';
      skyBottom = '#020414';
      seaColor = '#030b18';
    }

    // Sky gradient
    const gradSky = ctx.createLinearGradient(0, 0, 0, height * 0.7);
    gradSky.addColorStop(0, skyTop);
    gradSky.addColorStop(1, skyBottom);
    ctx.fillStyle = gradSky;
    ctx.fillRect(0, 0, width, height * 0.7);

    // Clouds
    clouds.forEach(c => {
      c.x += c.speed * dt * 0.03;
      if (c.x > 1.2) c.x = -0.2;
      const cx = c.x * width;
      const cy = c.y * height;
      const s = 80 * c.scale;
      const alpha = timeMode === 'night' ? 0.22 : 0.5;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, s, s * 0.45, 0, 0, Math.PI * 2);
      ctx.ellipse(-s * 0.6, 5, s * 0.6, s * 0.35, 0, 0, Math.PI * 2);
      ctx.ellipse(s * 0.6, 4, s * 0.7, s * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Sun / moon
    if (timeMode === 'day' || timeMode === 'dusk') {
      const sunX = width * 0.14;
      const sunY = height * 0.16;
      const r = 40;
      const gradSun = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, r);
      gradSun.addColorStop(0, 'rgba(255,255,255,0.95)');
      gradSun.addColorStop(0.4, 'rgba(255,245,220,0.9)');
      gradSun.addColorStop(1, 'rgba(255,196,140,0)');
      ctx.fillStyle = gradSun;
      ctx.beginPath();
      ctx.arc(sunX, sunY, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const moonX = width * 0.18;
      const moonY = height * 0.14;
      ctx.save();
      ctx.fillStyle = '#f3f8ff';
      ctx.beginPath();
      ctx.arc(moonX, moonY, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(moonX + 7, moonY - 2, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // simple stars
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97.13 % 1) * width;
        const sy = ((i * 31.7 + 50) % 1) * height * 0.4;
        const tw = (Math.sin(t * 2 + i) * 0.5 + 0.5) * 0.6 + 0.2;
        ctx.globalAlpha = 0.3 + tw * 0.7;
        ctx.fillRect(sx, sy, 1, 1);
      }
      ctx.globalAlpha = 1;
    }

    // Sea band
    const seaTop = height * 0.55;
    const seaBottom = height * 0.78;
    const gradSea = ctx.createLinearGradient(0, seaTop, 0, seaBottom);
    gradSea.addColorStop(0, seaColor);
    gradSea.addColorStop(1, '#041b2b');
    ctx.fillStyle = gradSea;
    ctx.fillRect(0, seaTop, width, seaBottom - seaTop);

    // Sea waves
    ctx.save();
    ctx.beginPath();
    const waveBaseY = seaTop + 15;
    ctx.moveTo(0, waveBaseY);
    const waveAmp = 5;
    const waveLen = 90;
    for (let x = 0; x <= width; x += 6) {
      const y = waveBaseY + Math.sin((x / waveLen) * Math.PI * 2 + t * 1.2) * waveAmp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(width, seaTop - 30);
    ctx.lineTo(0, seaTop - 30);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.globalAlpha = timeMode === 'night' ? 0.25 : 0.4;
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    // Feathers / sweat droplets
    feathers.forEach(f => {
      f.life += dt * 0.12;
      if (f.life > 1.1) {
        f.life = 0;
        f.x = Math.random() * 1;
        f.y = 0.1 + Math.random() * 0.4;
      }
      f.x += f.vx * dt * 0.04;
      f.y += f.vy * dt * 0.04;
      const alpha = 0.4 * (1 - f.life);
      const px = f.x * width;
      const py = f.y * height;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(-0.4);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, f.size * 0.4, f.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // Wooden boardwalk
    const boardTop = height * 0.66;
    const boardBottom = height * 0.95;
    ctx.fillStyle = '#5a3c24';
    ctx.fillRect(0, boardTop, width, boardBottom - boardTop);

    const plankCount = 40;
    const plankHeight = (boardBottom - boardTop) / plankCount;
    const scroll = t * (0.6 + baseSpeed * 0.3 + dashBoost * 0.5);
    for (let i = -2; i < plankCount + 2; i++) {
      const offset = (i + (scroll % 1)) * plankHeight;
      const y = boardTop + offset;
      const shade = i % 2 === 0 ? '#c78f59' : '#b57c45';
      ctx.fillStyle = shade;
      ctx.fillRect(0, y, width, plankHeight + 1);

      // Board grain
      ctx.strokeStyle = 'rgba(0,0,0,0.14)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, y + plankHeight * 0.3);
      ctx.lineTo(width, y + plankHeight * 0.3);
      ctx.moveTo(0, y + plankHeight * 0.7);
      ctx.lineTo(width, y + plankHeight * 0.7);
      ctx.stroke();
    }

    // Horizon guard rail
    const railY = boardTop - 8;
    ctx.strokeStyle = 'rgba(52,35,21,0.9)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(0, railY);
    ctx.lineTo(width, railY);
    ctx.stroke();
  }

  function drawPelicanAndBike(dt) {
    const midX = width * 0.5;
    const groundY = height * 0.8;
    const speedFactor = baseSpeed + dashBoost * 0.8;

    // Gait / bounce
    wobblePhase += dt * 4 * (0.6 + speedFactor * 0.6);
    const bounceAmp = roadMode === 'bumpy' ? 18 : 12;
    const verticalBounce = Math.sin(wobblePhase) * bounceAmp;
    const bodyY = groundY - 120 + verticalBounce * 0.4;
    const bodyTilt = Math.sin(wobblePhase * 0.5) * 0.1 + dashBoost * 0.12;

    // Leg stretch length determined by energy
    const stride = 14 + speedFactor * 6;
    const fatigueDrop = (1 - pelicanEnergy) * 8;

    ctx.save();
    ctx.translate(midX, bodyY);
    ctx.rotate(bodyTilt);

    // Draw legs
    function drawLeg(offsetX, phase) {
      ctx.save();
      ctx.translate(offsetX, 40);
      const step = Math.sin(wobblePhase + phase) * stride;
      const kneeY = 18 + Math.max(0, -step * 0.6);
      const ankleY = 36 + Math.max(0, step) + fatigueDrop;
      const footY = 56 + fatigueDrop;
      const footX = step * 0.4;

      ctx.lineCap = 'round';
      ctx.strokeStyle = '#f3a94b';
      ctx.lineWidth = 6;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, kneeY);
      ctx.lineTo(step * 0.3, ankleY);
      ctx.lineTo(footX, footY);
      ctx.stroke();

      // Webbed foot
      ctx.fillStyle = '#f3a94b';
      ctx.beginPath();
      ctx.moveTo(footX - 10, footY);
      ctx.lineTo(footX + 14, footY);
      ctx.lineTo(footX + 4, footY + 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    drawLeg(-22, 0);
    drawLeg(22, Math.PI);

    // Tail
    ctx.save();
    ctx.translate(-60, 0);
    ctx.rotate(-0.2 + Math.sin(wobblePhase * 0.5) * 0.05);
    ctx.fillStyle = '#f4f5f7';
    ctx.beginPath();
    ctx.moveTo(-30, 0);
    ctx.lineTo(10, -14);
    ctx.lineTo(6, 10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Body
    ctx.save();
    ctx.fillStyle = '#f9fafc';
    ctx.strokeStyle = 'rgba(180,190,210,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 70, 42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Chest shading
    ctx.save();
    ctx.fillStyle = 'rgba(226,234,245,0.9)';
    ctx.beginPath();
    ctx.ellipse(10, 10, 45, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Wings
    function drawWing(side) {
      ctx.save();
      const flap = Math.sin(wobblePhase * 1.3) * (roadMode === 'bumpy' ? 0.3 : 0.2) + dashBoost * 0.2;
      const dir = side === 'left' ? -1 : 1;
      ctx.translate(10 * dir, -10);
      ctx.rotate(-0.2 * dir + flap * dir);
      const grad = ctx.createLinearGradient(0, 0, 60 * dir, 40);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#dde3f0');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(40 * dir, -30, 80 * dir, 0);
      ctx.quadraticCurveTo(40 * dir, 40, 0, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    drawWing('left');
    drawWing('right');

    // Neck & head
    ctx.save();
    ctx.translate(38, -12);
    const neckBob = Math.sin(wobblePhase * 1.1 + 0.4) * 6;
    ctx.translate(0, neckBob);
    ctx.rotate(-0.05 + dashBoost * 0.04);

    // Neck
    ctx.strokeStyle = '#f9fafc';
    ctx.lineWidth = 16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-30, -12);
    ctx.quadraticCurveTo(-10, -20, 10, -18);
    ctx.stroke();

    // Head base
    ctx.fillStyle = '#f9fafc';
    ctx.beginPath();
    ctx.ellipse(20, -24, 16, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.save();
    ctx.translate(26, -22);
    const jawOpen = 0.15 + (1 - pelicanEnergy) * 0.18 + dashBoost * 0.15 + (feedEffect * 0.08);
    const jawPhase = Math.max(0, Math.sin(wobblePhase * 2) * 0.35);
    const open = jawOpen + jawPhase;
    // Upper beak
    ctx.fillStyle = '#f2b24c';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(38, -6, 70, -10);
    ctx.quadraticCurveTo(42, 4, 0, 4);
    ctx.closePath();
    ctx.fill();
    // Lower beak + pouch
    ctx.save();
    ctx.translate(0, 1);
    ctx.rotate(open * 0.4);
    const pouchGrad = ctx.createLinearGradient(0, 0, 0, 40);
    pouchGrad.addColorStop(0, '#f4c15d');
    pouchGrad.addColorStop(1, '#f2a236');
    ctx.fillStyle = pouchGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(40, 8, 68, 4);
    ctx.quadraticCurveTo(32, 26, 4, 34);
    ctx.quadraticCurveTo(0, 24, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.restore();

    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(18, -30, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#151826';
    ctx.beginPath();
    const eyeStress = 1 - pelicanEnergy;
    ctx.arc(19, -30 + eyeStress * 1.3, 2.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(20.5, -31.5, 1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore(); // neck & head

    // Sweat drops if low energy
    if (pelicanEnergy < 0.35) {
      ctx.save();
      ctx.translate(52, -20);
      const dropCount = 3;
      for (let i = 0; i < dropCount; i++) {
        const offsetT = (i * 0.6 + worldTime * 1.4) % 1;
        const dy = offsetT * 28;
        const alpha = 1 - offsetT;
        ctx.globalAlpha = alpha * 0.7;
        ctx.fillStyle = 'rgba(182,220,255,0.95)';
        ctx.beginPath();
        ctx.ellipse(i * 6, dy, 3, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Bicycle rider
    ctx.save();
    ctx.translate(0, -50 + verticalBounce * -0.3);
    ctx.rotate(-bodyTilt * 0.6 + Math.sin(wobblePhase * 0.7) * 0.03);

    // Bike frame parameters
    const frameColor = '#37405a';
    const highlight = '#c9d3ff';

    // Wheels
    const wheelRadius = 32;
    const wheelGap = 70;
    const spin = worldTime * (4 + speedFactor * 4);
    function drawWheel(offsetX) {
      ctx.save();
      ctx.translate(offsetX, 0);
      ctx.rotate(spin);
      // tyre
      ctx.beginPath();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#12141f';
      ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2);
      ctx.stroke();
      // rim
      ctx.beginPath();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#f0f3ff';
      ctx.arc(0, 0, wheelRadius - 4, 0, Math.PI * 2);
      ctx.stroke();
      // spokes
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = '#c7d0f0';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (Math.PI * 2 / 8) * i;
        const x = Math.cos(ang) * (wheelRadius - 5);
        const y = Math.sin(ang) * (wheelRadius - 5);
        ctx.moveTo(0, 0);
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      // hub
      ctx.fillStyle = '#f6f7ff';
      ctx.beginPath();
      ctx.arc(0, 0, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    drawWheel(-wheelGap * 0.5);
    drawWheel(wheelGap * 0.5);

    // Chain & pedals
    ctx.save();
    ctx.translate(-wheelGap * 0.1, -8);
    const crankRadius = 10;
    const pedSpin = spin * 1.3;
    // chainring
    ctx.strokeStyle = '#2b3249';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, crankRadius + 4, 0, Math.PI * 2);
    ctx.stroke();
    // cranks
    ctx.strokeStyle = '#f0f3ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(pedSpin) * (crankRadius + 6), Math.sin(pedSpin) * (crankRadius + 6));
    ctx.lineTo(Math.cos(pedSpin + Math.PI) * (crankRadius + 6), Math.sin(pedSpin + Math.PI) * (crankRadius + 6));
    ctx.stroke();
    // pedals
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(pedSpin) * (crankRadius + 12), Math.sin(pedSpin) * (crankRadius + 12));
    ctx.lineTo(Math.cos(pedSpin) * (crankRadius + 20), Math.sin(pedSpin) * (crankRadius + 20));
    ctx.moveTo(Math.cos(pedSpin + Math.PI) * (crankRadius + 12), Math.sin(pedSpin + Math.PI) * (crankRadius + 12));
    ctx.lineTo(Math.cos(pedSpin + Math.PI) * (crankRadius + 20), Math.sin(pedSpin + Math.PI) * (crankRadius + 20));
    ctx.stroke();
    ctx.restore();

    // Frame triangle
    ctx.strokeStyle = frameColor;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-wheelGap * 0.5 + 6, -2);
    ctx.lineTo(0, -34);
    ctx.lineTo(wheelGap * 0.5 - 4, -6);
    ctx.stroke();
    // seat stay
    ctx.beginPath();
    ctx.moveTo(-wheelGap * 0.5 + 6, -2);
    ctx.lineTo(-8, -40);
    ctx.stroke();
    // chain stay
    ctx.beginPath();
    ctx.moveTo(-wheelGap * 0.5 + 6, -2);
    ctx.lineTo(-4, -8);
    ctx.lineTo(wheelGap * 0.5 - 4, -6);
    ctx.stroke();

    // Seat post and saddle
    ctx.beginPath();
    ctx.moveTo(-8, -40);
    ctx.lineTo(-8, -54);
    ctx.stroke();
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#111319';
    ctx.beginPath();
    ctx.moveTo(-22, -54);
    ctx.lineTo(4, -54);
    ctx.stroke();

    // Handlebar and "reins"
    ctx.strokeStyle = frameColor;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(wheelGap * 0.5 - 4, -6);
    ctx.lineTo(wheelGap * 0.5 - 10, -40);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(wheelGap * 0.5 - 10, -40);
    ctx.lineTo(wheelGap * 0.5 + 12, -44);
    ctx.moveTo(wheelGap * 0.5 - 10, -40);
    ctx.lineTo(wheelGap * 0.5 - 30, -46);
    ctx.stroke();

    // Reins from handlebar to pelican neck
    ctx.save();
    ctx.strokeStyle = '#e0c46d';
    ctx.lineWidth = 2;
    const tension = 0.5 + dashBoost * 0.4 + (1 - pelicanEnergy) * 0.4;
    ctx.beginPath();
    ctx.moveTo(wheelGap * 0.5 - 10, -44);
    ctx.quadraticCurveTo(40, -70 - tension * 10, 58, -44);
    ctx.stroke();
    ctx.restore();

    // Bicycle face (headlight as eye)
    ctx.save();
    ctx.translate(-2, -48);
    const faceTilt = Math.sin(wobblePhase * 0.9) * 0.06;
    ctx.rotate(faceTilt);
    ctx.fillStyle = '#1b223a';
    ctx.beginPath();
    ctx.roundRect(-10, -8, 20, 16, 6);
    ctx.fill();
    ctx.fillStyle = '#fdfdfd';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#161621';
    ctx.beginPath();
    ctx.arc(0.5, 0.5, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(1.6, -1.4, 0.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Bell on handlebar
    ctx.save();
    ctx.translate(wheelGap * 0.5 + 6, -48);
    const bellKick = bellShake * 0.8 * Math.sin(worldTime * 40);
    ctx.rotate(bellKick);
    ctx.fillStyle = '#ffd96b';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#d09a3a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.restore(); // bike

    ctx.restore(); // main body transform
  }

  let lastTime = performance.now();
  function loop(now) {
    const dtRaw = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(dtRaw, 0.04);

    worldTime += dt;

    // Update dash / bell
    if (dashTime > 0) {
      dashTime -= dt;
      if (dashTime <= 0) dashBoost = 0;
      else dashBoost *= 0.97;
    }
    if (bellTime > 0) {
      bellTime -= dt;
      if (bellTime <= 0) bellShake = 0;
      else bellShake *= 0.88;
    }

    // Energy drain & recovery
    const speedCost = (baseSpeed - 1.0) * 0.02;
    const dashCost = dashBoost * 0.06;
    const roadCost = roadMode === 'bumpy' ? 0.035 : 0.02;
    pelicanEnergy -= (speedCost + dashCost + roadCost) * dt;
    pelicanEnergy = clamp01(pelicanEnergy + 0.01 * dt); // slow natural recovery
    if (feedEffect > 0) {
      feedEffect -= dt * 1.4;
      if (feedEffect < 0) feedEffect = 0;
    }

    // UI energy meter
    const energyScaled = 0.08 + pelicanEnergy * 0.92;
    energyFill.style.transform = `scaleX(${energyScaled.toFixed(3)})`;
    let dotColor = '#50e3a4';
    if (pelicanEnergy < 0.3) dotColor = '#ff6c53';
    else if (pelicanEnergy < 0.6) dotColor = '#ffe96a';
    energyDot.style.background = dotColor;
    energyDot.style.boxShadow = `0 0 6px ${dotColor}`;

    // Clear
    ctx.clearRect(0, 0, width, height);

    drawBackground(dt);
    drawPelicanAndBike(dt);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
