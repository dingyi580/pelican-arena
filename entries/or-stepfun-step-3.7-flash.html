<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #stage {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }

        .ui-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ui-label {
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        button {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.3);
        }

        button.sprint-btn {
            background: rgba(255, 140, 0, 0.4);
            border-color: rgba(255, 180, 0, 0.6);
        }

        button.sprint-btn:hover {
            background: rgba(255, 140, 0, 0.6);
        }

        button.feed-btn {
            background: rgba(0, 180, 216, 0.4);
            border-color: rgba(0, 210, 240, 0.6);
        }

        button.feed-btn:hover {
            background: rgba(0, 180, 216, 0.6);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            #ui {
                padding: 12px 16px;
                gap: 8px;
                bottom: 12px;
            }
            button {
                padding: 8px 12px;
                font-size: 12px;
            }
            input[type="range"] {
                width: 80px;
            }
            .ui-label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div id="status">自行车骑鹈鹕</div>
    <div id="ui">
        <div class="ui-group">
            <button class="icon-btn" id="bellBtn" title="按车铃">🔔</button>
            <button class="feed-btn" id="feedBtn" title="投喂小鱼">🐟</button>
        </div>
        <div class="ui-group">
            <span class="ui-label">速度</span>
            <input type="range" id="speedSlider" min="1" max="10" value="4" step="0.5">
        </div>
        <div class="ui-group">
            <button class="sprint-btn" id="sprintBtn" title="冲刺">⚡冲刺</button>
        </div>
        <div class="ui-group">
            <button id="sceneBtn" title="切换场景">🌅 场景</button>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('stage');
            const ctx = canvas.getContext('2d');
            const statusEl = document.getElementById('status');

            // 状态
            const state = {
                width: 0,
                height: 0,
                time: 0,
                speed: 4,
                targetSpeed: 4,
                sprinting: false,
                sprintTimer: 0,
                stamina: 100,
                maxStamina: 100,
                sceneIndex: 0, // 0:晴天, 1:黄昏, 2:夜晚
                bellShake: 0,
                feedCooldown: 0,
                particles: [],
                clouds: [],
                feathers: [],
                fishProjectiles: [],
                bgOffset: 0,
                wheelRotation: 0,
                bikeBob: 0,
                pelicanFlap: 0,
                pelicanBob: 0,
                wingAngle: 0,
                pouchWobble: 0,
                legPhase: 0,
                roadBump: 0,
                isBumpy: false,
                bumpTimer: 0,
                lastTime: performance.now()
            };

            // 场景配置
            const scenes = [
                { // 晴天
                    skyTop: '#4facfe',
                    skyBottom: '#00f2fe',
                    waterTop: '#0077b6',
                    waterBottom: '#023e8a',
                    sand: '#f4d03f',
                    cloudColor: 'rgba(255,255,255,0.9)',
                    sunColor: '#fff7ae',
                    title: '晴天海滨'
                }, { // 黄昏
                    skyTop: '#ff5e62',
                    skyBottom: '#ff9966',
                    waterTop: '#1a2980',
                    waterBottom: '#0d1b3e',
                    sand: '#e8b86d',
                    cloudColor: 'rgba(255,200,150,0.7)',
                    sunColor: '#ff4500',
                    title: '黄昏海岸'
                }, { // 夜晚
                    skyTop: '#0f0c29',
                    skyBottom: '#302b63',
                    waterTop: '#000428',
                    waterBottom: '#000000',
                    sand: '#2c2c2c',
                    cloudColor: 'rgba(100,100,150,0.4)',
                    sunColor: '#f4f4f4',
                    title: '月夜海岸'
                }
            ];

            // 音频系统
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playBellSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const frequencies = [800, 1000, 1200, 1000, 800];
                frequencies.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + i * 0.06);
                    gain.gain.setValueAtTime(0.3, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.15);
                });
            }

            function playSplashSound() {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            // 初始化云朵
            function initClouds() {
                state.clouds = [];
                for (let i = 0; i < 8; i++) {
                    state.clouds.push({
                        x: Math.random() * state.width,
                        y: Math.random() * (state.height * 0.3),
                        w: 80 + Math.random() * 150,
                        h: 30 + Math.random() * 40,
                        speed: 0.2 + Math.random() * 0.5,
                        opacity: 0.4 + Math.random() * 0.5
                    });
                }
            }

            // 调整大小
            function resize() {
                state.width = window.innerWidth;
                state.height = window.innerHeight;
                canvas.width = state.width;
                canvas.height = state.height;
                initClouds();
            }
            window.addEventListener('resize', resize);
            resize();

            // 粒子类
            class Particle {
                constructor(x, y, vx, vy, life, color, size) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.life = life;
                    this.maxLife = life;
                    this.color = color;
                    this.size = size;
                }
                update(dt) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    this.life -= dt;
                    if (this.color === 'sweat') this.vy += 300 * dt;
                }
                get alpha() {
                    return Math.max(0, this.life / this.maxLife);
                }
                get alive() {
                    return this.life > 0;
                }
            }

            // 添加汗珠
            function addSweat(x, y) {
                for (let i = 0; i < 3; i++) {
                    state.particles.push(new Particle(
                        x + (Math.random() - 0.5) * 20,
                        y,
                        (Math.random() - 0.5) * 40,
                        -100 - Math.random() * 100,
                        0.8 + Math.random() * 0.5,
                        'sweat',
                        3 + Math.random() * 3
                    ));
                }
            }

            // 添加羽毛
            function addFeather(x, y) {
                state.feathers.push({
                    x: x,
                    y: y,
                    vx: -30 - Math.random() * 60,
                    vy: -50 - Math.random() * 30,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 5,
                    life: 2 + Math.random() * 2,
                    maxLife: 2 + Math.random() * 2,
                    size: 8 + Math.random() * 12
                });
            }

            // 投喂小鱼
            function feedFish() {
                if (state.feedCooldown > 0 || state.stamina >= state.maxStamina) return;
                state.feedCooldown = 1.0;
                state.fishProjectiles.push({
                    x: state.width * 0.85,
                    y: state.height * 0.3,
                    targetX: state.pelicanBaseX + state.width * 0.05,
                    targetY: state.pelicanBaseY - 40,
                    speed: 400,
                    life: 2.0,
                    angle: 0
                });
                playSplashSound();
            }

            // 绘制圆角矩形辅助
            function roundRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            // 绘制自行车
            function drawBicycle(ctx, x, y, angle, wheelRot, isSprinting) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                const wheelRadius = 22;
                const wheelBase = 70;
                const rearX = -wheelBase / 2;
                const frontX = wheelBase / 2;
                const groundY = 20; // 车轮中心相对车身的Y

                // 后轮
                drawWheel(ctx, rearX, groundY, wheelRadius, wheelRot);
                // 前轮
                drawWheel(ctx, frontX, groundY, wheelRadius, wheelRot * 0.95);

                // 车架（三角形结构）
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // 后三角
                ctx.beginPath();
                ctx.moveTo(rearX, groundY); // 后轮轴
                ctx.lineTo(rearX + 15, groundY - 35); // 座管上端
                ctx.lineTo(rearX + 50, groundY - 10); // 中轴
                ctx.closePath();
                ctx.stroke();

                // 前三角
                ctx.beginPath();
                ctx.moveTo(frontX, groundY); // 前轮轴
                ctx.lineTo(frontX - 30, groundY - 40); // 头管上端
                ctx.lineTo(rearX + 50, groundY - 10); // 中轴
                ctx.closePath();
                ctx.stroke();

                // 上管
                ctx.beginPath();
                ctx.moveTo(rearX + 15, groundY - 35);
                ctx.lineTo(frontX - 30, groundY - 40);
                ctx.stroke();

                // 车座
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.ellipse(rearX + 5, groundY - 38, 14, 5, -0.1, 0, Math.PI * 2);
                ctx.fill();

                // 车把
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(frontX - 30, groundY - 40);
                ctx.lineTo(frontX - 35, groundY - 55);
                ctx.stroke();
                // 车把横管
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(frontX - 50, groundY - 52);
                ctx.lineTo(frontX - 20, groundY - 52);
                ctx.stroke();

                // 脚踏/曲柄
                const crankAngle = wheelRot;
                const crankLen = 14;
                const crankX = rearX + 50;
                const crankY = groundY - 10;
                const pedalX = crankX + Math.cos(crankAngle) * crankLen;
                const pedalY = crankY + Math.sin(crankAngle) * crankLen;

                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(crankX, crankY);
                ctx.lineTo(pedalX, pedalY);
                ctx.stroke();

                // 踏板
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(pedalX - 6, pedalY - 2, 12, 4);

                // 链条简化
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(rearX, groundY);
                ctx.lineTo(crankX, crankY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 缰绳（连接车把到鹈鹕）
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(frontX - 45, groundY - 55);
                ctx.lineTo(frontX - 20, groundY + 60);
                ctx.stroke();

                ctx.restore();
            }

            function drawWheel(ctx, cx, cy, r, rotation) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation);

                // 轮胎
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();

                // 辐条
                ctx.strokeStyle = 'rgba(44,62,80,0.6)';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(angle) * (r - 3), Math.sin(angle) * (r - 3));
                    ctx.stroke();
                }

                // 轮毂
                ctx.fillStyle = '#95a5a6';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 绘制鹈鹕
            function drawPelican(ctx, x, y, time, speed, scene) {
                ctx.save();
                ctx.translate(x, y);

                const bob = Math.sin(time * speed * 3) * 6;
                const flap = Math.sin(time * speed * 8) * 0.3;
                const legSwing = Math.sin(time * speed * 12) * 0.5;

                // 身体
                ctx.fillStyle = '#ecf0f1';
                ctx.strokeStyle = '#bdc3c7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, bob, 55, 28, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 翅膀（扑腾）
                ctx.save();
                ctx.translate(15, bob - 10);
                ctx.rotate(flap);
                ctx.fillStyle = '#dfe6e9';
                ctx.beginPath();
                ctx.ellipse(0, 0, 45, 18, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // 另一只翅膀（略小，透视）
                ctx.save();
                ctx.translate(5, bob + 8);
                ctx.rotate(-flap * 0.7);
                ctx.fillStyle = '#dfe6e9';
                ctx.beginPath();
                ctx.ellipse(0, 0, 35, 14, -0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // 尾羽
                ctx.fillStyle = '#bdc3c7';
                ctx.beginPath();
                ctx.moveTo(-50, bob);
                ctx.quadraticCurveTo(-70, bob - 10, -75, bob - 20);
                ctx.quadraticCurveTo(-65, bob - 5, -50, bob);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-50, bob);
                ctx.quadraticCurveTo(-70, bob + 5, -72, bob + 15);
                ctx.quadraticCurveTo(-62, bob + 8, -50, bob);
                ctx.fill();

                // 腿部（简化，快速摆动）
                ctx.strokeStyle = '#e67e22';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                // 左腿
                ctx.beginPath();
                ctx.moveTo(-10, bob + 20);
                ctx.lineTo(-15 + Math.sin(time * speed * 12) * 8, bob + 50);
                ctx.stroke();
                // 右腿
                ctx.beginPath();
                ctx.moveTo(5, bob + 20);
                ctx.lineTo(0 - Math.sin(time * speed * 12) * 8, bob + 50);
                ctx.stroke();

                // 蹼足
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.ellipse(-15 + Math.sin(time * speed * 12) * 8, bob + 52, 8, 4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(0 - Math.sin(time * speed * 12) * 8, bob + 52, 8, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // 头部
                ctx.fillStyle = '#ecf0f1';
                ctx.beginPath();
                ctx.ellipse(40, bob - 8, 22, 18, -0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // 喙
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.moveTo(55, bob - 8);
                ctx.lineTo(95, bob - 5);
                ctx.lineTo(55, bob - 3);
                ctx.closePath();
                ctx.fill();

                // 喉囊（标志性宽大喉囊）
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.moveTo(55, bob - 3);
                ctx.quadraticCurveTo(70, bob + 10, 50, bob + 15);
                ctx.quadraticCurveTo(40, bob + 12, 45, bob - 3);
                ctx.fill();
                // 喉囊细节
                ctx.strokeStyle = '#d4ac0d';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(55, bob - 3);
                ctx.quadraticCurveTo(65, bob + 8, 50, bob + 12);
                ctx.stroke();

                // 眼睛
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(48, bob - 12, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(49, bob - 13, 1, 0, Math.PI * 2);
                ctx.fill();

                // 喙尖钩
                ctx.fillStyle = '#e67e22';
                ctx.beginPath();
                ctx.moveTo(95, bob - 5);
                ctx.lineTo(100, bob - 6);
                ctx.lineTo(95, bob - 2);
                ctx.closePath();
                ctx.fill();

                // 嘴缝线
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(55, bob - 6);
                ctx.lineTo(92, bob - 4);
                ctx.stroke();

                ctx.restore();
            }

            // 绘制背景
            function drawBackground(ctx, time) {
                const scene = scenes[state.sceneIndex];
                const w = state.width;
                const h = state.height;

                // 天空渐变
                const skyGrad = ctx.createLinearGradient(0, 0, 0, h * 0.6);
                skyGrad.addColorStop(0, scene.skyTop);
                skyGrad.addColorStop(1, scene.skyBottom);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, w, h);

                // 太阳/月亮
                ctx.fillStyle = scene.sunColor;
                ctx.beginPath();
                ctx.arc(w * 0.8, h * 0.15, 40, 0, Math.PI * 2);
                ctx.fill();
                if (state.sceneIndex === 2) {
                    // 月亮光晕
                    ctx.fillStyle = 'rgba(255,255,255,0.1)';
                    ctx.beginPath();
                    ctx.arc(w * 0.8, h * 0.15, 60, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 云朵
                ctx.fillStyle = scene.cloudColor;
                state.clouds.forEach(cloud => {
                    cloud.x -= cloud.speed * (state.speed / 4) * 0.5;
                    if (cloud.x + cloud.w < -100) cloud.x = w + 100;
                    ctx.beginPath();
                    ctx.ellipse(cloud.x, cloud.y, cloud.w / 2, cloud.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 多个椭圆组成云朵
                    ctx.beginPath();
                    ctx.ellipse(cloud.x - cloud.w * 0.25, cloud.y + 5, cloud.w * 0.3, cloud.h * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cloud.x + cloud.w * 0.25, cloud.y + 3, cloud.w * 0.35, cloud.h * 0.45, 0, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 远海
                const waterY = h * 0.55;
                const waterGrad = ctx.createLinearGradient(0, waterY, 0, h);
                waterGrad.addColorStop(0, scene.waterTop);
                waterGrad.addColorStop(1, scene.waterBottom);
                ctx.fillStyle = waterGrad;
                ctx.fillRect(0, waterY, w, h - waterY);

                // 海浪线条（视差）
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const yOffset = waterY + 20 + i * 25;
                    ctx.beginPath();
                    for (let x = 0; x < w; x += 20) {
                        const waveY = yOffset + Math.sin(x * 0.02 + time * (1 + i * 0.2) + i) * 8;
                        if (x === 0) ctx.moveTo(x, waveY);
                        else ctx.lineTo(x, waveY);
                    }
                    ctx.stroke();
                }

                // 沙滩/栈道
                const sandY = h * 0.75;
                const sandGrad = ctx.createLinearGradient(0, sandY, 0, h);
                sandGrad.addColorStop(0, scene.sand);
                sandGrad.addColorStop(1, shadeColor(scene.sand, -20));
                ctx.fillStyle = sandGrad;
                ctx.fillRect(0, sandY, w, h - sandY);

                // 木栈道（近景，快速移动）
                const roadY = h * 0.82;
                const roadOffset = (state.bgOffset % 80);
                ctx.fillStyle = state.isBumpy ? '#a0826d' : '#c9a66b';
                ctx.fillRect(0, roadY, w, 40);
                // 木板线条
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 2;
                for (let i = -80; i < w + 80; i += 80) {
                    const x = i - roadOffset;
                    ctx.beginPath();
                    ctx.moveTo(x, roadY);
                    ctx.lineTo(x, roadY + 40);
                    ctx.stroke();
                }
                // 木板间隙阴影
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                for (let i = -80; i < w + 80; i += 80) {
                    const x = i - roadOffset + 78;
                    ctx.fillRect(x, roadY, 4, 40);
                }

                // 远处的海鸥（视差）
                for (let i = 0; i < 3; i++) {
                    const gullX = ((time * 30 + i * 300) % (w + 200)) - 100;
                    const gullY = h * 0.2 + i * 40;
                    ctx.strokeStyle = scene.cloudColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(gullX - 10, gullY);
                    ctx.quadraticCurveTo(gullX - 5, gullY - 6, gullX, gullY);
                    ctx.quadraticCurveTo(gullX + 5, gullY - 6, gullX + 10, gullY);
                    ctx.stroke();
                }
            }

            function shadeColor(color, percent) {
                // 简单的颜色加深函数
                const num = parseInt(color.replace("#", ""), 16);
                const amt = Math.round(2.55 * percent);
                const R = (num >> 16) + amt;
                const G = (num >> 8 & 0x00FF) + amt;
                const B = (num & 0x0000FF) + amt;
                return "#" + (
                    0x1000000 +
                    (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 +
                    (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 +
                    (B < 255 ? (B < 1 ? 0 : B) : 255)
                ).toString(16).slice(1);
            }

            // 更新逻辑
            function update(dt) {
                state.time += dt;

                // 速度平滑
                let effectiveTarget = state.targetSpeed;
                if (state.sprinting) {
                    effectiveTarget = state.targetSpeed * 2.5;
                    state.sprintTimer -= dt;
                    if (state.sprintTimer <= 0) {
                        state.sprinting = false;
                        document.getElementById('sprintBtn').textContent = '⚡冲刺';
                    }
                }

                state.speed += (effectiveTarget - state.speed) * dt * 3;

                // 体力消耗
                state.stamina -= dt * 2 * (state.speed / 4);
                if (state.stamina < 0) state.stamina = 0;
                if (state.stamina > state.maxStamina) state.stamina = state.maxStamina;

                // 体力低时增加消耗
                if (state.stamina < 20) {
                    state.stamina -= dt * 3;
                }

                // 自然恢复体力（很慢）
                if (state.stamina < state.maxStamina && !state.sprinting) {
                    state.stamina += dt * 1;
                }

                // 投喂冷却
                if (state.feedCooldown > 0) state.feedCooldown -= dt;

                // 车铃震动衰减
                if (state.bellShake > 0) state.bellShake -= dt * 4;

                // 背景滚动
                state.bgOffset += state.speed * dt * 40;

                // 车轮旋转
                state.wheelRotation += state.speed * dt * 0.5;

                // 鹈鹕和自行车的浮动
                const baseBikeY = state.height * 0.38;
                const basePelicanY = state.height * 0.55;
                state.pelicanBaseX = state.width * 0.5;
                state.pelicanBaseY = basePelicanY;

                state.bikeBob = Math.sin(state.time * state.speed * 3) * 4;
                state.pelicanBob = Math.sin(state.time * state.speed * 3) * 8;
                state.wingAngle = Math.sin(state.time * state.speed * 8) * 0.3;
                state.pouchWobble = Math.sin(state.time * state.speed * 5) * 3;

                // 颠簸效果
                if (state.isBumpy) {
                    state.bumpTimer -= dt;
                    state.roadBump = Math.sin(state.time * 20) * 6;
                    if (state.bumpTimer <= 0) {
                        state.isBumpy = false;
                        state.roadBump = 0;
                    }
                }

                // 体力低时出汗
                if (state.stamina < 30 && Math.random() < 0.1) {
                    addSweat(state.pelicanBaseX + 20, state.pelicanBaseY - 20);
                }

                // 飞羽毛
                if (Math.random() < 0.02 * state.speed) {
                    addFeather(
                        state.pelicanBaseX - 30 + Math.random() * 60,
                        state.pelicanBaseY - 20 + Math.random() * 40
                    );
                }

                // 更新粒子
                state.particles.forEach(p => p.update(dt));
                state.particles = state.particles.filter(p => p.alive);

                // 更新羽毛
                state.feathers.forEach(f => {
                    f.x += f.vx * dt;
                    f.y += f.vy * dt;
                    f.vy += 50 * dt;
                    f.rotation += f.rotSpeed * dt;
                    f.life -= dt;
                });
                state.feathers = state.feathers.filter(f => f.life > 0);

                // 更新鱼投射物
                state.fishProjectiles.forEach(f => {
                    const dx = f.targetX - f.x;
                    const dy = f.targetY - f.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 10) {
                        // 命中：恢复体力
                        state.stamina = Math.min(state.maxStamina, state.stamina + 25);
                        f.life = 0;
                        // 命中粒子效果
                        for (let i = 0; i < 8; i++) {
                            state.particles.push(new Particle(
                                f.targetX, f.targetY,
                                (Math.random() - 0.5) * 200,
                                (Math.random() - 0.5) * 200,
                                0.6,
                                'heart',
                                6
                            ));
                        }
                    } else {
                        f.x += (dx / dist) * f.speed * dt;
                        f.y += (dy / dist) * f.speed * dt;
                        f.angle += dt * 5;
                    }
                    f.life -= dt;
                });
                state.fishProjectiles = state.fishProjectiles.filter(f => f.life > 0);

                // 状态文本
                const scene = scenes[state.sceneIndex];
                let statusText = `${scene.title} | 速度: ${state.speed.toFixed(1)} | 体力: ${Math.round(state.stamina)}%`;
                if (state.sprinting) statusText += ' | 冲刺中!';
                if (state.stamina < 20) statusText += ' | 疲劳!';
                statusEl.textContent = statusText;
            }

            // 绘制粒子
            function drawParticles(ctx) {
                // 羽毛
                state.feathers.forEach(f => {
                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rotation);
                    ctx.fillStyle = `rgba(255,255,255,${f.life / f.maxLife})`;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, f.size, f.size * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 通用粒子
                state.particles.forEach(p => {
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color === 'sweat' ? '#87ceeb' : '#ff6b9d';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                });

                // 鱼投射物
                state.fishProjectiles.forEach(f => {
                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.angle);
                    ctx.fillStyle = '#3498db';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 鱼尾
                    ctx.beginPath();
                    ctx.moveTo(-10, 0);
                    ctx.lineTo(-16, -5);
                    ctx.lineTo(-16, 5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                });
            }

            // 渲染
            function render() {
                const w = state.width;
                const h = state.height;
                ctx.clearRect(0, 0, w, h);

                // 背景
                drawBackground(ctx, state.time);

                // 计算位置
                const pelicanX = state.pelicanBaseX;
                const pelicanY = state.pelicanBaseY + state.pelicanBob + state.roadBump;
                const bikeX = pelicanX + 10;
                const bikeY = pelicanY - 45 + state.bikeBob;

                // 绘制鹈鹕
                drawPelican(ctx, pelicanX, pelicanY, state.time, state.speed, state.sceneIndex);

                // 绘制自行车（在鹈鹕上方）
                const bikeAngle = (state.roadBump * 0.02) + (state.pelicanBob * 0.01);
                drawBicycle(ctx, bikeX, bikeY, bikeAngle, state.wheelRotation, state.sprinting);

                // 缰绳连接线（从车把到鹈鹕头部）
                const handleX = bikeX + 25;
                const handleY = bikeY - 75 + state.bikeBob;
                const headX = pelicanX + 40;
                const headY = pelicanY - 8 + state.pelicanBob;
                ctx.strokeStyle = '#8b4513';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.beginPath();
                ctx.moveTo(handleX, handleY);
                ctx.lineTo(headX, headY);
                ctx.stroke();
                ctx.setLineDash([]);

                // 粒子
                drawParticles(ctx);

                // 冲刺特效：速度线
                if (state.sprinting) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 5; i++) {
                        const lx = pelicanX - 80 - Math.random() * 100;
                        const ly = pelicanY - 30 + Math.random() * 80;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(lx - 40 - Math.random() * 60, ly);
                        ctx.stroke();
                    }
                }

                // 车铃震动特效
                if (state.bellShake > 0) {
                    const bellX = w * 0.15;
                    const bellY = h * 0.12;
                    const shake = state.bellShake * 10;
                    ctx.save();
                    ctx.translate(bellX, bellY);
                    ctx.rotate((Math.random() - 0.5) * shake);
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(0, 0, 15, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#b8860b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = '#000';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🔔', 0, 0);
                    ctx.restore();
                }
            }

            // 主循环
            function animate(currentTime) {
                const dt = Math.min((currentTime - state.lastTime) / 1000, 0.1); // 限制最大帧时间
                state.lastTime = currentTime;

                update(dt);
                render();

                requestAnimationFrame(animate);
            }

            // 事件处理
            document.getElementById('bellBtn').addEventListener('click', () => {
                initAudio();
                playBellSound();
                state.bellShake = 1.0;
                // 鹈鹕受惊加速
                state.speed = Math.min(12, state.speed + 3);
                state.targetSpeed = Math.min(10, state.targetSpeed + 2);
                // 受惊羽毛
                for (let i = 0; i < 5; i++) {
                    addFeather(
                        state.pelicanBaseX + 30,
                        state.pelicanBaseY - 20 + i * 10
                    );
                }
                setTimeout(() => {
                    state.targetSpeed = parseFloat(document.getElementById('speedSlider').value);
                }, 1500);
            });

            document.getElementById('feedBtn').addEventListener('click', () => {
                initAudio();
                feedFish();
            });

            document.getElementById('speedSlider').addEventListener('input', (e) => {
                state.targetSpeed = parseFloat(e.target.value);
            });

            document.getElementById('sprintBtn').addEventListener('mousedown', () => {
                if (state.stamina > 10) {
                    initAudio();
                    state.sprinting = true;
                    state.sprintTimer = 2.5;
                    state.stamina -= 10;
                    document.getElementById('sprintBtn').textContent = '⚡冲刺中!';
                }
            });

            document.getElementById('sprintBtn').addEventListener('mouseup', () => {
                state.sprinting = false;
                state.sprintTimer = 0;
                document.getElementById('sprintBtn').textContent = '⚡冲刺';
            });

            document.getElementById('sprintBtn').addEventListener('mouseleave', () => {
                state.sprinting = false;
                state.sprintTimer = 0;
                document.getElementById('sprintBtn').textContent = '⚡冲刺';
            });

            // 触摸支持
            document.getElementById('sprintBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (state.stamina > 10) {
                    initAudio();
                    state.sprinting = true;
                    state.sprintTimer = 2.5;
                    state.stamina -= 10;
                    document.getElementById('sprintBtn').textContent = '⚡冲刺中!';
                }
            });
            document.getElementById('sprintBtn').addEventListener('touchend', (e) => {
                e.preventDefault();
                state.sprinting = false;
                state.sprintTimer = 0;
                document.getElementById('sprintBtn').textContent = '⚡冲刺';
            });

            document.getElementById('sceneBtn').addEventListener('click', () => {
                state.sceneIndex = (state.sceneIndex + 1) % scenes.length;
                const scene = scenes[state.sceneIndex];
                statusEl.textContent = `切换至：${scene.title}`;
                setTimeout(() => {
                    statusEl.textContent = `${scene.title} | 速度: ${state.speed.toFixed(1)} | 体力: ${Math.round(state.stamina)}%`;
                }, 1500);
            });

            // 键盘控制
            window.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case ' ':
                        e.preventDefault();
                        if (state.stamina > 10 && !state.sprinting) {
                            initAudio();
                            state.sprinting = true;
                            state.sprintTimer = 2.5;
                            state.stamina -= 10;
                        }
                        break;
                    case 'b':
                        initAudio();
                        playBellSound();
                        state.bellShake = 1.0;
                        state.speed = Math.min(12, state.speed + 3);
                        state.targetSpeed = Math.min(10, state.targetSpeed + 2);
                        setTimeout(() => {
                            state.targetSpeed = parseFloat(document.getElementById('speedSlider').value);
                        }, 1500);
                        break;
                    case 'f':
                        initAudio();
                        feedFish();
                        break;
                    case 'r':
                        document.getElementById('sceneBtn').click();
                        break;
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === ' ') {
                    state.sprinting = false;
                    state.sprintTimer = 0;
                }
            });

            // 点击canvas随机颠簸
            canvas.addEventListener('dblclick', (e) => {
                state.isBumpy = true;
                state.bumpTimer = 0.5;
                // 在点击处产生小水花
                for (let i = 0; i < 6; i++) {
                    state.particles.push(new Particle(
                        e.clientX, e.clientY,
                        (Math.random() - 0.5) * 100,
                        -50 - Math.random() * 80,
                        0.5 + Math.random() * 0.3,
                        'splash',
                        4 + Math.random() * 4
                    ));
                }
                playSplashSound();
            });

            // 启动
            state.lastTime = performance.now();
            requestAnimationFrame(animate);

            console.log('🚲🦅 自行车骑鹈鹕 - 已就绪');
            console.log('交互：车铃(B)、冲刺(空格)、投喂(F)、切换场景(R)、双击颠簸');
        })();
    </script>
</body>
