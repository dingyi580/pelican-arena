<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #canvas {
            display: block;
            margin: 0 auto;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        .btn {
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.bell { background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; }
        .btn.feed { background: linear-gradient(135deg, #4ECDC4, #44A08D); color: #fff; }
        .btn.weather { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        #speed-control {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #speed-slider {
            width: 150px;
            accent-color: #FF6B6B;
        }
        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 13px;
        }
        .stamina-bar {
            width: 120px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .stamina-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s;
        }
        #title {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        #title h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }
        #title p {
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="title">
        <h1>🚲 自行车骑鹈鹕 🐦</h1>
        <p>一辆自行车正在骑着一只鹈鹕奔跑</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="status">
        <div>体力值：<span id="stamina-text">100%</span></div>
        <div class="stamina-bar"><div class="stamina-fill" id="stamina-fill"></div></div>
        <div style="margin-top:8px;">当前状态：<span id="state-text">悠闲小跑</span></div>
    </div>
    
    <div id="speed-control">
        <span>🐢</span>
        <input type="range" id="speed-slider" min="1" max="10" value="3">
        <span>🐇</span>
        <span id="speed-text">速度：3</span>
    </div>
    
    <div id="controls">
        <button class="btn bell" id="bell-btn">🔔 按车铃</button>
        <button class="btn feed" id="feed-btn">🐟 投喂小鱼</button>
        <button class="btn weather" id="weather-btn">🌤️ 切换天气</button>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Game state
        const state = {
            speed: 3,
            stamina: 100,
            time: 0,
            weather: 0, // 0: sunny, 1: sunset, 2: night
            isRinging: false,
            ringTime: 0,
            isFeeding: false,
            feedTime: 0,
            particles: [],
            feathers: [],
            sweatDrops: [],
            fish: [],
            clouds: [],
            groundOffset: 0,
            pelicanBounce: 0,
            wheelRotation: 0,
            wingAngle: 0,
            pouchWobble: 0,
            breathScale: 1,
            startled: 0,
            roadType: 0 // 0: smooth, 1: bumpy
        };

        // Initialize clouds
        for (let i = 0; i < 5; i++) {
            state.clouds.push({
                x: Math.random() * W,
                y: 50 + Math.random() * 100,
                size: 40 + Math.random() * 60,
                speed: 0.2 + Math.random() * 0.3
            });
        }

        // Weather colors
        const weatherColors = [
            { sky: ['#87CEEB', '#E0F6FF'], sun: '#FFD700', ground: '#C4A76C', sea: '#4A90A4' },
            { sky: ['#FF7E5F', '#FEB47B'], sun: '#FF6347', ground: '#D4A574', sea: '#2E5A88' },
            { sky: ['#1a1a2e', '#16213e'], sun: '#F5F5DC', ground: '#2C3E50', sea: '#1A252F' }
        ];

        // Web Audio API for bell
        let audioCtx = null;
        function playBell() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const now = audioCtx.currentTime;
            
            // Bell sound synthesis
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(1800, now);
            osc1.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(2400, now);
            osc2.frequency.exponentialRampToValueAtTime(1600, now + 0.1);
            
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            
            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.5);
            osc2.stop(now + 0.5);
        }

        // Controls
        document.getElementById('bell-btn').addEventListener('click', () => {
            playBell();
            state.isRinging = true;
            state.ringTime = 0;
            state.startled = 1;
        });

        document.getElementById('feed-btn').addEventListener('click', () => {
            if (state.stamina < 100) {
                state.isFeeding = true;
                state.feedTime = 0;
                // Add fish
                for (let i = 0; i < 3; i++) {
                    state.fish.push({
                        x: W/2 + (Math.random()-0.5)*100,
                        y: -50,
                        vy: 5,
                        targetY: H/2 + 50,
                        size: 15 + Math.random()*10
                    });
                }
                state.stamina = Math.min(100, state.stamina + 30);
            }
        });

        document.getElementById('weather-btn').addEventListener('click', () => {
            state.weather = (state.weather + 1) % 3;
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            state.speed = parseInt(e.target.value);
            document.getElementById('speed-text').textContent = `速度：${state.speed}`;
        });

        // Drawing functions
        function drawSky() {
            const colors = weatherColors[state.weather];
            const gradient = ctx.createLinearGradient(0, 0, 0, H*0.6);
            gradient.addColorStop(0, colors.sky[0]);
            gradient.addColorStop(1, colors.sky[1]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H*0.6);
            
            // Sun/Moon
            ctx.beginPath();
            ctx.arc(W - 100, 80, 40, 0, Math.PI * 2);
            ctx.fillStyle = colors.sun;
            ctx.fill();
            if (state.weather === 2) {
                // Moon glow
                ctx.beginPath();
                ctx.arc(W - 100, 80, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fill();
            }
        }

        function drawClouds() {
            const colors = weatherColors[state.weather];
            ctx.fillStyle = state.weather === 2 ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.8)';
            
            state.clouds.forEach(cloud => {
                cloud.x -= cloud.speed * state.speed;
                if (cloud.x < -100) cloud.x = W + 100;
                
                // Draw cloud
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size*0.5, 0, Math.PI*2);
                ctx.arc(cloud.x + cloud.size*0.4, cloud.y - 10, cloud.size*0.4, 0, Math.PI*2);
                ctx.arc(cloud.x + cloud.size*0.8, cloud.y, cloud.size*0.35, 0, Math.PI*2);
                ctx.fill();
            });
        }

        function drawSea() {
            const colors = weatherColors[state.weather];
            const seaY = H * 0.35;
            
            const gradient = ctx.createLinearGradient(0, seaY, 0, H*0.5);
            gradient.addColorStop(0, colors.sea);
            gradient.addColorStop(1, state.weather === 2 ? '#0D1B2A' : '#3A7CA5');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, seaY, W, H*0.15);
            
            // Waves
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                for (let x = 0; x < W; x += 10) {
                    const y = seaY + 10 + i*15 + Math.sin((x + state.time*50) * 0.02) * 5;
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function drawGround() {
            const colors = weatherColors[state.weather];
            const groundY = H * 0.5;
            
            // Boardwalk
            const gradient = ctx.createLinearGradient(0, groundY, 0, H);
            gradient.addColorStop(0, colors.ground);
            gradient.addColorStop(1, state.weather === 2 ? '#1a1a1a' : '#8B7355');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, groundY, W, H*0.5);
            
            // Planks
            ctx.strokeStyle = state.weather === 2 ? '#1a1a1a' : 'rgba(139,115,85,0.5)';
            ctx.lineWidth = 1;
            state.groundOffset = (state.groundOffset + state.speed * 2) % 80;
            
            for (let y = groundY; y < H; y += 15) {
                for (let x = -state.groundOffset; x < W; x += 80) {
                    ctx.strokeRect(x, y, 78, 14);
                }
            }
            
            // Bumpy road effect
            if (state.roadType === 1) {
                ctx.fillStyle = 'rgba(100,100,100,0.3)';
                for (let i = 0; i < 20; i++) {
                    const x = ((state.time * 100 + i * 200) % (W + 100)) - 50;
                    ctx.beginPath();
                    ctx.ellipse(x, H*0.6 + (i%3)*50, 20, 10, 0, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function drawPelican(x, y) {
            const bounce = Math.sin(state.pelicanBounce) * (state.speed * 2);
            const breath = Math.sin(state.time * 3) * state.breathScale;
            const startled = state.startled * 10;
            
            ctx.save();
            ctx.translate(x, y + bounce);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(0, 80, 60, 15, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Body
            const bodyGradient = ctx.createRadialGradient(-20, 0, 0, 0, 10, 80);
            bodyGradient.addColorStop(0, '#FFFFFF');
            bodyGradient.addColorStop(0.5, '#F5F5F5');
            bodyGradient.addColorStop(1, '#E8E8E8');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, 70, 45, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Wing
            ctx.save();
            ctx.rotate(Math.sin(state.wingAngle) * 0.3);
            ctx.fillStyle = '#D3D3D3';
            ctx.beginPath();
            ctx.ellipse(10, -20, 50, 25, -0.3, 0, Math.PI*2);
            ctx.fill();
            // Wing feathers
            ctx.strokeStyle = '#A9A9A9';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(40 + i*8, -30);
                ctx.lineTo(55 + i*8, -35 - i*3);
                ctx.stroke();
            }
            ctx.restore();
            
            // Tail feathers
            ctx.fillStyle = '#E8E8E8';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.ellipse(-60 - i*5, 10 + (i-2)*5, 20, 6, -0.2 - i*0.1, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Legs
            const legAngle = Math.sin(state.time * state.speed * 0.5) * 0.5;
            ctx.strokeStyle = '#FF8C00';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            
            // Left leg
            ctx.beginPath();
            ctx.moveTo(-20, 35);
            ctx.lineTo(-20 + Math.sin(legAngle) * 20, 75);
            ctx.stroke();
            // Webbed foot
            ctx.fillStyle = '#FF8C00';
            ctx.beginPath();
            ctx.ellipse(-20 + Math.sin(legAngle) * 20, 78, 15, 6, 0.3, 0, Math.PI*2);
            ctx.fill();
            
            // Right leg
            ctx.beginPath();
            ctx.moveTo(10, 35);
            ctx.lineTo(10 - Math.sin(legAngle) * 20, 75);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(10 - Math.sin(legAngle) * 20, 78, 15, 6, -0.3, 0, Math.PI*2);
            ctx.fill();
            
            // Neck
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(40, -10);
            ctx.quadraticCurveTo(70, -30 + breath*2, 90, -50 + startled);
            ctx.quadraticCurveTo(100, -20, 50, 10);
            ctx.fill();
            
            // Head
            ctx.beginPath();
            ctx.arc(95, -55 + startled, 25, 0, Math.PI*2);
            ctx.fill();
            
            // Pouch (throat pouch)
            ctx.save();
            const pouchWobble = Math.sin(state.pouchWobble) * 5;
            ctx.translate(70, -30);
            const pouchGradient = ctx.createRadialGradient(0, 10, 0, 5, 15, 30);
            pouchGradient.addColorStop(0, '#FFD700');
            pouchGradient.addColorStop(0.7, '#FFA500');
            pouchGradient.addColorStop(1, '#FF8C00');
            ctx.fillStyle = pouchGradient;
            ctx.beginPath();
            ctx.ellipse(0, 20 + pouchWobble, 25, 35 + breath, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            // Beak
            ctx.fillStyle = '#FFB347';
            ctx.beginPath();
            ctx.moveTo(110, -55 + startled);
            ctx.lineTo(160, -50 + startled);
            ctx.lineTo(110, -40 + startled);
            ctx.closePath();
            ctx.fill();
            
            // Lower beak with pouch connection
            ctx.beginPath();
            ctx.moveTo(110, -40 + startled);
            ctx.quadraticCurveTo(140, -30 + pouchWobble/2, 155, -45 + startled);
            ctx.lineTo(160, -50 + startled);
            ctx.closePath();
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(105, -60 + startled, 6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(103, -62 + startled, 2, 0, Math.PI*2);
            ctx.fill();
            
            // Expression based on state
            if (state.startled > 0.5) {
                // Startled eyebrows
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(100, -70 + startled);
                ctx.lineTo(112, -68 + startled);
                ctx.stroke();
            } else if (state.stamina < 30) {
                // Tired expression
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(105, -55 + startled, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();
            }
            
            // Sweat drops when tired
            if (state.stamina < 50) {
                state.sweatDrops.push({
                    x: x + 60 + Math.random()*20,
                    y: y - 60,
                    vy: 3
                });
            }
            
            ctx.restore();
        }

        function drawBicycle(x, y) {
            const bounce = Math.sin(state.pelicanBounce) * (state.speed * 2);
            const tilt = Math.sin(state.pelicanBounce * 0.5) * 0.05;
            
            ctx.save();
            ctx.translate(x, y - 45 + bounce);
            ctx.rotate(tilt);
            
            // Rein (缰绳 from handlebar to pelican beak)
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(60, -30, 110 - x, 45);
            ctx.stroke();
            
            // Main frame
            ctx.strokeStyle = '#C0C0C0';
            ctx.lineWidth = 4;
            
            // Top tube
            ctx.beginPath();
            ctx.moveTo(-40, -15);
            ctx.lineTo(30, -15);
            ctx.stroke();
            
            // Down tube
            ctx.beginPath();
            ctx.moveTo(-40, -15);
            ctx.lineTo(-50, 30);
            ctx.stroke();
            
            // Seat tube
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(0, 30);
            ctx.stroke();
            
            // Chain stays
            ctx.beginPath();
            ctx.moveTo(-50, 30);
            ctx.lineTo(0, 30);
            ctx.stroke();
            
            // Seat stays
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-50, 30);
            ctx.stroke();
            
            // Front fork
            ctx.beginPath();
            ctx.moveTo(30, -15);
            ctx.lineTo(45, 30);
            ctx.stroke();
            
            // Seat
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(0, -25, 18, 8, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(0, -27, 14, 6, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Handlebar
            ctx.strokeStyle = '#A0A0A0';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(30, -25);
            ctx.lineTo(30, -15);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(20, -25);
            ctx.lineTo(40, -25);
            ctx.stroke();
            
            // Bell on handlebar
            const bellRing = state.isRinging ? Math.sin(state.ringTime * 20) * 0.2 : 0;
            ctx.save();
            ctx.translate(25, -28);
            ctx.rotate(bellRing);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#DAA520';
            ctx.beginPath();
            ctx.arc(0, 2, 8, 0, Math.PI);
            ctx.fill();
            ctx.restore();
            
            // Back wheel
            drawWheel(-50, 30, 25);
            
            // Front wheel
            drawWheel(45, 30, 25);
            
            // Chain ring and chain
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 30, 8, 0, Math.PI*2);
            ctx.stroke();
            
            // Chain
            ctx.beginPath();
            ctx.moveTo(-8, 30);
            ctx.lineTo(-42, 30);
            ctx.stroke();
            
            // Pedals
            const pedalAngle = state.wheelRotation;
            ctx.fillStyle = '#333';
            ctx.save();
            ctx.translate(0, 30);
            ctx.rotate(pedalAngle);
            ctx.fillRect(-4, -12, 8, 4);
            ctx.fillRect(-4, 8, 8, 4);
            ctx.restore();
            
            ctx.restore();
        }

        function drawWheel(cx, cy, r) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(state.wheelRotation);
            
            // Tire
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI*2);
            ctx.stroke();
            
            // Rim
            ctx.strokeStyle = '#C0C0C0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, r - 4, 0, Math.PI*2);
            ctx.stroke();
            
            // Hub
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI*2);
            ctx.fill();
            
            // Spokes
            ctx.strokeStyle = '#A0A0A0';
            ctx.lineWidth = 1;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(4 * Math.cos(angle), 4 * Math.sin(angle));
                ctx.lineTo((r - 4) * Math.cos(angle), (r - 4) * Math.sin(angle));
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawParticles() {
            // Feathers
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            state.feathers.forEach((f, i) => {
                f.x -= f.vx + state.speed;
                f.y += f.vy;
                f.rotation += f.rotSpeed;
                f.vy += 0.1;
                
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation);
                ctx.beginPath();
                ctx.ellipse(0, 0, f.size, f.size/3, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
                
                if (f.y > H) state.feathers.splice(i, 1);
            });
            
            // Sweat drops
            ctx.fillStyle = '#87CEEB';
            state.sweatDrops.forEach((s, i) => {
                s.y += s.vy;
                ctx.beginPath();
                ctx.arc(s.x, s.y, 4, 0, Math.PI*2);
                ctx.fill();
                
                if (s.y > H) state.sweatDrops.splice(i, 1);
            });
            
            // Fish
            state.fish.forEach((f, i) => {
                if (f.y < f.targetY) {
                    f.y += f.vy;
                } else {
                    f.vy = 0;
                    f.y = f.targetY;
                    // Fish caught animation
                    if (f.timer === undefined) f.timer = 0;
                    f.timer++;
                    if (f.timer > 30) state.fish.splice(i, 1);
                }
                
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.fillStyle = '#6495ED';
                ctx.beginPath();
                ctx.ellipse(0, 0, f.size, f.size/2, 0, 0, Math.PI*2);
                ctx.fill();
                // Tail
                ctx.beginPath();
                ctx.moveTo(-f.size, 0);
                ctx.lineTo(-f.size - 10, -8);
                ctx.lineTo(-f.size - 10, 8);
                ctx.closePath();
                ctx.fill();
                // Eye
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(f.size/2, -2, 2, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });
            
            // Generate feathers randomly
            if (Math.random() < 0.02 * state.speed) {
                state.feathers.push({
                    x: W/2 + 50 + Math.random()*50,
                    y: H/2 - 50 + Math.random()*30,
                    vx: Math.random()*2,
                    vy: -1 - Math.random()*2,
                    size: 8 + Math.random()*8,
                    rotation: Math.random()*Math.PI*2,
                    rotSpeed: (Math.random()-0.5)*0.2
                });
            }
        }

        function updateState() {
            state.time += 0.016;
            
            // Speed affects all animations
            const speedFactor = state.speed / 5;
            
            // Pelican bounce
            state.pelicanBounce += speedFactor * 0.3;
            
            // Wing flapping
            state.wingAngle += speedFactor * 0.2;
            
            // Wheel rotation
            state.wheelRotation += speedFactor * 0.15;
            
            // Pouch wobble
            state.pouchWobble += speedFactor * 0.1;
            
            // Stamina
            if (state.speed > 5) {
                state.stamina = Math.max(0, state.stamina - 0.05 * state.speed);
            } else if (state.speed < 3) {
                state.stamina = Math.min(100, state.stamina + 0.02);
            }
            
            // Breath scale based on stamina
            state.breathScale = 1 + (100 - state.stamina) / 100;
            
            // Startled decay
            if (state.startled > 0) {
                state.startled *= 0.95;
                if (state.startled < 0.01) state.startled = 0;
            }
            
            // Ring animation
            if (state.isRinging) {
                state.ringTime += 0.016;
                if (state.ringTime > 0.5) {
                    state.isRinging = false;
                    state.ringTime = 0;
                }
            }
            
            // Feed animation
            if (state.isFeeding) {
                state.feedTime += 0.016;
                if (state.feedTime > 2) {
                    state.isFeeding = false;
                    state.feedTime = 0;
                }
            }
            
            // Update UI
            document.getElementById('stamina-text').textContent = Math.round(state.stamina) + '%';
            document.getElementById('stamina-fill').style.width = state.stamina + '%';
            
            if (state.stamina < 20) {
                document.getElementById('state-text').textContent = '精疲力尽！';
                document.getElementById('stamina-fill').style.background = 'linear-gradient(90deg, #f44336, #ff5722)';
            } else if (state.stamina < 50) {
                document.getElementById('state-text').textContent = '有点累了...';
                document.getElementById('stamina-fill').style.background = 'linear-gradient(90deg, #ff9800, #ffc107)';
            } else if (state.speed > 7) {
                document.getElementById('state-text').textContent = '冲刺中！';
                document.getElementById('stamina-fill').style.background = 'linear-gradient(90deg, #2196F3, #03A9F4)';
            } else if (state.startled > 0.5) {
                document.getElementById('state-text').textContent = '被铃声吓到！';
            } else {
                document.getElementById('state-text').textContent = '悠闲小跑';
                document.getElementById('stamina-fill').style.background = 'linear-gradient(90deg, #4CAF50, #8BC34A)';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            
            drawSky();
            drawClouds();
            drawSea();
            drawGround();
            drawParticles();
            
            const pelicanX = W/2 - 40;
            const pelicanY = H/2 + 30;
            
            drawPelican(pelicanX, pelicanY);
            drawBicycle(pelicanX, pelicanY);
            
            updateState();
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
