<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>自行车骑鹈鹕 · 跨代模型前端擂台</title>
<style>
:root{
  --ink:#0e1f38; --panel:rgba(13,26,48,.94); --line:#2a4a74;
  --gold:#ffcf4d; --coral:#ff6b4a; --paper:#f2f8ff;
  --disp:'KaiTi','STKaiti','BiauKai','DFKai-SB','Songti SC','Noto Serif SC',serif;
  --sans:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#12304f;font-family:var(--sans)}
#cv{position:fixed;inset:0;display:block;cursor:crosshair}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 42%, transparent 55%, rgba(8,18,38,.34) 100%)}
#ui{position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#ui .btn,#ui input,#ui .seg{pointer-events:auto}

/* —— 考卷题头 —— */
#brand{position:absolute;top:22px;left:26px;color:#fffdf4;text-shadow:0 2px 14px rgba(8,18,40,.55),0 1px 2px rgba(8,18,40,.45);animation:rise .8s .1s both}
#brand .tag{font-size:11px;letter-spacing:.42em;font-weight:600;opacity:.92;margin-bottom:7px}
#brand h1{font-family:var(--disp);font-size:clamp(30px,4.4vw,50px);line-height:1.05;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
#brand .seal{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;font-size:.46em;background:#d94f3d;color:#fff;border-radius:5px;transform:rotate(-5deg);box-shadow:0 3px 10px rgba(120,20,10,.4),inset 0 0 0 2px rgba(255,255,255,.35)}
#brand .sub{font-size:11px;letter-spacing:.24em;margin-top:7px;font-weight:600;opacity:.85}

/* —— 仪表 —— */
#stats{position:absolute;top:20px;right:20px;width:216px;background:var(--panel);border:2px solid #081428;border-radius:14px;padding:12px 14px 13px;color:var(--paper);box-shadow:0 12px 32px rgba(4,12,28,.5),inset 0 1px 0 rgba(255,255,255,.07);animation:rise .8s .3s both}
#stats .hd{font-size:10px;letter-spacing:.3em;color:#8fb0d8;font-weight:700;margin-bottom:9px}
#stats .hd b{color:var(--gold)}
.moodrow{display:flex;align-items:center;gap:9px;margin-bottom:10px}
#moodFace{font-size:22px;line-height:1}
#moodText{font-size:13px;font-weight:600;color:#eaf3ff}
.stam{margin-bottom:11px}
.stam .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;color:#8fb0d8;font-weight:700;margin-bottom:4px}
.stam .lbl b{font-family:var(--mono);color:#eaf3ff;letter-spacing:0}
.track{height:11px;background:#081428;border-radius:6px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
#stamFill{display:block;height:100%;width:100%;background:hsl(115,72%,55%)}
.nums{display:flex;gap:10px}
.nums>div{flex:1;background:#0a1a33;border-radius:9px;padding:7px 10px 8px;border:1px solid #1d3a63}
.nums b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--paper);line-height:1.05}
.nums small{font-size:9px;letter-spacing:.2em;color:#8fb0d8;font-weight:700}

/* —— 控制台 —— */
#dock{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:var(--panel);border:2px solid #081428;border-radius:16px;padding:10px 13px;box-shadow:0 14px 36px rgba(4,12,28,.55),inset 0 1px 0 rgba(255,255,255,.07);animation:dockIn .8s .45s both;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
.btn{font-family:var(--sans);font-size:14px;font-weight:700;color:#eaf3ff;background:#1c355c;border:1px solid #33578a;border-radius:11px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .14s ease,background .14s ease,box-shadow .14s ease;box-shadow:0 3px 0 #0c1c36;touch-action:manipulation}
.btn:hover{transform:translateY(-2px);background:#27487c;box-shadow:0 5px 0 #0c1c36,0 8px 18px rgba(0,0,0,.35)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #0c1c36}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn .em{font-size:16px}
kbd{font-family:var(--mono);font-size:9px;background:rgba(255,255,255,.13);border-radius:4px;padding:2px 5px;color:#bcd4f2;letter-spacing:.05em}
#bSprint.on{background:var(--coral);border-color:#a83517;color:#fff;box-shadow:0 3px 0 #7d2410;animation:pulse .6s infinite alternate}
.sl{display:flex;align-items:center;gap:8px;background:#0f2444;border-radius:11px;padding:6px 12px;border:1px solid #23426e}
.sl span{font-size:12px;font-weight:700;color:#bcd4f2;letter-spacing:.1em}
input[type=range]{width:118px;accent-color:var(--coral);cursor:pointer}
.seg{display:flex;background:#0f2444;border:1px solid #23426e;border-radius:11px;padding:3px;gap:3px}
.seg button{font-family:var(--sans);font-size:12px;font-weight:700;color:#9db8dd;background:transparent;border:0;border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .15s ease}
.seg button:hover{color:#fff;background:#1c355c}
.seg button.on{background:var(--gold);color:#20304f;box-shadow:0 2px 6px rgba(255,207,77,.35)}
#hint{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:rgba(13,26,48,.72);border:1px solid #24446f;color:#cfe2fa;font-size:11.5px;letter-spacing:.06em;padding:6px 14px;border-radius:999px;white-space:nowrap;animation:rise .8s .6s both;transition:opacity 1s}
#hint.dim{opacity:.4}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pulse{from{box-shadow:0 3px 0 #7d2410,0 0 0 0 rgba(255,107,74,.55)}to{box-shadow:0 3px 0 #7d2410,0 0 0 9px rgba(255,107,74,0)}}

@media (max-width:860px){
  #brand{top:14px;left:14px}
  #brand .tag{letter-spacing:.28em;font-size:10px}
  #stats{top:12px;right:12px;width:172px;padding:10px}
  #hint{display:none}
  .btn{padding:8px 10px;font-size:13px}
  kbd{display:none}
  input[type=range]{width:88px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="ui">
  <header id="brand">
    <div class="tag">跨代模型前端擂台 · 统一考卷</div>
    <h1>自行车骑鹈鹕<span class="seal">题</span></h1>
    <div class="sub">A BICYCLE RIDING A PELICAN —— 上是车，下是鹈</div>
  </header>

  <aside id="stats">
    <div class="hd">骑行仪表 <b>· LIVE</b></div>
    <div class="moodrow"><span id="moodFace">🙂</span><span id="moodText">神清气爽</span></div>
    <div class="stam">
      <div class="lbl"><span>体力 STAMINA</span><b id="stamPct">100</b></div>
      <div class="track"><i id="stamFill"></i></div>
    </div>
    <div class="nums">
      <div><b id="spd">0.0</b><small>速度 KM/H</small></div>
      <div><b id="dist">0</b><small>里程 M</small></div>
    </div>
  </aside>

  <div id="dock">
    <button class="btn" id="bBell"><span class="em">🔔</span>按车铃<kbd>B</kbd></button>
    <button class="btn" id="bFish"><span class="em">🐟</span>投喂小鱼<kbd>F</kbd></button>
    <button class="btn" id="bSprint"><span class="em">🚀</span>冲刺<kbd>S 按住</kbd></button>
    <label class="sl"><span>节奏</span><input type="range" id="spSlider" min="0" max="100" value="55"></label>
    <div class="seg" id="roadSeg"><button data-v="deck" class="on">木栈道</button><button data-v="rocks">礁石路</button></div>
    <div class="seg" id="skySeg"><button data-v="day" class="on">☀️</button><button data-v="dusk">🌇</button><button data-v="night">🌙</button></div>
  </div>

  <div id="hint">空格 = 车铃 · 也可以直接点画里的金色小铃铛 · 鹈鹕没电了就喂鱼吧</div>
</div>

<script>
(function(){
'use strict';
/* ================= 基础 ================= */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(id){return document.getElementById(id);}
var moodFace=$('moodFace'),moodText=$('moodText'),stamFill=$('stamFill'),stamPct=$('stamPct'),spdEl=$('spd'),distEl=$('dist');
var INK='#26313f', F_D="'KaiTi','STKaiti','BiauKai','DFKai-SB','Songti SC','Noto Serif SC',serif";
var W=0,H=0,DPR=1,camX=0,gy=0,PS=1;
function recompute(){camX=W*.42;gy=H*.745;PS=Math.min(1,Math.max(.6,Math.min(W/1050,H/660)));}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';recompute();}
window.addEventListener('resize',resize);resize();

function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function R(){return Math.random();}
function cb(a,b,c,d,t){var m=1-t;return a*m*m*m+3*b*m*m*t+3*c*m*t*t+d*t*t*t;}
function easeOutBack(k){var c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);}
function hpx(n){n=Math.imul(n|0,2654435761);n^=n>>>13;n=Math.imul(n,2246822519);n^=n>>>16;return((n>>>0)&255)/255;}
function rotPt(p,a){var c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c];}
function rotAbout(px,py,ax,ay,a){var c=Math.cos(a),s=Math.sin(a),dx=px-ax,dy=py-ay;return[ax+dx*c-dy*s,ay+dx*s+dy*c];}
function C(col,a){return 'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(a==null?1:a)+')';}

/* ================= 时辰调色板 ================= */
var PAL={
 day:{skyT:[124,197,242],skyB:[233,247,254],sea:[29,134,190],seaT:[98,190,232],land:[64,124,110],deck1:[172,115,62],deck2:[140,91,45],rock1:[158,164,176],rock2:[124,132,150],rockEdge:[104,112,130],edge:[88,54,28],reed:[52,118,72],cloud:[255,255,255],cloudA:.95,sun:[255,213,92],sunX:.8,sunY:.17,sunR:30,moon:0,star:0,lamp:0,night:0,warm:0},
 dusk:{skyT:[72,62,134],skyB:[255,161,104],sea:[30,82,124],seaT:[201,132,112],land:[50,76,97],deck1:[138,86,48],deck2:[112,65,34],rock1:[150,128,130],rock2:[114,94,104],rockEdge:[88,70,80],edge:[68,40,22],reed:[42,86,64],cloud:[255,212,188],cloudA:.85,sun:[255,174,84],sunX:.84,sunY:.47,sunR:42,moon:0,star:.3,lamp:.55,night:.12,warm:.16},
 night:{skyT:[9,18,44],skyB:[26,60,102],sea:[12,36,66],seaT:[33,76,120],land:[14,31,51],deck1:[76,52,34],deck2:[56,37,24],rock1:[95,106,128],rock2:[68,78,98],rockEdge:[44,54,74],edge:[36,24,14],reed:[26,56,44],cloud:[146,166,196],cloudA:.4,sun:[245,240,222],sunX:.74,sunY:.15,sunR:23,moon:1,star:1,lamp:1,night:.5,warm:.04}
};
function mixPal(A,B,k){var o={},key;for(key in A){var a=A[key],b=B[key];o[key]=(typeof a==='number')?a+(b-a)*k:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];}return o;}
var skyFrom=PAL.day,skyTo=PAL.day,skyK=1,P=mixPal(PAL.day,PAL.day,1);

var STARS=[],CLD=[];
for(var i=0;i<90;i++)STARS.push({x:R(),y:R(),r:.5+R()*1.2,ph:R()*6.28,big:R()<.07});
for(var j=0;j<6;j++)CLD.push({x:R(),y:.05+R()*.22,s:.5+R()*.9,v:.5+R()});

/* ================= 状态 ================= */
var S={sky:'day',road:'deck',slider:.55,sprint:false,stamina:100,distPx:0,phase:0,wingPh:0,
 speed:.4,burst:0,sprintE:0,hop:0,hopVel:0,bikeY:0,wY:0,wV:0,rY:0,rV:0,pouch:0,pouchV:0,
 blink:0,blinkT:1.4,startle:0,feedT:0,patT:0,ringT:0,exhaust:false,shake:0,fish:null,
 parts:[],pops:[],bellW:{x:0,y:0},headW:{x:0,y:0},sweatAcc:0,dustAcc:0,featherAcc:0};
var T=0;

/* ================= 音频（纯代码合成） ================= */
var AC=null,master=null,noiseBuf=null;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);}catch(e){AC=null;}
}
function mkNoise(){if(noiseBuf)return noiseBuf;var len=Math.floor(AC.sampleRate*.5);noiseBuf=AC.createBuffer(1,len,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<len;i++)d[i]=R()*2-1;return noiseBuf;}
function sndBell(){if(!AC)return;var t0=AC.currentTime+.01;
  [[0],[.14]].forEach(function(off){[[1245,.3,.24],[2490,.12,.15],[3735,.05,.1]].forEach(function(p){
    var o=AC.createOscillator(),g=AC.createGain(),t=t0+off[0];
    o.type='sine';o.frequency.setValueAtTime(p[0]+R()*8-4,t);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p[1],t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+p[2]);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+p[2]+.06);});});
}
function sndPlop(){if(!AC)return;var t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(480,t0);o.frequency.exponentialRampToValueAtTime(130,t0+.16);g.gain.setValueAtTime(.35,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.2);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.24);}
function sndWhoosh(){if(!AC)return;var t0=AC.currentTime,src=AC.createBufferSource();src.buffer=mkNoise();var f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.1;f.frequency.setValueAtTime(280,t0);f.frequency.exponentialRampToValueAtTime(1500,t0+.4);var g=AC.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+.06);g.gain.exponentialRampToValueAtTime(.0001,t0+.45);src.connect(f);f.connect(g);g.connect(master);src.start(t0);src.stop(t0+.5);}
function sndTick(){if(!AC)return;var t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=640;g.gain.setValueAtTime(.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.06);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.08);}
function sndChirp(){if(!AC)return;var t0=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(920,t0);o.frequency.exponentialRampToValueAtTime(1400,t0+.09);g.gain.setValueAtTime(.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+.2);}

/* ================= 交互动作 ================= */
function addPop(text,color,x,y,size,rot){S.pops.push({text:text,color:color,x:x,y:(y||gy-300),t:0,life:1.15,size:size||28,rot:rot||0});}
function spawnFeathers(n){for(var i=0;i<n;i++){S.parts.push({type:'f',x:camX+PS*(R()*90-30),y:gy+PS*(R()*-90-25),vx:-(60+R()*90),vy:-(40+R()*80),rot:R()*6.3,vr:(R()*2-1)*5,ph:R()*6,t:0,life:1.6+R()*.9});}}
function spawnSweat(){S.parts.push({type:'s',x:S.headW.x+6,y:S.headW.y-6,vx:-(40+R()*70),vy:-(90+R()*60),t:0,life:.7});}
function spawnDust(){S.parts.push({type:'d',x:camX+PS*(R()*70-30),y:gy-2,vx:-(30+R()*80),vy:-(20+R()*50),r:1.5+R()*2.5,t:0,life:.5});}
function spawnSpark(n){for(var i=0;i<n;i++)S.parts.push({type:'k',x:S.headW.x+60,y:S.headW.y+14,vx:(R()*2-1)*90,vy:-(60+R()*120),t:0,life:.8,s:3+R()*4});}

function doRing(){ensureAudio();sndBell();
  S.burst=Math.min(1.1,S.burst+.9);S.startle=.62;S.ringT=.5;S.shake=Math.max(S.shake,.5);
  S.wV-=300;S.rV+=1.3;S.pouchV+=110;spawnFeathers(5);
  addPop('叮——！','#ffd166',S.bellW.x+14,S.bellW.y-34,30,-.08);}
function doFeed(){if(S.fish)return;ensureAudio();sndTick();S.fish={t:0};addPop('小鱼来啦！','#9fd4ff',camX+10,gy-330*PS,26,.05);}
function doPat(){ensureAudio();sndChirp();S.patT=.7;addPop('♥','#ff6b8a',S.headW.x,S.headW.y-42,32,.1);}
function toggleSprint(on){if(on===S.sprint)return;if(on)ensureAudio();
  S.sprint=on;if(on&&!S.exhaust)sndWhoosh();var b=$('bSprint');if(b)b.classList.toggle('on',on);}
function markSeg(id,v){var btns=document.querySelectorAll('#'+id+' button');for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].getAttribute('data-v')===v);}
function setSky(v){if(v===S.sky)return;S.sky=v;skyFrom=P;skyTo=PAL[v];skyK=0;markSeg('skySeg',v);ensureAudio();sndTick();}
function setRoad(v){if(v===S.road)return;S.road=v;markSeg('roadSeg',v);ensureAudio();sndTick();}

/* ================= 更新 ================= */
function update(dt){
  skyK=Math.min(1,skyK+dt/.9);P=mixPal(skyFrom,skyTo,1-Math.pow(1-skyK,3));
  S.ringT=Math.max(0,S.ringT-dt);S.startle=Math.max(0,S.startle-dt*1.15);S.feedT=Math.max(0,S.feedT-dt);S.patT=Math.max(0,S.patT-dt);
  S.shake*=Math.exp(-dt*4.5);
  S.blinkT-=dt;if(S.blinkT<=0){S.blink=1;S.blinkT=1.4+R()*2.6;}S.blink=Math.max(0,S.blink-dt*8);

  var wasEx=S.exhaust;
  if(S.stamina<=0)S.exhaust=true;else if(S.stamina>14)S.exhaust=false;
  var sprintT=(S.sprint&&!S.exhaust)?1:0;
  S.sprintE+=(sprintT-S.sprintE)*Math.min(1,dt*5);
  var ts;
  if(S.exhaust)ts=.12+S.burst*.85;else ts=.12+S.slider*.95+S.burst*.9+S.sprintE*.95;
  ts=clamp(ts,.05,1.8);
  S.speed+=(ts-S.speed)*Math.min(1,dt*3.4);
  S.burst*=Math.exp(-dt*.85);
  var drain=Math.max(0,S.speed-.62)*3.1+S.sprintE*2.6;
  var regen=S.speed<.3?3.4:.35;
  S.stamina=clamp(S.stamina-(drain-regen)*dt,0,100);
  if(S.exhaust&&!wasEx)addPop('噗…没电了','#ff8b6a',camX-40,gy-270*PS,30,0);

  S.phase+=dt*(1.5+S.speed*7.6);
  S.wingPh+=dt*(2.4+S.speed*11);
  S.distPx+=dt*S.speed*560;

  var amp=2+S.speed*(S.road==='rocks'?11:7.5);
  var hop=(.5-.5*Math.cos(S.phase*2))*amp;
  if(S.road==='rocks')hop+=Math.abs(Math.sin(S.phase*4))*S.speed*3;
  S.hopVel=(hop-S.hop)/Math.max(dt,1e-4);S.hop=hop;

  S.bikeY+=((S.hop*.45)-S.bikeY)*Math.min(1,dt*7);
  S.wV+=(-S.wY*150-S.wV*7)*dt;S.wY=clamp(S.wY+S.wV*dt,-13,13);
  S.rV+=(-S.rY*110-S.rV*6)*dt;S.rY=clamp(S.rY+S.rV*dt,-.24,.24);
  S.pouchV+=((S.hopVel*.3)-S.pouch*26-S.pouchV*3.6)*dt;S.pouch=clamp(S.pouch+S.pouchV*dt,-13,15);

  if(S.fish){S.fish.t+=dt/.82;
    if(S.fish.t>=1){S.fish=null;S.feedT=1.15;S.stamina=clamp(S.stamina+34,0,100);sndPlop();spawnSpark(7);
      addPop('嗷呜！真香！','#ffd166',S.headW.x+56,S.headW.y-46,30,.06);}}

  var sr=(S.speed>.85?2:0)+(S.stamina<35?3:0)+(S.exhaust?5:0);

  for(var i=S.parts.length-1;i>=0;i--){var p=S.parts[i];p.t+=dt;if(p.t>=p.life){S.parts.splice(i,1);continue;}
    if(p.type==='f'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy=Math.min(40,p.vy+50*dt);p.vx*=Math.exp(-dt*.8);p.rot+=p.vr*dt;p.y+=Math.sin(T*5+p.ph)*14*dt;}

function leg(hx,ph,far){var sp=S.speed,A=.45+sp*.62,R2=24+sp*22;
  var th=Math.sin(ph)*A+.18;

function drawNeckHead(){var sp=S.speed;
  var bob=Math.sin(S.phase*2+.6)*2.2*(.4+sp)-S.startle*14;
  var droop=S.exhaust?10:0;
  var hx=96-S.startle*16,hy=-128+bob+droop;
  var c1x=48,c1y=-88,c2x=58,c2y=-116+(S.exhaust?6:0);
  var pts=[],n=8,L=[],Rg=[];
  for(var i=0;i<=n;i++){var p=i/n;pts.push([cb(30,c1x,c2x,hx,p),cb(-58,c1y,c2y,hy,p)]);}
  for(var i2=0;i2<pts.length;i2++){var p2=i2/n,w=lerp(16,11,p2)/2,dx,dy;
    if(i2<pts.length-1){dx=pts[i2+1][0]-pts[i2][0];dy=pts[i2+1][1]-pts[i2][1];}
    else{dx=pts[i2][0]-pts[i2-1][0];dy=pts[i2][1]-pts[i2-1][1];}
    var m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
    L.push([pts[i2][0]-dy*w,pts[i2][1]+dx*w]);Rg.push([pts[i2][0]+dy*w,pts[i2][1]-dx*w]);}
  ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);

  ctx.closePath();ctx.fillStyle='#fdf9f1';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=INK;ctx.stroke();

  ctx.beginPath();ctx.arc(hx,hy,14.5,0,6.284);ctx.fillStyle='#fdf9f1';ctx.fill();ctx.lineWidth=2.4;ctx.strokeStyle=INK;ctx.stroke();
  var cw=Math.sin(T*9)*(2+sp*3)+S.startle*5;

  ctx.beginPath();ctx.moveTo(hx+1,hy-14);ctx.quadraticCurveTo(hx+2,hy-25+cw*.6,hx+8,hy-22+cw*.8);ctx.stroke();

  var ex=hx+6,ey=hy-3,happy=S.feedT>.25||S.patT>.25,er=S.startle>.2?6.2:5.2;
  if(happy){ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-5,ey+1);ctx.quadraticCurveTo(ex,ey-4,ex+5,ey+1);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(ex,ey,er,0,6.284);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=INK;ctx.stroke();
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(ex+1.6,ey+(S.exhaust?.8:0),S.exhaust?1.6:2.4,0,6.284);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+2.4,ey-1.4,.9,0,6.284);ctx.fill();
    if(S.blink>.4){ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-er,ey);ctx.quadraticCurveTo(ex,ey-er*.7,ex+er,ey);ctx.stroke();}}
  if(S.startle>.2||S.exhaust){ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.beginPath();
    if(S.startle>.2){ctx.moveTo(ex-6,ey-10);ctx.lineTo(ex+5,ey-12);}else{ctx.moveTo(ex-6,ey-8);ctx.lineTo(ex+5,ey-7);}
    ctx.stroke();}

  var bx=hx+10,by=hy+2;
  var open=S.startle>.15?.5:S.exhaust?.3+.2*Math.sin(T*9):S.sprintE>.5?.34:S.feedT>0?.14:.06+sp*.1;
  var hold=S.feedT>0?clamp(Math.min(S.feedT,1.15-S.feedT)*4,0,1):0;

  ctx.fillStyle='#f2a45c';ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();
  if(hold>.3){ctx.fillStyle='#f2a45c';ctx.beginPath();ctx.ellipse(34,pc*.6,11,8,0,0,6.284);ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();}
  ctx.rotate(-open*.9);
  ctx.beginPath();ctx.moveTo(-2,-4);ctx.quadraticCurveTo(34,-8,76,-3);ctx.lineTo(78,0);ctx.quadraticCurveTo(34,3,-2,3);ctx.closePath();
  ctx.fillStyle='#f4a83e';ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=INK;ctx.stroke();
  ctx.strokeStyle='rgba(38,49,63,.35)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(14,-4.5);ctx.lineTo(42,-5);ctx.stroke();

    for(var ti=0;ti<tubes.length;ti++){ctx.moveTo(tubes[ti][0][0],tubes[ti][0][1]);ctx.lineTo(tubes[ti][1][0],tubes[ti][1][1]);}
    ctx.stroke();}
  ctx.strokeStyle=INK;ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(22,-36);ctx.quadraticCurveTo(27,-18,32,0);ctx.stroke();
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,-36);ctx.lineTo(24,-43);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-6,-34);ctx.lineTo(-8,-41);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-17,-42);ctx.quadraticCurveTo(-15,-48,-4,-46);ctx.quadraticCurveTo(3,-45,3,-41);ctx.quadraticCurveTo(-8,-38.5,-17,-42);ctx.closePath();
  ctx.fillStyle='#4a3428';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(24,-43);ctx.quadraticCurveTo(28,-52,17,-55);ctx.stroke();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(16,-55,2.8,0,6.284);ctx.fill();
  /* 金色小铃铛（可直接点击） */
  ctx.save();ctx.translate(20,-59);ctx.rotate(Math.sin(S.ringT*46)*S.ringT*1.4);
  ctx.beginPath();ctx.arc(0,1,4.6,Math.PI,0);ctx.lineTo(4.6,2.6);ctx.lineTo(-4.6,2.6);ctx.closePath();
  ctx.fillStyle='#f6c445';ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=INK;ctx.stroke();
  ctx.beginPath();ctx.arc(0,-3.6,1.5,0,6.284);ctx.fillStyle=INK;ctx.fill();
  ctx.restore();
  /* 曲柄与脚踏：随里程联动 */
  var cr=S.distPx/18;
  for(var f2=0;f2<2;f2++){var a=f2?cr+Math.PI:cr,px2=Math.cos(a)*9,py2=Math.sin(a)*9;
    ctx.strokeStyle=f2?'rgba(38,49,63,.6)':INK;ctx.lineWidth=f2?2.5:3;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(px2,py2);ctx.stroke();
    ctx.fillStyle=INK;ctx.globalAlpha=f2?.55:1;ctx.fillRect(px2-4.5,py2-1.6,9,3.2);ctx.globalAlpha=1;}
  ctx.beginPath();ctx.arc(0,0,8.5,0,6.284);ctx.fillStyle='rgba(38,49,63,.12)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=INK;ctx.stroke();
  /* 拟人：车架上的眼睛 */
  if(S.blink>.4){ctx.strokeStyle=INK;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(1,-40);ctx.quadraticCurveTo(4,-38,7,-40);ctx.moveTo(10,-41);ctx.quadraticCurveTo(13,-39,16,-41);ctx.stroke();}
  else{var eyes=[[4,-40],[13,-41]];
    for(var ei=0;ei<2;ei++){ctx.beginPath();ctx.arc(eyes[ei][0],eyes[ei][1],3.1,0,6.284);ctx.fillStyle='#fff';ctx.fill();
      ctx.lineWidth=1.4;ctx.strokeStyle=INK;ctx.stroke();
      ctx.beginPath();ctx.arc(eyes[ei][0]+1.1,eyes[ei][1],1.5,0,6.284);ctx.fillStyle=INK;ctx.fill();}}
  ctx.strokeStyle='rgba(38,49,63,.55)';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(6,-34);ctx.quadraticCurveTo(9,-32,12,-34);ctx.stroke();
  ctx.fillStyle='rgba(255,138,106,.4)';
  ctx.beginPath();ctx.arc(0,-35,1.8,0,6.284);ctx.fill();
  ctx.beginPath();ctx.arc(17,-36,1.8,0,6.284);ctx.fill();
  /* 水壶 */
  ctx.save();ctx.translate(8,-18);ctx.rotate(-1.05);
  ctx.fillStyle='#3f9fae';ctx.fillRect(-2.2,-5,4.4,10);ctx.lineWidth=1.2;ctx.strokeStyle=INK;ctx.strokeRect(-2.2,-5,4.4,10);
  ctx.fillStyle=INK;ctx.fillRect(-1.4,-6.5,2.8,2);ctx.restore();
  /* 小三角旗 */
  ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-30,0);ctx.lineTo(-33,-20);ctx.stroke();
  var fl=Math.sin(T*11)*3;
  ctx.beginPath();ctx.moveTo(-33,-20);ctx.lineTo(-49+fl,-24+Math.cos(T*8)*2);ctx.lineTo(-33,-14);ctx.closePath();
  ctx.fillStyle='#ff6b4a';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle=INK;ctx.stroke();
  /* 车把上的围巾 */
  ctx.lineCap='round';ctx.strokeStyle='#ff8b6a';ctx.lineWidth=3.6;
  ctx.beginPath();ctx.moveTo(20,-50);
  ctx.quadraticCurveTo(8,-47+Math.sin(T*9)*2,-2,-41+Math.sin(T*9+1.3)*3);
  ctx.quadraticCurveTo(-11,-35+Math.sin(T*9+2.2)*4,-18,-28+Math.sin(T*9+3)*4);
  ctx.stroke();
  ctx.restore();}

function drawRein(){var br=-.2+S.rY;
  var p=rotPt([16,-55],br);p=[p[0]+6,p[1]+(-78+S.bikeY+S.wY)];
  var cx0=62,cy0=-92;
  ctx.strokeStyle='rgba(38,49,63,.9)';ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.quadraticCurveTo((p[0]+cx0)/2+5,(p[1]+cy0)/2+15,cx0,cy0);ctx.stroke();
  ctx.strokeStyle=INK;ctx.lineWidth=6.5;
  ctx.beginPath();ctx.moveTo(cx0-6.2,cy0-5);ctx.lineTo(cx0+6.2,cy0+5);ctx.stroke();
  ctx.strokeStyle='#ff6b4a';ctx.lineWidth=4.2;
  ctx.beginPath();ctx.moveTo(cx0-6.2,cy0-5);ctx.lineTo(cx0+6.2,cy0+5);ctx.stroke();
  var bx2=cx0+2,by2=cy0-9;
  ctx.fillStyle='#ff6b4a';ctx.strokeStyle=INK;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(bx2-4,by2,4,2.8,-.5,0,6.284);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(bx2+4,by2-2,4,2.8,.5,0,6.284);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(bx2,by2-1,1.8,0,6.284);ctx.fillStyle=INK;ctx.fill();}

function drawPelican(){var sp=S.speed;
  ctx.save();
  ctx.translate(camX,gy);ctx.scale(PS,PS);
  ctx.fillStyle='rgba(12,24,44,'+(0.14+sp*.05).toFixed(3)+')';
  ctx.beginPath();ctx.ellipse(-6,4,72+sp*22,9,0,0,6.284);ctx.fill();
  ctx.translate(0,-S.hop);
  var tilt=-(sp*.05)+(S.exhaust?.09:0)+Math.sin(S.phase*2)*.012*sp;
  leg(-4,S.phase+.35,true);leg(10,S.phase,false);
  ctx.save();ctx.translate(-34,-48);ctx.rotate(Math.sin(S.phase*2)*.06-sp*.07);
  ctx.fillStyle='#f3ecdc';ctx.strokeStyle=INK;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(2,6);ctx.lineTo(-30,-9);ctx.lineTo(-14,0);ctx.lineTo(-34,4);ctx.lineTo(-15,8);ctx.lineTo(-27,17);ctx.lineTo(2,12);ctx.closePath();
  ctx.fill();ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.ellipse(6,-46,45,33,-.1,0,6.284);ctx.fillStyle='#fdf9f1';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();
  ctx.fillStyle='rgba(38,49,63,.06)';ctx.beginPath();ctx.ellipse(0,-37,33,21,-.12,0,6.284);ctx.fill();
  ctx.strokeStyle='rgba(38,49,63,.18)';ctx.lineWidth=1.5;
  for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(-16+i*10,-72+i*2,7,3.4,5.9);ctx.stroke();}
  ctx.save();ctx.translate(6,-46);ctx.rotate(tilt);ctx.translate(-6,46);
  drawNeckHead();drawWing();drawBike();drawRein();
  ctx.restore();
  ctx.restore();
  /* 世界坐标锚点（铃铛 / 头部） */
  var bq=rotPt([19,-58],-.2+S.rY);bq=[bq[0]+6,bq[1]+(-78+S.bikeY+S.wY)];
  var bp=rotAbout(bq[0],bq[1],6,-46,tilt);
  S.bellW={x:camX+PS*bp[0],y:gy+PS*(bp[1]-S.hop)};
  var hp2=rotAbout(96,-130,6,-46,tilt);
  S.headW={x:camX+PS*hp2[0],y:gy+PS*(hp2[1]-S.hop)};}

/* ================= 粒子 / 鱼 / 漫画字 ================= */
function drawParts(){for(var i=0;i<S.parts.length;i++){var p=S.parts[i],k=1-p.t/p.life;
  if(p.type==='f'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=k;
    ctx.fillStyle='#fff';ctx.strokeStyle='rgba(38,49,63,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(0,0,7,3.2,0,0,6.284);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.stroke();ctx.restore();ctx.globalAlpha=1;}
  else if(p.type==='s'){ctx.globalAlpha=Math.min(1,k*1.4);ctx.fillStyle='#7cc7ff';
    ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,6.284);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(p.x+.8,p.y-.8,.9,0,6.284);ctx.fill();ctx.globalAlpha=1;}
  else if(p.type==='d'){ctx.globalAlpha=k*.7;ctx.fillStyle=S.road==='rocks'?'rgba(120,126,140,1)':'rgba(150,120,80,1)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.284);ctx.fill();ctx.globalAlpha=1;}
  else{ctx.globalAlpha=k;ctx.strokeStyle='#ffd166';ctx.lineWidth=1.8;var s=p.s*k+1;
    ctx.beginPath();ctx.moveTo(p.x-s,p.y);ctx.lineTo(p.x+s,p.y);ctx.moveTo(p.x,p.y-s);ctx.lineTo(p.x,p.y+s);ctx.stroke();ctx.globalAlpha=1;}}}
function drawFish(){if(!S.fish)return;var t=S.fish.t;
  var x0=camX-170,y0=gy-40,cx2=camX-40,cy2=gy-330*PS,xe=camX+PS*182,ye=gy+PS*(-124-S.hop);
  var m=1-t,x=m*m*x0+2*m*t*cx2+t*t*xe,y=m*m*y0+2*m*t*cy2+t*t*ye;
  var ang=Math.atan2(2*m*(cy2-y0)+2*t*(ye-cy2),2*m*(cx2-x0)+2*t*(xe-cx2));
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.globalAlpha=t>.85?Math.max(0,1-(t-.85)/.15):1;
  ctx.fillStyle='#4d9dc3';ctx.strokeStyle=INK;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.ellipse(0,0,10,4.4,0,0,6.284);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-16,-5);ctx.lineTo(-14,0);ctx.lineTo(-16,5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-1,1.4,0,6.284);ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(5.6,-1,.7,0,6.284);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;}
function drawPops(){for(var i=0;i<S.pops.length;i++){var p=S.pops[i],k=p.t/p.life;
  var a=k<.12?k/.12:(k>.7?(1-k)/.3:1);
  var sc=easeOutBack(Math.min(1,k*3.2));
  ctx.save();ctx.translate(p.x,p.y-34*k);ctx.rotate(p.rot);ctx.scale(sc,sc);ctx.globalAlpha=a;
  ctx.font='700 '+p.size+'px '+F_D;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.strokeStyle='rgba(20,30,52,.92)';ctx.lineWidth=5;ctx.strokeText(p.text,0,0);
  ctx.fillStyle=p.color;ctx.fillText(p.text,0,0);
  ctx.restore();ctx.globalAlpha=1;}}
function drawWind(){var sp=S.speed;if(sp<.85)return;
  var a=Math.min(.5,(sp-.85)*1.3);
  ctx.strokeStyle='rgba(255,255,255,'+a.toFixed(3)+')';ctx.lineWidth=2.5;ctx.lineCap='round';
  for(var i=0;i<4;i++){var y=gy-90*PS-i*36*PS+Math.sin(T*17+i*2.1)*7;
    var x1=camX-150*PS-i*26,len=46+sp*45;
    ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x1-len,y);ctx.stroke();}}
function drawBellRipple(){if(S.ringT<=0)return;var a=S.ringT/.5;
  ctx.strokeStyle='rgba(255,209,102,'+(a*.9).toFixed(3)+')';ctx.lineWidth=2.5;
  for(var i=0;i<2;i++){var r=10+i*11+(1-a)*26;
    ctx.beginPath();ctx.arc(S.bellW.x,S.bellW.y,r,-2.3,-.8);ctx.stroke();}}
function drawTint(){
  if(P.warm>.01){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(255,184,120,'+P.warm.toFixed(3)+')';ctx.fillRect(0,0,W,H);ctx.restore();}
  if(P.night>.01){ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgba(28,42,88,'+(P.night*.55).toFixed(3)+')';ctx.fillRect(0,0,W,H);ctx.restore();}}

function draw(){
  recompute();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var shx=(R()*2-1)*(S.shake*9+(S.road==='rocks'?S.speed*1.3:0));
  var shy=(R()*2-1)*(S.shake*6.5+(S.road==='rocks'?S.speed:0));
  ctx.save();ctx.translate(shx,shy);
  ctx.lineJoin='round';ctx.lineCap='round';
  drawSky();drawClouds();drawGulls();drawSea();drawShore();drawGround();
  drawPelican();
  drawWind();drawParts();drawFish();drawReeds();drawPops();drawBellRipple();
  ctx.restore();
  drawTint();}

/* ================= 仪表 ================= */
var lastMood='';
function hud(){
  stamFill.style.width=S.stamina.toFixed(1)+'%';
  stamFill.style.background='hsl('+(S.stamina*1.15|0)+',72%,55%)';
  stamPct.textContent=Math.round(S.stamina);
  spdEl.textContent=(S.speed*38).toFixed(1);
  distEl.textContent=Math.floor(S.distPx*.02);
  var m;
  if(S.startle>.15)m='😲|天呐！车铃响了！';
  else if(S.feedT>.3)m='😋|真香，再来一条';
  else if(S.exhaust)m='😮‍💨|腿软了…喂口鱼吧';
  else if(S.sprintE>.5)m='😤|嗷呜——冲刺！';
  else if(S.stamina<35)m='😅|有点喘了';
  else if(S.speed>.7)m='😆|稳稳拿捏';
  else m='🙂|神清气爽';
  if(m!==lastMood){lastMood=m;var i=m.indexOf('|');moodFace.textContent=m.slice(0,i);moodText.textContent=m.slice(i+1);}}

/* ================= 事件 ================= */
$('bBell').addEventListener('click',doRing);
$('bFish').addEventListener('click',doFeed);
var bs=$('bSprint');
bs.addEventListener('pointerdown',function(e){e.preventDefault();toggleSprint(true);});
window.addEventListener('pointerup',function(){toggleSprint(false);});
bs.addEventListener('contextmenu',function(e){e.preventDefault();});
$('spSlider').addEventListener('input',function(e){S.slider=e.target.value/100;});
(function(){var rb=document.querySelectorAll('#roadSeg button');for(var i=0;i<rb.length;i++)rb[i].addEventListener('click',function(){setRoad(this.getAttribute('data-v'));});
 var sb=document.querySelectorAll('#skySeg button');for(var j=0;j<sb.length;j++)sb[j].addEventListener('click',function(){setSky(this.getAttribute('data-v'));});})();
window.addEventListener('keydown',function(e){
  if(e.repeat)return;
  switch(e.key){
    case ' ':case 'b':case 'B':e.preventDefault();doRing();break;
    case 'f':case 'F':doFeed();break;
    case 's':case 'S':toggleSprint(true);break;
    case 'r':case 'R':setRoad(S.road==='deck'?'rocks':'deck');break;
    case '1':setSky('day');break;case '2':setSky('dusk');break;case '3':setSky('night');break;}});
window.addEventListener('keyup',function(e){if(e.key==='s'||e.key==='S')toggleSprint(false);});
cv.addEventListener('pointerdown',function(e){
  if(Math.hypot(e.clientX-S.bellW.x,e.clientY-S.bellW.y)<26){doRing();return;}
  if(Math.hypot(e.clientX-S.headW.x,e.clientY-S.headW.y)<48*PS)doPat();});
cv.addEventListener('pointermove',function(e){
  cv.style.cursor=Math.hypot(e.clientX-S.bellW.x,e.clientY-S.bellW.y)<26?'pointer':'crosshair';});
setTimeout(function(){var h=$('hint');if(h)h.classList.add('dim');},9000);

/* ================= 主循环 ================= */
var lastT=performance.now();
function frame(now){
  var dt=Math.min(.033,(now-lastT)/1000||.016);lastT=now;T=now/1000;
  update(dt);draw();hud();
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
</body>
