<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d8eee7">
  <title>鹈鹕快递 · 自行车骑鹈鹕</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173d43;
      --muted: #627d7d;
      --paper: #fffaf0;
      --accent: #ef754f;
      --accent-dark: #cf5638;
      --mint: #d8eee7;
      --line: rgba(23, 61, 67, .14);
      --shadow: 0 18px 50px rgba(31, 67, 66, .13);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background: #d8eee7;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(239, 117, 79, .38);
      outline-offset: 4px;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      isolation: isolate;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: .19;
      background-image:
        repeating-radial-gradient(circle at 17% 31%, transparent 0, rgba(255,255,255,.28) 1px, transparent 2px, transparent 5px),
        repeating-radial-gradient(circle at 73% 61%, transparent 0, rgba(23,61,67,.12) 1px, transparent 2px, transparent 7px);
      background-size: 11px 13px, 17px 19px;
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: absolute;
      z-index: 5;
      top: max(24px, env(safe-area-inset-top));
      left: clamp(22px, 4vw, 64px);
      right: clamp(22px, 4vw, 64px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      pointer-events: auto;
    }

    .brand-mark {
      width: 49px;
      height: 49px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(23, 61, 67, .2);
      border-radius: 50%;
      background: rgba(255, 250, 240, .45);
      backdrop-filter: blur(8px);
    }

    .brand-mark svg { width: 31px; height: 31px; }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: .11em;
    }

    .brand h1 span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .24em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-button {
      height: 43px;
      min-width: 43px;
      padding: 0 14px;
      border: 1px solid rgba(23, 61, 67, .17);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ink);
      background: rgba(255, 250, 240, .68);
      box-shadow: 0 7px 24px rgba(31, 67, 66, .06);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .icon-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 250, 240, .92);
      box-shadow: 0 10px 28px rgba(31, 67, 66, .11);
    }

    .icon-button:active { transform: translateY(0) scale(.97); }
    .icon-button svg { width: 17px; height: 17px; }
    .icon-button .button-text { font-size: 11px; font-weight: 800; letter-spacing: .05em; }

    .ride-status {
      position: absolute;
      z-index: 4;
      top: max(91px, calc(env(safe-area-inset-top) + 72px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(23, 61, 67, .11);
      border-radius: 999px;
      background: rgba(255, 250, 240, .44);
      color: rgba(23, 61, 67, .72);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .08em;
      backdrop-filter: blur(8px);
      pointer-events: none;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4e9a78;
      box-shadow: 0 0 0 4px rgba(78, 154, 120, .12);
    }

    .ride-status.is-sprinting .status-dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(239,117,79,.15); }

    .telemetry {
      position: absolute;
      z-index: 4;
      left: clamp(22px, 4vw, 64px);
      top: 35%;
      width: 170px;
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
      letter-spacing: .2em;
    }

    .eyebrow::before {
      content: "";
      width: 23px;
      height: 1px;
      background: currentColor;
      opacity: .55;
    }

    .route-name {
      margin: 0 0 19px;
      font-size: 23px;
      font-weight: 850;
      letter-spacing: .03em;
      line-height: 1.2;
    }

    .route-name small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .18em;
    }

    .metric-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 13px 0 4px;
    }

    .metric-value {
      font-size: 29px;
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.05em;
    }

    .metric-unit {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
    }

    .metric-caption {
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .07em;
    }

    .stamina-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      margin-bottom: 7px;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .stamina-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(23, 61, 67, .12);
    }

    .stamina-fill {
      width: 86%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #4e9a78, #9fc36f);
      transition: width .35s ease, background .35s ease;
    }

    .relationship-card {
      position: absolute;
      z-index: 4;
      top: 30%;
      right: clamp(22px, 4vw, 64px);
      width: 148px;
      padding: 17px 17px 15px;
      border: 1px solid rgba(23, 61, 67, .13);
      border-radius: 17px;
      background: rgba(255, 250, 240, .43);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .relationship-card .card-kicker {
      color: var(--muted);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .17em;
    }

    .rider-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 850;
    }

    .rider-line span:last-child {
      color: var(--muted);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .11em;
    }

    .relation-arrow {
      height: 28px;
      margin-left: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--accent);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .relation-arrow svg { width: 14px; height: 22px; }

    .road-control {
      position: absolute;
      z-index: 5;
      right: clamp(22px, 4vw, 64px);
      bottom: 154px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px 8px 8px;
      border: 1px solid rgba(23, 61, 67, .13);
      border-radius: 999px;
      background: rgba(255, 250, 240, .66);
      backdrop-filter: blur(12px);
      cursor: pointer;
      color: var(--ink);
      box-shadow: 0 8px 22px rgba(31,67,66,.06);
      transition: transform .2s ease, background .2s ease;
    }

    .road-control:hover { transform: translateY(-2px); background: rgba(255,250,240,.9); }
    .road-control svg { width: 18px; height: 18px; }
    .road-control span { font-size: 10px; font-weight: 800; letter-spacing: .05em; }

    .control-deck {
      position: absolute;
      z-index: 6;
      left: 50%;
      bottom: max(25px, calc(env(safe-area-inset-bottom) + 16px));
      transform: translateX(-50%);
      width: min(850px, calc(100% - 44px));
      min-height: 99px;
      padding: 13px 15px;
      display: grid;
      grid-template-columns: 142px minmax(190px, 1fr) 112px 135px;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, .56);
      border-radius: 25px;
      background: rgba(255, 250, 240, .84);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.65);
      backdrop-filter: blur(20px) saturate(1.15);
    }

    .bell-control {
      position: relative;
      height: 72px;
      padding: 0 18px;
      border: 0;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #fffaf0;
      background: linear-gradient(145deg, #f38a60, #e56945);
      box-shadow: 0 10px 24px rgba(207, 86, 56, .22), inset 0 1px 0 rgba(255,255,255,.25);
      cursor: pointer;
      overflow: hidden;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .bell-control::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.26), transparent 55%);
      pointer-events: none;
    }

    .bell-control:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(207,86,56,.29); }
    .bell-control:active, .bell-control.is-ringing { transform: scale(.96); }
    .bell-control svg { width: 27px; height: 27px; flex: 0 0 auto; }
    .bell-control strong { display: block; font-size: 13px; letter-spacing: .04em; }
    .bell-control small { display: block; margin-top: 4px; opacity: .73; font-size: 8px; font-weight: 750; letter-spacing: .13em; }

    .speed-control {
      padding: 0 10px;
      min-width: 0;
    }

    .speed-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .speed-heading label {
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .09em;
    }

    .speed-heading output {
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .range-wrap { position: relative; height: 18px; display: flex; align-items: center; }

    input[type="range"] {
      width: 100%;
      height: 4px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--range-fill, 38%), rgba(23,61,67,.13) var(--range-fill, 38%), rgba(23,61,67,.13) 100%);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 17px;
      height: 17px;
      appearance: none;
      -webkit-appearance: none;
      border: 4px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(23,61,67,.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 4px solid var(--paper);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(23,61,67,.2);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 7px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .08em;
    }

    .action-control {
      height: 64px;
      border: 1px solid rgba(23, 61, 67, .13);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--ink);
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .action-control:hover { transform: translateY(-2px); background: rgba(255,255,255,.7); border-color: rgba(23,61,67,.25); }
    .action-control:active { transform: scale(.97); }
    .action-control svg { width: 22px; height: 22px; }
    .action-control strong { display: block; font-size: 11px; font-weight: 850; }
    .action-control small { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; font-weight: 700; }
    .action-control.is-active { color: #fffaf0; border-color: var(--ink); background: var(--ink); }
    .action-control.is-active small { color: rgba(255,250,240,.65); }
    .action-control:disabled { opacity: .52; cursor: default; transform: none; }

    .keyboard-hint {
      position: absolute;
      z-index: 4;
      right: clamp(22px, 4vw, 64px);
      bottom: 38px;
      color: rgba(23, 61, 67, .54);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: .1em;
      pointer-events: none;
    }

    .keyboard-hint kbd {
      padding: 3px 5px;
      border: 1px solid rgba(23,61,67,.15);
      border-radius: 4px;
      font: inherit;
      background: rgba(255,250,240,.35);
    }

    .toast {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 145px;
      transform: translate(-50%, 10px);
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 999px;
      color: #fffaf0;
      background: rgba(23,61,67,.9);
      box-shadow: 0 10px 30px rgba(23,61,67,.18);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .05em;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      white-space: nowrap;
    }

    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    body[data-theme="dusk"] { --ink: #fff1dc; --muted: #ead6cb; --paper: #fff1dc; --line: rgba(255,241,220,.18); }
    body[data-theme="night"] { --ink: #eaf7ef; --muted: #a9c7c8; --paper: #eaf7ef; --line: rgba(234,247,239,.16); }
    body[data-theme="dusk"] .brand-mark,
    body[data-theme="night"] .brand-mark { background: rgba(14,42,56,.25); border-color: rgba(255,255,255,.18); }
    body[data-theme="dusk"] .icon-button,
    body[data-theme="night"] .icon-button,
    body[data-theme="dusk"] .ride-status,
    body[data-theme="night"] .ride-status,
    body[data-theme="dusk"] .relationship-card,
    body[data-theme="night"] .relationship-card,
    body[data-theme="dusk"] .road-control,
    body[data-theme="night"] .road-control { background: rgba(14,42,56,.36); border-color: rgba(255,255,255,.14); }
    body[data-theme="dusk"] .control-deck,
    body[data-theme="night"] .control-deck { background: rgba(16,47,57,.86); border-color: rgba(255,255,255,.16); }
    body[data-theme="dusk"] .action-control,
    body[data-theme="night"] .action-control { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
    body[data-theme="dusk"] .action-control:hover,
    body[data-theme="night"] .action-control:hover { background: rgba(255,255,255,.12); }
    body[data-theme="dusk"] .stamina-track,
    body[data-theme="night"] .stamina-track,
    body[data-theme="dusk"] input[type="range"],
    body[data-theme="night"] input[type="range"] { background-color: rgba(255,255,255,.12); }

    @media (max-width: 1100px) {
      .relationship-card { display: none; }
      .keyboard-hint { display: none; }
      .control-deck { width: min(780px, calc(100% - 44px)); grid-template-columns: 132px minmax(160px, 1fr) 105px 125px; }
    }

    @media (max-width: 760px) {
      #app { min-height: 560px; }
      .topbar { top: max(16px, env(safe-area-inset-top)); left: 16px; right: 16px; gap: 10px; }
      .brand { gap: 9px; }
      .brand-mark { width: 40px; height: 40px; }
      .brand-mark svg { width: 25px; height: 25px; }
      .brand h1 { font-size: 14px; letter-spacing: .08em; }
      .brand h1 span { margin-top: 5px; font-size: 7px; letter-spacing: .16em; }
      .icon-button { height: 38px; min-width: 38px; padding: 0 11px; }
      .icon-button .button-text { display: none; }
      .top-actions { gap: 7px; }
      .ride-status { top: max(72px, calc(env(safe-area-inset-top) + 59px)); font-size: 9px; padding: 7px 11px; }
      .telemetry { left: 18px; top: 19%; width: 125px; }
      .eyebrow { margin-bottom: 7px; font-size: 7px; gap: 6px; }
      .eyebrow::before { width: 14px; }
      .route-name { margin-bottom: 10px; font-size: 17px; }
      .route-name small { font-size: 7px; margin-top: 4px; }
      .metric-row { margin-top: 8px; }
      .metric-value { font-size: 22px; }
      .metric-unit { font-size: 8px; }
      .metric-caption { font-size: 7px; }
      .stamina-head { margin-top: 12px; font-size: 7px; }
      .road-control { right: 16px; bottom: 201px; padding: 7px 10px 7px 7px; gap: 6px; }
      .road-control svg { width: 15px; height: 15px; }
      .road-control span { font-size: 8px; }
      .control-deck {
        bottom: max(12px, env(safe-area-inset-bottom));
        width: calc(100% - 24px);
        min-height: 166px;
        padding: 10px;
        grid-template-columns: 1.08fr 1fr 1fr;
        grid-template-rows: 70px 62px;
        gap: 8px;
        border-radius: 21px;
      }
      .bell-control { height: 70px; padding: 0 10px; gap: 7px; border-radius: 14px; }
      .bell-control svg { width: 23px; height: 23px; }
      .bell-control strong { font-size: 11px; }
      .bell-control small { font-size: 7px; }
      .speed-control { grid-column: 2 / 4; padding: 0 9px; }
      .speed-heading { margin-bottom: 8px; }
      .speed-heading label { font-size: 9px; }
      .range-labels { margin-top: 4px; font-size: 7px; }
      .action-control { height: 62px; gap: 6px; border-radius: 14px; }
      .action-control svg { width: 19px; height: 19px; }
      .action-control strong { font-size: 10px; }
      .action-control small { font-size: 7px; margin-top: 3px; }
      .toast { bottom: 190px; font-size: 10px; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
    }

    @media (max-height: 680px) and (min-width: 761px) {
      .telemetry { top: 28%; }
      .route-name { font-size: 19px; margin-bottom: 10px; }
      .metric-row { margin-top: 8px; }
      .stamina-head { margin-top: 11px; }
      .control-deck { min-height: 86px; bottom: 17px; }
      .bell-control, .action-control { height: 60px; }
      .road-control { bottom: 124px; }
      .toast { bottom: 118px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-theme="day">
  <main id="app">
    <canvas id="scene" role="img" aria-label="一辆红色自行车骑在白色鹈鹕背上，沿着海滨木栈道奔跑。"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="12" cy="27" r="7" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="30" cy="27" r="7" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 27l7-13 5 13H12l9-17m-2 4h8l3 13M16 10h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 6c3-3 7-3 10 0-3 3-7 3-10 0Z" fill="#ef754f"/>
          </svg>
        </div>
        <h1>鹈鹕快递<span>PELICAN EXPRESS</span></h1>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="themeButton" type="button" aria-label="切换昼夜，当前晴天">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <span class="button-text" id="themeLabel">晴天</span>
        </button>
        <button class="icon-button" id="soundButton" type="button" aria-label="关闭声音" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
            <path class="sound-wave" d="M15 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="ride-status" id="rideStatus"><span class="status-dot"></span><span id="statusText">海风正好 · 匀速巡航</span></div>

    <section class="telemetry" aria-label="骑行数据">
      <div class="eyebrow">COASTAL LOOP / 01</div>
      <h2 class="route-name">海滨栈道<small>一路向风，反向骑行</small></h2>
      <div class="metric-row"><span class="metric-value" id="distanceValue">0.00</span><span class="metric-unit">km</span></div>
      <div class="metric-caption">今日已走过的浪漫</div>
      <div class="stamina-head"><span>鹈鹕体力</span><span id="staminaValue">86%</span></div>
      <div class="stamina-track"><div class="stamina-fill" id="staminaFill"></div></div>
    </section>

    <aside class="relationship-card" aria-label="骑乘关系">
      <div class="card-kicker">RELATIONSHIP CHECK</div>
      <div class="rider-line"><span>自行车</span><span>RIDER</span></div>
      <div class="relation-arrow">
        <svg viewBox="0 0 16 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v20m-5-5 5 5 5-5"/></svg>
        <span>正在骑</span>
      </div>
      <div class="rider-line"><span>鹈鹕</span><span>STEED</span></div>
    </aside>

    <button class="road-control" id="roadButton" type="button" aria-label="切换为颠簸石子路">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M5 13l3-3 3 3 4-5 4 5"/><circle cx="6" cy="19" r="1"/><circle cx="13" cy="20" r="1"/></svg>
      <span id="roadLabel">平路模式</span>
    </button>

    <section class="control-deck" aria-label="互动控制台">
      <button class="bell-control" id="bellButton" type="button" aria-label="按车铃，空格键">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 22h18l-2.4-3.4V13a5.6 5.6 0 0 0-11.2 0v5.6L7 22Z"/>
          <path d="M13.5 25a2.7 2.7 0 0 0 5 0M16 5V3M5 9 3 7m24 2 2-2"/>
        </svg>
        <span><strong>按车铃</strong><small>DING DING</small></span>
      </button>

      <div class="speed-control">
        <div class="speed-heading"><label for="speedRange">前进速度</label><output id="speedReadout" for="speedRange">18.0 km/h</output></div>
        <div class="range-wrap"><input id="speedRange" type="range" min="0" max="100" value="38" aria-label="前进速度"></div>
        <div class="range-labels"><span>悠闲</span><span>追风</span></div>
      </div>

      <button class="action-control" id="sprintButton" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-8 12h6l-1 8 9-13h-6V2Z"/></svg>
        <span><strong>冲刺</strong><small>S · 加速</small></span>
      </button>

      <button class="action-control" id="feedButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c3-5 8-6 13-2l4-3-1 5 1 5-5-3c-5 3-9 2-12-2Z"/><circle cx="9" cy="11.5" r=".8" fill="currentColor" stroke="none"/><path d="M12 9c-1 2-1 4 1 6"/></svg>
        <span><strong>投喂小鱼</strong><small>F · 恢复体力</small></span>
      </button>
    </section>

    <div class="keyboard-hint"><kbd>SPACE</kbd> 车铃&nbsp;&nbsp; <kbd>F</kbd> 小鱼&nbsp;&nbsp; <kbd>S</kbd> 冲刺&nbsp;&nbsp; <kbd>D</kbd> 昼夜</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('scene');
      const ctx = canvas.getContext('2d');
      const app = document.getElementById('app');
      const speedRange = document.getElementById('speedRange');
      const speedReadout = document.getElementById('speedReadout');
      const bellButton = document.getElementById('bellButton');
      const sprintButton = document.getElementById('sprintButton');
      const feedButton = document.getElementById('feedButton');
      const roadButton = document.getElementById('roadButton');
      const roadLabel = document.getElementById('roadLabel');
      const themeButton = document.getElementById('themeButton');
      const themeLabel = document.getElementById('themeLabel');
      const soundButton = document.getElementById('soundButton');
      const statusText = document.getElementById('statusText');
      const rideStatus = document.getElementById('rideStatus');
      const distanceValue = document.getElementById('distanceValue');
      const staminaFill = document.getElementById('staminaFill');
      const staminaValue = document.getElementById('staminaValue');
      const toast = document.getElementById('toast');

      const TAU = Math.PI * 2;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const palettes = {
        day: {
          skyTop: '#a9dcd9', skyBottom: '#f9e8c5', oceanTop: '#4b98a0', oceanBottom: '#83b9b0',
          far: '#79a9a0', farLight: '#9dbfb0', sand: '#ead6aa', plank: '#cfa97d', plankDark: '#b58d66',
          cloud: '#fff9e9', sun: '#ffd27c', haze: 'rgba(255,246,217,.48)', star: '#fff8df'
        },
        dusk: {
          skyTop: '#686c9c', skyBottom: '#f3b38c', oceanTop: '#466d86', oceanBottom: '#8d8fa2',
          far: '#626d88', farLight: '#8b7f96', sand: '#c99e88', plank: '#a77b6b', plankDark: '#875f56',
          cloud: '#f8c7b0', sun: '#ff8b67', haze: 'rgba(255,183,145,.31)', star: '#ffe8cf'
        },
        night: {
          skyTop: '#112b43', skyBottom: '#426c79', oceanTop: '#1c4d60', oceanBottom: '#386c72',
          far: '#294c5a', farLight: '#42656b', sand: '#627b78', plank: '#526765', plankDark: '#3f5454',
          cloud: '#719096', sun: '#f7efd0', haze: 'rgba(137,190,190,.16)', star: '#fff8df'
        }
      };

      const state = {
        width: 0,
        height: 0,
        dpr: 1,
        time: 0,
        lastTime: 0,
        distance: 0,
        travel: 0,
        speedInput: 0.38,
        speed: 0.38,
        sprint: false,
        sprintEnergy: 0,
        stamina: 0.86,
        themeIndex: 0,
        themeMix: 1,
        previousTheme: 'day',
        rocky: false,
        scare: 0,
        bellPulse: 0,
        feedTime: -1,
        feedCooldown: 0,
        happy: 0,
        sound: true,
        wheelAngle: 0,
        stride: 0,
        toastTimer: 0,
        particles: [],
        clouds: [],
        stars: [],
        birds: []
      };

      const themeNames = ['day', 'dusk', 'night'];
      const themeLabels = ['晴天', '黄昏', '夜晚'];
      const roadLabels = ['平路模式', '石子路模式'];

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function smoothstep(t) { return t * t * (3 - 2 * t); }
      function hexToRgb(hex) {
        const value = parseInt(hex.slice(1), 16);
        return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
      }
      function mixColor(a, b, t) {
        const ca = hexToRgb(a);
        const cb = hexToRgb(b);
        return `rgb(${Math.round(lerp(ca[0], cb[0], t))},${Math.round(lerp(ca[1], cb[1], t))},${Math.round(lerp(ca[2], cb[2], t))})`;
      }
      function currentPalette() {
        const from = palettes[state.previousTheme];
        const to = palettes[themeNames[state.themeIndex]];
        const result = {};
        const t = smoothstep(state.themeMix);
        Object.keys(to).forEach(key => {
          result[key] = key.startsWith('haze') || key.startsWith('star') ? to[key] : mixColor(from[key], to[key], t);
        });
        return result;
      }

      function roundedRect(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function ellipse(x, y, rx, ry, rotation = 0) {
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, rotation, 0, TAU);
      }

      function line(points, color, width, close = false) {
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        if (close) ctx.closePath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        window.clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
      }

      function seedScenery() {
        state.stars = Array.from({ length: 62 }, (_, i) => ({
          x: ((i * 73.71) % 100) / 100,
          y: ((i * 37.19) % 39) / 100,
          r: 0.6 + ((i * 13) % 17) / 13,
          phase: i * 0.71
        }));
        state.clouds = Array.from({ length: 7 }, (_, i) => ({
          x: (i * 0.19 + 0.06) % 1.25,
          y: 0.11 + ((i * 17) % 15) / 100,
          scale: 0.65 + ((i * 11) % 12) / 17,
          speed: 0.006 + (i % 3) * 0.002,
          alpha: 0.48 + (i % 3) * 0.12
        }));
        state.birds = Array.from({ length: 5 }, (_, i) => ({
          x: 0.16 + i * 0.16,
          y: 0.22 + (i % 3) * 0.025,
          scale: 0.55 + (i % 2) * 0.3,
          phase: i * 1.8
        }));
      }

      function resize() {
        const rect = app.getBoundingClientRect();
        state.width = rect.width;
        state.height = rect.height;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * state.dpr);
        canvas.height = Math.round(rect.height * state.dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
      }

      function drawCloud(x, y, scale, color, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-72, 15);
        ctx.bezierCurveTo(-79, -2, -62, -14, -43, -10);
        ctx.bezierCurveTo(-41, -34, -8, -43, 8, -25);
        ctx.bezierCurveTo(24, -43, 53, -31, 51, -10);
        ctx.bezierCurveTo(72, -11, 82, 5, 70, 16);
        ctx.bezierCurveTo(30, 23, -34, 24, -72, 15);
        ctx.fill();
        ctx.restore();
      }

      function drawBackground(palette, groundY) {
        const w = state.width;
        const h = state.height;
        const horizon = h * (w < 760 ? 0.42 : 0.43);
        const sky = ctx.createLinearGradient(0, 0, 0, horizon + 40);
        sky.addColorStop(0, palette.skyTop);
        sky.addColorStop(1, palette.skyBottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        const nightAmount = state.themeIndex === 2 ? state.themeMix : 0;
        if (nightAmount > 0.01) {
          ctx.save();
          ctx.globalAlpha = nightAmount;
          state.stars.forEach(star => {
            const twinkle = 0.55 + Math.sin(state.time * 1.3 + star.phase) * 0.25;
            ctx.globalAlpha = nightAmount * twinkle;
            ctx.fillStyle = palette.star;
            ctx.beginPath();
            ctx.arc(star.x * w, star.y * h, star.r, 0, TAU);
            ctx.fill();
          });
          ctx.restore();
        }

        const sunX = w * 0.81;
        const sunY = h * (state.themeIndex === 1 ? 0.29 : 0.2);
        const sunRadius = clamp(w * 0.038, 27, 48);
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = palette.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * 1.8, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius * 1.36, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = palette.sun;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, TAU);
        ctx.fill();
        if (state.themeIndex === 2) {
          ctx.fillStyle = palette.skyTop;
          ctx.beginPath();
          ctx.arc(sunX + sunRadius * 0.38, sunY - sunRadius * 0.22, sunRadius * 0.91, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        state.clouds.forEach(cloud => {
          const travel = state.travel * (0.5 + cloud.speed * 20);
          const rawX = ((cloud.x - travel * cloud.speed * 0.01) % 1.35 + 1.35) % 1.35;
          drawCloud(rawX * w - 40, cloud.y * h, cloud.scale * clamp(w / 1100, 0.7, 1.2), palette.cloud, cloud.alpha);
        });

        state.birds.forEach(bird => {
          const bx = ((bird.x - state.travel * 0.0015) % 1.2 + 1.2) % 1.2 * w;
          const by = bird.y * h + Math.sin(state.time * 0.8 + bird.phase) * 3;
          const flap = Math.sin(state.time * 3.2 + bird.phase) * 3;
          ctx.save();
          ctx.translate(bx, by);
          ctx.scale(bird.scale, bird.scale);
          ctx.strokeStyle = palette.far;
          ctx.globalAlpha = 0.5;
          ctx.lineWidth = 1.4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-9, flap);
          ctx.quadraticCurveTo(-4, -3, 0, 0);
          ctx.quadraticCurveTo(4, -3, 9, flap);
          ctx.stroke();
          ctx.restore();
        });

        const ocean = ctx.createLinearGradient(0, horizon, 0, groundY);
        ocean.addColorStop(0, palette.oceanTop);
        ocean.addColorStop(1, palette.oceanBottom);
        ctx.fillStyle = ocean;
        ctx.fillRect(0, horizon, w, groundY - horizon);

        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.strokeStyle = '#fff7dd';
        ctx.lineWidth = 1;
        const waveOffset = (state.travel * 5) % 85;
        for (let row = 0; row < 5; row++) {
          const y = horizon + 15 + row * ((groundY - horizon - 22) / 5);
          for (let x = -100; x < w + 100; x += 85) {
            const xx = x + row * 34 - waveOffset;
            ctx.beginPath();
            ctx.moveTo(xx, y);
            ctx.quadraticCurveTo(xx + 12, y - 3, xx + 27, y);
            ctx.stroke();
          }
        }
        ctx.restore();

        ctx.fillStyle = palette.farLight;
        ctx.beginPath();
        ctx.moveTo(0, horizon + 7);
        ctx.bezierCurveTo(w * 0.06, horizon - 19, w * 0.12, horizon - 25, w * 0.2, horizon + 2);
        ctx.bezierCurveTo(w * 0.27, horizon - 15, w * 0.34, horizon - 17, w * 0.42, horizon + 6);
        ctx.lineTo(w * 0.56, horizon + 9);
        ctx.lineTo(w, horizon + 5);
        ctx.lineTo(w, horizon + 20);
        ctx.lineTo(0, horizon + 20);
        ctx.fill();

        ctx.fillStyle = palette.far;
        ctx.beginPath();
        ctx.moveTo(0, horizon + 11);
        ctx.bezierCurveTo(w * 0.08, horizon - 4, w * 0.16, horizon - 6, w * 0.26, horizon + 12);
        ctx.bezierCurveTo(w * 0.39, horizon - 1, w * 0.49, horizon + 2, w * 0.63, horizon + 14);
        ctx.lineTo(w, horizon + 12);
        ctx.lineTo(w, horizon + 24);
        ctx.lineTo(0, horizon + 24);
        ctx.fill();

        drawLighthouse(w * 0.16, horizon + 7, palette, nightAmount);
        drawSailboat(w * 0.69, horizon + 37, palette);

        const haze = ctx.createLinearGradient(0, horizon - 10, 0, groundY);
        haze.addColorStop(0, palette.haze);
        haze.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = haze;
        ctx.fillRect(0, horizon - 10, w, groundY - horizon + 10);

        ctx.fillStyle = palette.sand;
        ctx.fillRect(0, groundY - 8, w, h - groundY + 8);
        drawBoardwalk(palette, groundY);
        drawForeground(palette, groundY);

        if (state.sprint && state.speed > 0.8) drawSpeedLines(palette);
      }

      function drawLighthouse(x, y, palette, nightAmount) {
        ctx.save();
        ctx.translate(x, y);
        const scale = clamp(state.width / 1200, 0.7, 1);
        ctx.scale(scale, scale);
        ctx.fillStyle = palette.far;
        ctx.beginPath();
        ctx.moveTo(-17, 0);
        ctx.lineTo(-10, -63);
        ctx.lineTo(10, -63);
        ctx.lineTo(17, 0);
        ctx.fill();
        ctx.fillStyle = palette.cloud;
        ctx.fillRect(-12, -43, 24, 8);
        ctx.fillRect(-9, -22, 18, 7);
        ctx.fillStyle = palette.far;
        ctx.fillRect(-13, -72, 26, 10);
        ctx.beginPath();
        ctx.moveTo(-16, -72);
        ctx.lineTo(0, -84);
        ctx.lineTo(16, -72);
        ctx.fill();
        ctx.fillStyle = palette.sun;
        ctx.fillRect(-5, -68, 10, 6);
        if (nightAmount > 0.05) {
          ctx.save();
          ctx.globalAlpha = nightAmount * 0.11;
          ctx.fillStyle = palette.sun;
          ctx.beginPath();
          ctx.moveTo(0, -65);
          ctx.lineTo(220, -103);
          ctx.lineTo(220, -39);
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawSailboat(x, y, palette) {
        ctx.save();
        ctx.translate(x, y + Math.sin(state.time * 1.2) * 1.5);
        ctx.globalAlpha = 0.68;
        ctx.fillStyle = palette.cloud;
        ctx.beginPath();
        ctx.moveTo(0, -33);
        ctx.lineTo(0, -4);
        ctx.lineTo(-23, -4);
        ctx.fill();
        ctx.strokeStyle = palette.far;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(0, -35);
        ctx.lineTo(0, 1);
        ctx.stroke();
        ctx.fillStyle = palette.far;
        ctx.beginPath();
        ctx.moveTo(-26, 1);
        ctx.lineTo(21, 1);
        ctx.lineTo(13, 7);
        ctx.lineTo(-18, 7);
        ctx.fill();
        ctx.restore();
      }

      function drawBoardwalk(palette, groundY) {
        const w = state.width;
        const h = state.height;
        const plankHeight = clamp(h * 0.036, 24, 36);
        ctx.fillStyle = palette.plank;
        ctx.fillRect(0, groundY, w, h - groundY);
        ctx.strokeStyle = palette.plankDark;
        ctx.globalAlpha = 0.54;
        ctx.lineWidth = 1.2;
        const shift = (state.travel * 31) % 118;
        for (let y = groundY + plankHeight; y < h; y += plankHeight) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }
        for (let row = 0, y = groundY; y < h; y += plankHeight, row++) {
          const spacing = 118 + (row % 2) * 36;
          for (let x = -spacing - shift - (row % 2) * 53; x < w + spacing; x += spacing) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 9, y + plankHeight);
            ctx.stroke();
          }
        }
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#fff5dc';
        for (let i = 0; i < 22; i++) {
          const x = ((i * 149.7 - state.travel * 22) % (w + 200) + w + 200) % (w + 200) - 100;
          const y = groundY + 12 + ((i * 47) % Math.max(30, h - groundY - 20));
          ctx.beginPath();
          ctx.ellipse(x, y, 20 + i % 4 * 8, 1.2, 0, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        if (state.rocky) {
          const rockColor = state.themeIndex === 2 ? '#78918b' : '#a89980';
          for (let i = 0; i < 18; i++) {
            const x = ((i * 103.1 - state.travel * 43) % (w + 120) + w + 120) % (w + 120) - 60;
            const y = groundY + 5 + (i * 29) % Math.max(18, h - groundY - 18);
            const size = 3 + (i % 4) * 1.6;
            ctx.fillStyle = rockColor;
            ctx.beginPath();
            ctx.moveTo(x - size, y + size * 0.4);
            ctx.lineTo(x - size * 0.4, y - size);
            ctx.lineTo(x + size * 0.8, y - size * 0.5);
            ctx.lineTo(x + size, y + size * 0.5);
            ctx.closePath();
            ctx.fill();
          }
        }
      }

      function drawForeground(palette, groundY) {
        const w = state.width;
        const h = state.height;
        ctx.save();
        ctx.strokeStyle = state.themeIndex === 2 ? '#284d4e' : '#718f72';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const bases = [w * 0.025, w * 0.075, w * 0.91, w * 0.975];
        bases.forEach((x, index) => {
          const sway = Math.sin(state.time * 1.8 + index) * 3;
          ctx.beginPath();
          ctx.moveTo(x, h + 5);
          ctx.quadraticCurveTo(x - 8 + sway, groundY + 25, x + sway, groundY - 15 - index * 4);
          ctx.moveTo(x, groundY + 33);
          ctx.quadraticCurveTo(x + 15, groundY + 14, x + 20 + sway, groundY + 4);
          ctx.moveTo(x + 4, groundY + 42);
          ctx.quadraticCurveTo(x - 12, groundY + 24, x - 22 + sway, groundY + 22);
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawSpeedLines(palette) {
        const w = state.width;
        const h = state.height;
        ctx.save();
        ctx.strokeStyle = palette.cloud;
        ctx.globalAlpha = 0.28;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (let i = 0; i < 12; i++) {
          const y = h * 0.3 + ((i * 67) % Math.round(h * 0.35));
          const x = ((i * 137 - state.time * 530) % (w + 240) + w + 240) % (w + 240) - 120;
          const len = 24 + (i % 4) * 15;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + len, y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function sceneTransform() {
        const w = state.width;
        const h = state.height;
        const mobile = w < 760;
        const scale = clamp(Math.min(w / 1050, h / 820), mobile ? 0.52 : 0.62, 1.17);
        const x = w * (mobile ? 0.53 : 0.56);
        const y = h * (mobile ? 0.655 : 0.745);
        return { x, y, scale };
      }

      function getBump() {
        const road = state.rocky ? 1 : 0.25;
        const fast = Math.sin(state.stride * 2.13) * 1.6 * road + Math.sin(state.stride * 3.71) * 0.9 * road;
        return Math.sin(state.stride * 2) * 1.3 + fast;
      }

      function drawPelican(palette, bump) {
        const phase = state.stride;
        const tired = state.stamina < 0.3;
        const scared = state.scare;
        const happy = state.happy;
        const bodyBob = bump - Math.abs(Math.sin(phase)) * (state.speed > 0.15 ? 3 : 0);

        ctx.save();
        ctx.translate(0, bodyBob);
        ctx.rotate(bodyTilt);

        drawPelicanLegs(-54, -102, phase, false, tired);
        drawPelicanLegs(34, -103, phase + Math.PI, true, tired);
        drawPelicanTail(palette, phase);

        ctx.save();
        ctx.translate(-78, -178);
        ctx.rotate(-0.17 + Math.sin(phase * 0.72) * 0.07 - scared * 0.15);
        ctx.fillStyle = '#d8ddd1';
        ctx.beginPath();
        ctx.moveTo(22, 16);
        ctx.bezierCurveTo(-15, -8, -53, 7, -70, 43);
        ctx.bezierCurveTo(-35, 39, -8, 55, 27, 43);
        ctx.fill();
        ctx.restore();

        const bodyGradient = ctx.createLinearGradient(-130, -220, 100, -90);
        bodyGradient.addColorStop(0, '#fffdf2');
        bodyGradient.addColorStop(0.62, '#f7f3df');
        bodyGradient.addColorStop(1, '#dce3d4');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.moveTo(-143, -169);
        ctx.bezierCurveTo(-171, -129, -126, -90, -49, -89);
        ctx.bezierCurveTo(37, -86, 108, -116, 112, -165);
        ctx.bezierCurveTo(117, -208, 67, -232, -3, -231);
        ctx.bezierCurveTo(-70, -233, -124, -211, -143, -169);
        ctx.fill();

        ctx.save();
        ctx.translate(-4, -169);
        ctx.rotate(0.08 + Math.sin(phase * 0.72) * 0.12 + scared * 0.25);
        drawPelicanWing(palette, tired);
        ctx.restore();

        drawPelicanNeckAndHead(palette, phase, tired, scared, happy);

        if (tired && state.speed > 0.45) drawSweat();
        ctx.restore();

        if (happy > 0.05) drawHearts(happy);

      function drawPelicanLegs(x, y, phase, front, tired) {
        const swing = Math.sin(phase) * (state.speed > 0.1 ? 26 : 5);
        const lift = Math.max(0, Math.cos(phase)) * (state.rocky ? 18 : 12) * clamp(state.speed * 2, 0, 1);
        const kneeX = x + swing * 0.36;
        const kneeY = y + 37 - lift * 0.35;
        const footX = x + swing;
        const footY = -6 - lift;
        ctx.save();
        ctx.strokeStyle = front ? '#e9a04f' : '#cf8742';
        ctx.lineWidth = front ? 9 : 8;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(kneeX, kneeY);
        ctx.lineTo(footX, footY);
        ctx.stroke();
        ctx.fillStyle = front ? '#f1ad55' : '#dc9648';
        ctx.beginPath();
        ctx.moveTo(footX - 5, footY - 2);
        ctx.lineTo(footX + 26, footY + 3);
        ctx.lineTo(footX + 15, footY + 8);
        ctx.lineTo(footX + 25, footY + 11);
        ctx.lineTo(footX + 3, footY + 11);
        ctx.lineTo(footX - 12, footY + 7);
        ctx.closePath();
        ctx.fill();
        if (tired && lift < 2) {
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = '#8d765a';
          ellipse(footX + 7, 8, 21, 3, 0);
          ctx.fill();
        }
        ctx.restore();

          ctx.quadraticCurveTo(f[2] * 0.62, f[3] + 8, 4, i * 8 + 6);
          ctx.fill();

        ctx.restore();

        ctx.save();

          const x = 128 + i * 15 + Math.sin(progress * 5 + i) * 5;

          ctx.fillStyle = '#8fd5d8';

          ctx.moveTo(x, y - 5);
          ctx.quadraticCurveTo(x + 5, y + 1, x, y + 5);
          ctx.quadraticCurveTo(x - 5, y + 1, x, y - 5);

        ctx.save();

          const y = -334 - p * 58;
          ctx.globalAlpha = amount * (1 - p) * 0.8;

        ctx.fill();
        ctx.fillStyle = '#173d43';
        ctx.beginPath();
        ctx.arc(10, -2, 2, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(23,61,67,.3)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(1, 0, 7, -1.1, 1.1);
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        state.particles.forEach(particle => {
          ctx.save();
          ctx.globalAlpha = clamp(particle.life, 0, 1);
          ctx.fillStyle = particle.color;
          ctx.translate(particle.x, particle.y);
          ctx.rotate(particle.rotation);
          if (particle.type === 'feather') {
            ctx.beginPath();
            ctx.moveTo(-8, 0);
            ctx.quadraticCurveTo(0, -7, 11, 0);
            ctx.quadraticCurveTo(0, 7, -8, 0);
            ctx.fill();
            ctx.strokeStyle = 'rgba(23,61,67,.22)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-6, 0);
            ctx.lineTo(9, 0);
            ctx.stroke();
          } else {
            drawSpark(0, 0, particle.size, particle.color);
          }
          ctx.restore();
        });
      }

      function spawnParticle(type = 'feather') {
        const transform = sceneTransform();
        state.particles.push({
          x: transform.x - 118 * transform.scale,
          y: transform.y - 173 * transform.scale,
          vx: -30 - Math.random() * 45,
          vy: -24 - Math.random() * 35,
          gravity: type === 'feather' ? 12 : -8,
          life: 1,
          decay: 0.28 + Math.random() * 0.2,
          rotation: Math.random() * TAU,
          spin: (Math.random() - 0.5) * 2.2,
          size: 3 + Math.random() * 4,
          color: type === 'feather' ? '#fff9e8' : '#ffd27c',
          type
        });
      }

      function update(dt) {
        state.time += dt;
        state.sprintEnergy = Math.max(0, state.sprintEnergy - dt * 0.48);
        const sprintBoost = state.sprint && state.sprintEnergy > 0 ? 0.52 : 0;
        const scareBoost = state.scare * 0.62;
        const fatigueFactor = 0.62 + state.stamina * 0.48;
        const targetSpeed = clamp((state.speedInput * 1.25 + sprintBoost + scareBoost) * fatigueFactor, 0, 1.72);
        state.speed = lerp(state.speed, targetSpeed, 1 - Math.exp(-dt * 2.4));
        state.travel += state.speed * dt * 5.6;
        state.distance += state.speed * 24 * dt / 3600;
        state.stride += state.speed * dt * 6.4;
        state.wheelAngle += state.speed * dt * 4.7;
        state.scare = Math.max(0, state.scare - dt * 0.72);
        state.bellPulse = Math.max(0, state.bellPulse - dt * 1.45);
        state.happy = Math.max(0, state.happy - dt * 0.3);
        state.feedCooldown = Math.max(0, state.feedCooldown - dt);

        if (state.sprint && state.sprintEnergy > 0) {
          state.stamina = Math.max(0.08, state.stamina - dt * 0.027);
        } else {
          const drain = state.speed > 0.82 ? 0.008 : -0.006;
          state.stamina = clamp(state.stamina - dt * drain, 0.08, 1);
        }

        if (state.feedTime >= 0) {
          state.feedTime += dt;
          if (state.feedTime > 1.25) state.feedTime = -1;
        }

        if (state.themeMix < 1) state.themeMix = Math.min(1, state.themeMix + dt * 1.15);

        if (state.speed > 0.35 && Math.random() < dt * (state.sprint ? 5 : 0.8)) spawnParticle('feather');
        if (state.sprint && state.speed > 0.8 && Math.random() < dt * 3) spawnParticle('spark');

        state.particles.forEach(particle => {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += particle.gravity * dt;
          particle.vx += Math.sin(state.time * 2 + particle.rotation) * dt * 6;
          particle.rotation += particle.spin * dt;
          particle.life -= particle.decay * dt;
        });
        state.particles = state.particles.filter(particle => particle.life > 0);

        updateHud();
      }

      function updateHud() {
        const displaySpeed = state.speed * 24;
        speedReadout.textContent = `${displaySpeed.toFixed(1)} km/h`;
        distanceValue.textContent = state.distance.toFixed(2);
        const staminaPercent = Math.round(state.stamina * 100);
        staminaValue.textContent = `${staminaPercent}%`;
        staminaFill.style.width = `${staminaPercent}%`;
        staminaFill.style.background = staminaPercent < 30
          ? 'linear-gradient(90deg, #ef754f, #f3b15e)'
          : 'linear-gradient(90deg, #4e9a78, #9fc36f)';

        rideStatus.classList.toggle('is-sprinting', state.sprint && state.sprintEnergy > 0);
        if (state.feedTime >= 0) statusText.textContent = '小鱼到账 · 鹈鹕心花怒放';
        else if (state.scare > 0.2) statusText.textContent = '叮！鹈鹕受到惊吓';
        else if (state.stamina < 0.3) statusText.textContent = '体力告急 · 快来投喂';
        else if (state.sprint && state.sprintEnergy > 0) statusText.textContent = '全速前进 · 羽毛乱飞';
        else if (state.speed < 0.12) statusText.textContent = '原地歇脚 · 看看大海';
        else if (state.speed > 0.85) statusText.textContent = `追风模式 · ${['海风正好', '晚风温柔', '星光正好'][state.themeIndex]}`;
        else statusText.textContent = `${['海风正好', '晚风温柔', '星光正好'][state.themeIndex]} · 匀速巡航`;
      }

      function render() {
        const palette = currentPalette();
        const groundY = sceneTransform().y;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
        ctx.clearRect(0, 0, state.width, state.height);
        drawBackground(palette, groundY);

        const transform = sceneTransform();
        ctx.save();
        ctx.translate(transform.x, transform.y);
        ctx.scale(transform.scale, transform.scale);
        const bump = getBump();
        drawPelican(palette, bump);
        drawBicycle(bump);
        drawBellEffect();
        drawFeedingFish();
        ctx.restore();

        drawParticles();
      }

      function frame(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const dt = Math.min((timestamp - state.lastTime) / 1000, 0.04);
        state.lastTime = timestamp;
        update(dt);
        render();
        window.requestAnimationFrame(frame);
      }

      function playBell() {
        if (!state.sound) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const audio = playBell.context || (playBell.context = new AudioContextClass());
          if (audio.state === 'suspended') audio.resume();
          const now = audio.currentTime;
          [0, 0.105].forEach((delay, index) => {
            const oscillator = audio.createOscillator();
            const gain = audio.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(index ? 1480 : 1760, now + delay);
            oscillator.frequency.exponentialRampToValueAtTime(index ? 1120 : 1320, now + delay + 0.32);
            gain.gain.setValueAtTime(0.0001, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.16, now + delay + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.55);
            oscillator.connect(gain);
            gain.connect(audio.destination);
            oscillator.start(now + delay);
            oscillator.stop(now + delay + 0.58);
          });
        } catch (error) {
          state.sound = false;
          updateSoundButton();
        }
      }

      function ringBell() {
        playBell();
        state.scare = 1;
        state.bellPulse = 1;
        state.sprintEnergy = Math.max(state.sprintEnergy, 0.28);
        bellButton.classList.add('is-ringing');
        window.setTimeout(() => bellButton.classList.remove('is-ringing'), 220);
        for (let i = 0; i < 5; i++) spawnParticle('spark');
        showToast('叮叮！自行车表示：它还能再快一点');
      }

      function toggleSprint() {
        if (state.sprint) {
          state.sprint = false;
          state.sprintEnergy = 0;
          sprintButton.classList.remove('is-active');
          sprintButton.setAttribute('aria-pressed', 'false');
          showToast('收油，让海风慢慢吹');
          return;
        }
        if (state.stamina < 0.18) {
          showToast('鹈鹕太累了，先喂一条小鱼吧');
          return;
        }
        state.sprint = true;
        state.sprintEnergy = 1;
        sprintButton.classList.add('is-active');
        sprintButton.setAttribute('aria-pressed', 'true');
        showToast('冲刺！抱紧你的车把');
        window.setTimeout(() => {
          if (state.sprint) {
            state.sprint = false;
            sprintButton.classList.remove('is-active');
            sprintButton.setAttribute('aria-pressed', 'false');
          }
        }, 4200);
      }

      function feedPelican() {
        if (state.feedCooldown > 0 || state.feedTime >= 0) return;
        state.feedTime = 0;
        state.feedCooldown = 2.2;
        state.happy = 1;
        state.stamina = clamp(state.stamina + 0.25, 0, 1);
        feedButton.disabled = true;
        window.setTimeout(() => { feedButton.disabled = false; }, 1400);
        for (let i = 0; i < 6; i++) spawnParticle('spark');
        showToast('小鱼 × 1 · 体力恢复，快乐加倍');
      }

      function toggleRoad() {
        state.rocky = !state.rocky;
        roadLabel.textContent = roadLabels[state.rocky ? 1 : 0];
        roadButton.setAttribute('aria-label', state.rocky ? '切换为平路' : '切换为颠簸石子路');
        showToast(state.rocky ? '石子路！请系好你的车铃' : '回到平路，继续优雅前行');
      }

      function toggleTheme() {
        state.previousTheme = themeNames[state.themeIndex];
        state.themeIndex = (state.themeIndex + 1) % themeNames.length;
        state.themeMix = 0;
        const theme = themeNames[state.themeIndex];
        document.body.dataset.theme = theme;
        themeLabel.textContent = themeLabels[state.themeIndex];
        themeButton.setAttribute('aria-label', `切换昼夜，当前${themeLabels[state.themeIndex]}`);
        document.querySelector('meta[name="theme-color"]').content = theme === 'night' ? '#112b43' : theme === 'dusk' ? '#686c9c' : '#d8eee7';
        showToast(['晴天上线，适合反向骑行', '黄昏正好，把影子拉长一点', '夜幕降临，车灯为你开路'][state.themeIndex]);
      }

      function updateSoundButton() {
        soundButton.setAttribute('aria-pressed', String(state.sound));
        soundButton.setAttribute('aria-label', state.sound ? '关闭声音' : '开启声音');
        const waves = soundButton.querySelectorAll('.sound-wave');
        waves.forEach(wave => { wave.style.display = state.sound ? '' : 'none'; });
      }

      function updateRange() {
        state.speedInput = Number(speedRange.value) / 100;
        speedRange.style.setProperty('--range-fill', `${speedRange.value}%`);
      }

      speedRange.addEventListener('input', updateRange);
      bellButton.addEventListener('click', ringBell);
      sprintButton.addEventListener('click', toggleSprint);
      feedButton.addEventListener('click', feedPelican);
      roadButton.addEventListener('click', toggleRoad);
      themeButton.addEventListener('click', toggleTheme);
      soundButton.addEventListener('click', () => {
        state.sound = !state.sound;
        updateSoundButton();
        showToast(state.sound ? '声音已开启' : '声音已关闭，安静追风');
      });

      window.addEventListener('keydown', event => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement) return;
        if (event.code === 'Space') {
          event.preventDefault();
          ringBell();
        } else if (event.key.toLowerCase() === 'f') {
          feedPelican();
        } else if (event.key.toLowerCase() === 's') {
          toggleSprint();
        } else if (event.key.toLowerCase() === 'd') {
          toggleTheme();
        } else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          speedRange.value = String(Math.min(100, Number(speedRange.value) + 5));
          updateRange();
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          speedRange.value = String(Math.max(0, Number(speedRange.value) - 5));
          updateRange();
        }
      });

      document.addEventListener('visibilitychange', () => { state.lastTime = 0; });
      window.addEventListener('resize', resize);
      if ('ResizeObserver' in window) new ResizeObserver(resize).observe(app);

      seedScenery();
      resize();
      updateRange();
      updateSoundButton();
      updateHud();
      window.requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
