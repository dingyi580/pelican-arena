<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const nodes = Object.fromEntries(('scene clouds gulls islands waves water railPosts treads shadow trail dust farLegOutline farLegLine farFoot nearLegOutline nearLegLine nearFoot mount tail wing pouch pouchCrease beakTop eye blink brow reinBack rein bike rearWheel frontWheel chain crank pedalBack pedalFront bell ring sweat breath food aside asideText live liveText pace speed energyNumber gauge energyFill energyHint bellButton dashButton fishButton pause pauseLabel announcement').split(' ').map(id => [id, byId(id)]));
  const set = (node, name, value) => node.setAttribute(name, value);
  const tr = (id, value) => set(nodes[id], 'transform', value);
  const path = (id, value) => set(nodes[id], 'd', value);
  const alpha = (id, value) => set(nodes[id], 'opacity', value);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const mix = (a,b,t) => a + (b-a)*t;
  const tau = 2*Math.PI;
  const degree = 180/Math.PI;
  const mobile = matchMedia('(max-width:700px)');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const speedDigits = nodes.speed.firstChild;
  let time = 0, distance = 0, cycle = .23, speed = 14, pace = 14, energy = 86, wheel = 0, pedal = 0;
  let paused = motion.matches, sprint = 0, shock = 0, chime = 0, feeding = -1, reply = '', replyEnd = 0, audio;
  let last = null, frame = 0, lastHud = -1;

  function fit() {
    set(nodes.scene, 'viewBox', mobile.matches ? '385 -112 804 674' : '0 0 1280 550');
    tr('aside', mobile.matches ? 'translate(1034 108)' : 'translate(1064 98)');
  }
  function speak(line, seconds) {
    reply = line;
    replyEnd = time + seconds;
    nodes.asideText.textContent = line;
    nodes.announcement.textContent = line;
  }
  function tone() {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      audio ||= new Audio();
      if (audio.state === 'suspended') audio.resume().catch(() => {});
      const now = audio.currentTime;
      for (const [offset, frequency, peak, decay] of [[0,1480,.15,.45],[0,2317,.065,.28],[0,3350,.036,.13],[.115,1480,.1,.37],[.115,2317,.039,.22]]) {
        const start = now + offset;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001,start);
        gain.gain.exponentialRampToValueAtTime(peak,start+.006);
        gain.gain.exponentialRampToValueAtTime(.0001,start+decay);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(start);
        oscillator.stop(start+decay+.02);
        oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
      }
    } catch (_) { /* 设备没有音频输出时，仍保留可见反馈。 */ }
  }
  function ring() {
    chime = .78;
    shock = 1.32;
    tone();
    speak('哎！别催别催！', 1.8);
    if (paused) paint();
  }
  function dash() {
    if (sprint > 0) {
      sprint = 0;
      speak('好，改用散步挡。', 2.1);
    } else if (energy < 15) {
      speak('先来条小鱼吧。', 2.3);
    } else {
      sprint = 4;
      shock = Math.max(shock, .32);
      speak('蹼力，全开！', 2.4);
    }
    hud();
  }
  function feed() {
    if (feeding >= 0) return;
    feeding = 0;
    speak('小鱼？我接住！', 1.3);
    hud();
    if (paused) paint();
  }
  function togglePause() {
    paused = !paused;
    last = null;
    if (paused) {
      cancelAnimationFrame(frame);
      frame = 0;
    } else if (!frame) {
      frame = requestAnimationFrame(tick);
    }
    hud();
  }
  function hud() {
    const tired = energy < 23;
    const fast = sprint > 0 || shock > .36 || speed > 28;
    const percent = Math.round(energy);
    speedDigits.nodeValue = paused ? '0' : String(Math.round(speed));
    nodes.energyNumber.textContent = percent + '%';
    nodes.energyFill.style.transform = 'scaleX(' + energy / 100 + ')';
    set(nodes.gauge, 'aria-valuenow', percent);
    nodes.gauge.toggleAttribute('data-low', tired);
    nodes.energyHint.textContent = tired ? '喘口气吧' : energy < 58 ? '有点喘了' : '蹼力充沛';
    nodes.live.dataset.state = paused ? 'stop' : fast ? 'fast' : 'cruise';
    nodes.liveText.textContent = paused ? '停靠中' : sprint > 0 ? '全蹼冲刺' : shock > .36 ? '受惊提速' : tired ? '喘气慢跑' : speed>28 ? '高速巡游' : '沿岸巡游';
    set(nodes.dashButton, 'aria-pressed', sprint > 0);
    nodes.fishButton.disabled = feeding >= 0;
    set(nodes.pause, 'aria-pressed', paused);
    nodes.pauseLabel.textContent = paused ? '继续' : '暂停';
    lastHud = time;
  }
  function leg(back, phase, bob, lean) {
    const rootX = back ? 431 : 329;
    const rootY = (back ? 369 : 381) + bob;
    const span = 40 + speed * 1.08;
    const stance = .59;
    const plant = phase < stance;
    const ratio = plant ? phase / stance : (phase-stance)/(1-stance);
    const smooth = ratio*ratio*(3-2*ratio);
    const fx = rootX + (back ? -6 : 2) + (plant ? .5-ratio : smooth-.5)*span;
    const fy = (back ? 440 : 446) - (plant ? 0 : Math.sin(Math.PI*ratio)*(21+speed*.66));
    const kx = mix(rootX,fx,.48) - 18 + lean;
    const ky = mix(rootY,fy,.52) - (plant ? 0 : 9);
    const line = 'M'+rootX+' '+rootY+'Q'+(rootX+9)+' '+(ky-11)+' '+kx+' '+ky+'T'+fx+' '+fy;
    const name = back ? 'far' : 'near';
    path(name+'LegOutline',line);
    path(name+'LegLine',line);
    tr(name+'Foot','translate('+fx+' '+fy+') rotate('+(plant ? mix(-7,11,ratio) : -25*Math.sin(tau*ratio))+')');
  }
  function paint() {
    const step = cycle*tau;
    const lift = Math.sin(step*2);
    const sway = Math.cos(step);
    const exertion = clamp(speed/35,0,1);
    const bob = lift*(3+3.2*exertion) - shock*2.2;
    const lean = Math.sin(step*2-.75)*1.1 + (sprint > 0 ? 2 : 0);
    const riderBob = bob + Math.sin(step*2-.6)*2.4 - (shock>1.02 ? (shock-1.02)*20 : 0);
    const tilt = lean + sway*1.85;
    const wingBeat = Math.sin(step-.8)*(8+exertion*13)-exertion*4;
    const swayPouch = Math.sin(step*2-1.1)*7 + exertion*8;
    const mouthOpen = feeding < 0 ? 0 : clamp(1-Math.abs(feeding-.87)*3,0,1);

    tr('clouds','translate('+(-distance*.013%1260)+' 0)');
    tr('gulls','translate('+(-distance*.034%680)+' '+Math.sin(time*1.3)*4+')');
    tr('islands','translate('+(-distance*.029%70)+' 0)');
    set(nodes.waves,'x',-distance*.17%320);
    set(nodes.railPosts,'x',-distance*.52%185);
    set(nodes.treads,'x',-distance%102);
    set(nodes.shadow,'rx',258+bob*1.8);
    tr('trail','translate('+(-13-(distance*.18%34))+' '+sway*3+')');
    alpha('trail',.21+exertion*.57);
    tr('dust','translate('+(-distance*.35%54)+' '+Math.sin(step)*4+')');
    alpha('dust',.34+exertion*.53);
    leg(true,(cycle+.5)%1,bob,lean);
    leg(false,cycle,bob,lean);
    tr('mount','translate(0 '+bob+') rotate('+lean+' 355 338)');
    tr('tail','rotate('+(Math.sin(step-.9)*5)+' 212 351)');
    tr('wing','rotate('+wingBeat+' 385 324)');
    path('pouch','M554 205Q572 200 585 209T624 224Q667 229 707 250L724 256Q731 260 719 267Q692 '+(292+swayPouch*.5)+' 644 '+(291+swayPouch)+'Q578 '+(286+swayPouch+mouthOpen*12)+' 549 235Z');
    path('pouchCrease','M570 241Q608 '+(293+swayPouch)+' 695 265M584 254Q612 '+(285+swayPouch)+' 652 '+(282+swayPouch*.8));
    tr('beakTop','rotate('+(-mouthOpen*4)+' 553 210)');
    const blinking = (time+.48)%4.7 > 4.58;
    const squint = !blinking && speed>25 && shock<.82;
    alpha('eye',blinking ? 0 : 1);
    tr('eye','translate(534 199) scale(1 '+(squint ? .57 : shock>.83 ? 1.08 : 1)+')');
    alpha('blink',blinking ? 1 : 0);
    path('brow',shock>.73 ? 'M515 180q10-9 21-4' : squint ? 'M516 185q11-1 20 2' : 'M516 185q9-6 19-3');
    const angle = (tilt-lean)/degree;
    const bx = 334+111*Math.cos(angle)+134*Math.sin(angle);
    const by = 224+111*Math.sin(angle)-134*Math.cos(angle)+riderBob-bob;
    const reins = 'M'+bx+' '+by+'Q'+(491+shock*8)+' '+(108+sway*7)+' 506 156Q510 '+(224-exertion*10)+' 576 234';
    path('reinBack',reins);
    path('rein',reins);
    tr('bike','translate(0 '+riderBob+') rotate('+tilt+' 334 224)');
    tr('rearWheel','rotate('+wheel+')');
    tr('frontWheel','rotate('+wheel+')');
    tr('crank','rotate('+pedal+')');
    tr('pedalBack','rotate('+(-pedal)+')');
    tr('pedalFront','rotate('+(-pedal)+')');
    set(nodes.chain,'stroke-dashoffset',-pedal/10);
    tr('bell','translate(445 90) rotate('+(chime*Math.cos(chime*99)*25)+')');
    tr('ring','translate(445 84) scale('+(1+(chime>0 ? .78-chime : 0))+')');
    alpha('ring',clamp(chime*2.1,0,1));
    const sweats = clamp((100-energy)/120+(exertion-.37)*1.6+shock*.51-.47,0,.96);
    alpha('sweat',sweats*(.62+.38*sway));
    tr('sweat','translate('+(-10*exertion+sway*4)+' '+(bob-sweats*8)+')');
    alpha('breath',energy<38 ? (1-energy/43)*(.5+.5*Math.sin(step)) : 0);
    tr('breath','translate('+(8-8*sway)+' '+bob+')');
    if (feeding >= 0) {
      const t = clamp(feeding/1.05,0,1);
      tr('food','translate('+mix(746,714,t)+' '+(mix(72,252+bob,t)-110*Math.sin(Math.PI*t))+') rotate('+mix(-32,188,t)+')');
      alpha('food',t>.92 ? (1-t)/.08 : 1);
    } else {
      alpha('food',0);
    }
  }
  function tick(now) {
    if (paused) return;
    const dt = last === null ? 0 : Math.min((now-last)/1000,.048);
    last = now;
    time += dt;
    chime = Math.max(0,chime-dt);
    shock = Math.max(0,shock-dt);
    sprint = Math.max(0,sprint-dt);
    let target = pace+shock*13+(sprint>0 ? 16 : 0);
    if (energy < 23) target = Math.min(target,10+energy*.74);
    speed = mix(speed,clamp(target,4,46),1-Math.exp(-dt*(shock>0 ? 8 : 3.6)));
    if (energy <= 3 && sprint > 0) {
      sprint = 0;
      speak('呼……今天的油是鱼。',2.4);
    }
    const drain = sprint>0 ? -12 : speed>20 ? -(speed-20)*.54 : (20-speed)*.61;
    energy = clamp(energy+drain*dt,0,100);
    if (feeding >= 0) {
      feeding += dt;
      if (feeding >= 1.05) {
        feeding = -1;
        energy = Math.min(100,energy+31);
        speak('一口回满好心情！',2.3);
        hud();
      }
    }
    if (time >= replyEnd) {
      const fallback = energy < 23 ? '呼……鱼在哪儿？' : '我才是发动机。';
      if (reply !== fallback) nodes.asideText.textContent = reply = fallback;
    }
    distance += dt*speed*7.8;
    wheel = (wheel+dt*speed*7.8*degree/80)%360;
    pedal = (pedal+dt*speed*7.8*degree/202)%360;
    cycle = (cycle+dt*(.75+speed*.063))%1;
    paint();
    if (time-lastHud>=.085) hud();
    frame = requestAnimationFrame(tick);
  }
  nodes.pace.addEventListener('input', () => {
    pace = Number(nodes.pace.value);
    nodes.pace.style.setProperty('--fill',((pace-4)/26*100)+'%');
  });
  nodes.bellButton.addEventListener('click',ring);
  nodes.dashButton.addEventListener('click',dash);
  nodes.fishButton.addEventListener('click',feed);
  nodes.pause.addEventListener('click',togglePause);
  document.addEventListener('keydown', e => {
    if (e.repeat || e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.code === 'KeyB') ring();
    else if (e.code === 'KeyS') dash();
    else if (e.code === 'KeyF') feed();
  });
  mobile.addEventListener('change',fit);
  fit();
  hud();
  paint();
  if (!paused) frame = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
