<!DOCTYPE html>
<html lang="en">

  <title>自行车骑鹈鹕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(to top, #001f3f, #39CCCC);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 auto 0 auto;
      background: #7FDBFF;
    }
    .controls {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      z-index: 10;
    }
    .control-group {
      margin-top: 15px;
    }
    .control-group button {
      background-color: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid white;
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 16px;
      margin: 5px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .control-group button:hover {
      background-color: rgba(255,255,255,0.2);
    }
    .control-group input[type="range"] {
      width: 200px;
    }
  </style>
</head>
