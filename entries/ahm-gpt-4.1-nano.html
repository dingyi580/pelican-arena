<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自行车骑鹈鹕</title>
<style>
  /* 全局样式 */
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #87cefa 0%, #ffffff 100%);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
    user-select: none;
  }

  /* 主要绘图区 */
  #stage {
    flex: 1;
    position: relative;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, #d0f0ff 0%, #e0f7fa 100%);
    overflow: hidden;
  }

  /* 控件容器 */
  #controls {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
    background: rgba(255,255,255,0.8);
    font-family: sans-serif;
  }

  /* 按钮样式 */
  .btn {
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    margin: 0 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s;
  }

  .btn:hover {
    background: #45a049;
  }

  /* 控件标签 */
  .label {
    margin-right: 4px;
    font-weight: bold;
  }

  /* 速度滑块 */
  #speedSlider {
    width: 200px;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="controls">
  <button id="ringBtn" class="btn">按车铃</button>
  <div style="margin-left:20px;">
    <span class="label">速度：</span>
    <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1" />
  </div>
  <button id="toggleEnv" class="btn">切换天气</button>
</div>

<script>
  const stage = document.getElementById('stage');

  // 画布尺寸
  const width = stage.clientWidth;
  const height = stage.clientHeight;

  // 画布初始化
  const ctx = document.createElement('canvas');
  ctx.width = width;
  ctx.height = height;
  ctx.style.width = width + 'px';
  ctx.style.height = height + 'px';
  stage.appendChild(ctx);
  const c = ctx.getContext('2d');

  // 设计参数
  let speedFactor = parseFloat(document.getElementById('speedSlider').value);
  document.getElementById('speedSlider').addEventListener('input', () => {
    speedFactor = parseFloat(document.getElementById('speedSlider').value);
  });

  // 天气状态
  let weatherState = 0; // 0：晴天，1：黄昏，2：夜晚
  const weatherNames = ['晴天', '黄昏', '夜晚'];
  document.getElementById('toggleEnv').addEventListener('click', () => {
    weatherState = (weatherState + 1) % 3;
  });

  // 音频上下文
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function playChime() {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.2);
  }

  // 反应鹈鹕动作
  let alarmTimeout = null;
  function alertPelican() {
    // 鹈鹕跳跃或出惊愕动画
    pelican.state = 'surprised';
    setTimeout(() => {
      pelican.state = 'default';
    }, 300);
  }

  // 按车铃按钮
  document.getElementById('ringBtn').addEventListener('click', () => {
    // 先播放铃声
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    playChime();
    // 鹈鹕受惊
    alertPelican();
    // 让鹈鹕的速度增加
    pelican.speed += 0.2;
    // 设定临时加速恢复
    setTimeout(() => {
      pelican.speed -= 0.2;
      if (pelican.speed < 0.4) pelican.speed = 0.4;
    }, 1000);
  });

  // 兔子速度参数
  let currentSpeed = 1;

  // 拖拽可调速
  document.getElementById('speedSlider').addEventListener('input', (e) => {
    currentSpeed = parseFloat(e.target.value);
  });

  // 小的辅助函数
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  // 主要元素与状态
  const pelican = {
    x: 0,
    y: 0,
    baseY: height * 0.8,
    wingFlapProgress: 0,
    wingFlapDirection: 1,
    wingFlapSpeed: 0.02,
    throatSize: 0,
    throatVib: 0,
    throatVibDirection: 1,
    throatVibSpeed: 0.4,
    wingWaves: 0,
    wingWaveSpeed: 0.04,
    faceExpr: 'default', // 'default', 'surprised'
    wingOffset: 0,
    speed: 1,
    state: 'default', // 'default', 'surprised'
  };

  const bike = {
    offsetX: 0,
    tilt: 0,
    vibrateOffset: 0,
  };

  // 生成背景细节颗粒（羽毛、小鱼、汗珠等）
  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 3 + 1,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      type: Math.random() < 0.3 ? 'feather' : (Math.random() < 0.5 ? 'fish' : 'droplet'),
    });
  }

  // 动画循环
  let lastTime = performance.now();

  function drawBackground() {
    // 根据天气调整背景色
    let bgColor;
    switch (weatherState) {
      case 0: // 晴天
        bgColor = 'linear-gradient(to bottom, #87CEFA 0%, #ffffff 100%)';
        break;
      case 1: // 黄昏
        bgColor = 'linear-gradient(to bottom, #FFCC66 0%, #FF9966 100%)';
        break;
      case 2: // 夜晚
        bgColor = 'linear-gradient(to bottom, #0D1B2A 0%, #050505 100%)';
        break;
    }
    ctx.clearRect(0, 0, width, height);
    // 使用渐变背景
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    if (weatherState === 0) {
      grad.addColorStop(0, '#87CEFA');
      grad.addColorStop(1, '#ffffff');
    } else if (weatherState === 1) {
      grad.addColorStop(0, '#FFCC66');
      grad.addColorStop(1, '#FF9966');
    } else {
      grad.addColorStop(0, '#0D1B2A');
      grad.addColorStop(1, '#050505');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }

  function updateParticles() {
    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > width) {
        p.vx *= -1;
        p.x = Math.max(0, Math.min(width, p.x));
      }
      if (p.y < 0 || p.y > height) {
        p.vy *= -1;
        p.y = Math.max(0, Math.min(height, p.y));
      }
    }
  }

  function drawParticles() {
    for (let p of particles) {
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = p.type === 'feather' ? 'rgba(255,255,255,0.8)' :
                       p.type === 'fish' ? 'rgba(0,191,255,0.8)' :
                       'rgba(255,215,0,0.8)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // 画鹈鹕
  const pelicanRender = {
    wingOscillation: 0,
  };

  function drawPelican() {
    const p = pelican;
    // 位置
    const px = width * 0.3 + p.x;
    const py = p.y;

    // 头部特征
    ctx.save();
    ctx.translate(px, py);

    // 根据状态调整表情
    const faceExpr = p.state === 'surprised' ? 'surprised' : 'default';

    // 鸦雀的翅膀动画
    p.wingFlapProgress += p.wingFlapSpeed * p.wingFlapDirection;
    if (p.wingFlapProgress > 1 || p.wingFlapProgress < 0) {
      p.wingFlapDirection *= -1;
      p.wingFlapProgress = Math.max(0, Math.min(1, p.wingFlapProgress));
    }
    // 翅膀摆动角度
    const wingAngle = Math.sin(p.wingFlapProgress * Math.PI) * 30; // -30 ~ 30度

    // 头部
    ctx.save();
    ctx.scale(1, 1);
    // 大喉囊晃动
    if (faceExpr === 'surprised') {
      p.throatSize = lerp(p.throatSize, 1.2, 0.2);
    } else {
      p.throatSize = lerp(p.throatSize, 1.0, 0.2);
    }
    // 喉囊
    ctx.fillStyle = '#FFB347'; // 橘色
    ctx.beginPath();
    ctx.arc(0, 15 * p.throatSize, 10, 0, Math.PI * 2);
    ctx.fill();

    // 头顶
    ctx.fillStyle = '#EEE';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();

    // 长喙
    ctx.fillStyle = '#FFA500';
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(20, -2);
    ctx.lineTo(20, 2);
    ctx.closePath();
    ctx.fill();

    // 眼睛
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-4, -2, 2, 0, Math.PI * 2);
    ctx.arc(4, -2, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // 身体（大鸟身架）
    ctx.save();
    ctx.translate(0, 20);

    // 翅膀
    ctx.save();
    ctx.translate(0, -10);
    ctx.rotate(wingAngle * Math.PI / 180);
    ctx.fillStyle = '#CC9966'; // 棕色
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 尾羽
    ctx.fillStyle = '#555';
    ctx.beginPath();
    ctx.moveTo(0, 30);
    ctx.lineTo(-10, 40);
    ctx.lineTo(10, 40);
    ctx.closePath();
    ctx.fill();

    // 蹄蹼
    ctx.fillStyle = '#777';
    ctx.beginPath();
    ctx.moveTo(-5, 50);
    ctx.lineTo(-5, 55);
    ctx.lineTo(5, 55);
    ctx.lineTo(5, 50);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // 腰部摇晃（模拟奔跑）
    ctx.save();
    ctx.translate(0, 20);
    const lean = Math.sin(Date.now() * 0.002 * p.speed) * 2;
    ctx.rotate(lean * Math.PI / 180);
    ctx.restore();
  }

  // 画自行车
  const bike = {
    wheelRadius: 30,
    xOffset: 0,
    tilt: 0,
    sway: 0,
    swayDir: 1,
    swaySpeed: 0.002,
    swayRange: 1.5,
    chainRotation: 0,
    pedalAngle: 0,
    seatOffsetY: 0,
  };

  let bikeCycle = 0;

  function drawBike() {
    ctx.save();

    // 位置
    const baseX = width * 0.3 + pelican.x;
    const baseY = pelican.y - 40 + pelican.throatSize * 2 + Math.sin(pelican.wingFlapProgress * Math.PI) * 2;

    // 随意微倾以增加动态
    const tiltAng = Math.sin(performance.now() * 0.003) * 0.02;
    ctx.translate(baseX, baseY);
    ctx.rotate(tiltAng);
    ctx.scale(1, 1);

    // 车轮
    ctx.save();
    ctx.translate(0, 0);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 4;
    // 前轮
    ctx.beginPath();
    ctx.arc(0, 0, bike.wheelRadius, 0, Math.PI * 2);
    ctx.stroke();
    // 后轮
    ctx.beginPath();
    ctx.arc(60, 0, bike.wheelRadius, 0, Math.PI * 2);
    ctx.stroke();

    // 车轴
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(60, 0);
    ctx.stroke();

    ctx.restore();

    // 车架
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(30, -20);
    ctx.lineTo(60, 0);
    ctx.stroke();

    // 车把（用车把和车座连接）
    ctx.beginPath();
    ctx.moveTo(30, -20);
    ctx.lineTo(30, -35);
    ctx.stroke();

    // 车座
    ctx.fillStyle = '#222';
    ctx.fillRect(28, -40, 4, 4);

    // 脚踏
    ctx.save();
    ctx.translate(0, 0);
    ctx.rotate(bike.pedalAngle);
    ctx.fillStyle = '#555';

    ctx.fillRect(-3, -3, 6, 6);
    ctx.restore();

    // 脚踏链条
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, -20);
    ctx.lineTo(30, -35);
    ctx.stroke();
  }

  // 更新动画
  function animate() {
    const now = performance.now();
    const delta = now - lastTime;
    lastTime = now;

    // 更新背景
    drawBackground();

    // 更新粒子
    updateParticles();
    drawParticles();

    // 更新鹈鹕
    // 小幅度摆动模拟奔跑
    pelican.x += pelican.speed * 2 * speedFactor;
    if (pelican.x > width * 0.8) {
      pelican.x = width * 0.8;
    }
    pelican.y = pelican.baseY + Math.sin(now * 0.005 * pelican.speed) * 2;
    // 翅膀振动
    pelican.wingFlapProgress += pelican.wingFlapSpeed * pelican.wingFlapDirection;
    if (pelican.wingFlapProgress > 1 || pelican.wingFlapProgress < 0) {
      pelican.wingFlapDirection *= -1;
    }

    // 喉囊晃动
    pelican.throatVib += pelican.throatVibSpeed * pelican.throatVibDirection;
    if (pelican.throatVib > 1 || pelican.throatVib < -1) {
      pelican.throatVibDirection *= -1;
    }

    // 鼻翼（羽毛）随声音晃动（简单模拟）
    pelican.wingOffset = Math.sin(now * 0.01 * pelican.speed) * 2;

    // 绘制
    drawPelican();
    drawBike();

    // 鹈鹕表情变化
    if (pelican.state === 'surprised') {
      pelican.faceExpr = 'surprised';
    } else {
      pelican.faceExpr = 'default';
    }

    // 路面震动或波动（模拟颠簸）
    stage.style.transform = `translateY(${Math.sin(now * 0.002) * 2}px)`;

    // 自行车微旋转模拟撞击
    bike.sway += bike.swayDir * bike.swaySpeed;
    if (Math.abs(bike.sway) > bike.swayRange) {
      bike.swayDir *= -1;
    }
    // 赋值
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(width/2, height/2);
    ctx.rotate(bike.sway * Math.PI / 180);
    ctx.translate(-width/2, -height/2);

    // 动画循环
    requestAnimationFrame(animate);
  }

  // 初始化
  function init() {
    lastTime = performance.now();
    animate();
  }

  init();

  // 适配窗口变化
  window.addEventListener('resize', () => {
    // 重新获取尺寸
    // 实际中可优化，此处简洁
  });
</script>
</body>
</html>
