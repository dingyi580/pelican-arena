<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>自行车骑鹈鹕</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #87CEEB; /* Sky blue */
      position: relative;
    }
    #background {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .layer {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #87CEEB, #00008B);
      animation: moveBackground 20s linear infinite;
    }
    .layer2 {
      background: linear-gradient(to bottom, #ffffff, #e0e0e0);
      animation: moveBackground 10s linear infinite;
    }
    .layer3 {
      background: linear-gradient(to bottom, #ffffff, #f0f0f0);
      animation: moveBackground 5s linear infinite;
    }
    @keyframes moveBackground {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    #scene {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      z-index: 2;
      display: flex;
      gap: 10px;
    }
    #controls button, #controls input[type="range"] {
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }
    #controls input[type="range"] {
      flex: 1;
    }
    #pelican {
      animation: run 1s infinite linear;
    }
    @keyframes run {
      0% { transform: translateX(0); }
      100% { transform: translateX(-200px); }
    }
    #pelican .wing {
      animation: flap 0.5s infinite ease-in-out;
    }
    @keyframes flap {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    #pelican .pouch {
      animation: pouchMove 1s infinite ease-in-out;
    }
    @keyframes pouchMove {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    #bike {
      animation: bounce 1s infinite ease-in-out;
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      25% { transform: translateY(-5px); }
      50% { transform: translateY(0); }
      75% { transform: translateY(5px); }
      100% { transform: translateY(0); }
    }
    #bike .wheel {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #bike .crank {
      animation: crankMove 1s infinite ease-in-out;
    }
    @keyframes crankMove {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(30deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div id="background">
    <div class="layer"></div>
    <div class="layer2"></div>
    <div class="layer3"></div>
  </div>
  <svg id="scene" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Pelican -->
    <g id="pelican" transform="translate(400, 300)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="100" ry="60" fill="#fdd68a"/>
      <!-- Beak -->
      <polygon points="-80,-30 -120,-60 -40,-60" fill="#8b4513"/>
      <!-- Pouch -->
      <ellipse cx="0" cy="-40" rx="40" ry="30" fill="#ffd700" class="pouch"/>
      <!-- Wings -->
      <ellipse cx="-80" cy="40" rx="50" ry="30" fill="#fdd68a" class="wing"/>
      <ellipse cx="80" cy="40" rx="50" ry="30" fill="#fdd68a" class="wing"/>
      <!-- Tail feathers -->
      <line x1="-30" y1="100" x2="-50" y2="140" stroke="#8b4513" stroke-width="4"/>
      <line x1="30" y1="100" x2="50" y2="140" stroke="#8b4513" stroke-width="4"/>
      <!-- Webbed feet -->
      <circle cx="-40" cy="140" r="5" fill="#8b4513"/>
      <circle cx="0" cy="140" r="5" fill="#8b4513"/>
      <circle cx="40" cy="140" r="5" fill="#8b4513"/>
    </g>
    <!-- Bicycle -->
    <g id="bike" transform="translate(400, 250)">
      <!-- Front wheel -->
      <circle cx="150" cy="200" r="30" fill="#000" class="wheel"/>
      <!-- Back wheel -->
      <circle cx="250" cy="200" r="30" fill="#000" class="wheel"/>
      <!-- Frame -->
      <line x1="150" y1="200" x2="250" y2="200" stroke="#000" stroke-width="4"/>
      <!-- Handlebars -->
      <line x1="150" y1="200" x2="100" y2="160" stroke="#000" stroke-width="4"/>
      <!-- Seat -->
      <rect x="220" y="170" width="40" height="10" fill="#000"/>
      <!-- Crank -->
      <line x1="250" y1="200" x2="270" y2="180" stroke="#000" stroke-width="4" class="crank"/>
    </g>
  </svg>
  <div id="controls">
    <button id="bell">按车铃</button>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
    <button id="feed">投喂小鱼</button>
  </div>
  <script>
    const bellButton = document.getElementById('bell');
    const speedSlider = document.getElementById('speed');
    const feedButton = document.getElementById('feed');

    let speed = 1;
    let isAccelerating = false;

    // Bell sound
    bellButton.addEventListener('click', () => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A note
      oscillator.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.5);

      // Trigger pelican to accelerate
      isAccelerating = true;
      adjustPelicanSpeed();
    });

    // Speed control
    speedSlider.addEventListener('input', (e) => {
      speed = parseFloat(e.target.value);
      adjustPelicanSpeed();
    });

    // Feed button
    feedButton.addEventListener('click', () => {
      alert("小鱼被投喂！鹈鹕恢复体力！");
      // Reset pelican's animation speed
      isAccelerating = false;
      adjustPelicanSpeed();
    });

    function adjustPelicanSpeed() {
      const pelican = document.getElementById('pelican');
      const runAnimation = pelican.style.animation;
      if (runAnimation) {
        const parts = runAnimation.split(' ');
        const durationIndex = parts.findIndex(p => p.includes('s'));
        if (durationIndex !== -1) {
          const duration = parts[durationIndex];
          const newDuration = duration.replace(/\d+\.?\d*/, (match) => {
            return (parseFloat(match) / speed).toFixed(2);
          });
          const newAnimation = parts.map(p => {
            if (p === duration) return newDuration;
            return p;
          }).join(' ');
          pelican.style.animation = newAnimation;
        }
      }
    }
  </script>
</body>
</html>
