<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行车骑鹈鹕</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a1a2e; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #stage { position:absolute; inset:0; }
  #ui { position:absolute; left:0; right:0; bottom:0; padding:14px; pointer-events:none; display:flex; flex-direction:column; gap:10px; }
  .panel { pointer-events:auto; background:rgba(255,255,255,0.14); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.22); border-radius:18px; padding:12px 16px; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; justify-content:center; }
  button { background:rgba(255,255,255,0.22); border:none; border-radius:12px; padding:10px 14px; color:#fff; cursor:pointer; font-weight:700; font-size:14px; transition:transform .08s, background .18s; }
  button:hover { background:rgba(255,255,255,0.34); }
  button:active { transform:scale(.95); }
  button.active { background:#ff9f43; }
  input[type=range] { width:150px; accent-color:#ff9f43; }
  .bar-wrap { width:140px; height:10px; background:rgba(0,0,0,0.22); border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; width:100%; background:#5ee; transition:background .2s; }
  .title { font-size:18px; font-weight:900; letter-spacing:1px; text-shadow:0 2px 6px rgba(0,0,0,.35); }
  .hint { font-size:12px; opacity:.85; margin-top:2px; }
  .label { font-size:12px; font-weight:700; opacity:.9; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="ui">
  <div class="panel top">
    <div>
      <div class="title">自行车骑鹈鹕</div>
      <div class="hint">主谓关系确认：是自行车骑着鹈鹕，绝不是鹈鹕骑车！</div>
    </div>
    <div class="hint" style="text-align:right;">纯原生 HTML / CSS / Canvas<br>断网双击即可运行</div>
  </div>
  <div class="panel controls">
    <button id="btnBell">按车铃</button>
    <button id="btnSprint">冲刺</button>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="label">速度</span>
      <input id="speedRange" type="range" min="0" max="100" value="35">
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="label">鹈鹕体力</span>
      <div class="bar-wrap"><div id="staminaBar" class="bar-fill"></div></div>
    </div>
    <button id="btnFish">喂小鱼</button>
    <button id="btnDay">切换天色</button>
    <button id="btnRoad">切换路况</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let width, height, groundY, scale, pelicanX, pelicanY;

  const state = {
    speedBase: 35,
    speed: 0,
    sprint: false,
    stamina: 1,
    dayMode: 0,
    road: 0,
    bellTimer: 0,
    startleTimer: 0,
    runPhase: 0,
    wingPhase: 0,
    wheelRot: 0,
    pedalRot: 0,
    groundOffset: 0,
    bodyBob: 0,
    bikeBob: 0,
    bodyTilt: 0,
    beakOpen: 0,
    time: 0
  };

  let clouds = [];
  let particles = [];
  let fishes = [];
  let audioCtx = null;
  let lastTime = 0;

  const palettes = [
    { skyTop:'#4facfe', skyBottom:'#00f2fe', celestial:'#ffd700', sea:'#1e90ff', sand:'#f6d365', boardwalk:'#d4a373', cloud:'rgba(255,255,255,0.88)' },
    { skyTop:'#3a1c71', skyBottom:'#ff6b6b', celestial:'#ff9f43', sea:'#6a3093', sand:'#e6a968', boardwalk:'#b07d62', cloud:'rgba(255,220,200,0.72)' },
    { skyTop:'#0f172a', skyBottom:'#1e293b', celestial:'#f8fafc', sea:'#0c4a6e', sand:'#334155', boardwalk:'#475569', cloud:'rgba(200,220,255,0.48)' }
  ];

  const btnBell = document.getElementById('btnBell');
  const btnSprint = document.getElementById('btnSprint');
  const btnFish = document.getElementById('btnFish');
  const btnDay = document.getElementById('btnDay');
  const btnRoad = document.getElementById('btnRoad');
  const speedRange = document.getElementById('speedRange');
  const staminaBar = document.getElementById('staminaBar');

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    groundY = height * 0.72;
    scale = Math.min(width, height) * 0.00135;
    pelicanX = width * 0.28;
    pelicanY = groundY - 70 * scale;
    initClouds();
  }

  function initClouds(){
    clouds = [];
    const count = 8;
    for (let i=0;i<count;i++){
      clouds.push({
        x: Math.random()*width,
        y: 30 + Math.random()*height*0.32,
        scale: 0.6 + Math.random()*1.1,
        layer: Math.random()<0.5 ? 0.15 : 0.45,
        speed: 12 + Math.random()*22
      });
    }
  }

  function initAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function ringBell(){
    initAudio();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2240, t);
    osc.frequency.exponentialRampToValueAtTime(1760, t+0.55);
    gain.gain.setValueAtTime(0.28, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t+1.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+1.25);
    state.bellTimer = 1.0;
    state.startleTimer = 0.65;
    state.stamina = Math.max(0, state.stamina - 0.03);
    for (let i=0;i<6;i++) spawnFeather();
  }

  function feedFish(){
    initAudio();
    fishes.push({
      x: -60,
      y: groundY - 200 - Math.random()*60,
      vx: 620 + state.speed*0.4,
      vy: -170 - Math.random()*60,
      rot: -0.4,
      active: true
    });
  }

  function toggleSprint(){
    state.sprint = !state.sprint;
    btnSprint.classList.toggle('active', state.sprint);
  }

  function spawnFeather(){
    particles.push({
      type:'feather',
      x: pelicanX + (Math.random()*120-60)*scale,
      y: pelicanY + (Math.random()*70-90)*scale,
      vx: -40 - Math.random()*80,
      vy: 30 + Math.random()*40,
      rot: Math.random()*Math.PI,
      vRot: (Math.random()-0.5)*4,
      life: 1
    });
  }

  function spawnSweat(){
    particles.push({
      type:'sweat',
      x: pelicanX + (90 + Math.random()*10)*scale,
      y: pelicanY + (-160 + Math.random()*10)*scale,
      vx: -30 - Math.random()*30,
      vy: -50 - Math.random()*40,
      life: 1
    });
  }

  function spawnSplash(x,y){
    for (let i=0;i<8;i++){
      particles.push({
        type:'splash',
        x:x, y:y,
        vx:(Math.random()-0.5)*300,
        vy:(Math.random()-0.8)*300,
        life:1
      });
    }
  }

  function updateParticles(dt){
    for (let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt * 0.7;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.type==='feather'){
        p.rot += p.vRot * dt;
        p.vy += 10 * dt;
      } else if (p.type==='sweat'){
        p.vy += 90 * dt;
      } else if (p.type==='splash'){
        p.vy += 200 * dt;
      }
      if (p.life <= 0) particles.splice(i,1);
    }
  }

  function updateFish(dt){
    const mouthX = pelicanX + 250*scale;
    const mouthY = pelicanY + state.bodyBob - 150*scale;
    for (let i=fishes.length-1;i>=0;i--){
      const f = fishes[i];
      if (!f.active) { fishes.splice(i,1); continue; }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += 130 * dt;
      f.rot = Math.atan2(f.vy, f.vx);
      const dx = f.x - mouthX;
      const dy = f.y - mouthY;
      if (Math.hypot(dx,dy) < 55*scale){
        state.stamina = Math.min(1, state.stamina + 0.32);
        spawnSplash(f.x, f.y);
        fishes.splice(i,1);
      } else if (f.x > width + 80 || f.y > height + 80){
        fishes.splice(i,1);
      }
    }
  }

  function update(dt){
    state.time += dt;
    const roadBump = state.road===1 ? Math.sin(state.runPhase*5)*6 : 0;

    let target = (state.speedBase/100) * 620;
    if (state.sprint && state.stamina > 0.02) target *= 1.9;
    if (state.startleTimer > 0) target += 360;
    if (state.stamina < 0.18) target *= 0.55 + state.stamina*2.5;

    state.speed = lerp(state.speed, target, 0.1);

    let drain = (state.speed/620) * 0.06 * dt;
    if (state.sprint) drain += 0.18 * dt;
    state.stamina -= drain;
    if (state.speed < 60) state.stamina += 0.12 * dt;
    state.stamina = clamp(state.stamina, 0, 1);

    if (state.sprint && state.stamina <= 0.02){
      state.sprint = false;
      btnSprint.classList.remove('active');
    }

    if (state.bellTimer > 0) state.bellTimer -= dt;
    if (state.startleTimer > 0) state.startleTimer -= dt;

    const runFreq = state.speed * 0.012 + 2.2;
    state.runPhase += runFreq * dt;
    state.wingPhase += (state.speed * 0.009 + 3.2) * dt;
    state.wheelRot += state.speed * 0.009 * dt;
    state.pedalRot += state.speed * 0.013 * dt;
    state.groundOffset = (state.groundOffset + state.speed * dt) % 200;

    state.bodyBob = Math.sin(state.runPhase*2)*7 + roadBump;
    state.bikeBob = state.bodyBob*0.8 + Math.sin(state.runPhase*2 - 1.1)*4;
    state.bodyTilt = Math.sin(state.runPhase)*0.04 + (state.startleTimer>0 ? -0.07 : 0);
    state.beakOpen = clamp((state.stamina<0.35 ? (0.35-state.stamina)*2.2 : 0) + (state.startleTimer>0?0.45:0), 0, 1);

    clouds.forEach(c => {
      c.x -= (c.speed + state.speed * c.layer) * dt;
      if (c.x < -200) c.x = width + 120 + Math.random()*80;
    });

    updateFish(dt);
    updateParticles(dt);

    if (state.speed > 30 && Math.random() < state.speed * 0.0004) spawnFeather();
    if (state.stamina < 0.32 && Math.random() < 0.06) spawnSweat();
  }

  function drawClouds(){
    const pal = palettes[state.dayMode];
    ctx.fillStyle = pal.cloud;
    clouds.forEach(c => {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.scale, c.scale);
      ctx.beginPath();
      ctx.ellipse(0,0,32,18,0,0,Math.PI*2);
      ctx.ellipse(26,-6,26,16,0,0,Math.PI*2);
      ctx.ellipse(-26,-5,23,15,0,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawBackground(){
    const pal = palettes[state.dayMode];
    const grad = ctx.createLinearGradient(0,0,0,height);
    grad.addColorStop(0, pal.skyTop);
    grad.addColorStop(0.6, pal.skyBottom);
    grad.addColorStop(1, pal.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width,height);

    const cx = width*0.78, cy = height*(state.dayMode===2?0.14:0.18);
    ctx.fillStyle = pal.celestial;
    ctx.shadowColor = pal.celestial;
    ctx.shadowBlur = 45;
    ctx.beginPath();
    ctx.arc(cx, cy, state.dayMode===2?38:52, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    drawClouds();

    const horizon = height*0.58;
    ctx.fillStyle = pal.sea;
    ctx.fillRect(0, horizon, width, groundY-horizon);

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    for (let i=0;i<4;i++){
      const y = horizon + 12 + i*14;
      ctx.beginPath();
      for (let x=0;x<=width;x+=45){
        const wx = x - (state.groundOffset*(0.25 + i*0.08)) % 45;
        const wy = y + Math.sin((x + state.time*35 + i*60)*0.018)*4;
        if (x===0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();
    }

    ctx.fillStyle = pal.sand;
    ctx.fillRect(0, groundY, width, height-groundY);

    ctx.fillStyle = pal.boardwalk;
    ctx.fillRect(0, groundY-18, width, 18);
    ctx.strokeStyle = 'rgba(0,0,0,0.16)';
    ctx.lineWidth = 2;
    const plankW = 64;
    const off = -(state.groundOffset % plankW);
    for (let x=off;x<width;x+=plankW){
      ctx.beginPath();
      ctx.moveTo(x, groundY-18);
      ctx.lineTo(x, groundY);
      ctx.stroke();
    }
  }

  function drawGroundDetails(){
    if (state.road===0) return;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    const spacing = 90;
    const off = -(state.groundOffset % spacing);
    for (let x=off; x<width; x+=spacing){
      const seed = Math.floor((x + state.groundOffset)/spacing);
      const y = groundY + 14 + (seed%4)*13;
      const r = 3 + (seed%4);
      ctx.beginPath();
      ctx.arc(x + (seed*17)%spacing, y, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawBody(){
    const grad = ctx.createRadialGradient(-10,-20,10,0,0,130);
    grad.addColorStop(0,'#ffffff');
    grad.addColorStop(1,'#f0f0f0');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-120,10);
    ctx.quadraticCurveTo(-100,-72,0,-72);
    ctx.quadraticCurveTo(92,-66,102,-24);
    ctx.quadraticCurveTo(122,26,92,62);
    ctx.quadraticCurveTo(0,76,-120,40);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#dcdcdc';
    ctx.stroke();
  }

  function drawNeckHead(beakOpen){
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(70,-42);
    ctx.quadraticCurveTo(112,-94,82,-142);
    ctx.quadraticCurveTo(62,-172,88,-172);
    ctx.lineTo(96,-150);
    ctx.quadraticCurveTo(122,-102,96,-38);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(92,-168,32,21,0,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(104,-172,5,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(105,-174,1.6,0,Math.PI*2);
    ctx.fill();

    if (state.startleTimer > 0 || state.beakOpen > 0.1){
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(100,-182);
      ctx.lineTo(118,-178);
      ctx.stroke();
    }

    const open = state.beakOpen;
    const jawY = -145 + open*38;

    ctx.fillStyle = '#ff9f43';
    ctx.beginPath();
    ctx.moveTo(82,-156);
    ctx.quadraticCurveTo(165,-165,265,-150);
    ctx.lineTo(265,-138);
    ctx.quadraticCurveTo(165,-150,82,-144);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#d35400';
    ctx.lineWidth = 2;
    ctx.stroke();

    const pouch = ctx.createLinearGradient(95,-150,250,-75);
    pouch.addColorStop(0,'#ffd194');
    pouch.addColorStop(1,'#ff9f43');
    ctx.fillStyle = pouch;
    ctx.beginPath();
    ctx.moveTo(82,-144);
    ctx.quadraticCurveTo(175, -128 + open*12, 265, -144 + open*16);
    ctx.quadraticCurveTo(235, -48 - open*45, 102,-108);
    ctx.quadraticCurveTo(86,-120,82,-144);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.42)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(110,-112);
    ctx.quadraticCurveTo(180,-100,225,-122);
    ctx.stroke();
  }

  function drawLeg(phase, isNear){
    const hipX = 25, hipY = 46;
    const thighAngle = Math.sin(phase)*0.72;
    const kneeX = hipX + Math.sin(thighAngle)*36;
    const kneeY = hipY + Math.cos(thighAngle)*36;
    const shinAngle = thighAngle + 0.95 + Math.sin(phase+1.1)*0.52;
    const ankleX = kneeX + Math.sin(shinAngle)*42;
    const ankleY = kneeY + Math.cos(shinAngle)*42;
    ctx.strokeStyle = '#ff8c42';
    ctx.lineWidth = isNear ? 9 : 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(kneeX, kneeY);
    ctx.lineTo(ankleX, ankleY);
    ctx.stroke();

    ctx.fillStyle = '#ff8c42';
    ctx.beginPath();
    ctx.ellipse(ankleX+6, ankleY+4, 15, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawWing(phase, isNear){
    const angle = Math.sin(phase)*0.36 + 0.12;
    ctx.save();
    ctx.translate(-18, -24);
    ctx.rotate(angle);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-92,-52,-134,-22);
    ctx.quadraticCurveTo(-124,42,-52,32);
    ctx.quadraticCurveTo(-8,22,0,0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.moveTo(-128,-24);
    ctx.quadraticCurveTo(-138,-16,-122,6);
    ctx.lineTo(-108,-4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawWheel(x,y,rot){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(rot);
    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0,0,32,0,Math.PI*2);
    ctx.stroke();
    ctx.lineWidth = 2;
    for (let i=0;i<12;i++){
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.rotate(Math.PI/6);
      ctx.lineTo(28,0);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBike(bx,by,wheelRot,pedalRot){
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(0.55,0.55);

    drawWheel(-45,35,wheelRot);
    drawWheel(45,35,wheelRot);

    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-45,35); ctx.lineTo(0,35); ctx.lineTo(-15,-15); ctx.closePath();
    ctx.moveTo(0,35); ctx.lineTo(35,-5); ctx.lineTo(45,35);
    ctx.moveTo(-15,-15); ctx.lineTo(35,-5);
    ctx.stroke();

    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-15,-15); ctx.lineTo(-18,-32); ctx.stroke();
    ctx.fillStyle = '#2c3e50';
    ctx.beginPath(); ctx.ellipse(-18,-34,17,5,0,0,Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.moveTo(35,-5); ctx.lineTo(42,-24); ctx.stroke();
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(28,-24); ctx.lineTo(56,-24); ctx.stroke();

    const shake = state.bellTimer>0 ? Math.sin(state.time*45)*3 : 0;
    ctx.save();
    ctx.translate(52+shake, -26);
    ctx.rotate(shake*0.05);
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(-4,-10,8,4);
    ctx.restore();

    ctx.save();
    ctx.translate(0,35);
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    const px = Math.cos(pedalRot)*14, py = Math.sin(pedalRot)*14;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(px,py); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.fillRect(px-5,py-3,10,6);
    const px2 = Math.cos(pedalRot+Math.PI)*14, py2 = Math.sin(pedalRot+Math.PI)*14;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(px2,py2); ctx.stroke();
    ctx.fillRect(px2-5,py2-3,10,6);
    ctx.restore();

    ctx.strokeStyle = '#7f8c8d';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-45,35); ctx.lineTo(0,35); ctx.stroke();

    ctx.restore();
  }

  function drawReins(bikeBobScreen){
    const bx = 15 + 42*0.55;
    const by = -72 + bikeBobScreen/scale + (-24)*0.55;
    const collarX = 85, collarY = -96;
    ctx.strokeStyle = '#8d6e63';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(bx-5, by); ctx.quadraticCurveTo((bx+collarX)/2, by-28, collarX-6, collarY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx+5, by); ctx.quadraticCurveTo((bx+collarX)/2, by-28, collarX+6, collarY); ctx.stroke();

    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(collarX-12, collarY-3); ctx.lineTo(collarX+12, collarY+3); ctx.stroke();
  }

  function drawShadow(){
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(pelicanX + 18*scale, groundY+6, 105*scale, 11*scale, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawBellRings(){
    if (state.bellTimer <= 0) return;
    const life = state.bellTimer;
    const hx = pelicanX + (15 + 42*0.55)*scale;
    const hy = pelicanY + state.bodyBob + (-72*scale) + state.bikeBob + (-24)*0.55*scale;
    ctx.strokeStyle = `rgba(241,196,15,${life})`;
    ctx.lineWidth = 3;
    for (let i=1;i<=3;i++){
      const r = (1-life)*45*i + 12;
      ctx.beginPath();
      ctx.arc(hx, hy, r, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function drawPelicanAndBike(){
    ctx.save();
    ctx.translate(pelicanX, pelicanY + state.bodyBob);
    ctx.rotate(state.bodyTilt);
    ctx.scale(scale, scale);

    drawWing(state.wingPhase, false);
    drawLeg(state.runPhase + Math.PI, false);

    drawBody();
    drawNeckHead(state.beakOpen);

    drawReins(state.bikeBob);
    drawBike(15, -72 + state.bikeBob/scale, state.wheelRot, state.pedalRot);

    drawLeg(state.runPhase, true);
    drawWing(state.wingPhase + Math.PI*0.35, true);

    ctx.restore();
  }

  function drawFishList(){
    fishes.forEach(f => {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rot);
      ctx.fillStyle = '#5dade2';
      ctx.beginPath();
      ctx.ellipse(0,0,14,7,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#2e86ab';
      ctx.beginPath();
      ctx.moveTo(-12,-6);
      ctx.lineTo(-24,0);
      ctx.lineTo(-12,6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(6,-2,2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }

  function drawParticles(){
    particles.forEach(p => {
      const a = p.life;
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.type==='feather'){
        ctx.rotate(p.rot);
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath(); ctx.ellipse(0,0,9,4,0,0,Math.PI*2); ctx.fill();
      } else if (p.type==='sweat'){
        ctx.fillStyle = `rgba(135,206,250,${a})`;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(4,-6,0,-12); ctx.quadraticCurveTo(-4,-6,0,0); ctx.fill();
      } else if (p.type==='splash'){
        ctx.fillStyle = `rgba(255,200,100,${a})`;
        ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
  }

  function render(t){
    const dt = Math.min((t - lastTime)/1000, 0.06);
    lastTime = t;
    update(dt);

    ctx.clearRect(0,0,width,height);
    drawBackground();
    drawGroundDetails();
    drawShadow();
    drawFishList();
    drawParticles();
    drawPelicanAndBike();
    drawBellRings();

    staminaBar.style.width = (state.stamina*100) + '%';
    staminaBar.style.background = state.stamina>0.5 ? '#5ee' : (state.stamina>0.2 ? '#feca57' : '#ff6b6b');

    requestAnimationFrame(render);
  }

  btnBell.addEventListener('click', ringBell);
  btnSprint.addEventListener('click', toggleSprint);
  btnFish.addEventListener('click', feedFish);
  btnDay.addEventListener('click', () => { state.dayMode = (state.dayMode+1)%3; });
  btnRoad.addEventListener('click', () => { state.road = 1 - state.road; });
  speedRange.addEventListener('input', (e) => { state.speedBase = parseInt(e.target.value,10); });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
