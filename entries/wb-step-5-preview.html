<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>骑鹈鹕的自行车</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#aee3f5 0%, #e8f7ff 60%, #fff6d8 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  svg { width: 90vmin; max-width: 900px; height: auto; display: block; }

  /* 鹈鹕翅膀扑动 */
  .wing-top    { transform-origin: 150px 120px; animation: flapTop 1.2s ease-in-out infinite; }
  .wing-bottom { transform-origin: 150px 130px; animation: flapBottom 1.2s ease-in-out infinite; }
  @keyframes flapTop {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(22deg); }
  }
  @keyframes flapBottom {
    0%, 100% { transform: rotate(14deg); }
    50%      { transform: rotate(-18deg); }
  }

  /* 整只鹈鹕上下浮动 */
  #pelican { animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }

  /* 自行车前轮轻微转向 + 车轮转动 */
  .wheel { transform-origin: center; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 骑手蹬踏 */
  .pedal-crank { transform-origin: 95px 128px; animation: spin 1s linear infinite; }
  .leg        { transform-origin: 95px 108px; animation: pedal 1s ease-in-out infinite; }
  @keyframes pedal {
    0%, 100% { transform: rotate(10deg); }
    50%      { transform: rotate(-14deg); }
  }

  /* 背景云朵漂移 */
  .cloud { animation: drift 18s linear infinite; }
  .cloud2 { animation: drift 26s linear infinite; animation-delay: -8s; }
  @keyframes drift {
    from { transform: translateX(-15vw); }
    to   { transform: translateX(110vw); }
  }
</style>
</head>
<body>

<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空与太阳 -->
  <circle cx="340" cy="55" r="28" fill="#ffd94d">
    <animate attributeName="r" values="28;31;28" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云 -->
  <g class="cloud" fill="#ffffff" opacity="0.9">
    <ellipse cx="80" cy="60" rx="26" ry="14"/>
    <ellipse cx="100" cy="55" rx="20" ry="12"/>
    <ellipse cx="60" cy="55" rx="16" ry="10"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity="0.75">
    <ellipse cx="260" cy="40" rx="22" ry="12"/>
    <ellipse cx="278" cy="36" rx="16" ry="9"/>
  </g>

  <!-- 鹈鹕身体 -->
  <g id="pelican">
    <!-- 尾巴 -->
    <path d="M235 130 L268 118 L262 136 Z" fill="#f2c14e"/>
    <!-- 身体 -->
    <ellipse cx="195" cy="128" rx="52" ry="30" fill="#f7d774"/>
    <!-- 后翅（在身体后面） -->
    <path class="wing-bottom" d="M170 132 Q150 170 100 168 Q140 150 150 128 Z" fill="#e5b93f"/>
    <!-- 脖子 + 头 -->
    <path d="M150 112 Q132 84 138 62 Q142 46 158 46 Q174 46 176 62 Q178 84 162 112 Z" fill="#f7d774"/>
    <circle cx="158" cy="58" r="13" fill="#f7d774"/>
    <!-- 眼睛 -->
    <circle cx="153" cy="55" r="2.6" fill="#333"/>
    <!-- 喙（标志性大喙 + 喉囊） -->
    <path d="M146 60 Q118 62 104 74 Q118 82 146 74 Z" fill="#f0a132"/>
    <path d="M146 66 Q122 74 106 84 Q124 92 148 80 Z" fill="#e08b1e"/>
    <!-- 前翅（扑动） -->
    <path class="wing-top" d="M168 122 Q150 90 108 84 Q142 104 150 128 Z" fill="#f2c14e"/>
    <!-- 蹼足（垂在身体两侧） -->
    <path d="M182 154 l-6 14 M196 154 l0 14" stroke="#e08b1e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 自行车 + 骑手 -->
  <g>
    <!-- 车架 -->
    <path d="M95 128 L140 92 L160 128 M140 92 L172 92 L150 128" stroke="#d94f4f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="95" y1="128" x2="150" y2="128" stroke="#d94f4f" stroke-width="5" stroke-linecap="round"/>
    <!-- 车座 -->
    <line x1="140" y1="92" x2="140" y2="82" stroke="#555" stroke-width="4"/>
    <line x1="128" y1="82" x2="152" y2="82" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- 车把 -->
    <line x1="172" y1="92" x2="180" y2="78" stroke="#555" stroke-width="4"/>
    <line x1="168" y1="78" x2="192" y2="78" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- 后轮 -->
    <g class="wheel" style="transform-origin: 95px 128px">
      <circle cx="95" cy="128" r="26" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="95" cy="128" r="3" fill="#333"/>
      <line x1="95" y1="102" x2="95" y2="154" stroke="#999" stroke-width="2"/>
      <line x1="69" y1="128" x2="121" y2="128" stroke="#999" stroke-width="2"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel" style="transform-origin: 190px 128px">
      <circle cx="190" cy="128" r="26" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="190" cy="128" r="3" fill="#333"/>
      <line x1="190" y1="102" x2="190" y2="154" stroke="#999" stroke-width="2"/>
      <line x1="164" y1="128" x2="216" y2="128" stroke="#999" stroke-width="2"/>
    </g>

    <!-- 骑手 -->
    <g>
      <!-- 腿 -->
      <path class="leg" d="M140 108 L122 128" stroke="#3a6ea5" stroke-width="7" stroke-linecap="round"/>
      <!-- 身体 -->
      <path d="M138 82 Q150 88 152 100 L138 104 Z" fill="#3a6ea5"/>
      <!-- 手臂（扶把） -->
      <path d="M150 88 L180 78" stroke="#3a6ea5" stroke-width="6" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="140" cy="72" r="9" fill="#ffd9b3"/>
      <!-- 头盔 -->
      <path d="M131 72 Q140 58 149 72 Z" fill="#e74c3c"/>
      <!-- 曲柄 + 踏板 -->
      <g class="pedal-crank">
        <line x1="95" y1="128" x2="115" y2="128" stroke="#333" stroke-width="4"/>
        <rect x="112" y="125" width="10" height="6" fill="#222"/>
      </g>
    </g>
  </g>
</svg>

</body>
</html>
