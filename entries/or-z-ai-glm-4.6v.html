<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自行车骑鹈鹕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 50%, #B0E0E6 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #gameCanvas {
            border: 2px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: transparent;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            z-index: 100;
            min-width: 280px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-bell {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .speed-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }
        
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .speed-value {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            color: #666;
        }
        
        .status-value {
            font-weight: bold;
            color: #333;
        }
        
        .time-toggle {
            display: flex;
            gap: 10px;
        }
        
        .time-btn {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .time-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .fish-throw {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }
        
        .fish-btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 12px 25px;
            border-radius: 25px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .fish-btn:hover {
            transform: scale(1.05);
        }
        
        .fish-count {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="controls">
        <div class="control-group">
            <button class="btn btn-bell" id="bellBtn">🔔 按车铃</button>
            <button class="btn" id="resetBtn">🔄 重置</button>
        </div>
        
        <div class="control-group">
            <div class="control-label">速度控制</div>
            <div class="speed-control">
                <input type="range" class="speed-slider" id="speedSlider" min="1" max="10" value="5">
                <span class="speed-value" id="speedValue">5</span>
            </div>
        </div>
        
        <div class="control-group">
            <div class="control-label">时间切换</div>
            <div class="time-toggle">
                <button class="time-btn active" data-time="day">☀️ 白天</button>
                <button class="time-btn" data-time="dusk">🌆 黄昏</button>
                <button class="time-btn" data-time="night">🌙 夜晚</button>
            </div>
        </div>
        
        <div class="control-group">
            <div class="control-label">路况</div>
            <div class="time-toggle">
                <button class="time-btn active" data-road="smooth">🛣️ 平路</button>
                <button class="time-btn" data-road="bumpy">🪨 颠簸</button>
            </div>
        </div>
        
        <div class="status">
            <div class="status-item">
                <span class="status-label">鹈鹕状态:</span>
                <span class="status-value" id="pelicanStatus">正常</span>
            </div>
            <div class="status-item">
                <span class="status-label">体力值:</span>
                <span class="status-value" id="staminaValue">100%</span>
            </div>
            <div class="status-item">
                <span class="status-label">速度:</span>
                <span class="status-value" id="currentSpeed">5</span>
            </div>
        </div>
    </div>
    
    <div class="fish-throw">
        <button class="fish-btn" id="feedBtn">🐟 投喂小鱼</button>
        <span class="fish-count">小鱼: <span id="fishCount">3</span></span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置画布大小
        canvas.width = 1000;
        canvas.height = 600;
        
        // 游戏状态
        const gameState = {
            speed: 5,
            timeOfDay: 'day',
            roadType: 'smooth',
            stamina: 100,
            fishCount: 3,
            isRinging: false,
            isAccelerating: false,
            pelicanStatus: '正常'
        };
        
        // 背景层
        const backgrounds = {
            day: {
                sky: '#87CEEB',
                sea: '#98D8E8',
                horizon: '#B0E0E6'
            },
            dusk: {
                sky: '#FF6B6B',
                sea: '#FFB347',
                horizon: '#FF8C42'
            },
            night: {
                sky: '#1A1A2E',
                sea: '#16213E',
                horizon: '#0F3460'
            }
        };
        
        // 鹈鹕类
        class Pelican {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 150;
                this.width = 300;
                this.height = 150;
                this.wingAngle = 0;
                this.wingDirection = 1;
                this.wingSpeed = 0.1;
                this.pouchSwing = 0;
                this.pouchDirection = 1;
                this.speed = 0;
                this.targetSpeed = gameState.speed;
                this.isRunning = true;
                this.breathCount = 0;
                this.breathDirection = 1;
            }
            
            update() {
                // 更新速度
                if (gameState.isAccelerating) {
                    this.targetSpeed = Math.min(10, gameState.speed * 1.5);
                } else {
                    this.targetSpeed = gameState.speed;
                }
                
                this.speed += (this.targetSpeed - this.speed) * 0.1;
                
                // 移动鹈鹕
                this.x += this.speed;
                if (this.x > canvas.width + 200) {
                    this.x = -200;
                }
                
                // 翅膀动画
                this.wingAngle += this.wingSpeed * this.wingDirection;
                if (Math.abs(this.wingAngle) > 30) {
                    this.wingDirection *= -1;
                }
                
                // 喉囊摆动
                this.pouchSwing += 0.05 * this.pouchDirection;
                if (Math.abs(this.pouchSwing) > 10) {
                    this.pouchDirection *= -1;
                }
                
                // 呼吸动画
                this.breathCount += 0.05 * this.breathDirection;
                if (Math.abs(this.breathCount) > 5) {
                    this.breathDirection *= -1;
                }
                
                // 体力消耗
                if (this.speed > 5) {
                    gameState.stamina = Math.max(0, gameState.stamina - 0.05);
                } else {
                    gameState.stamina = Math.min(100, gameState.stamina + 0.02);
                }
                
                // 更新状态
                if (gameState.stamina < 30) {
                    gameState.pelicanStatus = '疲惫';
                } else if (gameState.stamina < 60) {
                    gameState.pelicanStatus = '疲劳';
                } else {
                    gameState.pelicanStatus = '正常';
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 身体
                ctx.fillStyle = '#F5DEB3';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 喉囊
                ctx.fillStyle = '#FFB6C1';
                ctx.beginPath();
                ctx.ellipse(30, 10 + this.pouchSwing, 40, 25, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // 喙
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(60, 0);
                ctx.lineTo(120, 5);
                ctx.stroke();
                
                // 眼睛
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(70, -10, 5, 0, Math.PI * 2);
                ctx.fill();
                
                // 翅膀
                ctx.fillStyle = '#DEB887';
                ctx.save();
                ctx.translate(-this.width/3, -this.height/4);
                ctx.rotate(this.wingAngle * Math.PI / 180);
                ctx.beginPath();
                ctx.ellipse(0, 0, 80, 40, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                ctx.save();
                ctx.translate(this.width/3, -this.height/4);
                ctx.rotate(-this.wingAngle * Math.PI / 180);
                ctx.beginPath();
                ctx.ellipse(0, 0, 80, 40, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                // 脚
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(-30, 30);
                ctx.lineTo(-40, 50);
                ctx.moveTo(30, 30);
                ctx.lineTo(40, 50);
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // 自行车类
        class Bicycle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 300;
                this.angle = 0;
                this.bounce = 0;
                this.bellRinging = false;
                this.bellAngle = 0;
            }
            
            update() {
                // 跟随鹈鹕
                this.x = pelican.x;
                
                // 颠簸效果
                if (gameState.roadType === 'bumpy') {
                    this.bounce = Math.sin(Date.now() * 0.01) * 10;
                } else {
                    this.bounce = Math.sin(Date.now() * 0.005) * 5;
                }
                
                // 车铃震动
                if (this.bellRinging) {
                    this.bellAngle = Math.sin(Date.now() * 0.3) * 5;
                } else {
                    this.bellAngle *= 0.9;
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y + this.bounce);
                
                // 车架
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-40, 0);
                ctx.lineTo(0, -30);
                ctx.lineTo(40, -30);
                ctx.lineTo(20, 0);
                ctx.stroke();
                
                // 前轮
                ctx.beginPath();
                ctx.arc(-30, 30, 25, 0, Math.PI * 2);
                ctx.stroke();
                
                // 后轮
                ctx.beginPath();
                ctx.arc(30, 30, 25, 0, Math.PI * 2);
                ctx.stroke();
                
                // 辐条
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(-30 + Math.cos(angle) * 25, 30 + Math.sin(angle) * 25);
                    ctx.lineTo(-30, 30);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(30 + Math.cos(angle) * 25, 30 + Math.sin(angle) * 25);
                    ctx.lineTo(30, 30);
                    ctx.stroke();
                }
                
                // 车把
                ctx.beginPath();
                ctx.moveTo(0, -30);
                ctx.lineTo(-20, -50);
                ctx.moveTo(0, -30);
                ctx.lineTo(20, -50);
                ctx.stroke();
                
                // 车座
                ctx.fillStyle = '#666';
                ctx.fillRect(-15, -35, 30, 5);
                
                // 脚踏
                ctx.beginPath();
                ctx.arc(30, 45, 8, 0, Math.PI * 2);
                ctx.stroke();
                
                // 车铃
                ctx.save();
                ctx.translate(20, -50);
                ctx.rotate(this.bellAngle * Math.PI / 180);
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                // 缰绳（连接到鹈鹕）
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(20, -50);
                ctx.quadraticCurveTo(this.x + 100, this.y - 50, pelican.x + 80, pelican.y - 50);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.restore();
            }
            
            ringBell() {
                this.bellRinging = true;
                gameState.isRinging = true;
                
                // Web Audio API 铃声
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
                
                // 鹈鹕受惊反应
                pelican.speed = 10;
                setTimeout(() => {
                    gameState.isRinging = false;
                    pelican.speed = gameState.speed;
                }, 1000);
            }
        }
        
        // 粒子类（羽毛、汗珠等）
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -Math.random() * 3 - 1;
                this.life = 1;
                this.decay = 0.02;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05;
                this.life -= this.decay;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                
                if (this.type === 'feather') {
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, 5, 10, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'sweat') {
                    ctx.fillStyle = '#87CEEB';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }
        
        // 云朵类
        class Cloud {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * 150 + 20;
                this.size = Math.random() * 30 + 20;
                this.speed = Math.random() * 0.5 + 0.2;
            }
            
            update() {
                this.x += this.speed;
                if (this.x > canvas.width + 100) {
                    this.x = -100;
                }
            }
            
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.arc(this.x + this.size * 0.5, this.y, this.size * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x - this.size * 0.5, this.y, this.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 初始化对象
        const pelican = new Pelican();
        const bicycle = new Bicycle();
        const particles = [];
        const clouds = [];
        
        // 创建云朵
        for (let i = 0; i < 5; i++) {
            clouds.push(new Cloud());
        }
        
        // 动画循环
        function animate() {
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            const bg = backgrounds[gameState.timeOfDay];
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, bg.sky);
            gradient.addColorStop(0.5, bg.sea);
            gradient.addColorStop(1, bg.horizon);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制云朵
            clouds.forEach(cloud => {
                cloud.update();
                cloud.draw();
            });
            
            // 绘制地面
            ctx.fillStyle = gameState.timeOfDay === 'night' ? '#2C3E50' : '#8FBC8F';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            // 绘制鹈鹕
            pelican.update();
            pelican.draw();
            
            // 绘制自行车
            bicycle.update();
            bicycle.draw();
            
            // 生成粒子
            if (Math.random() < 0.1 && gameState.speed > 3) {
                particles.push(new Particle(pelican.x + Math.random() * 100 - 50, pelican.y - 50, 'feather'));
            }
            
            if (gameState.speed > 7) {
                particles.push(new Particle(pelican.x + Math.random() * 100 - 50, pelican.y - 30, 'sweat'));
            }
            
            // 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // 更新UI
            updateUI();
            
            requestAnimationFrame(animate);
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('speedValue').textContent = gameState.speed;
            document.getElementById('currentSpeed').textContent = gameState.speed;
            document.getElementById('staminaValue').textContent = Math.round(gameState.stamina) + '%';
            document.getElementById('pelicanStatus').textContent = gameState.pelicanStatus;
            document.getElementById('fishCount').textContent = gameState.fishCount;
        }
        
        // 事件监听
        document.getElementById('bellBtn').addEventListener('click', () => {
            bicycle.ringBell();
        });
        
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            gameState.speed = parseInt(e.target.value);
        });
        
        document.getElementById('feedBtn').addEventListener('click', () => {
            if (gameState.fishCount > 0) {
                gameState.fishCount--;
                gameState.stamina = Math.min(100, gameState.stamina + 30);
                
                // 创建小鱼粒子效果
                for (let i = 0; i < 10; i++) {
                    particles.push(new Particle(pelican.x, pelican.y - 50, 'feather'));
                }
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            gameState.speed = 5;
            gameState.stamina = 100;
            gameState.fishCount = 3;
            gameState.isAccelerating = false;
            document.getElementById('speedSlider').value = 5;
        });
        
        // 时间切换
        document.querySelectorAll('.time-btn[data-time]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.time-btn[data-time]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameState.timeOfDay = e.target.dataset.time;
            });
        });
        
        // 路况切换
        document.querySelectorAll('.time-btn[data-road]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.time-btn[data-road]').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameState.roadType = e.target.dataset.road;
            });
        });
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                bicycle.ringBell();
            } else if (e.key === 'ArrowUp') {
                gameState.isAccelerating = true;
            } else if (e.key === 'ArrowDown') {
                gameState.isAccelerating = false;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                gameState.isAccelerating = false;
            }
        });
        
        // 启动动画
        animate();
    </script>
</body>
</html>
