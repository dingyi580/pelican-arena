<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自行车骑鹈鹕 · A Bicycle Riding a Pelican</title>
<style>
:root{
  --ink:#1f2d3d;--ink2:#56677d;--glass:rgba(255,255,255,.68);--brd:rgba(255,255,255,.82);
  --accent:#ff6b4a;--accent-d:#d94a2c;--sea:#1fa2c9;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:#8fd6ee;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;background:var(--glass);border:1px solid var(--brd);border-radius:20px;
  box-shadow:0 10px 30px rgba(18,52,84,.16),inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35)}
.hud-title{top:20px;left:20px;padding:14px 18px;max-width:min(350px,calc(100vw - 40px))}
.kicker{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--ink2)}
.kicker::before{content:"";width:20px;height:2px;border-radius:2px;background:var(--accent)}
h1{font-size:26px;line-height:1.15;margin-top:6px;font-weight:800;letter-spacing:.03em}
.sub{font-size:12px;margin-top:2px;letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.hint{margin-top:10px;font-size:11px;line-height:2;color:var(--ink2)}
kbd{display:inline-block;min-width:18px;padding:0 5px;border-radius:6px;border:1px solid rgba(31,45,61,.18);border-bottom-width:2px;background:#fff;font-family:inherit;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:var(--ink)}
.hud-stats{top:20px;right:20px;padding:14px 16px;width:262px}
.row{display:flex;align-items:center;gap:10px;font-size:12px}
.row+.row{margin-top:10px}
.lbl{width:28px;flex:none;font-weight:700;color:var(--ink)}
.meter{flex:1;height:8px;border-radius:99px;background:rgba(31,45,61,.1);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#27b98a,#a5dd52);transition:width .15s linear,background .4s}
.meter i.low{background:linear-gradient(90deg,#f0a23a,#f2634a)}
.meter i.spd{background:linear-gradient(90deg,#1fa2c9,#6fd0ee)}
.row b{width:36px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(31,162,201,.15);color:#136b8a;font-weight:700;font-size:12px;white-space:nowrap;transition:background .3s,color .3s}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
.chip.hot{background:rgba(255,107,74,.2);color:#c7431f}
.chip.warn{background:rgba(245,181,68,.26);color:#946100}
.chip.bad{background:rgba(239,90,90,.18);color:#b83232}
.chip.ok{background:rgba(47,191,143,.2);color:#157a55}
.dist{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{position:fixed;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  width:max-content;max-width:calc(100vw - 24px);padding:12px 14px;border-radius:24px;
  background:var(--glass);border:1px solid var(--brd);box-shadow:0 14px 40px rgba(18,52,84,.2),inset 0 1px 0 rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(18px) saturate(1.35);backdrop-filter:blur(18px) saturate(1.35)}
.btn{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--ink);height:44px;padding:0 14px 0 12px;border-radius:14px;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;background:#fff;
  box-shadow:0 2px 0 rgba(31,45,61,.13),0 8px 16px rgba(18,52,84,.1);transition:transform .14s ease,box-shadow .14s ease,background .25s,color .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(31,45,61,.13),0 12px 22px rgba(18,52,84,.14)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(31,45,61,.13),0 3px 8px rgba(18,52,84,.1)}
.btn svg,.seg svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn svg{width:20px;height:20px;flex:none}
.btn .key{font-size:10px;font-weight:700;opacity:.55;border:1.5px solid currentColor;border-radius:6px;padding:0 5px;line-height:15px}
.btn-bell{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d),0 12px 24px rgba(255,107,74,.38)}
.btn-bell:hover{box-shadow:0 6px 0 var(--accent-d),0 16px 28px rgba(255,107,74,.42)}
.btn-bell:active{box-shadow:0 1px 0 var(--accent-d),0 4px 10px rgba(255,107,74,.3)}
.btn-bell.ring{animation:ring .5s ease}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.06)}45%{transform:rotate(6deg) scale(1.04)}70%{transform:rotate(-3deg)}}
.btn.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0d1620,0 12px 24px rgba(31,45,61,.35)}
.btn-icon{width:44px;padding:0;justify-content:center}
.btn-icon.off{color:var(--ink2)}
.hide{display:none}
.div{width:1px;height:36px;background:rgba(31,45,61,.12)}
.grp{display:flex;flex-direction:column;gap:7px}
.grp>label{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink2)}
.grp>label b{color:var(--ink);font-variant-numeric:tabular-nums}
.range{width:150px;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;outline:0;cursor:pointer;background:linear-gradient(90deg,var(--sea) var(--p,33%),rgba(31,45,61,.14) var(--p,33%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2.5px solid var(--sea);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .15s}
.range::-webkit-slider-thumb:hover{transform:scale(1.15)}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--sea);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:13px;background:rgba(31,45,61,.08)}
.seg button{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:12px;font-weight:700;color:var(--ink2);height:34px;padding:0 9px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s,transform .15s}
.seg svg{width:15px;height:15px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(18,52,84,.16)}
.seg button:active{transform:scale(.96)}
@media (max-width:1180px){.bar{gap:8px;padding:10px;border-radius:20px;bottom:14px}.div{display:none}.btn .key{display:none}}
@media (max-width:900px){.hint{display:none}.hud-stats{width:224px}}
@media (max-width:620px){
  .hud-title{top:12px;left:12px;padding:10px 14px}
  h1{font-size:19px}.sub{display:none}
  .hud-stats{top:auto;bottom:138px;right:12px;width:176px;padding:10px 12px}
  .row+.row{margin-top:7px}.row-spd{display:none}
  .btn{height:40px;font-size:12px;padding:0 11px 0 9px}.btn-icon{width:40px}
  .range{width:118px}.seg button{padding:0 8px}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="hud hud-title">
  <div class="kicker">海滨公路 · 第 7 赛段</div>
  <h1>自行车骑鹈鹕</h1>
  <div class="sub">A Bicycle Riding a Pelican</div>
  <div class="hint"><kbd>B</kbd> 按车铃 · <kbd>Shift</kbd> 冲刺 · <kbd>F</kbd> 喂鱼 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换时段<br>点一下鹈鹕，听听它怎么吐槽</div>
</header>

<aside class="hud hud-stats">
  <div class="row"><span class="lbl">体力</span><div class="meter"><i id="mStam"></i></div><b id="vStam">100</b></div>
  <div class="row row-spd"><span class="lbl">时速</span><div class="meter"><i id="mSpd" class="spd"></i></div><b id="vSpd">0</b></div>
  <div class="row"><span class="chip" id="chip"><i class="dot"></i><span id="chipTxt">稳健小跑</span></span><span class="dist" id="dist">0.00 km</span></div>
</aside>

<nav class="bar">
  <button class="btn btn-bell" id="btnBell" title="按车铃（B / 空格）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17a6 6 0 0 1 12 0"/><path d="M3 17h18"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 11V3"/></svg>按车铃<span class="key">B</span></button>
  <button class="btn" id="btnSprint" title="冲刺（按住 Shift）" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2"/></svg>冲刺<span class="key">Shift</span></button>
  <button class="btn" id="btnFish" title="投喂小鱼恢复体力（F）">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12c3.5-5 8-7 12.5-5.5 2.8 1 4.7 3.4 5.5 5.5-.8 2.1-2.7 4.5-5.5 5.5C10.5 19 6 17 2.5 12z"/><path d="M20.5 12l2.5-4M20.5 12l2.5 4"/><circle cx="7.5" cy="11" r=".9" fill="currentColor" stroke="none"/></svg>投喂小鱼<span class="key">F</span></button>
  <span class="div"></span>
  <div class="grp"><label for="spd">速度 <b id="spdVal">1.00×</b></label><input class="range" id="spd" type="range" min="0.5" max="2" step="0.05" value="1"></div>
  <span class="div"></span>
  <div class="grp"><label>时段</label><div class="seg" id="segTime">
    <button data-v="day" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>晴天</button>
    <button data-v="dusk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17a5 5 0 0 0-10 0"/><path d="M2 17h20M3 21h18M12 8V3M4.2 10.2l1.4 1.4M18.4 11.6l1.4-1.4"/></svg>黄昏</button>
    <button data-v="night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>夜晚</button></div></div>
  <div class="grp"><label>路况</label><div class="seg" id="segRoad">
    <button data-v="wood" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M9 5v14M15 5v14"/></svg>木栈道</button>
    <button data-v="stone"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="9" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="11" cy="16" r="3"/><circle cx="19" cy="15" r="2"/></svg>石子路</button></div></div>
  <span class="div"></span>
  <button class="btn btn-icon" id="btnMute" title="声音开关（M）" aria-label="声音开关">
    <svg id="icoOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
    <svg id="icoOff" class="hide" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg></button>
</nav>

<script>
'use strict';
/* ================= 基础工具 ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const mod = (a, n) => ((a % n) + n) % n;
const smooth = t => t * t * (3 - 2 * t);
const $ = id => document.getElementById(id);
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

const canvas = $('stage'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 1, GY = 0, OX = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  S = clamp(Math.min(W / 1100, H / 760), 0.5, 1.3);
  GY = Math.round(H * 0.84); OX = Math.round(W / 2 - 60 * S);
}
window.addEventListener('resize', resize);
resize();

const rgba = (c, a) => a === undefined
  ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
  : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const dim = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const lit = c => dim(c, 1 - P.night * 0.62);          // 植物等固有色随夜色变暗
function rr(x, y, w, h, r) {                          // 圆角矩形路径
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const sp = () => ({ x: 0, v: 0 });

/* ================= 全局状态 ================= */
const state = {
  t: 0, v: 0, dist: 0, speedMul: 1, sprint: false, sprintK: 0, sprintHinted: false,
  stamina: 100, exhausted: false, boost: 0, time: 'day', road: 'wood', muted: false, fishCd: 0
};
let roadMix = 0;                                      // 0 = 木栈道，1 = 石子路
/* ================= 配色（随时段平滑过渡） ================= */
const PAL = {
  day: { skyTop: [64, 170, 232], skyMid: [146, 216, 242], skyHor: [214, 242, 246], seaFar: [34, 150, 198], seaNear: [104, 208, 226], foam: [255, 255, 255],
    sand: [240, 218, 170], sandDark: [216, 188, 136], hill: [132, 186, 150], cloud: [255, 255, 255], cloudShade: [196, 224, 240],
    wood: [204, 148, 98], woodDark: [160, 108, 68], woodLight: [232, 190, 142], stone: [186, 178, 166], stoneDark: [132, 124, 114],
    lamp: [255, 244, 214], sun: [255, 238, 160], sunX: 0.8, sunY: 0.17, sunR: 44, moon: 0, night: 0, grass: [92, 160, 104] },
  dusk: { skyTop: [84, 74, 148], skyMid: [226, 116, 112], skyHor: [255, 198, 124], seaFar: [78, 88, 152], seaNear: [228, 146, 128], foam: [255, 236, 214],
    sand: [228, 180, 142], sandDark: [198, 146, 112], hill: [96, 104, 128], cloud: [255, 210, 190], cloudShade: [176, 116, 150],
    wood: [176, 118, 88], woodDark: [132, 84, 62], woodLight: [212, 156, 116], stone: [172, 146, 132], stoneDark: [120, 98, 90],
    lamp: [255, 236, 190], sun: [255, 160, 84], sunX: 0.68, sunY: 0.5, sunR: 56, moon: 0, night: 0.4, grass: [104, 112, 96] },
  night: { skyTop: [9, 18, 48], skyMid: [26, 48, 104], skyHor: [66, 100, 158], seaFar: [22, 46, 96], seaNear: [44, 86, 142], foam: [190, 214, 240],
    sand: [104, 116, 146], sandDark: [82, 94, 124], hill: [44, 58, 92], cloud: [74, 94, 138], cloudShade: [40, 56, 96],
    wood: [112, 94, 100], woodDark: [78, 64, 74], woodLight: [140, 120, 122], stone: [112, 116, 130], stoneDark: [72, 76, 92],
    lamp: [255, 226, 150], sun: [242, 246, 255], sunX: 0.78, sunY: 0.18, sunR: 30, moon: 1, night: 1, grass: [52, 84, 72] }
};
const P = {};
let palA = PAL.day, palB = PAL.day, palT = 1;
function blendPal(dt) {
  palT = Math.min(1, palT + dt / 1.4);
  const t = smooth(palT);
  for (const k in palB) P[k] = typeof palB[k] === 'number' ? lerp(palA[k], palB[k], t) : mixc(palA[k], palB[k], t);
}
function setTime(name) {
  if (!PAL[name] || name === state.time) return;
  palA = Object.assign({}, P); palB = PAL[name]; palT = 0; state.time = name;
  say('bike', name === 'day' ? '太阳真舒服~' : name === 'dusk' ? '追着夕阳跑！' : '我开车灯啦', 1.5);
}

/* ================= Web Audio 纯合成音效 ================= */
let AC = null, master = null, noiseB = null;
function audio() {
  if (state.muted || (!AC && !gestureSeen)) return null;   // 音频上下文只在用户手势之后创建
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      AC = new Ctor();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    } catch (e) { AC = null; return null; }
  }
  if (AC.state === 'suspended') { const r = AC.resume(); if (r && r.catch) r.catch(function () {}); }
  return AC;
}
function noise(ac) {
  if (!noiseB) {
    noiseB = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseB.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseB;
}
function sfxBell() {                                  // 车铃：两声「叮铃」，非谐泛音叠加
  const ac = audio(); if (!ac) return;
  const strike = (t, vel) => {
    const base = 1240 + rand(-30, 30);
    [[1, 1, 1.1], [2.76, .36, .6], [5.4, .14, .35], [8.93, .06, .2]].forEach(p => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = base * p[0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p[1] * vel * 0.42, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + p[2] + 0.05);
    });
  };
  const t = ac.currentTime;
  strike(t, 1); strike(t + 0.135, 0.8);
}
function sfxWhoosh() {                               // 冲刺：带通噪声扫频
  const ac = audio(); if (!ac) return; const t = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.9;
  f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.35); f.frequency.exponentialRampToValueAtTime(600, t + 0.8);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.9);
}
function sfxGulp() {                                 // 吞鱼：下滑的正弦 + 三角波「咕噜」
  const ac = audio(); if (!ac) return; const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.22);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
  const o2 = ac.createOscillator(), g2 = ac.createGain();
  o2.type = 'triangle'; o2.frequency.setValueAtTime(190, t + 0.24); o2.frequency.exponentialRampToValueAtTime(88, t + 0.44);
  g2.gain.setValueAtTime(0.0001, t + 0.24); g2.gain.exponentialRampToValueAtTime(0.45, t + 0.27); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.48);
  o2.connect(g2); g2.connect(master); o2.start(t + 0.24); o2.stop(t + 0.5);

  const A = (5 + 13 * sk) * amp, rate = (st.v / 230) * TAU;
  p.jolt.v += (-p.jolt.x * 260 - p.jolt.v * 9) * dt; p.jolt.x += p.jolt.v * dt;
  p.lift = Math.abs(Math.sin(p.phase)) * A;
  const lv = (Math.sin(p.phase) >= 0 ? 1 : -1) * Math.cos(p.phase) * A * rate + p.jolt.v;
  const dV = lv - p.prevLiftV; p.prevLiftV = lv;
  p.pitch = 0.035 * Math.sin(p.phase * 2 + 0.8) * (0.4 + sk) + st.sprintK * 0.05 - st.boost * 0.06 + p.jolt.x * 0.002;
  const fol = (s, k, c, g) => { s.v += (-s.x * k - s.v * c) * dt + dV * g; s.x += s.v * dt; };
  fol(p.neck, 170, 9, 0.3); fol(p.pouchD, 230, 5.5, 0.55); fol(p.bike.y, 150, 7, 0.2);
  if (p.bike.y.x > 5) { p.bike.y.x = 5; p.bike.y.v *= 0.2; }             // 车身最多压进鞍垫一点点
  p.bike.x.v += (-p.bike.x.x * 140 - p.bike.x.v * 7) * dt - dv * 0.06; p.bike.x.x = clamp(p.bike.x.x + p.bike.x.v * dt, -6, 6);
  p.neckX.v += (-p.neckX.x * 120 - p.neckX.v * 7) * dt - dv * 0.3; p.neckX.x += p.neckX.v * dt;
  p.pouchS.v += (-p.pouchS.x * 150 - p.pouchS.v * 5) * dt - dv * 0.5; p.pouchS.x += p.pouchS.v * dt;
  if (p.hopY > 0 || p.hopV > 0) {                     // 受惊时的小跳
    p.hopV -= 1500 * dt; p.hopY += p.hopV * dt;
    if (p.hopY <= 0) { p.hopY = 0; p.hopV = 0; p.jolt.v += 120; }
  }

  /* ---- 自行车：车轮、牙盘、俯仰 ---- */
  p.bike.wheel += st.v * dt / 46; p.bike.wheelV = st.v / 46;
  p.bike.crank += ((st.v / 230) * TAU * 0.55 + st.sprintK * 4 + st.boost * 5) * dt;
  p.bike.shake = Math.max(0, p.bike.shake - dt * 1.5);
  const pt = -lv * 0.00035 + st.sprintK * 0.07 - st.boost * 0.05 + p.jolt.x * 0.004;
  p.bike.pitch += (pt - p.bike.pitch) * Math.min(1, dt * 9);

  /* ---- 翅膀、头、表情 ---- */
  p.flapBoost = Math.max(0, p.flapBoost - dt / 1.3);
  p.scared = Math.max(0, p.scared - dt); p.happy = Math.max(0, p.happy - dt); p.squawk = Math.max(0, p.squawk - dt);
  p.pouchFull = Math.max(0, p.pouchFull - dt / 16);
  p.flap += (1.4 + sk * 1.6 + st.sprintK * 5.5 + p.flapBoost * 9) * TAU * dt;
  const famp = 0.05 + sk * 0.1 + st.sprintK * 0.34 + p.flapBoost * 0.75;
  p.wingA = 0.05 + famp * Math.sin(p.flap);
  p.wingB = 0.1 + famp * 0.85 * Math.sin(p.flap + 0.9);
  p.head[0] = 184 + p.neckX.x + Math.sin(st.t * 0.8) * 2.5 - p.scared * 7 + st.sprintK * 9;
  p.head[1] = -322 + p.neck.x + Math.sin(st.t * 1.6) * 1.2 - p.scared * 5 + (st.exhausted ? 14 : 0) - p.happy * 2;
  const mt = fishes.length ? 1 : p.squawk > 0 ? 0.9 : st.exhausted ? 0.35 + 0.25 * Math.sin(st.t * 9) : 0;
  p.mouth += (mt - p.mouth) * Math.min(1, dt * (fishes.length ? 18 : 12));
  p.eye = p.scared > 0.05 ? 'scared' : st.exhausted ? (st.stamina < 14 ? 'dizzy' : 'tired')
    : p.happy > 0.3 ? 'happy' : st.sprintK > 0.5 ? 'focus' : st.stamina < 30 ? 'tired' : 'normal';
  p.blinkT -= dt;
  if (p.blinkT <= 0) { p.blinkT = rand(2.2, 5); p.blink = 0.16; }
  p.blink = Math.max(0, p.blink - dt);
  p.blinkA = p.blink > 0 ? Math.sin(Math.PI * clamp(p.blink / 0.16, 0, 1)) : 0;

  /* ---- 粒子发射 ---- */
  let q = bodyPt(p.head[0] - 2, p.head[1] - 26);
  const sweatRate = st.sprintK * 4 + (st.stamina < 35 ? 2.5 : 0) + st.boost * 5;
  if (Math.random() < sweatRate * dt)
    emit('sweat', q[0], q[1], 1, { a: -Math.PI / 2 - 0.5, spread: 0.5, v0: 90, v1: 190, g: 520, l0: 0.5, l1: 0.8, s0: 3, s1: 4.6 });
  if (Math.random() < (st.sprintK * 2.5 + st.boost * 2) * dt) {
    q = bodyPt(rand(-100, 70), rand(-268, -180));
    emit('feather', q[0], q[1], 1, { a: -Math.PI * 0.8, spread: 0.5, v0: 40, v1: 130, g: 70, drag: 0.96, l0: 1.6, l1: 2.8, s0: 7, s1: 11, vr: 4 });
  }
  if (st.exhausted && Math.random() < dt * 2.6) {
    q = bodyPt(p.head[0] + 186, p.head[1] + 44);
    emit('puff', q[0], q[1], 1, { a: -0.1, spread: 0.25, v0: 50, v1: 100, g: -30, drag: 0.93, l0: 0.5, l1: 0.8, s0: 5, s1: 9 });
  }
  updateParts(dt);
  hudTick = (hudTick + 1) % 4;
  if (hudTick === 0) syncHud();
}
/* ================= 交互 ================= */
const btnBell = $('btnBell'), btnSprint = $('btnSprint'), btnMute = $('btnMute');
const ui = { stam: $('mStam'), vStam: $('vStam'), spd: $('mSpd'), vSpd: $('vSpd'), chip: $('chip'), chipTxt: $('chipTxt'), dist: $('dist') };
let chipKey = '', keySprint = false, hudTick = 0, gestureSeen = false;
function syncHud() {
  const st = state;
  ui.stam.style.width = st.stamina.toFixed(1) + '%'; ui.vStam.textContent = Math.round(st.stamina);
  ui.stam.classList.toggle('low', st.stamina < 30);
  ui.spd.style.width = clamp(st.v / 700 * 100, 0, 100).toFixed(1) + '%'; ui.vSpd.textContent = Math.round(st.v * 0.06);
  ui.dist.textContent = (st.dist / 5200).toFixed(2) + ' km';
  let key = '', txt = '稳健小跑';
  if (st.exhausted) { key = 'bad'; txt = '筋疲力尽'; }
  else if (st.boost > 0.35) { key = 'warn'; txt = '受惊狂奔'; }
  else if (st.sprintK > 0.5) { key = 'hot'; txt = '火力全开'; }
  else if (st.stamina < 30) { key = 'warn'; txt = '气喘吁吁'; }
  else if (pose.pouchFull > 0.3) { key = 'ok'; txt = '酒足饭饱'; }
  else if (st.speedMul < 0.8) { key = 'ok'; txt = '悠闲散步'; }
  if (key !== chipKey) { chipKey = key; ui.chip.className = 'chip ' + key; }
  if (ui.chipTxt.textContent !== txt) ui.chipTxt.textContent = txt;
}
function syncSprint() {
  btnSprint.classList.toggle('on', state.sprint);
  btnSprint.setAttribute('aria-pressed', state.sprint ? 'true' : 'false');
}
function ringBell() {                                 // 按车铃：铃声 + 鹈鹕受惊加速
  const p = pose;
  sfxBell();
  p.bike.shake = 1; state.boost = 1; p.scared = 0.9; p.flapBoost = 1; p.squawk = 0.4;
  if (p.hopY <= 0) p.hopV = 170;
  state.stamina = Math.max(0, state.stamina - 4);
  const q = bodyPt(p.bell[0], p.bell[1]);
  emit('ring', q[0], q[1], 3, { v0: 0, v1: 0, j: 0, l0: 0.45, l1: 0.8, s0: 8, s1: 12 });
  emit('note', q[0], q[1], 3, { a: -1.4, spread: 0.6, v0: 50, v1: 110, g: -15, drag: 0.97, l0: 0.9, l1: 1.4, s0: 15, s1: 22, vr: 1.5 });
  emit('spark', q[0], q[1], 5, { v0: 60, v1: 150, drag: 0.9, l0: 0.25, l1: 0.45, s0: 3, s1: 5, vr: 6 });
  const b = bodyPt(rand(-40, 20), -270);
  emit('feather', b[0], b[1], 5, { a: -Math.PI * 0.75, spread: 0.7, v0: 80, v1: 190, g: 90, drag: 0.96, l0: 1.4, l1: 2.4, s0: 7, s1: 11, vr: 5 });
  sfxSquawk();
  say('bike', '叮铃铃～', 1.1); say('bird', '！', 0.8);
  btnBell.classList.remove('ring'); void btnBell.offsetWidth; btnBell.classList.add('ring');
}
function setSprint(on) {
  if (on && state.exhausted) {
    if (!state.sprintHinted) { say('bird', '没力气了…先喂条鱼？', 1.8); state.sprintHinted = true; }
    return;
  }
  if (on === state.sprint) return;
  state.sprint = on; syncSprint();
  if (on) { sfxWhoosh(); pose.squawk = 0.3; pose.flapBoost = Math.max(pose.flapBoost, 0.5); say('bike', '冲呀！', 1.1); }
}
function squawk() {                                   // 彩蛋：点一下鹈鹕，听它吐槽
  pose.squawk = 0.45; pose.scared = Math.max(pose.scared, 0.35); pose.neck.v -= 60;
  sfxSquawk(); say('bird', LINES[(Math.random() * LINES.length) | 0], 2.1);
}
function toggleMute() {
  state.muted = !state.muted;
  $('icoOn').classList.toggle('hide', state.muted); $('icoOff').classList.toggle('hide', !state.muted);
  btnMute.classList.toggle('off', state.muted);
  if (master) master.gain.value = state.muted ? 0 : 0.55;
  if (!state.muted) sfxBlip(660);
}
function setRoad(name) {
  state.road = name; sfxBlip(name === 'stone' ? 520 : 760);
  say('bike', name === 'stone' ? '颠得我铃铛直响' : '还是木板路舒服', 1.6);
}
function upBtn(el) { while (el && el.tagName !== 'BUTTON') el = el.parentNode; return el; }
function bindSeg(id, fn) {
  const seg = $(id);
  seg.addEventListener('click', e => {
    const b = upBtn(e.target);
    if (!b || b.classList.contains('on')) return;
    for (let i = 0; i < seg.children.length; i++) seg.children[i].classList.toggle('on', seg.children[i] === b);
    fn(b.getAttribute('data-v'));
  });
}
function selectSeg(id, v) {
  const seg = $(id);
  for (let i = 0; i < seg.children.length; i++) {
    const c = seg.children[i];
    if (c.getAttribute('data-v') === v && !c.classList.contains('on')) c.click();
  }
}
btnBell.addEventListener('click', ringBell);
btnSprint.addEventListener('click', () => setSprint(!state.sprint));
$('btnFish').addEventListener('click', () => feedFish(true));
btnMute.addEventListener('click', toggleMute);
bindSeg('segTime', setTime); bindSeg('segRoad', setRoad);

const spd = $('spd'), spdVal = $('spdVal');
function syncSpeed() {
  state.speedMul = parseFloat(spd.value) || 1;
  spdVal.textContent = state.speedMul.toFixed(2) + '×';
  spd.style.setProperty('--p', ((state.speedMul - 0.5) / 1.5 * 100).toFixed(1) + '%');
}
spd.addEventListener('input', syncSpeed); syncSpeed();

document.addEventListener('click', e => { const b = upBtn(e.target); if (b) b.blur(); });   // 避免空格键误触上次点过的按钮
const unlock = () => { gestureSeen = true; audio(); };
document.addEventListener('pointerdown', unlock);
document.addEventListener('keydown', unlock);
document.addEventListener('keydown', e => {
  if (e.repeat) { if (e.code === 'Space') e.preventDefault(); return; }
  switch (e.code) {
    case 'Space': case 'KeyB': e.preventDefault(); ringBell(); break;
    case 'KeyF': feedFish(true); break;
    case 'ShiftLeft': case 'ShiftRight': if (!keySprint) { keySprint = true; setSprint(true); } break;
    case 'Digit1': selectSeg('segTime', 'day'); break;
    case 'Digit2': selectSeg('segTime', 'dusk'); break;
    case 'Digit3': selectSeg('segTime', 'night'); break;
    case 'KeyM': toggleMute(); break;
  }
});
document.addEventListener('keyup', e => { if (e.key === 'Shift' && keySprint) { keySprint = false; setSprint(false); } });
window.addEventListener('blur', () => { if (keySprint) { keySprint = false; setSprint(false); } });
const onBird = e => {
  const lx = (e.clientX - OX) / S, ly = (e.clientY - GY) / S;
  return lx > -200 && lx < 400 && ly > -470 && ly < 20;
};
canvas.addEventListener('pointerdown', e => { if (onBird(e)) squawk(); });
canvas.addEventListener('pointermove', e => { canvas.style.cursor = onBird(e) ? 'pointer' : 'default'; });

/* ================= 渲染 ================= */
function draw(dt) {
  const t = state.t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t, dt); drawClouds(t); drawGulls(t); drawLighthouse(t); drawSea(t);
  drawBeach(); drawFoam(t); drawProps(t); drawRail();
  if (roadMix < 0.001) drawWood();                     // 两种路面按需绘制 / 交叉淡入淡出
  else if (roadMix > 0.999) drawStone();
  else if (roadMix <= 0.5) { drawStone(); ctx.globalAlpha = 1 - roadMix * 2; drawWood(); }
  else { drawWood(); ctx.globalAlpha = roadMix * 2 - 1; drawStone(); }
  ctx.globalAlpha = 1;
  drawShadow(); drawSpeedLines(dt);
  drawCharacter(dt);
  drawTufts(t); vignette();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt); draw(dt);
  requestAnimationFrame(frame);
}
syncHud();
setTimeout(() => say('bike', '驾～出发！', 1.8), 700);
requestAnimationFrame(frame);
</script>
